# LM Studio local model. Copy this file (drop the leading underscore), then:
#   1. In LM Studio: Developer tab -> Start Server (default port 1234)
#   2. Set `model` to the exact model identifier shown in LM Studio's server page
#      (or run:  curl http://localhost:1234/v1/models )
name: lmstudio-qwen3-8b          # your label — used in folders & reports
provider: openai                 # LM Studio speaks the OpenAI-compatible API
base_url: http://localhost:1234/v1
model: qwen/qwen3-8b
local: true                      # enables warm-up ping + cold-start metric
stream: true                     # streaming gives time-to-first-token
supports_tools: true             # set false for models that can't do tool calls (skips tier-2)
max_tokens: 4096
temperature: 0.2
pricing: { input_per_mtok: 0, output_per_mtok: 0 }   # local = free
enabled: true
context_length: 0            # local context window for lms load -c; 0 = model default (raise for long-context tasks)

# --- sampling (optional) ---------------------------------------------------
# Only what you set here is SENT. Anything omitted is left to the provider's own
# default, which is NOT uniform: llama.cpp behind LM Studio applies its own top-k
# and repeat penalty where a gateway usually disables them. So omitting a knob
# means "whatever this provider does", not a value the suite chose — the model
# page says so explicitly.
#
# temperature: 0.7            # null = do not send at all
# sampling: { top_p: 0.8, top_k: 20 }        # the base, used by any category
#                                            # with no matching profile below
#
# Creators publish sampling per USE CASE (Qwen: thinking vs non-thinking;
# DeepSeek: ~0.0 for code up to ~1.5 for creative). Declare those as profiles and
# the suite picks one per task category — see config.CATEGORY_SAMPLING_PROFILE:
#   coding    <- coding-python, one-shot-apps, agentic
#   reasoning <- reasoning, math
#   general   <- long-context, extraction, hallucination,
#                instruction-following, tool-use
# A profile OVERLAYS the base, so name only what differs.
#
# sampling_profiles:
#   coding:    { temperature: 0.0 }
#   reasoning: { temperature: 0.6, top_p: 0.95 }
#
# Where the numbers came from — shown on the model page. Without it the page
# states plainly that the values are house defaults, not a recommendation.
# sampling_source: https://huggingface.co/<org>/<model>#usage
