<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #121417;
    color: #e8e6e3;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
  }

  h1 {
    font-size: 52px;
    font-weight: 800;
    color: #edc22e;
    letter-spacing: 2px;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .score-box {
    background: #1e2126;
    border: 1px solid #2c3036;
    border-radius: 8px;
    padding: 8px 24px;
    text-align: center;
    min-width: 110px;
  }

  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a8f98;
  }

  #score {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
  }

  #reset {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #reset:hover { background: #9f8b77; }
  #reset:active { transform: translateY(1px); }

  #board {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    grid-template-rows: repeat(4, 100px);
    gap: 10px;
    background: #1e2126;
    border: 1px solid #2c3036;
    padding: 10px;
    border-radius: 12px;
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 36px;
    font-weight: 800;
    background: #2a2e34;
    color: #e8e6e3;
    user-select: none;
  }

  .hint {
    color: #8a8f98;
    font-size: 14px;
  }
</style>
</head>
<body>

  <h1>2048</h1>

  <div class="topbar">
    <div class="score-box">
      <div class="label">Score</div>
      <div id="score">0</div>
    </div>
    <button id="reset" type="button">New Game</button>
  </div>

  <div id="board"></div>

  <p class="hint">Use the arrow keys to slide and merge tiles.</p>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var grid = [];
  var scoreVal = 0;

  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var resetBtn = document.getElementById('reset');

  // Build the 16 cell elements (row-major order).
  var cells = [];
  for (var i = 0; i < SIZE * SIZE; i++) {
    var d = document.createElement('div');
    d.className = 'cell';
    boardEl.appendChild(d);
    cells.push(d);
  }

  var TILE_STYLES = {
    0:    ['#2a2e34', '#e8e6e3'],
    2:    ['#eee4da', '#776e65'],
    4:    ['#ede0c8', '#776e65'],
    8:    ['#f2b179', '#f9f6f2'],
    16:   ['#f59563', '#f9f6f2'],
    32:   ['#f67c5f', '#f9f6f2'],
    64:   ['#f65e3b', '#f9f6f2'],
    128:  ['#edcf72', '#f9f6f2'],
    256:  ['#edcc61', '#f9f6f2'],
    512:  ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2']
  };

  function styleFor(v) {
    return TILE_STYLES[v] || ['#3c3a32', '#f9f6f2'];
  }

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(0);
      g.push(row);
    }
    return g;
  }

  function spawn() {
    var empties = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return;
    var pick = empties[Math.floor(Math.random() * empties.length)];
    grid[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c];
        var el = cells[r * SIZE + c];
        el.textContent = v === 0 ? '' : String(v);
        var st = styleFor(v);
        el.style.background = st[0];
        el.style.color = st[1];
        el.style.fontSize = v >= 1024 ? '26px' : (v >= 128 ? '31px' : '36px');
      }
    }
    scoreEl.textContent = String(scoreVal);
  }

  function reset() {
    grid = emptyGrid();
    scoreVal = 0;
    spawn();
    spawn();
    render();
  }

  // Read one line of length SIZE in the order tiles travel for `dir`.
  function readLine(idx, dir) {
    var line = [];
    for (var k = 0; k < SIZE; k++) {
      if (dir === 'left') line.push(grid[idx][k]);
      else if (dir === 'right') line.push(grid[idx][SIZE - 1 - k]);
      else if (dir === 'up') line.push(grid[k][idx]);
      else line.push(grid[SIZE - 1 - k][idx]); // down
    }
    return line;
  }

  function writeLine(idx, dir, line) {
    for (var k = 0; k < SIZE; k++) {
      if (dir === 'left') grid[idx][k] = line[k];
      else if (dir === 'right') grid[idx][SIZE - 1 - k] = line[k];
      else if (dir === 'up') grid[k][idx] = line[k];
      else grid[SIZE - 1 - k][idx] = line[k]; // down
    }
  }

  // Slide toward index 0 and merge equal neighbours once each.
  function slideAndMerge(line) {
    var nums = [];
    for (var i = 0; i < line.length; i++) {
      if (line[i] !== 0) nums.push(line[i]);
    }
    var out = [];
    var gained = 0;
    for (var j = 0; j < nums.length; j++) {
      if (j + 1 < nums.length && nums[j] === nums[j + 1]) {
        var merged = nums[j] * 2;
        out.push(merged);
        gained += merged;
        j++; // the second tile is consumed; it cannot merge again this move
      } else {
        out.push(nums[j]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { line: out, gained: gained };
  }

  function linesEqual(a, b) {
    for (var i = 0; i < SIZE; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  function move(dir) {
    if (dir !== 'left' && dir !== 'right' && dir !== 'up' && dir !== 'down') {
      return false;
    }
    var changed = false;
    var totalGained = 0;
    for (var i = 0; i < SIZE; i++) {
      var before = readLine(i, dir);
      var res = slideAndMerge(before);
      if (!linesEqual(before, res.line)) changed = true;
      totalGained += res.gained;
      writeLine(i, dir, res.line);
    }
    if (changed) {
      scoreVal += totalGained;
      spawn();
      render();
    }
    return changed;
  }

  function board() {
    var copy = [];
    for (var r = 0; r < SIZE; r++) copy.push(grid[r].slice());
    return copy;
  }

  function setBoard(arr) {
    grid = emptyGrid();
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = arr && arr[r] ? arr[r][c] : 0;
        grid[r][c] = (typeof v === 'number' && isFinite(v)) ? v : 0;
      }
    }
    scoreVal = 0;
    render();
  }

  function score() {
    return scoreVal;
  }

  // Keyboard control.
  window.addEventListener('keydown', function (e) {
    var map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down'
    };
    var dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  resetBtn.addEventListener('click', reset);

  // Programmatic API for grading.
  window.game = {
    size: SIZE,
    reset: reset,
    move: move,
    board: board,
    setBoard: setBoard,
    score: score
  };

  // Start a fresh game on load.
  reset();
})();
</script>

</body>
</html>
