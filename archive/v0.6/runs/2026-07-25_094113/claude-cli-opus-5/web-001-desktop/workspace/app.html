<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubuntu Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    font-family: Ubuntu, "Segoe UI", Cantarell, "Helvetica Neue", Arial, sans-serif;
    color: #f2f1f0;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- desktop ---------- */
  #desktop {
    position: fixed;
    inset: 0;
    width: 100vw; height: 100vh;
    background:
      radial-gradient(1200px 700px at 18% 12%, #6a2b3f 0%, rgba(106,43,63,0) 60%),
      radial-gradient(900px 600px at 82% 88%, #7a3a1e 0%, rgba(122,58,30,0) 62%),
      linear-gradient(160deg, #2c001e 0%, #1f0b18 45%, #12090f 100%);
    overflow: hidden;
    user-select: none;
  }
  #desktop::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 28px;
    background: #1b1616;
    border-bottom: 1px solid #000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    font-size: 12.5px; color: #d8d3d0;
    z-index: 9000;
  }
  #topbar .tb-left { display: flex; gap: 14px; align-items: center; }
  #topbar .tb-right { display: flex; gap: 12px; align-items: center; }
  .tb-dot { width: 8px; height: 8px; border-radius: 50%; background: #e95420; display: inline-block; }

  /* ---------- taskbar / dock ---------- */
  #taskbar {
    position: absolute; top: 28px; left: 0; bottom: 0; width: 68px;
    background: rgba(20,14,18,.86);
    border-right: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 12px 0;
    z-index: 8000;
  }
  .launcher {
    width: 48px; height: 48px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px;
    background: linear-gradient(180deg, #4a3038, #33202a);
    color: #fff; font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .launcher:hover { transform: translateY(-2px); background: linear-gradient(180deg, #5d3a45, #3d2733); }
  .launcher:active { transform: translateY(0); }
  .launcher.running::before {
    content: ""; position: absolute; left: -7px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 22px; border-radius: 2px; background: #e95420;
  }
  .launcher .tip {
    position: absolute; left: 58px; top: 50%; transform: translateY(-50%);
    background: #000; color: #fff; font-size: 12px; padding: 4px 8px;
    border-radius: 5px; white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .12s ease; z-index: 20;
  }
  .launcher:hover .tip { opacity: .92; }
  #dock-spacer { flex: 1; }
  .dock-trash {
    width: 44px; height: 44px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; opacity: .55;
    border: 1px dashed rgba(255,255,255,.18);
  }

  /* ---------- windows ---------- */
  .window {
    position: absolute;
    min-width: 360px; min-height: 240px;
    width: 640px; height: 420px;
    background: #2b2626;
    border: 1px solid rgba(0,0,0,.75);
    border-radius: 10px;
    box-shadow: 0 22px 48px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.05) inset;
    display: flex; flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }
  .window[hidden] { display: none; }
  .titlebar {
    height: 38px; flex: 0 0 38px;
    background: linear-gradient(180deg, #3b3436, #2f2a2b);
    border-bottom: 1px solid #1a1616;
    display: flex; align-items: center; padding: 0 8px 0 12px;
    cursor: move;
  }
  .titlebar .title {
    flex: 1; font-size: 13.5px; font-weight: 600; color: #efeae8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .win-btns { display: flex; gap: 6px; align-items: center; }
  .win-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.4);
    background: #4b4243; color: #ddd;
    font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .win-btn:hover { background: #5c5152; }
  .win-close:hover { background: #e95420; color: #fff; border-color: #b93f14; }
  .win-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- files app ---------- */
  #files-window { left: 140px; top: 80px; width: 720px; height: 460px; }
  .files-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #332d2e;
    border-bottom: 1px solid #1c1818;
  }
  .tool-btn {
    background: #443c3d; color: #eee; border: 1px solid #262020;
    border-radius: 6px; padding: 5px 11px; font-size: 13px; cursor: pointer;
  }
  .tool-btn:hover { background: #544a4b; }
  .tool-btn:disabled { opacity: .4; cursor: default; }
  #files-path {
    flex: 1; background: #221d1e; border: 1px solid #171313;
    border-radius: 6px; padding: 6px 10px;
    font-family: "Ubuntu Mono", Consolas, monospace; font-size: 13px; color: #f8b58a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .files-main { flex: 1 1 auto; min-height: 0; display: flex; }
  .files-side {
    width: 168px; flex: 0 0 168px; background: #2a2425;
    border-right: 1px solid #1b1717; padding: 8px 6px; overflow: auto;
  }
  .side-head { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #9a8f8c; padding: 6px 8px; }
  .side-item {
    padding: 6px 9px; border-radius: 6px; font-size: 13px; color: #ddd6d3; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-item:hover { background: #3b3334; }
  #files-list {
    flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px;
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px;
  }
  .fs-item {
    width: 108px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    border-radius: 8px; cursor: default; text-align: center;
    font-size: 12.5px; color: #ece7e5; border: 1px solid transparent;
  }
  .fs-item:hover { background: #3a3233; }
  .fs-item.selected { background: #5a2f22; border-color: #e95420; }
  .fs-item .ico { font-size: 26px; line-height: 1; }
  .fs-item .nm { word-break: break-word; line-height: 1.25; }
  .files-status {
    flex: 0 0 26px; height: 26px; background: #262121; border-top: 1px solid #1a1616;
    display: flex; align-items: center; padding: 0 10px; font-size: 11.5px; color: #a99f9c;
  }
  .empty-note { color: #8d8280; font-size: 13px; padding: 14px; font-style: italic; }

  /* ---------- notepad app ---------- */
  #notepad-window { left: 420px; top: 150px; width: 620px; height: 440px; }
  #tabs {
    flex: 0 0 auto; display: flex; align-items: stretch; gap: 2px;
    background: #262121; border-bottom: 1px solid #171313;
    padding: 6px 6px 0 6px; overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    max-width: 190px; padding: 7px 8px 7px 12px;
    background: #342e2f; color: #cfc7c4;
    border: 1px solid #1d1919; border-bottom: none;
    border-radius: 7px 7px 0 0; font-size: 12.5px; cursor: pointer;
    white-space: nowrap; flex: 0 0 auto;
  }
  .tab:hover { background: #3e3637; }
  .tab.active { background: #221d1e; color: #fff; border-bottom: 1px solid #221d1e; }
  .tab .tab-name { overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .tab .tab-x {
    width: 17px; height: 17px; border-radius: 50%; border: none;
    background: transparent; color: #b6acaa; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .tab .tab-x:hover { background: #e95420; color: #fff; }
  #new-tab {
    flex: 0 0 auto; align-self: center; margin-left: 4px;
    width: 26px; height: 26px; border-radius: 6px;
    background: #3d3536; color: #eee; border: 1px solid #221d1e;
    font-size: 16px; line-height: 1; cursor: pointer; padding: 0;
  }
  #new-tab:hover { background: #e95420; border-color: #b93f14; }
  #editor {
    flex: 1 1 auto; min-height: 0; width: 100%;
    background: #221d1e; color: #f1ece9;
    border: none; outline: none; resize: none;
    padding: 14px 16px;
    font-family: "Ubuntu Mono", Consolas, monospace;
    font-size: 14px; line-height: 1.55;
  }
  .np-status {
    flex: 0 0 26px; height: 26px; background: #262121; border-top: 1px solid #171313;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; font-size: 11.5px; color: #a99f9c;
  }
</style>
</head>
<body>

<div id="desktop">

  <div id="topbar">
    <div class="tb-left"><span class="tb-dot"></span><span>Activities</span><span id="tb-app">Desktop</span></div>
    <div class="tb-right"><span id="tb-clock">--:--</span><span>⏻</span></div>
  </div>

  <div id="taskbar">
    <button id="open-files" class="launcher" type="button" title="Files">📁<span class="tip">Files</span></button>
    <button id="open-notepad" class="launcher" type="button" title="Notepad">📝<span class="tip">Notepad</span></button>
    <div id="dock-spacer"></div>
    <div class="dock-trash" title="Trash">🗑</div>
  </div>

  <!-- ================= FILES ================= -->
  <section id="files-window" class="window" hidden aria-label="Files">
    <header class="titlebar">
      <div class="title">Files</div>
      <div class="win-btns">
        <button class="win-btn win-min" type="button" title="Minimize">–</button>
        <button class="win-btn win-close" type="button" title="Close">✕</button>
      </div>
    </header>
    <div class="win-body">
      <div class="files-toolbar">
        <button id="files-up" class="tool-btn" type="button" title="Parent folder">↑ Up</button>
        <button id="files-home" class="tool-btn" type="button" title="Home">⌂ Home</button>
        <div id="files-path">/</div>
      </div>
      <div class="files-main">
        <aside class="files-side">
          <div class="side-head">Places</div>
          <div class="side-item" data-go="/">💽 Computer</div>
          <div class="side-item" data-go="/home/user">🏠 user</div>
          <div class="side-item" data-go="/home/user/Documents">📄 Documents</div>
          <div class="side-item" data-go="/home/user/Downloads">⬇ Downloads</div>
          <div class="side-item" data-go="/home/user/Pictures">🖼 Pictures</div>
          <div class="side-item" data-go="/etc">⚙ etc</div>
          <div class="side-item" data-go="/var/log">🧾 var/log</div>
        </aside>
        <div id="files-list"></div>
      </div>
      <div class="files-status" id="files-status">0 items</div>
    </div>
  </section>

  <!-- ================= NOTEPAD ================= -->
  <section id="notepad-window" class="window" hidden aria-label="Notepad">
    <header class="titlebar">
      <div class="title">Notepad</div>
      <div class="win-btns">
        <button class="win-btn win-min" type="button" title="Minimize">–</button>
        <button class="win-btn win-close" type="button" title="Close">✕</button>
      </div>
    </header>
    <div class="win-body">
      <div id="tabs"></div>
      <textarea id="editor" spellcheck="false" placeholder="Type here…"></textarea>
      <div class="np-status"><span id="np-info">—</span><span id="np-saved">saved</span></div>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  /* ============ generic window plumbing ============ */
  var zTop = 100;
  function focusWin(win) { zTop += 1; win.style.zIndex = String(zTop); }

  function openWin(win, launcher) {
    win.hidden = false;
    // guarantee a usable size even if something upstream squashed it
    if (win.offsetWidth < 360) win.style.width = "640px";
    if (win.offsetHeight < 240) win.style.height = "420px";
    focusWin(win);
    if (launcher) launcher.classList.add("running");
  }
  function closeWin(win, launcher) {
    win.hidden = true;
    win.style.display = "none";
    if (launcher) launcher.classList.remove("running");
  }
  function showWin(win) { win.style.display = ""; win.hidden = false; }

  function wireWindow(win, launcher) {
    win.addEventListener("mousedown", function () { focusWin(win); });

    var closeBtn = win.querySelector(".win-close");
    closeBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      closeWin(win, launcher);
    });

    var minBtn = win.querySelector(".win-min");
    if (minBtn) minBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      closeWin(win, launcher);
    });

    // dragging by titlebar
    var bar = win.querySelector(".titlebar");
    var drag = null;
    bar.addEventListener("mousedown", function (e) {
      if (e.target.closest(".win-btn")) return;
      focusWin(win);
      drag = { dx: e.clientX - win.offsetLeft, dy: e.clientY - win.offsetTop };
      e.preventDefault();
    });
    document.addEventListener("mousemove", function (e) {
      if (!drag) return;
      var x = e.clientX - drag.dx, y = e.clientY - drag.dy;
      var maxX = window.innerWidth - 60, maxY = window.innerHeight - 40;
      win.style.left = Math.max(-win.offsetWidth + 120, Math.min(x, maxX)) + "px";
      win.style.top  = Math.max(28, Math.min(y, maxY)) + "px";
    });
    document.addEventListener("mouseup", function () { drag = null; });
  }

  var filesWin   = document.getElementById("files-window");
  var notepadWin = document.getElementById("notepad-window");
  var btnFiles   = document.getElementById("open-files");
  var btnNotepad = document.getElementById("open-notepad");

  wireWindow(filesWin, btnFiles);
  wireWindow(notepadWin, btnNotepad);

  btnFiles.addEventListener("click", function () {
    showWin(filesWin);
    openWin(filesWin, btnFiles);
    render();
  });
  btnNotepad.addEventListener("click", function () {
    showWin(notepadWin);
    openWin(notepadWin, btnNotepad);
    loadNotes();
    renderTabs();
  });

  /* ============ clock ============ */
  var clock = document.getElementById("tb-clock");
  function tick() {
    var d = new Date();
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var h = String(d.getHours()).padStart(2, "0");
    var m = String(d.getMinutes()).padStart(2, "0");
    clock.textContent = days[d.getDay()] + " " + h + ":" + m;
  }
  tick(); setInterval(tick, 10000);

  /* ================= FILES APP ================= */
  // Static fake filesystem. dir => { name: null (file) | {…} (dir) }
  function f(size) { return { type: "file", size: size }; }

  var FS = {
    "bin": {
      "bash": f("1.2M"), "cat": f("35K"), "ls": f("142K"), "grep": f("218K"),
      "nano": f("267K"), "python3": f("5.9M"), "sh": f("128K")
    },
    "boot": { "grub": { "grub.cfg": f("8.4K") }, "vmlinuz-6.8.0-41-generic": f("14M") },
    "dev": { "null": f("0"), "random": f("0"), "sda1": f("0"), "tty0": f("0") },
    "etc": {
      "apt": { "sources.list": f("2.9K"), "trusted.gpg": f("12K") },
      "systemd": { "system.conf": f("1.8K"), "user.conf": f("1.1K") },
      "network": { "interfaces": f("412B") },
      "fstab": f("704B"), "hostname": f("11B"), "hosts": f("232B"),
      "os-release": f("386B"), "passwd": f("2.7K"), "shadow": f("1.4K")
    },
    "home": {
      "user": {
        "Documents": {
          "notes": { "todo.md": f("1.1K"), "ideas.md": f("640B") },
          "report.odt": f("48K"), "budget.ods": f("22K"), "resume.pdf": f("112K")
        },
        "Downloads": {
          "ubuntu-24.04.1-desktop-amd64.iso": f("5.7G"),
          "archive.tar.gz": f("18M"), "installer.deb": f("42M")
        },
        "Pictures": {
          "Screenshots": { "screenshot-2026-07-25.png": f("880K") },
          "wallpaper.png": f("2.4M"), "cat.jpg": f("640K")
        },
        "Music": { "track01.flac": f("31M") },
        "Videos": { "clip.mp4": f("88M") },
        "Desktop": { "shortcut.desktop": f("212B") },
        ".bashrc": f("3.7K"), ".profile": f("807B"), "hello.txt": f("54B")
      },
      "guest": { "README": f("96B") }
    },
    "lib": { "modules": { "6.8.0-41-generic": { "kernel": {} } }, "systemd": { "systemd": f("1.7M") } },
    "media": { "cdrom": {} },
    "mnt": { "backup": {} },
    "opt": { "google": { "chrome": { "chrome": f("210M") } } },
    "proc": { "cpuinfo": f("0"), "meminfo": f("0"), "uptime": f("0") },
    "root": { ".bashrc": f("3.1K") },
    "run": { "lock": {}, "user": { "1000": {} } },
    "sbin": { "fsck": f("88K"), "ifconfig": f("74K"), "reboot": f("28K") },
    "srv": { "www": { "index.html": f("1.9K") } },
    "sys": { "class": {}, "devices": {} },
    "tmp": { "session.lock": f("0"), "cache-98a1.tmp": f("1.2M") },
    "usr": {
      "bin": { "gcc": f("1.1M"), "git": f("3.2M"), "node": f("78M"), "vim": f("3.6M") },
      "lib": { "x86_64-linux-gnu": { "libc.so.6": f("2.0M") } },
      "local": { "bin": { "myscript.sh": f("512B") }, "share": {} },
      "share": { "applications": { "firefox.desktop": f("8.1K") }, "doc": {}, "icons": {} }
    },
    "var": {
      "cache": { "apt": { "archives": {} } },
      "lib": { "dpkg": { "status": f("2.8M") } },
      "log": { "syslog": f("4.2M"), "auth.log": f("612K"), "dmesg": f("128K"), "apt": { "history.log": f("94K") } },
      "tmp": {},
      "www": { "html": { "index.html": f("612B") } }
    }
  };

  function isDir(node) { return node && typeof node === "object" && node.type !== "file"; }

  function resolve(path) {
    if (path === "/" || path === "") return FS;
    var parts = path.split("/").filter(Boolean);
    var node = FS;
    for (var i = 0; i < parts.length; i++) {
      if (!isDir(node) || !Object.prototype.hasOwnProperty.call(node, parts[i])) return null;
      node = node[parts[i]];
    }
    return node;
  }

  var pathEl   = document.getElementById("files-path");
  var listEl   = document.getElementById("files-list");
  var statusEl = document.getElementById("files-status");
  var upBtn    = document.getElementById("files-up");
  var homeBtn  = document.getElementById("files-home");
  var cwd = "/";

  function join(base, name) { return base === "/" ? "/" + name : base + "/" + name; }
  function parentOf(p) {
    if (p === "/" ) return "/";
    var parts = p.split("/").filter(Boolean);
    parts.pop();
    return parts.length ? "/" + parts.join("/") : "/";
  }

  function iconFor(name, dir) {
    if (dir) return "📁";
    var n = name.toLowerCase();
    if (/\.(png|jpg|jpeg|gif|svg|webp)$/.test(n)) return "🖼";
    if (/\.(mp4|mkv|avi|webm)$/.test(n)) return "🎬";
    if (/\.(mp3|flac|ogg|wav)$/.test(n)) return "🎵";
    if (/\.(pdf|odt|doc|docx|md|txt|log|cfg|conf|list)$/.test(n)) return "📄";
    if (/\.(gz|zip|tar|xz|deb|iso)$/.test(n)) return "📦";
    if (/\.(sh|py|js)$/.test(n)) return "⚙";
    return "📃";
  }

  function navigate(path) {
    var node = resolve(path);
    if (!isDir(node)) return;
    cwd = path;
    render();
  }

  function render() {
    var node = resolve(cwd);
    if (!isDir(node)) { cwd = "/"; node = FS; }
    pathEl.textContent = cwd;
    pathEl.title = cwd;
    listEl.innerHTML = "";

    var names = Object.keys(node).sort(function (a, b) {
      var da = isDir(node[a]) ? 0 : 1, db = isDir(node[b]) ? 0 : 1;
      if (da !== db) return da - db;
      return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    if (!names.length) {
      var empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "This folder is empty.";
      listEl.appendChild(empty);
    }

    var dirs = 0, files = 0;
    names.forEach(function (name) {
      var child = node[name];
      var dir = isDir(child);
      dir ? dirs++ : files++;

      var el = document.createElement("div");
      el.className = "fs-item";
      el.setAttribute("data-name", name);
      el.setAttribute("data-type", dir ? "dir" : "file");
      el.title = join(cwd, name) + (dir ? "" : "  (" + child.size + ")");
      el.tabIndex = 0;

      var ico = document.createElement("div");
      ico.className = "ico";
      ico.textContent = iconFor(name, dir);
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = name;
      el.appendChild(ico);
      el.appendChild(nm);

      el.addEventListener("click", function () {
        Array.prototype.forEach.call(listEl.querySelectorAll(".fs-item.selected"),
          function (s) { s.classList.remove("selected"); });
        el.classList.add("selected");
        statusEl.textContent = name + (dir ? "  —  folder" : "  —  " + child.size);
      });
      el.addEventListener("dblclick", function () {
        if (dir) navigate(join(cwd, name));
        else statusEl.textContent = "No application available to open “" + name + "”";
      });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && dir) navigate(join(cwd, name));
      });

      listEl.appendChild(el);
    });

    statusEl.textContent = names.length + " item" + (names.length === 1 ? "" : "s") +
      "  (" + dirs + " folder" + (dirs === 1 ? "" : "s") + ", " + files + " file" + (files === 1 ? "" : "s") + ")";
    upBtn.disabled = (cwd === "/");
  }

  upBtn.addEventListener("click", function () { navigate(parentOf(cwd)); });
  homeBtn.addEventListener("click", function () { navigate("/home/user"); });
  Array.prototype.forEach.call(document.querySelectorAll(".side-item"), function (si) {
    si.addEventListener("click", function () { navigate(si.getAttribute("data-go")); });
  });

  render();

  /* ================= NOTEPAD APP ================= */
  var STORE_KEY = "ubuntu-desktop.notepad.v1";
  var tabsEl   = document.getElementById("tabs");
  var newTabEl = document.createElement("button");
  newTabEl.id = "new-tab";
  newTabEl.type = "button";
  newTabEl.title = "New tab";
  newTabEl.textContent = "+";

  var editor  = document.getElementById("editor");
  var npInfo  = document.getElementById("np-info");
  var npSaved = document.getElementById("np-saved");

  var state = { tabs: [], activeId: null, seq: 1 };

  function saveNotes() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    npSaved.textContent = "saved to localStorage";
  }

  function loadNotes() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tabs)) {
          state.tabs = parsed.tabs.filter(function (t) { return t && typeof t.id === "string"; })
            .map(function (t) {
              return { id: t.id, name: String(t.name || "Untitled"), content: String(t.content || "") };
            });
          state.seq = typeof parsed.seq === "number" ? parsed.seq : state.tabs.length + 1;
          state.activeId = parsed.activeId || null;
        }
      } catch (e) {}
    }
    if (!state.tabs.length) {
      state.tabs = [];
      addTab("Untitled 1", "", true);
    }
    if (!state.tabs.some(function (t) { return t.id === state.activeId; })) {
      state.activeId = state.tabs[0].id;
    }
  }

  function addTab(name, content, silent) {
    var id = "t" + state.seq + "-" + state.tabs.length;
    var tab = { id: id, name: name || ("Untitled " + state.seq), content: content || "" };
    state.seq += 1;
    state.tabs.push(tab);
    state.activeId = id;
    if (!silent) { saveNotes(); renderTabs(); editor.focus(); }
    return tab;
  }

  function activeTab() {
    for (var i = 0; i < state.tabs.length; i++) {
      if (state.tabs[i].id === state.activeId) return state.tabs[i];
    }
    return null;
  }

  function closeTab(id) {
    var idx = -1;
    for (var i = 0; i < state.tabs.length; i++) if (state.tabs[i].id === id) idx = i;
    if (idx < 0) return;
    state.tabs.splice(idx, 1);
    if (!state.tabs.length) {
      addTab("Untitled " + state.seq, "", true);
    } else if (state.activeId === id) {
      state.activeId = state.tabs[Math.max(0, idx - 1)].id;
    }
    saveNotes();
    renderTabs();
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    state.tabs.forEach(function (t) {
      var el = document.createElement("div");
      el.className = "tab" + (t.id === state.activeId ? " active" : "");
      el.setAttribute("data-id", t.id);
      el.title = t.name;

      var nameEl = document.createElement("span");
      nameEl.className = "tab-name";
      nameEl.textContent = t.name;

      var x = document.createElement("button");
      x.className = "tab-x";
      x.type = "button";
      x.title = "Close tab";
      x.textContent = "✕";
      x.addEventListener("click", function (e) { e.stopPropagation(); closeTab(t.id); });

      el.appendChild(nameEl);
      el.appendChild(x);
      el.addEventListener("click", function () {
        if (state.activeId === t.id) return;
        state.activeId = t.id;
        saveNotes();
        renderTabs();
        editor.focus();
      });
      tabsEl.appendChild(el);
    });
    tabsEl.appendChild(newTabEl);

    var t = activeTab();
    editor.value = t ? t.content : "";
    updateInfo();
  }

  function updateInfo() {
    var t = activeTab();
    if (!t) { npInfo.textContent = "—"; return; }
    var chars = t.content.length;
    var lines = t.content.length ? t.content.split("\n").length : 1;
    npInfo.textContent = t.name + "  •  " + lines + " line" + (lines === 1 ? "" : "s") +
      ", " + chars + " char" + (chars === 1 ? "" : "s");
  }

  newTabEl.addEventListener("click", function () {
    addTab("Untitled " + state.seq, "");
  });

  editor.addEventListener("input", function () {
    var t = activeTab();
    if (!t) return;
    t.content = editor.value;
    // first non-empty line (trimmed) becomes the tab label
    var first = (editor.value.split("\n")[0] || "").trim();
    if (first) t.name = first.length > 22 ? first.slice(0, 22) + "…" : first;
    var el = tabsEl.querySelector('.tab[data-id="' + t.id + '"] .tab-name');
    if (el) { el.textContent = t.name; el.parentElement.title = t.name; }
    npSaved.textContent = "unsaved…";
    updateInfo();
    saveNotes();
  });

  editor.addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + "  " + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      editor.dispatchEvent(new Event("input"));
    }
  });

  window.addEventListener("beforeunload", saveNotes);

  loadNotes();
  renderTabs();
})();
</script>
</body>
</html>
