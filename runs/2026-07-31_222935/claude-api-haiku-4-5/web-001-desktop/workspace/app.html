<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Environment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
        }

        #desktop {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            position: relative;
        }

        #taskbar {
            height: 48px;
            background: rgba(0, 0, 0, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            order: 2;
        }

        .launcher-button {
            height: 40px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .launcher-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .launcher-button:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .desktop-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            order: 1;
        }

        .window {
            position: absolute;
            background: #2d2d2d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            min-width: 360px;
            min-height: 240px;
        }

        .window.open {
            display: flex;
        }

        .window-titlebar {
            height: 40px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: move;
            border-radius: 8px 8px 0 0;
            user-select: none;
        }

        .window-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        .win-close {
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .win-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .window-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #files-window {
            width: 600px;
            height: 400px;
            left: 100px;
            top: 100px;
        }

        #notepad-window {
            width: 700px;
            height: 500px;
            right: 100px;
            top: 100px;
        }

        #files-path {
            color: #999;
            font-size: 13px;
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #files-up {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        #files-up:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #files-up:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .files-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .fs-item {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
            font-size: 13px;
        }

        .fs-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .fs-item.folder::before {
            content: "📁 ";
            margin-right: 4px;
        }

        .fs-item.file::before {
            content: "📄 ";
            margin-right: 4px;
        }

        #tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tab {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px 4px 0 0;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ccc;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .tab-close {
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .tab-close:hover {
            opacity: 1;
        }

        #new-tab {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            height: 28px;
            width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        #new-tab:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ccc;
        }

        #editor {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #ffffff;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
        }

        #editor:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .files-list::-webkit-scrollbar,
        #editor::-webkit-scrollbar {
            width: 8px;
        }

        .files-list::-webkit-scrollbar-track,
        #editor::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .files-list::-webkit-scrollbar-thumb,
        #editor::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .files-list::-webkit-scrollbar-thumb:hover,
        #editor::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="desktop">
        <div class="desktop-content">
            <!-- Files Window -->
            <div id="files-window" class="window">
                <div class="window-titlebar">
                    <div class="window-title">File Manager</div>
                    <button class="win-close">&times;</button>
                </div>
                <div class="window-content">
                    <div id="files-path">/</div>
                    <button id="files-up">← Up</button>
                    <div class="files-list" id="files-list"></div>
                </div>
            </div>

            <!-- Notepad Window -->
            <div id="notepad-window" class="window">
                <div class="window-titlebar">
                    <div class="window-title">Notepad</div>
                    <button class="win-close">&times;</button>
                </div>
                <div class="window-content">
                    <div style="display: flex; gap: 4px; margin-bottom: 12px; align-items: center;">
                        <div id="tabs"></div>
                        <button id="new-tab">+</button>
                    </div>
                    <textarea id="editor" placeholder="Type here..."></textarea>
                </div>
            </div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar">
            <button id="open-files" class="launcher-button">📁 Files</button>
            <button id="open-notepad" class="launcher-button">📝 Notepad</button>
        </div>
    </div>

    <script>
        // ===== File System Structure =====
        const filesystem = {
            '/': {
                type: 'folder',
                children: {
                    'bin': { type: 'folder', children: {} },
                    'etc': { type: 'folder', children: {} },
                    'home': { type: 'folder', children: {
                        'user': { type: 'folder', children: {
                            'Documents': { type: 'folder', children: {
                                'resume.txt': { type: 'file' },
                                'notes.txt': { type: 'file' }
                            }},
                            'Downloads': { type: 'folder', children: {
                                'image.png': { type: 'file' },
                                'archive.zip': { type: 'file' }
                            }},
                            'Pictures': { type: 'folder', children: {
                                'photo1.jpg': { type: 'file' },
                                'photo2.jpg': { type: 'file' }
                            }}
                        }}
                    }},
                    'usr': { type: 'folder', children: {} },
                    'var': { type: 'folder', children: {} }
                }
            }
        };

        // ===== Window Management =====
        const windows = {
            files: document.getElementById('files-window'),
            notepad: document.getElementById('notepad-window')
        };

        function openWindow(windowName) {
            windows[windowName].classList.add('open');
        }

        function closeWindow(windowName) {
            windows[windowName].classList.remove('open');
        }

        document.getElementById('open-files').addEventListener('click', () => openWindow('files'));
        document.getElementById('open-notepad').addEventListener('click', () => openWindow('notepad'));

        document.querySelectorAll('.win-close').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const window = e.target.closest('.window');
                if (window.id === 'files-window') closeWindow('files');
                else if (window.id === 'notepad-window') closeWindow('notepad');
            });
        });

        // ===== Window Dragging =====
        let draggedWindow = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        document.querySelectorAll('.window-titlebar').forEach(titlebar => {
            titlebar.addEventListener('mousedown', (e) => {
                draggedWindow = titlebar.closest('.window');
                const rect = draggedWindow.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (draggedWindow) {
                draggedWindow.style.left = (e.clientX - dragOffsetX) + 'px';
                draggedWindow.style.top = (e.clientY - dragOffsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            draggedWindow = null;
        });

        // ===== File Manager =====
        let currentPath = ['/'];

        function getPathString() {
            if (currentPath.length === 1) return '/';
            return '/' + currentPath.slice(1).join('/');
        }

        function getCurrentFolder() {
            let node = filesystem['/'];
            for (let i = 1; i < currentPath.length; i++) {
                node = node.children[currentPath[i]];
            }
            return node;
        }

        function refreshFilesList() {
            const pathStr = getPathString();
            document.getElementById('files-path').textContent = pathStr;

            const folder = getCurrentFolder();
            const filesList = document.getElementById('files-list');
            filesList.innerHTML = '';

            const entries = Object.entries(folder.children).sort((a, b) => {
                if (a[1].type !== b[1].type) return a[1].type === 'folder' ? -1 : 1;
                return a[0].localeCompare(b[0]);
            });

            entries.forEach(([name, item]) => {
                const div = document.createElement('div');
                div.className = `fs-item ${item.type}`;
                div.textContent = name;

                if (item.type === 'folder') {
                    div.addEventListener('dblclick', () => {
                        currentPath.push(name);
                        refreshFilesList();
                        updateUpButton();
                    });
                }

                filesList.appendChild(div);
            });

            updateUpButton();
        }

        function updateUpButton() {
            const upBtn = document.getElementById('files-up');
            upBtn.disabled = currentPath.length === 1;
        }

        document.getElementById('files-up').addEventListener('click', () => {
            if (currentPath.length > 1) {
                currentPath.pop();
                refreshFilesList();
            }
        });

        refreshFilesList();

        // ===== Notepad with Tabs & Persistent Storage =====
        class Notepad {
            constructor() {
                this.tabs = {};
                this.activeTab = null;
                this.nextId = 0;
                this.load();
                this.setupListeners();
                if (Object.keys(this.tabs).length === 0) {
                    this.createTab();
                }
            }

            createTab(content = '') {
                const id = 'tab-' + (this.nextId++);
                this.tabs[id] = {
                    title: 'Untitled ' + Object.keys(this.tabs).length,
                    content: content
                };
                this.setActive(id);
                this.render();
                this.save();
            }

            setActive(tabId) {
                if (this.activeTab) {
                    const activeTab = this.tabs[this.activeTab];
                    const textarea = document.getElementById('editor');
                    activeTab.content = textarea.value;
                }
                this.activeTab = tabId;
                const textarea = document.getElementById('editor');
                textarea.value = this.tabs[tabId].content;
                this.render();
            }

            closeTab(tabId) {
                delete this.tabs[tabId];
                if (this.activeTab === tabId) {
                    const remaining = Object.keys(this.tabs);
                    this.activeTab = remaining.length > 0 ? remaining[0] : null;
                    if (this.activeTab === null) {
                        this.createTab();
                    } else {
                        this.setActive(this.activeTab);
                    }
                }
                this.render();
                this.save();
            }

            render() {
                const tabsContainer = document.getElementById('tabs');
                tabsContainer.innerHTML = '';

                Object.entries(this.tabs).forEach(([id, tab]) => {
                    const tabEl = document.createElement('div');
                    tabEl.className = 'tab' + (id === this.activeTab ? ' active' : '');

                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = tab.title;

                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'tab-close';
                    closeBtn.textContent = '✕';
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.closeTab(id);
                    });

                    tabEl.appendChild(titleSpan);
                    tabEl.appendChild(closeBtn);
                    tabEl.addEventListener('click', () => this.setActive(id));

                    tabsContainer.appendChild(tabEl);
                });
            }

            setupListeners() {
                document.getElementById('new-tab').addEventListener('click', () => this.createTab());
                document.getElementById('editor').addEventListener('input', () => {
                    this.tabs[this.activeTab].content = document.getElementById('editor').value;
                    this.save();
                });
            }

            save() {
                localStorage.setItem('notepad-state', JSON.stringify({
                    tabs: this.tabs,
                    activeTab: this.activeTab,
                    nextId: this.nextId
                }));
            }

            load() {
                const saved = localStorage.getItem('notepad-state');
                if (saved) {
                    const state = JSON.parse(saved);
                    this.tabs = state.tabs;
                    this.activeTab = state.activeTab;
                    this.nextId = state.nextId;
                    this.render();
                    const textarea = document.getElementById('editor');
                    textarea.value = this.tabs[this.activeTab].content;
                }
            }
        }

        const notepad = new Notepad();
    </script>
</body>
</html>
