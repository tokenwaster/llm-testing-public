<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Physics Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        canvas#sim {
            display: block;
            width: 400px;
            height: 400px;
            background: #0d0d0d;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #2d2d2d;
            color: #fff;
            border: 2px solid #444;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #3a3a3a;
            border-color: #666;
            box-shadow: 0 0 10px rgba(100, 150, 255, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button#play {
            background: #1e5f3f;
            border-color: #2d9955;
        }

        button#play:hover {
            background: #2a7a50;
            border-color: #3db872;
        }

        button#drop {
            background: #4a3a6f;
            border-color: #6a5a9f;
        }

        button#drop:hover {
            background: #5a4a7f;
            border-color: #7a6aaf;
        }

        button#clear {
            background: #6f3a3a;
            border-color: #9f5a5a;
        }

        button#clear:hover {
            background: #7f4a4a;
            border-color: #af6a6a;
        }

        .info {
            font-size: 12px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bouncing Ball Physics</h1>
        <canvas id="sim" width="400" height="400"></canvas>
        <div class="controls">
            <button id="drop">Drop Ball</button>
            <button id="play">Play</button>
            <button id="clear">Clear</button>
        </div>
        <div class="info">
            <p>Click canvas to add balls • Gravity pulls them down • They bounce off edges</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        
        // Physics constants
        const GRAVITY = 0.5;
        const RESTITUTION = 0.85;
        const DEFAULT_RADIUS = 8;
        const MIN_VELOCITY = 0.01;

        // Simulation state
        let isRunning = false;
        let animationFrameId = null;
        let ballList = [];

        // Expose the API on window
        window.sim = {
            get w() {
                return canvas.width;
            },
            get h() {
                return canvas.height;
            },
            balls() {
                return ballList.map(b => ({
                    x: b.x,
                    y: b.y,
                    vx: b.vx,
                    vy: b.vy,
                    r: b.r
                }));
            },
            addBall(x, y, vx = 0, vy = 0, r = DEFAULT_RADIUS) {
                ballList.push({
                    x: Math.max(r, Math.min(x, canvas.width - r)),
                    y: Math.max(r, Math.min(y, canvas.height - r)),
                    vx: vx,
                    vy: vy,
                    r: r
                });
                draw();
            },
            clear() {
                ballList = [];
                draw();
            },
            step(dt = 1) {
                updatePhysics(dt);
                draw();
            }
        };

        function updatePhysics(dt) {
            for (let ball of ballList) {
                // Apply gravity
                ball.vy += GRAVITY * dt;

                // Update position
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                // Bounce off walls
                // Left and right
                if (ball.x - ball.r <= 0) {
                    ball.x = ball.r;
                    ball.vx = Math.abs(ball.vx) * RESTITUTION;
                }
                if (ball.x + ball.r >= canvas.width) {
                    ball.x = canvas.width - ball.r;
                    ball.vx = -Math.abs(ball.vx) * RESTITUTION;
                }

                // Top and bottom
                if (ball.y - ball.r <= 0) {
                    ball.y = ball.r;
                    ball.vy = Math.abs(ball.vy) * RESTITUTION;
                }
                if (ball.y + ball.r >= canvas.height) {
                    ball.y = canvas.height - ball.r;
                    ball.vy = -Math.abs(ball.vy) * RESTITUTION;
                }

                // Apply minimal velocity damping to prevent infinite oscillation
                if (Math.abs(ball.vx) < MIN_VELOCITY) {
                    ball.vx = 0;
                }
                if (Math.abs(ball.vy) < MIN_VELOCITY) {
                    ball.vy = 0;
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw balls
            for (let ball of ballList) {
                // Create gradient for shiny effect
                const gradient = ctx.createRadialGradient(
                    ball.x - ball.r / 3,
                    ball.y - ball.r / 3,
                    0,
                    ball.x,
                    ball.y,
                    ball.r
                );
                
                const hue = (Math.random() * 60 + 200) % 360;
                gradient.addColorStop(0, `hsl(${hue}, 100%, 60%)`);
                gradient.addColorStop(1, `hsl(${hue}, 100%, 35%)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fill();

                // Add highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(ball.x - ball.r / 3, ball.y - ball.r / 3, ball.r / 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            if (isRunning) {
                window.sim.step(1);
            }
            animationFrameId = requestAnimationFrame(animate);
        }

        // Event listeners
        document.getElementById('drop').addEventListener('click', () => {
            window.sim.addBall(
                Math.random() * (canvas.width - 40) + 20,
                20,
                (Math.random() - 0.5) * 4,
                0
            );
        });

        document.getElementById('play').addEventListener('click', (e) => {
            isRunning = !isRunning;
            e.target.textContent = isRunning ? 'Pause' : 'Play';
            e.target.style.background = isRunning ? '#1e8f4f' : '#1e5f3f';
        });

        document.getElementById('clear').addEventListener('click', () => {
            window.sim.clear();
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            window.sim.addBall(x, y, (Math.random() - 0.5) * 3, 0);
        });

        // Initial draw
        draw();
        animate();
    </script>
</body>
</html>
