<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 700;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            align-items: center;
        }

        .score-container {
            font-size: 24px;
            font-weight: 600;
        }

        .score-label {
            color: #999;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        #score {
            font-size: 36px;
            color: #4fc3f7;
            font-weight: 700;
        }

        #reset {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background-color: #4fc3f7;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s;
        }

        #reset:hover {
            background-color: #29b6f6;
        }

        #reset:active {
            background-color: #0288d1;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            width: 340px;
            height: 340px;
            margin: 0 auto;
        }

        .tile {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #3a3a3a;
            border-radius: 4px;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            transition: all 0.15s ease-in-out;
            min-height: 70px;
        }

        .tile.empty {
            background-color: #2a2a2a;
            color: transparent;
        }

        .tile[data-value="2"] {
            background-color: #3a3a3a;
            color: #e0e0e0;
        }

        .tile[data-value="4"] {
            background-color: #3a3a3a;
            color: #e0e0e0;
        }

        .tile[data-value="8"] {
            background-color: #ff6b6b;
            color: #ffffff;
        }

        .tile[data-value="16"] {
            background-color: #ff5252;
            color: #ffffff;
        }

        .tile[data-value="32"] {
            background-color: #ff4081;
            color: #ffffff;
        }

        .tile[data-value="64"] {
            background-color: #f50057;
            color: #ffffff;
        }

        .tile[data-value="128"] {
            background-color: #4fc3f7;
            color: #1a1a1a;
            font-size: 28px;
        }

        .tile[data-value="256"] {
            background-color: #29b6f6;
            color: #1a1a1a;
            font-size: 28px;
        }

        .tile[data-value="512"] {
            background-color: #0288d1;
            color: #ffffff;
            font-size: 28px;
        }

        .tile[data-value="1024"] {
            background-color: #01579b;
            color: #ffffff;
            font-size: 24px;
        }

        .tile[data-value="2048"] {
            background-color: #1a237e;
            color: #81d4fa;
            font-size: 24px;
        }

        .tile[data-value="4096"] {
            background-color: #0d1854;
            color: #b3e5fc;
            font-size: 24px;
        }

        .tile[data-value="8192"] {
            background-color: #0a0e27;
            color: #81d4fa;
            font-size: 20px;
        }

        .tile.new-tile {
            animation: pop 0.15s ease-in-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .instructions {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        .instructions p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="info-bar">
            <div class="score-container">
                <div class="score-label">Score</div>
                <div id="score">0</div>
            </div>
            <button id="reset">New Game</button>
        </div>
        <div id="board"></div>
        <div class="instructions">
            <p>Use arrow keys to move tiles</p>
            <p>Combine tiles to reach 2048!</p>
        </div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.size = 4;
                this._board = [];
                this._score = 0;
                this.init();
            }

            init() {
                this._board = Array(this.size * this.size).fill(0);
                this._score = 0;
                this.spawnTile();
                this.spawnTile();
                this.render();
            }

            reset() {
                this.init();
            }

            board() {
                return this._board.slice();
            }

            setBoard(arr) {
                this._board = arr.slice();
                this.render();
            }

            score() {
                return this._score;
            }

            spawnTile() {
                const empty = [];
                for (let i = 0; i < this._board.length; i++) {
                    if (this._board[i] === 0) {
                        empty.push(i);
                    }
                }

                if (empty.length === 0) return;

                const idx = empty[Math.floor(Math.random() * empty.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                this._board[idx] = value;

                // Mark as new for animation
                const tiles = document.querySelectorAll('.tile');
                if (tiles[idx]) {
                    tiles[idx].classList.add('new-tile');
                    setTimeout(() => tiles[idx].classList.remove('new-tile'), 150);
                }
            }

            move(direction) {
                const boardBefore = this._board.slice();
                const rows = this.size;
                const cols = this.size;

                if (direction === 'left') {
                    for (let r = 0; r < rows; r++) {
                        const row = [];
                        for (let c = 0; c < cols; c++) {
                            row.push(this._board[r * cols + c]);
                        }
                        const merged = this.mergeLine(row);
                        for (let c = 0; c < cols; c++) {
                            this._board[r * cols + c] = merged[c];
                        }
                    }
                } else if (direction === 'right') {
                    for (let r = 0; r < rows; r++) {
                        const row = [];
                        for (let c = 0; c < cols; c++) {
                            row.push(this._board[r * cols + c]);
                        }
                        const merged = this.mergeLine(row.reverse()).reverse();
                        for (let c = 0; c < cols; c++) {
                            this._board[r * cols + c] = merged[c];
                        }
                    }
                } else if (direction === 'up') {
                    for (let c = 0; c < cols; c++) {
                        const col = [];
                        for (let r = 0; r < rows; r++) {
                            col.push(this._board[r * cols + c]);
                        }
                        const merged = this.mergeLine(col);
                        for (let r = 0; r < rows; r++) {
                            this._board[r * cols + c] = merged[r];
                        }
                    }
                } else if (direction === 'down') {
                    for (let c = 0; c < cols; c++) {
                        const col = [];
                        for (let r = 0; r < rows; r++) {
                            col.push(this._board[r * cols + c]);
                        }
                        const merged = this.mergeLine(col.reverse()).reverse();
                        for (let r = 0; r < rows; r++) {
                            this._board[r * cols + c] = merged[r];
                        }
                    }
                }

                const changed = !this.arraysEqual(boardBefore, this._board);

                if (changed) {
                    this.spawnTile();
                    this.render();
                }

                return changed;
            }

            mergeLine(line) {
                // Remove zeros
                let nonZero = line.filter(x => x !== 0);

                // Merge adjacent equal values (left to right, each value merges at most once)
                const merged = [];
                const used = new Set();

                for (let i = 0; i < nonZero.length; i++) {
                    if (used.has(i)) continue;

                    let val = nonZero[i];

                    // Look for next non-merged value that equals this one
                    for (let j = i + 1; j < nonZero.length; j++) {
                        if (used.has(j)) continue;

                        if (nonZero[j] === val) {
                            val = val * 2;
                            this._score += val;
                            used.add(j);
                            break;
                        } else {
                            break;
                        }
                    }

                    merged.push(val);
                }

                // Pad with zeros to original size
                while (merged.length < line.length) {
                    merged.push(0);
                }

                return merged;
            }

            arraysEqual(a, b) {
                if (a.length !== b.length) return false;
                for (let i = 0; i < a.length; i++) {
                    if (a[i] !== b[i]) return false;
                }
                return true;
            }

            render() {
                const boardEl = document.getElementById('board');
                boardEl.innerHTML = '';

                for (let i = 0; i < this._board.length; i++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    const value = this._board[i];

                    if (value === 0) {
                        tile.classList.add('empty');
                    } else {
                        tile.setAttribute('data-value', value);
                        tile.textContent = value;
                    }

                    boardEl.appendChild(tile);
                }

                document.getElementById('score').textContent = this._score;
            }
        }

        // Global game instance
        const gameInstance = new Game2048();

        // Expose API
        window.game = {
            size: 4,
            reset: () => gameInstance.reset(),
            move: (direction) => gameInstance.move(direction),
            board: () => gameInstance.board(),
            setBoard: (arr) => gameInstance.setBoard(arr),
            score: () => gameInstance.score(),
        };

        // Reset button
        document.getElementById('reset').addEventListener('click', () => {
            gameInstance.reset();
        });

        // Arrow key controls
        document.addEventListener('keydown', (e) => {
            const dirMap = {
                'ArrowLeft': 'left',
                'ArrowRight': 'right',
                'ArrowUp': 'up',
                'ArrowDown': 'down',
            };

            const direction = dirMap[e.key];
            if (direction) {
                e.preventDefault();
                gameInstance.move(direction);
            }
        });
    </script>
</body>
</html>
