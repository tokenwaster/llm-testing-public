<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 0.25rem;
    color: #f0e6d3;
    letter-spacing: 0.1em;
  }
  .header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    margin-bottom: 1.5rem;
  }
  #score-box {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 0.5rem 1.5rem;
    text-align: center;
  }
  #score-box .label {
    font-size: 0.75rem;
    color: #8a8a9a;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #score {
    font-size: 1.8rem;
    font-weight: bold;
    color: #f0e6d3;
  }
  #reset {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  #reset:hover { background: #c73e54; }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 10px;
    background: #16213e;
    border-radius: 10px;
    border: 3px solid #0f3460;
  }
  .cell {
    width: 90px;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    border-radius: 6px;
    background: #1a1a2e;
    color: transparent;
    transition: none;
  }
  .cell.nonzero {
    color: #f0e6d3;
  }
  /* Tile colors */
  .tile-2   { background: #3b4a6b; }
  .tile-4   { background: #4a5a7b; }
  .tile-8   { background: #e94560; color: #fff !important; }
  .tile-16  { background: #d63a52; color: #fff !important; }
  .tile-32  { background: #c73e54; color: #fff !important; }
  .tile-64  { background: #f09819; color: #fff !important; }
  .tile-128 { background: #f5b041; font-size: 1.7rem; }
  .tile-256 { background: #f39c12; font-size: 1.7rem; }
  .tile-512 { background: #e67e22; font-size: 1.7rem; }
  .tile-1024{ background: #e84393; color: #fff !important; font-size: 1.4rem; }
  .tile-2048{ background: #fd79a8; color: #fff !important; font-size: 1.4rem; }
  .tile-super { background: #6c5ce7; color: #fff !important; font-size: 1.2rem; }
</style>
</head>
<body>

<h1>2048</h1>
<div class="header">
  <div id="score-box">
    <div class="label">Score</div>
    <div id="score">0</div>
  </div>
  <button id="reset">New Game</button>
</div>

<div id="board"></div>

<script>
(function() {
  const SIZE = 4;

  // Build the board DOM
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const resetBtn = document.getElementById('reset');

  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    boardEl.appendChild(cell);
  }
  const cells = boardEl.querySelectorAll('.cell');

  function render() {
    const b = game.board();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const idx = r * SIZE + c;
        const val = b[r][c];
        if (val === 0) {
          cells[idx].textContent = '';
          cells[idx].className = 'cell';
        } else {
          cells[idx].textContent = val;
          let cls = 'cell nonzero tile-' + val;
          if (val > 2048) cls = 'cell nonzero tile-super';
          cells[idx].className = cls;
        }
      }
    }
    scoreEl.textContent = game.score();
  }

  // Game state
  let board = [];
  let currentScore = 0;

  function deepCopy(b) {
    return b.map(row => [...row]);
  }

  function randomEmpty() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) empties.push({r, c});
    if (empties.length === 0) return null;
    const {r, c} = empties[Math.floor(Math.random() * empties.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function initGame() {
    board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    currentScore = 0;
    // Place exactly 2 tiles
    randomEmpty();
    randomEmpty();
    render();
  }

  function compactLine(line) {
    const filtered = line.filter(v => v !== 0);
    while (filtered.length < SIZE) filtered.push(0);
    return filtered;
  }

  function mergeLine(line) {
    let scoreAdd = 0;
    // Compact first
    let merged = compactLine(line);
    for (let i = 0; i < SIZE - 1; i++) {
      if (merged[i] !== 0 && merged[i] === merged[i + 1]) {
        merged[i] *= 2;
        scoreAdd += merged[i];
        merged[i + 1] = 0;
      }
    }
    merged = compactLine(merged);
    return {line: merged, score: scoreAdd};
  }

  function move(dir) {
    const oldBoard = deepCopy(board);

    if (dir === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const result = mergeLine(board[r]);
        board[r] = result.line;
        currentScore += result.score;
      }
    } else if (dir === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const reversed = [...board[r]].reverse();
        const result = mergeLine(reversed);
        board[r] = result.line.reverse();
        currentScore += result.score;
      }
    } else if (dir === 'up') {
      // Transpose, process as left, transpose back
      let transposed = [];
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
        transposed.push(col);
      }
      for (let i = 0; i < SIZE; i++) {
        const result = mergeLine(transposed[i]);
        transposed[i] = result.line;
        currentScore += result.score;
      }
      for (let c = 0; c < SIZE; c++)
        for (let r = 0; r < SIZE; r++)
          board[r][c] = transposed[c][r];
    } else if (dir === 'down') {
      let transposed = [];
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
        transposed.push(col);
      }
      for (let i = 0; i < SIZE; i++) {
        const reversed = [...transposed[i]].reverse();
        const result = mergeLine(reversed);
        transposed[i] = result.line.reverse();
        currentScore += result.score;
      }
      for (let c = 0; c < SIZE; c++)
        for (let r = 0; r < SIZE; r++)
          board[r][c] = transposed[c][r];
    }

    const changed = JSON.stringify(board) !== JSON.stringify(oldBoard);
    if (changed) {
      randomEmpty();
    }
    render();
    return changed;
  }

  // Public API
  window.game = {
    size: SIZE,

    reset: function() {
      initGame();
    },

    move: function(dir) {
      if (['left','right','up','down'].indexOf(dir) === -1) return false;
      return move(dir);
    },

    board: function() {
      return deepCopy(board);
    },

    setBoard: function(arr) {
      board = arr.map(row => [...row]);
      render();
      return true;
    },

    score: function() {
      return currentScore;
    }
  };

  // Keyboard controls
  document.addEventListener('keydown', function(e) {
    const map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down'
    };
    if (map[e.key]) {
      e.preventDefault();
      game.move(map[e.key]);
    }
  });

  // Reset button
  resetBtn.addEventListener('click', function() {
    initGame();
  });

  // Start
  initGame();
})();
</script>
</body>
</html>
