<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        #container {
            background: #1a1a2e;
            padding: 30px 40px 35px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #score {
            color: #b0d0ff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 16px;
            background: #0f0f1a;
            padding: 8px 28px;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
            text-shadow: 0 0 12px rgba(100, 180, 255, 0.15);
        }

        #snake {
            width: 400px;
            height: 400px;
            border-radius: 12px;
            box-shadow: 0 0 0 2px #2a2a4e, 0 8px 24px rgba(0, 0, 0, 0.6);
            background: #12121f;
            display: block;
            image-rendering: pixelated;
        }

        #controls {
            display: flex;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #controls button {
            background: #2a2a4e;
            border: none;
            color: #c8d8ff;
            font-size: 1rem;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #0f0f1a, inset 0 1px 0 rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
            min-width: 90px;
        }

        #controls button:hover {
            background: #3a3a5e;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0f0f1a, inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        #controls button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f0f1a;
        }

        #start {
            background: #1f6d3a;
            color: #b0ffc0;
        }
        #start:hover {
            background: #2a8a4a;
        }

        #pause {
            background: #6d5a1f;
            color: #ffe8a0;
        }
        #pause:hover {
            background: #8a742a;
        }

        #reset {
            background: #6d2a2a;
            color: #ffb0b0;
        }
        #reset:hover {
            background: #8a3a3a;
        }

        #controls button:disabled {
            opacity: 0.4;
            transform: none !important;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            #container {
                padding: 18px 16px 22px;
                border-radius: 14px;
            }
            #snake {
                width: 320px;
                height: 320px;
            }
            #score {
                font-size: 1.2rem;
                padding: 6px 20px;
            }
            #controls button {
                font-size: 0.85rem;
                padding: 8px 18px;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="score">Score: 0</div>
        <canvas id="snake" width="400" height="400"></canvas>
        <div id="controls">
            <button id="start">▶ Start</button>
            <button id="pause">⏸ Pause</button>
            <button id="reset">⟳ Reset</button>
        </div>
    </div>

    <script>
        (function() {
            // ─── Board constants ───────────────────────────────────────────
            const BOARD_W = 20;
            const BOARD_H = 20;
            const CELL_SIZE = 20; // 400 / 20

            // ─── DOM refs ──────────────────────────────────────────────────
            const canvas = document.getElementById('snake');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            const startBtn = document.getElementById('start');
            const pauseBtn = document.getElementById('pause');
            const resetBtn = document.getElementById('reset');

            // ─── Game state ────────────────────────────────────────────────
            let snakeBody = []; // [[x,y], ...] head first
            let foodPos = [0, 0];
            let direction = 'right';
            let queuedDir = 'right';
            let isAlive = true;
            let currentScore = 0;
            let intervalId = null;
            let running = false;

            // ─── Helpers ───────────────────────────────────────────────────
            function oppositeDir(dir) {
                const map = { up: 'down', down: 'up', left: 'right', right: 'left' };
                return map[dir] || dir;
            }

            function posKey(x, y) { return x + ',' + y; }

            function snakeSet() {
                const s = new Set();
                for (const p of snakeBody) s.add(posKey(p[0], p[1]));
                return s;
            }

            // ─── Food placement ────────────────────────────────────────────
            function placeRandomFood() {
                const occupied = snakeSet();
                const free = [];
                for (let x = 0; x < BOARD_W; x++) {
                    for (let y = 0; y < BOARD_H; y++) {
                        if (!occupied.has(posKey(x, y))) free.push([x, y]);
                    }
                }
                if (free.length === 0) return false; // board full — win condition
                foodPos = free[Math.floor(Math.random() * free.length)];
                return true;
            }

            // ─── Core game logic ──────────────────────────────────────────
            function resetState() {
                // Stop any running interval
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                running = false;
                startBtn.textContent = '▶ Start';

                // Snake: length 3, centered, moving right
                const cx = Math.floor(BOARD_W / 2);
                const cy = Math.floor(BOARD_H / 2);
                snakeBody = [
                    [cx, cy],
                    [cx - 1, cy],
                    [cx - 2, cy]
                ];
                direction = 'right';
                queuedDir = 'right';
                isAlive = true;
                currentScore = 0;
                scoreEl.textContent = 'Score: 0';
                placeRandomFood();
                draw();
            }

            function tick() {
                if (!isAlive) return;

                // Apply queued direction (reject 180° reversal)
                if (queuedDir !== oppositeDir(direction)) {
                    direction = queuedDir;
                }

                // Compute new head
                const head = snakeBody[0];
                let nx = head[0];
                let ny = head[1];
                switch (direction) {
                    case 'up':
                        ny--;
                        break;
                    case 'down':
                        ny++;
                        break;
                    case 'left':
                        nx--;
                        break;
                    case 'right':
                        nx++;
                        break;
                }

                // Wall collision
                if (nx < 0 || nx >= BOARD_W || ny < 0 || ny >= BOARD_H) {
                    isAlive = false;
                    draw();
                    stopAuto();
                    return;
                }

                // Check if food is eaten
                const eats = (nx === foodPos[0] && ny === foodPos[1]);

                // Self collision: check against body segments that will remain
                const bodyCheck = eats ? snakeBody : snakeBody.slice(0, -1);
                for (const seg of bodyCheck) {
                    if (nx === seg[0] && ny === seg[1]) {
                        isAlive = false;
                        draw();
                        stopAuto();
                        return;
                    }
                }

                // Move snake
                snakeBody.unshift([nx, ny]);

                if (eats) {
                    currentScore++;
                    scoreEl.textContent = 'Score: ' + currentScore;
                    // Grow: keep the tail, place new food
                    if (!placeRandomFood()) {
                        // Board full — player wins! treat as game over with win state.
                        isAlive = false;
                        draw();
                        stopAuto();
                        return;
                    }
                } else {
                    snakeBody.pop();
                }

                draw();
            }

            // ─── Auto-advance control ──────────────────────────────────────
            const TICK_MS = 140;

            function startAuto() {
                if (intervalId) clearInterval(intervalId);
                if (!isAlive) {
                    resetState();
                }
                intervalId = setInterval(tick, TICK_MS);
                running = true;
                startBtn.textContent = '▶ Running';
            }

            function stopAuto() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                running = false;
                startBtn.textContent = '▶ Start';
            }

            function togglePause() {
                if (!isAlive) return;
                if (running) {
                    stopAuto();
                    pauseBtn.textContent = '⏸ Paused';
                } else {
                    startAuto();
                    pauseBtn.textContent = '⏸ Pause';
                }
            }

            // ─── Drawing ───────────────────────────────────────────────────
            function draw() {
                ctx.fillStyle = '#12121f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid lines
                ctx.strokeStyle = '#1e1e3a';
                ctx.lineWidth = 0.6;
                for (let x = 0; x <= BOARD_W; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * CELL_SIZE, 0);
                    ctx.lineTo(x * CELL_SIZE, BOARD_H * CELL_SIZE);
                    ctx.stroke();
                }
                for (let y = 0; y <= BOARD_H; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * CELL_SIZE);
                    ctx.lineTo(BOARD_W * CELL_SIZE, y * CELL_SIZE);
                    ctx.stroke();
                }

                // Food — glowing berry
                const fx = foodPos[0] * CELL_SIZE + CELL_SIZE / 2;
                const fy = foodPos[1] * CELL_SIZE + CELL_SIZE / 2;
                const fr = CELL_SIZE / 2 - 2.5;
                // Glow
                const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 2.2);
                glow.addColorStop(0, 'rgba(255, 80, 80, 0.5)');
                glow.addColorStop(1, 'rgba(255, 80, 80, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(fx, fy, fr * 2.2, 0, Math.PI * 2);
                ctx.fill();
                // Berry
                ctx.fillStyle = '#ff3b3b';
                ctx.shadowColor = '#ff2020';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(fx, fy, fr, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(fx - 2.5, fy - 2.5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Snake body
                for (let i = 0; i < snakeBody.length; i++) {
                    const [sx, sy] = snakeBody[i];
                    const t = i / snakeBody.length;
                    const bright = 0.85 - t * 0.45;
                    const r = Math.floor(30 * (1 - t));
                    const g = Math.floor(180 + 60 * (1 - t));
                    const b = Math.floor(70 + 30 * (1 - t));
                    ctx.fillStyle = `rgb(${r}, ${Math.floor(g * bright)}, ${Math.floor(b * bright)})`;
                    const pad = i === 0 ? 1.5 : 2;
                    const rad = i === 0 ? 4 : 3;
                    const x = sx * CELL_SIZE + pad;
                    const y = sy * CELL_SIZE + pad;
                    const w = CELL_SIZE - pad * 2;
                    const h = CELL_SIZE - pad * 2;
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, rad);
                    ctx.fill();

                    // Head details
                    if (i === 0) {
                        // Eyes
                        ctx.fillStyle = '#f0f8ff';
                        const cx2 = sx * CELL_SIZE + CELL_SIZE / 2;
                        const cy2 = sy * CELL_SIZE + CELL_SIZE / 2;
                        const off = 4.5;
                        const es = 3.2;
                        let e1x, e1y, e2x, e2y;
                        switch (direction) {
                            case 'up':
                                e1x = cx2 - off;
                                e1y = cy2 - off;
                                e2x = cx2 + off;
                                e2y = cy2 - off;
                                break;
                            case 'down':
                                e1x = cx2 - off;
                                e1y = cy2 + off;
                                e2x = cx2 + off;
                                e2y = cy2 + off;
                                break;
                            case 'left':
                                e1x = cx2 - off;
                                e1y = cy2 - off;
                                e2x = cx2 - off;
                                e2y = cy2 + off;
                                break;
                            case 'right':
                                e1x = cx2 + off;
                                e1y = cy2 - off;
                                e2x = cx2 + off;
                                e2y = cy2 + off;
                                break;
                            default:
                                e1x = cx2 + off;
                                e1y = cy2 - off;
                                e2x = cx2 + off;
                                e2y = cy2 + off;
                        }
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        ctx.arc(e1x, e1y, es, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(e2x, e2y, es, 0, Math.PI * 2);
                        ctx.fill();
                        // Pupils
                        ctx.fillStyle = '#0a0a1a';
                        const pd = 1.2;
                        let pdx = 0,
                            pdy = 0;
                        switch (direction) {
                            case 'up':
                                pdy = -1.2;
                                break;
                            case 'down':
                                pdy = 1.2;
                                break;
                            case 'left':
                                pdx = -1.2;
                                break;
                            case 'right':
                                pdx = 1.2;
                                break;
                        }
                        ctx.beginPath();
                        ctx.arc(e1x + pdx, e1y + pdy, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(e2x + pdx, e2y + pdy, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Game over overlay
                if (!isAlive) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = 'bold 38px "Segoe UI", system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ff000060';
                    ctx.shadowBlur = 30;
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 6);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffb0b0';
                    ctx.font = '18px "Segoe UI", system-ui, sans-serif';
                    ctx.fillText('press Start or Reset', canvas.width / 2, canvas.height / 2 + 44);
                }
            }

            // roundRect polyfill for older browsers
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    return this;
                };
            }

            // ─── API ───────────────────────────────────────────────────────
            window.game = {
                get w() { return BOARD_W; },
                get h() { return BOARD_H; },

                reset: function() {
                    stopAuto();
                    resetState();
                    pauseBtn.textContent = '⏸ Pause';
                },

                tick: function() {
                    tick();
                },

                setDir: function(dir) {
                    const valid = ['up', 'down', 'left', 'right'];
                    if (valid.indexOf(dir) === -1) return;
                    queuedDir = dir;
                },

                setFood: function(x, y) {
                    if (x < 0 || x >= BOARD_W || y < 0 || y >= BOARD_H) return;
                    const occ = snakeSet();
                    if (occ.has(posKey(x, y))) return;
                    foodPos = [x, y];
                    draw();
                },

                snake: function() {
                    return snakeBody.map(p => [p[0], p[1]]);
                },

                food: function() {
                    return [foodPos[0], foodPos[1]];
                },

                alive: function() {
                    return isAlive;
                },

                score: function() {
                    return currentScore;
                }
            };

            // ─── UI event wiring ──────────────────────────────────────────
            startBtn.addEventListener('click', function() {
                if (!isAlive) {
                    resetState();
                }
                startAuto();
                pauseBtn.textContent = '⏸ Pause';
            });

            pauseBtn.addEventListener('click', function() {
                if (!isAlive) return;
                if (running) {
                    stopAuto();
                    pauseBtn.textContent = '⏸ Paused';
                } else {
                    startAuto();
                    pauseBtn.textContent = '⏸ Pause';
                }
            });

            resetBtn.addEventListener('click', function() {
                window.game.reset();
                draw();
            });

            // Arrow keys
            document.addEventListener('keydown', function(e) {
                const key = e.key;
                let dir = null;
                if (key === 'ArrowUp') { dir = 'up';
                    e.preventDefault(); } else if (key === 'ArrowDown') { dir = 'down';
                    e.preventDefault(); } else if (key === 'ArrowLeft') { dir = 'left';
                    e.preventDefault(); } else if (key === 'ArrowRight') { dir = 'right';
                    e.preventDefault(); }
                if (dir) {
                    window.game.setDir(dir);
                }
            });

            // ─── Initialize ───────────────────────────────────────────────
            resetState();
            draw();
        })();
    </script>
</body>
</html>
