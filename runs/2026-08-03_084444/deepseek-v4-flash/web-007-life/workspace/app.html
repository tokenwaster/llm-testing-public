<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #121220;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }
        #app {
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-weight: 400;
            font-size: 1.8rem;
            margin: 0 0 20px 0;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc66;
            letter-spacing: 2px;
        }
        #life {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 0 40px #00ffcc22, inset 0 0 40px #00000055;
            display: inline-block;
        }
        #gridCanvas {
            display: block;
            width: 600px;
            height: 600px;
            border-radius: 8px;
            cursor: crosshair;
            background: #16162a;
            touch-action: none;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #controls button {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: #1a1a2e;
        }
        #controls button:hover {
            background: #00ffcc;
            color: #121220;
            box-shadow: 0 0 20px #00ffcc88;
            transform: scale(1.05);
        }
        #controls button:active {
            transform: scale(0.95);
        }
        #controls #play {
            border-color: #ff00aa;
            color: #ff00aa;
        }
        #controls #play:hover {
            background: #ff00aa;
            color: #121220;
            box-shadow: 0 0 20px #ff00aa88;
        }
        #controls #random {
            border-color: #ffcc00;
            color: #ffcc00;
        }
        #controls #random:hover {
            background: #ffcc00;
            color: #121220;
            box-shadow: 0 0 20px #ffcc0088;
        }
        #controls #clear {
            border-color: #ff4444;
            color: #ff4444;
        }
        #controls #clear:hover {
            background: #ff4444;
            color: #121220;
            box-shadow: 0 0 20px #ff444488;
        }
        #stats {
            display: flex;
            gap: 20px;
            margin-left: 20px;
            font-size: 14px;
            color: #aaa;
            background: #1a1a2e;
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #333355;
        }
        #stats span {
            font-weight: 600;
        }
        #stats .value {
            color: #00ffcc;
            min-width: 40px;
            display: inline-block;
        }
        @media (max-width: 660px) {
            #gridCanvas {
                width: 90vw;
                height: 90vw;
            }
            #controls {
                gap: 8px;
            }
            #controls button {
                padding: 8px 14px;
                font-size: 13px;
            }
            #stats {
                margin-left: 0;
                margin-top: 10px;
                flex-basis: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>⚡ Game of Life</h1>
        <div id="life">
            <canvas id="gridCanvas" width="600" height="600"></canvas>
        </div>
        <div id="controls">
            <button id="step">⟳ Step</button>
            <button id="play">▶ Play</button>
            <button id="random">✦ Random</button>
            <button id="clear">✕ Clear</button>
            <div id="stats">
                <span>Alive: <span id="count" class="value">0</span></span>
                <span>Gen: <span id="gen" class="value">0</span></span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            // --- Grid Configuration ---
            const W = 80;
            const H = 80;
            let grid = new Uint8Array(W * H);
            let generation = 0;

            // --- DOM References ---
            const canvas = document.getElementById('gridCanvas');
            const ctx = canvas.getContext('2d');
            const countEl = document.getElementById('count');
            const genEl = document.getElementById('gen');
            const playBtn = document.getElementById('play');

            const cellSize = canvas.width / W; // 7.5

            // --- Drawing ---
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Grid lines
                ctx.strokeStyle = '#2a2a45';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= W; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * cellSize, 0);
                    ctx.lineTo(x * cellSize, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= H; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * cellSize);
                    ctx.lineTo(canvas.width, y * cellSize);
                    ctx.stroke();
                }

                // Living cells
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#00ffcc';
                for (let y = 0; y < H; y++) {
                    for (let x = 0; x < W; x++) {
                        if (grid[y * W + x]) {
                            ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                        }
                    }
                }
                ctx.shadowBlur = 0;

                // Update stats
                let alive = 0;
                for (let i = 0; i < grid.length; i++) alive += grid[i];
                countEl.textContent = alive;
                genEl.textContent = generation;
            }

            // --- Core Game Logic ---
            function countNeighbors(x, y) {
                let count = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                            count += grid[ny * W + nx];
                        }
                    }
                }
                return count;
            }

            function stepGen() {
                const nextGrid = new Uint8Array(W * H);
                for (let y = 0; y < H; y++) {
                    for (let x = 0; x < W; x++) {
                        const idx = y * W + x;
                        const alive = grid[idx];
                        const neighbors = countNeighbors(x, y);
                        if (alive) {
                            nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                        } else {
                            nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                        }
                    }
                }
                grid = nextGrid;
                generation++;
                return grid;
            }

            // --- API ---
            window.life = {
                w: W,
                h: H,
                get: (x, y) => {
                    if (x < 0 || x >= W || y < 0 || y >= H) return 0;
                    return grid[y * W + x];
                },
                set: (x, y, v) => {
                    if (x >= 0 && x < W && y >= 0 && y < H) {
                        grid[y * W + x] = v ? 1 : 0;
                        draw();
                    }
                },
                step: () => {
                    if (isPlaying) togglePlay();
                    stepGen();
                    draw();
                },
                clear: () => {
                    if (isPlaying) togglePlay();
                    grid.fill(0);
                    generation = 0;
                    draw();
                }
            };

            // --- Playback Control ---
            let isPlaying = false;
            let timer = null;

            function togglePlay() {
                if (isPlaying) {
                    clearInterval(timer);
                    timer = null;
                    isPlaying = false;
                    playBtn.textContent = '▶ Play';
                } else {
                    isPlaying = true;
                    timer = setInterval(() => {
                        stepGen();
                        draw();
                    }, 120);
                    playBtn.textContent = '⏸ Pause';
                }
            }

            // --- Button Handlers ---
            document.getElementById('step').addEventListener('click', () => {
                window.life.step();
            });

            document.getElementById('play').addEventListener('click', togglePlay);

            document.getElementById('random').addEventListener('click', () => {
                if (isPlaying) togglePlay();
                for (let i = 0; i < grid.length; i++) {
                    grid[i] = Math.random() < 0.3 ? 1 : 0;
                }
                generation = 0;
                draw();
            });

            document.getElementById('clear').addEventListener('click', () => {
                window.life.clear();
            });

            // --- Mouse Interaction (Click & Drag) ---
            let isDragging = false;
            let lastToggledKey = null;

            function getGridCoords(event) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = Math.floor((event.clientX - rect.left) * scaleX / cellSize);
                const y = Math.floor((event.clientY - rect.top) * scaleY / cellSize);
                return { x, y };
            }

            function handleCellToggle(event) {
                const { x, y } = getGridCoords(event);
                if (x >= 0 && x < W && y >= 0 && y < H) {
                    const key = `${x},${y}`;
                    if (lastToggledKey !== key) {
                        const idx = y * W + x;
                        grid[idx] = grid[idx] ? 0 : 1;
                        lastToggledKey = key;
                        draw();
                    }
                }
            }

            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastToggledKey = null;
                if (isPlaying) togglePlay();
                handleCellToggle(e);
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    handleCellToggle(e);
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                lastToggledKey = null;
            });

            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
                lastToggledKey = null;
            });

            // Prevent context menu on canvas
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // --- Initial Draw ---
            // Seed a nice starting pattern (a few gliders and a block)
            // Glider 1
            grid[1 * W + 2] = 1;
            grid[2 * W + 3] = 1;
            grid[3 * W + 1] = 1;
            grid[3 * W + 2] = 1;
            grid[3 * W + 3] = 1;
            // Glider 2 (pointing down-right)
            grid[10 * W + 10] = 1;
            grid[11 * W + 11] = 1;
            grid[12 * W + 9] = 1;
            grid[12 * W + 10] = 1;
            grid[12 * W + 11] = 1;
            // Block
            grid[5 * W + 5] = 1;
            grid[5 * W + 6] = 1;
            grid[6 * W + 5] = 1;
            grid[6 * W + 6] = 1;
            // Blinker
            grid[15 * W + 20] = 1;
            grid[15 * W + 21] = 1;
            grid[15 * W + 22] = 1;

            draw();
        })();
    </script>
</body>
</html>
