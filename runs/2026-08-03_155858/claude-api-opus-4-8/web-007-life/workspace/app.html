<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  :root {
    --bg: #0d0d15;
    --panel: #16161f;
    --accent: #00e6c3;
    --accent2: #ff4d8d;
    --text: #e0e0ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1a1a2e, var(--bg));
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #life {
    background: #05050a;
    border: 2px solid #262636;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(0,230,195,0.15);
    cursor: crosshair;
    touch-action: none;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #303044;
    padding: 10px 20px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0); }
  #play.active {
    background: var(--accent);
    color: #05050a;
    border-color: var(--accent);
  }
  .info { font-size: 0.85rem; opacity: 0.6; }
</style>
</head>
<body>
  <h1>✦ GAME OF LIFE ✦</h1>
  <canvas id="life" width="500" height="500"></canvas>
  <div class="controls">
    <button id="step">Step ▷</button>
    <button id="play">Play ▶</button>
    <button id="random">Random ⚄</button>
    <button id="clear">Clear ✕</button>
  </div>
  <div class="info">Click or drag on the grid to toggle cells.</div>

<script>
(function () {
  const W = 50, H = 50;
  const canvas = document.getElementById('life');
  const ctx = canvas.getContext('2d');
  const cw = canvas.width / W;
  const ch = canvas.height / H;

  let grid = new Uint8Array(W * H);

  function idx(x, y) { return y * W + x; }

  function get(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return 0;
    return grid[idx(x, y)];
  }
  function set(x, y, v) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    grid[idx(x, y)] = v ? 1 : 0;
    draw();
  }

  function step() {
    const next = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            n += get(x + dx, y + dy);
          }
        }
        const alive = grid[idx(x, y)];
        if (alive) {
          next[idx(x, y)] = (n === 2 || n === 3) ? 1 : 0;
        } else {
          next[idx(x, y)] = (n === 3) ? 1 : 0;
        }
      }
    }
    grid = next;
    draw();
  }

  function clear() {
    grid = new Uint8Array(W * H);
    draw();
  }

  function randomize() {
    for (let i = 0; i < grid.length; i++) {
      grid[i] = Math.random() < 0.28 ? 1 : 0;
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // subtle grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) {
      ctx.beginPath();
      ctx.moveTo(x * cw, 0);
      ctx.lineTo(x * cw, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * ch);
      ctx.lineTo(canvas.width, y * ch);
      ctx.stroke();
    }
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (grid[idx(x, y)]) {
          const hue = (x + y) * 4 % 360;
          ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
          ctx.fillRect(x * cw + 0.5, y * ch + 0.5, cw - 1, ch - 1);
        }
      }
    }
  }

  // Painting
  let painting = false;
  let paintVal = 1;

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (canvas.width / rect.width);
    const py = (e.clientY - rect.top) * (canvas.height / rect.height);
    return { x: Math.floor(px / cw), y: Math.floor(py / ch) };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const { x, y } = cellFromEvent(e);
    paintVal = get(x, y) ? 0 : 1;
    painting = true;
    set(x, y, paintVal);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!painting) return;
    const { x, y } = cellFromEvent(e);
    set(x, y, paintVal);
  });
  window.addEventListener('pointerup', () => { painting = false; });

  // Controls
  document.getElementById('step').addEventListener('click', step);
  document.getElementById('random').addEventListener('click', randomize);
  document.getElementById('clear').addEventListener('click', clear);

  let timer = null;
  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', () => {
    if (timer) {
      clearInterval(timer);
      timer = null;
      playBtn.classList.remove('active');
      playBtn.textContent = 'Play ▶';
    } else {
      timer = setInterval(step, 100);
      playBtn.classList.add('active');
      playBtn.textContent = 'Pause ❚❚';
    }
  });

  // Expose API
  window.life = {
    w: W, h: H,
    get, set, step, clear,
  };

  randomize();
})();
</script>
</body>
</html>
