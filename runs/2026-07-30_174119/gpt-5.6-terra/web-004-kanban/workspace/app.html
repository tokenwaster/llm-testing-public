<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --text: #1d2939;
      --muted: #667085;
      --line: #dfe4ec;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger: #e5484d;
      --shadow: 0 5px 18px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .add-form {
      display: flex;
      width: min(460px, 100%);
      gap: 10px;
    }

    #new-card {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
      outline: none;
    }

    #new-card:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    #add-card {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #add-card:hover {
      background: #4338ca;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }

    .column {
      min-height: 430px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #e9edf4;
    }

    .column-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .column-header h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .count {
      display: inline-grid;
      place-items: center;
      min-width: 25px;
      height: 25px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-container {
      min-height: 360px;
      padding: 12px;
      transition: background 0.15s ease;
    }

    .column.drag-over .card-container {
      background: rgba(79, 70, 229, 0.1);
    }

    .card {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 14px;
      border: 1px solid #e3e7ee;
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      cursor: grab;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.dragging {
      opacity: 0.45;
    }

    .card-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .card-del {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .card-del:hover {
      background: #fff0f1;
      color: var(--danger);
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .add-form {
        width: 100%;
      }

      .board {
        grid-template-columns: 1fr;
      }

      .column {
        min-height: 220px;
      }

      .card-container {
        min-height: 130px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>My Kanban Board</h1>
      <div class="add-form">
        <input id="new-card" type="text" placeholder="Add a task..." aria-label="New task" />
        <button id="add-card" type="button">Add card</button>
      </div>
    </div>

    <section class="board" aria-label="Kanban board">
      <section class="column" id="col-todo">
        <header class="column-header">
          <h2>To Do</h2>
          <span class="count">0</span>
        </header>
        <div class="card-container" aria-label="To Do cards"></div>
      </section>

      <section class="column" id="col-doing">
        <header class="column-header">
          <h2>Doing</h2>
          <span class="count">0</span>
        </header>
        <div class="card-container" aria-label="Doing cards"></div>
      </section>

      <section class="column" id="col-done">
        <header class="column-header">
          <h2>Done</h2>
          <span class="count">0</span>
        </header>
        <div class="card-container" aria-label="Done cards"></div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "kanban-board-state";
      const columnIds = ["col-todo", "col-doing", "col-done"];
      const input = document.getElementById("new-card");
      const addButton = document.getElementById("add-card");
      let draggedCard = null;

      function makeId() {
        return "card-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      function createCard(title, id) {
        const card = document.createElement("article");
        card.className = "card";
        card.id = id || makeId();
        card.draggable = true;

        const titleElement = document.createElement("span");
        titleElement.className = "card-title";
        titleElement.textContent = title;

        const deleteButton = document.createElement("button");
        deleteButton.className = "card-del";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", "Delete " + title);
        deleteButton.textContent = "×";

        deleteButton.addEventListener("click", function () {
          card.remove();
          saveBoard();
          updateCounts();
        });

        card.addEventListener("dragstart", function (event) {
          draggedCard = card;
          card.classList.add("dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", card.id);
        });

        card.addEventListener("dragend", function () {
          card.classList.remove("dragging");
          document.querySelectorAll(".column").forEach(function (column) {
            column.classList.remove("drag-over");
          });
          draggedCard = null;
        });

        card.append(titleElement, deleteButton);
        return card;
      }

      function updateCounts() {
        columnIds.forEach(function (columnId) {
          const column = document.getElementById(columnId);
          const count = column.querySelectorAll(".card").length;
          column.querySelector(".count").textContent = count;
        });
      }

      function saveBoard() {
        const state = {};
        columnIds.forEach(function (columnId) {
          const container = document.querySelector("#" + columnId + " .card-container");
          state[columnId] = Array.from(container.querySelectorAll(".card")).map(function (card) {
            return {
              id: card.id,
              title: card.querySelector(".card-title").textContent
            };
          });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function loadBoard() {
        let state;
        try {
          state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (error) {
          state = {};
        }

        columnIds.forEach(function (columnId) {
          const container = document.querySelector("#" + columnId + " .card-container");
          const cards = Array.isArray(state[columnId]) ? state[columnId] : [];
          cards.forEach(function (item) {
            if (item && typeof item.title === "string") {
              container.appendChild(createCard(item.title, item.id));
            }
          });
        });

        updateCounts();
      }

      function addCard() {
        const title = input.value.trim();
        if (!title) return;

        const todoContainer = document.querySelector("#col-todo .card-container");
        todoContainer.appendChild(createCard(title));
        input.value = "";
        input.focus();
        saveBoard();
        updateCounts();
      }

      addButton.addEventListener("click", addCard);

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          addCard();
        }
      });

      document.querySelectorAll(".column").forEach(function (column) {
        const container = column.querySelector(".card-container");

        column.addEventListener("dragover", function (event) {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          column.classList.add("drag-over");
        });

        column.addEventListener("dragleave", function (event) {
          if (!column.contains(event.relatedTarget)) {
            column.classList.remove("drag-over");
          }
        });

        column.addEventListener("drop", function (event) {
          event.preventDefault();
          column.classList.remove("drag-over");

          const cardId = event.dataTransfer.getData("text/plain");
          const card = draggedCard || document.getElementById(cardId);
          if (!card) return;

          container.appendChild(card);
          saveBoard();
          updateCounts();
        });
      });

      loadBoard();
    })();
  </script>
</body>
</html>
