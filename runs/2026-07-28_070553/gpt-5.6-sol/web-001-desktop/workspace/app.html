<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubuntu Desktop</title>
  <style>
    :root {
      color-scheme: dark;
      --orange: #e95420;
      --aubergine: #2c1628;
      --panel: #1f1f1f;
      --panel-light: #303030;
      --border: #494949;
      --text: #f4f4f4;
      --muted: #bcbcbc;
      --window-shadow: 0 24px 70px rgba(0, 0, 0, .58), 0 2px 8px rgba(0, 0, 0, .55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Ubuntu, "Segoe UI", Arial, sans-serif;
      background: #281726;
      color: var(--text);
    }

    button, textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    #desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 360px;
      min-height: 240px;
      overflow: hidden;
      user-select: none;
      background:
        radial-gradient(circle at 77% 23%, rgba(255, 121, 65, .34) 0 2%, transparent 24%),
        radial-gradient(circle at 22% 70%, rgba(109, 38, 90, .55), transparent 40%),
        linear-gradient(128deg, #1d1225 0%, #4a193d 42%, #8b2d38 70%, #d94d28 110%);
    }

    #desktop::before,
    #desktop::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 48% 52% 62% 38%;
      transform: rotate(-24deg);
      opacity: .55;
      filter: blur(1px);
    }

    #desktop::before {
      width: 58vw;
      height: 115vh;
      right: -27vw;
      top: -18vh;
      border: 2px solid rgba(255, 197, 166, .2);
      box-shadow:
        0 0 0 70px rgba(212, 68, 45, .08),
        0 0 0 150px rgba(156, 47, 68, .08);
    }

    #desktop::after {
      width: 48vw;
      height: 70vh;
      left: 18vw;
      bottom: -54vh;
      border: 80px solid rgba(255, 129, 74, .08);
    }

    .top-panel {
      position: absolute;
      z-index: 1000;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: rgba(20, 18, 20, .94);
      box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
      font-size: 13px;
      font-weight: 600;
    }

    .top-panel .activities {
      min-width: 120px;
    }

    #panel-clock {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .system-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #eee;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border: 2px solid #eee;
      border-radius: 50%;
      box-shadow: 7px 0 0 -2px #eee;
    }

    #taskbar {
      position: absolute;
      z-index: 900;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 9px 7px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 13px;
      background: rgba(28, 23, 29, .78);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .38);
      backdrop-filter: blur(10px);
    }

    .launcher {
      position: relative;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .launcher:hover,
    .launcher:focus-visible {
      background: rgba(255, 255, 255, .18);
      transform: translateY(-1px);
      outline: none;
    }

    .launcher::after {
      position: absolute;
      left: 58px;
      top: 50%;
      padding: 5px 8px;
      border-radius: 5px;
      content: attr(data-label);
      color: white;
      background: rgba(20, 20, 20, .94);
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) translateX(-3px);
      transition: .12s;
    }

    .launcher:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .files-icon {
      position: absolute;
      width: 30px;
      height: 23px;
      left: 9px;
      top: 15px;
      border-radius: 3px 4px 5px 5px;
      background: linear-gradient(#edb44d 0 27%, #d98b25 28%);
      box-shadow: inset 0 1px rgba(255, 255, 255, .4);
    }

    .files-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 14px;
      height: 7px;
      border-radius: 3px 3px 0 0;
      background: #f0b84f;
    }

    .note-icon {
      position: absolute;
      left: 11px;
      top: 8px;
      width: 27px;
      height: 33px;
      border-radius: 4px;
      background:
        linear-gradient(90deg, transparent 0 6px, #c84f44 6px 8px, transparent 8px),
        repeating-linear-gradient(#f8f3dd 0 7px, #b9d0db 8px, #f8f3dd 9px);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
    }

    .desktop-label {
      position: absolute;
      right: 24px;
      bottom: 22px;
      color: rgba(255, 255, 255, .66);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .window {
      position: absolute;
      z-index: 20;
      display: flex;
      flex-direction: column;
      width: min(760px, calc(100vw - 120px));
      height: min(540px, calc(100vh - 100px));
      min-width: 360px;
      min-height: 240px;
      overflow: hidden;
      border: 1px solid #525252;
      border-radius: 10px;
      background: #252525;
      box-shadow: var(--window-shadow);
      resize: both;
    }

    #files-window {
      top: 58px;
      left: 92px;
    }

    #notepad-window {
      top: 82px;
      left: min(25vw, 300px);
      width: min(700px, calc(100vw - 130px));
      height: min(510px, calc(100vh - 110px));
    }

    .window.active-window {
      border-color: #696969;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .05);
    }

    .titlebar {
      flex: 0 0 39px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 14px;
      border-bottom: 1px solid #161616;
      background: linear-gradient(#3b3b3b, #303030);
      cursor: grab;
    }

    .titlebar:active {
      cursor: grabbing;
    }

    .window-title {
      flex: 1;
      text-align: center;
      margin-left: 36px;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }

    .win-close {
      width: 27px;
      height: 27px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #4b4b4b;
      color: transparent;
      cursor: pointer;
      position: relative;
    }

    .win-close::before,
    .win-close::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 1.5px;
      left: 8px;
      top: 13px;
      background: #fff;
      transform: rotate(45deg);
    }

    .win-close::after {
      transform: rotate(-45deg);
    }

    .win-close:hover {
      background: #c94c43;
    }

    .files-toolbar {
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 11px;
      border-bottom: 1px solid #151515;
      background: #2a2a2a;
    }

    #files-up {
      width: 34px;
      height: 32px;
      border: 1px solid #505050;
      border-radius: 6px;
      background: #383838;
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
    }

    #files-up:hover:not(:disabled) {
      background: #494949;
    }

    #files-up:disabled {
      opacity: .38;
      cursor: default;
    }

    .path-shell {
      min-width: 0;
      flex: 1;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      background: #1e1e1e;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35);
    }

    .path-root-icon {
      width: 13px;
      height: 13px;
      margin-right: 9px;
      border: 2px solid #d0d0d0;
      border-radius: 2px;
      transform: rotate(45deg);
    }

    #files-path {
      overflow: hidden;
      color: #f2f2f2;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .files-body {
      min-height: 0;
      flex: 1;
      display: flex;
      background: #262626;
    }

    .files-sidebar {
      flex: 0 0 145px;
      padding: 11px 8px;
      border-right: 1px solid #151515;
      background: #222;
    }

    .side-heading {
      margin: 5px 9px 9px;
      color: #929292;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .side-place {
      display: flex;
      align-items: center;
      height: 31px;
      padding: 0 9px;
      border-radius: 5px;
      color: #d8d8d8;
      font-size: 13px;
    }

    .side-place.current {
      background: #414141;
      color: white;
    }

    .side-place::before {
      content: "";
      width: 10px;
      height: 9px;
      margin-right: 10px;
      border: 1px solid #bdbdbd;
      border-radius: 2px;
    }

    #files-list {
      min-width: 0;
      min-height: 0;
      flex: 1;
      align-content: start;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      padding: 18px;
      overflow: auto;
    }

    .fs-item {
      min-width: 0;
      height: 91px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 7px 5px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      cursor: default;
    }

    .fs-item:hover,
    .fs-item.selected {
      border-color: rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .09);
    }

    .fs-item::before {
      content: "";
      width: 45px;
      height: 34px;
      flex: none;
      border-radius: 4px 5px 6px 6px;
      background: linear-gradient(#e7aa3b 0 23%, #cb781b 24%);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .35);
    }

    .fs-item.folder::after {
      content: "";
      position: absolute;
    }

    .fs-item.file::before {
      width: 31px;
      height: 40px;
      border-radius: 3px;
      background:
        linear-gradient(135deg, transparent 0 11px, rgba(0,0,0,.12) 12px 13px, transparent 14px) top right / 14px 14px no-repeat,
        repeating-linear-gradient(to bottom, #e9e9e9 0 6px, #adb7bc 7px, #e9e9e9 8px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .35);
    }

    .fs-item span {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: #ececec;
      font-size: 12px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #files-status {
      flex: 0 0 25px;
      padding: 5px 12px;
      border-top: 1px solid #171717;
      background: #202020;
      color: #aaa;
      font-size: 11px;
    }

    .notepad-tools {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #161616;
      background: #292929;
    }

    #tabs {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: end;
      gap: 2px;
      padding: 6px 5px 0 7px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tab {
      flex: 0 0 auto;
      max-width: 180px;
      min-width: 104px;
      height: 32px;
      padding: 0 13px;
      overflow: hidden;
      border: 1px solid #424242;
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      background: #333;
      color: #bdbdbd;
      cursor: pointer;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab:hover {
      background: #3d3d3d;
    }

    .tab.active {
      border-color: #535353;
      background: #1e1e1e;
      color: white;
      box-shadow: inset 0 2px var(--orange);
    }

    #new-tab {
      flex: 0 0 39px;
      align-self: center;
      width: 31px;
      height: 31px;
      margin: 4px 7px 4px 2px;
      padding: 0;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      background: #373737;
      cursor: pointer;
      font-size: 22px;
      line-height: 25px;
    }

    #new-tab:hover {
      background: #474747;
    }

    .editor-wrap {
      min-height: 0;
      flex: 1;
      position: relative;
      background: #1e1e1e;
    }

    #editor {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 150px;
      resize: none;
      padding: 21px 24px;
      border: 0;
      outline: 0;
      background:
        linear-gradient(90deg, transparent 0 46px, rgba(233, 84, 32, .18) 47px, transparent 48px),
        #1e1e1e;
      color: #ececec;
      caret-color: #ff8b60;
      font-family: "Liberation Mono", Consolas, monospace;
      font-size: 15px;
      line-height: 1.65;
      user-select: text;
    }

    .notepad-status {
      flex: 0 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-top: 1px solid #333;
      background: #282828;
      color: #a7a7a7;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      #taskbar {
        top: auto;
        bottom: 9px;
        left: 50%;
        flex-direction: row;
        transform: translateX(-50%);
      }

      .launcher::after {
        display: none;
      }

      .window,
      #notepad-window {
        left: 4px;
        top: 36px;
        width: calc(100vw - 8px);
        height: calc(100vh - 100px);
      }

      .files-sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="desktop">
    <header class="top-panel" aria-label="System panel">
      <span class="activities">Activities</span>
      <time id="panel-clock"></time>
      <span class="system-area">
        <span class="status-dot" aria-hidden="true"></span>
        <span>▴</span>
        <span>100%</span>
      </span>
    </header>

    <nav id="taskbar" aria-label="Applications">
      <button id="open-files" class="launcher" data-label="Files" aria-label="Open Files">
        <span class="files-icon" aria-hidden="true"></span>
      </button>
      <button id="open-notepad" class="launcher" data-label="Notepad" aria-label="Open Notepad">
        <span class="note-icon" aria-hidden="true"></span>
      </button>
    </nav>

    <div class="desktop-label">Ubuntu Workspace</div>

    <section id="files-window" class="window" aria-label="Files window" hidden>
      <div class="titlebar">
        <div class="window-title">Files</div>
        <button class="win-close" type="button" aria-label="Close Files"></button>
      </div>

      <div class="files-toolbar">
        <button id="files-up" type="button" aria-label="Go to parent directory" title="Parent directory">↑</button>
        <div class="path-shell">
          <span class="path-root-icon" aria-hidden="true"></span>
          <span id="files-path">/</span>
        </div>
      </div>

      <div class="files-body">
        <aside class="files-sidebar" aria-label="Places">
          <div class="side-heading">Places</div>
          <div class="side-place current">Computer</div>
          <div class="side-place">Home</div>
          <div class="side-place">Documents</div>
          <div class="side-place">Downloads</div>
          <div class="side-heading" style="margin-top:18px">Devices</div>
          <div class="side-place">System</div>
        </aside>
        <div id="files-list" aria-label="Directory contents"></div>
      </div>

      <div id="files-status">Ready</div>
    </section>

    <section id="notepad-window" class="window" aria-label="Notepad window" hidden>
      <div class="titlebar">
        <div class="window-title">Notepad</div>
        <button class="win-close" type="button" aria-label="Close Notepad"></button>
      </div>

      <div class="notepad-tools">
        <div id="tabs" role="tablist" aria-label="Open documents"></div>
        <button id="new-tab" type="button" aria-label="New tab" title="New tab">+</button>
      </div>

      <div class="editor-wrap">
        <textarea id="editor" spellcheck="true" aria-label="Document editor"></textarea>
      </div>

      <div class="notepad-status">
        <span id="document-status">Saved locally</span>
        <span id="cursor-status">Ln 1, Col 1</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const desktop = document.getElementById("desktop");
      const filesWindow = document.getElementById("files-window");
      const notepadWindow = document.getElementById("notepad-window");
      const openFiles = document.getElementById("open-files");
      const openNotepad = document.getElementById("open-notepad");
      let topZ = 30;

      function focusWindow(win) {
        document.querySelectorAll(".window").forEach(item => {
          item.classList.toggle("active-window", item === win);
        });
        win.style.zIndex = String(++topZ);
      }

      function showWindow(win) {
        win.hidden = false;
        focusWindow(win);
      }

      openFiles.addEventListener("click", () => showWindow(filesWindow));
      openNotepad.addEventListener("click", () => {
        showWindow(notepadWindow);
        requestAnimationFrame(() => document.getElementById("editor").focus());
      });

      document.querySelectorAll(".win-close").forEach(button => {
        button.addEventListener("click", event => {
          const win = event.currentTarget.closest(".window");
          win.hidden = true;
          win.classList.remove("active-window");
        });
      });

      document.querySelectorAll(".window").forEach(win => {
        win.addEventListener("pointerdown", () => focusWindow(win));

        const bar = win.querySelector(".titlebar");
        let drag = null;

        bar.addEventListener("pointerdown", event => {
          if (event.target.closest("button")) return;
          const rect = win.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            dx: event.clientX - rect.left,
            dy: event.clientY - rect.top
          };
          bar.setPointerCapture(event.pointerId);
          focusWindow(win);
          event.preventDefault();
        });

        bar.addEventListener("pointermove", event => {
          if (!drag || drag.pointerId !== event.pointerId) return;

          const maxLeft = Math.max(0, desktop.clientWidth - win.offsetWidth);
          const maxTop = Math.max(30, desktop.clientHeight - win.offsetHeight);
          const left = Math.min(maxLeft, Math.max(0, event.clientX - drag.dx));
          const top = Math.min(maxTop, Math.max(30, event.clientY - drag.dy));

          win.style.left = left + "px";
          win.style.top = top + "px";
        });

        const stopDrag = event => {
          if (drag && drag.pointerId === event.pointerId) {
            drag = null;
          }
        };

        bar.addEventListener("pointerup", stopDrag);
        bar.addEventListener("pointercancel", stopDrag);
      });

      function updateClock() {
        const now = new Date();
        document.getElementById("panel-clock").textContent =
          new Intl.DateTimeFormat(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(now);
      }

      updateClock();
      setInterval(updateClock, 30000);

      const fileSystem = {
        "/": [
          { name: "bin", type: "folder" },
          { name: "etc", type: "folder" },
          { name: "home", type: "folder" },
          { name: "opt", type: "folder" },
          { name: "tmp", type: "folder" },
          { name: "usr", type: "folder" },
          { name: "var", type: "folder" }
        ],
        "/bin": [
          { name: "bash", type: "file" },
          { name: "cat", type: "file" },
          { name: "echo", type: "file" },
          { name: "ls", type: "file" }
        ],
        "/etc": [
          { name: "apt", type: "folder" },
          { name: "network", type: "folder" },
          { name: "hostname", type: "file" },
          { name: "hosts", type: "file" }
        ],
        "/etc/apt": [
          { name: "sources.list", type: "file" }
        ],
        "/etc/network": [
          { name: "interfaces", type: "file" }
        ],
        "/home": [
          { name: "user", type: "folder" }
        ],
        "/home/user": [
          { name: "Documents", type: "folder" },
          { name: "Downloads", type: "folder" },
          { name: "Pictures", type: "folder" },
          { name: "Music", type: "folder" },
          { name: "Desktop", type: "folder" },
          { name: "welcome.txt", type: "file" }
        ],
        "/home/user/Documents": [
          { name: "Projects", type: "folder" },
          { name: "notes.txt", type: "file" },
          { name: "todo.txt", type: "file" }
        ],
        "/home/user/Documents/Projects": [
          { name: "desktop-demo", type: "folder" },
          { name: "README.md", type: "file" }
        ],
        "/home/user/Documents/Projects/desktop-demo": [
          { name: "app.html", type: "file" }
        ],
        "/home/user/Downloads": [
          { name: "ubuntu-guide.pdf", type: "file" },
          { name: "wallpaper.png", type: "file" }
        ],
        "/home/user/Pictures": [
          { name: "Wallpapers", type: "folder" },
          { name: "sunset.jpg", type: "file" }
        ],
        "/home/user/Pictures/Wallpapers": [
          { name: "aubergine.png", type: "file" }
        ],
        "/home/user/Music": [],
        "/home/user/Desktop": [],
        "/opt": [],
        "/tmp": [],
        "/usr": [
          { name: "bin", type: "folder" },
          { name: "lib", type: "folder" },
          { name: "share", type: "folder" }
        ],
        "/usr/bin": [
          { name: "python3", type: "file" },
          { name: "nano", type: "file" }
        ],
        "/usr/lib": [],
        "/usr/share": [],
        "/var": [
          { name: "log", type: "folder" },
          { name: "tmp", type: "folder" }
        ],
        "/var/log": [
          { name: "system.log", type: "file" },
          { name: "auth.log", type: "file" }
        ],
        "/var/tmp": []
      };

      const filesPath = document.getElementById("files-path");
      const filesList = document.getElementById("files-list");
      const filesUp = document.getElementById("files-up");
      const filesStatus = document.getElementById("files-status");
      let currentPath = "/";

      function joinPath(parent, child) {
        return parent === "/" ? "/" + child : parent + "/" + child;
      }

      function renderDirectory() {
        filesPath.textContent = currentPath;
        filesUp.disabled = currentPath === "/";
        filesList.replaceChildren();

        const entries = fileSystem[currentPath] || [];
        entries.forEach(entry => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "fs-item " + entry.type;
          item.dataset.name = entry.name;
          item.dataset.type = entry.type;
          item.title = entry.type === "folder"
            ? "Double-click to open " + entry.name
            : entry.name;

          const label = document.createElement("span");
          label.textContent = entry.name;
          item.appendChild(label);

          item.addEventListener("click", () => {
            filesList.querySelectorAll(".fs-item").forEach(other => {
              other.classList.toggle("selected", other === item);
            });
            filesStatus.textContent = entry.name + " — " + entry.type;
          });

          item.addEventListener("dblclick", () => {
            if (entry.type === "folder") {
              currentPath = joinPath(currentPath, entry.name);
              renderDirectory();
            } else {
              filesStatus.textContent = "Opened " + entry.name + " (read-only fake file)";
            }
          });

          filesList.appendChild(item);
        });

        filesStatus.textContent = entries.length === 1
          ? "1 item"
          : entries.length + " items";
      }

      filesUp.addEventListener("click", () => {
        if (currentPath === "/") return;
        const pieces = currentPath.split("/").filter(Boolean);
        pieces.pop();
        currentPath = pieces.length ? "/" + pieces.join("/") : "/";
        renderDirectory();
      });

      renderDirectory();

      const STORAGE_KEY = "ubuntu-desktop-notepad-tabs-v1";
      const tabsElement = document.getElementById("tabs");
      const newTabButton = document.getElementById("new-tab");
      const editor = document.getElementById("editor");
      const documentStatus = document.getElementById("document-status");
      const cursorStatus = document.getElementById("cursor-status");

      let notepadState = loadNotepadState();

      function freshState() {
        return {
          activeId: "tab-1",
          nextNumber: 2,
          tabs: [
            { id: "tab-1", title: "Untitled 1", content: "" }
          ]
        };
      }

      function loadNotepadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (
            parsed &&
            Array.isArray(parsed.tabs) &&
            parsed.tabs.length > 0 &&
            parsed.tabs.every(tab =>
              typeof tab.id === "string" &&
              typeof tab.title === "string" &&
              typeof tab.content === "string"
            )
          ) {
            if (!parsed.tabs.some(tab => tab.id === parsed.activeId)) {
              parsed.activeId = parsed.tabs[0].id;
            }
            if (!Number.isInteger(parsed.nextNumber) || parsed.nextNumber < 1) {
              parsed.nextNumber = parsed.tabs.length + 1;
            }
            return parsed;
          }
        } catch (error) {
          console.warn("Could not restore notepad data:", error);
        }
        return freshState();
      }

      function saveNotepadState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(notepadState));
          documentStatus.textContent = "Saved locally";
        } catch (error) {
          documentStatus.textContent = "Storage unavailable";
        }
      }

      function getActiveTab() {
        return notepadState.tabs.find(tab => tab.id === notepadState.activeId);
      }

      function renderTabs() {
        tabsElement.replaceChildren();

        notepadState.tabs.forEach(tabData => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "tab" + (tabData.id === notepadState.activeId ? " active" : "");
          tab.textContent = tabData.title;
          tab.dataset.tabId = tabData.id;
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", String(tabData.id === notepadState.activeId));

          tab.addEventListener("click", () => {
            notepadState.activeId = tabData.id;
            renderTabs();
            showActiveContent();
            saveNotepadState();
            editor.focus();
          });

          tabsElement.appendChild(tab);
        });
      }

      function showActiveContent() {
        const active = getActiveTab();
        editor.value = active ? active.content : "";
        updateCursorStatus();
      }

      function createTab() {
        const number = notepadState.nextNumber++;
        const tab = {
          id: "tab-" + Date.now() + "-" + number,
          title: "Untitled " + number,
          content: ""
        };
        notepadState.tabs.push(tab);
        notepadState.activeId = tab.id;
        renderTabs();
        showActiveContent();
        saveNotepadState();
        editor.focus();
      }

      editor.addEventListener("input", () => {
        const active = getActiveTab();
        if (active) {
          active.content = editor.value;
          saveNotepadState();
        }
        updateCursorStatus();
      });

      function updateCursorStatus() {
        const beforeCaret = editor.value.slice(0, editor.selectionStart);
        const lines = beforeCaret.split("\n");
        cursorStatus.textContent =
          "Ln " + lines.length + ", Col " + (lines[lines.length - 1].length + 1);
      }

      editor.addEventListener("click", updateCursorStatus);
      editor.addEventListener("keyup", updateCursorStatus);
      editor.addEventListener("select", updateCursorStatus);
      newTabButton.addEventListener("click", createTab);

      renderTabs();
      showActiveContent();
      saveNotepadState();

      window.addEventListener("beforeunload", saveNotepadState);
    })();
  </script>
</body>
</html>
