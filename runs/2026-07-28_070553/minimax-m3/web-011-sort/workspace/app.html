<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorting Algorithm Visualizer</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --bar: #4c8edb;
    --bar-compare: #f0883e;
    --bar-swap: #f85149;
    --bar-sorted: #3fb950;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  header .sub {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 8px;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }

  .controls button {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }

  .controls button:hover:not(:disabled) {
    background: #30363d;
    border-color: #6e7681;
  }

  .controls button:active:not(:disabled) {
    background: #1c2128;
  }

  .controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #sort {
    background: #238636;
    border-color: #2ea043;
  }
  #sort:hover:not(:disabled) {
    background: #2ea043;
  }

  #shuffle {
    background: #1f6feb;
    border-color: #388bfd;
  }
  #shuffle:hover:not(:disabled) {
    background: #388bfd;
  }

  .stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 16px;
  }

  .stats span strong {
    color: var(--text);
    font-weight: 600;
  }

  #stage {
    flex: 1;
    padding: 24px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 0;
  }

  #bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 100%;
    height: 100%;
    max-width: 1200px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .bar {
    flex: 1;
    background: var(--bar);
    border-radius: 2px 2px 0 0;
    transition: background 0.15s, height 0.15s;
    min-width: 4px;
    position: relative;
  }

  .bar.compare { background: var(--bar-compare); }
  .bar.swap { background: var(--bar-swap); }
  .bar.sorted { background: var(--bar-sorted); }

  footer {
    padding: 10px 24px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Sorting Algorithm Visualizer</h1>
  <div class="sub">Step-driven insertion sort · bars represent values</div>
</header>

<div class="controls">
  <button id="sort">▶ Sort</button>
  <button id="shuffle">🔀 Shuffle</button>
  <button id="reset">↺ Reset</button>
  <div class="stats">
    <span>Comparisons: <strong id="cmp">0</strong></span>
    <span>Swaps: <strong id="swp">0</strong></span>
    <span>Status: <strong id="status">idle</strong></span>
  </div>
</div>

<div id="stage">
  <div id="bars"></div>
</div>

<footer>Insertion sort · one step per sortStep() call</footer>

<script>
(function () {
  'use strict';

  const barsEl = document.getElementById('bars');
  const sortBtn = document.getElementById('sort');
  const shuffleBtn = document.getElementById('shuffle');
  const resetBtn = document.getElementById('reset');
  const cmpEl = document.getElementById('cmp');
  const swpEl = document.getElementById('swp');
  const statusEl = document.getElementById('status');

  // Internal state
  let arr = [];
  let initialArray = [];
  let stepCount = 0;
  let comparisons = 0;
  let swaps = 0;
  let sorting = false;
  let sortAnimHandle = null;

  // Insertion sort state machine:
  // i is the index of the next element to insert into the sorted prefix [0..i-1].
  // j is the index being compared/shifted within the sorted prefix.
  let i = 1;
  let j = 0;
  let currentKey = null;  // the value being inserted
  let phase = 'idle';     // 'idle' | 'picking' | 'shifting' | 'placing' | 'done'

  // Track which indices are in the sorted prefix (for visual feedback)
  let sortedUpTo = 0;

  // Track highlighted bars
  let compareIdx = -1;
  let swapIdx = -1;

  // ---------- Rendering ----------

  function render() {
    // Re-create bars (simple and reliable). Could optimize with diffing, but fine for small N.
    barsEl.innerHTML = '';
    const max = arr.length ? Math.max(...arr) : 1;
    for (let k = 0; k < arr.length; k++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const v = arr[k];
      bar.style.height = ((v / max) * 100) + '%';
      if (k < sortedUpTo) bar.classList.add('sorted');
      if (k === compareIdx) bar.classList.add('compare');
      if (k === swapIdx) bar.classList.add('swap');
      barsEl.appendChild(bar);
    }
  }

  function updateStats() {
    cmpEl.textContent = comparisons;
    swpEl.textContent = swaps;
    statusEl.textContent = phase;
  }

  // ---------- Array helpers ----------

  function isAscending(a) {
    for (let k = 1; k < a.length; k++) {
      if (a[k] < a[k - 1]) return false;
    }
    return true;
  }

  function generateRandom(n) {
    const out = [];
    for (let k = 0; k < n; k++) {
      out.push(Math.floor(Math.random() * 95) + 5); // 5..99
    }
    return out;
  }

  function setArrayInternal(a) {
    stopAnimation();
    arr = a.slice();
    initialArray = a.slice();
    resetSortState();
    render();
    updateStats();
  }

  function resetSortState() {
    stepCount = 0;
    comparisons = 0;
    swaps = 0;
    i = 1;
    j = 0;
    currentKey = null;
    phase = 'idle';
    sortedUpTo = 1; // first element is trivially sorted
    compareIdx = -1;
    swapIdx = -1;
  }

  // ---------- Sort step (single step of insertion sort) ----------

  function sortStep() {
    if (arr.length === 0) {
      phase = 'done';
      updateStats();
      return true;
    }

    // If already sorted, return true
    if (isAscending(arr)) {
      phase = 'done';
      sortedUpTo = arr.length;
      compareIdx = -1;
      swapIdx = -1;
      render();
      updateStats();
      return true;
    }

    // Reset highlights
    compareIdx = -1;
    swapIdx = -1;

    if (phase === 'idle') {
      // Start a new pass
      if (i >= arr.length) {
        phase = 'done';
        sortedUpTo = arr.length;
        render();
        updateStats();
        return true;
      }
      currentKey = arr[i];
      j = i - 1;
      phase = 'shifting';
    }

    if (phase === 'shifting') {
      stepCount++;
      if (j >= 0) {
        comparisons++;
        compareIdx = j;
        if (arr[j] > currentKey) {
          // Shift arr[j] to arr[j+1]
          arr[j + 1] = arr[j];
          swaps++;
          swapIdx = j + 1;
          j--;
          render();
          updateStats();
          return false;
        } else {
          // Found insertion point
          compareIdx = j;
          render();
          updateStats();
          // Place currentKey at j+1 on next call
          phase = 'placing';
          return false;
        }
      } else {
        // Reached beginning, place at index 0
        phase = 'placing';
        // fall through to placing on next call; but we can do it now
      }
    }

    if (phase === 'placing') {
      arr[j + 1] = currentKey;
      // (Not a "swap" per se, but count as a write)
      i++;
      sortedUpTo = i;
      phase = 'idle';
      compareIdx = -1;
      swapIdx = -1;
      render();
      updateStats();
      // Check if done
      if (i >= arr.length || isAscending(arr)) {
        phase = 'done';
        sortedUpTo = arr.length;
        render();
        updateStats();
        return true;
      }
      return false;
    }

    if (phase === 'done') {
      return true;
    }

    return false;
  }

  // ---------- Animation loop ----------

  function stopAnimation() {
    if (sortAnimHandle !== null) {
      cancelAnimationFrame(sortAnimHandle);
      sortAnimHandle = null;
    }
    sorting = false;
    sortBtn.textContent = '▶ Sort';
  }

  function startAnimation() {
    if (phase === 'done' || isAscending(arr)) {
      stopAnimation();
      phase = 'done';
      sortedUpTo = arr.length;
      render();
      updateStats();
      return;
    }
    sorting = true;
    sortBtn.textContent = '⏸ Pause';
    const speed = 8; // steps per frame
    let last = performance.now();
    const interval = 16; // ~60fps target

    function tick(now) {
      if (!sorting) return;
      if (now - last >= interval) {
        last = now;
        for (let s = 0; s < speed; s++) {
          const done = sortStep();
          if (done) {
            stopAnimation();
            return;
          }
        }
      }
      sortAnimHandle = requestAnimationFrame(tick);
    }
    sortAnimHandle = requestAnimationFrame(tick);
  }

  // ---------- Button handlers ----------

  sortBtn.addEventListener('click', () => {
    if (sorting) {
      stopAnimation();
    } else {
      if (phase === 'done' && isAscending(arr)) {
        // Already sorted, do nothing
        return;
      }
      startAnimation();
    }
  });

  shuffleBtn.addEventListener('click', () => {
    setArrayInternal(generateRandom(40));
  });

  resetBtn.addEventListener('click', () => {
    setArrayInternal(initialArray);
  });

  // ---------- Public API ----------

  window.viz = {
    array() {
      return arr.slice();
    },
    setArray(a) {
      setArrayInternal(a);
    },
    sortStep() {
      return sortStep();
    },
    sorted() {
      return isAscending(arr);
    }
  };

  // ---------- Initialize ----------

  setArrayInternal(generateRandom(40));
})();
</script>

</body>
</html>
