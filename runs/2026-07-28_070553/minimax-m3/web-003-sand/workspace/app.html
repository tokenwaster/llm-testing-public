<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Falling Sand Sandbox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a12;
    color: #d0d0d0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 2.5px;
    color: #888;
    text-transform: uppercase;
  }
  #controls {
    display: flex;
    gap: 5px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #16161e;
    color: #9090a0;
    border: 1px solid #252530;
    padding: 8px 11px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
  }
  button:hover { background: #1f1f2c; color: #c8c8d8; }
  button.active {
    background: #2a2a44;
    color: #fff;
    border-color: #5a6ca0;
    box-shadow: 0 0 8px rgba(90,108,160,0.3);
  }
  #clear { border-color: #4a2a2a; }
  #clear:hover { background: #2e1e1e; color: #d0a0a0; }
  .sw {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 2px;
    margin-right: 6px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  #sand {
    display: block;
    background: #050510;
    cursor: crosshair;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    border: 1px solid #1a1a2a;
    border-radius: 2px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <h1>Falling Sand</h1>
  <div id="controls">
    <button id="mat-sand" class="active"><span class="sw" style="background:#e6c87a"></span>Sand</button>
    <button id="mat-water"><span class="sw" style="background:#4a8de0"></span>Water</button>
    <button id="mat-wall"><span class="sw" style="background:#7a7a7a"></span>Wall</button>
    <button id="mat-acid"><span class="sw" style="background:#80ff20"></span>Acid</button>
    <button id="mat-empty"><span class="sw" style="background:#000;border-color:#333"></span>Erase</button>
    <button id="clear">Clear</button>
  </div>
  <canvas id="sand"></canvas>

<script>
(function() {
  'use strict';

  const W = 120, H = 120;
  const CELL = 4;
  const canvas = document.getElementById('sand');
  canvas.width = W * CELL;
  canvas.height = H * CELL;
  const ctx = canvas.getContext('2d');

  // Material codes: 0=empty 1=sand 2=water 3=wall 4=acid
  const grid = new Uint8Array(W * H);
  const moved = new Uint8Array(W * H);

  // Initialize solid boundaries (bottom row and side columns)
  (function initBounds() {
    for (let x = 0; x < W; x++) grid[(H-1)*W + x] = 3;
    for (let y = 0; y < H; y++) {
      grid[y*W] = 3;
      grid[y*W + (W-1)] = 3;
    }
  })();

  const COLORS = [null, '#e6c87a', '#4a8de0', '#6e6e6e', '#80ff20'];
  const MAT_NAMES = ['empty', 'sand', 'water', 'wall', 'acid'];

  let currentMat = 1;
  let painting = false;

  const matMap = {
    'mat-sand': 1, 'mat-water': 2, 'mat-wall': 3, 'mat-acid': 4, 'mat-empty': 0
  };

  function selectMat(id) {
    currentMat = matMap[id];
    document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  Object.keys(matMap).forEach(id => {
    document.getElementById(id).addEventListener('click', () => selectMat(id));
  });

  function resetGrid() {
    grid.fill(0);
    for (let x = 0; x < W; x++) grid[(H-1)*W + x] = 3;
    for (let y = 0; y < H; y++) {
      grid[y*W] = 3;
      grid[y*W + (W-1)] = 3;
    }
  }
  document.getElementById('clear').addEventListener('click', resetGrid);

  function paintAt(cx, cy) {
    const px = Math.floor(cx / CELL);
    const py = Math.floor(cy / CELL);
    const radius = 3;
    const r2 = radius * radius;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx*dx + dy*dy > r2) continue;
        const x = px + dx;
        const y = py + dy;
        if (x <= 0 || x >= W-1 || y >= H-1) continue;
        if (y < 0) continue;
        grid[y*W + x] = currentMat;
      }
    }
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  canvas.addEventListener('mousedown', e => {
    painting = true;
    const p = pos(e);
    paintAt(p.x, p.y);
  });
  canvas.addEventListener('mousemove', e => {
    if (!painting) return;
    const p = pos(e);
    paintAt(p.x, p.y);
  });
  window.addEventListener('mouseup', () => { painting = false; });
  canvas.addEventListener('mouseleave', () => { painting = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); painting = true;
    const p = pos(e); paintAt(p.x, p.y);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (painting) { const p = pos(e); paintAt(p.x, p.y); }
  }, { passive: false });
  window.addEventListener('touchend', () => { painting = false; });

  // Try to displace the liquid at (x, y+1) to a neighboring cell
  // and place 'heavier' material at (x, y+1).
  // Prioritizes sideways/downward movement to prevent anti-gravity transport.
  function tryDisplace(x, y, heavier) {
    const bi = (y+1)*W + x;
    const liquid = grid[bi];
    if (liquid !== 2 && liquid !== 4) return false;
    const leftFirst = Math.random() < 0.5;

    // 1. Same-level sideways: (x±1, y+1) — liquid stays at its level
    for (let d = 0; d < 2; d++) {
      const dx = d === 0 ? (leftFirst ? -1 : 1) : (leftFirst ? 1 : -1);
      const nx = x + dx;
      if (nx <= 0 || nx >= W-1) continue;
      const ni = (y+1)*W + nx;
      if (grid[ni] === 0 && !moved[ni]) {
        grid[ni] = liquid;
        grid[bi] = heavier;
        grid[y*W + x] = 0;
        moved[ni] = 1;
        return true;
      }
    }
    // 2. Diagonal down: (x±1, y+2) — liquid sinks further
    for (let d = 0; d < 2; d++) {
      const dx = d === 0 ? (leftFirst ? -1 : 1) : (leftFirst ? 1 : -1);
      const nx = x + dx;
      if (nx <= 0 || nx >= W-1) continue;
      const ny = y + 2;
      if (ny >= H-1) continue;
      const ni = ny*W + nx;
      if (grid[ni] === 0 && !moved[ni]) {
        grid[ni] = liquid;
        grid[bi] = heavier;
        grid[y*W + x] = 0;
        moved[ni] = 1;
        return true;
      }
    }
    // 3. Last resort: sand's level sideways (x±1, y) — liquid shifts up 1
    //    but it will fall back next tick; this prevents deadlocks in
    //    fully enclosed pockets.
    for (let d = 0; d < 2; d++) {
      const dx = d === 0 ? (leftFirst ? -1 : 1) : (leftFirst ? 1 : -1);
      const nx = x + dx;
      if (nx <= 0 || nx >= W-1) continue;
      const ni = y*W + nx;
      if (grid[ni] === 0 && !moved[ni]) {
        grid[ni] = liquid;
        grid[bi] = heavier;
        grid[y*W + x] = 0;
        moved[ni] = 1;
        return true;
      }
    }
    return false;
  }

  function tick(n) {
    for (let step = 0; step < n; step++) {
      moved.fill(0);
      for (let y = H - 2; y >= 0; y--) {
        // Random x order for symmetry
        const xs = new Array(W);
        for (let x = 0; x < W; x++) xs[x] = x;
        for (let i = W - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = xs[i]; xs[i] = xs[j]; xs[j] = tmp;
        }

        for (let xi = 0; xi < W; xi++) {
          const x = xs[xi];
          const i = y*W + x;
          if (moved[i]) continue;
          const mat = grid[i];
          if (mat === 0 || mat === 3) continue;

          const bi = (y+1)*W + x;
          const bmat = grid[bi];

          if (mat === 1) { // SAND
            if (bmat === 0) {
              grid[bi] = 1;
              grid[i] = 0;
              moved[bi] = 1;
            } else if (bmat === 2 || bmat === 4) {
              // Sand sinks in liquid: displace sideways
              if (tryDisplace(x, y, 1)) continue;
              // Can't displace: diagonal slide into empty
              const lf = Math.random() < 0.5;
              for (let d = 0; d < 2; d++) {
                const dx = d === 0 ? (lf ? -1 : 1) : (lf ? 1 : -1);
                const nx = x + dx;
                if (nx <= 0 || nx >= W-1) continue;
                const ni = (y+1)*W + nx;
                if (grid[ni] === 0) {
                  grid[ni] = 1;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                }
              }
            } else {
              // Wall or sand below: diagonal slide
              const lf = Math.random() < 0.5;
              for (let d = 0; d < 2; d++) {
                const dx = d === 0 ? (lf ? -1 : 1) : (lf ? 1 : -1);
                const nx = x + dx;
                if (nx <= 0 || nx >= W-1) continue;
                const ni = (y+1)*W + nx;
                if (grid[ni] === 0) {
                  grid[ni] = 1;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                }
              }
            }
          } else if (mat === 2) { // WATER
            if (bmat === 0) {
              grid[bi] = 2;
              grid[i] = 0;
              moved[bi] = 1;
            } else {
              // Spread sideways into empty
              const lf = Math.random() < 0.5;
              for (let d = 0; d < 2; d++) {
                const dx = d === 0 ? (lf ? -1 : 1) : (lf ? 1 : -1);
                const nx = x + dx;
                if (nx <= 0 || nx >= W-1) continue;
                const ni = y*W + nx;
                if (grid[ni] === 0 && !moved[ni]) {
                  grid[ni] = 2;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                }
              }
            }
          } else if (mat === 4) { // ACID
            if (bmat === 0) {
              grid[bi] = 4;
              grid[i] = 0;
              moved[bi] = 1;
            } else if (bmat === 1 || bmat === 3) {
              // Dissolve: acid moves down, consuming sand/wall
              grid[bi] = 4;
              grid[i] = 0;
              moved[bi] = 1;
            } else if (bmat === 2) {
              // Acid sinks in water
              if (tryDisplace(x, y, 4)) continue;
              // Spread sideways, dissolving sand/wall or moving to empty
              const lf = Math.random() < 0.5;
              for (let d = 0; d < 2; d++) {
                const dx = d === 0 ? (lf ? -1 : 1) : (lf ? 1 : -1);
                const nx = x + dx;
                if (nx <= 0 || nx >= W-1) continue;
                const ni = y*W + nx;
                const nm = grid[ni];
                if (nm === 0 && !moved[ni]) {
                  grid[ni] = 4;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                } else if ((nm === 1 || nm === 3) && !moved[ni]) {
                  grid[ni] = 4;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                }
              }
            } else {
              // Acid below: spread/dissolve sideways
              const lf = Math.random() < 0.5;
              for (let d = 0; d < 2; d++) {
                const dx = d === 0 ? (lf ? -1 : 1) : (lf ? 1 : -1);
                const nx = x + dx;
                if (nx <= 0 || nx >= W-1) continue;
                const ni = y*W + nx;
                const nm = grid[ni];
                if (nm === 0 && !moved[ni]) {
                  grid[ni] = 4;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                } else if ((nm === 1 || nm === 3) && !moved[ni]) {
                  grid[ni] = 4;
                  grid[i] = 0;
                  moved[ni] = 1;
                  break;
                }
              }
            }
          }
        }
      }
    }
  }

  function render() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const m = grid[y*W + x];
        if (m === 0) continue;
        ctx.fillStyle = COLORS[m];
        ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }
    }
  }

  function loop() {
    tick(1);
    render();
    requestAnimationFrame(loop);
  }

  window.sim = {
    w: W,
    h: H,
    tick: tick,
    get: function(x, y) {
      if (x < 0 || x >= W || y < 0 || y >= H) return 'empty';
      return MAT_NAMES[grid[y*W + x]];
    },
    set: function(x, y, material) {
      if (x < 0 || x >= W || y < 0 || y >= H) return;
      const idx = MAT_NAMES.indexOf(material);
      if (idx >= 0) grid[y*W + x] = idx;
    },
    clear: resetGrid
  };

  loop();
})();
</script>
</body>
</html>
