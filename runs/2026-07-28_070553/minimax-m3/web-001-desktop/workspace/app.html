<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubuntu Web Desktop</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Ubuntu', 'Segoe UI', 'Cantarell', system-ui, -apple-system, sans-serif;
  background: #000;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

#desktop {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 18% 22%, rgba(233, 84, 32, 0.18), transparent 55%),
    radial-gradient(ellipse at 82% 78%, rgba(118, 67, 158, 0.18), transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(46, 92, 138, 0.12), transparent 70%),
    linear-gradient(135deg, #14142b 0%, #1f2347 50%, #0c0c1e 100%);
}

#desktop::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg, transparent 0 38px, rgba(255,255,255,0.012) 38px 39px),
    repeating-linear-gradient(-45deg, transparent 0 38px, rgba(255,255,255,0.008) 38px 39px);
  pointer-events: none;
}

/* Top bar (GNOME-style) */
#topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 26px;
  background: rgba(12, 12, 12, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  padding: 0 12px;
  z-index: 100;
  font-size: 12px;
  font-weight: 500;
  user-select: none;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

#topbar .activities {
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 3px;
  transition: background 0.15s;
}
#topbar .activities:hover { background: rgba(255,255,255,0.08); }

#topbar .app-name {
  margin-left: 14px;
  color: #ccc;
  font-weight: 600;
}

#topbar .spacer { flex: 1; }

#topbar .tray {
  display: flex;
  gap: 10px;
  margin-right: 14px;
  font-size: 11px;
  align-items: center;
}

#topbar .clock {
  color: #fff;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* Dock */
#taskbar {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(22, 22, 22, 0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 14px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 50;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
}

.launcher {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: rgba(60, 60, 60, 0.85);
  border: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: transform 0.15s, background 0.15s;
  padding: 0;
  color: #fff;
  position: relative;
}

.launcher:hover {
  background: rgba(90, 90, 90, 0.95);
  transform: scale(1.06);
}

.launcher:active { transform: scale(0.95); }

.launcher::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -10px;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  background: #e95420;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.15s;
}

.launcher.has-open::after { opacity: 1; }

/* Window base */
.window {
  position: absolute;
  background: #1e1e1e;
  color: #e0e0e0;
  border-radius: 10px;
  box-shadow:
    0 14px 44px rgba(0,0,0,0.65),
    0 2px 6px rgba(0,0,0,0.4),
    0 0 0 1px rgba(255,255,255,0.05);
  min-width: 360px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: winOpen 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes winOpen {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.window-titlebar {
  background: linear-gradient(to bottom, #303030, #262626);
  height: 34px;
  display: flex;
  align-items: center;
  padding: 0 6px 0 12px;
  cursor: move;
  user-select: none;
  border-bottom: 1px solid rgba(0,0,0,0.35);
}

.window-title {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: #d0d0d0;
  letter-spacing: 0.3px;
}

.win-close {
  background: transparent;
  border: none;
  color: #aaa;
  cursor: pointer;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  transition: background 0.12s, color 0.12s;
}

.win-close:hover {
  background: #e74c3c;
  color: #fff;
}

.window-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #1e1e1e;
}

/* Files window */
#files-window {
  width: 660px;
  height: 440px;
  top: 80px;
  left: 180px;
}

#files-path-bar {
  display: flex;
  align-items: center;
  padding: 8px;
  background: #252525;
  gap: 8px;
  border-bottom: 1px solid #111;
}

#files-up {
  background: #333;
  border: 1px solid #444;
  color: #ddd;
  width: 30px;
  height: 30px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s;
}

#files-up:hover { background: #444; color: #fff; }
#files-up:disabled { opacity: 0.35; cursor: not-allowed; }

#files-path {
  flex: 1;
  background: #181818;
  padding: 6px 12px;
  border-radius: 6px;
  font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', monospace;
  font-size: 12px;
  color: #a8c5e8;
  border: 1px solid #2a2a2a;
  overflow-x: auto;
  white-space: nowrap;
}

#files-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 6px;
  align-content: start;
}

.fs-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 6px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.1s, border-color 0.1s;
  user-select: none;
  border: 1px solid transparent;
}

.fs-item:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.05);
}

.fs-item.selected {
  background: rgba(233, 84, 32, 0.22);
  border-color: rgba(233, 84, 32, 0.35);
}

.fs-icon {
  font-size: 36px;
  margin-bottom: 6px;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
}

.fs-name {
  font-size: 11px;
  text-align: center;
  word-break: break-word;
  color: #ddd;
  line-height: 1.25;
  max-width: 100%;
}

.fs-empty {
  grid-column: 1 / -1;
  padding: 50px;
  color: #666;
  text-align: center;
  font-size: 12px;
  font-style: italic;
}

/* Notepad window */
#notepad-window {
  width: 680px;
  height: 480px;
  top: 130px;
  left: 360px;
}

#tabs {
  display: flex;
  background: #1a1a1a;
  border-bottom: 1px solid #0d0d0d;
  overflow-x: auto;
  scrollbar-width: thin;
  align-items: stretch;
}

.tab {
  display: flex;
  align-items: center;
  padding: 0 10px;
  background: #161616;
  border-right: 1px solid #0a0a0a;
  cursor: pointer;
  font-size: 12px;
  color: #888;
  height: 32px;
  gap: 8px;
  min-width: 120px;
  max-width: 200px;
  flex-shrink: 0;
  position: relative;
  border-top: 2px solid transparent;
  transition: background 0.1s, color 0.1s;
}

.tab.active {
  background: #1e1e1e;
  color: #fff;
  border-top-color: #e95420;
}

.tab:hover {
  background: #1d1d1d;
  color: #ccc;
}

.tab-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  user-select: none;
}

.tab-close {
  background: transparent;
  border: none;
  color: #777;
  cursor: pointer;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  padding: 0;
  flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
}

.tab-close:hover {
  background: #444;
  color: #fff;
}

#new-tab {
  background: transparent;
  border: none;
  color: #888;
  padding: 0 14px;
  cursor: pointer;
  font-size: 18px;
  height: 32px;
  font-weight: 300;
  flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
}

#new-tab:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

#editor {
  flex: 1;
  background: #1e1e1e;
  color: #e6e6e6;
  border: none;
  padding: 14px;
  font-family: 'Ubuntu Mono', 'Consolas', 'Menlo', 'Courier New', monospace;
  font-size: 13px;
  resize: none;
  outline: none;
  line-height: 1.6;
  tab-size: 4;
}

.hidden { display: none !important; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #1a1a1a; }
::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

/* Toast */
#toast {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(40,40,40,0.95);
  color: #ddd;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 1000;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="desktop">
  <div id="topbar">
    <span class="activities">Activities</span>
    <span class="app-name">Ubuntu Web Desktop</span>
    <span class="spacer"></span>
    <span class="tray">
      <span title="Volume">🔊</span>
      <span title="Network">📶</span>
      <span title="Battery">🔋</span>
    </span>
    <span class="clock" id="clock"></span>
  </div>

  <div id="taskbar">
    <button class="launcher" id="open-files" title="Files">📁</button>
    <button class="launcher" id="open-notepad" title="Notepad">📝</button>
  </div>

  <!-- Files Window -->
  <div class="window" id="files-window">
    <div class="window-titlebar">
      <span class="window-title">Files</span>
      <button class="win-close" aria-label="Close">✕</button>
    </div>
    <div class="window-body">
      <div id="files-path-bar">
        <button id="files-up" title="Go up">↑</button>
        <div id="files-path">/</div>
      </div>
      <div id="files-list"></div>
    </div>
  </div>

  <!-- Notepad Window -->
  <div class="window" id="notepad-window">
    <div class="window-titlebar">
      <span class="window-title">Notepad</span>
      <button class="win-close" aria-label="Close">✕</button>
    </div>
    <div class="window-body">
      <div id="tabs">
        <button id="new-tab" title="New tab">+</button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Start typing..."></textarea>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function() {
'use strict';

/* ===================== Filesystem (static) ===================== */
const filesystem = {
  '/': { dirs: ['bin', 'etc', 'home', 'usr', 'var'], files: [] },
  '/bin': { dirs: [], files: ['bash', 'ls', 'cat', 'cp', 'mv', 'rm', 'mkdir', 'chmod', 'chown', 'grep', 'find'] },
  '/etc': { dirs: ['init.d', 'network', 'systemd', 'ssh'], files: ['hostname', 'hosts', 'passwd', 'fstab', 'profile', 'resolv.conf', 'environment'] },
  '/etc/init.d': { dirs: [], files: ['networking', 'ssh', 'cron', 'apache2', 'mysql'] },
  '/etc/network': { dirs: [], files: ['interfaces', 'interfaces.d'] },
  '/etc/systemd': { dirs: [], files: ['system.conf', 'user.conf'] },
  '/etc/ssh': { dirs: [], files: ['sshd_config', 'ssh_config'] },
  '/home': { dirs: ['user'], files: [] },
  '/home/user': {
    dirs: ['Documents', 'Downloads', 'Pictures', 'Music', 'Videos', '.config', '.cache', '.local'],
    files: ['readme.txt', '.bashrc', '.profile', '.bash_history']
  },
  '/home/user/Documents': {
    dirs: ['Projects', 'Work'],
    files: ['notes.txt', 'report.txt', 'todo.md', 'presentation.odp', 'budget.csv']
  },
  '/home/user/Documents/Projects': {
    dirs: ['webapp', 'scripts'],
    files: ['README.md', 'changelog.txt']
  },
  '/home/user/Documents/Projects/webapp': {
    dirs: [], files: ['app.js', 'index.html', 'style.css', 'package.json']
  },
  '/home/user/Documents/Projects/scripts': {
    dirs: [], files: ['deploy.sh', 'backup.py']
  },
  '/home/user/Documents/Work': {
    dirs: [], files: ['meeting-notes.md', 'q1-summary.txt']
  },
  '/home/user/Downloads': { dirs: [], files: ['installer.deb', 'photo.jpg', 'archive.zip', 'setup.exe', 'presentation.pdf'] },
  '/home/user/Pictures': {
    dirs: ['Wallpapers', 'Screenshots', 'Vacation'],
    files: ['wallpaper.png', 'photo1.jpg', 'profile.png']
  },
  '/home/user/Pictures/Wallpapers': {
    dirs: [], files: ['ubuntu-default.jpg', 'dark.png', 'mountain.jpg', 'aurora.jpg', 'forest.jpg']
  },
  '/home/user/Pictures/Screenshots': {
    dirs: [], files: ['screenshot-2024-01-15.png', 'screenshot-2024-02-03.png', 'screenshot-2024-03-22.png']
  },
  '/home/user/Pictures/Vacation': {
    dirs: [], files: ['beach.jpg', 'sunset.jpg', 'mountain.jpg']
  },
  '/home/user/Music': { dirs: [], files: ['song.mp3', 'album.flac', 'playlist.m3u', 'podcast.mp3'] },
  '/home/user/Videos': { dirs: [], files: ['movie.mp4', 'clip.webm', 'tutorial.mkv'] },
  '/home/user/.config': { dirs: ['gtk-3.0', 'nano', 'code'], files: ['user-dirs.dirs', 'mimeapps.list'] },
  '/home/user/.config/gtk-3.0': { dirs: [], files: ['settings.ini', 'bookmarks'] },
  '/home/user/.config/nano': { dirs: [], files: ['nanorc'] },
  '/home/user/.config/code': { dirs: ['snippets'], files: ['settings.json'] },
  '/home/user/.config/code/snippets': { dirs: [], files: ['javascript.json'] },
  '/home/user/.cache': { dirs: [], files: ['recently-used.xbel', 'thumbnails'] },
  '/home/user/.local': { dirs: ['share'], files: [] },
  '/home/user/.local/share': { dirs: ['applications'], files: ['trashinfo'] },
  '/home/user/.local/share/applications': { dirs: [], files: ['myapp.desktop'] },
  '/usr': { dirs: ['bin', 'lib', 'share', 'local', 'include', 'sbin'], files: [] },
  '/usr/bin': { dirs: [], files: ['firefox', 'gnome-terminal', 'gedit', 'nautilus', 'python3', 'node', 'vim', 'nano'] },
  '/usr/lib': { dirs: ['firefox', 'python3'], files: ['libc.so', 'libm.so', 'libpthread.so'] },
  '/usr/lib/firefox': { dirs: [], files: ['firefox-bin', 'omni.ja', 'libnss3.so'] },
  '/usr/lib/python3': { dirs: [], files: ['os.py', 'sys.py', 'site.py'] },
  '/usr/share': { dirs: ['themes', 'icons', 'fonts', 'applications', 'doc'], files: ['info'] },
  '/usr/share/themes': { dirs: [], files: ['Yaru', 'Adwaita', 'Adwaita-dark', 'HighContrast'] },
  '/usr/share/icons': { dirs: [], files: ['Yaru', 'Papirus', 'Adwaita', 'hicolor'] },
  '/usr/share/fonts': { dirs: ['truetype'], files: [] },
  '/usr/share/fonts/truetype': { dirs: [], files: ['ubuntu', 'dejavu'] },
  '/usr/share/applications': { dirs: [], files: ['firefox.desktop', 'gedit.desktop', 'nautilus.desktop'] },
  '/usr/share/doc': { dirs: [], files: ['copyright', 'README'] },
  '/usr/local': { dirs: ['bin', 'lib', 'share'], files: [] },
  '/usr/local/bin': { dirs: [], files: [] },
  '/usr/local/lib': { dirs: [], files: [] },
  '/usr/local/share': { dirs: [], files: [] },
  '/usr/include': { dirs: [], files: ['stdio.h', 'stdlib.h', 'string.h'] },
  '/usr/sbin': { dirs: [], files: ['sshd', 'cron'] },
  '/var': { dirs: ['log', 'tmp', 'cache', 'lib', 'mail'], files: [] },
  '/var/log': { dirs: [], files: ['syslog', 'auth.log', 'kern.log', 'dmesg', 'dpkg.log', 'Xorg.0.log'] },
  '/var/tmp': { dirs: [], files: [] },
  '/var/cache': { dirs: ['apt'], files: [] },
  '/var/cache/apt': { dirs: ['archives'], files: ['pkgcache.bin', 'srcpkgcache.bin'] },
  '/var/cache/apt/archives': { dirs: [], files: ['firefox.deb', 'libreoffice.deb', 'gimp.deb'] },
  '/var/lib': { dirs: ['apt', 'dpkg'], files: [] },
  '/var/lib/apt': { dirs: [], files: ['extended_states', 'lists'] },
  '/var/lib/dpkg': { dirs: [], files: ['status', 'available', 'info'] },
  '/var/mail': { dirs: [], files: [] }
};

const FILE_ICONS = {
  txt: '📄', md: '📝', json: '📋', js: '📜', html: '🌐', css: '🎨',
  jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', svg: '🖼️', bmp: '🖼️',
  mp3: '🎵', wav: '🎵', flac: '🎵', m3u: '🎵', ogg: '🎵',
  mp4: '🎬', webm: '🎬', mkv: '🎬', avi: '🎬',
  zip: '🗜️', tar: '🗜️', gz: '🗜️', '7z': '🗜️', rar: '🗜️',
  deb: '📦', exe: '⚙️', msi: '⚙️',
  sh: '🐚', py: '🐍', conf: '⚙️', ini: '⚙️',
  so: '⚙️', h: '📘', c: '📘',
  odp: '📊', odt: '📄', pdf: '📕', csv: '📊',
  desktop: '🚀'
};

function getFileIcon(name) {
  const dot = name.lastIndexOf('.');
  if (dot === -1) return '📄';
  const ext = name.substring(dot + 1).toLowerCase();
  return FILE_ICONS[ext] || '📄';
}

function getParent(path) {
  if (path === '/') return null;
  const parts = path.split('/').filter(Boolean);
  parts.pop();
  return '/' + parts.join('/');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ===================== Files App ===================== */
let currentPath = '/';
const filesPathEl = document.getElementById('files-path');
const filesListEl = document.getElementById('files-list');
const filesUpEl = document.getElementById('files-up');

function renderFiles() {
  filesPathEl.textContent = currentPath;
  filesUpEl.disabled = (currentPath === '/');
  filesListEl.innerHTML = '';

  const node = filesystem[currentPath];
  if (!node) {
    const err = document.createElement('div');
    err.className = 'fs-empty';
    err.textContent = 'Path not found';
    filesListEl.appendChild(err);
    return;
  }

  // Directories first
  node.dirs.forEach(name => {
    const el = document.createElement('div');
    el.className = 'fs-item';
    el.innerHTML = `<div class="fs-icon">📁</div><div class="fs-name">${escapeHtml(name)}</div>`;
    el.title = name;
    el.addEventListener('dblclick', () => {
      const newPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
      if (filesystem[newPath] !== undefined) {
        currentPath = newPath;
        renderFiles();
      } else {
        showToast('Folder not accessible');
      }
    });
    filesListEl.appendChild(el);
  });

  // Files
  node.files.forEach(name => {
    const el = document.createElement('div');
    el.className = 'fs-item';
    const icon = getFileIcon(name);
    el.innerHTML = `<div class="fs-icon">${icon}</div><div class="fs-name">${escapeHtml(name)}</div>`;
    el.title = name;
    el.addEventListener('dblclick', () => {
      showToast(`No application installed to open "${name}"`);
    });
    filesListEl.appendChild(el);
  });

  if (node.dirs.length === 0 && node.files.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'fs-empty';
    empty.textContent = 'This folder is empty';
    filesListEl.appendChild(empty);
  }
}

filesUpEl.addEventListener('click', () => {
  const parent = getParent(currentPath);
  if (parent !== null) {
    currentPath = parent;
    renderFiles();
  }
});

/* ===================== Window Management ===================== */
let topZ = 100;

function bringToFront(win) {
  topZ += 1;
  win.style.zIndex = String(topZ);
}

function makeDraggable(win) {
  const titlebar = win.querySelector('.window-titlebar');
  let isDragging = false;
  let startX = 0, startY = 0, startLeft = 0, startTop = 0;

  titlebar.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('win-close')) return;
    if (e.button !== 0) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = win.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    bringToFront(win);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deskRect = document.getElementById('desktop').getBoundingClientRect();
    let newLeft = startLeft + (e.clientX - startX);
    let newTop = startTop + (e.clientY - startY);
    // Keep titlebar visible at all times
    newLeft = Math.max(-win.offsetWidth + 60, Math.min(newLeft, deskRect.width - 60));
    newTop = Math.max(26, Math.min(newTop, deskRect.height - 28));
    win.style.left = newLeft + 'px';
    win.style.top = newTop + 'px';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
}

function updateDockIndicators() {
  const filesVisible = !document.getElementById('files-window').classList.contains('hidden');
  const notepadVisible = !document.getElementById('notepad-window').classList.contains('hidden');
  document.getElementById('open-files').classList.toggle('has-open', filesVisible);
  document.getElementById('open-notepad').classList.toggle('has-open', notepadVisible);
}

function initWindows() {
  document.querySelectorAll('.window').forEach(win => {
    makeDraggable(win);
    win.addEventListener('mousedown', () => bringToFront(win));
    const closeBtn = win.querySelector('.win-close');
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      win.classList.add('hidden');
      updateDockIndicators();
    });
  });
  updateDockIndicators();
}

document.getElementById('open-files').addEventListener('click', () => {
  const win = document.getElementById('files-window');
  win.classList.remove('hidden');
  bringToFront(win);
  updateDockIndicators();
});

document.getElementById('open-notepad').addEventListener('click', () => {
  const win = document.getElementById('notepad-window');
  win.classList.remove('hidden');
  bringToFront(win);
  updateDockIndicators();
});

/* ===================== Toast ===================== */
let toastEl = null;
let toastTimer = null;
function showToast(msg) {
  if (!toastEl) toastEl = document.getElementById('toast');
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 2200);
}

/* ===================== Notepad App ===================== */
const STORAGE_KEY = 'ubuntu-web-notepad-v1';
let tabs = [];
let activeTabId = null;
let tabIdCounter = 0;

const tabsEl = document.getElementById('tabs');
const editorEl = document.getElementById('editor');
const newTabBtn = document.getElementById('new-tab');

function loadTabs() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.tabs) && data.tabs.length > 0) {
        // Validate
        const clean = data.tabs
          .filter(t => t && typeof t.id === 'number' && typeof t.name === 'string')
          .map(t => ({ id: t.id, name: t.name, content: typeof t.content === 'string' ? t.content : '' }));
        if (clean.length > 0) {
          tabs = clean;
          activeTabId = tabs.some(t => t.id === data.activeTabId) ? data.activeTabId : tabs[0].id;
          tabIdCounter = Math.max(
            typeof data.counter === 'number' ? data.counter : 0,
            ...tabs.map(t => t.id)
          );
          return;
        }
      }
    }
  } catch (e) {
    // fall through to default
  }
  createTab('Untitled', false);
}

function saveTabs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tabs: tabs,
      activeTabId: activeTabId,
      counter: tabIdCounter
    }));
  } catch (e) {}
}

function createTab(name, save = true) {
  const tab = {
    id: ++tabIdCounter,
    name: name || 'Untitled',
    content: ''
  };
  tabs.push(tab);
  activeTabId = tab.id;
  if (save) saveTabs();
  renderTabs();
  updateEditor();
  return tab;
}

function renderTabs() {
  // Remove existing tab elements (keep #new-tab)
  Array.from(tabsEl.querySelectorAll('.tab')).forEach(t => t.remove());

  tabs.forEach(tab => {
    const tabEl = document.createElement('div');
    tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    tabEl.dataset.id = String(tab.id);
    tabEl.innerHTML = `<span class="tab-name">${escapeHtml(tab.name)}</span><button class="tab-close" aria-label="Close tab">✕</button>`;

    tabEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-close')) {
        e.stopPropagation();
        closeTab(tab.id);
        return;
      }
      if (activeTabId !== tab.id) {
        activeTabId = tab.id;
        saveTabs();
        renderTabs();
        updateEditor();
      }
      editorEl.focus();
    });

    tabsEl.insertBefore(tabEl, newTabBtn);
  });
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;

  const wasActive = (activeTabId === id);
  tabs.splice(idx, 1);

  if (wasActive) {
    if (tabs.length > 0) {
      // Prefer the tab that took the removed tab's slot (i.e. next sibling)
      activeTabId = tabs[idx] ? tabs[idx].id : tabs[idx - 1].id;
    } else {
      activeTabId = null;
    }
  }

  if (tabs.length === 0) {
    createTab('Untitled');
    return;
  }

  saveTabs();
  renderTabs();
  updateEditor();
}

function updateEditor() {
  const tab = tabs.find(t => t.id === activeTabId);
  editorEl.value = tab ? tab.content : '';
}

editorEl.addEventListener('input', () => {
  const tab = tabs.find(t => t.id === activeTabId);
  if (tab) {
    tab.content = editorEl.value;
    saveTabs();
  }
});

// Prevent tab key in textarea from losing focus; insert spaces instead
editorEl.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editorEl.selectionStart;
    const end = editorEl.selectionEnd;
    const v = editorEl.value;
    editorEl.value = v.substring(0, start) + '    ' + v.substring(end);
    editorEl.selectionStart = editorEl.selectionEnd = start + 4;
    editorEl.dispatchEvent(new Event('input'));
  }
});

newTabBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  createTab('Untitled');
  editorEl.focus();
});

// Keyboard shortcut: Ctrl+T for new tab when notepad is open
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 't') {
    const np = document.getElementById('notepad-window');
    if (!np.classList.contains('hidden')) {
      e.preventDefault();
      createTab('Untitled');
      editorEl.focus();
    }
  }
});

/* ===================== Clock ===================== */
function updateClock() {
  const now = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()}  ${hh}:${mm}:${ss}`;
}

/* ===================== Init ===================== */
function init() {
  initWindows();
  loadTabs();
  renderTabs();
  updateEditor();
  renderFiles();
  updateClock();
  setInterval(updateClock, 1000);
}

init();

})();
