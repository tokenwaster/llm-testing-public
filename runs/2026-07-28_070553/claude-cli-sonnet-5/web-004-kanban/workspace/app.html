<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kanban Board</title>
<style>
  :root {
    --bg: #f4f6fb;
    --col-bg: #e9ecf5;
    --card-bg: #ffffff;
    --accent: #5b6ee1;
    --text: #2a2e3f;
    --muted: #8890a5;
    --border: #d9dded;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 32px 8px;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 1.6rem;
    font-weight: 700;
  }
  .add-row {
    display: flex;
    gap: 8px;
    max-width: 480px;
  }
  #new-card {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    background: var(--card-bg);
  }
  #new-card:focus {
    border-color: var(--accent);
  }
  #add-card {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.15s;
  }
  #add-card:hover {
    background: #4a5bd0;
  }
  .board {
    display: flex;
    gap: 20px;
    padding: 20px 32px 40px;
    align-items: flex-start;
  }
  .column {
    background: var(--col-bg);
    border-radius: 12px;
    flex: 1;
    min-width: 260px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 400px;
    transition: background 0.15s;
  }
  .column.drag-over {
    background: #dde1f5;
    outline: 2px dashed var(--accent);
  }
  .col-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px 12px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text);
  }
  .count {
    background: var(--card-bg);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    min-width: 22px;
    text-align: center;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 60px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 1px 3px rgba(30, 34, 60, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    cursor: grab;
    border: 1px solid transparent;
    word-break: break-word;
  }
  .card:active {
    cursor: grabbing;
  }
  .card.dragging {
    opacity: 0.4;
  }
  .card-title {
    flex: 1;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .card-del {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .card-del:hover {
    background: #ffe4e4;
    color: #d64545;
  }
</style>
</head>
<body>

<header>
  <h1>Kanban Board</h1>
  <div class="add-row">
    <input type="text" id="new-card" placeholder="Add a new card to To Do..." />
    <button id="add-card">Add</button>
  </div>
</header>

<div class="board">
  <div class="column" id="col-todo" data-status="todo">
    <div class="col-header">
      <span>To Do</span>
      <span class="count">0</span>
    </div>
    <div class="cards"></div>
  </div>

  <div class="column" id="col-doing" data-status="doing">
    <div class="col-header">
      <span>Doing</span>
      <span class="count">0</span>
    </div>
    <div class="cards"></div>
  </div>

  <div class="column" id="col-done" data-status="done">
    <div class="col-header">
      <span>Done</span>
      <span class="count">0</span>
    </div>
    <div class="cards"></div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'kanban-board-state';
  var columns = {
    todo: document.getElementById('col-todo'),
    doing: document.getElementById('col-doing'),
    done: document.getElementById('col-done')
  };

  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function uid() {
    return 'c' + Math.floor(Math.random() * 1e9) + '-' + state.length;
  }

  function render() {
    Object.keys(columns).forEach(function (status) {
      var col = columns[status];
      var container = col.querySelector('.cards');
      container.innerHTML = '';
      var items = state.filter(function (c) { return c.status === status; });
      items.forEach(function (item) {
        container.appendChild(buildCardEl(item));
      });
      col.querySelector('.count').textContent = items.length;
    });
  }

  function buildCardEl(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.draggable = true;
    card.dataset.id = item.id;

    var title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = item.title;

    var del = document.createElement('button');
    del.className = 'card-del';
    del.textContent = '\u2715';
    del.setAttribute('aria-label', 'Delete card');
    del.addEventListener('click', function () {
      state = state.filter(function (c) { return c.id !== item.id; });
      saveState();
      render();
    });

    card.appendChild(title);
    card.appendChild(del);

    card.addEventListener('dragstart', function (e) {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', function () {
      card.classList.remove('dragging');
    });

    return card;
  }

  function addCard(title) {
    title = title.trim();
    if (!title) return;
    state.push({ id: uid(), title: title, status: 'todo' });
    saveState();
    render();
  }

  document.getElementById('add-card').addEventListener('click', function () {
    var input = document.getElementById('new-card');
    addCard(input.value);
    input.value = '';
  });

  document.getElementById('new-card').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      addCard(this.value);
      this.value = '';
    }
  });

  Object.keys(columns).forEach(function (status) {
    var col = columns[status];
    col.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function (e) {
      if (e.target === col) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      var id = e.dataTransfer.getData('text/plain');
      var item = state.find(function (c) { return c.id === id; });
      if (item) {
        item.status = status;
        saveState();
        render();
      }
    });
  });

  render();
})();
</script>

</body>
</html>
