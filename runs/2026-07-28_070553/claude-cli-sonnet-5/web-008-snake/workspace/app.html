<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #12141a;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 100vh;
    box-sizing: border-box;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
    color: #7CFC98;
    text-shadow: 0 0 12px rgba(124, 252, 152, 0.4);
  }
  #board-wrap {
    position: relative;
    border-radius: 12px;
    padding: 10px;
    background: #1b1e27;
    box-shadow: 0 0 0 1px #2b2f3a, 0 8px 30px rgba(0,0,0,0.5);
  }
  #snake {
    display: block;
    background: #0d0f14;
    border-radius: 6px;
    width: 400px;
    height: 400px;
  }
  #overlay {
    position: absolute;
    inset: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 16, 0.75);
    border-radius: 6px;
    font-size: 24px;
    font-weight: 600;
    color: #ff6b6b;
    text-align: center;
    flex-direction: column;
    gap: 6px;
  }
  #overlay span.sub {
    font-size: 14px;
    font-weight: 400;
    color: #ccc;
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 18px;
  }
  #score-label {
    color: #999;
    margin-right: 6px;
  }
  #score {
    font-weight: 700;
    color: #7CFC98;
    font-size: 22px;
    min-width: 2ch;
    display: inline-block;
    text-align: center;
  }
  #controls {
    display: flex;
    gap: 10px;
  }
  button {
    background: #23283a;
    color: #e6e6e6;
    border: 1px solid #3a4256;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover {
    background: #2f3650;
  }
  button:active {
    transform: scale(0.96);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #hint {
    color: #666;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="hud">
    <div><span id="score-label">Score:</span><span id="score">0</span></div>
  </div>
  <div id="board-wrap">
    <canvas id="snake" width="400" height="400"></canvas>
    <div id="overlay"><div>Game Over</div><span class="sub">Press Reset to try again</span></div>
  </div>
  <div id="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
  <div id="hint">Use arrow keys to steer</div>

<script>
(function () {
  const COLS = 20;
  const ROWS = 20;
  const CELL = 20; // 20 * 20 = 400 CSS px

  const canvas = document.getElementById('snake');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlayEl = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const pauseBtn = document.getElementById('pause');
  const resetBtn = document.getElementById('reset');

  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

  let state = null;
  let timer = null;
  let running = false;
  const TICK_MS = 120;

  function freshState() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    // snake body, head first; starts moving right, length 3
    const snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
    ];
    const s = {
      snake,
      dir: 'right',
      pendingDir: 'right',
      alive: true,
      score: 0,
      food: null,
    };
    s.food = placeFood(s);
    return s;
  }

  function placeFood(s) {
    const occupied = new Set(s.snake.map(p => p.x + ',' + p.y));
    const free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        const key = x + ',' + y;
        if (!occupied.has(key)) free.push({ x, y });
      }
    }
    if (free.length === 0) return s.food || { x: 0, y: 0 };
    const pick = free[Math.floor(pseudoRandom() * free.length)];
    return pick;
  }

  // simple deterministic-ish random (Math.random is fine here; no replay requirement)
  function pseudoRandom() {
    return Math.random();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(COLS * CELL, y * CELL + 0.5);
      ctx.stroke();
    }

    // food
    if (state.food) {
      ctx.fillStyle = '#ff6b6b';
      const fx = state.food.x * CELL;
      const fy = state.food.y * CELL;
      ctx.beginPath();
      ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // snake
    state.snake.forEach((seg, i) => {
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#7CFC98' : '#3fa966';
      const px = seg.x * CELL;
      const py = seg.y * CELL;
      const pad = 1.5;
      const r = 4;
      roundRect(ctx, px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, r);
      ctx.fill();
    });

    overlayEl.style.display = state.alive ? 'none' : 'flex';
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function updateScore() {
    scoreEl.textContent = String(state.score);
  }

  function setDir(dir) {
    if (!DIRS[dir]) return;
    if (!state.alive) return;
    // ignore 180 reversal relative to current committed direction
    if (OPPOSITE[dir] === state.dir) return;
    state.pendingDir = dir;
  }

  function tick() {
    if (!state.alive) return;

    state.dir = state.pendingDir;
    const d = DIRS[state.dir];
    const head = state.snake[0];
    const newHead = { x: head.x + d.x, y: head.y + d.y };

    // wall collision
    if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
      state.alive = false;
      stopLoop();
      draw();
      return;
    }

    // self collision — check against body (excluding tail cell that will move away,
    // unless snake is about to eat and tail stays)
    const willEat = state.food && newHead.x === state.food.x && newHead.y === state.food.y;
    const bodyToCheck = willEat ? state.snake : state.snake.slice(0, state.snake.length - 1);
    const hitsSelf = bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y);
    if (hitsSelf) {
      state.alive = false;
      stopLoop();
      draw();
      return;
    }

    state.snake.unshift(newHead);
    if (willEat) {
      state.score += 1;
      state.food = placeFood(state);
    } else {
      state.snake.pop();
    }

    draw();
    updateScore();
  }

  function startLoop() {
    if (timer) return;
    if (!state.alive) return;
    running = true;
    timer = setInterval(tick, TICK_MS);
  }

  function stopLoop() {
    running = false;
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  function reset() {
    stopLoop();
    state = freshState();
    draw();
    updateScore();
  }

  // wire up buttons
  startBtn.addEventListener('click', () => startLoop());
  pauseBtn.addEventListener('click', () => stopLoop());
  resetBtn.addEventListener('click', () => reset());

  window.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: 'up',
      ArrowDown: 'down',
      ArrowLeft: 'left',
      ArrowRight: 'right',
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      setDir(dir);
    }
  });

  // initialize
  reset();

  // Programmatic API required for grading
  window.game = {
    w: COLS,
    h: ROWS,
    reset() {
      reset();
    },
    tick() {
      tick();
    },
    setDir(dir) {
      setDir(dir);
    },
    setFood(x, y) {
      state.food = { x, y };
      draw();
    },
    snake() {
      return state.snake.map(seg => [seg.x, seg.y]);
    },
    food() {
      return state.food ? [state.food.x, state.food.y] : null;
    },
    alive() {
      return state.alive;
    },
    score() {
      return state.score;
    },
  };
})();
</script>
</body>
</html>
