<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorting Visualizer</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1b1e2b;
    --accent: #5dd6ff;
    --compare: #ff5d7a;
    --sorted: #4ade80;
    --text: #e6e8ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-weight: 500; letter-spacing: 0.5px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #333850;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  button:hover { background: #262a3c; }
  button:active { transform: translateY(1px); }
  label { font-size: 14px; color: #9aa0b4; display: flex; align-items: center; gap: 6px; }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #333850;
    padding: 6px 10px;
    border-radius: 6px;
  }
  #bars {
    width: 90vw;
    max-width: 900px;
    height: 400px;
    background: var(--panel);
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 10px;
  }
  .bar {
    background: var(--accent);
    flex: 1;
    border-radius: 3px 3px 0 0;
    transition: height 0.08s linear, background 0.08s linear;
  }
  .bar.compare { background: var(--compare); }
  .bar.sorted { background: var(--sorted); }
  .status { margin-top: 12px; color: #9aa0b4; font-size: 13px; height: 18px; }
</style>
</head>
<body>

<h1>Sorting Visualizer</h1>

<div class="controls">
  <button id="sort">Sort</button>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset</button>
  <label>Speed <input type="range" id="speed" min="1" max="100" value="60"></label>
</div>

<div id="bars"></div>
<div class="status" id="status"></div>

<script>
(function() {
  const barsEl = document.getElementById('bars');
  const statusEl = document.getElementById('status');
  const speedEl = document.getElementById('speed');

  let array = [];
  let originalArray = [];

  // insertion sort state, driven step by step
  let i = 1;
  let j = 0;
  let phase = 'outer'; // 'outer' -> pick next i; 'inner' -> compare/shift
  let key = null;
  let done = false;
  let compareIdx = [-1, -1];

  function randomArray(n) {
    const a = [];
    for (let k = 0; k < n; k++) a.push(Math.floor(Math.random() * 95) + 5);
    return a;
  }

  function resetSortState() {
    i = 1;
    j = 0;
    phase = 'outer';
    key = null;
    done = array.length <= 1;
    compareIdx = [-1, -1];
  }

  function render() {
    barsEl.innerHTML = '';
    const max = Math.max(...array, 1);
    array.forEach((v, idx) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = (v / max * 100) + '%';
      if (done) {
        bar.classList.add('sorted');
      } else if (idx === compareIdx[0] || idx === compareIdx[1]) {
        bar.classList.add('compare');
      }
      barsEl.appendChild(bar);
    });
  }

  function isSorted() {
    for (let k = 1; k < array.length; k++) {
      if (array[k - 1] > array[k]) return false;
    }
    return true;
  }

  // One step of insertion sort.
  function sortStep() {
    if (array.length <= 1) { done = true; render(); return true; }
    if (done) { render(); return true; }

    if (phase === 'outer') {
      if (i >= array.length) {
        done = true;
        compareIdx = [-1, -1];
        render();
        return true;
      }
      key = array[i];
      j = i - 1;
      phase = 'inner';
      compareIdx = [j, i];
      render();
      return false;
    }

    // phase === 'inner'
    if (j >= 0 && array[j] > key) {
      array[j + 1] = array[j];
      compareIdx = [j, j + 1];
      j--;
      render();
      return false;
    } else {
      array[j + 1] = key;
      i++;
      phase = 'outer';
      compareIdx = [-1, -1];
      render();
      return false;
    }
  }

  function setArray(a) {
    array = a.slice();
    resetSortState();
    render();
  }

  let animating = false;
  let timer = null;

  function stopAnimation() {
    animating = false;
    if (timer) { clearTimeout(timer); timer = null; }
  }

  function animateSort() {
    if (animating) return;
    animating = true;
    statusEl.textContent = 'Sorting...';

    function step() {
      if (!animating) return;
      const finished = sortStep();
      if (finished) {
        animating = false;
        statusEl.textContent = 'Sorted!';
        return;
      }
      const speed = Number(speedEl.value); // 1..100
      const delay = Math.max(2, 220 - speed * 2);
      timer = setTimeout(step, delay);
    }
    step();
  }

  document.getElementById('sort').addEventListener('click', () => {
    animateSort();
  });

  document.getElementById('shuffle').addEventListener('click', () => {
    stopAnimation();
    statusEl.textContent = '';
    const n = originalArray.length || 30;
    originalArray = randomArray(n);
    setArray(originalArray);
  });

  document.getElementById('reset').addEventListener('click', () => {
    stopAnimation();
    statusEl.textContent = '';
    setArray(originalArray);
  });

  // init
  originalArray = randomArray(30);
  setArray(originalArray);

  window.viz = {
    array: () => array.slice(),
    setArray: (a) => {
      stopAnimation();
      statusEl.textContent = '';
      originalArray = a.slice();
      setArray(a);
    },
    sortStep: () => sortStep(),
    sorted: () => isSorted(),
  };
})();
</script>

</body>
</html>
