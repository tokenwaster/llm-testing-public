<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billiards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
}
#instructions {
  background: rgba(0,0,0,0.7);
  padding: 10px 20px;
  border-radius: 8px;
  margin-bottom: 10px;
  text-align: center;
  font-size: 14px;
  max-width: 800px;
}
#instructions h2 { margin-bottom: 5px; color: #f0c040; }
#instructions p { margin: 3px 0; }
canvas {
  border: 4px solid #5c3a1e;
  border-radius: 4px;
  cursor: crosshair;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
#controls { margin-top: 10px; }
#resetBtn {
  background: #c0392b;
  color: #fff;
  border: none;
  padding: 10px 24px;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
#resetBtn:hover { background: #e74c3c; }
#status { margin-top: 8px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<div id="instructions">
  <h2>🎱 Billiards</h2>
  <p><strong>How to shoot:</strong> Click on the white cue ball, drag backward to aim (opposite direction of shot).</p>
  <p>Longer drag = more power. Release to strike!</p>
  <p>A dotted line shows the shot direction while aiming.</p>
</div>
<canvas id="table"></canvas>
<div id="controls">
  <button id="resetBtn">Reset / Rack</button>
</div>
<div id="status"></div>

<script>
(function() {
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');

  const W = 800;
  const H = 400;
  const R = 12;
  const POCKET_R = 22;
  const FRICTION = 0.985;
  const MIN_SPEED = 0.5;

  canvas.width = W;
  canvas.height = H;

  const pockets = [
    { x: 0, y: 0 },
    { x: W / 2, y: 0 },
    { x: W, y: 0 },
    { x: 0, y: H },
    { x: W / 2, y: H },
    { x: W, y: H }
  ];

  const ballColors = [
    '#ffffff','#f4d03f','#2e86c1','#e74c3c','#8e44ad',
    '#e67e22','#27ae60','#922b21','#1c1c1c','#f4d03f',
    '#2e86c1','#e74c3c','#8e44ad','#e67e22','#27ae60','#922b21'
  ];

  let balls = [];
  let paused = false;
  let animId = null;
  let lastTime = null;
  let aiming = false;
  let aimCurrent = { x: 0, y: 0 };

  function createStandardRack() {
    const result = [];
    result.push({ x: W * 0.25, y: H / 2, vx: 0, vy: 0, cue: true, color: '#ffffff', number: 0, striped: false });

    const startX = W * 0.7;
    const startY = H / 2;
    const spacing = R * 2.15;
    const rackOrder = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15];
    let idx = 0;
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col <= row; col++) {
        const bx = startX + row * spacing * (Math.sqrt(3) / 2);
        const by = startY + (col - row / 2) * spacing;
        const ballNum = rackOrder[idx];
        result.push({
          x: bx, y: by, vx: 0, vy: 0, cue: false,
          color: ballColors[ballNum], number: ballNum, striped: ballNum > 8
        });
        idx++;
      }
    }
    return result;
  }

  function reset(ballsInput) {
    balls = [];
    if (ballsInput && ballsInput.length > 0) {
      for (let i = 0; i < ballsInput.length; i++) {
        const b = ballsInput[i];
        balls.push({
          x: b.x, y: b.y, vx: b.vx || 0, vy: b.vy || 0,
          cue: !!b.cue, potted: false,
          color: b.cue ? '#ffffff' : (ballColors[i] || '#cccccc'),
          number: i, striped: i > 8
        });
      }
    } else {
      balls = createStandardRack();
    }
    draw();
  }

  function step(dt) {
    if (dt <= 0) return;
    const subSteps = 4;
    const subDt = dt / subSteps;

    for (let s = 0; s < subSteps; s++) {
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (b.potted) continue;
        b.x += b.vx * subDt;
        b.y += b.vy * subDt;
      }

      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (b.potted) continue;
        let nearPocket = false;
        for (let p = 0; p < pockets.length; p++) {
          const dx = b.x - pockets[p].x;
          const dy = b.y - pockets[p].y;
          if (Math.sqrt(dx * dx + dy * dy) < POCKET_R + R * 0.5) {
            nearPocket = true;
            break;
          }
        }
        if (!nearPocket) {
          if (b.x - R < 0) { b.x = R; b.vx = Math.abs(b.vx); }
          if (b.x + R > W) { b.x = W - R; b.vx = -Math.abs(b.vx); }
          if (b.y - R < 0) { b.y = R; b.vy = Math.abs(b.vy); }
          if (b.y + R > H) { b.y = H - R; b.vy = -Math.abs(b.vy); }
        }
      }

      for (let i = 0; i < balls.length; i++) {
        if (balls[i].potted) continue;
        for (let j = i + 1; j < balls.length; j++) {
          if (balls[j].potted) continue;
          resolveBallCollision(balls[i], balls[j]);
        }
      }

      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (b.potted) continue;
        for (let p = 0; p < pockets.length; p++) {
          const dx = b.x - pockets[p].x;
          const dy = b.y - pockets[p].y;
          if (Math.sqrt(dx * dx + dy * dy) < POCKET_R) {
            b.potted = true;
            b.vx = 0;
            b.vy = 0;
            break;
          }
        }
      }
    }

    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (b.potted) continue;
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (speed < MIN_SPEED) { b.vx = 0; b.vy = 0; }
    }
  }

  function resolveBallCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = R * 2;
    if (dist < minDist && dist > 0.001) {
      const nx = dx / dist;
      const ny = dy / dist;
      const dvx = a.vx - b.vx;
      const dvy = a.vy - b.vy;
      const dvn = dvx * nx + dvy * ny;
      if (dvn > 0) {
        a.vx -= dvn * nx;
        a.vy -= dvn * ny;
        b.vx += dvn * nx;
        b.vy += dvn * ny;
      }
      const overlap = minDist - dist;
      const sep = overlap / 2 + 0.1;
      a.x -= sep * nx;
      a.y -= sep * ny;
      b.x += sep * nx;
      b.y += sep * ny;
    }
  }

  function state() {
    return balls.map(b => ({
      x: b.x, y: b.y, vx: b.vx, vy: b.vy,
      potted: !!b.potted, cue: !!b.cue
    }));
  }

  function shoot(vx, vy) {
    for (let i = 0; i < balls.length; i++) {
      if (balls[i].cue && !balls[i].potted) {
        balls[i].vx = vx;
        balls[i].vy = vy;
        break;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#0d6b3a';
    ctx.fillRect(0, 0, W, H);

    // Subtle felt pattern
    ctx.fillStyle = 'rgba(0,80,30,0.3)';
    for (let i = 0; i < 200; i++) {
      const fx = (i * 137.5) % W;
      const fy = (i * 97.3) % H;
      ctx.fillRect(fx, fy, 1, 1);
    }

    // Rails
    ctx.fillStyle = '#4a2810';
    ctx.fillRect(0, 0, W, 5);
    ctx.fillRect(0, H - 5, W, 5);
    ctx.fillRect(0, 0, 5, H);
    ctx.fillRect(W - 5, 0, 5, H);

    // Cushion edge
    ctx.strokeStyle = '#1a8a4a';
    ctx.lineWidth = 2;
    ctx.strokeRect(4, 4, W - 8, H - 8);

    // Pockets
    for (let p = 0; p < pockets.length; p++) {
      ctx.beginPath();
      ctx.arc(pockets[p].x, pockets[p].y, POCKET_R, 0, Math.PI * 2);
      ctx.fillStyle = '#0a0a0a';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pockets[p].x, pockets[p].y, POCKET_R - 3, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
    }

    // Head string
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.moveTo(W * 0.25, 8);
    ctx.lineTo(W * 0.25, H - 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);

    // Balls
    for (let i = 0; i < balls.length; i++) {
      if (!balls[i].potted) drawBall(balls[i]);
    }

    // Aim line
    if (aiming) {
      const cue = getCueBall();
      if (cue && !cue.potted) {
        const dx = cue.x - aimCurrent.x;
        const dy = cue.y - aimCurrent.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          const nx = dx / dist;
          const ny = dy / dist;

          // Shot direction line
          ctx.beginPath();
          ctx.setLineDash([6, 4]);
          ctx.moveTo(cue.x, cue.y);
          ctx.lineTo(cue.x + nx * 300, cue.y + ny * 300);
          ctx.strokeStyle = 'rgba(255,255,255,0.6)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.setLineDash([]);

          // Pull-back line
          ctx.beginPath();
          ctx.moveTo(cue.x, cue.y);
          ctx.lineTo(aimCurrent.x, aimCurrent.y);
          ctx.strokeStyle = 'rgba(255,80,80,0.7)';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // Power label
          const power = Math.min(dist / 200, 1);
          ctx.fillStyle = '#fff';
          ctx.font = '11px Arial';
          ctx.textAlign = 'left';
          ctx.fillText('Power: ' + Math.round(power * 100) + '%', cue.x + 18, cue.y - 18);
        }
      }
    }
  }

  function drawBall(b) {
    // Shadow
    ctx.beginPath();
    ctx.arc(b.x + 2, b.y + 2, R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    if (b.striped) {
      // White base
      ctx.beginPath();
      ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      // Color stripe band
      ctx.save();
      ctx.beginPath();
      ctx.rect(b.x - R, b.y - R * 0.4, R * 2, R * 0.8);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
    }

    // Highlight
    ctx.beginPath();
    ctx.arc(b.x - R * 0.3, b.y - R * 0.3, R * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();

    // Border
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Number circle and text
    if (!b.cue && b.number > 0) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold ' + Math.round(R * 0.65) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(b.number), b.x, b.y + 0.5);
    }
  }

  function getCueBall() {
    for (let i = 0; i < balls.length; i++) {
      if (balls[i].cue) return balls[i];
    }
    return null;
  }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  canvas.addEventListener('mousedown', function(e) {
    const pos = getMousePos(e);
    const cue = getCueBall();
    if (!cue || cue.potted) return;
    const dx = pos.x - cue.x;
    const dy = pos.y - cue.y;
    if (Math.sqrt(dx * dx + dy * dy) < R * 3) {
      aiming = true;
      aimCurrent = { x: pos.x, y: pos.y };
    }
  });

  canvas.addEventListener('mousemove', function(e) {
    if (!aiming) return;
    aimCurrent = getMousePos(e);
    draw();
  });

  canvas.addEventListener('mouseup', function(e) {
    if (!aiming) return;
    aiming = false;
    const cue = getCueBall();
    if (!cue || cue.potted) { draw(); return; }
    const dx = cue.x - aimCurrent.x;
    const dy = cue.y - aimCurrent.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 10) {
      const power = Math.min(dist / 200, 1);
      const maxSpeed = 800;
      const speed = power * maxSpeed;
      const nx = dx / dist;
      const ny = dy / dist;
      shoot(nx * speed, ny * speed);
    }
    draw();
  });

  canvas.addEventListener('mouseleave', function() {
    if (aiming) { aiming = false; draw(); }
  });

  // Touch support
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    canvas.dispatchEvent(new MouseEvent('mouseup', {}));
  }, { passive: false });

  function gameLoop(timestamp) {
    if (!paused) {
      if (lastTime === null) lastTime = timestamp;
      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      if (dt > 0.05) dt = 0.05;
      step(dt);
      draw();
      updateStatus();
    } else {
      lastTime = null;
    }
    animId = requestAnimationFrame(gameLoop);
  }

  function updateStatus() {
    const el = document.getElementById('status');
    const potted = balls.filter(b => b.potted && !b.cue).length;
    const total = balls.filter(b => !b.cue).length;
    const cuePotted = balls.find(b => b.cue && b.potted);
    let text = 'Balls potted: ' + potted + '/' + total;
    if (cuePotted) text += ' | Scratch!';
    el.textContent = text;
  }

  function pause() { paused = true; }
  function resume() { paused = false; lastTime = null; }

  document.getElementById('resetBtn').addEventListener('click', function() {
    reset();
  });

  window.sim = {
    W: W, H: H, R: R,
    reset: reset,
    step: step,
    state: state,
    shoot: shoot,
    pause: pause,
    resume: resume
  };

  reset();
  animId = requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
