<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    color: #4ecca3;
    text-shadow: 0 0 10px rgba(78, 204, 163, 0.3);
  }
  #score {
    font-size: 1.4rem;
    margin-bottom: 12px;
    color: #f0f0f0;
    background: #16213e;
    padding: 6px 20px;
    border-radius: 8px;
    border: 1px solid #0f3460;
  }
  #snake {
    border: 2px solid #4ecca3;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(78, 204, 163, 0.2);
    display: block;
  }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  button {
    background: #16213e;
    color: #4ecca3;
    border: 1px solid #4ecca3;
    padding: 8px 20px;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover {
    background: #4ecca3;
    color: #1a1a2e;
  }
  #status {
    margin-top: 10px;
    font-size: 1rem;
    color: #e94560;
    min-height: 1.4em;
  }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">Score: 0</div>
<canvas id="snake" width="400" height="400"></canvas>
<div class="controls">
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
</div>
<div id="status"></div>
<script>
(function() {
  const canvas = document.getElementById('snake');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');

  const COLS = 20;
  const ROWS = 20;
  const CELL = canvas.width / COLS;

  let snakeBody = [];
  let foodPos = [];
  let currentDir = 'right';
  let nextDir = 'right';
  let isAlive = true;
  let currentScore = 0;
  let intervalId = null;
  let gameStarted = false;

  const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };

  function initGame() {
    snakeBody = [
      [5, 10],
      [4, 10],
      [3, 10]
    ];
    currentDir = 'right';
    nextDir = 'right';
    isAlive = true;
    currentScore = 0;
    placeFoodRandom();
    updateScoreDisplay();
    statusEl.textContent = '';
    draw();
  }

  function placeFoodRandom() {
    const occupied = new Set(snakeBody.map(s => s[0] + ',' + s[1]));
    const free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!occupied.has(x + ',' + y)) {
          free.push([x, y]);
        }
      }
    }
    if (free.length > 0) {
      foodPos = free[Math.floor(Math.random() * free.length)];
    }
  }

  function updateScoreDisplay() {
    scoreEl.textContent = 'Score: ' + currentScore;
  }

  function draw() {
    // Background
    ctx.fillStyle = '#0f0f23';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(canvas.width, y * CELL);
      ctx.stroke();
    }

    // Food
    if (foodPos.length === 2) {
      const fx = foodPos[0] * CELL;
      const fy = foodPos[1] * CELL;
      ctx.fillStyle = '#e94560';
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Snake
    for (let i = snakeBody.length - 1; i >= 0; i--) {
      const seg = snakeBody[i];
      const sx = seg[0] * CELL;
      const sy = seg[1] * CELL;
      const pad = 1;

      if (i === 0) {
        // Head
        ctx.fillStyle = '#4ecca3';
        ctx.shadowColor = '#4ecca3';
        ctx.shadowBlur = 6;
      } else {
        // Body - gradient from bright to darker
        const t = i / snakeBody.length;
        const r = Math.round(78 - t * 30);
        const g = Math.round(204 - t * 80);
        const b = Math.round(163 - t * 60);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.shadowBlur = 0;
      }

      const radius = 4;
      const x = sx + pad;
      const y = sy + pad;
      const w = CELL - pad * 2;
      const h = CELL - pad * 2;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes on head
      if (i === 0) {
        ctx.fillStyle = '#0f0f23';
        let ex1, ey1, ex2, ey2;
        const ec = CELL / 2;
        const eo = CELL / 5;
        const es = 2.5;
        if (currentDir === 'right') {
          ex1 = sx + ec + 3; ey1 = sy + ec - eo;
          ex2 = sx + ec + 3; ey2 = sy + ec + eo;
        } else if (currentDir === 'left') {
          ex1 = sx + ec - 3; ey1 = sy + ec - eo;
          ex2 = sx + ec - 3; ey2 = sy + ec + eo;
        } else if (currentDir === 'up') {
          ex1 = sx + ec - eo; ey1 = sy + ec - 3;
          ex2 = sx + ec + eo; ey2 = sy + ec - 3;
        } else {
          ex1 = sx + ec - eo; ey1 = sy + ec + 3;
          ex2 = sx + ec + eo; ey2 = sy + ec + 3;
        }
        ctx.beginPath();
        ctx.arc(ex1, ey1, es, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex2, ey2, es, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Game over overlay
    if (!isAlive) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 36px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 15);
      ctx.fillStyle = '#e0e0e0';
      ctx.font = '18px Segoe UI, sans-serif';
      ctx.fillText('Score: ' + currentScore, canvas.width / 2, canvas.height / 2 + 20);
    }
  }

  function tick() {
    if (!isAlive) return;

    currentDir = nextDir;

    const head = snakeBody[0];
    let nx = head[0];
    let ny = head[1];

    if (currentDir === 'up') ny--;
    else if (currentDir === 'down') ny++;
    else if (currentDir === 'left') nx--;
    else if (currentDir === 'right') nx++;

    // Wall collision
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
      isAlive = false;
      statusEl.textContent = 'Game Over! Hit the wall.';
      stopLoop();
      draw();
      return;
    }

    // Self collision (check against all body segments)
    for (let i = 0; i < snakeBody.length; i++) {
      if (snakeBody[i][0] === nx && snakeBody[i][1] === ny) {
        isAlive = false;
        statusEl.textContent = 'Game Over! Hit yourself.';
        stopLoop();
        draw();
        return;
      }
    }

    // Move
    snakeBody.unshift([nx, ny]);

    // Check food
    if (nx === foodPos[0] && ny === foodPos[1]) {
      currentScore++;
      updateScoreDisplay();
      placeFoodRandom();
    } else {
      snakeBody.pop();
    }

    draw();
  }

  function setDir(dir) {
    if (!isAlive) return;
    if (dir === opposites[currentDir]) return;
    nextDir = dir;
  }

  function startLoop() {
    if (intervalId !== null) return;
    gameStarted = true;
    intervalId = setInterval(tick, 120);
  }

  function stopLoop() {
    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }

  // Expose API
  window.game = {
    w: COLS,
    h: ROWS,
    reset: function() {
      stopLoop();
      gameStarted = false;
      initGame();
    },
    tick: function() {
      tick();
    },
    setDir: function(dir) {
      setDir(dir);
    },
    setFood: function(x, y) {
      foodPos = [x, y];
      draw();
    },
    snake: function() {
      return snakeBody.map(s => [s[0], s[1]]);
    },
    food: function() {
      return [foodPos[0], foodPos[1]];
    },
    alive: function() {
      return isAlive;
    },
    score: function() {
      return currentScore;
    }
  };

  // Button handlers
  document.getElementById('start').addEventListener('click', function() {
    if (!isAlive) {
      initGame();
    }
    startLoop();
  });

  document.getElementById('pause').addEventListener('click', function() {
    stopLoop();
  });

  document.getElementById('reset').addEventListener('click', function() {
    stopLoop();
    gameStarted = false;
    initGame();
  });

  // Keyboard
  document.addEventListener('keydown', function(e) {
    const keyMap = {
      'ArrowUp': 'up',
      'ArrowDown': 'down',
      'ArrowLeft': 'left',
      'ArrowRight': 'right'
    };
    if (keyMap[e.key]) {
      e.preventDefault();
      setDir(keyMap[e.key]);
      if (!gameStarted && isAlive) {
        startLoop();
      }
    }
  });

  // Init
  initGame();
})();
</script>
</body>
</html>
