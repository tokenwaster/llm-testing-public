<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Algorithm Visualizer</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
  color: #00d4ff;
  font-size: 1.5rem;
}

#controls {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

button {
  background: #16213e;
  color: #00d4ff;
  border: 1px solid #00d4ff;
  padding: 10px 24px;
  font-size: 1rem;
  font-family: monospace;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.2s, transform 0.1s;
}

button:hover {
  background: #0f3460;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

#bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  width: 90vw;
  max-width: 1200px;
  height: 500px;
  background: #0f0f23;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px;
}

.bar {
  flex: 1;
  background: linear-gradient(to top, #00d4ff, #0077b6);
  border-radius: 2px 2px 0 0;
  transition: height 0.05s ease;
  min-width: 2px;
}

.bar.comparing {
  background: linear-gradient(to top, #ff6b6b, #ee5a24);
}

.bar.sorted {
  background: linear-gradient(to top, #00e676, #00c853);
}

#status {
  margin-top: 15px;
  font-size: 0.9rem;
  color: #888;
}
</style>
</head>
<body>
<h1>Sorting Algorithm Visualizer</h1>
<div id="controls">
  <button id="sort">Sort</button>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset</button>
</div>
<div id="bars"></div>
<div id="status">Ready</div>

<script>
(function() {
  const ARRAY_SIZE = 60;
  const MAX_VALUE = 100;
  let arr = [];
  let sortState = null;
  let animating = false;
  let animTimer = null;

  const barsContainer = document.getElementById('bars');
  const statusEl = document.getElementById('status');

  function generateArray() {
    const a = [];
    for (let i = 0; i < ARRAY_SIZE; i++) {
      a.push(Math.floor(Math.random() * MAX_VALUE) + 1);
    }
    return a;
  }

  function renderBars() {
    barsContainer.innerHTML = '';
    const maxVal = Math.max(...arr, 1);
    for (let i = 0; i < arr.length; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = (arr[i] / maxVal * 100) + '%';
      barsContainer.appendChild(bar);
    }
  }

  function highlightBars(indices, className) {
    const bars = barsContainer.querySelectorAll('.bar');
    indices.forEach(i => {
      if (bars[i]) bars[i].classList.add(className);
    });
  }

  function clearHighlights() {
    const bars = barsContainer.querySelectorAll('.bar');
    bars.forEach(b => {
      b.classList.remove('comparing');
      b.classList.remove('sorted');
    });
  }

  function isSorted() {
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] < arr[i - 1]) return false;
    }
    return true;
  }

  // Bubble sort state
  function initSort() {
    sortState = {
      i: 0,
      j: 0,
      n: arr.length,
      done: false
    };
  }

  function sortStep() {
    if (!sortState) {
      initSort();
    }

    if (sortState.done) {
      return true;
    }

    // If already sorted, mark done
    if (isSorted()) {
      sortState.done = true;
      return true;
    }

    const { n } = sortState;
    const j = sortState.j;
    const boundary = n - 1 - sortState.i;

    if (j >= boundary) {
      // Move to next pass
      sortState.i++;
      sortState.j = 0;

      if (sortState.i >= n - 1) {
        sortState.done = true;
        return true;
      }
      return false;
    }

    // Compare and potentially swap
    if (arr[j] > arr[j + 1]) {
      const temp = arr[j];
      arr[j] = arr[j + 1];
      arr[j + 1] = temp;
    }

    sortState.j++;

    // Update visualization
    clearHighlights();
    renderBars();
    const bars = barsContainer.querySelectorAll('.bar');
    if (bars[j]) bars[j].classList.add('comparing');
    if (bars[j + 1]) bars[j + 1].classList.add('comparing');

    // Mark sorted portion
    const newBoundary = n - 1 - sortState.i;
    for (let k = newBoundary + 1; k < n; k++) {
      if (bars[k]) bars[k].classList.add('sorted');
    }

    // Check if fully sorted
    if (isSorted()) {
      sortState.done = true;
      clearHighlights();
      renderBars();
      const allBars = barsContainer.querySelectorAll('.bar');
      allBars.forEach(b => b.classList.add('sorted'));
      return true;
    }

    return false;
  }

  function startAnimation() {
    if (animating) return;
    animating = true;
    if (!sortState) {
      initSort();
    }
    statusEl.textContent = 'Sorting...';

    function step() {
      const done = sortStep();
      if (done) {
        animating = false;
        statusEl.textContent = 'Sorted!';
        clearHighlights();
        renderBars();
        const bars = barsContainer.querySelectorAll('.bar');
        bars.forEach(b => b.classList.add('sorted'));
      } else {
        animTimer = setTimeout(step, 30);
      }
    }
    step();
  }

  function stopAnimation() {
    animating = false;
    if (animTimer) {
      clearTimeout(animTimer);
      animTimer = null;
    }
  }

  // Initialize
  arr = generateArray();
  renderBars();

  // Button handlers
  document.getElementById('sort').addEventListener('click', function() {
    stopAnimation();
    startAnimation();
  });

  document.getElementById('shuffle').addEventListener('click', function() {
    stopAnimation();
    sortState = null;
    // Fisher-Yates shuffle
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = arr[i];
      arr[i] = arr[j];
      arr[j] = temp;
    }
    clearHighlights();
    renderBars();
    statusEl.textContent = 'Shuffled';
  });

  document.getElementById('reset').addEventListener('click', function() {
    stopAnimation();
    sortState = null;
    arr = generateArray();
    clearHighlights();
    renderBars();
    statusEl.textContent = 'Reset';
  });

  // Expose API on window
  window.viz = {
    array: function() {
      return arr.slice();
    },
    setArray: function(a) {
      stopAnimation();
      sortState = null;
      arr = a.slice();
      clearHighlights();
      renderBars();
      statusEl.textContent = 'Array set (' + arr.length + ' elements)';
    },
    sortStep: function() {
      if (!sortState) {
        initSort();
      }
      const done = sortStep();
      if (done) {
        clearHighlights();
        renderBars();
        const bars = barsContainer.querySelectorAll('.bar');
        bars.forEach(b => b.classList.add('sorted'));
      }
      return done;
    },
    sorted: function() {
      return isSorted();
    }
  };
})();
</script>
</body>
</html>
