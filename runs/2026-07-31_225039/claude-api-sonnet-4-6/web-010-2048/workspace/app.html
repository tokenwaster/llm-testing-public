<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 {
    font-size: 3rem;
    font-weight: 700;
    color: #e94560;
    margin-bottom: 16px;
    letter-spacing: 2px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 20px;
  }
  #score-box {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 8px;
    padding: 8px 20px;
    text-align: center;
  }
  #score-box .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #aaa;
  }
  #score {
    font-size: 1.6rem;
    font-weight: 700;
    color: #e94560;
  }
  #reset {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  #reset:hover { background: #c73652; }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    background: #0f3460;
    border-radius: 12px;
    padding: 10px;
    width: 380px;
    height: 380px;
  }
  .cell {
    background: #16213e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    color: #fff;
    transition: background 0.1s;
  }
  .cell[data-val="0"]  { background: #16213e; color: transparent; }
  .cell[data-val="2"]  { background: #2d4059; color: #eee; }
  .cell[data-val="4"]  { background: #3a506b; color: #eee; }
  .cell[data-val="8"]  { background: #e94560; color: #fff; }
  .cell[data-val="16"] { background: #c73652; color: #fff; }
  .cell[data-val="32"] { background: #f05454; color: #fff; }
  .cell[data-val="64"] { background: #ff6b6b; color: #fff; }
  .cell[data-val="128"]{ background: #f7b731; color: #fff; font-size: 1.5rem; }
  .cell[data-val="256"]{ background: #f9c549; color: #fff; font-size: 1.5rem; }
  .cell[data-val="512"]{ background: #20bf6b; color: #fff; font-size: 1.5rem; }
  .cell[data-val="1024"]{ background: #0fb9b1; color: #fff; font-size: 1.2rem; }
  .cell[data-val="2048"]{ background: #a29bfe; color: #fff; font-size: 1.2rem; }
  .info {
    margin-top: 16px;
    color: #666;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>2048</h1>
<div class="header">
  <div id="score-box">
    <div class="label">Score</div>
    <div id="score">0</div>
  </div>
  <button id="reset">New Game</button>
</div>
<div id="board"></div>
<div class="info">Use arrow keys to move tiles</div>

<script>
(function() {
  const SIZE = 4;
  let grid = [];
  let currentScore = 0;

  function makeEmptyGrid() {
    return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  }

  function emptyPositions(g) {
    const pos = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (g[r][c] === 0) pos.push([r, c]);
    return pos;
  }

  function spawnTile(g) {
    const pos = emptyPositions(g);
    if (pos.length === 0) return;
    const [r, c] = pos[Math.floor(Math.random() * pos.length)];
    g[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  // Slide a single row left, returns {row, score}
  function slideRowLeft(row) {
    let arr = row.filter(x => x !== 0);
    let score = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1]) {
        arr[i] *= 2;
        score += arr[i];
        arr.splice(i+1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return { row: arr, score };
  }

  function gridsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  function applyMove(direction) {
    const oldGrid = grid.map(r => [...r]);
    let totalScore = 0;

    if (direction === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const { row, score } = slideRowLeft(grid[r]);
        grid[r] = row;
        totalScore += score;
      }
    } else if (direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const { row, score } = slideRowLeft([...grid[r]].reverse());
        grid[r] = row.reverse();
        totalScore += score;
      }
    } else if (direction === 'up') {
      for (let c = 0; c < SIZE; c++) {
        const col = grid.map(r => r[c]);
        const { row, score } = slideRowLeft(col);
        for (let r = 0; r < SIZE; r++) grid[r][c] = row[r];
        totalScore += score;
      }
    } else if (direction === 'down') {
      for (let c = 0; c < SIZE; c++) {
        const col = grid.map(r => r[c]).reverse();
        const { row, score } = slideRowLeft(col);
        const newCol = row.reverse();
        for (let r = 0; r < SIZE; r++) grid[r][c] = newCol[r];
        totalScore += score;
      }
    }

    const changed = !gridsEqual(oldGrid, grid);
    if (changed) {
      currentScore += totalScore;
      spawnTile(grid);
      render();
    }
    return changed;
  }

  function render() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-val', val);
        cell.textContent = val !== 0 ? val : '';
        boardEl.appendChild(cell);
      }
    }
    document.getElementById('score').textContent = currentScore;
  }

  function newGame() {
    grid = makeEmptyGrid();
    currentScore = 0;
    spawnTile(grid);
    spawnTile(grid);
    render();
  }

  // Arrow key handler
  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left', ArrowRight: 'right',
      ArrowUp: 'up', ArrowDown: 'down'
    };
    if (map[e.key]) {
      e.preventDefault();
      applyMove(map[e.key]);
    }
  });

  document.getElementById('reset').addEventListener('click', newGame);

  // Public API
  window.game = {
    size: SIZE,
    reset() { newGame(); },
    move(direction) { return applyMove(direction); },
    board() { return grid.map(r => [...r]); },
    setBoard(arr) {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          grid[r][c] = arr[r][c];
      render();
    },
    score() { return currentScore; }
  };

  // Start
  newGame();
})();
</script>
</body>
</html>
