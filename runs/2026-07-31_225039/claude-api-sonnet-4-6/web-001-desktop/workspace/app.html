<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Desktop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    overflow: hidden;
    font-family: 'Ubuntu', 'Segoe UI', sans-serif;
    background: #1a1a1a;
    width: 100vw;
    height: 100vh;
  }

  #desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: linear-gradient(135deg, #2c1654 0%, #1a3a5c 40%, #0d1b2a 100%);
    overflow: hidden;
  }

  /* Desktop wallpaper decorative elements */
  #desktop::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 40%, rgba(233,84,32,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(44,22,84,0.3) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Taskbar */
  #taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(15, 15, 15, 0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
    padding: 0 16px;
  }

  .taskbar-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
    font-size: 22px;
    background: rgba(255,255,255,0.1);
    color: white;
  }

  .taskbar-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-4px) scale(1.1);
  }

  .taskbar-btn:active {
    transform: translateY(-2px) scale(1.05);
  }

  .taskbar-btn::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .taskbar-btn:hover::after {
    opacity: 1;
  }

  #open-files {
    background: rgba(230, 100, 30, 0.3);
  }
  #open-files:hover { background: rgba(230, 100, 30, 0.5); }

  #open-notepad {
    background: rgba(50, 150, 230, 0.3);
  }
  #open-notepad:hover { background: rgba(50, 150, 230, 0.5); }

  /* Top bar */
  #topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 28px;
    background: rgba(15,15,15,0.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  #topbar-time {
    font-weight: 500;
  }

  #topbar-left {
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
  }

  /* Windows */
  .app-window {
    position: absolute;
    background: #2d2d2d;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    display: none;
    flex-direction: column;
    min-width: 360px;
    min-height: 240px;
    overflow: hidden;
    z-index: 50;
  }

  .app-window.visible {
    display: flex;
  }

  .window-titlebar {
    height: 36px;
    background: #3c3c3c;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    cursor: move;
    user-select: none;
    border-bottom: 1px solid rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .window-titlebar-title {
    flex: 1;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-weight: 500;
    margin-right: 52px; /* balance the buttons */
  }

  .win-controls {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
  }

  .win-btn {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: rgba(0,0,0,0.6);
    font-weight: bold;
    transition: filter 0.2s;
  }

  .win-btn:hover { filter: brightness(0.85); }

  .win-close { background: #ff5f57; }
  .win-minimize { background: #febc2e; }
  .win-maximize { background: #28c840; }

  .window-content {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Files Window */
  #files-window {
    width: 680px;
    height: 480px;
    top: 60px;
    left: 80px;
  }

  .files-toolbar {
    background: #383838;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .files-nav-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }

  .files-nav-btn:hover {
    background: rgba(255,255,255,0.15);
    color: white;
  }

  #files-path {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    padding: 4px 10px;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-family: monospace;
  }

  .files-grid {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
    background: #252525;
  }

  .files-grid::-webkit-scrollbar {
    width: 8px;
  }
  .files-grid::-webkit-scrollbar-track { background: transparent; }
  .files-grid::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
  }

  .fs-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    width: 90px;
    transition: background 0.15s;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    text-align: center;
    word-break: break-word;
    user-select: none;
  }

  .fs-item:hover {
    background: rgba(255,255,255,0.08);
  }

  .fs-item.selected {
    background: rgba(233,84,32,0.3);
  }

  .fs-item-icon {
    font-size: 36px;
    line-height: 1;
  }

  .fs-item-name {
    line-height: 1.3;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Notepad Window */
  #notepad-window {
    width: 700px;
    height: 520px;
    top: 80px;
    left: 200px;
  }

  .notepad-ui {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  #tabs {
    display: flex;
    align-items: stretch;
    background: #333;
    border-bottom: 1px solid rgba(0,0,0,0.4);
    overflow-x: auto;
    flex-shrink: 0;
    min-height: 34px;
  }

  #tabs::-webkit-scrollbar { height: 4px; }
  #tabs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    min-width: 100px;
    max-width: 180px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    border-right: 1px solid rgba(0,0,0,0.3);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
    height: 34px;
    position: relative;
  }

  .tab:hover {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.8);
  }

  .tab.active {
    background: #2d2d2d;
    color: white;
    border-bottom: 2px solid #e96420;
  }

  .tab-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }

  .tab-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    border-radius: 3px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  .tab-close:hover {
    color: white;
    background: rgba(255,0,0,0.3);
  }

  #new-tab {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 20px;
    cursor: pointer;
    padding: 0 12px;
    height: 34px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  #new-tab:hover {
    color: white;
    background: rgba(255,255,255,0.08);
  }

  #editor {
    flex: 1;
    background: #1e1e1e;
    border: none;
    color: #d4d4d4;
    font-size: 14px;
    font-family: 'Consolas', 'Monaco', monospace;
    padding: 16px;
    resize: none;
    outline: none;
    line-height: 1.6;
  }

  #editor::placeholder {
    color: rgba(255,255,255,0.2);
  }

  /* Status bar for notepad */
  .notepad-statusbar {
    background: #333;
    border-top: 1px solid rgba(0,0,0,0.3);
    padding: 3px 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    display: flex;
    gap: 16px;
  }

  /* Desktop icons */
  .desktop-icon {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    width: 80px;
    color: white;
    font-size: 12px;
    text-align: center;
    user-select: none;
    transition: background 0.15s;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .desktop-icon:hover { background: rgba(255,255,255,0.12); }
  .desktop-icon .icon { font-size: 40px; }

  /* Resize handle */
  .resize-handle {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 16px;
    height: 16px;
    cursor: se-resize;
    z-index: 10;
  }

  .resize-handle::after {
    content: '';
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 10px;
    height: 10px;
    border-right: 2px solid rgba(255,255,255,0.2);
    border-bottom: 2px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<div id="desktop">
  <!-- Top bar -->
  <div id="topbar">
    <span id="topbar-left">Activities</span>
    <span id="topbar-time"></span>
    <span id="topbar-right">⚙ 🔊 🔋</span>
  </div>

  <!-- Desktop icons -->
  <div class="desktop-icon" style="top: 60px; right: 20px;" ondblclick="document.getElementById('open-files').click()">
    <span class="icon">🗂️</span>
    <span>Files</span>
  </div>
  <div class="desktop-icon" style="top: 160px; right: 20px;" ondblclick="document.getElementById('open-notepad').click()">
    <span class="icon">📝</span>
    <span>Text Editor</span>
  </div>

  <!-- Files Window -->
  <div id="files-window" class="app-window">
    <div class="window-titlebar" id="files-titlebar">
      <div class="win-controls">
        <button class="win-btn win-close" title="Close">✕</button>
        <button class="win-btn win-minimize">−</button>
        <button class="win-btn win-maximize">+</button>
      </div>
      <div class="window-titlebar-title">📁 Files</div>
    </div>
    <div class="window-content">
      <div class="files-toolbar">
        <button class="files-nav-btn" id="files-up">⬆ Up</button>
        <button class="files-nav-btn" id="files-home-btn">🏠</button>
        <div id="files-path">/</div>
      </div>
      <div class="files-grid" id="files-grid"></div>
    </div>
    <div class="resize-handle" id="files-resize"></div>
  </div>

  <!-- Notepad Window -->
  <div id="notepad-window" class="app-window">
    <div class="window-titlebar" id="notepad-titlebar">
      <div class="win-controls">
        <button class="win-btn win-close" title="Close">✕</button>
        <button class="win-btn win-minimize">−</button>
        <button class="win-btn win-maximize">+</button>
      </div>
      <div class="window-titlebar-title">📝 Text Editor</div>
    </div>
    <div class="window-content">
      <div class="notepad-ui">
        <div style="display:flex; align-items:stretch; background:#333; border-bottom:1px solid rgba(0,0,0,0.4);">
          <div id="tabs" style="flex:1; display:flex; overflow-x:auto; min-height:34px;"></div>
          <button id="new-tab" title="New Tab">+</button>
        </div>
        <textarea id="editor" placeholder="Start typing..."></textarea>
        <div class="notepad-statusbar">
          <span id="editor-info">Ln 1, Col 1</span>
          <span>UTF-8</span>
          <span>Plain Text</span>
        </div>
      </div>
    </div>
    <div class="resize-handle" id="notepad-resize"></div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button class="taskbar-btn" id="open-files" data-tooltip="Files">🗂️</button>
    <button class="taskbar-btn" id="open-notepad" data-tooltip="Text Editor">📝</button>
  </div>
</div>

<script>
// ===================== CLOCK =====================
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('topbar-time').textContent = 
    `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()} ${h}:${m}`;
}
updateClock();
setInterval(updateClock, 10000);

// ===================== FILESYSTEM =====================
const FS = {
  '/': { type: 'dir', children: ['bin','boot','dev','etc','home','lib','media','mnt','opt','proc','root','run','srv','sys','tmp','usr','var'] },
  '/bin': { type: 'dir', children: ['bash','cat','cp','echo','grep','ls','mkdir','mv','rm','sh'] },
  '/boot': { type: 'dir', children: ['grub','vmlinuz','initrd.img'] },
  '/dev': { type: 'dir', children: ['null','zero','random','sda','sda1','tty'] },
  '/etc': { type: 'dir', children: ['apt','bash.bashrc','fstab','hostname','hosts','os-release','passwd','resolv.conf','shadow','ssh','sudoers'] },
  '/etc/apt': { type: 'dir', children: ['sources.list','apt.conf'] },
  '/etc/ssh': { type: 'dir', children: ['sshd_config','ssh_config'] },
  '/home': { type: 'dir', children: ['user'] },
  '/home/user': { type: 'dir', children: ['Documents','Downloads','Pictures','Music','Videos','Desktop','.bashrc','.profile','.ssh'] },
  '/home/user/Documents': { type: 'dir', children: ['resume.pdf','notes.txt','projects','work'] },
  '/home/user/Documents/projects': { type: 'dir', children: ['webapp','scripts','ideas.md'] },
  '/home/user/Documents/work': { type: 'dir', children: ['report_q1.docx','budget.xlsx','meeting_notes.txt'] },
  '/home/user/Downloads': { type: 'dir', children: ['ubuntu-22.04.iso','installer.deb','archive.tar.gz','photo.jpg'] },
  '/home/user/Pictures': { type: 'dir', children: ['wallpapers','screenshots','vacation'] },
  '/home/user/Pictures/wallpapers': { type: 'dir', children: ['ubuntu_default.png','abstract.jpg','mountains.jpg'] },
  '/home/user/Pictures/screenshots': { type: 'dir', children: ['screenshot_001.png','screenshot_002.png'] },
  '/home/user/Pictures/vacation': { type: 'dir', children: ['beach.jpg','city.jpg','sunset.jpg'] },
  '/home/user/Music': { type: 'dir', children: ['favorites.mp3','playlist.m3u'] },
  '/home/user/Videos': { type: 'dir', children: ['demo.mp4','tutorial.mkv'] },
  '/home/user/Desktop': { type: 'dir', children: ['README.txt'] },
  '/home/user/.ssh': { type: 'dir', children: ['id_rsa','id_rsa.pub','known_hosts','authorized_keys'] },
  '/lib': { type: 'dir', children: ['x86_64-linux-gnu','systemd','modules'] },
  '/media': { type: 'dir', children: ['cdrom','usb'] },
  '/mnt': { type: 'dir', children: [] },
  '/opt': { type: 'dir', children: ['google','zoom'] },
  '/proc': { type: 'dir', children: ['1','cpuinfo','meminfo','mounts','version'] },
  '/root': { type: 'dir', children: ['.bashrc','.profile'] },
  '/run': { type: 'dir', children: ['lock','user'] },
  '/srv': { type: 'dir', children: [] },
  '/sys': { type: 'dir', children: ['bus','class','devices','kernel'] },
  '/tmp': { type: 'dir', children: ['session_tmp','cache.tmp'] },
  '/usr': { type: 'dir', children: ['bin','include','lib','local','sbin','share'] },
  '/usr/bin': { type: 'dir', children: ['python3','node','git','vim','nano','firefox','code'] },
  '/usr/include': { type: 'dir', children: ['stdio.h','stdlib.h','string.h','linux'] },
  '/usr/lib': { type: 'dir', children: ['python3','node_modules','gcc'] },
  '/usr/local': { type: 'dir', children: ['bin','lib','share'] },
  '/usr/share': { type: 'dir', children: ['applications','doc','fonts','icons','man'] },
  '/var': { type: 'dir', children: ['cache','lib','log','mail','run','spool','tmp'] },
  '/var/log': { type: 'dir', children: ['syslog','auth.log','kern.log','dpkg.log','apt'] },
  '/var/cache': { type: 'dir', children: ['apt','pip'] },
  '/var/lib': { type: 'dir', children: ['apt','dpkg','systemd'] },
};

// File type detection
function getIcon(name, isDir) {
  if (isDir) return '📁';
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    'txt': '📄', 'md': '📄', 'log': '📋', 'conf': '⚙️',
    'pdf': '📕', 'doc': '📘', 'docx': '📘', 'xlsx': '📗', 'csv': '📗',
    'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'svg': '🖼️',
    'mp3': '🎵', 'm3u': '🎵',
    'mp4': '🎬', 'mkv': '🎬', 'avi': '🎬',
    'iso': '💿', 'deb': '📦', 'tar': '📦', 'gz': '📦', 'zip': '📦',
    'sh': '⚙️', 'bash': '⚙️', 'py': '🐍', 'js': '📜',
    'rsa': '🔐', 'pub': '🔑',
    'bashrc': '⚙️', 'profile': '⚙️',
    'h': '📜', 'c': '📜', 'cpp': '📜',
  };
  return icons[ext] || (name.startsWith('.') ? '🔒' : '📄');
}

let currentPath = '/';

function renderFiles(path) {
  currentPath = path;
  document.getElementById('files-path').textContent = path;
  
  const grid = document.getElementById('files-grid');
  grid.innerHTML = '';
  
  const node = FS[path];
  if (!node || node.type !== 'dir') {
    grid.innerHTML = '<div style="color:rgba(255,255,255,0.4);padding:20px;">Empty directory</div>';
    return;
  }
  
  if (node.children.length === 0) {
    grid.innerHTML = '<div style="color:rgba(255,255,255,0.4);padding:20px;font-size:13px;">Empty directory</div>';
    return;
  }
  
  node.children.forEach(name => {
    const childPath = path === '/' ? '/' + name : path + '/' + name;
    const childNode = FS[childPath];
    const isDir = childNode && childNode.type === 'dir';
    const icon = getIcon(name, isDir);
    
    const item = document.createElement('div');
    item.className = 'fs-item';
    item.dataset.name = name;
    item.dataset.path = childPath;
    item.dataset.isdir = isDir ? '1' : '0';
    
    item.innerHTML = `
      <div class="fs-item-icon">${icon}</div>
      <div class="fs-item-name">${name}</div>
    `;
    
    item.addEventListener('click', () => {
      document.querySelectorAll('.fs-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
    });
    
    item.addEventListener('dblclick', () => {
      if (isDir) {
        renderFiles(childPath);
      }
    });
    
    grid.appendChild(item);
  });
}

document.getElementById('files-up').addEventListener('click', () => {
  if (currentPath === '/') return;
  const parts = currentPath.split('/').filter(Boolean);
  parts.pop();
  const parent = parts.length === 0 ? '/' : '/' + parts.join('/');
  renderFiles(parent);
});

document.getElementById('files-home-btn').addEventListener('click', () => {
  renderFiles('/home/user');
});

// ===================== WINDOW MANAGEMENT =====================
function showWindow(win) {
  win.classList.add('visible');
  bringToFront(win);
}

function hideWindow(win) {
  win.classList.remove('visible');
}

function bringToFront(win) {
  let maxZ = 50;
  document.querySelectorAll('.app-window').forEach(w => {
    const z = parseInt(w.style.zIndex) || 50;
    if (z > maxZ) maxZ = z;
  });
  win.style.zIndex = maxZ + 1;
}

// Launcher buttons
document.getElementById('open-files').addEventListener('click', () => {
  const win = document.getElementById('files-window');
  showWindow(win);
  renderFiles(currentPath);
});

document.getElementById('open-notepad').addEventListener('click', () => {
  const win = document.getElementById('notepad-window');
  showWindow(win);
  renderNotepad();
});

// Close buttons
document.querySelectorAll('.win-close').forEach(btn => {
  btn.addEventListener('click', () => {
    const win = btn.closest('.app-window');
    hideWindow(win);
  });
});

// Click to bring to front
document.querySelectorAll('.app-window').forEach(win => {
  win.addEventListener('mousedown', () => bringToFront(win));
});

// ===================== DRAGGING =====================
function makeDraggable(win, handle) {
  let isDragging = false;
  let startX, startY, startLeft, startTop;

  handle.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('win-btn')) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
    bringToFront(win);
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    
    // Keep on screen
    newLeft = Math.max(-win.offsetWidth + 100, Math.min(window.innerWidth - 100, newLeft));
    newTop = Math.max(28, Math.min(window.innerHeight - 60, newTop));
    
    win.style.left = newLeft + 'px';
    win.style.top = newTop + 'px';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
}

makeDraggable(document.getElementById('files-window'), document.getElementById('files-titlebar'));
makeDraggable(document.getElementById('notepad-window'), document.getElementById('notepad-titlebar'));

// ===================== RESIZING =====================
function makeResizable(win, handle) {
  let isResizing = false;
  let startX, startY, startW, startH;

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    startX = e.clientX;
    startY = e.clientY;
    startW = win.offsetWidth;
    startH = win.offsetHeight;
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    win.style.width = Math.max(360, startW + dx) + 'px';
    win.style.height = Math.max(240, startH + dy) + 'px';
  });

  document.addEventListener('mouseup', () => {
    isResizing = false;
  });
}

makeResizable(document.getElementById('files-window'), document.getElementById('files-resize'));
makeResizable(document.getElementById('notepad-window'), document.getElementById('notepad-resize'));

// ===================== NOTEPAD =====================
const STORAGE_KEY = 'ubuntu-notepad-tabs';

let noteTabs = [];
let activeTabId = null;

function loadTabs() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const data = JSON.parse(stored);
      noteTabs = data.tabs || [];
      activeTabId = data.activeTabId || null;
    }
  } catch(e) {
    noteTabs = [];
    activeTabId = null;
  }
  
  if (noteTabs.length === 0) {
    createTab('Untitled 1', '');
  }
}

function saveTabs() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    tabs: noteTabs,
    activeTabId: activeTabId
  }));
}

let tabCounter = 0;

function genTabId() {
  return 'tab-' + (++tabCounter) + '-' + Date.now();
}

function createTab(label, content) {
  const id = genTabId();
  noteTabs.push({ id, label, content });
  activeTabId = id;
  saveTabs();
  renderTabs();
  focusEditor();
  return id;
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  
  noteTabs.forEach(tab => {
    const tabEl = document.createElement('div');
    tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
    tabEl.dataset.id = tab.id;
    
    const label = document.createElement('span');
    label.className = 'tab-label';
    label.textContent = tab.label;
    
    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.textContent = '×';
    closeBtn.title = 'Close tab';
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeTab(tab.id);
    });
    
    tabEl.appendChild(label);
    tabEl.appendChild(closeBtn);
    
    tabEl.addEventListener('click', () => {
      switchTab(tab.id);
    });
    
    tabsEl.appendChild(tabEl);
  });
  
  updateEditor();
}

function switchTab(id) {
  // Save current content
  const current = noteTabs.find(t => t.id === activeTabId);
  if (current) {
    current.content = document.getElementById('editor').value;
  }
  activeTabId = id;
  saveTabs();
  renderTabs();
  focusEditor();
}

function closeTab(id) {
  const idx = noteTabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  
  noteTabs.splice(idx, 1);
  
  if (noteTabs.length === 0) {
    createTab('Untitled 1', '');
    return;
  }
  
  if (activeTabId === id) {
    const newIdx = Math.min(idx, noteTabs.length - 1);
    activeTabId = noteTabs[newIdx].id;
  }
  
  saveTabs();
  renderTabs();
}

function updateEditor() {
  const editor = document.getElementById('editor');
  const tab = noteTabs.find(t => t.id === activeTabId);
  if (tab) {
    editor.value = tab.content;
  } else {
    editor.value = '';
  }
  updateEditorInfo();
}

function focusEditor() {
  document.getElementById('editor').focus();
}

function updateEditorInfo() {
  const editor = document.getElementById('editor');
  const text = editor.value;
  const lines = text.substring(0, editor.selectionStart).split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('editor-info').textContent = `Ln ${ln}, Col ${col}`;
}

document.getElementById('editor').addEventListener('input', () => {
  const tab = noteTabs.find(t => t.id === activeTabId);
  if (tab) {
    tab.content = document.getElementById('editor').value;
    // Update tab label if untitled and has content
    saveTabs();
  }
  updateEditorInfo();
});

document.getElementById('editor').addEventListener('keyup', updateEditorInfo);
document.getElementById('editor').addEventListener('click', updateEditorInfo);

document.getElementById('new-tab').addEventListener('click', () => {
  const num = noteTabs.length + 1;
  createTab(`Untitled ${num}`, '');
});

function renderNotepad() {
  renderTabs();
}

// Load on startup
loadTabs();
