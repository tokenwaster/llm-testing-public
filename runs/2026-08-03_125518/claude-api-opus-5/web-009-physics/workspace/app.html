<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Ball Playground</title>
<style>
  :root{
    --bg:#0b0d12;
    --panel:#141822;
    --panel2:#1c2230;
    --ink:#e7ecf5;
    --muted:#8b96ab;
    --accent:#4dd6ff;
    --accent2:#ff6b9d;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #17203a 0%, var(--bg) 60%);
    color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:24px 16px 32px;
    -webkit-font-smoothing:antialiased;
  }
  h1{
    margin:0 0 2px;
    font-size:20px;
    letter-spacing:.5px;
    font-weight:650;
  }
  .sub{
    margin:0 0 16px;
    color:var(--muted);
    font-size:13px;
    text-align:center;
  }
  .stage{
    padding:12px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid #262e3f;
    border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }
  #sim{
    display:block;
    width:640px;
    height:480px;
    max-width:86vw;
    border-radius:10px;
    background:#0a0c11;
    cursor:crosshair;
    touch-action:none;
    border:1px solid #2b3purple;
    border:1px solid #2b3348;
  }
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:16px;
  }
  button{
    appearance:none;
    border:1px solid #33405a;
    background:linear-gradient(180deg,#232c3e,#1a2130);
    color:var(--ink);
    font:600 14px/1 inherit;
    letter-spacing:.3px;
    padding:11px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .08s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  }
  button:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(77,214,255,.18), inset 0 1px 0 rgba(255,255,255,.07)}
  button:active{transform:translateY(1px) scale(.985)}
  button.primary{background:linear-gradient(180deg,#1d4d63,#143c4f);border-color:#2b7f9e}
  button.danger:hover{border-color:var(--accent2);box-shadow:0 6px 18px rgba(255,107,157,.18)}
  .hud{
    margin-top:12px;
    color:var(--muted);
    font-size:12.5px;
    font-variant-numeric:tabular-nums;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .hud b{color:var(--ink);font-weight:600}
  kbd{
    background:#202839;border:1px solid #34405a;border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;font:600 11px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#cdd6e6
  }
</style>
</head>
<body>
  <h1>Bouncing Ball Playground</h1>
  <p class="sub">Click the canvas to spawn a ball &middot; gravity, walls, and a touch of energy loss</p>

  <div class="stage">
    <canvas id="sim" width="640" height="480"></canvas>
  </div>

  <div class="controls">
    <button id="drop" class="primary">Drop ball</button>
    <button id="play">Pause</button>
    <button id="clear" class="danger">Clear</button>
  </div>

  <div class="hud">
    <span>balls: <b id="count">0</b></span>
    <span>gravity: <b>0.4</b></span>
    <span>restitution: <b>0.82</b></span>
    <span><kbd>click</kbd> to add</span>
  </div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  // ---- logical (CSS pixel) simulation size -------------------------------
  const W = 640, H = 480;

  function fitCanvas(){
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', function(){ fitCanvas(); draw(); });

  // ---- physics constants -------------------------------------------------
  const GRAVITY      = 0.4;   // px per step^2 (dt = 1 step)
  const RESTITUTION  = 0.82;  // energy kept on bounce
  const WALL_FRICTION= 0.995; // tangential damping on impact
  const AIR          = 0.9995;
  const MAX_SPEED    = 60;    // px per step, per axis (sanity clamp)
  const MAX_SUB_DT   = 0.5;   // substep size for stability

  const HUES = [190, 205, 265, 330, 20, 45, 150];
  let hueIndex = 0;

  /** @type {{x:number,y:number,vx:number,vy:number,r:number,hue:number}[]} */
  let balls = [];

  function clampNum(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  function addBall(x, y, vx, vy, r){
    const rad = clampNum(Number.isFinite(+r) ? +r : (10 + Math.random() * 12), 2, Math.min(W, H) / 3);
    const b = {
      x: clampNum(Number.isFinite(+x) ? +x : W / 2, rad, W - rad),
      y: clampNum(Number.isFinite(+y) ? +y : rad,   rad, H - rad),
      vx: Number.isFinite(+vx) ? +vx : 0,
      vy: Number.isFinite(+vy) ? +vy : 0,
      r: rad,
      hue: HUES[(hueIndex++) % HUES.length]
    };
    balls.push(b);
    updateHud();
    return b;
  }

  function clear(){
    balls.length = 0;
    updateHud();
    draw();
  }

  // ---- integration -------------------------------------------------------
  function substep(sdt){
    for (let i = 0; i < balls.length; i++){
      const b = balls[i];

      // gravity
      b.vy += GRAVITY * sdt;

      // mild air drag
      b.vx *= Math.pow(AIR, sdt);
      b.vy *= Math.pow(AIR, sdt);

      // sanity clamp so nothing can go wild
      b.vx = clampNum(b.vx, -MAX_SPEED, MAX_SPEED);
      b.vy = clampNum(b.vy, -MAX_SPEED, MAX_SPEED);

      // integrate
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;

      const r = Math.min(b.r, Math.min(W, H) / 2);

      // floor
      if (b.y + r > H){
        b.y = H - r;
        if (b.vy > 0) b.vy = -b.vy * RESTITUTION;
        b.vx *= WALL_FRICTION;
      }
      // ceiling
      if (b.y - r < 0){
        b.y = r;
        if (b.vy < 0) b.vy = -b.vy * RESTITUTION;
        b.vx *= WALL_FRICTION;
      }
      // right wall
      if (b.x + r > W){
        b.x = W - r;
        if (b.vx > 0) b.vx = -b.vx * RESTITUTION;
        b.vy *= WALL_FRICTION;
      }
      // left wall
      if (b.x - r < 0){
        b.x = r;
        if (b.vx < 0) b.vx = -b.vx * RESTITUTION;
        b.vy *= WALL_FRICTION;
      }

      // final hard clamp — a ball may never leave the canvas
      b.x = clampNum(b.x, r, W - r);
      b.y = clampNum(b.y, r, H - r);
    }
  }

  function step(dt){
    let d = Number.isFinite(+dt) ? +dt : 1;
    if (d <= 0) d = 0;
    if (d > 0){
      const n = Math.max(1, Math.ceil(d / MAX_SUB_DT));
      const sdt = d / n;
      for (let k = 0; k < n; k++) substep(sdt);
    }
    draw();
    return balls;
  }

  // ---- rendering ---------------------------------------------------------
  function draw(){
    // background
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0e1320');
    g.addColorStop(1, '#070a0f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // subtle floor line
    ctx.strokeStyle = 'rgba(120,150,200,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H - 0.5);
    ctx.lineTo(W, H - 0.5);
    ctx.stroke();

    for (let i = 0; i < balls.length; i++){
      const b = balls[i];
      const r = Math.max(1, b.r);

      // glow
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'hsl(' + b.hue + ' 90% 62%)';
      ctx.shadowColor = 'hsla(' + b.hue + ', 95%, 60%, 0.75)';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // shading
      const rg = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.4, r * 0.1, b.x, b.y, r);
      rg.addColorStop(0, 'hsla(' + b.hue + ', 100%, 88%, 0.95)');
      rg.addColorStop(0.55, 'hsla(' + b.hue + ', 90%, 60%, 0.85)');
      rg.addColorStop(1, 'hsla(' + b.hue + ', 85%, 38%, 0.95)');
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = rg;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // ---- animation loop ---------------------------------------------------
  let running = true;
  let rafId = null;
  let last = 0;

  function frame(t){
    if (!running) return;
    if (!last) last = t;
    let dtMs = t - last;
    last = t;
    if (!Number.isFinite(dtMs) || dtMs < 0) dtMs = 16.7;
    // 1 "step" == one 60fps frame; clamp to avoid huge jumps after tab switch
    const dt = clampNum(dtMs / 16.7, 0, 3);
    step(dt);
    rafId = requestAnimationFrame(frame);
  }

  function setRunning(on){
    running = !!on;
    playBtn.textContent = running ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', String(running));
    if (running){
      last = 0;
      if (rafId === null) rafId = requestAnimationFrame(frame);
    } else if (rafId !== null){
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  // ---- UI ---------------------------------------------------------------
  const dropBtn  = document.getElementById('drop');
  const playBtn  = document.getElementById('play');
  const clearBtn = document.getElementById('clear');
  const countEl  = document.getElementById('count');

  function updateHud(){ countEl.textContent = String(balls.length); }

  dropBtn.addEventListener('click', function(){
    const r = 10 + Math.random() * 12;
    addBall(
      r + Math.random() * (W - 2 * r),
      r + Math.random() * 40,
      (Math.random() - 0.5) * 8,
      0,
      r
    );
    draw();
  });

  clearBtn.addEventListener('click', clear);
  playBtn.addEventListener('click', function(){ setRunning(!running); });

  function canvasPoint(evt){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (evt.clientX - rect.left) * (W / rect.width),
      y: (evt.clientY - rect.top)  * (H / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', function(evt){
    evt.preventDefault();
    const p = canvasPoint(evt);
    addBall(p.x, p.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 3);
    draw();
  });

  // ---- public API -------------------------------------------------------
  window.sim = {
    w: W,
    h: H,
    canvas: canvas,
    balls: function(){ return balls; },
    addBall: function(x, y, vx, vy, r){ const b = addBall(x, y, vx, vy, r); draw(); return b; },
    clear: clear,
    step: function(dt){ return step(dt === undefined ? 1 : dt); },
    draw: draw,
    play: function(){ setRunning(true); },
    pause: function(){ setRunning(false); },
    get running(){ return running; },
    gravity: GRAVITY,
    restitution: RESTITUTION
  };

  // start with a couple of balls for flavour
  addBall(W * 0.35, 60, 3.2, 0, 16);
  addBall(W * 0.62, 30, -2.4, 0, 12);
  draw();
  setRunning(true);
})();
</script>
</body>
</html>
