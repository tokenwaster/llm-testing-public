<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ubuntu Desktop</title>
<style>
  :root{
    --orange:#E95420;
    --aubergine:#2C001E;
    --purple:#77216F;
    --win-bg:#2b2b2b;
    --win-head:#3a3a3a;
    --text:#e8e6e3;
    --muted:#a8a29e;
    --border:#141414;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:Ubuntu, "Segoe UI", Cantarell, "DejaVu Sans", system-ui, sans-serif;
    color:var(--text);
    background:#1d1119;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Desktop ---------- */
  #desktop{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
      radial-gradient(1200px 800px at 78% 18%, rgba(233,84,32,.32), transparent 60%),
      radial-gradient(900px 700px at 12% 88%, rgba(119,33,111,.45), transparent 62%),
      linear-gradient(160deg,#3a0c2e 0%, #2C001E 45%, #1a0a16 100%);
  }
  #desktop::after{
    /* subtle diagonal light streaks, pure CSS wallpaper */
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    position:absolute;top:0;left:0;right:0;height:28px;
    background:rgba(15,8,13,.85);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;font-size:12.5px;color:#eee;z-index:9000;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  #topbar .tb-left{display:flex;gap:14px;align-items:center;font-weight:500;}
  #topbar .tb-right{display:flex;gap:12px;align-items:center;}
  .tb-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 6px rgba(233,84,32,.8);}
  #clock{font-variant-numeric:tabular-nums;}

  /* ---------- Dock / taskbar ---------- */
  #taskbar{
    position:absolute;left:0;top:28px;bottom:0;width:68px;
    background:rgba(20,11,18,.78);
    backdrop-filter:blur(8px);
    border-right:1px solid rgba(255,255,255,.07);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:12px 0;z-index:8000;
  }
  .launcher{
    position:relative;
    width:48px;height:48px;border-radius:12px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;
    background:linear-gradient(180deg,#4b4b4b,#333);
    box-shadow:0 2px 6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .12s ease, filter .12s ease;
    padding:0;
  }
  .launcher:hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.15);}
  .launcher:active{transform:scale(.96);}
  #open-files{background:linear-gradient(180deg,#f0b040,#d98a17);}
  #open-notepad{background:linear-gradient(180deg,#7c5cbf,#5b3f9c);}
  .launcher .glyph{pointer-events:none;font-size:20px;line-height:1;}
  .launcher.running::before{
    content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:2px;background:var(--orange);
  }
  .launcher .tip{
    position:absolute;left:58px;top:50%;transform:translateY(-50%);
    background:rgba(0,0,0,.85);color:#fff;font-size:11.5px;font-weight:400;
    padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .12s ease;
  }
  .launcher:hover .tip{opacity:1;}
  .dock-sep{width:34px;height:1px;background:rgba(255,255,255,.15);margin:4px 0;}
  .dock-trash{background:linear-gradient(180deg,#5a5a5a,#3d3d3d);}

  /* ---------- Desktop icons ---------- */
  #desktop-icons{
    position:absolute;left:84px;top:44px;
    display:flex;flex-direction:column;gap:8px;z-index:10;
  }
  .desk-icon{
    width:96px;padding:8px 4px;border-radius:8px;text-align:center;
    cursor:pointer;user-select:none;font-size:12px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .desk-icon:hover{background:rgba(255,255,255,.12);}
  .desk-icon .ico{
    display:block;width:44px;height:44px;margin:0 auto 6px;border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;font-size:22px;
  }

  /* ---------- Windows ---------- */
  .window{
    position:absolute;
    display:none;
    flex-direction:column;
    min-width:360px;min-height:240px;
    background:var(--win-bg);
    border:1px solid #101010;
    border-radius:10px;
    box-shadow:0 18px 46px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
    overflow:hidden;
    z-index:100;
  }
  .titlebar{
    height:36px;flex:0 0 36px;
    background:linear-gradient(180deg,#454545,#353535);
    border-bottom:1px solid #1c1c1c;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 8px 0 12px;cursor:grab;user-select:none;
  }
  .window.focused .titlebar{background:linear-gradient(180deg,#4f4f4f,#3b3b3b);}
  .titlebar .title{font-size:13px;font-weight:600;color:#f0eeec;display:flex;gap:8px;align-items:center;}
  .titlebar .title .tdot{width:10px;height:10px;border-radius:50%;}
  .win-btns{display:flex;gap:6px;}
  .win-btn{
    width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:#5a5a5a;color:#eee;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .win-btn:hover{background:#6d6d6d;}
  .win-close:hover{background:var(--orange);color:#fff;}
  .win-body{flex:1 1 auto;display:flex;min-height:0;overflow:hidden;}
  .resize-handle{
    position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 45%, rgba(255,255,255,.28) 45%, rgba(255,255,255,.28) 55%, transparent 55%);
  }

  /* ---------- Files app ---------- */
  #files-window{left:150px;top:80px;width:720px;height:460px;}
  .files-layout{flex:1;display:flex;min-height:0;}
  .files-side{
    width:170px;flex:0 0 170px;background:#242424;border-right:1px solid #141414;
    padding:10px 8px;overflow:auto;
  }
  .side-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:6px 6px 6px;}
  .side-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:6px;font-size:12.5px;cursor:pointer;color:#ddd;
  }
  .side-item:hover{background:#333;}
  .side-item.active{background:var(--orange);color:#fff;}
  .side-item .sq{width:12px;height:12px;border-radius:3px;background:#f0b040;flex:0 0 auto;}
  .files-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .files-toolbar{
    display:flex;align-items:center;gap:8px;padding:8px;background:#2f2f2f;
    border-bottom:1px solid #191919;
  }
  .tool-btn{
    height:28px;min-width:30px;padding:0 9px;border-radius:6px;border:1px solid #171717;
    background:linear-gradient(180deg,#4a4a4a,#3c3c3c);color:#eee;cursor:pointer;font-size:13px;
  }
  .tool-btn:hover{filter:brightness(1.18);}
  .tool-btn:disabled{opacity:.4;cursor:default;}
  #files-path{
    flex:1;min-width:0;height:28px;line-height:26px;
    background:#1e1e1e;border:1px solid #151515;border-radius:6px;
    padding:0 10px;font-family:"Ubuntu Mono",Consolas,monospace;font-size:13px;color:#ffd9c7;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #files-list{
    flex:1;min-height:0;overflow:auto;padding:12px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
    gap:8px;align-content:start;background:#2b2b2b;
  }
  .fs-item{
    position:relative;
    padding:44px 6px 8px;border-radius:8px;text-align:center;
    font-size:12px;color:#eee;cursor:pointer;user-select:none;
    word-break:break-word;line-height:1.25;border:1px solid transparent;
  }
  .fs-item::before{
    content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:32px;height:26px;border-radius:4px 4px 5px 5px;
    background:linear-gradient(180deg,#f4bd57,#dc9520);
    box-shadow:inset 0 6px 0 rgba(255,255,255,.16), 0 1px 3px rgba(0,0,0,.5);
  }
  .fs-item.file::before{
    width:24px;height:30px;border-radius:3px;
    background:linear-gradient(180deg,#dcdcdc,#a9a9a9);
    box-shadow:inset -6px 6px 0 rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.5);
  }
  .fs-item:hover{background:rgba(255,255,255,.08);}
  .fs-item.selected{background:rgba(233,84,32,.28);border-color:rgba(233,84,32,.7);}
  .files-status{
    flex:0 0 24px;height:24px;background:#242424;border-top:1px solid #171717;
    font-size:11.5px;color:var(--muted);display:flex;align-items:center;padding:0 10px;gap:12px;
  }

  /* ---------- Notepad ---------- */
  #notepad-window{left:520px;top:150px;width:600px;height:430px;}
  .np-layout{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;}
  .np-bar{display:flex;align-items:stretch;background:#262626;border-bottom:1px solid #151515;}
  #tabs{
    flex:1;display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding:4px 4px 0;
    min-width:0;
  }
  #tabs::-webkit-scrollbar{height:6px;}
  .tab{
    display:flex;align-items:center;gap:6px;
    max-width:190px;padding:6px 8px 6px 10px;
    background:#333;color:#cfcfcf;font-size:12.5px;
    border:1px solid #1a1a1a;border-bottom:none;
    border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap;user-select:none;
  }
  .tab:hover{background:#3d3d3d;}
  .tab.active{background:#300A24;color:#fff;border-color:#111;box-shadow:inset 0 2px 0 var(--orange);}
  .tab .tab-name{overflow:hidden;text-overflow:ellipsis;max-width:140px;}
  .tab .tab-x{
    width:16px;height:16px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#bbb;
  }
  .tab .tab-x:hover{background:var(--orange);color:#fff;}
  #new-tab{
    flex:0 0 auto;margin:4px 6px;width:28px;height:26px;align-self:center;
    border:1px solid #171717;border-radius:6px;cursor:pointer;
    background:linear-gradient(180deg,#4a4a4a,#3a3a3a);color:#fff;font-size:16px;line-height:1;
    padding:0;
  }
  #new-tab:hover{background:var(--orange);}
  #editor{
    flex:1;min-height:0;width:100%;resize:none;border:none;outline:none;
    background:#300A24;color:#f2eeea;
    font-family:"Ubuntu Mono",Consolas,"DejaVu Sans Mono",monospace;
    font-size:14px;line-height:1.5;padding:12px 14px;
  }
  .np-status{
    flex:0 0 24px;height:24px;background:#242424;border-top:1px solid #171717;
    font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;
  }
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:#232323;}
  ::-webkit-scrollbar-thumb{background:#555;border-radius:6px;border:2px solid #232323;}
  ::-webkit-scrollbar-thumb:hover{background:#6d6d6d;}
</style>
</head>
<body>

<div id="desktop">

  <div id="topbar">
    <div class="tb-left">
      <span class="tb-dot"></span>
      <span>Activities</span>
      <span id="active-app">Desktop</span>
    </div>
    <div class="tb-right">
      <span id="clock">--:--</span>
      <span>en</span>
      <span>⏻</span>
    </div>
  </div>

  <div id="taskbar">
    <button class="launcher" id="open-files" title="Files">
      <span class="glyph">🗀</span><span class="tip">Files</span>
    </button>
    <button class="launcher" id="open-notepad" title="Notepad">
      <span class="glyph">✎</span><span class="tip">Notepad</span>
    </button>
    <div class="dock-sep"></div>
    <button class="launcher dock-trash" id="dock-trash" title="Trash">
      <span class="glyph">🗑</span><span class="tip">Trash (empty)</span>
    </button>
  </div>

  <div id="desktop-icons">
    <div class="desk-icon" id="icon-files" title="Double-click to open Files">
      <span class="ico" style="background:linear-gradient(180deg,#f0b040,#d98a17)">🗀</span>
      Files
    </div>
    <div class="desk-icon" id="icon-notepad" title="Double-click to open Notepad">
      <span class="ico" style="background:linear-gradient(180deg,#7c5cbf,#5b3f9c)">✎</span>
      Notepad
    </div>
  </div>

  <!-- ============ FILES WINDOW ============ -->
  <div class="window" id="files-window" data-app="files">
    <div class="titlebar" data-drag="1">
      <div class="title"><span class="tdot" style="background:#f0b040"></span> Files</div>
      <div class="win-btns">
        <button class="win-btn win-min" title="Minimize">–</button>
        <button class="win-btn win-max" title="Maximize">▢</button>
        <button class="win-btn win-close" title="Close">✕</button>
      </div>
    </div>
    <div class="win-body">
      <div class="files-layout">
        <div class="files-side">
          <div class="side-title">Places</div>
          <div class="side-item" data-goto="/home/user"><span class="sq"></span>Home</div>
          <div class="side-item" data-goto="/home/user/Documents"><span class="sq"></span>Documents</div>
          <div class="side-item" data-goto="/home/user/Downloads"><span class="sq"></span>Downloads</div>
          <div class="side-item" data-goto="/home/user/Pictures"><span class="sq"></span>Pictures</div>
          <div class="side-title">System</div>
          <div class="side-item" data-goto="/"><span class="sq" style="background:#bbb"></span>Filesystem</div>
          <div class="side-item" data-goto="/etc"><span class="sq" style="background:#bbb"></span>etc</div>
          <div class="side-item" data-goto="/var/log"><span class="sq" style="background:#bbb"></span>var/log</div>
        </div>
        <div class="files-main">
          <div class="files-toolbar">
            <button class="tool-btn" id="files-back" title="Back">◀</button>
            <button class="tool-btn" id="files-up" title="Parent folder">▲</button>
            <button class="tool-btn" id="files-home" title="Home folder">⌂</button>
            <div id="files-path">/</div>
          </div>
          <div id="files-list"></div>
          <div class="files-status">
            <span id="files-count">0 items</span>
            <span id="files-hint">Double-click a folder to open it</span>
          </div>
        </div>
      </div>
    </div>
    <div class="resize-handle" data-resize="1"></div>
  </div>

  <!-- ============ NOTEPAD WINDOW ============ -->
  <div class="window" id="notepad-window" data-app="notepad">
    <div class="titlebar" data-drag="1">
      <div class="title"><span class="tdot" style="background:#7c5cbf"></span> Notepad</div>
      <div class="win-btns">
        <button class="win-btn win-min" title="Minimize">–</button>
        <button class="win-btn win-max" title="Maximize">▢</button>
        <button class="win-btn win-close" title="Close">✕</button>
      </div>
    </div>
    <div class="win-body">
      <div class="np-layout">
        <div class="np-bar">
          <div id="tabs"></div>
          <button id="new-tab" title="New tab">+</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="Type here…"></textarea>
        <div class="np-status">
          <span id="np-info">—</span>
          <span id="np-saved">saved to localStorage</span>
        </div>
      </div>
    </div>
    <div class="resize-handle" data-resize="1"></div>
  </div>

</div>

/* =====================================================================
   Window management: focus, drag, resize, open/close
   ===================================================================== */
var desktop = document.getElementById("desktop");
var zTop = 100;

function windows(){ return Array.prototype.slice.call(document.querySelectorAll(".window")); }

function focusWin(win){
  zTop++;
  win.style.zIndex = zTop;
  windows().forEach(function(w){ w.classList.toggle("focused", w === win); });
  var name = win.id === "files-window" ? "Files" : "Notepad";
  document.getElementById("active-app").textContent = name;
}

function ensureGeometry(win){
  var vw = window.innerWidth, vh = window.innerHeight;
  var w = Math.max(360, Math.min(parseInt(win.style.width,10) || win.offsetWidth || 640, Math.max(360, vw - 90)));
  var h = Math.max(240, Math.min(parseInt(win.style.height,10) || win.offsetHeight || 440, Math.max(240, vh - 60)));
  win.style.width = w + "px";
  win.style.height = h + "px";
  var left = parseInt(win.style.left,10); if (isNaN(left)) left = 120;
  var top = parseInt(win.style.top,10); if (isNaN(top)) top = 70;
  left = Math.max(74, Math.min(left, Math.max(74, vw - w - 6)));
  top = Math.max(32, Math.min(top, Math.max(32, vh - h - 6)));
  win.style.left = left + "px";
  win.style.top = top + "px";
}

function openWin(win){
  win.style.display = "flex";
  ensureGeometry(win);
  focusWin(win);
  updateDock();
  if (win.id === "notepad-window") { setTimeout(function(){ try{ editor.focus(); }catch(e){} }, 0); }
}
function closeWin(win){
  win.style.display = "none";
  win.classList.remove("focused");
  updateDock();
  var visible = windows().filter(function(w){ return w.style.display !== "none"; });
  document.getElementById("active-app").textContent = visible.length ? (visible[visible.length-1].id === "files-window" ? "Files" : "Notepad") : "Desktop";
}
function isOpen(win){ return win.style.display !== "none" && win.offsetParent !== null; }

function updateDock(){
  document.getElementById("open-files").classList.toggle("running", isOpen(filesWin));
  document.getElementById("open-notepad").classList.toggle("running", isOpen(npWin));
}

var filesWin = document.getElementById("files-window");
var npWin = document.getElementById("notepad-window");

/* launchers */
document.getElementById("open-files").addEventListener("click", function(){ openWin(filesWin); });
document.getElementById("open-notepad").addEventListener("click", function(){ openWin(npWin); });
document.getElementById("icon-files").addEventListener("dblclick", function(){ openWin(filesWin); });
document.getElementById("icon-notepad").addEventListener("dblclick", function(){ openWin(npWin); });
document.getElementById("icon-files").addEventListener("click", function(){ this.classList.add("sel"); });
document.getElementById("dock-trash").addEventListener("click", function(){
  document.getElementById("files-hint").textContent = "Trash is empty.";
  openWin(filesWin);
});

/* per-window controls */
windows().forEach(function(win){
  win.addEventListener("mousedown", function(){ focusWin(win); }, true);

  win.querySelector(".win-close").addEventListener("click", function(e){
    e.stopPropagation();
    closeWin(win);
  });
  win.querySelector(".win-min").addEventListener("click", function(e){
    e.stopPropagation();
    win.style.display = "none";
    updateDock();
  });
  win.querySelector(".win-max").addEventListener("click", function(e){
    e.stopPropagation();
    if (win.dataset.maxed === "1"){
      win.style.left = win.dataset.rl; win.style.top = win.dataset.rt;
      win.style.width = win.dataset.rw; win.style.height = win.dataset.rh;
      win.dataset.maxed = "0";
    } else {
      win.dataset.rl = win.style.left; win.dataset.rt = win.style.top;
      win.dataset.rw = win.style.width; win.dataset.rh = win.style.height;
      win.style.left = "68px"; win.style.top = "28px";
      win.style.width = (window.innerWidth - 68) + "px";
      win.style.height = (window.innerHeight - 28) + "px";
      win.dataset.maxed = "1";
    }
  });

  /* dragging */
  var bar = win.querySelector(".titlebar");
  var drag = null;
  bar.addEventListener("mousedown", function(e){
    if (e.target.closest(".win-btn")) return;
    focusWin(win);
    if (win.dataset.maxed === "1") return;
    drag = { x:e.clientX, y:e.clientY, l:parseInt(win.style.left,10)||win.offsetLeft, t:parseInt(win.style.top,10)||win.offsetTop };
    bar.style.cursor = "grabbing";
    e.preventDefault();
  });

  /* resizing */
  var handle = win.querySelector(".resize-handle");
  var rez = null;
  handle.addEventListener("mousedown", function(e){
    focusWin(win);
    rez = { x:e.clientX, y:e.clientY, w:win.offsetWidth, h:win.offsetHeight };
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener("mousemove", function(e){
    if (drag){
      var nl = drag.l + (e.clientX - drag.x);
      var nt = drag.t + (e.clientY - drag.y);
      nl = Math.max(-win.offsetWidth + 90, Math.min(nl, window.innerWidth - 60));
      nt = Math.max(28, Math.min(nt, window.innerHeight - 40));
      win.style.left = nl + "px";
      win.style.top = nt + "px";
    }
    if (rez){
      win.style.width = Math.max(360, rez.w + (e.clientX - rez.x)) + "px";
      win.style.height = Math.max(240, rez.h + (e.clientY - rez.y)) + "px";
    }
  });
  document.addEventListener("mouseup", function(){
    if (drag){ drag = null; bar.style.cursor = "grab"; }
    rez = null;
  });
});

/* =====================================================================
   Files app
   ===================================================================== */
var pathEl = document.getElementById("files-path");
var listEl = document.getElementById("files-list");
var countEl = document.getElementById("files-count");
var hintEl = document.getElementById("files-hint");
var cwd = [];              // array of path segments
var history = [];          // navigation history (arrays)

function pathString(segs){ return "/" + segs.join("/"); }

function resolve(segs){
  var node = FS;
  for (var i=0;i<segs.length;i++){
    if (!node || node.type !== "dir") return null;
    node = node.children[segs[i]];
  }
  return node || null;
}

function render(){
  pathEl.textContent = pathString(cwd);
  pathEl.title = pathString(cwd);
  var node = resolve(cwd);
  listEl.innerHTML = "";
  if (!node || node.type !== "dir"){
    countEl.textContent = "0 items";
    return;
  }
  var names = Object.keys(node.children);
  names.sort(function(a,b){
    var da = node.children[a].type === "dir", db = node.children[b].type === "dir";
    if (da !== db) return da ? -1 : 1;
    return a.toLowerCase() < b.toLowerCase() ? -1 : (a.toLowerCase() > b.toLowerCase() ? 1 : 0);
  });
  names.forEach(function(name){
    var child = node.children[name];
    var el = document.createElement("div");
    el.className = "fs-item" + (child.type === "dir" ? " dir" : " file");
    el.textContent = name;
    el.setAttribute("data-name", name);
    el.setAttribute("data-type", child.type);
    el.title = (child.type === "dir" ? "Folder: " : "File: ") + pathString(cwd.concat(name));
    el.tabIndex = 0;
    listEl.appendChild(el);
  });
  countEl.textContent = names.length + (names.length === 1 ? " item" : " items");
  document.querySelectorAll(".side-item").forEach(function(s){
    s.classList.toggle("active", s.getAttribute("data-goto") === pathString(cwd));
  });
  var upBtn = document.getElementById("files-up");
  upBtn.disabled = cwd.length === 0;
  document.getElementById("files-back").disabled = history.length === 0;
}

function navigate(segs, pushHistory){
  var node = resolve(segs);
  if (!node || node.type !== "dir") return;
  if (pushHistory !== false) history.push(cwd.slice());
  cwd = segs.slice();
  render();
}

function goPath(str){
  var segs = str.split("/").filter(function(s){ return s.length; });
  navigate(segs);
}

listEl.addEventListener("click", function(e){
  var item = e.target.closest(".fs-item");
  listEl.querySelectorAll(".fs-item.selected").forEach(function(x){ x.classList.remove("selected"); });
  if (!item) return;
  item.classList.add("selected");
  hintEl.textContent = (item.getAttribute("data-type") === "dir" ? "Folder " : "File ") + item.textContent;
});

listEl.addEventListener("dblclick", function(e){
  var item = e.target.closest(".fs-item");
  if (!item) return;
  var name = item.getAttribute("data-name");
  var target = cwd.concat(name);
  var node = resolve(target);
  if (node && node.type === "dir"){
    navigate(target);
    hintEl.textContent = "Opened " + pathString(target);
  } else if (node){
    /* open the file in Notepad */
    openWin(npWin);
    createTab(name, node.content || "");
    hintEl.textContent = "Opened " + name + " in Notepad";
  }
});

/* keyboard: Enter opens selected item */
listEl.addEventListener("keydown", function(e){
  if (e.key === "Enter"){
    var sel = listEl.querySelector(".fs-item.selected");
    if (sel) sel.dispatchEvent(new MouseEvent("dblclick", {bubbles:true}));
  }
});

document.getElementById("files-up").addEventListener("click", function(){
  if (cwd.length === 0){ hintEl.textContent = "Already at filesystem root"; return; }
  var parent = cwd.slice(0, cwd.length - 1);
  navigate(parent);
  hintEl.textContent = "Moved up to " + pathString(parent);
});
document.getElementById("files-back").addEventListener("click", function(){
  if (!history.length) return;
  var prev = history.pop();
  cwd = prev;
  render();
});
document.getElementById("files-home").addEventListener("click", function(){ goPath("/home/user"); });
document.querySelectorAll(".side-item").forEach(function(s){
  s.addEventListener("click", function(){ goPath(s.getAttribute("data-goto")); });
});

render();

/* =====================================================================
   Notepad app (tabbed + localStorage persistence)
   ===================================================================== */
var STORE_KEY = "ubuntu-notepad-state-v1";
var tabsEl = document.getElementById("tabs");
var editor = document.getElementById("editor");
var npInfo = document.getElementById("np-info");
var npSaved = document.getElementById("np-saved");

var state = { tabs: [], activeId: null, counter: 0 };

function saveState(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    npSaved.textContent = "saved to localStorage";
  } catch(e){
    npSaved.textContent = "could not save (storage unavailable)";
  }
}

function loadState(){
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e){ raw = null; }
  if (raw){
    try {
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tabs) && parsed.tabs.length){
        state.tabs = parsed.tabs.map(function(t, i){
          return {
            id: String(t.id != null ? t.id : ("t" + i)),
            name: String(t.name != null ? t.name : ("Untitled " + (i+1))),
            content: String(t.content != null ? t.content : "")
          };
        });
        state.counter = typeof parsed.counter === "number" ? parsed.counter : state.tabs.length;
        state.activeId = parsed.activeId && state.tabs.some(function(t){ return t.id === parsed.activeId; })
          ? parsed.activeId : state.tabs[0].id;
        return;
      }
    } catch(e){ /* fall through to defaults */ }
  }
  state.tabs = [];
  state.counter = 0;
  state.activeId = null;
  createTab("Welcome", "Welcome to Notepad on Ubuntu!\n\n• Click + to open a new tab.\n• Click a tab to switch to it.\n• Everything you type is stored in localStorage,\n  so it survives closing this window and reloading the page.\n", false);
}

function newId(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function activeTab(){
  for (var i=0;i<state.tabs.length;i++) if (state.tabs[i].id === state.activeId) return state.tabs[i];
  return null;
}

function createTab(name, content, save){
  state.counter++;
  var tab = {
    id: newId(),
    name: name || ("Untitled " + state.counter),
    content: content || ""
  };
  state.tabs.push(tab);
  state.activeId = tab.id;
  renderTabs();
  if (save !== false) saveState();
  try { editor.focus(); } catch(e){}
  return tab;
}

function closeTab(id){
  var idx = -1;
  for (var i=0;i<state.tabs.length;i++) if (state.tabs[i].id === id) idx = i;
  if (idx < 0) return;
  state.tabs.splice(idx, 1);
  if (!state.tabs.length){
    createTab(null, "", false);
  } else if (state.activeId === id){
    state.activeId = state.tabs[Math.max(0, idx - 1)].id;
  }
  renderTabs();
  saveState();
}

function selectTab(id){
  if (state.activeId === id) return;
  var t = activeTab();
  if (t) t.content = editor.value;
  state.activeId = id;
  renderTabs();
  saveState();
  try { editor.focus(); } catch(e){}
}

function renderTabs(){
  tabsEl.innerHTML = "";
  state.tabs.forEach(function(t){
    var el = document.createElement("div");
    el.className = "tab" + (t.id === state.activeId ? " active" : "");
    el.setAttribute("data-id", t.id);
    el.title = t.name + " (double-click to rename)";

    var nameEl = document.createElement("span");
    nameEl.className = "tab-name";
    nameEl.textContent = t.name;
    el.appendChild(nameEl);

    var x = document.createElement("span");
    x.className = "tab-x";
    x.textContent = "×";
    x.title = "Close tab";
    el.appendChild(x);

    tabsEl.appendChild(el);
  });

  var t = activeTab();
  editor.value = t ? t.content : "";
  editor.disabled = !t;
  updateInfo();
}

function updateInfo(){
  var t = activeTab();
  if (!t){ npInfo.textContent = "—"; return; }
  var text = editor.value;
  var lines = text.length ? text.split("\n").length : 1;
  var words = text.trim() ? text.trim().split(/\s+/).length : 0;
  npInfo.textContent = t.name + "  •  " + lines + " lines, " + words + " words, " + text.length + " chars  •  " +
    state.tabs.length + (state.tabs.length === 1 ? " tab" : " tabs");
}

tabsEl.addEventListener("click", function(e){
  var tabEl = e.target.closest(".tab");
  if (!tabEl) return;
  var id = tabEl.getAttribute("data-id");
  if (e.target.classList.contains("tab-x")){
    e.stopPropagation();
    closeTab(id);
    return;
  }
  selectTab(id);
});

tabsEl.addEventListener("dblclick", function(e){
  var tabEl = e.target.closest(".tab");
  if (!tabEl || e.target.classList.contains("tab-x")) return;
  var id = tabEl.getAttribute("data-id");
  var t = null;
  state.tabs.forEach(function(x){ if (x.id === id) t = x; });
  if (!t) return;
  var name = window.prompt("Rename tab:", t.name);
  if (name !== null){
    name = name.trim();
    if (name) { t.name = name; renderTabs(); saveState(); }
  }
});

document.getElementById("new-tab").addEventListener("click", function(){
  var t = activeTab();
  if (t) t.content = editor.value;
  createTab(null, "");
});

var saveTimer = null;
editor.addEventListener("input", function(){
  var t = activeTab();
  if (!t) return;
  t.content = editor.value;
  updateInfo();
  npSaved.textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 180);
});
editor.addEventListener("blur", function(){
  var t = activeTab();
  if (t) { t.content = editor.value; saveState(); }
});
window.addEventListener("beforeunload", function(){
  var t = activeTab();
  if (t) t.content = editor.value;
  saveState();
});

/* tab key inserts a tab character instead of leaving the editor */
editor.addEventListener("keydown", function(e){
  if (e.key === "Tab"){
    e.preventDefault();
    var s = editor.selectionStart, en = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + "\t" + editor.value.slice(en);
    editor.selectionStart = editor.selectionEnd = s + 1;
    editor.dispatchEvent(new Event("input"));
  }
});

loadState();
renderTabs();
saveState();

/* =====================================================================
   Clock + startup
   ===================================================================== */
function tick(){
  var d = new Date();
  var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var hh = String(d.getHours()).padStart(2,"0");
  var mm = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("clock").textContent = days[d.getDay()] + " " + hh + ":" + mm;
}
tick();
setInterval(tick, 1000 * 15);

window.addEventListener("resize", function(){
  windows().forEach(function(w){
    if (w.style.display !== "none" && w.dataset.maxed !== "1") ensureGeometry(w);
  });
});

/* Deselect desktop icons when clicking wallpaper */
desktop.addEventListener("mousedown", function(e){
  if (e.target === desktop){
    document.querySelectorAll(".desk-icon.sel").forEach(function(i){ i.classList.remove("sel"); });
  }
});

/* Open both apps on first paint so the desktop looks alive */
openWin(filesWin);
openWin(npWin);
updateDock();
})();
