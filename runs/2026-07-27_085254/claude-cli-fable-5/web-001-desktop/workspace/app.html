<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: "Ubuntu", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    color: #f2f2f2;
    user-select: none;
  }

  /* ---------- Desktop ---------- */
  #desktop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 90% at 70% 10%, rgba(233,84,32,.35), transparent 55%),
      radial-gradient(ellipse 100% 80% at 15% 90%, rgba(119,33,111,.55), transparent 60%),
      linear-gradient(135deg, #2c001e 0%, #4a1042 45%, #77216f 75%, #963d8f 100%);
    overflow: hidden;
  }

  /* subtle noise-ish texture via layered gradients */
  #desktop::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
    pointer-events: none;
  }

  /* ---------- Top bar ---------- */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 30px;
    background: rgba(20, 16, 20, .92);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 13px;
    z-index: 5000;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #topbar .tb-left  { display: flex; gap: 14px; align-items: center; }
  #topbar .tb-left b { font-weight: 500; }
  #topbar .tb-right { display: flex; gap: 12px; align-items: center; opacity: .9; }
  #clock { font-variant-numeric: tabular-nums; }

  /* ---------- Dock / Taskbar ---------- */
  #taskbar {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 64px;
    background: rgba(20, 16, 20, .78);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    z-index: 5000;
    box-shadow: 0 4px 18px rgba(0,0,0,.45);
  }

  .launcher {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.06);
    color: #fff;
    transition: background .15s, transform .1s;
    position: relative;
  }
  .launcher:hover { background: rgba(255,255,255,.16); }
  .launcher:active { transform: scale(.93); }
  .launcher svg { width: 30px; height: 30px; display: block; }
  .launcher .tip {
    position: absolute;
    left: 58px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(20,16,20,.95);
    border: 1px solid rgba(255,255,255,.12);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .launcher:hover .tip { opacity: 1; }
  .launcher.running::after {
    content: "";
    position: absolute;
    left: -7px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #e95420;
  }

  /* ---------- Windows ---------- */
  .app-window {
    position: absolute;
    min-width: 360px;
    min-height: 240px;
    width: 560px;
    height: 400px;
    background: #2b2b2e;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }
  .app-window.hidden { display: none; }

  .titlebar {
    height: 38px;
    flex: 0 0 38px;
    background: linear-gradient(#3a3a3d, #313134);
    border-bottom: 1px solid rgba(0,0,0,.4);
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: move;
    gap: 8px;
  }
  .titlebar .win-title {
    flex: 1;
    text-align: center;
    font-weight: 500;
    font-size: 13px;
    color: #ddd;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .titlebar .win-icon { width: 18px; height: 18px; flex: 0 0 18px; }

  .win-close {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    border: none;
    border-radius: 50%;
    background: #e95420;
    color: #fff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter .12s;
  }
  .win-close:hover { filter: brightness(1.2); }

  .win-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #232326;
  }

  /* ---------- Files app ---------- */
  #files-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #2b2b2e;
    border-bottom: 1px solid rgba(255,255,255,.07);
    flex: 0 0 auto;
  }
  #files-up {
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: #eee;
    width: 30px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background .12s;
  }
  #files-up:hover:not(:disabled) { background: rgba(255,255,255,.15); }
  #files-up:disabled { opacity: .35; cursor: default; }
  #files-path {
    flex: 1;
    background: #1d1d20;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: "Ubuntu Mono", Consolas, monospace;
    font-size: 13px;
    color: #d7c4d3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #files-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 6px;
    align-content: start;
  }
  .fs-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 12.5px;
    word-break: break-word;
    color: #eee;
  }
  .fs-item:hover { background: rgba(255,255,255,.07); }
  .fs-item.selected { background: rgba(233,84,32,.32); }
  .fs-item svg { width: 44px; height: 44px; }
  .files-empty {
    grid-column: 1 / -1;
    color: #999;
    font-style: italic;
    padding: 20px;
    text-align: center;
  }

  #files-status {
    flex: 0 0 auto;
    padding: 5px 12px;
    font-size: 12px;
    color: #9a8f98;
    border-top: 1px solid rgba(255,255,255,.06);
    background: #26262a;
  }

  /* ---------- Notepad app ---------- */
  #notepad-window { width: 620px; height: 440px; }

  #tabbar-row {
    display: flex;
    align-items: stretch;
    background: #2b2b2e;
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex: 0 0 auto;
  }
  #tabs {
    display: flex;
    flex: 1;
    overflow-x: auto;
    min-width: 0;
  }
  #tabs::-webkit-scrollbar { height: 4px; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    max-width: 180px;
    min-width: 90px;
    font-size: 13px;
    color: #bbb;
    cursor: pointer;
    border-right: 1px solid rgba(255,255,255,.06);
    border-top: 2px solid transparent;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .tab:hover { background: rgba(255,255,255,.05); }
  .tab.active {
    background: #232326;
    color: #fff;
    border-top-color: #e95420;
  }
  .tab .tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tab .tab-x {
    width: 16px; height: 16px;
    border: none;
    background: transparent;
    color: #999;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 0;
    flex: 0 0 16px;
  }
  .tab .tab-x:hover { background: rgba(255,255,255,.15); color: #fff; }
  #new-tab {
    flex: 0 0 auto;
    width: 34px;
    border: none;
    background: transparent;
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    transition: background .12s;
  }
  #new-tab:hover { background: rgba(255,255,255,.1); }

  #editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: #1d1d20;
    color: #eaeaea;
    padding: 12px 14px;
    font-family: "Ubuntu Mono", Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    user-select: text;
  }

  #notepad-status {
    flex: 0 0 auto;
    padding: 5px 12px;
    font-size: 12px;
    color: #9a8f98;
    border-top: 1px solid rgba(255,255,255,.06);
    background: #26262a;
  }

  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3); }
</style>
</head>
<body>
<div id="desktop">

  <div id="topbar">
    <div class="tb-left"><b>Activities</b><span id="topbar-app">Ubuntu Desktop</span></div>
    <div class="tb-right">
      <span>&#9679;&#9679;&#9679;</span>
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="taskbar">
    <button id="open-files" class="launcher" title="Files">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="#e8a33d"/>
        <path d="M3 9h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" fill="#f5c26b"/>
      </svg>
      <span class="tip">Files</span>
    </button>
    <button id="open-notepad" class="launcher" title="Notepad">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="2.5" width="16" height="19" rx="2" fill="#ececec"/>
        <rect x="4" y="2.5" width="16" height="4" rx="2" fill="#e95420"/>
        <path d="M7 10h10M7 13h10M7 16h6" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="tip">Notepad</span>
    </button>
  </div>

  <!-- ============ Files window ============ -->
  <div id="files-window" class="app-window hidden" style="left: 120px; top: 70px;">
    <div class="titlebar">
      <svg class="win-icon" viewBox="0 0 24 24" fill="none">
        <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="#e8a33d"/>
      </svg>
      <span class="win-title">Files</span>
      <button class="win-close" title="Close">&#10005;</button>
    </div>
    <div class="win-body">
      <div id="files-toolbar">
        <button id="files-up" title="Up one level">&#8593;</button>
        <div id="files-path">/</div>
      </div>
      <div id="files-list"></div>
      <div id="files-status"></div>
    </div>
  </div>

  <!-- ============ Notepad window ============ -->
  <div id="notepad-window" class="app-window hidden" style="left: 260px; top: 120px;">
    <div class="titlebar">
      <svg class="win-icon" viewBox="0 0 24 24" fill="none">
        <rect x="4" y="2.5" width="16" height="19" rx="2" fill="#ececec"/>
        <rect x="4" y="2.5" width="16" height="4" rx="2" fill="#e95420"/>
      </svg>
      <span class="win-title">Notepad</span>
      <button class="win-close" title="Close">&#10005;</button>
    </div>
    <div class="win-body">
      <div id="tabbar-row">
        <div id="tabs"></div>
        <button id="new-tab" title="New tab">+</button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Start typing..."></textarea>
      <div id="notepad-status"></div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ================= Clock ================= */
  var clockEl = document.getElementById("clock");
  function tick() {
    var d = new Date();
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    clockEl.textContent = days[d.getDay()] + " " + months[d.getMonth()] + " " +
      d.getDate() + "  " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  tick();
  setInterval(tick, 15000);

  /* ================= Window manager ================= */
  var zCounter = 200;

  function bringToFront(win) {
    zCounter += 1;
    win.style.zIndex = zCounter;
  }

  function makeDraggable(win) {
    var bar = win.querySelector(".titlebar");
    bar.addEventListener("mousedown", function (e) {
      if (e.target.closest(".win-close")) return;
      e.preventDefault();
      bringToFront(win);
      var startX = e.clientX, startY = e.clientY;
      var rect = win.getBoundingClientRect();
      var origL = rect.left, origT = rect.top;
      function move(ev) {
        var nl = origL + (ev.clientX - startX);
        var nt = origT + (ev.clientY - startY);
        nl = Math.max(-rect.width + 80, Math.min(nl, window.innerWidth - 80));
        nt = Math.max(30, Math.min(nt, window.innerHeight - 40));
        win.style.left = nl + "px";
        win.style.top = nt + "px";
      }
      function up() {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      }
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
    win.addEventListener("mousedown", function () { bringToFront(win); });
  }

  function wireWindow(winId, launcherId, onShow) {
    var win = document.getElementById(winId);
    var launcher = document.getElementById(launcherId);
    makeDraggable(win);
    launcher.addEventListener("click", function () {
      win.classList.remove("hidden");
      launcher.classList.add("running");
      bringToFront(win);
      if (onShow) onShow();
    });
    win.querySelector(".win-close").addEventListener("click", function () {
      win.classList.add("hidden");
      launcher.classList.remove("running");
    });
  }

  /* ================= Files app ================= */
  // Folders are objects; files are strings (fake size labels).
  var FS = {
    "bin": { "bash": "1.2 MB", "cat": "35 KB", "cp": "141 KB", "ls": "138 KB", "mkdir": "84 KB", "mv": "147 KB", "rm": "72 KB", "sh": "125 KB" },
    "boot": { "grub": { "grub.cfg": "8 KB" }, "vmlinuz-6.8.0-generic": "14 MB", "initrd.img-6.8.0-generic": "104 MB" },
    "dev": { "null": "0 B", "random": "0 B", "sda": "0 B", "tty0": "0 B" },
    "etc": {
      "apt": { "sources.list": "2 KB" },
      "ssh": { "sshd_config": "3 KB" },
      "fstab": "1 KB", "hostname": "12 B", "hosts": "221 B", "passwd": "2 KB", "os-release": "386 B"
    },
    "home": {
      "user": {
        "Documents": {
          "notes.txt": "1 KB",
          "resume.pdf": "88 KB",
          "projects": { "todo.md": "2 KB", "ideas.md": "4 KB" }
        },
        "Downloads": { "ubuntu-24.04-desktop-amd64.iso": "5.7 GB", "wallpaper.jpg": "2.1 MB" },
        "Pictures": { "Screenshots": { "screenshot-01.png": "412 KB" }, "vacation.png": "3.4 MB", "cat.jpg": "1.8 MB" },
        "Music": {},
        "Videos": {},
        ".bashrc": "3 KB",
        ".profile": "807 B"
      }
    },
    "lib": { "systemd": { "systemd": "1.9 MB" }, "modules": {} },
    "opt": {},
    "proc": { "cpuinfo": "0 B", "meminfo": "0 B", "uptime": "0 B" },
    "root": {},
    "sbin": { "init": "43 KB", "fsck": "310 KB", "reboot": "27 KB" },
    "srv": {},
    "tmp": {},
    "usr": {
      "bin": { "python3": "6.8 MB", "gcc": "1.1 MB", "vim": "3.7 MB", "curl": "260 KB", "git": "3.9 MB" },
      "lib": {},
      "local": { "bin": {}, "share": {} },
      "share": { "doc": {}, "man": {}, "icons": {} }
    },
    "var": {
      "log": { "syslog": "4.2 MB", "auth.log": "812 KB", "kern.log": "1.6 MB" },
      "cache": { "apt": {} },
      "tmp": {},
      "www": { "html": { "index.html": "11 KB" } }
    }
  };

  var filesPath = [];   // array of segment names; [] = root
  var pathEl = document.getElementById("files-path");
  var listEl = document.getElementById("files-list");
  var upBtn = document.getElementById("files-up");
  var statusEl = document.getElementById("files-status");

  function currentDir() {
    var node = FS;
    for (var i = 0; i < filesPath.length; i++) node = node[filesPath[i]];
    return node;
  }

  var FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none">' +
    '<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="#e8a33d"/>' +
    '<path d="M3 9h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z" fill="#f5c26b"/></svg>';
  var FILE_SVG = '<svg viewBox="0 0 24 24" fill="none">' +
    '<path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" fill="#e6e6e6"/>' +
    '<path d="M14 2v5h5" fill="#bdbdbd"/>' +
    '<path d="M8.5 12h7M8.5 15h7M8.5 18h4.5" stroke="#9a9a9a" stroke-width="1.2" stroke-linecap="round"/></svg>';

  function renderFiles() {
    pathEl.textContent = "/" + filesPath.join("/");
    upBtn.disabled = filesPath.length === 0;
    listEl.innerHTML = "";
    var dir = currentDir();
    var names = Object.keys(dir).sort(function (a, b) {
      var af = typeof dir[a] === "object", bf = typeof dir[b] === "object";
      if (af !== bf) return af ? -1 : 1;
      return a.localeCompare(b);
    });

    if (names.length === 0) {
      var empty = document.createElement("div");
      empty.className = "files-empty";
      empty.textContent = "This folder is empty";
      listEl.appendChild(empty);
    }

    var folders = 0, files = 0;
    names.forEach(function (name) {
      var isFolder = typeof dir[name] === "object";
      if (isFolder) folders++; else files++;
      var item = document.createElement("div");
      item.className = "fs-item";
      item.innerHTML = isFolder ? FOLDER_SVG : FILE_SVG;
      var label = document.createElement("span");
      label.textContent = name;
      item.appendChild(label);
      item.title = isFolder ? (name + " (folder)") : (name + " — " + dir[name]);

      item.addEventListener("click", function () {
        var prev = listEl.querySelector(".fs-item.selected");
        if (prev) prev.classList.remove("selected");
        item.classList.add("selected");
      });
      if (isFolder) {
        item.addEventListener("dblclick", function () {
          filesPath.push(name);
          renderFiles();
        });
      }
      listEl.appendChild(item);
    });
    statusEl.textContent = folders + " folder" + (folders === 1 ? "" : "s") +
      ", " + files + " file" + (files === 1 ? "" : "s");
  }

  upBtn.addEventListener("click", function () {
    if (filesPath.length > 0) {
      filesPath.pop();
      renderFiles();
    }
  });

  /* ================= Notepad app ================= */
  var STORAGE_KEY = "ubuntu-notepad-v1";
  var tabsEl = document.getElementById("tabs");
  var newTabBtn = document.getElementById("new-tab");
  var editor = document.getElementById("editor");
  var npStatus = document.getElementById("notepad-status");

  var state = { tabs: [], activeId: null, seq: 1 };

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tabs) && parsed.tabs.length > 0) {
          state = parsed;
          if (!state.tabs.some(function (t) { return t.id === state.activeId; })) {
            state.activeId = state.tabs[0].id;
          }
          if (typeof state.seq !== "number") state.seq = state.tabs.length + 1;
          return;
        }
      }
    } catch (e) { /* corrupted storage — start fresh */ }
    var first = { id: "t1", title: "Untitled 1", content: "" };
    state = { tabs: [first], activeId: first.id, seq: 2 };
    saveState();
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function activeTab() {
    for (var i = 0; i < state.tabs.length; i++) {
      if (state.tabs[i].id === state.activeId) return state.tabs[i];
    }
    return state.tabs[0] || null;
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    state.tabs.forEach(function (t) {
      var el = document.createElement("div");
      el.className = "tab" + (t.id === state.activeId ? " active" : "");
      el.setAttribute("data-id", t.id);

      var title = document.createElement("span");
      title.className = "tab-title";
      title.textContent = t.title;
      el.appendChild(title);

      var x = document.createElement("button");
      x.className = "tab-x";
      x.title = "Close tab";
      x.innerHTML = "&#10005;";
      x.addEventListener("click", function (e) {
        e.stopPropagation();
        closeTab(t.id);
      });
      el.appendChild(x);

      el.addEventListener("click", function () {
        state.activeId = t.id;
        saveState();
        renderTabs();
        renderEditor();
      });
      tabsEl.appendChild(el);
    });
    renderEditor();
  }

  function renderEditor() {
    var t = activeTab();
    editor.value = t ? t.content : "";
    updateStatus();
  }

  function updateStatus() {
    var t = activeTab();
    if (!t) { npStatus.textContent = ""; return; }
    var len = t.content.length;
    var lines = t.content.length ? t.content.split("\n").length : 1;
    npStatus.textContent = t.title + " — " + lines + " line" + (lines === 1 ? "" : "s") +
      ", " + len + " character" + (len === 1 ? "" : "s") + " (saved)";
  }

  function newTab() {
    var t = { id: "t" + state.seq, title: "Untitled " + state.seq, content: "" };
    state.seq += 1;
    state.tabs.push(t);
    state.activeId = t.id;
    saveState();
    renderTabs();
    editor.focus();
  }

  function closeTab(id) {
    var idx = state.tabs.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    state.tabs.splice(idx, 1);
    if (state.tabs.length === 0) {
      var t = { id: "t" + state.seq, title: "Untitled " + state.seq, content: "" };
      state.seq += 1;
      state.tabs.push(t);
    }
    if (state.activeId === id) {
      state.activeId = state.tabs[Math.min(idx, state.tabs.length - 1)].id;
    }
    saveState();
    renderTabs();
  }

  editor.addEventListener("input", function () {
    var t = activeTab();
    if (!t) return;
    t.content = editor.value;
    var firstLine = t.content.split("\n")[0].trim();
    if (firstLine) {
      t.title = firstLine.length > 18 ? firstLine.slice(0, 18) + "…" : firstLine;
    } else {
      t.title = "Untitled " + t.id.slice(1);
    }
    saveState();
    // update just the visible tab label + status (avoid full re-render mid-typing)
    var tabEl = tabsEl.querySelector('.tab[data-id="' + t.id + '"] .tab-title');
    if (tabEl) tabEl.textContent = t.title;
    updateStatus();
  });

  newTabBtn.addEventListener("click", newTab);

  /* ================= Boot ================= */
  loadState();
  renderTabs();
  renderFiles();

  wireWindow("files-window", "open-files", function () { renderFiles(); });
  wireWindow("notepad-window", "open-notepad", function () {
    loadState();      // re-sync with localStorage on every open
    renderTabs();
    editor.focus();
  });
})();
</script>
</body>
</html>
