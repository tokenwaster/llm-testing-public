<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  gap: 16px;
}
h1 { font-size: 1.5rem; letter-spacing: 0.1em; text-transform: uppercase; color: #888; }
#score { font-size: 2rem; font-variant-numeric: tabular-nums; }
#snake {
  display: block;
  background: #0a0a0a;
  border: 2px solid #333;
  border-radius: 8px;
  box-shadow: 0 0 0 1px #222, 0 8px 32px rgba(0,0,0,0.6);
}
.controls { display: flex; gap: 12px; }
button {
  appearance: none;
  border: none;
  border-radius: 6px;
  padding: 10px 24px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.05s;
}
button:active { transform: scale(0.98); }
#start { background: #2a7; color: #fff; }
#start:hover { background: #3b8; }
#pause { background: #7a2; color: #fff; }
#pause:hover { background: #8b3; }
#reset { background: #444; color: #ddd; }
#reset:hover { background: #555; }
@media (max-width: 480px) {
  body { padding: 16px; }
  #snake { width: 100%; height: auto; }
}
</style>
</head>
<body>
<h1>Snake</h1>
<div id="score">0</div>
<canvas id="snake" width="400" height="400"></canvas>
<div class="controls">
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('snake');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const btnStart = document.getElementById('start');
  const btnPause = document.getElementById('pause');
  const btnReset = document.getElementById('reset');

  // Board config
  const COLS = 20;
  const ROWS = 20;
  const CELL_SIZE = canvas.width / COLS; // 20px

  // Game state
  let snake = [];
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = { x: 5, y: 5 };
  let alive = true;
  let score = 0;
  let tickInterval = null;
  const TICK_MS = 100;

  // Directions
  const DIRS = {
    up:    { x:  0, y: -1 },
    down:  { x:  0, y:  1 },
    left:  { x: -1, y:  0 },
    right: { x:  1, y:  0 }
  };

  function opposite(d1, d2) {
    return d1.x === -d2.x && d1.y === -d2.y;
  }

  function randomFreeCell() {
    const occupied = new Set(snake.map(([x, y]) => `${x},${y}`));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(`${x},${y}`)) free.push({ x, y });
      }
    }
    return free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function reset() {
    // Start snake length 3, centered horizontally, middle vertically
    const startX = Math.floor(COLS / 2) - 1;
    const startY = Math.floor(ROWS / 2);
    snake = [
      [startX, startY],     // head
      [startX - 1, startY],
      [startX - 2, startY]  // tail
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = randomFreeCell();
    alive = true;
    score = 0;
    scoreEl.textContent = score;
    draw();
  }

  function tick() {
    if (!alive) return;

    // Apply queued direction
    dir = nextDir;

    const head = snake[0];
    const newHead = [head[0] + dir.x, head[1] + dir.y];

    // Wall collision
    if (newHead[0] < 0 || newHead[0] >= COLS || newHead[1] < 0 || newHead[1] >= ROWS) {
      alive = false;
      stopAuto();
      draw();
      return;
    }

    // Self collision (check before adding new head)
    for (const [x, y] of snake) {
      if (x === newHead[0] && y === newHead[1]) {
        alive = false;
        stopAuto();
        draw();
        return;
      }
    }

    snake.unshift(newHead);

    // Food
    if (newHead[0] === food.x && newHead[1] === food.y) {
      score++;
      scoreEl.textContent = score;
      food = randomFreeCell();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      const x = i * CELL_SIZE;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      const y = i * CELL_SIZE;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

    // Food
    const padding = 2;
    const r = CELL_SIZE / 2 - padding;
    ctx.fillStyle = '#e54';
    ctx.beginPath();
    ctx.arc(
      food.x * CELL_SIZE + CELL_SIZE / 2,
      food.y * CELL_SIZE + CELL_SIZE / 2,
      r, 0, Math.PI * 2
    );
    ctx.fill();

    // Snake
    snake.forEach(([x, y], i) => {
      const isHead = i === 0;
      const px = x * CELL_SIZE + padding;
      const py = y * CELL_SIZE + padding;
      const pw = CELL_SIZE - padding * 2;
      const ph = CELL_SIZE - padding * 2;
      const radius = Math.min(pw, ph) / 3;

      ctx.fillStyle = isHead ? '#4f4' : '#3d3';
      roundRect(ctx, px, py, pw, ph, radius);
      ctx.fill();

      // Head eyes
      if (isHead) {
        ctx.fillStyle = '#111';
        const eyeSize = 3;
        const eyeOffset = 5;
        let ex1, ey1, ex2, ey2;
        if (dir.x === 1) { // right
          ex1 = ex2 = px + pw - eyeOffset;
          ey1 = py + eyeOffset;
          ey2 = py + ph - eyeOffset;
        } else if (dir.x === -1) { // left
          ex1 = ex2 = px + eyeOffset;
          ey1 = py + eyeOffset;
          ey2 = py + ph - eyeOffset;
        } else if (dir.y === -1) { // up
          ey1 = ey2 = py + eyeOffset;
          ex1 = px + eyeOffset;
          ex2 = px + pw - eyeOffset;
        } else { // down
          ey1 = ey2 = py + ph - eyeOffset;
          ex1 = px + eyeOffset;
          ex2 = px + pw - eyeOffset;
        }
        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Game over overlay
    if (!alive) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px system-ui';
      ctx.fillStyle = '#aaa';
      ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillText('Press Reset to play again', canvas.width / 2, canvas.height / 2 + 55);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function startAuto() {
    if (tickInterval) return;
    tickInterval = setInterval(tick, TICK_MS);
  }

  function stopAuto() {
    if (tickInterval) {
      clearInterval(tickInterval);
      tickInterval = null;
    }
  }

  // Button handlers
  btnStart.addEventListener('click', () => {
    if (!alive) reset();
    startAuto();
  });
  btnPause.addEventListener('click', stopAuto);
  btnReset.addEventListener('click', () => {
    stopAuto();
    reset();
  });

  // Keyboard
  window.addEventListener('keydown', e => {
    const key = e.key;
    let newDir = null;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = DIRS.up;
    else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = DIRS.down;
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = DIRS.left;
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = DIRS.right;
    if (newDir && !opposite(newDir, dir)) {
      nextDir = newDir;
      e.preventDefault();
    }
  });

  // Public API
  window.game = {
    get w() { return COLS; },
    get h() { return ROWS; },
    reset,
    tick,
    setDir(d) {
      const newDir = DIRS[d];
      if (newDir && !opposite(newDir, dir)) {
        nextDir = newDir;
      }
    },
    setFood(x, y) {
      if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
        food = { x, y };
        draw();
      }
    },
    snake() { return snake.map(([x, y]) => [x, y]); },
    food() { return [food.x, food.y]; },
    alive() { return alive; },
    score() { return score; }
  };

  // Initial draw
  reset();
})();
</script>
</body>
</html>
