<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UbuntuLOS — Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    font-family: "Ubuntu", "Cantarell", "Segoe UI", -apple-system, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    background: #111;
  }

  /* ===================== Desktop / wallpaper ===================== */
  #desktop {
    position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(1100px 760px at 78% 16%, rgba(233, 84, 32, .40), rgba(233, 84, 32, 0) 62%),
      radial-gradient(950px 720px at 10% 90%, rgba(119, 33, 111, .65), rgba(119, 33, 111, 0) 60%),
      radial-gradient(720px 520px at 45% 45%, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 70%),
      linear-gradient(140deg, #170a20 0%, #2b1130 38%, #4a1c40 68%, #77216f 100%);
  }

  /* ===================== Top bar ===================== */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 32px; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 13px; color: #eee;
    background: rgba(14, 14, 14, .78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .06);
  }
  .tb-left { display: flex; align-items: center; gap: 16px; min-width: 220px; }
  .tb-activities { font-weight: 700; }
  #tb-app { opacity: .85; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 500; letter-spacing: .3px; }
  .tb-right { display: flex; align-items: center; gap: 10px; min-width: 220px; justify-content: flex-end; font-size: 12px; opacity: .9; }

  /* ===================== Dock / taskbar ===================== */
  #taskbar {
    position: absolute; left: 0; top: 32px; bottom: 0; width: 64px; z-index: 1000;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 12px;
    background: rgba(18, 18, 18, .66);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid rgba(255, 255, 255, .06);
  }
  .launcher {
    position: relative; width: 46px; height: 46px; border: none; border-radius: 12px;
    background: rgba(255, 255, 255, .07); cursor: pointer;
    font-size: 23px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, transform .12s ease;
  }
  .launcher:hover { background: rgba(255, 255, 255, .17); }
  .launcher:active { transform: scale(.93); }
  .launcher.running::before {
    content: ''; position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 4px; height: 22px; border-radius: 2px; background: #E95420;
  }

  /* ===================== Desktop icon ===================== */
  .desk-icon {
    position: absolute; left: 88px; top: 56px; width: 92px; z-index: 1;
    padding: 8px 4px; border-radius: 8px; text-align: center; color: #fff; cursor: default;
  }
  .desk-icon .di-img { font-size: 40px; display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
  .desk-icon .di-label { display: block; margin-top: 4px; font-size: 12px; text-shadow: 0 1px 2px rgba(0, 0, 0, .85); }
  .desk-icon.sel { background: rgba(233, 84, 32, .35); }

  /* ===================== Windows ===================== */
  .window {
    position: absolute; display: none; flex-direction: column;
    min-width: 360px; min-height: 240px;
    background: #282828; border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 4px 16px rgba(0, 0, 0, .4);
    overflow: hidden; resize: both; z-index: 10;
  }
  .window.open { display: flex; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  .window.maximized {
    left: 64px !important; top: 32px !important;
    width: calc(100vw - 64px) !important; height: calc(100vh - 32px) !important;
    border-radius: 0; resize: none;
  }
  .win-titlebar {
    height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 14px; background: linear-gradient(#3d3d3d, #343434);
    border-bottom: 1px solid rgba(0, 0, 0, .45); cursor: grab;
  }
  .win-titlebar:active { cursor: grabbing; }
  .win-title { font-size: 13px; font-weight: 600; color: #f0f0f0; letter-spacing: .2px; }
  .win-controls { display: flex; gap: 8px; }
  .win-btn {
    width: 18px; height: 18px; border-radius: 50%; border: none; padding: 0;
    background: #4d4d4d; position: relative; cursor: pointer; flex: none;
    font-size: 12px; line-height: 18px; text-align: center; color: transparent;
    transition: background .1s ease, color .1s ease;
  }
  .win-titlebar:hover .win-btn { color: rgba(255, 255, 255, .92); }
  .win-close:hover { background: #E95420; color: #fff; }
  .win-min:hover, .win-max:hover { background: #8a8a8a; color: #111; }
  .win-close::before { content: '×'; }
  .win-min::before { content: '–'; }
  .win-max::before { content: '+'; }

  /* ===================== Files app ===================== */
  .files-toolbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: #2f2f2f; border-bottom: 1px solid rgba(0, 0, 0, .4);
  }
  #files-up {
    height: 30px; padding: 0 12px; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 7px;
    background: #3c3c3c; color: #eee; font-size: 13px;
  }
  #files-up:hover { background: #4b4b4b; }
  #files-path {
    flex: 1; height: 30px; display: flex; align-items: center; padding: 0 12px;
    background: #1b1b1b; border: 1px solid rgba(255, 255, 255, .08); border-radius: 7px;
    color: #e6e6e6; font-family: ui-monospace, "Ubuntu Mono", Consolas, monospace; font-size: 13px;
    overflow: hidden; white-space: nowrap;
  }
  #files-list {
    flex: 1; overflow: auto; padding: 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 4px; align-content: start; background: #242424;
  }
  .fs-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 6px; border-radius: 9px; border: 1px solid transparent;
    color: #eaeaea; font-size: 12px; text-align: center; word-break: break-word; cursor: default;
  }
  .fs-item::before { font-size: 36px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .4)); }
  .fs-item.dir::before { content: "\1F4C1"; }
  .fs-item.file::before { content: "\1F4C4"; }
  .fs-item:hover { background: rgba(255, 255, 255, .07); }
  .fs-item.selected { background: rgba(233, 84, 32, .32); border-color: rgba(233, 84, 32, .65); }
  #files-status {
    flex: none; padding: 5px 14px; font-size: 11px; color: #9a9a9a;
    background: #2a2a2a; border-top: 1px solid rgba(0, 0, 0, .4);
  }

  /* ===================== Notepad app ===================== */
  #tabs {
    flex: none; display: flex; align-items: stretch; height: 36px;
    background: #202020; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 8px 0 14px; max-width: 190px;
    background: #282828; color: #bdbdbd; font-size: 12.5px;
    border-right: 1px solid #191919; box-shadow: inset 0 0 0 transparent; cursor: default;
  }
  .tab.active { background: #1e1e1e; color: #fff; box-shadow: inset 0 2px 0 #E95420; }
  .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-close { position: relative; width: 14px; height: 14px; border-radius: 50%; flex: none; opacity: .55; }
  .tab-close:hover { opacity: 1; background: rgba(255, 255, 255, .18); }
  .tab-close::before, .tab-close::after {
    content: ''; position: absolute; left: 6px; top: 2px; width: 2px; height: 10px;
    background: #ccc; border-radius: 1px;
  }
  .tab-close::before { transform: rotate(45deg); }
  .tab-close::after { transform: rotate(-45deg); }
  #new-tab {
    flex: none; width: 36px; border: none; cursor: pointer;
    background: transparent; color: #cfcfcf; font-size: 18px; line-height: 1;
  }
  #new-tab:hover { background: rgba(255, 255, 255, .09); color: #fff; }
  #editor {
    flex: 1; width: 100%; border: none; outline: none; resize: none;
    background: #1e1e1e; color: #f5f5f5; padding: 14px 16px;
    font-family: ui-monospace, "Ubuntu Mono", "Cascadia Mono", Consolas, monospace;
    font-size: 13.5px; line-height: 1.55; user-select: text; caret-color: #E95420;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .3); border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>

<div id="desktop">

  <header id="topbar">
    <div class="tb-left">
      <span class="tb-activities">Activities</span>
      <span id="tb-app">Desktop</span>
    </div>
    <div class="tb-center" id="tb-clock"></div>
    <div class="tb-right"><span>&#128268;</span><span>&#128246;</span><span>&#128267;</span></div>
  </header>

  <aside id="taskbar">
    <button class="launcher" id="open-files" title="Files">&#128193;</button>
    <button class="launcher" id="open-notepad" title="Notepad">&#128221;</button>
  </aside>

  <div class="desk-icon" id="icon-home" title="Open your home folder">
    <span class="di-img">&#127968;</span>
    <span class="di-label">Home</span>
  </div>

  <!-- ============ Files window ============ -->
  <div class="window" id="files-window" style="left: 140px; top: 64px; width: 620px; height: 420px;">
    <div class="win-titlebar">
      <span class="win-title">Files</span>
      <div class="win-controls">
        <button class="win-btn win-min" title="Minimize"></button>
        <button class="win-btn win-max" title="Maximize"></button>
        <button class="win-btn win-close" title="Close"></button>
      </div>
    </div>
    <div class="files-toolbar">
      <button id="files-up" title="Go to parent folder">&#8593; Up</button>
      <div id="files-path">/</div>
    </div>
    <div class="files-list" id="files-list"></div>
    <div id="files-status"></div>
  </div>

  <!-- ============ Notepad window ============ -->
  <div class="window" id="notepad-window" style="left: 220px; top: 110px; width: 640px; height: 440px;">
    <div class="win-titlebar">
      <span class="win-title">Notepad</span>
      <div class="win-controls">
        <button class="win-btn win-min" title="Minimize"></button>
        <button class="win-btn win-max" title="Maximize"></button>
        <button class="win-btn win-close" title="Close"></button>
      </div>
    </div>
    <div id="tabs">
      <button id="new-tab" title="New tab">+</button>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Type here&hellip;"></textarea>
  </div>

</div>

<script>
(function () {
  'use strict';

  var filesWin = document.getElementById('files-window');
  var notepadWin = document.getElementById('notepad-window');
  var tbApp = document.getElementById('tb-app');

  /* ==================== Window manager ==================== */
  var zTop = 10;

  function bringToFront(win) {
    zTop += 1;
    win.style.zIndex = zTop;
  }

  function updateDock() {
    document.getElementById('open-files').classList.toggle('running', filesWin.classList.contains('open'));
    document.getElementById('open-notepad').classList.toggle('running', notepadWin.classList.contains('open'));
  }

  function showWindow(win) {
    win.classList.add('open');
    bringToFront(win);
    tbApp.textContent = win.querySelector('.win-title').textContent;
    updateDock();
  }

  function hideWindow(win) {
    win.classList.remove('open');
    var anyOpen = document.querySelector('.window.open');
    tbApp.textContent = anyOpen ? anyOpen.querySelector('.win-title').textContent : 'Desktop';
    updateDock();
  }

  Array.prototype.forEach.call(document.querySelectorAll('.window'), function (win) {
    var bar = win.querySelector('.win-titlebar');

    win.addEventListener('mousedown', function () {
      bringToFront(win);
      tbApp.textContent = win.querySelector('.win-title').textContent;
    });

    win.querySelector('.win-close').addEventListener('click', function () { hideWindow(win); });
    win.querySelector('.win-min').addEventListener('click', function () { hideWindow(win); });
    win.querySelector('.win-max').addEventListener('click', function () { win.classList.toggle('maximized'); });

    bar.addEventListener('dblclick', function (e) {
      if (e.target.closest('.win-btn')) return;
      win.classList.toggle('maximized');
    });

    bar.addEventListener('mousedown', function (e) {
      if (e.target.closest('.win-btn') || win.classList.contains('maximized')) return;
      e.preventDefault();
      var rect = win.getBoundingClientRect();
      var offX = e.clientX - rect.left;
      var offY = e.clientY - rect.top;
      function onMove(ev) {
        var x = Math.max(64, Math.min(ev.clientX - offX, window.innerWidth - 90));
        var y = Math.max(32, Math.min(ev.clientY - offY, window.innerHeight - 48));
        win.style.left = x + 'px';
        win.style.top = y + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  /* ==================== Files app ==================== */
  var FS = { type: 'dir', children: {
    bin: { type: 'dir', children: {
      bash:  { type: 'file', content: 'GNU bash, version 5.2.15(1)-release (x86_64-pc-linux-gnu)\nThis is a binary executable.' },
      cat:   { type: 'file', content: 'cat (GNU coreutils) 9.4 - concatenate files and print on the standard output.' },
      echo:  { type: 'file', content: 'echo (GNU coreutils) 9.4 - display a line of text.' },
      ls:    { type: 'file', content: 'ls (GNU coreutils) 9.4 - list directory contents.' },
      mkdir: { type: 'file', content: 'mkdir (GNU coreutils) 9.4 - make directories.' },
      sh:    { type: 'file', content: '#!/bin/dash\n# POSIX shell, symlink -> dash' }
    }},
    etc: { type: 'dir', children: {
      fstab:        { type: 'file', content: '# /etc/fstab: static file system information.\nUUID=51f7c2a1-9d3b  /  ext4  errors=remount-ro  0  1' },
      hostname:     { type: 'file', content: 'ubuntulos' },
      hosts:        { type: 'file', content: '127.0.0.1\tlocalhost\n127.0.1.1\tubuntulos\n\n::1\tip6-localhost ip6-loopback' },
      'os-release': { type: 'file', content: 'PRETTY_NAME="UbuntuLOS 24.04 LTS"\nNAME="UbuntuLOS"\nVERSION_ID="24.04"\nID=ubuntu\nID_LIKE=debian' },
      timezone:     { type: 'file', content: 'Etc/UTC' }
    }},
    home: { type: 'dir', children: {
      user: { type: 'dir', children: {
        Documents: { type: 'dir', children: {
          'notes.txt':  { type: 'file', content: 'Groceries:\n- coffee\n- oat milk\n- pasta\n\nIdeas:\n- build a fake desktop in one HTML file' },
          'todo.txt':   { type: 'file', content: 'TODO\n====\n[x] water the plants\n[ ] file taxes\n[ ] learn awk' },
          'report.odt': { type: 'file', content: '(OpenDocument Text - open with LibreOffice Writer)' }
        }},
        Downloads: { type: 'dir', children: {
          'setup.sh':                     { type: 'file', content: '#!/bin/sh\nset -e\necho "Setting things up..."\nsudo apt update && sudo apt upgrade -y' },
          'ubuntu-24.04-desktop-amd64.iso': { type: 'file', content: '(disk image, 5.7 GB)' },
          'wallpaper.png':                { type: 'file', content: '(PNG image, 3840 x 2160)' }
        }},
        Pictures: { type: 'dir', children: {
          'screenshot.png': { type: 'file', content: '(PNG image, 1920 x 1080)' },
          'vacation.jpg':   { type: 'file', content: '(JPEG image, 4032 x 3024)' }
        }},
        '.bashrc':     { type: 'file', content: '# ~/.bashrc\nalias ll="ls -alF"\nexport PS1="\\u@\\h:\\w\\$ "' },
        'readme.txt':  { type: 'file', content: 'Welcome to UbuntuLOS!\n\nDouble-click a folder to open it.\nDouble-click a file to view it in Notepad.' }
      }}
    }},
    opt:  { type: 'dir', children: {} },
    root: { type: 'dir', children: {} },
    tmp:  { type: 'dir', children: {} },
    usr: { type: 'dir', children: {
      bin: { type: 'dir', children: {
        gcc:     { type: 'file', content: 'gcc (Ubuntu 13.2.0-4ubuntu3) 13.2.0' },
        git:     { type: 'file', content: 'git version 2.43.0' },
        python3: { type: 'file', content: 'Python 3.12.3' }
      }},
      lib: { type: 'dir', children: {
        'libc.so.6': { type: 'file', content: 'GNU C Library (Ubuntu GLIBC 2.39) stable release version 2.39.' },
        'libm.so.6': { type: 'file', content: 'GNU C Library math library.' }
      }},
      share: { type: 'dir', children: {
        doc:   { type: 'dir', children: {} },
        fonts: { type: 'dir', children: {} },
        icons: { type: 'dir', children: {} }
      }}
    }},
    var: { type: 'dir', children: {
      cache: { type: 'dir', children: {
        apt: { type: 'dir', children: {} }
      }},
      log: { type: 'dir', children: {
        'auth.log': { type: 'file', content: 'Jun 21 14:02:11 ubuntulos sshd[812]: Server listening on 0.0.0.0 port 22.' },
        'dpkg.log': { type: 'file', content: '2025-06-21 14:01:03 status installed bash:amd64 5.2.15-2ubuntu1' },
        syslog:     { type: 'file', content: 'Jun 21 14:03:12 ubuntulos systemd[1]: Started Daily apt download activities.' }
      }},
      tmp: { type: 'dir', children: {} }
    }}
  }};

  var cwd = [];
  var filesPath = document.getElementById('files-path');
  var filesList = document.getElementById('files-list');
  var filesStatus = document.getElementById('files-status');
  var filesUp = document.getElementById('files-up');

  function nodeAt(parts) {
    var node = FS;
    for (var i = 0; i < parts.length; i++) node = node.children[parts[i]];
    return node;
  }

  function pathString() {
    return cwd.length ? '/' + cwd.join('/') : '/';
  }

  function renderFiles() {
    var node = nodeAt(cwd);
    var kids = node.children || {};
    filesPath.textContent = pathString();
    filesPath.title = pathString();
    filesList.innerHTML = '';

    var names = Object.keys(kids).sort(function (a, b) {
      var ta = kids[a].type, tb = kids[b].type;
      if (ta !== tb) return ta === 'dir' ? -1 : 1;
      return a.localeCompare(b);
    });

    names.forEach(function (name) {
      var child = kids[name];
      var item = document.createElement('div');
      item.className = 'fs-item ' + (child.type === 'dir' ? 'dir' : 'file');
      item.textContent = name;
      item.title = name;
      item.addEventListener('click', function () {
        Array.prototype.forEach.call(filesList.querySelectorAll('.fs-item'), function (el) {
          el.classList.remove('selected');
        });
        item.classList.add('selected');
      });
      item.addEventListener('dblclick', function () {
        if (child.type === 'dir') {
          cwd.push(name);
          renderFiles();
        } else {
          openFileInNotepad(name, child.content || '');
        }
      });
      filesList.appendChild(item);
    });

    filesStatus.textContent = names.length
      ? names.length + ' item' + (names.length > 1 ? 's' : '')
      : 'Empty folder';
  }

  filesUp.addEventListener('click', function () {
    if (cwd.length) {
      cwd.pop();
      renderFiles();
    }
  });

  /* ==================== Notepad app ==================== */
  var LS_KEY = 'ubuntulos-notepad-v1';
  var tabsEl = document.getElementById('tabs');
  var newTabBtn = document.getElementById('new-tab');
  var editor = document.getElementById('editor');

  function defaultState() {
    return { tabs: [{ id: 1, name: 'Untitled 1', content: '' }], activeId: 1, counter: 1 };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return defaultState();
      var s = JSON.parse(raw);
      if (!s || !Array.isArray(s.tabs) || !s.tabs.length) return defaultState();
      if (!s.tabs.some(function (t) { return t.id === s.activeId; })) s.activeId = s.tabs[0].id;
      if (typeof s.counter !== 'number') s.counter = s.tabs.length;
      return s;
    } catch (e) {
      return defaultState();
    }
  }

  var state = loadState();

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function activeTab() {
    return state.tabs.find(function (t) { return t.id === state.activeId; }) || null;
  }

  function renderTabs() {
    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (el) { el.remove(); });
    state.tabs.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'tab' + (t.id === state.activeId ? ' active' : '');
      el.dataset.id = t.id;
      var label = document.createElement('span');
      label.className = 'tab-label';
      label.textContent = t.name;
      var close = document.createElement('span');
      close.className = 'tab-close';
      close.title = 'Close tab';
      el.appendChild(label);
      el.appendChild(close);
      tabsEl.insertBefore(el, newTabBtn);
    });
    var cur = activeTab();
    editor.value = cur ? cur.content : '';
  }

  function newTab(name, content) {
    state.counter += 1;
    var t = { id: state.counter, name: name || ('Untitled ' + state.counter), content: content || '' };
    state.tabs.push(t);
    state.activeId = t.id;
    save();
    renderTabs();
  }

  function activateTab(id) {
    if (state.activeId === id) { renderTabs(); return; }
    state.activeId = id;
    save();
    renderTabs();
  }

  function closeTab(id) {
    var i = state.tabs.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    state.tabs.splice(i, 1);
    if (!state.tabs.length) {
      state.counter += 1;
      state.tabs.push({ id: state.counter, name: 'Untitled ' + state.counter, content: '' });
    }
    if (!state.tabs.some(function (t) { return t.id === state.activeId; })) {
      state.activeId = state.tabs[Math.max(0, i - 1)].id;
    }
    save();
    renderTabs();
  }

  tabsEl.addEventListener('click', function (e) {
    var tabEl = e.target.closest('.tab');
    if (!tabEl) return;
    var id = Number(tabEl.dataset.id);
    if (e.target.closest('.tab-close')) closeTab(id);
    else activateTab(id);
  });

  newTabBtn.addEventListener('click', function () { newTab(); });

  editor.addEventListener('input', function () {
    var cur = activeTab();
    if (cur) {
      cur.content = editor.value;
      save();
    }
  });

  function openFileInNotepad(name, content) {
    showWindow(notepadWin);
    newTab(name, content);
    editor.focus();
  }

  /* ==================== Launchers & desktop icon ==================== */
  document.getElementById('open-files').addEventListener('click', function () {
    showWindow(filesWin);
    renderFiles();
  });
  document.getElementById('open-notepad').addEventListener('click', function () {
    showWindow(notepadWin);
    renderTabs();
    editor.focus();
  });

  var iconHome = document.getElementById('icon-home');
  iconHome.addEventListener('click', function () { iconHome.classList.toggle('sel'); });
  iconHome.addEventListener('dblclick', function () {
    cwd = ['home', 'user'];
    renderFiles();
    showWindow(filesWin);
  });

  /* ==================== Top bar clock ==================== */
  var clockEl = document.getElementById('tb-clock');
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function tick() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    clockEl.textContent = DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate() +
      '  ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ==================== Init ==================== */
  renderFiles();
  renderTabs();
  updateDock();
  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
