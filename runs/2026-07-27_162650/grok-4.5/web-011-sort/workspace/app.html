<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: #c9d1d9;
  }
  #controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  button {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover {
    background: #30363d;
    border-color: #8b949e;
  }
  button:active {
    background: #388bfd33;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    width: min(900px, 100%);
    height: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
  }
  .bar {
    flex: 1 1 0;
    min-width: 2px;
    background: #58a6ff;
    border-radius: 3px 3px 0 0;
    transition: height 0.08s ease, background 0.1s;
  }
  .bar.comparing {
    background: #f0883e;
  }
  .bar.sorted {
    background: #3fb950;
  }
</style>
</head>
<body>
  <h1>Sorting Visualizer</h1>
  <div id="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>
  <div id="bars"></div>

<script>
(function () {
  const DEFAULT = [64, 34, 25, 12, 22, 11, 90, 55, 43, 78, 19, 7, 88, 41, 60];
  let arr = DEFAULT.slice();
  let i = 0;
  let j = 0;
  let n = arr.length;
  let sorting = false;
  let animId = null;

  const barsEl = document.getElementById('bars');
  const sortBtn = document.getElementById('sort');
  const shuffleBtn = document.getElementById('shuffle');
  const resetBtn = document.getElementById('reset');

  function redraw(highlight) {
    barsEl.innerHTML = '';
    const max = Math.max.apply(null, arr.concat([1]));
    for (let k = 0; k < arr.length; k++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = ((arr[k] / max) * 100) + '%';
      if (highlight && (k === highlight[0] || k === highlight[1])) {
        bar.classList.add('comparing');
      }
      barsEl.appendChild(bar);
    }
  }

  function resetSortState() {
    i = 0;
    j = 0;
    n = arr.length;
    sorting = false;
    if (animId !== null) {
      clearTimeout(animId);
      animId = null;
    }
    sortBtn.disabled = false;
  }

  function isSorted(a) {
    for (let k = 1; k < a.length; k++) {
      if (a[k - 1] > a[k]) return false;
    }
    return true;
  }

  /* Bubble-sort one comparison/swap step */
  function sortStep() {
    if (isSorted(arr)) {
      redraw();
      return true;
    }
    if (n <= 1) {
      redraw();
      return true;
    }
    /* Advance past completed outer passes */
    while (i < n - 1) {
      if (j >= n - 1 - i) {
        j = 0;
        i++;
        continue;
      }
      /* One comparison */
      if (arr[j] > arr[j + 1]) {
        const tmp = arr[j];
        arr[j] = arr[j + 1];
        arr[j + 1] = tmp;
      }
      const hj = j;
      j++;
      redraw([hj, hj + 1]);
      if (isSorted(arr)) return true;
      return false;
    }
    redraw();
    return isSorted(arr);
  }

  window.viz = {
    array: function () { return arr.slice(); },
    setArray: function (a) {
      arr = a.slice();
      resetSortState();
      redraw();
    },
    sortStep: sortStep,
    sorted: function () { return isSorted(arr); }
  };

  function animateSort() {
    if (sortStep()) {
      sorting = false;
      sortBtn.disabled = false;
      redraw();
      return;
    }
    animId = setTimeout(animateSort, 60);
  }

  sortBtn.addEventListener('click', function () {
    if (sorting) return;
    if (isSorted(arr)) return;
    sorting = true;
    sortBtn.disabled = true;
    /* Restart sort state so animation always works from current array */
    i = 0;
    j = 0;
    n = arr.length;
    animateSort();
  });

  shuffleBtn.addEventListener('click', function () {
    resetSortState();
    for (let k = arr.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      const t = arr[k];
      arr[k] = arr[r];
      arr[r] = t;
    }
    redraw();
  });

  resetBtn.addEventListener('click', function () {
    resetSortState();
    arr = DEFAULT.slice();
    redraw();
  });

  redraw();
})();
</script>
</body>
</html>
