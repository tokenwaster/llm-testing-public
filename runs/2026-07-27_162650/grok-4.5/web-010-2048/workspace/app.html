<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eaeaea;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    gap: 1.25rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #eee;
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  #score {
    background: #16213e;
    border-radius: 8px;
    padding: 0.6rem 1.4rem;
    font-size: 1.25rem;
    font-weight: 600;
    min-width: 8rem;
    text-align: center;
  }

  #score::before {
    content: "Score: ";
    font-weight: 400;
    color: #8899aa;
  }

  #reset {
    background: #0f3460;
    color: #eaeaea;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  #reset:hover { background: #1a4a7a; }
  #reset:active { background: #0a2744; }

  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    background: #0f3460;
    padding: 12px;
    border-radius: 12px;
    width: min(90vw, 420px);
    height: min(90vw, 420px);
  }

  .cell {
    background: #16213e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
    font-weight: 700;
    color: #eee;
    transition: background 0.1s;
  }

  .cell[data-v="2"]    { background: #1b3a4b; color: #d0e8f2; }
  .cell[data-v="4"]    { background: #1a4a5e; color: #d0e8f2; }
  .cell[data-v="8"]    { background: #c47b30; color: #fff; }
  .cell[data-v="16"]   { background: #d46a2a; color: #fff; }
  .cell[data-v="32"]   { background: #e05a30; color: #fff; }
  .cell[data-v="64"]   { background: #ee3a20; color: #fff; }
  .cell[data-v="128"]  { background: #d4a820; color: #fff; font-size: 1.5rem; }
  .cell[data-v="256"]  { background: #d4b010; color: #fff; font-size: 1.5rem; }
  .cell[data-v="512"]  { background: #e0c010; color: #fff; font-size: 1.5rem; }
  .cell[data-v="1024"] { background: #ecc000; color: #fff; font-size: 1.25rem; }
  .cell[data-v="2048"] { background: #f0d000; color: #1a1a2e; font-size: 1.25rem; }
  .cell[data-v="4096"] { background: #a020f0; color: #fff; font-size: 1.25rem; }
  .cell[data-v="8192"] { background: #ff1493; color: #fff; font-size: 1.25rem; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="hud">
    <div id="score">0</div>
    <button id="reset">New Game</button>
  </div>
  <div id="board" aria-label="2048 game board"></div>

<script>
(function () {
  const SIZE = 4;
  let grid = [];
  let currentScore = 0;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const resetBtn = document.getElementById('reset');

  // Build cell elements once
  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const div = document.createElement('div');
    div.className = 'cell';
    div.dataset.v = '0';
    boardEl.appendChild(div);
    cells.push(div);
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function render() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const el = cells[r * SIZE + c];
        el.dataset.v = String(v);
        el.textContent = v === 0 ? '' : String(v);
      }
    }
    scoreEl.textContent = String(currentScore);
  }

  function emptyCells() {
    const list = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) list.push({ r, c });
      }
    }
    return list;
  }

  function spawn() {
    const empties = emptyCells();
    if (empties.length === 0) return;
    const pick = empties[Math.floor(Math.random() * empties.length)];
    grid[pick.r][pick.c] = Math.random() < 0.9 ? 2 : 4;
  }

  function copyGrid(g) {
    return g.map(row => row.slice());
  }

  function gridsEqual(a, b) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (a[r][c] !== b[r][c]) return false;
      }
    }
    return true;
  }

  // Slide + merge one line (array of SIZE numbers) toward index 0.
  // Returns { line, gained }.
  function slideLine(line) {
    // Compact non-zeros
    const tiles = line.filter(v => v !== 0);
    const result = [];
    let gained = 0;
    let i = 0;
    while (i < tiles.length) {
      if (i + 1 < tiles.length && tiles[i] === tiles[i + 1]) {
        const merged = tiles[i] * 2;
        result.push(merged);
        gained += merged;
        i += 2; // each tile merges at most once
      } else {
        result.push(tiles[i]);
        i += 1;
      }
    }
    while (result.length < SIZE) result.push(0);
    return { line: result, gained };
  }

  function moveLeft() {
    let gained = 0;
    for (let r = 0; r < SIZE; r++) {
      const { line, gained: g } = slideLine(grid[r]);
      grid[r] = line;
      gained += g;
    }
    return gained;
  }

  function moveRight() {
    let gained = 0;
    for (let r = 0; r < SIZE; r++) {
      const reversed = grid[r].slice().reverse();
      const { line, gained: g } = slideLine(reversed);
      grid[r] = line.reverse();
      gained += g;
    }
    return gained;
  }

  function moveUp() {
    let gained = 0;
    for (let c = 0; c < SIZE; c++) {
      const col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
      const { line, gained: g } = slideLine(col);
      for (let r = 0; r < SIZE; r++) grid[r][c] = line[r];
      gained += g;
    }
    return gained;
  }

  function moveDown() {
    let gained = 0;
    for (let c = 0; c < SIZE; c++) {
      const col = [];
      for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
      const reversed = col.reverse();
      const { line, gained: g } = slideLine(reversed);
      const restored = line.reverse();
      for (let r = 0; r < SIZE; r++) grid[r][c] = restored[r];
      gained += g;
    }
    return gained;
  }

  function doMove(dir) {
    const before = copyGrid(grid);
    let gained = 0;
    switch (dir) {
      case 'left':  gained = moveLeft();  break;
      case 'right': gained = moveRight(); break;
      case 'up':    gained = moveUp();    break;
      case 'down':  gained = moveDown();  break;
      default: return false;
    }
    const changed = !gridsEqual(before, grid);
    if (changed) {
      currentScore += gained;
      spawn();
      render();
    }
    return changed;
  }

  function reset() {
    grid = emptyGrid();
    currentScore = 0;
    spawn();
    spawn();
    render();
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down',
    };
    const dir = map[e.key];
    if (!dir) return;
    e.preventDefault();
    doMove(dir);
  });

  resetBtn.addEventListener('click', reset);

  // Programmatic API
  window.game = {
    size: SIZE,
    reset,
    move(dir) {
      return doMove(dir);
    },
    board() {
      return copyGrid(grid);
    },
    setBoard(arr) {
      grid = arr.map(row => row.slice());
      render();
    },
    score() {
      return currentScore;
    },
  };

  // Start
  reset();
})();
</script>
</body>
</html>
