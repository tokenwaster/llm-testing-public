<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Desktop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Ubuntu', 'Segoe UI', 'Cantarell', system-ui, sans-serif;
    background: #300a24;
  }

  #desktop {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(233, 84, 32, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(119, 33, 111, 0.4) 0%, transparent 45%),
      radial-gradient(ellipse at 60% 80%, rgba(46, 52, 64, 0.5) 0%, transparent 40%),
      linear-gradient(160deg, #2c001e 0%, #4a1030 35%, #300a24 70%, #1a0510 100%);
    overflow: hidden;
    user-select: none;
  }

  /* Top panel (Ubuntu style) */
  #top-panel {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(0, 0, 0, 0.72);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 9000;
    color: #eee;
    font-size: 13px;
    backdrop-filter: blur(8px);
  }

  #top-panel .panel-left { display: flex; align-items: center; gap: 10px; }
  #top-panel .activities {
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: 4px;
  }
  #top-panel .clock { font-variant-numeric: tabular-nums; opacity: 0.95; }

  /* Dock / taskbar */
  #taskbar {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(20, 10, 18, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 8000;
  }

  #taskbar button {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.06);
    transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    position: relative;
    color: #fff;
  }

  #taskbar button:hover {
    background: rgba(233, 84, 32, 0.35);
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }

  #taskbar button:active { transform: translateY(-2px) scale(0.96); }

  #taskbar button svg { width: 30px; height: 30px; pointer-events: none; }

  #taskbar button::after {
    content: '';
    position: absolute;
    bottom: 3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: transparent;
    transition: background 0.15s;
  }

  #taskbar button.active::after { background: #e95420; }

  /* Windows */
  .window {
    position: absolute;
    min-width: 360px;
    min-height: 240px;
    width: 640px;
    height: 420px;
    background: #2b2b2b;
    border-radius: 10px;
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }

  .window.visible {
    display: flex;
  }

  .window.focused {
    z-index: 200;
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(233, 84, 32, 0.25);
  }

  .win-titlebar {
    height: 40px;
    background: linear-gradient(180deg, #3d3d3d 0%, #323232 100%);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    cursor: grab;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(0,0,0,0.35);
  }

  .win-titlebar:active { cursor: grabbing; }

  .win-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .win-btn {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.12s;
  }

  .win-btn:hover { filter: brightness(1.15); }

  .win-close { background: #e95420; }
  .win-min { background: #eda711; }
  .win-max { background: #7cbf2a; }

  .win-title {
    flex: 1;
    text-align: center;
    color: #ddd;
    font-size: 13px;
    font-weight: 500;
    pointer-events: none;
    margin-right: 48px;
  }

  .win-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #242424;
    min-height: 0;
  }

  /* Files app */
  #files-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #2e2e2e;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }

  #files-up {
    background: #3a3a3a;
    border: 1px solid #4a4a4a;
    color: #eee;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.12s;
  }

  #files-up:hover { background: #4a4a4a; }
  #files-up:disabled { opacity: 0.4; cursor: default; }

  #files-path {
    flex: 1;
    background: #1e1e1e;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #e0e0e0;
    padding: 6px 12px;
    font-size: 13px;
    font-family: 'Ubuntu Mono', 'Consolas', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #files-listing {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
    align-content: start;
    min-height: 120px;
  }

  .fs-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 8px;
    cursor: pointer;
    color: #e8e8e8;
    font-size: 12px;
    text-align: center;
    word-break: break-word;
    border: 1px solid transparent;
    transition: background 0.1s;
  }

  .fs-item:hover {
    background: rgba(233, 84, 32, 0.18);
    border-color: rgba(233, 84, 32, 0.3);
  }

  .fs-item.selected {
    background: rgba(233, 84, 32, 0.28);
    border-color: rgba(233, 84, 32, 0.5);
  }

  .fs-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fs-icon svg { width: 44px; height: 44px; }

  /* Notepad */
  #notepad-toolbar {
    display: flex;
    align-items: stretch;
    background: #2e2e2e;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
    min-height: 36px;
  }

  #tabs {
    display: flex;
    flex: 1;
    overflow-x: auto;
    gap: 2px;
    padding: 4px 4px 0;
    align-items: flex-end;
  }

  .tab {
    padding: 6px 14px;
    background: #383838;
    color: #bbb;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid #1a1a1a;
    border-bottom: none;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    transition: background 0.1s, color 0.1s;
  }

  .tab:hover { background: #424242; color: #ddd; }

  .tab.active {
    background: #242424;
    color: #fff;
    font-weight: 500;
  }

  .tab-close {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: #999;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }

  .tab-close:hover { background: rgba(255,80,80,0.35); color: #fff; }

  #new-tab {
    background: transparent;
    border: none;
    color: #ccc;
    font-size: 18px;
    padding: 4px 12px;
    cursor: pointer;
    align-self: center;
    border-radius: 4px;
    line-height: 1;
    margin: 0 4px;
  }

  #new-tab:hover { background: rgba(255,255,255,0.1); color: #fff; }

  #editor {
    flex: 1;
    width: 100%;
    min-height: 120px;
    border: none;
    outline: none;
    resize: none;
    background: #1e1e1e;
    color: #e0e0e0;
    font-family: 'Ubuntu Mono', 'Consolas', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.55;
    padding: 14px 16px;
    tab-size: 4;
  }

  #editor::placeholder { color: #666; }

  /* Desktop icons decoration */
  .desk-icons {
    position: absolute;
    top: 48px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 1;
  }

  .desk-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 72px;
    color: #f0f0f0;
    font-size: 11px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    cursor: default;
    padding: 6px;
    border-radius: 6px;
  }

  .desk-icon:hover { background: rgba(255,255,255,0.08); }

  .desk-icon svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
</style>
</head>
<body>
<div id="desktop">
  <div id="top-panel">
    <div class="panel-left">
      <span class="activities">Activities</span>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="desk-icons">
    <div class="desk-icon">
      <svg viewBox="0 0 48 48" fill="none"><rect x="6" y="10" width="36" height="28" rx="3" fill="#e95420"/><rect x="10" y="16" width="28" height="16" fill="#2c001e"/><rect x="18" y="38" width="12" height="3" fill="#ccc"/><rect x="14" y="41" width="20" height="2" rx="1" fill="#aaa"/></svg>
      <span>Computer</span>
    </div>
    <div class="desk-icon">
      <svg viewBox="0 0 48 48" fill="none"><path d="M8 14h32a2 2 0 012 2v22a2 2 0 01-2 2H8a2 2 0 01-2-2V16a2 2 0 012-2z" fill="#dda76a"/><path d="M8 14l2-6h12l2 6" fill="#c4893f"/></svg>
      <span>Home</span>
    </div>
  </div>

  <!-- Files Window -->
  <div id="files-window" class="window" style="top: 60px; left: 80px; width: 680px; height: 460px;">
    <div class="win-titlebar" data-win="files-window">
      <div class="win-controls">
        <button class="win-btn win-close" title="Close" aria-label="Close"></button>
        <button class="win-btn win-min" title="Minimize" tabindex="-1"></button>
        <button class="win-btn win-max" title="Maximize" tabindex="-1"></button>
      </div>
      <div class="win-title">Files</div>
    </div>
    <div class="win-body">
      <div id="files-toolbar">
        <button id="files-up" title="Parent directory">↑ Up</button>
        <div id="files-path">/</div>
      </div>
      <div id="files-listing"></div>
    </div>
  </div>

  <!-- Notepad Window -->
  <div id="notepad-window" class="window" style="top: 100px; left: 200px; width: 620px; height: 440px;">
    <div class="win-titlebar" data-win="notepad-window">
      <div class="win-controls">
        <button class="win-btn win-close" title="Close" aria-label="Close"></button>
        <button class="win-btn win-min" title="Minimize" tabindex="-1"></button>
        <button class="win-btn win-max" title="Maximize" tabindex="-1"></button>
      </div>
      <div class="win-title">Notepad</div>
    </div>
    <div class="win-body">
      <div id="notepad-toolbar">
        <div id="tabs"></div>
        <button id="new-tab" title="New tab">+</button>
      </div>
      <textarea id="editor" placeholder="Start typing..." spellcheck="false"></textarea>
    </div>
  </div>

  <div id="taskbar">
    <button id="open-files" title="Files" aria-label="Open Files">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 6.5A1.5 1.5 0 014.5 5H9l2 2h8.5A1.5 1.5 0 0121 8.5v10a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5v-12z" fill="#e8b84a"/>
        <path d="M3 10h18v8.5a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5V10z" fill="#f5d78e"/>
      </svg>
    </button>
    <button id="open-notepad" title="Notepad" aria-label="Open Notepad">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="2" width="16" height="20" rx="2" fill="#f5f5f5"/>
        <rect x="7" y="6" width="10" height="1.5" rx="0.5" fill="#666"/>
        <rect x="7" y="10" width="10" height="1.5" rx="0.5" fill="#666"/>
        <rect x="7" y="14" width="7" height="1.5" rx="0.5" fill="#666"/>
        <path d="M16 15l3 1-1 3-5.5-5.5L16 15z" fill="#e95420"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Clock ---------- */
  function updateClock() {
    const el = document.getElementById('clock');
    const now = new Date();
    const opts = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    el.textContent = now.toLocaleString(undefined, opts);
  }
  updateClock();
  setInterval(updateClock, 15000);

  /* ---------- Window management ---------- */
  let zCounter = 200;

  function showWindow(id) {
    const win = document.getElementById(id);
    win.classList.add('visible');
    focusWindow(win);
    updateDockIndicators();
  }

  function hideWindow(win) {
    win.classList.remove('visible', 'focused');
    updateDockIndicators();
  }

  function focusWindow(win) {
    document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
    win.classList.add('focused');
    zCounter += 1;
    win.style.zIndex = zCounter;
  }

  function updateDockIndicators() {
    document.getElementById('open-files').classList.toggle(
      'active',
      document.getElementById('files-window').classList.contains('visible')
    );
    document.getElementById('open-notepad').classList.toggle(
      'active',
      document.getElementById('notepad-window').classList.contains('visible')
    );
  }

  document.getElementById('open-files').addEventListener('click', () => showWindow('files-window'));
  document.getElementById('open-notepad').addEventListener('click', () => {
    showWindow('notepad-window');
    ensureTabsLoaded();
  });

  document.querySelectorAll('.window').forEach(win => {
    win.addEventListener('mousedown', () => focusWindow(win));

    const closeBtn = win.querySelector('.win-close');
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hideWindow(win);
    });
  });

  /* Drag windows */
  document.querySelectorAll('.win-titlebar').forEach(bar => {
    let dragging = false, ox = 0, oy = 0;
    bar.addEventListener('mousedown', (e) => {
      if (e.target.closest('.win-btn')) return;
      const win = bar.closest('.window');
      dragging = true;
      const rect = win.getBoundingClientRect();
      ox = e.clientX - rect.left;
      oy = e.clientY - rect.top;
      focusWindow(win);
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const win = bar.closest('.window');
      let nx = e.clientX - ox;
      let ny = e.clientY - oy;
      ny = Math.max(28, ny);
      win.style.left = nx + 'px';
      win.style.top = ny + 'px';
    });
    window.addEventListener('mouseup', () => { dragging = false; });
  });

  /* ---------- Filesystem ---------- */
  const FS = {
    '/': { type: 'dir', children: ['bin', 'etc', 'home', 'usr', 'var', 'tmp', 'opt'] },
    '/bin': { type: 'dir', children: ['bash', 'ls', 'cat', 'cp', 'mv', 'rm', 'grep', 'echo'] },
    '/etc': { type: 'dir', children: ['passwd', 'hosts', 'hostname', 'os-release', 'fstab', 'apt'] },
    '/etc/apt': { type: 'dir', children: ['sources.list'] },
    '/home': { type: 'dir', children: ['user'] },
    '/home/user': { type: 'dir', children: ['Documents', 'Downloads', 'Pictures', 'Music', 'Desktop', '.bashrc'] },
    '/home/user/Documents': { type: 'dir', children: ['readme.txt', 'notes.md', 'report.odt'] },
    '/home/user/Downloads': { type: 'dir', children: ['installer.deb', 'archive.tar.gz'] },
    '/home/user/Pictures': { type: 'dir', children: ['vacation.jpg', 'screenshot.png', 'wallpaper.svg'] },
    '/home/user/Music': { type: 'dir', children: ['song.ogg'] },
    '/home/user/Desktop': { type: 'dir', children: [] },
    '/usr': { type: 'dir', children: ['bin', 'lib', 'share', 'local'] },
    '/usr/bin': { type: 'dir', children: ['python3', 'node', 'gcc', 'make'] },
    '/usr/lib': { type: 'dir', children: [] },
    '/usr/share': { type: 'dir', children: ['fonts', 'icons', 'doc'] },
    '/usr/local': { type: 'dir', children: ['bin'] },
    '/usr/local/bin': { type: 'dir', children: [] },
    '/var': { type: 'dir', children: ['log', 'cache', 'tmp', 'www'] },
    '/var/log': { type: 'dir', children: ['syslog', 'auth.log', 'dpkg.log'] },
    '/var/cache': { type: 'dir', children: [] },
    '/var/tmp': { type: 'dir', children: [] },
    '/var/www': { type: 'dir', children: ['html'] },
    '/var/www/html': { type: 'dir', children: ['index.html'] },
    '/tmp': { type: 'dir', children: [] },
    '/opt': { type: 'dir', children: [] }
  };

  /* Mark files (entries that aren't dirs in FS) */
  function isDir(path) {
    return FS[path] && FS[path].type === 'dir';
  }

  function joinPath(base, name) {
    if (base === '/') return '/' + name;
    return base + '/' + name;
  }

  function parentPath(path) {
    if (path === '/') return '/';
    const parts = path.split('/').filter(Boolean);
    parts.pop();
    return parts.length ? '/' + parts.join('/') : '/';
  }

  let currentPath = '/';

  const folderSvg = '<svg viewBox="0 0 48 48" fill="none"><path d="M6 14h14l3 3h19a2 2 0 012 2v19a2 2 0 01-2 2H6a2 2 0 01-2-2V16a2 2 0 012-2z" fill="#e8b84a"/><path d="M4 20h40v18a2 2 0 01-2 2H6a2 2 0 01-2-2V20z" fill="#f0c96a"/></svg>';
  const fileSvg = '<svg viewBox="0 0 48 48" fill="none"><path d="M12 4h16l10 10v28a2 2 0 01-2 2H12a2 2 0 01-2-2V6a2 2 0 012-2z" fill="#e8e8e8"/><path d="M28 4v10h10" fill="#ccc"/><rect x="16" y="22" width="16" height="2" rx="1" fill="#999"/><rect x="16" y="28" width="16" height="2" rx="1" fill="#999"/><rect x="16" y="34" width="10" height="2" rx="1" fill="#999"/></svg>';

  function renderListing() {
    const listing = document.getElementById('files-listing');
    const pathEl = document.getElementById('files-path');
    const upBtn = document.getElementById('files-up');
    pathEl.textContent = currentPath;
    upBtn.disabled = currentPath === '/';

    listing.innerHTML = '';
    const node = FS[currentPath];
    if (!node || !node.children) return;

    const children = node.children.slice().sort((a, b) => {
      const pa = joinPath(currentPath, a);
      const pb = joinPath(currentPath, b);
      const da = isDir(pa) ? 0 : 1;
      const db = isDir(pb) ? 0 : 1;
      if (da !== db) return da - db;
      return a.localeCompare(b);
    });

    children.forEach(name => {
      const full = joinPath(currentPath, name);
      const dir = isDir(full);
      const item = document.createElement('div');
      item.className = 'fs-item';
      item.dataset.name = name;
      item.dataset.path = full;
      item.dataset.dir = dir ? '1' : '0';
      item.innerHTML = '<div class="fs-icon">' + (dir ? folderSvg : fileSvg) + '</div><span></span>';
      item.querySelector('span').textContent = name;

      item.addEventListener('click', (e) => {
        listing.querySelectorAll('.fs-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
      });

      item.addEventListener('dblclick', () => {
        if (dir) {
          currentPath = full;
          renderListing();
        }
      });

      listing.appendChild(item);
    });
  }

  document.getElementById('files-up').addEventListener('click', () => {
    if (currentPath === '/') return;
    currentPath = parentPath(currentPath);
    renderListing();
  });

  renderListing();

  /* ---------- Notepad / tabs + localStorage ---------- */
  const STORAGE_KEY = 'ubuntu-notepad-tabs-v1';
  let tabs = [];
  let activeTabId = null;
  let tabsReady = false;

  function uid() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function loadTabs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.tabs) && data.tabs.length) {
          tabs = data.tabs;
          activeTabId = data.activeTabId && tabs.some(t => t.id === data.activeTabId)
            ? data.activeTabId
            : tabs[0].id;
          return;
        }
      }
    } catch (_) { /* ignore */ }
    tabs = [{ id: uid(), title: 'Untitled', content: '' }];
    activeTabId = tabs[0].id;
  }

  function saveTabs() {
    /* sync editor content into active tab first */
    const editor = document.getElementById('editor');
    const active = tabs.find(t => t.id === activeTabId);
    if (active && tabsReady) {
      active.content = editor.value;
    }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tabs, activeTabId }));
    } catch (_) { /* ignore quota */ }
  }

  function tabTitle(content, index) {
    const line = (content || '').split('\n')[0].trim();
    if (line) return line.slice(0, 24) + (line.length > 24 ? '…' : '');
    return 'Untitled ' + (index + 1);
  }

  function renderTabs() {
    const strip = document.getElementById('tabs');
    strip.innerHTML = '';
    tabs.forEach((tab, index) => {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
      el.dataset.id = tab.id;

      const label = document.createElement('span');
      label.textContent = tabTitle(tab.content, index);
      el.appendChild(label);

      const close = document.createElement('button');
      close.className = 'tab-close';
      close.title = 'Close tab';
      close.textContent = '×';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(tab.id);
      });
      el.appendChild(close);

      el.addEventListener('click', () => switchTab(tab.id));
      strip.appendChild(el);
    });
  }

  function switchTab(id) {
    if (id === activeTabId) return;
    const editor = document.getElementById('editor');
    const prev = tabs.find(t => t.id === activeTabId);
    if (prev) prev.content = editor.value;

    activeTabId = id;
    const next = tabs.find(t => t.id === activeTabId);
    editor.value = next ? next.content : '';
    renderTabs();
    saveTabs();
  }

  function closeTab(id) {
    const editor = document.getElementById('editor');
    const cur = tabs.find(t => t.id === activeTabId);
    if (cur) cur.content = editor.value;

    const idx = tabs.findIndex(t => t.id === id);
    if (idx === -1) return;

    tabs.splice(idx, 1);
    if (!tabs.length) {
      const t = { id: uid(), title: 'Untitled', content: '' };
      tabs.push(t);
      activeTabId = t.id;
      editor.value = '';
    } else if (activeTabId === id) {
      const newIdx = Math.min(idx, tabs.length - 1);
      activeTabId = tabs[newIdx].id;
      editor.value = tabs[newIdx].content;
    }
    renderTabs();
    saveTabs();
  }

  function createTab() {
    const editor = document.getElementById('editor');
    const prev = tabs.find(t => t.id === activeTabId);
    if (prev) prev.content = editor.value;

    const t = { id: uid(), title: 'Untitled', content: '' };
    tabs.push(t);
    activeTabId = t.id;
    editor.value = '';
    renderTabs();
    saveTabs();
    editor.focus();
  }

  function ensureTabsLoaded() {
    if (tabsReady) return;
    loadTabs();
    const editor = document.getElementById('editor');
    const active = tabs.find(t => t.id === activeTabId) || tabs[0];
    activeTabId = active.id;
    editor.value = active.content || '';
    renderTabs();
    tabsReady = true;
  }

  document.getElementById('new-tab').addEventListener('click', () => {
    ensureTabsLoaded();
    createTab();
  });

  const editor = document.getElementById('editor');
  editor.addEventListener('input', () => {
    const active = tabs.find(t => t.id === activeTabId);
    if (active) {
      active.content = editor.value;
      renderTabs();
      saveTabs();
    }
  });

  /* Persist on page unload */
  window.addEventListener('beforeunload', saveTabs);

  /* Load tabs immediately so reload restores even before opening notepad */
  ensureTabsLoaded();
})();
</script>
</body>
</html>
