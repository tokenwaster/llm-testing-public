<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    :root {
      --bg: #121212;
      --board: #252525;
      --cell: #3a3a3a;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --accent: #d98b45;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(92vw, 500px);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 3.4rem;
      letter-spacing: 2px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .score-box {
      background: #303030;
      border-radius: 6px;
      padding: 8px 18px;
      min-width: 110px;
    }

    .score-label {
      color: var(--muted);
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #score {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 2px;
    }

    #reset {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px 18px;
    }

    #reset:hover {
      filter: brightness(1.1);
    }

    #board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 10px;
      background: var(--board);
      border-radius: 8px;
    }

    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: var(--cell);
      color: var(--text);
      font-size: clamp(1.4rem, 7vw, 2.5rem);
      font-weight: bold;
      user-select: none;
    }

    .tile[data-value="0"] {
      color: transparent;
    }

    .tile[data-value="2"] { background: #eee4da; color: #333; }
    .tile[data-value="4"] { background: #ede0c8; color: #333; }
    .tile[data-value="8"] { background: #f2b179; }
    .tile[data-value="16"] { background: #f59563; }
    .tile[data-value="32"] { background: #f67c5f; }
    .tile[data-value="64"] { background: #f65e3b; }
    .tile[data-value="128"] { background: #edcf72; font-size: clamp(1.2rem, 6vw, 2rem); }
    .tile[data-value="256"] { background: #edcc61; font-size: clamp(1.2rem, 6vw, 2rem); }
    .tile[data-value="512"] { background: #edc850; font-size: clamp(1.2rem, 6vw, 2rem); }
    .tile[data-value="1024"],
    .tile[data-value="2048"] {
      background: #edc53f;
      font-size: clamp(1rem, 5vw, 1.7rem);
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>2048</h1>

    <div class="topbar">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span id="score">0</span>
      </div>
      <button id="reset" type="button">New Game</button>
    </div>

    <div id="board" aria-label="2048 board"></div>
    <div class="hint">Use the arrow keys to move the tiles</div>
  </main>

  <script>
    (function () {
      const size = 4;
      let grid = [];
      let currentScore = 0;

      const boardElement = document.getElementById("board");
      const scoreElement = document.getElementById("score");
      const resetButton = document.getElementById("reset");

      function emptyGrid() {
        return Array.from({ length: size }, () => Array(size).fill(0));
      }

      function render() {
        boardElement.innerHTML = "";

        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const value = grid[row][col];
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.dataset.value = String(value);
            tile.textContent = value === 0 ? "" : String(value);
            boardElement.appendChild(tile);
          }
        }

        scoreElement.textContent = String(currentScore);
      }

      function addRandomTile() {
        const empty = [];

        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            if (grid[row][col] === 0) {
              empty.push([row, col]);
            }
          }
        }

        if (empty.length === 0) return;

        const chosen = empty[Math.floor(Math.random() * empty.length)];
        grid[chosen[0]][chosen[1]] = Math.random() < 0.1 ? 4 : 2;
      }

      function reset() {
        grid = emptyGrid();
        currentScore = 0;
        addRandomTile();
        addRandomTile();
        render();
      }

      function collapseLine(line) {
        const values = line.filter(value => value !== 0);
        const result = [];
        let index = 0;

        while (index < values.length) {
          if (index + 1 < values.length && values[index] === values[index + 1]) {
            const merged = values[index] * 2;
            result.push(merged);
            currentScore += merged;
            index += 2;
          } else {
            result.push(values[index]);
            index++;
          }
        }

        while (result.length < size) {
          result.push(0);
        }

        return result;
      }

      function move(direction) {
        const before = grid.map(row => row.slice());
        const next = emptyGrid();

        if (direction === "left" || direction === "right") {
          for (let row = 0; row < size; row++) {
            let line = grid[row].slice();

            if (direction === "right") {
              line.reverse();
            }

            line = collapseLine(line);

            if (direction === "right") {
              line.reverse();
            }

            next[row] = line;
          }
        } else if (direction === "up" || direction === "down") {
          for (let col = 0; col < size; col++) {
            let line = [];

            for (let row = 0; row < size; row++) {
              line.push(grid[row][col]);
            }

            if (direction === "down") {
              line.reverse();
            }

            line = collapseLine(line);

            if (direction === "down") {
              line.reverse();
            }

            for (let row = 0; row < size; row++) {
              next[row][col] = line[row];
            }
          }
        } else {
          return false;
        }

        let changed = false;
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            if (before[row][col] !== next[row][col]) {
              changed = true;
            }
          }
        }

        if (!changed) {
          return false;
        }

        grid = next;
        addRandomTile();
        render();
        return true;
      }

      function board() {
        return grid.map(row => row.slice());
      }

      function setBoard(arr) {
        if (!Array.isArray(arr) || arr.length !== size ||
            arr.some(row => !Array.isArray(row) || row.length !== size)) {
          throw new Error("Board must be a 4x4 array.");
        }

        grid = arr.map(row => row.map(value => Number(value)));
        render();
      }

      resetButton.addEventListener("click", reset);

      document.addEventListener("keydown", function (event) {
        const directions = {
          ArrowLeft: "left",
          ArrowRight: "right",
          ArrowUp: "up",
          ArrowDown: "down"
        };

        if (directions[event.key]) {
          event.preventDefault();
          move(directions[event.key]);
        }
      });

      window.game = {
        size: size,
        reset: reset,
        move: move,
        board: board,
        setBoard: setBoard,
        score: function () {
          return currentScore;
        }
      };

      reset();
    })();
  </script>
</body>
</html>
