<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    background: #1a1a1a;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  #controls {
    margin-bottom: 10px;
  }
  button {
    padding: 8px 16px;
    margin: 0 5px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #444;
  }
  canvas {
    background: #222;
    border: 1px solid #444;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    touch-action: none;
  }
</style>
</head>
<body>
<div id="controls">
  <button id="drop">Drop</button>
  <button id="play">Pause</button>
  <button id="clear">Clear</button>
</div>
<canvas id="sim" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
let balls = [];
let isPlaying = true;
const gravity = 0.6;
const restitution = 0.8;

// Initial state
window.sim = {
  w: canvas.width,
  h: canvas.height,
  balls: () => [...balls],
  addBall: (x, y, vx=0, vy=0, r=10) => {
    balls.push({ x, y, vx, vy, r });
    draw();
  },
  clear: () => {
    balls = [];
    draw();
  },
  step: (dt=1) => {
    balls.forEach(b => {
      // Apply gravity
      b.vy += gravity;

      // Move
      b.x += b.vx;
      b.y += b.vy;

      // Floor
      if (b.y + b.r > canvas.height) {
        b.y = canvas.height - b.r;
        b.vy = -b.vy * restitution;
      } else if (b.y - b.r < 0) {
        b.y = b.r;
        b.vy = -b.vy * restitution;
      }

      // Walls
      if (b.x + b.r > canvas.width) {
        b.x = canvas.width - b.r;
        b.vx = -b.vx * restitution;
      } else if (b.x - b.r < 0) {
        b.x = b.r;
        b.vx = -b.vx * restitution;
      }
    });
    draw();
  }
};

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  balls.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = '#4f4';
    ctx.fill();
    ctx.strokeStyle = '#252';
    ctx.stroke();
  });
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  window.sim.addBall(x, y);
});

document.getElementById('drop').addEventListener('click', () => {
  window.sim.addBall(canvas.width / 2, 20, (Math.random() - 0.5) * 4);
});

document.getElementById('clear').addEventListener('click', () => {
  window.sim.clear();
});

document.getElementById('play').addEventListener('click', (e) => {
  isPlaying = !isPlaying;
  e.target.textContent = isPlaying ? 'Pause' : 'Play';
});

function loop() {
  if (isPlaying) window.sim.step();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
