<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sorting Visualizer</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }

    #bars {
      width: 100%;
      height: 300px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }

    .bar {
      width: 12px;
      background-color: #64b5f6;
      transition: height 0.1s ease;
      border-radius: 2px 2px 0 0;
    }

    #controls {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: #2c2c2c;
      color: #e0e0e0;
      border: 1px solid #444;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background-color: #3c3c3c;
    }
  </style>
</head>
<body>
  <div id="bars"></div>
  <div id="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    (function() {
      const barsContainer = document.getElementById('bars');
      const defaultLen = 30;
      const maxVal = 200;

      const viz = {
        data: [],
        state: { i: 0, j: 0, done: false }
      };

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function render() {
        barsContainer.innerHTML = '';
        viz.data.forEach(val => {
          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.height = (val * 1.5) + 'px';
          barsContainer.appendChild(bar);
        });
      }

      function resetState() {
        viz.state = { i: 0, j: 0, done: false };
      }

      window.viz = {
        array() {
          return [...viz.data];
        },
        setArray(a) {
          viz.data = a;
          resetState();
          render();
        },
        sorted() {
          for (let i = 0; i < viz.data.length - 1; i++) {
            if (viz.data[i] > viz.data[i + 1]) return false;
          }
          return true;
        },
        sortStep() {
          if (this.sorted()) {
            viz.state.done = true;
            return true;
          }
          const { data, state } = viz;
          if (state.i >= data.length - 1) {
            state.done = true;
            return true;
          }
          const limit = data.length - 1 - state.i;
          if (state.j < limit) {
            if (data[state.j] > data[state.j + 1]) {
              const tmp = data[state.j];
              data[state.j] = data[state.j + 1];
              data[state.j + 1] = tmp;
              render();
            }
            state.j++;
            return false;
          } else {
            state.i++;
            state.j = 0;
            return false;
          }
        }
      };

      function init() {
        const arr = Array.from({ length: defaultLen }, () => Math.floor(Math.random() * maxVal) + 10);
        viz.setArray(arr);
      }

      document.getElementById('shuffle').addEventListener('click', () => {
        const arr = Array.from({ length: defaultLen }, () => Math.floor(Math.random() * maxVal) + 10);
        viz.setArray(arr);
      });

      document.getElementById('reset').addEventListener('click', () => {
        resetState();
        render();
      });

      document.getElementById('sort').addEventListener('click', async () => {
        while (!viz.sorted()) {
          await new Promise(r => setTimeout(r, 10));
          viz.sortStep();
        }
      });

      init();
    })();
  </script>
</body>
</html>
