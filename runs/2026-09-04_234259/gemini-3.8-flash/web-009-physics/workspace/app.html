<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bouncing Ball Physics Playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      color: #f0f6fc;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #8b949e;
    }

    #sim {
      width: 500px;
      height: 500px;
      display: block;
      background: #161b22;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      cursor: crosshair;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #21262d;
      color: #c9d1d9;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
    }

    button:hover {
      background: #30363d;
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    button:active {
      transform: translateY(1px);
    }

    #drop {
      background: #1f6feb;
      border-color: #388bfd;
      color: #ffffff;
    }

    #drop:hover {
      background: #388bfd;
    }

    #play.playing {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }

    #play.playing:hover {
      background: #2ea043;
    }

    #clear:hover {
      background: #da3633;
      border-color: #f85149;
      color: #ffffff;
    }

    .hint {
      font-size: 0.78rem;
      color: #6e7681;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Physics Playground</h1>
      <p class="subtitle">Click the canvas to spawn bouncing balls</p>
    </header>

    <canvas id="sim" width="500" height="500"></canvas>

    <div class="controls">
      <button id="drop">Drop</button>
      <button id="play">Play</button>
      <button id="clear">Clear</button>
    </div>

    <div class="hint">Canvas: 500×500 · Gravity &amp; Wall Bounces Enabled</div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('sim');
      const ctx = canvas.getContext('2d');
      const dropBtn = document.getElementById('drop');
      const playBtn = document.getElementById('play');
      const clearBtn = document.getElementById('clear');

      const GRAVITY = 0.5;
      const RESTITUTION = 0.85;

      const PALETTE = [
        '#38bdf8', '#a855f7', '#f43f5e',
        '#fbbf24', '#34d399', '#ec4899',
        '#60a5fa', '#f97316'
      ];

      let balls = [];
      let isPlaying = false;
      let animFrameId = null;

      function getRandomColor() {
        return PALETTE[Math.floor(Math.random() * PALETTE.length)];
      }

      function createBall(x, y, vx = 0, vy = 0, r = 16) {
        const radius = (r !== undefined && r !== null) ? Number(r) : 16;
        const ball = {
          x: Number(x),
          y: Number(y),
          vx: Number(vx),
          vy: Number(vy),
          r: radius
        };

        Object.defineProperty(ball, 'color', {
          value: getRandomColor(),
          enumerable: false,
          writable: true
        });

        return ball;
      }

      function updatePhysics(dt) {
        const w = canvas.width;
        const h = canvas.height;

        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];

          // Gravity accelerates downward
          b.vy += GRAVITY * dt;

          // Integrate position
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          // Horizontal bounds collision
          if (b.x - b.r < 0) {
            b.x = b.r;
            b.vx = Math.abs(b.vx) * RESTITUTION;
          } else if (b.x + b.r > w) {
            b.x = w - b.r;
            b.vx = -Math.abs(b.vx) * RESTITUTION;
          }

          // Vertical bounds collision
          if (b.y - b.r < 0) {
            b.y = b.r;
            b.vy = Math.abs(b.vy) * RESTITUTION;
          } else if (b.y + b.r > h) {
            b.y = h - b.r;
            b.vy = -Math.abs(b.vy) * RESTITUTION;
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Canvas background
        ctx.fillStyle = '#161b22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle background grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        const step = 50;
        ctx.beginPath();
        for (let x = step; x < canvas.width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
        }
        for (let y = step; y < canvas.height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();

        // Draw balls
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          const color = b.color || '#38bdf8';

          ctx.save();

          // Soft glow
          ctx.shadowColor = color;
          ctx.shadowBlur = 8;

          ctx.beginPath();
          ctx.arc(b.x, b.y, Math.max(0.1, b.r), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();

          // Sphere 3D shading highlight
          ctx.shadowBlur = 0;
          const grad = ctx.createRadialGradient(
            b.x - b.r * 0.35, b.y - b.r * 0.35, Math.max(0.1, b.r * 0.05),
            b.x, b.y, Math.max(0.1, b.r)
          );
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
          grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.05)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(b.x, b.y, Math.max(0.1, b.r), 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      function loop() {
        if (!isPlaying) return;
        sim.step(1);
        animFrameId = requestAnimationFrame(loop);
      }

      // Programmatic Simulation API
      const sim = {
        get w() {
          return canvas.width;
        },
        get h() {
          return canvas.height;
        },
        balls() {
          return balls.slice();
        },
        addBall(x, y, vx = 0, vy = 0, r) {
          const b = createBall(x, y, vx, vy, r);
          balls.push(b);
          draw();
          return b;
        },
        clear() {
          balls = [];
          draw();
        },
        step(dt = 1) {
          updatePhysics(dt);
          draw();
        }
      };

      window.sim = sim;

      // User interaction handlers
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        sim.addBall(x, y, 0, 0);
      });

      dropBtn.addEventListener('click', () => {
        const r = 16;
        const x = sim.w / 2 + (Math.random() - 0.5) * 80;
        const y = r + 15;
        const vx = (Math.random() - 0.5) * 5;
        const vy = Math.random() * 2;
        sim.addBall(x, y, vx, vy, r);
      });

      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playBtn.textContent = 'Pause';
          playBtn.classList.add('playing');
          animFrameId = requestAnimationFrame(loop);
        } else {
          playBtn.textContent = 'Play';
          playBtn.classList.remove('playing');
          if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
          }
        }
      });

      clearBtn.addEventListener('click', () => {
        sim.clear();
      });

      // Initial render
      draw();
    })();
  </script>
</body>
</html>
