<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .score-box {
      font-size: 16px;
      font-weight: 600;
      background: #0f172a;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #score {
      color: #4ade80;
      font-size: 20px;
      font-weight: 700;
      min-width: 24px;
      text-align: right;
    }

    #snake {
      width: 400px;
      height: 400px;
      background-color: #090d16;
      border: 2px solid #334155;
      border-radius: 10px;
      display: block;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #start {
      background: #22c55e;
      color: #052e16;
    }

    #start:hover {
      background: #4ade80;
    }

    #pause {
      background: #f59e0b;
      color: #451a03;
    }

    #pause:hover {
      background: #fbbf24;
    }

    #reset {
      background: #ef4444;
      color: #450a0a;
    }

    #reset:hover {
      background: #f87171;
    }

    button:active {
      transform: translateY(1px);
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <div class="title">Snake</div>
      <div class="score-box">
        <span>Score:</span>
        <span id="score">0</span>
      </div>
    </div>

    <canvas id="snake" width="400" height="400"></canvas>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <div class="hint">Use Arrow keys to steer</div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('snake');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const btnStart = document.getElementById('start');
      const btnPause = document.getElementById('pause');
      const btnReset = document.getElementById('reset');

      const W = 20;
      const H = 20;
      const CELL_SIZE = canvas.width / W;

      const opposites = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      const moves = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      let snake = [];
      let food = [0, 0];
      let currentDir = 'right';
      let nextDir = 'right';
      let isAlive = true;
      let currentScore = 0;
      let loopTimer = null;

      function spawnFood() {
        const occupied = new Set();
        for (let i = 0; i < snake.length; i++) {
          occupied.add(snake[i][0] + ',' + snake[i][1]);
        }
        const freeCells = [];
        for (let x = 0; x < W; x++) {
          for (let y = 0; y < H; y++) {
            if (!occupied.has(x + ',' + y)) {
              freeCells.push([x, y]);
            }
          }
        }
        if (freeCells.length > 0) {
          const pick = freeCells[Math.floor(Math.random() * freeCells.length)];
          food = [pick[0], pick[1]];
        }
      }

      function render() {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid lines
        ctx.strokeStyle = '#151d2d';
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += CELL_SIZE) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += CELL_SIZE) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        // Food
        const fx = food[0] * CELL_SIZE + CELL_SIZE / 2;
        const fy = food[1] * CELL_SIZE + CELL_SIZE / 2;
        const radius = CELL_SIZE * 0.42;

        ctx.save();
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(fx, fy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Food highlight
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(fx - radius * 0.3, fy - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
        ctx.fill();

        // Snake
        for (let i = snake.length - 1; i >= 0; i--) {
          const [segX, segY] = snake[i];
          const px = segX * CELL_SIZE;
          const py = segY * CELL_SIZE;
          const padding = 1.5;

          if (i === 0) {
            // Head
            ctx.save();
            ctx.fillStyle = isAlive ? '#4ade80' : '#f87171';
            ctx.shadowColor = isAlive ? '#22c55e' : '#ef4444';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(
              px + padding,
              py + padding,
              CELL_SIZE - padding * 2,
              CELL_SIZE - padding * 2,
              5
            );
            ctx.fill();
            ctx.restore();

            // Eyes on head
            ctx.fillStyle = '#0f172a';
            const eyeSize = 3;
            let eye1 = [px + 5, py + 5];
            let eye2 = [px + CELL_SIZE - 8, py + 5];

            if (currentDir === 'down') {
              eye1 = [px + 5, py + CELL_SIZE - 8];
              eye2 = [px + CELL_SIZE - 8, py + CELL_SIZE - 8];
            } else if (currentDir === 'left') {
              eye1 = [px + 5, py + 5];
              eye2 = [px + 5, py + CELL_SIZE - 8];
            } else if (currentDir === 'right') {
              eye1 = [px + CELL_SIZE - 8, py + 5];
              eye2 = [px + CELL_SIZE - 8, py + CELL_SIZE - 8];
            }

            ctx.fillRect(eye1[0], eye1[1], eyeSize, eyeSize);
            ctx.fillRect(eye2[0], eye2[1], eyeSize, eyeSize);
          } else {
            // Body segment
            const progress = i / snake.length;
            ctx.fillStyle = isAlive
              ? `rgb(${Math.round(34 - progress * 10)}, ${Math.round(197 - progress * 40)}, ${Math.round(94 - progress * 20)})`
              : '#94a3b8';

            ctx.beginPath();
            ctx.roundRect(
              px + padding,
              py + padding,
              CELL_SIZE - padding * 2,
              CELL_SIZE - padding * 2,
              4
            );
            ctx.fill();
          }
        }

        // Game Over message
        if (!isAlive) {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f87171';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '14px sans-serif';
          ctx.fillText('Press Reset to play again', canvas.width / 2, canvas.height / 2 + 22);
        }
      }

      function resetGame() {
        if (loopTimer) {
          clearInterval(loopTimer);
          loopTimer = null;
        }
        currentScore = 0;
        scoreEl.textContent = '0';
        isAlive = true;
        currentDir = 'right';
        nextDir = 'right';

        // Length 3 snake placed horizontally
        snake = [
          [5, 10],
          [4, 10],
          [3, 10]
        ];

        food = [14, 10];
        render();
      }

      function tick() {
        if (!isAlive) return;

        currentDir = nextDir;
        const [dx, dy] = moves[currentDir];
        const newHead = [snake[0][0] + dx, snake[0][1] + dy];

        // Wall collision
        if (newHead[0] < 0 || newHead[0] >= W || newHead[1] < 0 || newHead[1] >= H) {
          isAlive = false;
          if (loopTimer) {
            clearInterval(loopTimer);
            loopTimer = null;
          }
          render();
          return;
        }

        const eating = (newHead[0] === food[0] && newHead[1] === food[1]);

        // Self collision: tail will move away if not eating
        const bodyToCheck = eating ? snake : snake.slice(0, -1);
        const hitBody = bodyToCheck.some(seg => seg[0] === newHead[0] && seg[1] === newHead[1]);

        if (hitBody) {
          isAlive = false;
          if (loopTimer) {
            clearInterval(loopTimer);
            loopTimer = null;
          }
          render();
          return;
        }

        snake.unshift(newHead);
        if (eating) {
          currentScore++;
          scoreEl.textContent = String(currentScore);
          spawnFood();
        } else {
          snake.pop();
        }

        render();
      }

      function setDirection(dir) {
        if (!moves[dir]) return;
        // Ignore 180° reversal relative to current movement heading
        if (opposites[dir] === currentDir) return;
        nextDir = dir;
      }

      function setFoodPosition(x, y) {
        food = [x, y];
        render();
      }

      function startAuto() {
        if (loopTimer) return;
        if (!isAlive) {
          resetGame();
        }
        loopTimer = setInterval(tick, 130);
      }

      function pauseAuto() {
        if (loopTimer) {
          clearInterval(loopTimer);
          loopTimer = null;
        }
      }

      btnStart.addEventListener('click', startAuto);
      btnPause.addEventListener('click', pauseAuto);
      btnReset.addEventListener('click', () => {
        pauseAuto();
        resetGame();
      });

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
          e.preventDefault();
        }
        switch (e.code) {
          case 'ArrowUp':
          case 'KeyW':
            setDirection('up');
            break;
          case 'ArrowDown':
          case 'KeyS':
            setDirection('down');
            break;
          case 'ArrowLeft':
          case 'KeyA':
            setDirection('left');
            break;
          case 'ArrowRight':
          case 'KeyD':
            setDirection('right');
            break;
        }
      });

      // Programmatic grading API
      window.game = {
        w: W,
        h: H,
        reset() {
          pauseAuto();
          resetGame();
        },
        tick() {
          tick();
        },
        setDir(dir) {
          setDirection(dir);
        },
        setFood(x, y) {
          setFoodPosition(x, y);
        },
        snake() {
          return snake.map(seg => [seg[0], seg[1]]);
        },
        food() {
          return [food[0], food[1]];
        },
        alive() {
          return isAlive;
        },
        score() {
          return currentScore;
        }
      };

      // Initial state
      resetGame();
    })();
  </script>
</body>
</html>
