<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10141c;
      --panel: #1a2230;
      --grid: #253044;
      --snake: #53e38a;
      --head: #8affb1;
      --food: #ff5577;
      --text: #eef4ff;
      --muted: #9daac0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #1c293b 0, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game {
      width: min(92vw, 540px);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 2rem;
      letter-spacing: .08em;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 11px 16px;
      border: 1px solid #2c3a50;
      border-radius: 12px;
      background: rgba(26, 34, 48, .9);
    }

    .score-label {
      color: var(--muted);
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    #score {
      color: var(--head);
      font-size: 1.45rem;
      font-weight: 800;
    }

    canvas {
      display: block;
      width: min(88vw, 480px);
      height: min(88vw, 480px);
      min-width: 400px;
      min-height: 400px;
      max-width: 100%;
      max-height: 70vh;
      margin: 0 auto;
      border: 4px solid #34445d;
      border-radius: 14px;
      background: #111923;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .35);
      image-rendering: crisp-edges;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: 1px solid #41526d;
      border-radius: 9px;
      padding: 10px 17px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #29374c; }
    button:active { transform: translateY(1px); }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>SNAKE</h1>
    <div class="hud">
      <span class="score-label">Score</span>
      <span id="score">0</span>
    </div>
    <canvas id="snake" width="480" height="480" aria-label="Snake game board"></canvas>
    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <p class="hint">Use the arrow keys to steer</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("snake");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");

      const w = 20;
      const h = 20;
      const cell = canvas.width / w;

      let body = [];
      let currentDir = "right";
      let queuedDir = "right";
      let currentFood = [15, 10];
      let currentScore = 0;
      let isAlive = true;
      let timer = null;

      const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
      };

      function reset() {
        stop();
        const y = Math.floor(h / 2);
        const x = Math.floor(w / 2);
        body = [[x, y], [x - 1, y], [x - 2, y]];
        currentDir = "right";
        queuedDir = "right";
        currentScore = 0;
        isAlive = true;
        placeRandomFood();
        draw();
      }

      function setDir(dir) {
        if (!["up", "down", "left", "right"].includes(dir)) return;
        if (opposite[currentDir] === dir) return;
        if (opposite[queuedDir] === dir) return;
        queuedDir = dir;
      }

      function tick() {
        if (!isAlive) return;

        if (opposite[currentDir] !== queuedDir) {
          currentDir = queuedDir;
        }

        const [x, y] = body[0];
        const delta = {
          up: [0, -1],
          down: [0, 1],
          left: [-1, 0],
          right: [1, 0]
        }[currentDir];

        const next = [x + delta[0], y + delta[1]];
        const eating = next[0] === currentFood[0] && next[1] === currentFood[1];

        if (
          next[0] < 0 || next[0] >= w ||
          next[1] < 0 || next[1] >= h
        ) {
          isAlive = false;
          stop();
          draw();
          return;
        }

        const collisionBody = eating ? body : body.slice(0, -1);
        if (collisionBody.some(([bx, by]) => bx === next[0] && by === next[1])) {
          isAlive = false;
          stop();
          draw();
          return;
        }

        body.unshift(next);

        if (eating) {
          currentScore++;
          placeRandomFood();
        } else {
          body.pop();
        }

        draw();
      }

      function setFood(x, y) {
        x = Number(x);
        y = Number(y);
        if (
          Number.isInteger(x) && Number.isInteger(y) &&
          x >= 0 && x < w && y >= 0 && y < h
        ) {
          currentFood = [x, y];
          draw();
        }
      }

      function placeRandomFood() {
        const free = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (!body.some(([bx, by]) => bx === x && by === y)) {
              free.push([x, y]);
            }
          }
        }
        if (free.length) {
          currentFood = free[Math.floor(Math.random() * free.length)];
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#111923";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#253044";
        ctx.lineWidth = 1;
        for (let x = 1; x < w; x++) {
          ctx.beginPath();
          ctx.moveTo(x * cell, 0);
          ctx.lineTo(x * cell, canvas.height);
          ctx.stroke();
        }
        for (let y = 1; y < h; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * cell);
          ctx.lineTo(canvas.width, y * cell);
          ctx.stroke();
        }

        const [fx, fy] = currentFood;
        ctx.fillStyle = "#ff5577";
        ctx.beginPath();
        ctx.arc(fx * cell + cell / 2, fy * cell + cell / 2, cell * .31, 0, Math.PI * 2);
        ctx.fill();

        body.forEach(([x, y], index) => {
          const gap = 2.5;
          ctx.fillStyle = index === 0 ? "#8affb1" : "#53e38a";
          ctx.beginPath();
          ctx.roundRect(
            x * cell + gap,
            y * cell + gap,
            cell - gap * 2,
            cell - gap * 2,
            index === 0 ? 6 : 4
          );
          ctx.fill();
        });

        scoreEl.textContent = String(currentScore);

        if (!isAlive) {
          ctx.fillStyle = "rgba(7, 11, 17, .64)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#eef4ff";
          ctx.font = "700 30px system-ui";
          ctx.textAlign = "center";
          ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
        }
      }

      function start() {
        if (!isAlive || timer) return;
        timer = setInterval(tick, 125);
      }

      function stop() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      document.getElementById("start").addEventListener("click", start);
      document.getElementById("pause").addEventListener("click", stop);
      document.getElementById("reset").addEventListener("click", reset);

      document.addEventListener("keydown", event => {
        const keys = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right"
        };
        if (keys[event.key]) {
          event.preventDefault();
          setDir(keys[event.key]);
        }
      });

      window.game = {
        w,
        h,
        reset,
        tick,
        setDir,
        setFood,
        snake: () => body.map(([x, y]) => [x, y]),
        food: () => [...currentFood],
        alive: () => isAlive,
        score: () => currentScore
      };

      reset();
    })();
  </script>
</body>
</html>
