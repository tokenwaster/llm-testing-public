<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  h1 {
    margin-bottom: 20px;
    font-size: 1.6rem;
    color: #e94560;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  button {
    background: #16213e;
    color: #e94560;
    border: 2px solid #e94560;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  button:hover {
    background: #e94560;
    color: #fff;
  }

  button:active {
    transform: scale(0.97);
  }

  #bars {
    width: 800px;
    max-width: 95vw;
    height: 420px;
    background: #16213e;
    border-radius: 10px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 8px;
    gap: 2px;
    position: relative;
    overflow: hidden;
  }

  .bar {
    background: linear-gradient(180deg, #e94560, #c73650);
    border-radius: 3px 3px 0 0;
    transition: height 0.12s ease;
    position: relative;
    min-width: 4px;
    flex-shrink: 0;
  }

  .bar.highlight {
    background: linear-gradient(180deg, #f5c518, #e0a800);
  }

  .bar.sorted {
    background: linear-gradient(180deg, #4ecca3, #36b88a);
  }
</style>
</head>
<body>

<h1>Sorting Visualizer</h1>

<div class="controls">
  <button id="shuffle">Shuffle</button>
  <button id="sort">Sort</button>
  <button id="reset">Reset</button>
</div>

<div id="bars"></div>

<script>
(function () {
  const barsContainer = document.getElementById('bars');
  let array = [];
  const N = 30;

  /* ── helpers ─────────────────────────────── */

  function randomArray() {
    const a = [];
    for (let i = 0; i < N; i++) {
      a.push(Math.floor(Math.random() * 180) + 20);
    }
    return a;
  }

  function render(overrides) {
    barsContainer.innerHTML = '';
    if (!array.length) return;
    const maxVal = Math.max(...array);
    array.forEach((val, idx) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      const h = (val / maxVal) * 380 + 20;
      bar.style.height = h + 'px';
      if (overrides && overrides.highlight && overrides.highlight.includes(idx)) {
        bar.classList.add('highlight');
      }
      if (overrides && overrides.sortedIndex != null && idx >= overrides.sortedIndex) {
        bar.classList.add('sorted');
      }
      barsContainer.appendChild(bar);
    });
  }

  function isSorted(arr) {
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] < arr[i - 1]) return false;
    }
    return true;
  }

  /* ── sort algorithm state ────────────────── */

  let sortState = null;

  function initSort() {
    sortState = {
      type: 'bubble',
      i: array.length - 1,
      j: 0,
      swapped: false,
      done: false
    };
  }

  /* ── public API ──────────────────────────── */

  window.viz = {
    array() {
      return array.slice();
    },
    setArray(a) {
      array = a.slice();
      sortState = null;
      render();
    },
    sortStep() {
      if (sortState === null) {
        initSort();
        render();
        return false;
      }

      // If already done, no-op
      if (sortState.done) return true;

      if (sortState.type === 'bubble') {
        const n = array.length;
        if (sortState.i <= 0) {
          sortState.done = true;
          render({ sortedIndex: n });
          return true;
        }

        // Bubble sort inner loop: compare and swap adjacent elements
        // We use a different approach: one swap per call
        let swapped = false;
        const arr = array;

        if (sortState.j < sortState.i) {
          if (arr[sortState.j] > arr[sortState.j + 1]) {
            [arr[sortState.j], arr[sortState.j + 1]] = [arr[sortState.j + 1], arr[sortState.j]];
            swapped = true;
            render({ highlight: [sortState.j, sortState.j + 1] });
          } else {
            render();
          }
          sortState.j++;
        } else {
          // End of pass
          if (!swapped) {
            sortState.done = true;
            render({ sortedIndex: array.length });
            return true;
          }
          sortState.i--;
          sortState.j = 0;
          swapped = false;
        }

        // Check if done after all passes
        if (sortState.i <= 0) {
          sortState.done = true;
          render({ sortedIndex: array.length });
          return true;
        }

        return false;
      }

      return false;
    },
    sorted() {
      return isSorted(array);
    }
  };

  /* ── button wiring ───────────────────────── */

  document.getElementById('shuffle').addEventListener('click', function () {
    sortState = null;
    const a = randomArray();
    viz.setArray(a);
  });

  document.getElementById('sort').addEventListener('click', function () {
    // Start auto-sorting with animation delay
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Sorting…';

    function step() {
      const done = viz.sortStep();
      if (!done && !btn.disabled) {
        requestAnimationFrame(function () {
          requestAnimationFrame(step);
        });
      } else {
        btn.disabled = false;
        btn.textContent = 'Sort';
      }
    }
    step();
  });

  document.getElementById('reset').addEventListener('click', function () {
    sortState = null;
    viz.setArray(randomArray());
  });

  /* ── initial render ──────────────────────── */
  viz.setArray(randomArray());

})();
</script>
</body>
</html>
