<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorting Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 1.5rem;
      font-weight: 500;
      letter-spacing: 1px;
    }
    #bars {
      width: 90vw;
      max-width: 1000px;
      height: 60vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .bar {
      flex: 1;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, #00bcd4, #e91e63);
      transition: height 0.05s ease;
      min-width: 2px;
    }
    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    button {
      background: #2c2c2c;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover {
      background: #383838;
      border-color: #666;
    }
    button:active {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Sorting Algorithm Visualizer</h1>
  <div id="bars"></div>
  <div class="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    (function () {
      const barsContainer = document.getElementById('bars');
      const sortBtn = document.getElementById('sort');
      const shuffleBtn = document.getElementById('shuffle');
      const resetBtn = document.getElementById('reset');

      const DEFAULT_SIZE = 40;

      let arr = [];
      let n = 0;
      let i = 0;
      let j = 0;
      let swapped = false;
      let done = true;
      let sortInterval = null;

      function generateSorted(size) {
        const a = [];
        for (let k = 1; k <= size; k++) {
          a.push(k);
        }
        return a;
      }

      function resetSortState() {
        n = arr.length;
        i = 0;
        j = 0;
        swapped = false;
        done = n <= 1;
      }

      function render() {
        barsContainer.innerHTML = '';
        if (n === 0) return;
        const max = Math.max(...arr);
        const fragment = document.createDocumentFragment();
        for (let k = 0; k < n; k++) {
          const bar = document.createElement('div');
          bar.className = 'bar';
          const height = max === 0 ? 0 : (arr[k] / max) * 100;
          bar.style.height = height + '%';
          fragment.appendChild(bar);
        }
        barsContainer.appendChild(fragment);
      }

      function sorted() {
        for (let k = 1; k < n; k++) {
          if (arr[k] < arr[k - 1]) return false;
        }
        return true;
      }

      function sortStep() {
        if (done) return true;

        if (j >= n - i - 1) {
          if (!swapped) {
            done = true;
            render();
            return true;
          }
          i++;
          j = 0;
          swapped = false;
          if (i >= n - 1) {
            done = true;
            render();
            return true;
          }
          render();
          return false;
        }

        if (arr[j] > arr[j + 1]) {
          const tmp = arr[j];
          arr[j] = arr[j + 1];
          arr[j + 1] = tmp;
          swapped = true;
        }
        j++;
        render();
        return false;
      }

      function stopAnimation() {
        if (sortInterval !== null) {
          clearInterval(sortInterval);
          sortInterval = null;
        }
      }

      function setArray(a) {
        arr = Array.from(a);
        resetSortState();
        stopAnimation();
        render();
      }

      function shuffleArray() {
        stopAnimation();
        for (let k = arr.length - 1; k > 0; k--) {
          const r = Math.floor(Math.random() * (k + 1));
          const tmp = arr[k];
          arr[k] = arr[r];
          arr[r] = tmp;
        }
        resetSortState();
        render();
      }

      function resetArray() {
        stopAnimation();
        arr = generateSorted(DEFAULT_SIZE);
        resetSortState();
        render();
      }

      sortBtn.addEventListener('click', () => {
        if (sortInterval !== null) return;
        if (done) return;
        sortInterval = setInterval(() => {
          if (sortStep()) {
            clearInterval(sortInterval);
            sortInterval = null;
          }
        }, 25);
      });

      shuffleBtn.addEventListener('click', shuffleArray);
      resetBtn.addEventListener('click', resetArray);

      window.viz = {
        array: () => arr.slice(),
        setArray,
        sortStep,
        sorted
      };

      resetArray();
    })();
  </script>
</body>
</html>
