<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #121212;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .container {
    text-align: center;
  }
  h1 {
    margin: 0 0 0.2em;
    font-size: 3rem;
    letter-spacing: 2px;
  }
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin: 16px 0;
  }
  #score {
    font-size: 1.4rem;
    font-weight: bold;
  }
  button {
    background: #333;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #444; }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 10px;
    background: #1e1e1e;
    padding: 12px;
    border-radius: 10px;
    margin: 0 auto;
    width: fit-content;
  }
  .tile {
    width: 80px;
    height: 80px;
    background: #333;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.6rem;
    font-weight: bold;
    color: #fff;
    transition: background 0.15s;
  }
  .hint {
    margin-top: 12px;
    color: #888;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>2048</h1>
    <div class="controls">
      <div>Score: <span id="score">0</span></div>
      <button id="reset">New Game</button>
    </div>
    <div id="board"></div>
    <div class="hint">Use arrow keys to move</div>
  </div>

<script>
(function() {
  const size = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const resetBtn = document.getElementById('reset');

  let grid = [];
  let scoreVal = 0;

  const tileColors = {
    2: '#4a4a4a', 4: '#5a5a5a', 8: '#6b5c3e', 16: '#7f6a3e',
    32: '#8f5a3e', 64: '#a14a3e', 128: '#b5a43e', 256: '#c4b43e',
    512: '#d4c43e', 1024: '#e4d43e', 2048: '#f4e43e'
  };

  function createTiles() {
    boardEl.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      const div = document.createElement('div');
      div.className = 'tile';
      boardEl.appendChild(div);
    }
  }

  function render() {
    const cells = boardEl.children;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const val = grid[r][c];
        const el = cells[r * size + c];
        el.textContent = val ? val : '';
        if (val) {
          el.style.backgroundColor = tileColors[val] || '#3c3a33';
          el.style.color = val <= 4 ? '#eee' : '#fff';
        } else {
          el.style.backgroundColor = '#333';
          el.style.color = '#fff';
        }
      }
    }
    scoreEl.textContent = scoreVal;
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (grid[r][c] === 0) cells.push({r, c});
      }
    }
    return cells;
  }

  function spawnTile() {
    const empties = emptyCells();
    if (empties.length === 0) return;
    const {r, c} = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function reset() {
    grid = Array.from({length: size}, () => Array(size).fill(0));
    scoreVal = 0;
    spawnTile();
    spawnTile();
    render();
  }

  function setBoard(arr) {
    grid = arr.map(row => row.slice());
    render();
  }

  function slide(line) {
    const result = [0, 0, 0, 0];
    let gained = 0;
    let target = 0;
    for (let i = 0; i < size; i++) {
      const val = line[i];
      if (val === 0) continue;
      if (result[target] === 0) {
        result[target] = val;
      } else if (result[target] === val) {
        result[target] *= 2;
        gained += result[target];
        target++;
      } else {
        target++;
        result[target] = val;
      }
    }
    return {line: result, score: gained};
  }

  function boardsEqual(a, b) {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (a[r][c] !== b[r][c]) return false;
      }
    }
    return true;
  }

  function move(direction) {
    const newGrid = grid.map(row => row.slice());
    let gained = 0;

    if (direction === 'left') {
      for (let r = 0; r < size; r++) {
        const s = slide(grid[r]);
        newGrid[r] = s.line;
        gained += s.score;
      }
    } else if (direction === 'right') {
      for (let r = 0; r < size; r++) {
        const rev = grid[r].slice().reverse();
        const s = slide(rev);
        newGrid[r] = s.line.reverse();
        gained += s.score;
      }
    } else if (direction === 'up') {
      for (let c = 0; c < size; c++) {
        const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
        const s = slide(col);
        for (let r = 0; r < size; r++) newGrid[r][c] = s.line[r];
        gained += s.score;
      }
    } else if (direction === 'down') {
      for (let c = 0; c < size; c++) {
        const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
        const s = slide(col);
        const rev = s.line.reverse();
        for (let r = 0; r < size; r++) newGrid[r][c] = rev[r];
        gained += s.score;
      }
    }

    const changed = !boardsEqual(grid, newGrid);
    if (changed) {
      grid = newGrid;
      scoreVal += gained;
      spawnTile();
      render();
    }
    return changed;
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down'
    };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  resetBtn.addEventListener('click', reset);

  window.game = {
    size,
    reset,
    move,
    board: () => grid.map(row => row.slice()),
    setBoard,
    score: () => scoreVal
  };

  createTiles();
  reset();
})();
</script>
</body>
</html>
