<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game {
    text-align: center;
  }
  #score {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
    color: #58a6ff;
  }
  #snake {
    display: block;
    width: 400px;
    height: 400px;
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 6px;
    margin: 0 auto;
  }
  .controls {
    margin-top: 16px;
  }
  button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 8px 18px;
    margin: 0 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    background: #30363d;
  }
</style>
</head>
<body>
  <div class="game">
    <div id="score">Score: 0</div>
    <canvas id="snake" width="400" height="400"></canvas>
    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('snake');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');

      const W = 20;
      const H = 20;
      const CELL = canvas.width / W; // 20

      const DIRS = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      let snakeBody = [];
      let dir = [1, 0];
      let pendingDirs = [];
      let foodPos = [0, 0];
      let isAlive = false;
      let scoreVal = 0;
      let timer = null;
      const TICK_MS = 120;

      function opposite(a, b) {
        return a[0] === -b[0] && a[1] === -b[1];
      }

      function isOnSnake(pos) {
        for (let i = 0; i < snakeBody.length; i++) {
          if (snakeBody[i][0] === pos[0] && snakeBody[i][1] === pos[1]) return true;
        }
        return false;
      }

      function randomFood() {
        let pos;
        do {
          pos = [Math.floor(Math.random() * W), Math.floor(Math.random() * H)];
        } while (isOnSnake(pos));
        foodPos = pos;
      }

      function draw() {
        ctx.fillStyle = '#161b22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#21262d';
        ctx.lineWidth = 1;
        for (let i = 0; i <= W; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
        }
        for (let j = 0; j <= H; j++) {
          ctx.beginPath();
          ctx.moveTo(0, j * CELL);
          ctx.lineTo(canvas.width, j * CELL);
          ctx.stroke();
        }

        ctx.fillStyle = '#f85149';
        ctx.beginPath();
        ctx.arc(
          foodPos[0] * CELL + CELL / 2,
          foodPos[1] * CELL + CELL / 2,
          CELL / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();

        for (let i = 0; i < snakeBody.length; i++) {
          const [x, y] = snakeBody[i];
          if (i === 0) {
            ctx.fillStyle = '#2ea043';
          } else {
            ctx.fillStyle = '#238636';
          }
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
        }
      }

      function updateScore() {
        scoreEl.textContent = 'Score: ' + scoreVal;
      }

      function tick() {
        if (!isAlive) return;

        while (pendingDirs.length > 0) {
          const d = pendingDirs.shift();
          const v = DIRS[d];
          if (!opposite(v, dir)) {
            dir = v;
            break;
          }
        }

        const head = snakeBody[0];
        const nx = head[0] + dir[0];
        const ny = head[1] + dir[1];
        const newHead = [nx, ny];

        snakeBody.unshift(newHead);

        if (nx === foodPos[0] && ny === foodPos[1]) {
          scoreVal++;
          randomFood();
        } else {
          snakeBody.pop();
        }

        if (nx < 0 || nx >= W || ny < 0 || ny >= H) {
          isAlive = false;
        } else {
          for (let i = 1; i < snakeBody.length; i++) {
            if (snakeBody[i][0] === nx && snakeBody[i][1] === ny) {
              isAlive = false;
              break;
            }
          }
        }

        updateScore();
        draw();

        if (!isAlive && timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      function reset() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        const sx = Math.floor(W / 2);
        const sy = Math.floor(H / 2);
        snakeBody = [[sx, sy], [sx - 1, sy], [sx - 2, sy]];
        dir = [1, 0];
        pendingDirs = [];
        scoreVal = 0;
        isAlive = true;
        randomFood();
        updateScore();
        draw();
      }

      function setDir(d) {
        if (!DIRS[d]) return;
        pendingDirs.push(d);
      }

      function setFood(x, y) {
        foodPos = [x, y];
        draw();
      }

      function startGame() {
        if (!timer) {
          timer = setInterval(tick, TICK_MS);
        }
      }

      function pauseGame() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      window.game = {
        w: W,
        h: H,
        reset: reset,
        tick: tick,
        setDir: setDir,
        setFood: setFood,
        snake: function () { return snakeBody; },
        food: function () { return foodPos; },
        alive: function () { return isAlive; },
        score: function () { return scoreVal; }
      };

      document.getElementById('start').addEventListener('click', startGame);
      document.getElementById('pause').addEventListener('click', pauseGame);
      document.getElementById('reset').addEventListener('click', reset);

      window.addEventListener('keydown', function (e) {
        const map = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right',
          w: 'up',
          s: 'down',
          a: 'left',
          d: 'right'
        };
        const d = map[e.key];
        if (d) {
          e.preventDefault();
          setDir(d);
        }
      });

      reset();
    })();
  </script>
</body>
</html>
