<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorting Visualizer</title>
<style>
  body {
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#222;
    color:#eee;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }
  #controls {
    margin:10px;
  }
  button {
    background:#555;
    border:none;
    color:#eee;
    padding:8px 12px;
    margin:0 5px;
    cursor:pointer;
    border-radius:4px;
    font-size:14px;
  }
  button:hover { background:#666; }
  #bars {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    height:300px;
    width:100%;
    max-width:800px;
    background:#111;
    padding:10px;
    box-sizing:border-box;
  }
  .bar {
    background:#4caf50;
    margin:0 1px;
    width:20px;
    transition:height .2s, background .2s;
  }
  .compare { background:#ff5722 !important; }
</style>
</head>
<body>
<div id="controls">
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset</button>
  <button id="sort">Sort</button>
</div>
<div id="bars"></div>

<script>
(() => {
  const BAR_COUNT = 30;
  const container = document.getElementById('bars');
  let arr = [];
  let n = 0;
  let i = 0; // outer index for bubble sort
  let j = 0; // inner index
  let compareIdx = []; // indices currently being compared
  let sortingInterval = null;

  function drawBars() {
    container.innerHTML = '';
    const max = Math.max(...arr, 1);
    arr.forEach((val, idx) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      if (compareIdx.includes(idx)) bar.classList.add('compare');
      const h = (val / max) * 100;
      bar.style.height = h + '%';
      container.appendChild(bar);
    });
  }

  function resetSortState() {
    i = 0;
    j = 0;
    compareIdx = [];
  }

  function setArray(a) {
    arr = a.slice();
    n = arr.length;
    resetSortState();
    drawBars();
  }

  function shuffleArray() {
    const a = Array.from({length: BAR_COUNT}, (_,k)=>k+1);
    for (let k = a.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      [a[k], a[r]] = [a[r], a[k]];
    }
    setArray(a);
  }

  function resetArray() {
    const a = Array.from({length: BAR_COUNT}, (_,k)=>k+1);
    setArray(a);
  }

  function sorted() {
    for (let k = 0; k < n - 1; k++) {
      if (arr[k] > arr[k + 1]) return false;
    }
    return true;
  }

  function sortStep() {
    if (sorted()) {
      compareIdx = [];
      drawBars();
      return true;
    }
    // compare arr[j] and arr[j+1]
    compareIdx = [j, j + 1];
    if (arr[j] > arr[j + 1]) {
      [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
    }
    j++;
    if (j >= n - i - 1) {
      j = 0;
      i++;
    }
    drawBars();
    return sorted();
  }

  // expose API
  window.viz = {
    array: () => arr.slice(),
    setArray: setArray,
    sortStep: sortStep,
    sorted: sorted
  };

  // button handlers
  document.getElementById('shuffle').addEventListener('click', () => {
    clearInterval(sortingInterval);
    shuffleArray();
  });

  document.getElementById('reset').addEventListener('click', () => {
    clearInterval(sortingInterval);
    resetArray();
  });

  document.getElementById('sort').addEventListener('click', () => {
    if (sortingInterval) return; // already sorting
    sortingInterval = setInterval(() => {
      if (window.viz.sortStep()) {
        clearInterval(sortingInterval);
        sortingInterval = null;
      }
    }, 100);
  });

  // initialise
  resetArray();
})();
</script>
</body>
</html>
