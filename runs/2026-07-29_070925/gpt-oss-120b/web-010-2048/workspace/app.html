<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 – Dark Theme</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:#111;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
  }
  #header {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:15px;
  }
  #score {
    font-size:1.5rem;
    padding:5px 10px;
    background:#222;
    border-radius:5px;
  }
  #reset {
    padding:5px 10px;
    font-size:1rem;
    background:#444;
    color:#eee;
    border:none;
    border-radius:5px;
    cursor:pointer;
  }
  #reset:hover { background:#555; }
  #board {
    display:grid;
    grid-template-columns:repeat(4,80px);
    grid-template-rows:repeat(4,80px);
    gap:6px;
    background:#333;
    padding:6px;
    border-radius:8px;
  }
  .tile {
    width:80px;
    height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:1.8rem;
    border-radius:5px;
    background:#1a1a1a;
    color:#ccc;
  }
</style>
</head>
<body>
<div id="header">
  <div id="score">Score: 0</div>
  <button id="reset">New Game</button>
</div>
<div id="board"></div>

<script>
(() => {
  const size = 4;
  let grid = Array.from({length:size},()=>Array(size).fill(0));
  let currentScore = 0;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const resetBtn = document.getElementById('reset');

  // ----- Rendering -----
  function getTileColor(v){
    const colors = {
      0:"#1a1a1a",
      2:"#776e65",
      4:"#776e65",
      8:"#f9f6f2",
      16:"#f9f6f2",
      32:"#f9f6f2",
      64:"#f9f6f2",
      128:"#edc850",
      256:"#edc850",
      512:"#edc850",
      1024:"#edc850",
      2048:"#edc850",
      4096:"#edc850"
    };
    return colors[v]||"#edc850";
  }
  function render(){
    boardEl.innerHTML = '';
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        const val = grid[r][c];
        const tile = document.createElement('div');
        tile.className='tile';
        tile.textContent = val===0?'':val;
        tile.style.backgroundColor = getTileColor(val);
        tile.style.color = val<=4 ? '#eee' : '#111';
        boardEl.appendChild(tile);
      }
    }
    scoreEl.textContent = 'Score: '+currentScore;
  }

  // ----- Game Logic -----
  function emptyCells(){
    const cells=[];
    for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(grid[r][c]===0) cells.push([r,c]);
    return cells;
  }
  function spawnTile(){
    const empties = emptyCells();
    if(empties.length===0) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random()<0.1 ? 4 : 2;
  }

  function reset(){
    grid = Array.from({length:size},()=>Array(size).fill(0));
    currentScore = 0;
    spawnTile(); spawnTile();
    render();
  }

  function board(){ return grid.map(row=>row.slice()); }

  function setBoard(arr){
    grid = arr.map(row=>row.slice());
    render();
  }

  function score(){ return currentScore; }

  // slide and merge a single line (array of numbers)
  function compress(line){
    const filtered = line.filter(v=>v!==0);
    const result=[];
    let addedScore=0;
    for(let i=0;i<filtered.length;i++){
      if(i+1<filtered.length && filtered[i]===filtered[i+1]){
        const merged = filtered[i]*2;
        result.push(merged);
        addedScore += merged;
        i++; // skip next
      }else{
        result.push(filtered[i]);
      }
    }
    while(result.length<size) result.push(0);
    return {newLine:result, addedScore};
  }

  function move(dir){
    let moved = false;
    let totalAdded = 0;
    const old = board();

    const clone = grid.map(row=>row.slice());

    const process = (line) => {
      const {newLine, addedScore} = compress(line);
      totalAdded += addedScore;
      return newLine;
    };

    if(dir==='left'){
      for(let r=0;r<size;r++){
        const newRow = process(clone[r]);
        grid[r] = newRow;
      }
    }else if(dir==='right'){
      for(let r=0;r<size;r++){
        const rev = clone[r].slice().reverse();
        const newRev = process(rev);
        grid[r] = newRev.reverse();
      }
    }else if(dir==='up'){
      for(let c=0;c<size;c++){
        const col = [];
        for(let r=0;r<size;r++) col.push(clone[r][c]);
        const newCol = process(col);
        for(let r=0;r<size;r++) grid[r][c]=newCol[r];
      }
    }else if(dir==='down'){
      for(let c=0;c<size;c++){
        const col = [];
        for(let r=0;r<size;r++) col.push(clone[r][c]);
        const rev = col.slice().reverse();
        const newRev = process(rev);
        const newCol = newRev.reverse();
        for(let r=0;r<size;r++) grid[r][c]=newCol[r];
      }
    }else{
      return false;
    }

    // check if board changed
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        if(grid[r][c]!==old[r][c]) { moved=true; break; }
      }
      if(moved) break;
    }

    if(moved){
      currentScore += totalAdded;
      spawnTile();
    }else{
      // revert any accidental changes (should be same)
      grid = old;
    }

    render();
    return moved;
  }

  // ----- Input -----
  document.addEventListener('keydown', e=>{
    const keyMap = {
      ArrowLeft:'left',
      ArrowRight:'right',
      ArrowUp:'up',
      ArrowDown:'down'
    };
    if(keyMap[e.key]){
      e.preventDefault();
      move(keyMap[e.key]);
    }
  });

  resetBtn.addEventListener('click', reset);

  // expose API
  window.game = {
    size,
    reset,
    move,
    board,
    setBoard,
    score
  };

  // start
  reset();
})();
</script>
</body>
</html>
