<!DOCTYPE html>
<html>
<head>
  <title>Conway's Game of Life</title>
  <style>
    body {
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #life {
      width: 800px;
      height: 800px;
      border: 2px solid #333;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(41, 20px); /* Adjusted for better visibility */
      grid-template-rows: repeat(41, 20px);
      border-collapse: collapse;
    }

    .cell {
      width: 20px;
      height: 20px;
      box-sizing: border-box;
      background-color: #333;
    }

    .live {
      background-color: #79e1ff;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #333;
      color: #fff;
      margin: 5px;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Conway's Game of Life</h1>

  <div id="life"></div>

  <button id="step">Step</button>
  <button id="play">Play</button>
  <button id="random">Randomize</button>
  <button id="clear">Clear</button>

  <script>
    const w = 41; // Number of cells in a row/column (must be at least 40)
    const h = 41;
    const lifeGrid = [];

    for (let y = 0; y < h; y++) {
      lifeGrid[y] = [];
      for (let x = 0; x < w; x++) {
        lifeGrid[y][x] = 0; // Initialize all cells to dead
      }
    }

    function get(x, y) {
      if (x < 0 || x >= w || y < 0 || y >= h) {
        return 0;
      }
      return lifeGrid[y][x];
    }

    function set(x, y, v) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      lifeGrid[y][x] = v;
    }

    function step() {
      const nextGrid = lifeGrid.map(row => [...row]); // Create a copy to avoid updating in place

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let liveNeighbors = 0;
          for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
              if (i === 0 && j === 0) continue; // Don't count the cell itself
              liveNeighbors += get(x + j, y + i);
            }
          }

          if (get(x, y) === 1) {
            if (liveNeighbors < 2 || liveNeighbors > 3) {
              nextGrid[y][x] = 0;
            } else {
              nextGrid[y][x] = 1;
            }
          } else {
            if (liveNeighbors === 3) {
              nextGrid[y][x] = 1;
            } else {
              nextGrid[y][x] = 0;
            }
          }
        }
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          lifeGrid[y][x] = nextGrid[y][x];
        }
      }

      redraw();
    }

    function clear() {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          lifeGrid[y][x] = 0;
        }
      }
      redraw();
    }

    function redraw() {
      const lifeElement = document.getElementById("life");
      lifeElement.innerHTML = ""; // Clear existing cells
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          if (lifeGrid[y][x] === 1) {
            cell.classList.add("live");
          }
          lifeElement.appendChild(cell);
        }
      }
    }

    function randomize() {
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          lifeGrid[y][x] = Math.round(Math.random());
        }
      }
      redraw();
    }


    document.getElementById("step").addEventListener("click", step);
    document.getElementById("play").addEventListener("click", () => {
      let intervalId;
      if (!intervalId) {
          intervalId = setInterval(step, 100); // Adjust speed as needed
          document.getElementById("play").textContent = "Pause";
      } else {
          clearInterval(intervalId);
          document.getElementById("play").textContent = "Play";
      }
    });

    document.getElementById("random").addEventListener("click", randomize);
    document.getElementById("clear").addEventListener("click", clear);


    // Initial redraw
    redraw();

    window.life = {
      w, h,
      get(x, y),
      set(x, y, v),
      step(),
      clear()
    };
  </script>
</body>
</html>
