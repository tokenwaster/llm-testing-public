<!DOCTYPE html>
<html>
<head>
  <title>2048</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #eee;
      font-family: monospace;
      text-align: center;
    }

    #board {
      display: flex;
      justify-content: center;
      margin: 20px auto;
    }

    .tile {
      width: 40px;
      height: 40px;
      border: 1px solid #666;
      font-size: 24px;
      text-align: center;
      line-height: 40px;
    }

    .tile.empty {
      background-color: #333;
    }

    .tile.two {
      background-color: #555;
    }

    .tile.four {
      background-color: #666;
    }

    .tile.eight {
      background-color: #777;
    }

    .tile.sixteen {
        background-color: #888;
    }


    #score {
      margin-top: 20px;
      font-size: 20px;
    }

    #reset {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #444;
      color: #eee;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>2048</h1>

  <div id="board"></div>
  <div id="score">Score: 0</div>
  <button id="reset">Start New Game</button>

  <script>
    const size = 4;
    let board = [];
    let score = 0;
    let newTileCount = 2;

    function initBoard() {
      board = Array(size).fill(null).map(() => Array(size).fill(0));
      placeNewTiles();
    }

    function placeNewTiles() {
      let emptyCells = [];
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          if (board[i][j] === 0) {
            emptyCells.push([i, j]);
          }
        }
      }

      if (emptyCells.length > 0) {
        const randomIndex = Math.floor(Math.random() * emptyCells.length);
        const [row, col] = emptyCells[randomIndex];
        board[row][col] = newTileCount % 2 === 0 ? 2 : 4;
      }
    }

    function move(direction) {
      let moved = false;
      switch (direction) {
        case 'left':
          for (let i = 0; i < size; i++) {
            moved |= slideAndMerge(i, 0);
          }
          break;
        case 'right':
          for (let i = 0; i < size; i++) {
            moved |= slideAndMerge(i, size - 1);
          }
          break;
        case 'up':
          for (let j = 0; j < size; j++) {
            moved |= slideAndMerge(0, j);
          }
          break;
        case 'down':
          for (let j = 0; j < size; j++) {
            moved |= slideAndMerge(size - 1, j);
          }
          break;
      }

      if (moved) {
        placeNewTiles();
      }
      return moved;
    }


    function slideAndMerge(row, col) {
      let changed = false;
      const originalBoard = board.map(row => [...row]); // Deep copy

      // Slide tiles
      for (let j = 0; j < size; j++) {
        let currentTile = board[row][j];
        if (currentTile !== 0) {
          let i = row;
          while (i >= 0 && board[i][j] === 0) {
            board[i][j] = currentTile;
            i--;
            changed = true;
          }

          if (i >= 0 && board[i][j] === currentTile) {
            board[i][j] *= 2;
            score += currentTile * 2;
            changed = true;
          }
        }
      }

      // Add new tile
      if (!changed) {
        placeNewTiles();
        return false; // No change in this move
      }

      return changed;
    }


    function boardToString() {
      let str = "";
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          str += board[i][j] === 0 ? "." : board[i][j];
        }
      }
      return str;
    }

    function setBoard(arr) {
        board = arr.map(row => [...row]);
    }


    function scoreValue() {
       return score;
    }



    window.game = {
      size: size,
      reset: function() {
        initBoard();
        score = 0;
      },
      move: move,
      board: boardToString,
      setBoard: setBoard,
      score: scoreValue,
    };

    document.addEventListener('DOMContentLoaded', () => {
      const boardDiv = document.getElementById('board');
      const scoreDiv = document.getElementById('score');
      const resetButton = document.getElementById('reset');

      function renderBoard() {
        boardDiv.innerHTML = '';
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            if (board[i][j] === 0) {
              tile.classList.add('empty');
            } else if (board[i][j] === 2) {
              tile.classList.add('two');
            } else if (board[i][j] === 4) {
              tile.classList.add('four');
            } else if (board[i][j] === 8) {
              tile.classList.add('eight');
            }
             else if(board[i][j] == 16){
                tile.classList.add('sixteen')
             }

            boardDiv.appendChild(tile);
          }
        }
      }

      scoreDiv.textContent = `Score: ${score}`;
      renderBoard();


      resetButton.addEventListener('click', () => {
        window.game.reset();
        renderBoard();
      });
    });
  </script>

</body>
</html>
