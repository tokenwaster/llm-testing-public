<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      background-color: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: monospace;
    }

    #snakeCanvas {
      border: 2px solid #fff;
      background-color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #444;
      border: none;
      color: #fff;
      margin: 5px;
    }

    #score {
      font-size: 24px;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="snake" width="400" height="400"></canvas>
  <div id="score">Score: 0</div>
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>

  <script>
    const w = 10;
    const h = 10;
    let snake = [[5, 5], [4, 5], [3, 5]];
    let food = [8, 8];
    let score = 0;
    let direction = 'right';
    let gameInterval;

    const canvas = document.getElementById('snake');
    const ctx = canvas.getContext('2d');

    function reset() {
      snake = [[5, 5], [4, 5], [3, 5]];
      food = [8, 8];
      score = 0;
      direction = 'right';
      clearInterval(gameInterval);
      gameInterval = null;
    }

    function tick() {
      const head = snake[0];
      let newHead = [];

      switch (direction) {
        case 'up':
          newHead = [head[0] - 1, head[1]];
          break;
        case 'down':
          newHead = [head[0] + 1, head[1]];
          break;
        case 'left':
          newHead = [head[0], head[1] - 1];
          break;
        case 'right':
          newHead = [head[0], head[1] + 1];
          break;
      }

      if (
        newHead[0] < 0 ||
        newHead[0] >= h ||
        newHead[1] < 0 ||
        newHead[1] >= w ||
        snake.some(segment => segment[0] === newHead[0] && segment[1] === newHead[1])
      ) {
        return false; // Game over
      }

      snake.unshift(newHead);

      if (newHead[0] === food[0] && newHead[1] === food[1]) {
        score++;
        food = [Math.floor(Math.random() * w), Math.floor(Math.random() * h)];
      } else {
        snake.pop();
      }

      return true; // Game continues
    }


    function setDir(dir) {
      if (dir === direction) return;
      direction = dir;
    }

    function setFood(x, y) {
      food = [x, y];
    }

    function snake() {
      return snake;
    }

    function food() {
      return food;
    }

    function alive() {
      return tick();
    }

    function score_() {
      return score;
    }


    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' && direction !== 'down') setDir('up');
      if (e.key === 'ArrowDown' && direction !== 'up') setDir('down');
      if (e.key === 'ArrowLeft' && direction !== 'right') setDir('left');
      if (e.key === 'ArrowRight' && direction !== 'left') setDir('right');
    });

    document.getElementById('start').addEventListener('click', () => {
      gameInterval = setInterval(tick, 100);
    });

    document.getElementById('pause').addEventListener('click', () => {
      clearInterval(gameInterval);
      gameInterval = null;
    });

    document.getElementById('reset').addEventListener('click', () => {
      reset();
    });



    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      ctx.fillStyle = '#fff';
      snake.forEach((segment) => {
        ctx.fillRect(segment[1] * 20, segment[0] * 20, 20, 20);
      });

      // Draw food
      ctx.fillStyle = '#ff0';
      ctx.fillRect(food[1] * 20, food[0] * 20, 20, 20);

      // Display score
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText('Score: ' + score, 10, 30);
    }


    setInterval(draw, 100);
  </script>
</body>
</html>
