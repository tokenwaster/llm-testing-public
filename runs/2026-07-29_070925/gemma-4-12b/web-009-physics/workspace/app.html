<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Physics Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            transform: scale(0.95);
        }

        #sim-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #333;
            border-radius: 8px;
        }

        canvas {
            display: block;
            background-color: #000;
            cursor: crosshair;
        }

        h1 {
            margin: 0 0 10px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>PHYSICS PLAYGROUND</h1>

    <div class="controls">
        <button id="drop">Drop Ball</button>
        <button id="play">Pause</button>
        <button id="clear">Clear All</button>
    </div>

    <div id="sim-container">
        <canvas id="sim" width="600" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        const dropBtn = document.getElementById('drop');
        const playBtn = document.getElementById('play');
        const clearBtn = document.getElementById('clear');

        const GRAVITY = 0.25;
        const RESTITUTION = 0.8; // Energy loss on bounce
        let isRunning = true;
        let balls = [];

        // Exposed API Object
        window.sim = {
            w: canvas.width,
            h: canvas.height,
            balls: function() {
                return balls;
            },
            addBall: function(x, y, vx = 0, vy = 0, r = 15) {
                // Ensure ball starts within bounds
                const safeX = Math.max(r, Math.min(this.w - r, x));
                const safeY = Math.max(r, Math.min(this.h - r, y));
                balls.push({
                    x: safeX,
                    y: safeY,
                    vx: vx,
                    vy: vy,
                    r: r,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`
                });
            },
            clear: function() {
                balls = [];
                this.draw(); // Immediate redraw
            },
            step: function(dt = 1) {
                if (!isRunning) return;

                for (let i = 0; i < balls.length; i++) {
                    const b = balls[i];

                    // Apply Gravity
                    b.vy += GRAVITY * dt;

                    // Move
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;

                    // Floor collision
                    if (b.y + b.r > this.h) {
                        b.y = this.h - b.r;
                        b.vy *= -RESTITUTION;
                        // Friction on floor to stop jittering
                        if (Math.abs(b.vy) < 1) b.vy = 0;
                    }

                    // Ceiling collision
                    if (b.y - b.r < 0) {
                        b.y = b.r;
                        b.vy *= -RESTITUTION;
                    }

                    // Right wall collision
                    if (b.x + b.r > this.w) {
                        b.x = this.w - b.r;
                        b.vx *= -RESTITUTION;
                    }

                    // Left wall collision
                    if (b.x - b.r < 0) {
                        b.x = b.r;
                        b.vx *= -RESTITUTION;
                    }
                }
                this.draw();
            },
            draw: function() {
                ctx.clearRect(0, 0, this.w, this.h);
                balls.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                    ctx.closePath();
                });
            }
        };

        // Interaction Logic
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            // Add slight random velocity on click
            window.sim.addBall(x, y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
        });

        dropBtn.addEventListener('click', () => {
            // Drop from top middle area with random horizontal velocity
            window.sim.addBall(window.sim.w / 2 + (Math.random() * 40 - 20), 50, Math.random() * 4 - 2);
        });

        clearBtn.addEventListener('click', () => {
            window.sim.clear();
        });

        playBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            playBtn.textContent = isRunning ? "Pause" : "Play";
        });

        // Main Loop
        function loop() {
            window.sim.step(1);
            requestAnimationFrame(loop);
        }

        // Init first ball
        window.sim.addBall(window.sim.w / 2, 100, 2);
        loop();
    </script>
</body>
</html>
