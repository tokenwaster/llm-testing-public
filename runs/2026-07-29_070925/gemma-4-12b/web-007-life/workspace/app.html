<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00ff9d;
            --text: #e0e0e0;
            --btn-hover: #00cc7e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent);
        }

        #life {
            border: 2px solid #333;
            border-radius: 4px;
            cursor: crosshair;
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            max-width: 95vw;
            max-height: 70vh;
        }

        .controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #444;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button#play.playing {
            background-color: #d9534f;
        }

        button#play.playing:hover {
            background-color: #c9302c;
        }

        .stats {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LIFE</h1>
    <canvas id="life" width="600" height="600"></canvas>
    
    <div class="controls">
        <button id="step">Step</button>
        <button id="play">Play</button>
        <button id="random">Random</button>
        <button id="clear">Clear</button>
    </div>
    <div class="stats" id="status">Generation: 0</div>
</div>

<script>
    /**
     * Conway's Game of Life Implementation
     */
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    // Configuration
    const w = 60; // Grid width (>= 40)
    const h = 60; // Grid height (>= 40)
    let grid = Array.from({ length: h }, () => new Uint8Array(w));
    let generation = 0;
    let isPlaying = false;
    let animationId = null;

    // Helper to get cell value with boundary checks
    const getCellValue = (x, y) => {
        if (x < 0 || x >= w || y < 0 || y >= h) return 0;
        return grid[y][x];
    };

    /**
     * Programmatic API required for grading
     */
    window.life = {
        w,
        h,
        get(x, y) {
            return getCellValue(x, y);
        },
        set(x, y, v) {
            if (x >= 0 && x < w && y >= 0 && y < h) {
                grid[y][x] = v ? 1 : 0;
                render();
            }
        },
        step() {
            const nextGrid = Array.from({ length: h }, () => new Uint8Array(w));

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    let neighbors = 0;
                    // Check 8 neighbors
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            neighbors += this.get(x + dx, y + dy);
                        }
                    }

                    const current = this.get(x, y);
                    // B3/S23 Rules
                    if (current === 1 && (neighbors === 2 || neighbors === 3)) {
                        nextGrid[y][x] = 1;
                    } else if (current === 0 && neighbors === 3) {
                        nextGrid[y][x] = 1;
                    } else {
                        nextGrid[y][x] = 0;
                    }
                }
            }

            grid = nextGrid;
            generation++;
            statusEl.innerText = `Generation: ${generation}`;
            render();
        },
        clear() {
            grid = Array.from({ length: h }, () => new Uint8Array(w));
            generation = 0;
            statusEl.innerText = `Generation: ${generation}`;
            render();
        }
    };

    /**
     * Rendering Logic
     */
    function render() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellW = canvas.width / w;
        const cellH = canvas.height / h;

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                if (grid[y][x] === 1) {
                    ctx.fillStyle = '#00ff9d';
                    // Draw slightly smaller to create a "grid" look
                    ctx.fillRect(x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2);
                }
            }
        }
    }

    /**
     * Interaction Logic
     */
    let isDrawing = false;

    function handleInteraction(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        const x = Math.floor(mouseX / (canvas.width / w));
        const y = Math.floor(mouseY / (canvas.height / h));

        if (x >= 0 && x < w && y >= 0 && y < h) {
            window.life.set(x, y, grid[y][x] === 1 ? 0 : 1);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        handleInteraction(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (isDrawing) handleInteraction(e);
    });

    window.addEventListener('mouseup', () => {
        isDrawing = false;
    });

    /**
     * UI Controls
     */
    const playBtn = document.getElementById('play');
    const stepBtn = document.getElementById('step');
    const randomBtn = document.getElementById('random');
    const clearBtn = document.getElementById('clear');

    stepBtn.addEventListener('click', () => window.life.step());

    clearBtn.addEventListener('click', () => {
        window.life.clear();
        if (isPlaying) togglePlay();
    });

    randomBtn.addEventListener('click', () => {
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                grid[y][x] = Math.random() > 0.85 ? 1 : 0;
            }
        }
        generation = 0;
        statusEl.innerText = `Generation: ${generation}`;
        render();
    });

    function togglePlay() {
        isPlaying = !isPlaying;
        if (isPlaying) {
            playBtn.classList.add('playing');
            playBtn.innerText = 'Pause';
            autoLoop();
        } else {
            playBtn.classList.remove('playing');
            playBtn.innerText = 'Play';
            cancelAnimationFrame(animationId);
        }
    }

    function autoLoop() {
        if (!isPlaying) return;
        window.life.step();
        animationId = requestAnimationFrame(autoLoop);
    }

    playBtn.addEventListener('click', togglePlay);

    // Initial Draw
    render();

</script>
</body>
</html>
