<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #score {
            font-size: 24px;
            margin-bottom: 10px;
        }

        #snake {
            border: 2px solid #fff;
            background-color: #0a0a0a;
            display: block;
            width: 400px;
            height: 400px;
            image-rendering: pixelated;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            background-color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Snake</h1>
        <div id="score">Score: 0</div>
        <canvas id="snake" width="400" height="400"></canvas>
        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 20;
        const CELL_SIZE = 400 / BOARD_SIZE;

        const canvas = document.getElementById('snake');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const startBtn = document.getElementById('start');
        const pauseBtn = document.getElementById('pause');
        const resetBtn = document.getElementById('reset');

        let snake = [[10, 10], [10, 11], [10, 12]];
        let food = [15, 15];
        let direction = 'up';
        let nextDirection = 'up';
        let isAlive = true;
        let isPaused = false;
        let gameScore = 0;
        let gameInterval = null;

        function reset() {
            snake = [[10, 10], [10, 11], [10, 12]];
            food = [15, 15];
            direction = 'up';
            nextDirection = 'up';
            isAlive = true;
            isPaused = false;
            gameScore = 0;
            clearInterval(gameInterval);
            gameInterval = null;
            scoreDisplay.textContent = `Score: ${gameScore}`;
            draw();
            startBtn.textContent = 'Start';
        }

        function getDirectionVector(dir) {
            const vectors = {
                'up': [0, -1],
                'down': [0, 1],
                'left': [-1, 0],
                'right': [1, 0]
            };
            return vectors[dir];
        }

        function isOpposite(dir1, dir2) {
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            return opposites[dir1] === dir2;
        }

        function setDir(newDir) {
            if (!isOpposite(direction, newDir)) {
                nextDirection = newDir;
            }
        }

        function tick() {
            if (!isAlive) return;

            direction = nextDirection;

            const [dx, dy] = getDirectionVector(direction);
            const [hx, hy] = snake[0];
            const nx = hx + dx;
            const ny = hy + dy;

            if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
                isAlive = false;
                clearInterval(gameInterval);
                gameInterval = null;
                startBtn.textContent = 'Start';
                draw();
                return;
            }

            if (snake.some(segment => segment[0] === nx && segment[1] === ny)) {
                isAlive = false;
                clearInterval(gameInterval);
                gameInterval = null;
                startBtn.textContent = 'Start';
                draw();
                return;
            }

            snake.unshift([nx, ny]);

            if (nx === food[0] && ny === food[1]) {
                gameScore++;
                scoreDisplay.textContent = `Score: ${gameScore}`;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function spawnFood() {
            let newFood;
            do {
                newFood = [
                    Math.floor(Math.random() * BOARD_SIZE),
                    Math.floor(Math.random() * BOARD_SIZE)
                ];
            } while (snake.some(segment => segment[0] === newFood[0] && segment[1] === newFood[1]));
            food = newFood;
        }

        function setFood(x, y) {
            food = [x, y];
            draw();
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                const [x, y] = snake[i];
                ctx.fillStyle = i === 0 ? '#00ff00' : '#00cc00';
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                ctx.strokeStyle = '#0a0a0a';
                ctx.lineWidth = 1;
                ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }

            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(
                food[0] * CELL_SIZE + CELL_SIZE / 2,
                food[1] * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function start() {
            if (!isAlive) {
                reset();
            }
            if (isPaused) {
                isPaused = false;
                gameInterval = setInterval(tick, 150);
                startBtn.textContent = 'Pause';
            } else if (!gameInterval) {
                gameInterval = setInterval(tick, 150);
                startBtn.textContent = 'Pause';
            }
        }

        function pause() {
            if (gameInterval) {
                isPaused = true;
                clearInterval(gameInterval);
                gameInterval = null;
                startBtn.textContent = 'Resume';
            }
        }

        window.game = {
            w: BOARD_SIZE,
            h: BOARD_SIZE,
            reset,
            tick,
            setDir,
            setFood,
            snake: () => snake.map(s => [s[0], s[1]]),
            food: () => [food[0], food[1]],
            alive: () => isAlive,
            score: () => gameScore
        };

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    setDir('up');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    setDir('down');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    setDir('left');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    setDir('right');
                    e.preventDefault();
                    break;
            }
        });

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);

        draw();
    </script>
</body>
</html>
