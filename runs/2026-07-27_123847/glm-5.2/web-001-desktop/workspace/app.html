<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ubuntu Desktop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Ubuntu", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #e9e9e9;
    background: #2c001e;
  }

  /* Desktop wallpaper */
  #desktop {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 700px at 20% 15%, #5e2750 0%, transparent 60%),
      radial-gradient(1000px 800px at 85% 90%, #77216f 0%, transparent 55%),
      linear-gradient(135deg, #2c001e 0%, #4a0e2c 50%, #2c001e 100%);
    overflow: hidden;
  }

  /* Top bar */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(20, 10, 18, 0.85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center;
    padding: 0 14px;
    font-size: 13px;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  #topbar .activities { cursor: pointer; padding: 2px 8px; border-radius: 4px; }
  #topbar .activities:hover { background: rgba(255,255,255,0.1); }
  #topbar .clock {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.3); padding: 3px 12px; border-radius: 14px;
    font-variant-numeric: tabular-nums;
  }
  #topbar .status { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  #topbar .status span { opacity: 0.85; }

  /* Dock / taskbar */
  #taskbar {
    position: absolute;
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    display: flex; gap: 12px;
    padding: 10px 14px;
    background: rgba(30, 15, 26, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    z-index: 1000;
  }
  #taskbar .launcher {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, #77216f, #5e2750);
    border: 1px solid rgba(255,255,255,0.12);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    color: #fff;
    font-size: 11px;
    gap: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s;
    user-select: none;
  }
  #taskbar .launcher:hover {
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 10px 22px rgba(0,0,0,0.5);
    background: linear-gradient(135deg, #962a82, #77216f);
  }
  #taskbar .launcher .icon {
    font-size: 22px; line-height: 1;
  }
  #taskbar .launcher .label { font-weight: 600; letter-spacing: 0.3px; }

  /* Windows */
  .window {
    position: absolute;
    min-width: 360px; min-height: 240px;
    background: #2b2b2b;
    border: 1px solid rgba(0,0,0,0.6);
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    overflow: hidden;
    color: #e9e9e9;
  }
  .window .titlebar {
    height: 32px;
    background: linear-gradient(180deg, #3c3c3c, #303030);
    display: flex; align-items: center;
    padding: 0 8px 0 12px;
    cursor: grab;
    user-select: none;
    border-bottom: 1px solid rgba(0,0,0,0.4);
  }
  .window .titlebar:active { cursor: grabbing; }
  .window .titlebar .title {
    font-size: 13px; font-weight: 600; opacity: 0.95;
    flex: 1; text-align: center;
  }
  .window .titlebar .controls { display: flex; gap: 6px; }
  .window .titlebar .controls button {
    width: 12px; height: 12px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
  }
  .window .titlebar .controls .win-close { background: #e95420; }
  .window .titlebar .controls .win-min { background: #f5a623; }
  .window .titlebar .controls .win-max { background: #34c759; }
  .window .titlebar .controls button:hover { filter: brightness(1.15); }
  .window .content {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: #2b2b2b;
  }

  /* Files app */
  #files-window .content { padding: 0; }
  .files-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px;
    background: #333;
    border-bottom: 1px solid #222;
  }
  .files-toolbar button {
    background: #444; color: #eee; border: 1px solid #555;
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  .files-toolbar button:hover { background: #555; }
  #files-path {
    flex: 1;
    background: #1f1f1f; border: 1px solid #444;
    color: #ddd; padding: 5px 10px; border-radius: 6px;
    font-family: "Ubuntu Mono", Consolas, monospace;
    font-size: 13px;
    min-width: 0;
  }
  .files-list {
    flex: 1; overflow: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px; padding: 14px;
    align-content: start;
  }
  .fs-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 12px 6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    transition: background 0.12s;
  }
  .fs-item:hover { background: rgba(255,255,255,0.08); }
  .fs-item.selected { background: rgba(233, 84, 32, 0.35); }
  .fs-item .fs-icon { font-size: 36px; line-height: 1; }
  .fs-item.folder .fs-icon { color: #f5a623; }
  .fs-item.file .fs-icon { color: #c8c8c8; }

  /* Notepad app */
  #notepad-window .content { padding: 0; }
  .tab-strip {
    display: flex; align-items: stretch; gap: 2px;
    background: #252525;
    padding: 6px 6px 0 6px;
    border-bottom: 1px solid #111;
    min-height: 36px;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    background: #333; color: #ccc;
    padding: 6px 10px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid #444;
    border-bottom: none;
    white-space: nowrap;
    max-width: 180px;
  }
  .tab.active {
    background: #2b2b2b; color: #fff;
    border-color: #77216f;
  }
  .tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
  .tab .tab-close {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: transparent; color: #aaa;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  .tab .tab-close:hover { background: #e95420; color: #fff; }
  #new-tab {
    background: #77216f; color: #fff;
    border: none; border-radius: 6px;
    padding: 0 12px; cursor: pointer;
    font-size: 18px; font-weight: bold;
    align-self: stretch;
  }
  #new-tab:hover { background: #962a82; }
  #editor {
    flex: 1; width: 100%;
    background: #1e1e1e; color: #eee;
    border: none; outline: none;
    padding: 14px 16px;
    font-family: "Ubuntu Mono", Consolas, monospace;
    font-size: 14px; line-height: 1.5;
    resize: none;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div id="desktop">
  <div id="topbar">
    <div class="activities">Activities</div>
    <div class="clock" id="clock">00:00</div>
    <div class="status">
      <span>netz</span>
      <span>vol</span>
      <span>pwr</span>
    </div>
  </div>

  <div id="taskbar">
    <div class="launcher" id="open-files" title="Files">
      <div class="icon">📁</div>
      <div class="label">Files</div>
    </div>
    <div class="launcher" id="open-notepad" title="Notepad">
      <div class="icon">📝</div>
      <div class="label">Notepad</div>
    </div>
  </div>

  <!-- Files window -->
  <div class="window" id="files-window" style="display:none; left:60px; top:60px; width:560px; height:380px; z-index:10;">
    <div class="titlebar">
      <div class="controls">
        <button class="win-close" title="Close"></button>
        <button class="win-min" title="Minimize"></button>
        <button class="win-max" title="Maximize"></button>
      </div>
      <div class="title">Files</div>
      <div style="width:42px;"></div>
    </div>
    <div class="content">
      <div class="files-toolbar">
        <button id="files-up" title="Parent directory">↑ Up</button>
        <button id="files-home" title="Go to /home/user">🏠 Home</button>
        <div id="files-path">/</div>
      </div>
      <div class="files-list" id="files-list"></div>
    </div>
  </div>

  <!-- Notepad window -->
  <div class="window" id="notepad-window" style="display:none; left:160px; top:90px; width:560px; height:380px; z-index:11;">
    <div class="titlebar">
      <div class="controls">
        <button class="win-close" title="Close"></button>
        <button class="win-min" title="Minimize"></button>
        <button class="win-max" title="Maximize"></button>
      </div>
      <div class="title">Notepad</div>
      <div style="width:42px;"></div>
    </div>
    <div class="content">
      <div class="tab-strip" id="tabs"></div>
      <textarea id="editor" placeholder="Start typing..."></textarea>
    </div>
    <button id="new-tab" style="display:none;">+</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- Filesystem data ---------- */
  const FS = {
    '/': ['bin','boot','dev','etc','home','lib','opt','root','tmp','usr','var'],
    '/bin': ['bash','cat','ls','cp','mv','rm'],
    '/etc': ['hosts','hostname','passwd','resolv.conf','fstab','apt','nginx'],
    '/etc/apt': ['sources.list'],
    '/etc/nginx': ['nginx.conf'],
    '/home': ['user'],
    '/home/user': ['Documents','Downloads','Pictures','Music','Desktop','.bashrc','.profile','notes.txt'],
    '/home/user/Documents': ['resume.pdf','todo.txt','budget.ods','project'],
    '/home/user/Documents/project': ['main.js','README.md'],
    '/home/user/Downloads': ['ubuntu-22.04.iso','installer.deb','archive.tar.gz'],
    '/home/user/Pictures': ['wallpaper.png','photo.jpg','screenshot.png','vacation'],
    '/home/user/Pictures/vacation': ['beach.jpg','mountain.jpg','sunset.jpg'],
    '/home/user/Music': ['song1.mp3','playlist.m3u'],
    '/home/user/Desktop': ['shortcut.desktop'],
    '/usr': ['bin','lib','share','local'],
    '/usr/bin': ['python3','git','node','make'],
    '/usr/lib': ['libc.so','libssl.so'],
    '/usr/share': ['doc','man','icons'],
    '/usr/local': ['bin'],
    '/var': ['log','cache','lib','tmp'],
    '/var/log': ['syslog','auth.log','kern.log'],
    '/var/cache': ['apt'],
    '/var/lib': ['dpkg'],
    '/root': ['.bashrc'],
    '/boot': ['vmlinuz','initrd.img'],
    '/dev': ['sda','null','zero'],
    '/lib': ['libc.so.6'],
    '/opt': []
  };

  function isFolder(path, name){
    const child = joinPath(path, name);
    return Object.prototype.hasOwnProperty.call(FS, child);
  }
  function joinPath(dir, name){
    if (dir === '/') return '/' + name;
    return dir + '/' + name;
  }
  function parentOf(path){
    if (path === '/') return '/';
    const idx = path.lastIndexOf('/');
    if (idx <= 0) return '/';
    return path.slice(0, idx);
  }
  function baseName(path){
    if (path === '/') return '/';
    return path.slice(path.lastIndexOf('/') + 1);
  }

  /* ---------- Files app ---------- */
  const filesWindow = document.getElementById('files-window');
  const filesPath = document.getElementById('files-path');
  const filesList = document.getElementById('files-list');
  let currentPath = '/';

  function renderFiles(path){
    currentPath = path;
    filesPath.textContent = path === '/' ? '/' : path;
    filesList.innerHTML = '';
    const entries = FS[path] || [];
    entries.sort((a,b) => {
      const af = isFolder(path,a), bf = isFolder(path,b);
      if (af !== bf) return af ? -1 : 1;
      return a.localeCompare(b);
    });
    for (const name of entries){
      const folder = isFolder(path, name);
      const item = document.createElement('div');
      item.className = 'fs-item ' + (folder ? 'folder' : 'file');
      item.textContent = name;
      const icon = document.createElement('div');
      icon.className = 'fs-icon';
      icon.textContent = folder ? '🗂️' : '📄';
      // Insert icon before text
      item.textContent = '';
      item.appendChild(icon);
      const label = document.createElement('span');
      label.textContent = name;
      item.appendChild(label);

      item.addEventListener('dblclick', () => {
        if (folder) renderFiles(joinPath(path, name));
      });
      item.addEventListener('click', () => {
        document.querySelectorAll('.fs-item.selected').forEach(s => s.classList.remove('selected'));
        item.classList.add('selected');
      });
      filesList.appendChild(item);
    }
  }

  document.getElementById('files-up').addEventListener('click', () => {
    renderFiles(parentOf(currentPath));
  });
  document.getElementById('files-home').addEventListener('click', () => {
    renderFiles('/home/user');
  });

  /* ---------- Notepad app (persistent tabs) ---------- */
  const notepadWindow = document.getElementById('notepad-window');
  const tabsContainer = document.getElementById('tabs');
  const editor = document.getElementById('editor');
  const newTabBtn = document.getElementById('new-tab');

  const STORAGE_KEY = 'ubuntu-notepad-tabs-v1';
  let tabs = []; // [{id, name, content}]
  let activeId = null;

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        const data = JSON.parse(raw);
        if (Array.isArray(data.tabs) && data.tabs.length){
          tabs = data.tabs.map(t => ({ id: t.id || genId(), name: t.name || 'Untitled', content: t.content || '' }));
          activeId = data.activeId && tabs.some(t => t.id === data.activeId) ? data.activeId : tabs[0].id;
          return;
        }
      }
    } catch(e){}
    // first run
    tabs = [{ id: genId(), name: 'Untitled 1', content: '' }];
    activeId = tabs[0].id;
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tabs, activeId }));
  }
  function genId(){ return 't' + Math.random().toString(36).slice(2,10); }

  function renderTabs(){
    tabsContainer.innerHTML = '';
    tabs.forEach(t => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (t.id === activeId ? ' active' : '');
      tab.dataset.id = t.id;

      const name = document.createElement('span');
      name.className = 'tab-name';
      name.textContent = t.name;
      tab.appendChild(name);

      const close = document.createElement('button');
      close.className = 'tab-close';
      close.textContent = '×';
      close.title = 'Close tab';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(t.id);
      });
      tab.appendChild(close);

      tab.addEventListener('click', () => activateTab(t.id));
      tabsContainer.appendChild(tab);
    });
    // New-tab button lives in strip
    const plus = document.createElement('button');
    plus.id = 'new-tab';
    plus.textContent = '+';
    plus.title = 'New tab';
    plus.addEventListener('click', newTab);
    tabsContainer.appendChild(plus);

    const active = tabs.find(t => t.id === activeId);
    editor.value = active ? active.content : '';
  }

  function activateTab(id){
    activeId = id;
    saveState();
    renderTabs();
  }
  function newTab(){
    const n = tabs.length + 1;
    const t = { id: genId(), name: 'Untitled ' + n, content: '' };
    tabs.push(t);
    activeId = t.id;
    saveState();
    renderTabs();
    editor.focus();
  }
  function closeTab(id){
    const idx = tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    tabs.splice(idx, 1);
    if (tabs.length === 0){
      tabs = [{ id: genId(), name: 'Untitled 1', content: '' }];
      activeId = tabs[0].id;
    } else if (activeId === id){
      activeId = tabs[Math.max(0, idx - 1)].id;
    }
    saveState();
    renderTabs();
  }

  let saveTimer = null;
  editor.addEventListener('input', () => {
    const active = tabs.find(t => t.id === activeId);
    if (active){
      active.content = editor.value;
      // Auto-rename Untitled tabs to first line if still default
      if (/^Untitled \d+$/.test(active.name)){
        const firstLine = editor.value.trim().split('\n')[0];
        if (firstLine){
          active.name = firstLine.slice(0, 24);
        }
      }
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveState(); renderTabsKeepEditor(); }, 300);
      saveState();
    }
  });
  // Re-render tabs but keep focus & caret in editor
  function renderTabsKeepEditor(){
    const wasFocused = document.activeElement === editor;
    const start = editor.selectionStart, end = editor.selectionEnd;
    const val = editor.value;
    renderTabs();
    editor.value = val; // ensure value preserved
    if (wasFocused){
      editor.focus();
      try { editor.setSelectionRange(start, end); } catch(e){}
    }
  }

  /* ---------- Window management ---------- */
  function makeDraggable(win){
    const titlebar = win.querySelector('.titlebar');
    let drag = null;
    titlebar.addEventListener('mousedown', (e) => {
      if (e.target.closest('.controls button')) return;
      // Bring to front
      bringToFront(win);
      const rect = win.getBoundingClientRect();
      drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!drag) return;
      let nx = e.clientX - drag.dx;
      let ny = e.clientY - drag.dy;
      const w = win.offsetWidth, h = win.offsetHeight;
      nx = Math.max(-w + 80, Math.min(window.innerWidth - 80, nx));
      ny = Math.max(28, Math.min(window.innerHeight - 40, ny));
      win.style.left = nx + 'px';
      win.style.top = ny + 'px';
    });
    document.addEventListener('mouseup', () => { drag = null; });
  }
  let zCounter = 10;
  function bringToFront(win){
    zCounter += 1;
    win.style.zIndex = zCounter;
  }

  function setupWindowControls(win){
    const close = win.querySelector('.win-close');
    close.addEventListener('click', () => { win.style.display = 'none'; });
    const min = win.querySelector('.win-min');
    min.addEventListener('click', () => { win.style.display = 'none'; });
    const max = win.querySelector('.win-max');
    let maximized = false, prev = null;
    max.addEventListener('click', () => {
      if (!maximized){
        prev = {
          left: win.style.left, top: win.style.top,
          width: win.style.width, height: win.style.height
        };
        win.style.left = '8px';
        win.style.top = '36px';
        win.style.width = (window.innerWidth - 16) + 'px';
        win.style.height = (window.innerHeight - 44 - 80) + 'px';
        maximized = true;
      } else {
        win.style.left = prev.left;
        win.style.top = prev.top;
        win.style.width = prev.width;
        win.style.height = prev.height;
        maximized = false;
      }
    });
    win.addEventListener('mousedown', () => bringToFront(win));
    makeDraggable(win);
  }

  setupWindowControls(filesWindow);
  setupWindowControls(notepadWindow);

  /* ---------- Launchers ---------- */
  document.getElementById('open-files').addEventListener('click', () => {
    filesWindow.style.display = 'flex';
    bringToFront(filesWindow);
    renderFiles(currentPath);
  });
  document.getElementById('open-notepad').addEventListener('click', () => {
    notepadWindow.style.display = 'flex';
    bringToFront(notepadWindow);
    renderTabs();
  });

  /* ---------- Clock ---------- */
  function updateClock(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh + ':' + mm;
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);

  /* ---------- Init ---------- */
  loadState();
  // Pre-render files at root
  renderFiles('/');
  // Pre-render tabs (even though window hidden) so reopening shows them
  renderTabs();
})();
</script>
</body>
</html>
