<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --bg: #1a1a2e;
    --board-bg: #16213e;
    --cell-bg: #2a2a4a;
    --text: #eee;
    --accent: #e94560;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
  }
  h1 {
    margin: 0;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #fff;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .score-box {
    background: var(--board-bg);
    border-radius: 8px;
    padding: 8px 18px;
    text-align: center;
    min-width: 110px;
  }
  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    display: block;
  }
  #score {
    font-size: 26px;
    font-weight: 700;
    display: block;
    color: #fff;
  }
  #reset {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.15s;
  }
  #reset:hover { background: #ff5c7a; }
  #reset:active { transform: translateY(1px); }
  #board {
    width: 380px;
    height: 380px;
    background: var(--board-bg);
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell {
    background: var(--cell-bg);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    user-select: none;
  }
  .cell[data-v="2"] { background: #eee4da; color: #776e65; }
  .cell[data-v="4"] { background: #ede0c8; color: #776e65; }
  .cell[data-v="8"] { background: #f2b179; color: #fff; }
  .cell[data-v="16"] { background: #f59563; color: #fff; }
  .cell[data-v="32"] { background: #f67c5f; color: #fff; }
  .cell[data-v="64"] { background: #f65e3b; color: #fff; }
  .cell[data-v="128"] { background: #edcf72; color: #fff; font-size: 30px; }
  .cell[data-v="256"] { background: #edcc61; color: #fff; font-size: 30px; }
  .cell[data-v="512"] { background: #edc850; color: #fff; font-size: 30px; }
  .cell[data-v="1024"] { background: #edc53f; color: #fff; font-size: 24px; }
  .cell[data-v="2048"] { background: #edc22e; color: #fff; font-size: 24px; }
  .cell[data-v="4096"], .cell[data-v="8192"] { background: #3c3a32; color: #fff; font-size: 22px; }
  .help { font-size: 12px; opacity: 0.55; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="header">
    <div class="score-box"><span class="label">Score</span><span id="score">0</span></div>
    <button id="reset">New Game</button>
  </div>
  <div id="board"></div>
  <div class="help">Use the arrow keys to move tiles. Merge equal numbers to reach 2048.</div>

<script>
(function () {
  "use strict";

  const SIZE = 4;
  let grid = [];
  let scoreVal = 0;

  function emptyGrid() {
    const g = [];
    for (let i = 0; i < SIZE; i++) g.push(new Array(SIZE).fill(0));
    return g;
  }

  function copyBoard(b) {
    return b.map(function (r) { return r.slice(); });
  }

  function boardsEqual(a, b) {
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE; j++) {
        if (a[i][j] !== b[i][j]) return false;
      }
    }
    return true;
  }

  // Slide a single row to the left; merge pairs at most once.
  function slideLeftRow(row) {
    const nonZero = row.filter(function (x) { return x !== 0; });
    const result = [];
    let gained = 0;
    let i = 0;
    while (i < nonZero.length) {
      if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
        const merged = nonZero[i] * 2;
        result.push(merged);
        gained += merged;
        i += 2;
      } else {
        result.push(nonZero[i]);
        i += 1;
      }
    }
    while (result.length < SIZE) result.push(0);
    return { row: result, gained: gained };
  }

  function moveLeft(b) {
    let gained = 0;
    const out = b.map(function (row) {
      const r = slideLeftRow(row);
      gained += r.gained;
      return r.row;
    });
    return { board: out, gained: gained };
  }

  function reverseRows(b) {
    return b.map(function (r) { return r.slice().reverse(); });
  }

  function transpose(b) {
    const t = emptyGrid();
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE; j++) {
        t[j][i] = b[i][j];
      }
    }
    return t;
  }

  function applyMove(b, dir) {
    if (dir === "left") {
      return moveLeft(b);
    }
    if (dir === "right") {
      const r = moveLeft(reverseRows(b));
      return { board: reverseRows(r.board), gained: r.gained };
    }
    if (dir === "up") {
      const r = moveLeft(transpose(b));
      return { board: transpose(r.board), gained: r.gained };
    }
    if (dir === "down") {
      const r = moveLeft(reverseRows(transpose(b)));
      return { board: transpose(reverseRows(r.board)), gained: r.gained };
    }
    return { board: copyBoard(b), gained: 0 };
  }

  function emptyCells(b) {
    const cells = [];
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE; j++) {
        if (b[i][j] === 0) cells.push([i, j]);
      }
    }
    return cells;
  }

  function spawnTile(b) {
    const cells = emptyCells(b);
    if (cells.length === 0) return false;
    const pick = cells[Math.floor(Math.random() * cells.length)];
    b[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  function render() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE; j++) {
        const v = grid[i][j];
        const cell = document.createElement("div");
        cell.className = "cell";
        if (v !== 0) {
          cell.textContent = String(v);
          cell.dataset.v = String(v);
        }
        boardEl.appendChild(cell);
      }
    }
    document.getElementById("score").textContent = String(scoreVal);
  }

  function reset() {
    grid = emptyGrid();
    scoreVal = 0;
    spawnTile(grid);
    spawnTile(grid);
    render();
  }

  function move(dir) {
    const result = applyMove(grid, dir);
    const changed = !boardsEqual(grid, result.board);
    if (changed) {
      grid = result.board;
      scoreVal += result.gained;
      spawnTile(grid);
      render();
    }
    return changed;
  }

  function board() {
    return copyBoard(grid);
  }

  function setBoard(arr) {
    // Set the grid exactly (no spawn). Reset score for deterministic grading.
    grid = arr.map(function (r) { return r.slice(); });
    scoreVal = 0;
    render();
  }

  function score() {
    return scoreVal;
  }

  window.game = {
    size: SIZE,
    reset: reset,
    move: move,
    board: board,
    setBoard: setBoard,
    score: score,
  };

  document.getElementById("reset").addEventListener("click", function () {
    reset();
  });

  document.addEventListener("keydown", function (e) {
    const map = {
      ArrowLeft: "left",
      ArrowRight: "right",
      ArrowUp: "up",
      ArrowDown: "down",
    };
    if (Object.prototype.hasOwnProperty.call(map, e.key)) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  reset();
})();
</script>
</body>
</html>
