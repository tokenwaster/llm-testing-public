<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conway's Game of Life</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #131a2c;
    --accent: #ff5ea8;
    --accent2: #5effc8;
    --text: #e8eefc;
    --dim: #6b7896;
    --grid-line: rgba(94, 255, 200, 0.08);
    --cell: #5effc8;
    --cell-glow: rgba(94, 255, 200, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 20% 10%, #1a2342 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, #2a1330 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 2px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 94, 168, 0.2);
  }
  .subtitle { color: var(--dim); font-size: 14px; margin-bottom: 18px; }
  .stage {
    background: linear-gradient(180deg, var(--panel), #0d1322);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #life {
    display: block;
    border-radius: 10px;
    background: #060912;
    cursor: crosshair;
    touch-action: none;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  button {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: linear-gradient(180deg, #1d2740, #141b30);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
    user-select: none;
    min-width: 96px;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4), 0 0 0 1px var(--accent2);
    background: linear-gradient(180deg, #243056, #18203a);
  }
  button:active { transform: translateY(0) scale(0.97); }
  #play.playing {
    background: linear-gradient(180deg, var(--accent), #c84590);
    color: #fff;
    box-shadow: 0 0 22px rgba(255, 94, 168, 0.5);
  }
  .stats {
    display: flex;
    gap: 22px;
    font-size: 13px;
    color: var(--dim);
  }
  .stats b { color: var(--accent2); font-weight: 700; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 500px) {
    button { min-width: 0; padding: 9px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
  <h1>GAME OF LIFE</h1>
  <div class="subtitle">Conway's cellular automaton · B3 / S23</div>
  <div class="stage">
    <canvas id="life" width="600" height="600"></canvas>
    <div class="controls">
      <button id="step">Step ›</button>
      <button id="play">▶ Play</button>
      <button id="random">🎲 Random</button>
      <button id="clear">✕ Clear</button>
    </div>
    <div class="stats">
      <div>Generation <b id="genCount">0</b></div>
      <div>Live cells <b id="liveCount">0</b></div>
      <div>Grid <b id="gridInfo">0×0</b></div>
    </div>
    <div class="hint">Click or drag on the grid to paint cells alive.</div>
  </div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('life');
  const ctx = canvas.getContext('2d');
  const stepBtn = document.getElementById('step');
  const playBtn = document.getElementById('play');
  const randomBtn = document.getElementById('random');
  const clearBtn = document.getElementById('clear');
  const genCountEl = document.getElementById('genCount');
  const liveCountEl = document.getElementById('liveCount');
  const gridInfoEl = document.getElementById('gridInfo');

  // Grid dimensions — well above the 40×40 minimum.
  const W = 60;
  const H = 60;

  // Two buffers for simultaneous generation computation.
  let grid = new Uint8Array(W * H);
  let nextGrid = new Uint8Array(W * H);
  let generation = 0;

  // Cell rendering size (CSS pixels).
  const cellSize = Math.floor(canvas.width / W); // 10px per cell
  const drawSize = cellSize - 1; // tiny gap

  // ---- API ----
  function idx(x, y) { return y * W + x; }
  function inBounds(x, y) { return x >= 0 && x < W && y >= 0 && y < H; }

  function get(x, y) {
    if (!inBounds(x, y)) return 0;
    return grid[idx(x, y)];
  }

  function set(x, y, v) {
    if (!inBounds(x, y)) return;
    grid[idx(x, y)] = v ? 1 : 0;
    drawCell(x, y);
  }

  function clear() {
    grid.fill(0);
    nextGrid.fill(0);
    generation = 0;
    redraw();
    updateStats();
  }

  function countNeighbors(x, y) {
    let n = 0;
    // Unrolled neighbor scan (edges count as 0, no wrap).
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        n += grid[idx(nx, ny)];
      }
    }
    return n;
  }

  function step() {
    // Compute next state entirely from current grid (simultaneous update).
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        const alive = grid[i];
        const n = countNeighbors(x, y);
        let nv;
        if (alive) {
          nv = (n === 2 || n === 3) ? 1 : 0; // S23
        } else {
          nv = (n === 3) ? 1 : 0; // B3
        }
        nextGrid[i] = nv;
      }
    }
    // Swap buffers.
    const tmp = grid;
    grid = nextGrid;
    nextGrid = tmp;
    generation++;
    redraw();
    updateStats();
  }

  // ---- Rendering ----
  function drawCell(x, y) {
    const px = x * cellSize;
    const py = y * cellSize;
    if (grid[idx(x, y)]) {
      ctx.fillStyle = '#5effc8';
      ctx.fillRect(px, py, drawSize, drawSize);
      // soft glow
      ctx.fillStyle = 'rgba(94,255,200,0.15)';
      ctx.fillRect(px - 1, py - 1, drawSize + 2, drawSize + 2);
      ctx.fillStyle = '#5effc8';
      ctx.fillRect(px, py, drawSize, drawSize);
    } else {
      ctx.fillStyle = '#060912';
      ctx.fillRect(px, py, drawSize, drawSize);
    }
  }

  function redraw() {
    // Background
    ctx.fillStyle = '#060912';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Faint grid lines
    ctx.strokeStyle = 'rgba(94,255,200,0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) {
      ctx.beginPath();
      ctx.moveTo(x * cellSize + 0.5, 0);
      ctx.lineTo(x * cellSize + 0.5, H * cellSize);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * cellSize + 0.5);
      ctx.lineTo(W * cellSize, y * cellSize + 0.5);
      ctx.stroke();
    }

    // Live cells
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (grid[idx(x, y)]) {
          const px = x * cellSize;
          const py = y * cellSize;
          ctx.fillStyle = '#5effc8';
          ctx.fillRect(px + 1, py + 1, drawSize - 1, drawSize - 1);
        }
      }
    }
  }

  function updateStats() {
    let live = 0;
    for (let i = 0; i < grid.length; i++) if (grid[i]) live++;
    genCountEl.textContent = generation;
    liveCountEl.textContent = live;
    gridInfoEl.textContent = W + '×' + H;
  }

  // ---- Painting interaction ----
  let painting = false;
  let paintMode = 1; // 1 = make alive, 0 = kill
  let lastPaint = null;

  function cellFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (ev.clientX - rect.left) * scaleX;
    const cy = (ev.clientY - rect.top) * scaleY;
    return { x: Math.floor(cx / cellSize), y: Math.floor(cy / cellSize) };
  }

  function paintAt(x, y, mode) {
    if (!inBounds(x, y)) return;
    if (grid[idx(x, y)] === mode) return;
    grid[idx(x, y)] = mode;
    drawCell(x, y);
    updateStats();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const { x, y } = cellFromEvent(e);
    if (!inBounds(x, y)) return;
    painting = true;
    paintMode = grid[idx(x, y)] ? 0 : 1; // toggle based on first cell
    paintAt(x, y, paintMode);
    lastPaint = { x, y };
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!painting) return;
    const { x, y } = cellFromEvent(e);
    if (!inBounds(x, y)) return;
    if (lastPaint && lastPaint.x === x && lastPaint.y === y) return;
    // draw a line of cells between last and current so fast drags don't skip
    if (lastPaint) {
      const dx = x - lastPaint.x;
      const dy = y - lastPaint.y;
      const steps = Math.max(Math.abs(dx), Math.abs(dy));
      for (let s = 1; s <= steps; s++) {
        const px = lastPaint.x + Math.round(dx * s / steps);
        const py = lastPaint.y + Math.round(dy * s / steps);
        paintAt(px, py, paintMode);
      }
    } else {
      paintAt(x, y, paintMode);
    }
    lastPaint = { x, y };
  });

  function endPaint(e) {
    painting = false;
    lastPaint = null;
  }
  canvas.addEventListener('pointerup', endPaint);
  canvas.addEventListener('pointercancel', endPaint);
  canvas.addEventListener('pointerleave', endPaint);

  // ---- Buttons ----
  stepBtn.addEventListener('click', () => step());
  playBtn.addEventListener('click', togglePlay);
  randomBtn.addEventListener('click', () => {
    for (let i = 0; i < grid.length; i++) {
      grid[i] = Math.random() < 0.28 ? 1 : 0;
    }
    generation = 0;
    redraw();
    updateStats();
  });
  clearBtn.addEventListener('click', () => clear());

  // ---- Auto-run ----
  let playing = false;
  let timerId = null;
  const SPEED = 110; // ms per generation

  function togglePlay() {
    if (playing) {
      stopPlay();
    } else {
      startPlay();
    }
  }
  function startPlay() {
    playing = true;
    playBtn.textContent = '❚❚ Pause';
    playBtn.classList.add('playing');
    timerId = setInterval(() => step(), SPEED);
  }
  function stopPlay() {
    playing = false;
    playBtn.textContent = '▶ Play';
    playBtn.classList.remove('playing');
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  // Keep the canvas at least 400×400 CSS px regardless of attribute scaling.
  function resizeCanvas() {
    const maxSize = Math.min(window.innerWidth - 80, window.innerHeight - 280, 640);
    const cssSize = Math.max(400, Math.floor(maxSize / W) * W);
    canvas.style.width = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    // Keep internal resolution crisp on HiDPI displays.
    const dpr = window.devicePixelRatio || 1;
    const internal = cssSize * dpr;
    // We render at the cssSize mapped to W*cellSize; keep internal = canvas.width
    // (we already fixed canvas.width=600). Adjust so cellSize fits W:
    // Simpler: keep canvas.width fixed and let CSS scale. That's fine.
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---- Initial: a glider + some random soup for fun ----
  function seedGlider(ox, oy) {
    // Classic glider pattern
    set(ox + 1, oy + 0, 1);
    set(ox + 2, oy + 1, 1);
    set(ox + 0, oy + 2, 1);
    set(ox + 1, oy + 2, 1);
    set(ox + 2, oy + 2, 1);
  }
  seedGlider(5, 5);
  // a small block
  set(40, 8, 1); set(41, 8, 1);
  set(40, 9, 1); set(41, 9, 1);
  // a blinker
  set(48, 20, 1); set(49, 20, 1); set(50, 20, 1);
  // some random sprinkle
  for (let i = 0; i < 60; i++) {
    set(Math.floor(Math.random() * W), 30 + Math.floor(Math.random() * 25), 1);
  }

  redraw();
  updateStats();

  // ---- Expose API ----
  window.life = {
    w: W,
    h: H,
    get: get,
    set: set,
    step: step,
    clear: clear
  };
})();
</script>
</body>
</html>
