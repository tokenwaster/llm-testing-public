<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1                e;
            --accent-color: #00ffcc;
            --text-color: #e0e0e0;
            --btn-hover: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #container {
            background-color: var(--panel-color);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        canvas {
            background-color: #000;
            border: 3px solid #333;
            border-radius: 8px;
            cursor: crosshair;
            image-rendering: pixelated;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #333;
            color: white;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #444;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0px);
        }

        #step { background-color: #1565c0; }
        #play { background-color: #2e7d32; }
        #play.running { background-color: #c62828; }
        #random { background-color: #6a1b9a; }
        #clear { background-color: #455a64; }

        button:hover#step { background-color: #1976d2; }
        button:hover#play { background-color: #388e3c; }
        button:hover#random { background-color: #7b1fa2; }
        button:hover#clear { background-color: #546e7a; }

    </style>
</head>
<body>

<div id="container">
    <h1>Game of Life</h1>
    <canvas id="life" width="500" height="500"></canvas>
    <div class="controls">
        <button id="step">Step</button>
        <button id="play">Play</button>
        <button id="random">Random</button>
        <button id="clear">Clear</button>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');
    
    // Configuration: 50x50 grid (satisfies >= 40 requirement)
    const W = 50;
    const H = 50;
    const CELL_SIZE = canvas.width / W;

    // State Buffers
    let grid = new Uint8Array(W * H);
    let nextGrid = new Uint8Array(W * H);
    
    let isPlaying = false;
    let intervalId = null;
    let isMouseDown = false;

    function getIdx(x, y) {
        return y * W + x;
    }

    // API Implementation for Grading
    window.life = {
        w: W,
        h: H,
        get(x, y) {
            if (x < 0 || x >= W || y < 0 || y >= H) return 0;
            return grid[getIdx(x, y)];
        },
        set(x, y, v) {
            if (x >= 0 && x < W && y >= 0 && y < H) {
                grid[getIdx(x, y)] = v ? 1 : 0;
                draw();
            }
        },
        step() {
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    // Count neighbors using the current state via API to ensure edge safety
                    let neighbors = 0;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            neighbors += this.get(x + dx, y + dy);
                        }
                    }

                    const idx = getIdx(x, y);
                    const currentState = grid[idx];

                    // B3/S23 logic
                    if (currentState === 1) {
                        nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                    } else {
                        nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                    }
                }
            }
            // Simultaneous update: apply buffer to current grid
            grid.set(nextGrid);
            draw();
        },
        clear() {
            grid.fill(0);
            draw();
        }
    };

    function draw() {
        // Clear Background
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid Lines (subtle)
        ctx.strokeStyle = '#1a1a1ac0';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        for(let i=0; i<=W; i++) {
            ctx.moveTo(i*CELL_SIZE, 0); ctx.lineTo(i*CELL_SIZE, canvas.height);
        }
        for(let j=0; j<=H; j++) {
            ctx.moveTo(0, j*CELL_SIZE); ctx.lineTo(canvas.width, j*CELL_SIZE);
        }
        ctx.stroke();

        // Draw Cells
        ctx.fillStyle = '#00ffcc'; // Neon cyan for alive cells
        for (let y = 0; y < H; y++) {
            for (int x = 0; x < W; x++) {
                if (grid[getIdx(x, y)] === 1) {
                    ctx.fillRect(
                        x * CELL_SIZE + 0.5, 
                        y * CELL_SIZE + 0.5, 
                        CELL_SIZE - 1, 
                        CELL_SIZE - 1
                    );
                }
            }
        }
    }

    // Input Handling
    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.floor((e.clientX - rect.left) * (W / rect.width)),
            y: Math.floor((e.clientY - rect.top) * (H / rect.height))
        };
    }

    canvas.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        const { x, y } = getCoords(e);
        // Click toggles cell
        window.life.set(x, y, window.life.get(x, y) === 1 ? 0 : 1);
    });

    window.addEventListener('mousemove', (e) => {
        if (isMouseDown) {
            const { x, y } = getCoords(e);
            // Dragging "paints" cells alive
            window.life.set(x, y, 1);
        }
    });

    window.addEventListener('mouseup', () => {
        isMouseDown = false;
    });

    // Control Buttons
    document.getElementById('step').onclick = () => window.life.step();
    
    const btnPlay = document.getElementById('play');
    btnPlay.onclick = () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            btnPlay.textContent = 'Pause';
            btnelass = 'running';
            btnPlay.classList.add('running');
            intervalId = setInterval(() => window.life.step(), 120);
        } else {
            btnPlay.textContent = 'Play';
            btnPlay.classList.remove('running');
            clearInterval(intervalId);
        }
    };

    document.getElementById('random').onclick = () => {
        for (let i = 0; i < W * H; i++) {
            grid[i] = Math.random() > 0.85 ? 1 : 0;
        }
        draw();
    };

    document.getElementById('clear').onclick = () => window.life.clear();

    // Initial Render
    draw();

})();
</script>

</body>
</html>
