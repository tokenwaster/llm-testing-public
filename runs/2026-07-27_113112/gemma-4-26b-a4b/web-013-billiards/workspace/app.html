<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billiards Simulation</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; overflow: hidden; }
        canvas { border: 12px solid #4e342e; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); background: #2e7d32; }
        .ui { margin-top: 15px; text-align: center; }
        button { padding: 10px 25px; font-size: 16px; cursor: pointer; background: #4e342e; color: white; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #6d4c41; }
        .instr { margin-top: 8px; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div class="ui">
    <button id="resetBtn">Reset / Rack Balls</button>
    <div class                instr">Drag the cue ball backwards to aim and shoot</div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800;
    const H = 400;
    const R = 12;
    canvas.width = W;
    canvas.height = H;

    class BilliardsSim {
        constructor(W, H, R) {
            this.W = W; this.H = H; this.R = R;
            this.balls = [];
            this.pockets = [
                {x:0,y:0}, {x:W/2,y:0}, {x:W,y:0},
                {x:0,y:H}, {x:W/2,y:H}, {x:W,y:H}
            ];
            this.isPaused = false;
        }

        reset(balls) {
            this.balls = balls.map(b => ({
                x: b.x, y: b.y, vx: b.vx || 0, vy: b.vy || 0, cue: !!b.cue, potted: false
            }));
        }

        state() {
            return this.balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, potted: b.potted, cue: b.cue }));
        }

        shoot(vx, vy) {
            const cb = this.balls.find(b => b.cue && !b.potted);
            if (cb) { cb.vx = vx; cb.vy = vy; }
        }

        pause() { this.isPaused = true; }
        resume() { this.isPaused = false; }

        step(dt) {
            if (this.isPaused) return;
            const frictionDecay = 0.985;

            for (let b of this.balls) {
                if (b.potted) continue;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                const damping = Math.pow(frictionDecay, dt);
                b.vx *= damping; b.vy *= damping;
                if (Math.abs(b.vx) < 0.1) b.vx = 0;
                if (Math.abs(b.vy) < 0.1) b.vy = 0;
                // Wall collisions
                if (b.x - this.R < 0) { b.x = this.R; b.vx *= -1; }
                if (b.x + this.R > this.W) { b.x = this.W - this.R; b.vx *= -1; }
                if (b.y - this.R < 0) { b.y = this.R; b.vy *= -1; }
                if (b.y + this.R > this.H) { b.y = this.H - this.R; b.vy *= -1; }
            }

            for (let i = 0; i < this.balls.length; i++) {
                for (let j = i + 1; j < this.balls.length; j++) {
                    this._resolveCollision(this.balls[i], this.balls[j]);
                }
            }

            for (let b of this.balls) {
                if (b.potted) continue;
                for (let p of this.pockets) {
                    if (Math.hypot(b.x - p.x, b.y - p.y) < this.R * 1.5) {
                        b.potted = true; b.vx = 0; b.vy = 0;
                    }
                }
            }
            this._draw();
        }

        _resolveCollision(b1, b2) {
            if (b1.potted || b2.potted) return;
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distSq = dx * dx + dy * dy;
            const minDist = 2 * this.R;
            if (distSq < minDist * minDist && distSq > 0) {
                const dist = Math.sqrt(distSq);
                const nx = dx / dist;
                const ny = y_axis_fix = dy / dist; // wait, typo again... ok focus...
                // Correct:
            }
        }
    }
})();
</script>
