<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorting Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131a;
      --panel: #191e29;
      --bar: #5eead4;
      --active: #fbbf24;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      background: #334155;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: translateY(1px);
    }

    #sort {
      background: #0d9488;
    }

    #sort:hover {
      background: #14b8a6;
    }

    #bars {
      height: 430px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      padding: 18px;
      overflow: hidden;
      border: 1px solid #293241;
      border-radius: 12px;
      background: var(--panel);
    }

    .bar {
      flex: 1 1 0;
      min-width: 2px;
      border-radius: 4px 4px 0 0;
      background: var(--bar);
      transition: height 100ms ease, background-color 100ms ease;
    }

    .bar.active {
      background: var(--active);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      #bars {
        height: 330px;
        gap: 2px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sorting Algorithm Visualizer</h1>
    <p>Watch a comparison sort arrange the array in ascending order.</p>

    <div class="controls">
      <button id="sort">Sort</button>
      <button id="shuffle">Shuffle</button>
      <button id="reset">Reset</button>
    </div>

    <div id="bars" aria-label="Array bars"></div>
  </main>

  <script>
    (function () {
      const bars = document.getElementById("bars");
      const sortButton = document.getElementById("sort");
      const shuffleButton = document.getElementById("shuffle");
      const resetButton = document.getElementById("reset");

      const initialArray = [42, 18, 67, 31, 85, 23, 54, 12, 76, 38, 91, 29, 60, 7, 49, 72];
      let values = initialArray.slice();
      let compareA = -1;
      let compareB = -1;
      let algorithm = null;
      let timer = null;

      function createAlgorithmState() {
        algorithm = {
          end: values.length - 1,
          index: 0,
          done: values.length < 2
        };
      }

      function redraw() {
        bars.innerHTML = "";
        if (!values.length) return;

        const max = Math.max(...values, 1);
        values.forEach(function (value, index) {
          const bar = document.createElement("div");
          bar.className = "bar";
          if (index === compareA || index === compareB) {
            bar.classList.add("active");
          }
          bar.style.height = Math.max(2, (value / max) * 100) + "%";
          bar.title = String(value);
          bars.appendChild(bar);
        });
      }

      function stopAnimation() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function setArray(next) {
        stopAnimation();
        values = Array.from(next, Number);
        compareA = -1;
        compareB = -1;
        createAlgorithmState();
        redraw();
      }

      function sortStep() {
        if (!algorithm) createAlgorithmState();

        if (algorithm.done) {
          compareA = -1;
          compareB = -1;
          redraw();
          return true;
        }

        compareA = algorithm.index;
        compareB = algorithm.index + 1;

        if (values[algorithm.index] > values[algorithm.index + 1]) {
          const temp = values[algorithm.index];
          values[algorithm.index] = values[algorithm.index + 1];
          values[algorithm.index + 1] = temp;
        }

        algorithm.index++;

        if (algorithm.index >= algorithm.end) {
          algorithm.end--;
          algorithm.index = 0;
          if (algorithm.end <= 0) {
            algorithm.done = true;
          }
        }

        redraw();
        return algorithm.done;
      }

      function isSorted() {
        for (let i = 1; i < values.length; i++) {
          if (values[i - 1] > values[i]) return false;
        }
        return true;
      }

      function animateSort() {
        if (timer !== null) return;
        timer = setInterval(function () {
          if (sortStep()) stopAnimation();
        }, 80);
      }

      sortButton.addEventListener("click", animateSort);

      shuffleButton.addEventListener("click", function () {
        stopAnimation();
        for (let i = values.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = values[i];
          values[i] = values[j];
          values[j] = temp;
        }
        compareA = -1;
        compareB = -1;
        createAlgorithmState();
        redraw();
      });

      resetButton.addEventListener("click", function () {
        setArray(initialArray);
      });

      window.viz = {
        array: function () {
          return values.slice();
        },
        setArray: setArray,
        sortStep: sortStep,
        sorted: isSorted
      };

      createAlgorithmState();
      redraw();
    })();
  </script>
</body>
</html>
