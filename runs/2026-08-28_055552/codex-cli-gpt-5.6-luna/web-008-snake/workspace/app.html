<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10151c;
      --panel: #18212b;
      --grid: #22303b;
      --snake: #63e6be;
      --head: #a7f3d0;
      --food: #ff6b6b;
      --text: #e8eef3;
      --muted: #9aa9b5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #1c2935 0, var(--bg) 52%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }

    .game {
      width: min(92vw, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: .08em;
      font-size: 2rem;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 14px;
      border: 1px solid #2b3a47;
      border-radius: 12px;
      background: rgba(24, 33, 43, .9);
    }

    #score {
      font-size: 1.15rem;
      font-weight: 700;
    }

    #status {
      color: var(--muted);
      font-size: .9rem;
    }

    canvas {
      display: block;
      width: 420px;
      height: 420px;
      max-width: 100%;
      aspect-ratio: 1;
      margin: 0 auto;
      border: 2px solid #38505f;
      border-radius: 14px;
      background: #111a21;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
    }

    button {
      border: 1px solid #3b5362;
      border-radius: 9px;
      padding: 9px 15px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      font: inherit;
      transition: background .15s, transform .15s;
    }

    button:hover {
      background: #263746;
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>SNAKE</h1>

    <div class="hud">
      <div id="score">Score: 0</div>
      <div id="status">Ready</div>
    </div>

    <canvas id="snake" width="840" height="840" aria-label="Snake game board"></canvas>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <div class="hint">Use the arrow keys to steer</div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("snake");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");

      const w = 20;
      const h = 20;
      const cell = canvas.width / w;
      const directions = {
        up:    { x: 0, y: -1 },
        down:  { x: 0, y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      let body = [];
      let current = "right";
      let queued = "right";
      let pellet = [14, 10];
      let points = 0;
      let isAlive = true;
      let running = false;
      let timer = null;

      function updateScore() {
        scoreEl.textContent = "Score: " + points;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#111a21";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#22303b";
        ctx.lineWidth = 1;
        for (let x = 0; x <= w; x++) {
          ctx.beginPath();
          ctx.moveTo(x * cell + .5, 0);
          ctx.lineTo(x * cell + .5, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= h; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * cell + .5);
          ctx.lineTo(canvas.width, y * cell + .5);
          ctx.stroke();
        }

        if (pellet) {
          const px = pellet[0] * cell + cell / 2;
          const py = pellet[1] * cell + cell / 2;
          ctx.fillStyle = "#ff6b6b";
          ctx.beginPath();
          ctx.arc(px, py, cell * .30, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.35)";
          ctx.beginPath();
          ctx.arc(px - cell * .1, py - cell * .1, cell * .08, 0, Math.PI * 2);
          ctx.fill();
        }

        body.forEach((part, index) => {
          const pad = index === 0 ? 3 : 4;
          ctx.fillStyle = index === 0 ? "#a7f3d0" : "#63e6be";
          ctx.beginPath();
          ctx.roundRect(
            part[0] * cell + pad,
            part[1] * cell + pad,
            cell - pad * 2,
            cell - pad * 2,
            6
          );
          ctx.fill();
        });
      }

      function freeFood() {
        const occupied = new Set(body.map(([x, y]) => x + "," + y));
        const free = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (!occupied.has(x + "," + y)) free.push([x, y]);
          }
        }
        pellet = free.length ? free[Math.floor(Math.random() * free.length)] : null;
      }

      function reset() {
        stopTimer();
        body = [
          [10, 10],
          [9, 10],
          [8, 10]
        ];
        current = "right";
        queued = "right";
        points = 0;
        isAlive = true;
        running = false;
        pellet = [14, 10];
        updateScore();
        statusEl.textContent = "Ready";
        draw();
      }

      function setDir(name) {
        if (!directions[name] || !isAlive) return;
        const a = directions[current];
        const b = directions[name];
        if (a.x + b.x === 0 && a.y + b.y === 0) return;
        queued = name;
      }

      function tick() {
        if (!isAlive) return;

        const nextDirection = directions[queued];
        const oldDirection = directions[current];
        if (!(nextDirection.x + oldDirection.x === 0 &&
              nextDirection.y + oldDirection.y === 0)) {
          current = queued;
        }

        const head = body[0];
        const next = [head[0] + directions[current].x, head[1] + directions[current].y];
        const eating = pellet && next[0] === pellet[0] && next[1] === pellet[1];

        if (next[0] < 0 || next[0] >= w || next[1] < 0 || next[1] >= h) {
          isAlive = false;
          running = false;
          stopTimer();
          statusEl.textContent = "Game over";
          draw();
          return;
        }

        const checkLength = eating ? body.length : body.length - 1;
        for (let i = 0; i < checkLength; i++) {
          if (body[i][0] === next[0] && body[i][1] === next[1]) {
            isAlive = false;
            running = false;
            stopTimer();
            statusEl.textContent = "Game over";
            draw();
            return;
          }
        }

        body.unshift(next);
        if (eating) {
          points++;
          updateScore();
          freeFood();
        } else {
          body.pop();
        }

        draw();
      }

      function stopTimer() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function start() {
        if (!isAlive || running) return;
        running = true;
        statusEl.textContent = "Playing";
        timer = setInterval(tick, 125);
      }

      function pause() {
        if (!running) return;
        running = false;
        stopTimer();
        statusEl.textContent = "Paused";
      }

      document.getElementById("start").addEventListener("click", start);
      document.getElementById("pause").addEventListener("click", pause);
      document.getElementById("reset").addEventListener("click", reset);

      window.addEventListener("keydown", (event) => {
        const map = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right"
        };
        if (map[event.key]) {
          event.preventDefault();
          setDir(map[event.key]);
        }
      });

      window.game = {
        w,
        h,
        reset,
        tick,
        setDir,
        setFood(x, y) {
          if (Number.isInteger(x) && Number.isInteger(y) &&
              x >= 0 && x < w && y >= 0 && y < h) {
            pellet = [x, y];
            draw();
          }
        },
        snake() {
          return body.map(([x, y]) => [x, y]);
        },
        food() {
          return pellet ? [pellet[0], pellet[1]] : null;
        },
        alive() {
          return isAlive;
        },
        score() {
          return points;
        }
      };

      reset();
    })();
  </script>
</body>
</html>
