<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OxOS Desktop</title>
<style>
  /* ============================================================
     OxOS — a tiny Ubuntu-flavoured desktop environment
     ============================================================ */
  :root{
    --bg0:#140b1c;
    --bg1:#241731;
    --win:#2c2136;
    --win-deep:#241a2d;
    --hdr-a:#3b2d4b;
    --hdr-b:#332641;
    --txt:#efe9f4;
    --mut:#a79bb5;
    --acc:#e95420;
    --pur:#77216f;
    --line:rgba(255,255,255,.08);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    overflow:hidden;
    font-family:"Ubuntu","Ubuntu Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--txt);
    background:var(--bg0);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
  ::selection{background:rgba(233,84,32,.45);color:#fff;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.14);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);background-clip:content-box;border:2px solid transparent;}

  /* ---------------- desktop root ---------------- */
  #desktop{
    position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(1100px 780px at 88% -12%, rgba(119,33,111,.55), transparent 62%),
      radial-gradient(900px 700px at -8% 112%, rgba(233,84,32,.26), transparent 55%),
      radial-gradient(760px 540px at 68% 84%, rgba(74,32,102,.45), transparent 60%),
      linear-gradient(158deg,#251731 0%, #1b1023 48%, #130a1b 100%);
  }
  /* faint decorative rings */
  #desktop::before{
    content:'';position:absolute;top:-190px;right:-130px;width:560px;height:560px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.05);pointer-events:none;
  }
  #desktop::after{
    content:'';position:absolute;bottom:-230px;left:-160px;width:640px;height:640px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.04);pointer-events:none;
  }
  #watermark{
    position:absolute;right:5%;bottom:6%;width:min(480px,46vw);height:auto;
    opacity:.05;pointer-events:none;transform:rotate(-8deg);z-index:0;
  }

  /* ---------------- top bar ---------------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;height:32px;z-index:600;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;
    background:rgba(16,9,22,.78);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:12.5px;color:#ded5e6;
    user-select:none;-webkit-user-select:none;
  }
  .tb-left{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.4px;}
  #clock{
    position:absolute;left:50%;transform:translateX(-50%);
    font-weight:500;letter-spacing:.5px;color:#ece3f2;font-variant-numeric:tabular-nums;
  }
  .tb-right{display:flex;align-items:center;gap:11px;opacity:.85;}

  /* ---------------- dock / taskbar ---------------- */
  #taskbar{
    position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:500;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:12px 8px 16px;
    background:rgba(24,15,32,.72);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    box-shadow:0 12px 34px rgba(0,0,0,.45);
    user-select:none;-webkit-user-select:none;
  }
  .launcher{
    position:relative;width:48px;height:48px;border-radius:14px;
    display:grid;place-items:center;
    transition:background .14s, transform .14s;
  }
  .launcher:hover{background:rgba(255,255,255,.09);transform:scale(1.07);}
  .launcher:active{transform:scale(.96);}
  .launcher::before{ /* tooltip */
    content:attr(data-tip);
    position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);
    padding:5px 11px;font-size:12px;font-weight:500;white-space:nowrap;
    background:rgba(8,4,12,.92);color:#f2ecf6;border-radius:8px;
    border:1px solid rgba(255,255,255,.1);
    opacity:0;pointer-events:none;transition:opacity .12s .1s;
  }
  .launcher:hover::before{opacity:1;}
  .run-dot{
    position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) scale(0);
    width:5px;height:5px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 7px rgba(233,84,32,.9);
    transition:transform .18s ease;
  }
  .launcher.running .run-dot{transform:translateX(-50%) scale(1);}

  /* ---------------- windows ---------------- */
  .window{
    position:absolute;z-index:10;
    display:none;flex-direction:column;
    min-width:360px;min-height:240px;
    background:linear-gradient(180deg,var(--win),var(--win-deep));
    border-radius:12px;overflow:hidden;
    box-shadow:0 16px 44px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
    animation:winIn .18s ease-out;
  }
  .window.open{display:flex;}
  .window.focused{
    box-shadow:0 26px 72px rgba(0,0,0,.62), 0 0 0 1px rgba(233,84,32,.42);
  }
  @keyframes winIn{
    from{opacity:0;transform:scale(.965) translateY(10px);}
    to{opacity:1;transform:none;}
  }

  .titlebar{
    display:flex;align-items:center;gap:8px;
    height:42px;flex:0 0 auto;padding:0 8px 0 14px;
    background:linear-gradient(180deg,var(--hdr-a),var(--hdr-b));
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .titlebar:active{cursor:grabbing;}
  .window:not(.focused) .titlebar{filter:saturate(.65) brightness(.9);}
  .win-title{
    flex:1;display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;letter-spacing:.2px;color:#f0e8f6;
  }
  .win-close{
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;color:#cfc3da;
    transition:background .12s,color .12s,transform .08s;
  }
  .win-close:hover{background:var(--acc);color:#fff;}
  .win-close:active{transform:scale(.92);}

  .win-status{
    flex:0 0 auto;height:26px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:0 12px;font-size:11px;color:#9d91aa;
    background:rgba(0,0,0,.18);
    border-top:1px solid rgba(255,255,255,.05);
    user-select:none;-webkit-user-select:none;
  }

  .resize-grip{
    position:absolute;right:2px;bottom:2px;width:16px;height:16px;
    cursor:nwse-resize;touch-action:none;z-index:5;
    background:linear-gradient(135deg,
      transparent 0 46%, rgba(255,255,255,.28) 46% 54%,
      transparent 54% 66%, rgba(255,255,255,.28) 66% 74%, transparent 74%);
  }

  /* ---------------- Files app ---------------- */
  .files-toolbar{
    flex:0 0 auto;height:46px;
    display:flex;align-items:center;gap:10px;padding:0 12px;
    background:rgba(0,0,0,.16);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  #files-up{
    width:30px;height:30px;border-radius:8px;flex:0 0 auto;
    display:grid;place-items:center;color:#d9cfe4;
    transition:background .12s,color .12s,opacity .12s;
  }
  #files-up:hover:not(:disabled){background:rgba(255,255,255,.1);color:#fff;}
  #files-up:disabled{opacity:.32;cursor:default;}
  #files-path{
    flex:1;height:30px;line-height:28px;padding:0 14px;
    background:rgba(0,0,0,.28);
    border:1px solid rgba(255,255,255,.07);border-radius:999px;
    font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;
    font-size:12.5px;color:#e8dff0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #files-list{
    flex:1;overflow:auto;padding:12px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));
    gap:4px;align-content:start;
  }
  .fs-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 6px 8px;border-radius:10px;text-align:center;
    transition:background .1s, box-shadow .1s;
  }
  .fs-item:hover{background:rgba(255,255,255,.07);}
  .fs-item.selected{background:rgba(233,84,32,.22);box-shadow:inset 0 0 0 1px rgba(233,84,32,.55);}
  .fs-name{
    font-size:12px;line-height:1.25;color:#e6ddf0;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .fs-empty{
    grid-column:1/-1;text-align:center;color:#8f8399;
    padding:44px 0;font-size:12.5px;
  }

  /* ---------------- Notepad app ---------------- */
  .tabstrip{
    flex:0 0 auto;height:40px;
    display:flex;align-items:flex-end;gap:4px;padding:0 8px;
    background:rgba(0,0,0,.16);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  #tabs{
    flex:1;display:flex;align-items:flex-end;gap:2px;
    height:100%;overflow-x:auto;scrollbar-width:none;
  }
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;max-width:172px;height:32px;margin-top:8px;
    display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;
    border-radius:9px 9px 0 0;
    background:rgba(255,255,255,.05);color:#b6aac4;
    font-size:12.5px;cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:background .12s,color .12s;
  }
  .tab:hover{background:rgba(255,255,255,.09);color:#ddd2e8;}
  .tab.active{background:var(--win-deep);color:#f6effb;box-shadow:inset 0 2px 0 var(--acc);}
  .tab-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tab-x{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;
    display:grid;place-items:center;font-size:11px;line-height:1;color:#9d8fae;
  }
  .tab-x:hover{background:rgba(255,255,255,.16);color:#fff;}
  #new-tab{
    flex:0 0 auto;width:26px;height:26px;margin-bottom:6px;border-radius:8px;
    display:grid;place-items:center;font-size:17px;line-height:1;color:#cfc3da;
    transition:background .12s,color .12s;
  }
  #new-tab:hover{background:rgba(255,255,255,.1);color:#fff;}
  #editor{
    flex:1;width:100%;resize:none;border:none;outline:none;
    background:var(--win-deep);color:#eee6f5;
    padding:14px 16px;
    font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,"Courier New",monospace;
    font-size:13px;line-height:1.65;
    caret-color:var(--acc);
  }
  #editor::placeholder{color:#7d7189;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>

/* ============================================================
   Window manager
   ============================================================ */
const filesWin   = $('files-window');
const notepadWin = $('notepad-window');
const allWins = [...document.querySelectorAll('.window')];
let zTop = 100;

const isOpen = w => w.classList.contains('open');

function focusWindow(w){
  allWins.forEach(o => o.classList.toggle('focused', o === w));
  w.style.zIndex = ++zTop;
}

function placeWindow(w){
  const dw = +w.dataset.defw || 640;
  const dh = +w.dataset.defh || 440;
  const vw = innerWidth, vh = innerHeight;
  const wide = vw > 720;
  const W = Math.min(dw, Math.max(360, vw - (wide ? 124 : 24)));
  const H = Math.min(dh, Math.max(240, vh - 56));
  const off = +(w.dataset.cascade || 0);
  let x = Math.round((vw - W) / 2) + off * 36 - 40;
  let y = Math.round((vh - H) / 2) + off * 28 - 30;
  x = Math.max(wide ? 96 : 8, Math.min(x, vw - W - 8));
  y = Math.max(40, Math.min(y, vh - H - 8));
  Object.assign(w.style, { width: W + 'px', height: H + 'px', left: x + 'px', top: y + 'px' });
}

function openWindow(w){
  if (!isOpen(w)) {
    if (!w.dataset.placed) { placeWindow(w); w.dataset.placed = '1'; }
    w.classList.add('open');
  }
  focusWindow(w);
  syncDock();
}

function closeWindow(w){
  if (w === notepadWin) flushEditor();   // make sure nothing is lost
  w.classList.remove('open');
  syncDock();
}

function syncDock(){
  $('open-files').classList.toggle('running', isOpen(filesWin));
  $('open-notepad').classList.toggle('running', isOpen(notepadWin));
}

allWins.forEach(w => {
  w.querySelector('.win-close').addEventListener('click', () => closeWindow(w));
  w.addEventListener('pointerdown', () => focusWindow(w));

  /* --- drag by titlebar --- */
  const tb = w.querySelector('.titlebar');
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-close')) return;
    e.preventDefault();
    const r = w.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    tb.setPointerCapture(e.pointerId);
    const mv = ev => {
      const x = Math.min(Math.max(ev.clientX - dx, -r.width + 90), innerWidth - 90);
      const y = Math.min(Math.max(ev.clientY - dy, 0), innerHeight - 42);
      w.style.left = x + 'px';
      w.style.top  = y + 'px';
    };
    const done = () => {
      tb.removeEventListener('pointermove', mv);
      tb.removeEventListener('pointerup', done);
      tb.removeEventListener('pointercancel', done);
    };
    tb.addEventListener('pointermove', mv);
    tb.addEventListener('pointerup', done);
    tb.addEventListener('pointercancel', done);
  });

  /* --- double-click titlebar: maximize / restore --- */
  let snap = null;
  tb.addEventListener('dblclick', e => {
    if (e.target.closest('.win-close')) return;
    if (snap) {
      Object.assign(w.style, snap); snap = null;
    } else {
      snap = { left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height };
      const wide = innerWidth > 720;
      Object.assign(w.style, {
        left: (wide ? 96 : 8) + 'px',
        top: '40px',
        width: (innerWidth - (wide ? 104 : 16)) + 'px',
        height: (innerHeight - 48) + 'px'
      });
    }
  });

  /* --- resize from bottom-right grip --- */
  const grip = w.querySelector('.resize-grip');
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    focusWindow(w);
    const sw = w.offsetWidth, sh = w.offsetHeight;
    const sx = e.clientX, sy = e.clientY;
    grip.setPointerCapture(e.pointerId);
    const mv = ev => {
      const W = Math.max(360, Math.min(innerWidth - 16, sw + ev.clientX - sx));
      const H = Math.max(240, Math.min(innerHeight - 16, sh + ev.clientY - sy));
      w.style.width = W + 'px';
      w.style.height = H + 'px';
    };
    const done = () => {
      grip.removeEventListener('pointermove', mv);
      grip.removeEventListener('pointerup', done);
      grip.removeEventListener('pointercancel', done);
    };
    grip.addEventListener('pointermove', mv);
    grip.addEventListener('pointerup', done);
    grip.addEventListener('pointercancel', done);
  });
});

$('open-files').addEventListener('click', () => openWindow(filesWin));
$('open-notepad').addEventListener('click', () => openWindow(notepadWin));

/* ============================================================
   Files app
   ============================================================ */
const ICON_DIR = `
  <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
    <path fill="#C97B24" d="M3 8.2C3 6.4 4.4 5 6.2 5h5.1c.9 0 1.8.4 2.4 1.1l1.6 1.9h8.5C25.6 8 27 9.4 27 11.2v1.3H3z"/>
    <path fill="#F0A63C" d="M3 11.5c0-1.1.9-2 2-2h22c1.1 0 2 .9 2 2v12c0 1.7-1.3 3-3 3H6c-1.7 0-3-1.3-3-3z"/>
    <path fill="#FFD08A" opacity=".5" d="M3 14h26v1.6H3z"/>
  </svg>`;
const ICON_FILE = `
  <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#B9AFC4" d="M6 3.5C6 2.7 6.7 2 7.5 2h6L19 7.5v13c0 .8-.7 1.5-1.5 1.5h-10C6.7 22 6 21.3 6 20.5z"/>
    <path fill="#8D8298" d="M13.5 2 19 7.5h-4.2c-.7 0-1.3-.6-1.3-1.3z"/>
    <g stroke="#6E6379" stroke-width="1.4" stroke-linecap="round">
      <line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="17" x2="13" y2="17"/>
    </g>
  </svg>`;

const fileList = $('files-list');
const filePathEl = $('files-path');
const upBtn = $('files-up');
const filesMsg = $('files-msg');

let cwd = [];            // array of path segments, [] === "/"
let lastCount = 0;
let flashTimer = null;

function resolve(path){
  let n = FS;
  for (const seg of path) n = n.k[seg];
  return n;
}

function fmtSize(node){
  if (node.s) return node.s;
  const b = (node.c || '').length;
  return b < 1024 ? b + ' B' : (b / 1024).toFixed(1) + ' KB';
}

function setFsStatus(text){ filesMsg.textContent = text; }

function flashFsStatus(text){
  setFsStatus(text);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => setFsStatus(`${lastCount} ${lastCount === 1 ? 'item' : 'items'}`), 2600);
}

function renderFiles(){
  const node = resolve(cwd);
  filePathEl.textContent = '/' + cwd.join('/');
  upBtn.disabled = cwd.length === 0;

  const entries = Object.entries(node.k).sort((a, b) => {
    const da = a[1].t === 'd', db = b[1].t === 'd';
    if (da !== db) return da ? -1 : 1;
    return a[0].localeCompare(b[0], undefined, { numeric: true, sensitivity: 'base' });
  });
  lastCount = entries.length;

  fileList.innerHTML = '';
  if (!entries.length) {
    const empty = document.createElement('div');
    empty.className = 'fs-empty';
    empty.textContent = 'This folder is empty';
    fileList.appendChild(empty);
  }

  for (const [name, child] of entries) {
    const el = document.createElement('div');
    el.className = 'fs-item';
    el.dataset.type = child.t;
    el.setAttribute('role', 'listitem');
    el.innerHTML = child.t === 'd' ? ICON_DIR : ICON_FILE;

    const nm = document.createElement('span');
    nm.className = 'fs-name';
    nm.textContent = name;                 // visible text == entry name
    el.appendChild(nm);

    el.title = child.t === 'd' ? `${name}/` : `${name} · ${fmtSize(child)}`;

    el.addEventListener('click', () => {
      fileList.querySelectorAll('.fs-item.selected').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });

    el.addEventListener('dblclick', () => {
      if (child.t === 'd') {
        cwd.push(name);
        renderFiles();
      } else {
        openFileEntry(name, child);
      }
    });

    fileList.appendChild(el);
  }
  setFsStatus(`${lastCount} ${lastCount === 1 ? 'item' : 'items'}`);
}

function openFileEntry(name, node){
  if (typeof node.c === 'string') {
    openInNotepad(name, node.c);
    flashFsStatus(`Opened \u201C${name}\u201D in Notepad`);
  } else {
    flashFsStatus(`\u201C${name}\u201D is a binary file \u2014 no preview available`);
  }
}

upBtn.addEventListener('click', () => {
  if (cwd.length === 0) return;
  cwd.pop();
  renderFiles();
});

/* click on empty list background clears selection */
fileList.addEventListener('click', e => {
  if (e.target === fileList)
    fileList.querySelectorAll('.fs-item.selected').forEach(x => x.classList.remove('selected'));
});

/* ============================================================
   Notepad app (tabbed, persisted in localStorage)
   ============================================================ */
const tabsEl   = $('tabs');
const newBtn   = $('new-tab');
const editor   = $('editor');
const caretEl  = $('np-caret');
const countEl  = $('np-count');

const LS_KEY = 'oxos-notepad-v1';
let tabs = [];
let activeId = null;
let seq = 1;

function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, tabs, activeId })); } catch (_) {}
}

function restore(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.tabs) && d.tabs.length) {
        tabs = d.tabs
          .filter(t => t && typeof t === 'object')
          .map(t => ({
            id: typeof t.id === 'number' ? t.id : seq++,
            name: String(t.name || 'Untitled').slice(0, 80),
            content: typeof t.content === 'string' ? t.content : ''
          }));
        if (!tabs.length) throw new Error('empty');
        seq = tabs.reduce((m, t) => Math.max(m, t.id), 0) + 1;
        activeId = tabs.some(t => t.id === d.activeId) ? d.activeId : tabs[0].id;
        return;
      }
    }
  } catch (_) {}
  tabs = [{ id: seq++, name: 'Untitled', content: '' }];
  activeId = tabs[0].id;
}

const cur = () => tabs.find(t => t.id === activeId);

function renderTabs(){
  tabsEl.innerHTML = '';
  for (const t of tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === activeId ? ' active' : '');
    el.dataset.id = t.id;
    el.setAttribute('role', 'tab');
    el.title = t.name;

    const nm = document.createElement('span');
    nm.className = 'tab-name';
    nm.textContent = t.name;
    el.appendChild(nm);

    const x = document.createElement('button');
    x.className = 'tab-x';
    x.textContent = '\u00D7';
    x.setAttribute('aria-label', 'Close tab ' + t.name);
    x.addEventListener('click', ev => { ev.stopPropagation(); closeTab(t.id); });
    el.appendChild(x);

    el.addEventListener('click', () => setActive(t.id));
    tabsEl.appendChild(el);
  }
  const act = tabsEl.querySelector('.tab.active');
  if (act) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function setActive(id){
  if (activeId !== id) {
    const prev = cur();
    if (prev) prev.content = editor.value;   // flush before switching
    activeId = id;
  }
  const t = cur();
  editor.value = t ? t.content : '';
  renderTabs();
  persist();
  updateMeta();
}

function uniqueUntitled(){
  const names = new Set(tabs.map(t => t.name));
  let n = 'Untitled', i = 1;
  while (names.has(n)) { i++; n = 'Untitled ' + i; }
  return n;
}

function newTab(name, content){
  const t = { id: seq++, name: name !== undefined ? name : uniqueUntitled(), content: content || '' };
  tabs.push(t);
  setActive(t.id);
  editor.focus();
  return t;
}

function closeTab(id){
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (activeId === id) {
    activeId = null;
    if (!tabs.length) tabs = [{ id: seq++, name: 'Untitled', content: '' }];
    activeId = tabs[Math.min(i, tabs.length - 1)].id;
  }
  const t = cur();
  editor.value = t ? t.content : '';
  renderTabs();
  persist();
  updateMeta();
}

function updateMeta(){
  const v = editor.value;
  const i = editor.selectionStart || 0;
  const lines = v.slice(0, i).split('
');
  caretEl.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
  const words = v.trim() ? v.trim().split(/\s+/).length : 0;
  countEl.textContent = `${v.length} characters \u00B7 ${words} words`;
}

function flushEditor(){
  const t = cur();
  if (t) t.content = editor.value;
  persist();
}

newBtn.addEventListener('click', () => newTab());

editor.addEventListener('input', () => {
  const t = cur();
  if (t) t.content = editor.value;
  persist();
  updateMeta();
});
['click', 'keyup', 'select'].forEach(ev => editor.addEventListener(ev, updateMeta));

function openInNotepad(name, content){
  const existing = tabs.find(t => t.name === name);
  if (existing) setActive(existing.id);
  else newTab(name, content);
  openWindow(notepadWin);
}

/* ============================================================
   Boot
   ============================================================ */
renderFiles();          // Files ready at "/" from the start
restore();              // pull tabs out of localStorage (or seed one)
setActive(activeId);    // sync editor + tab strip
syncDock();

/* last-chance flush so nothing typed is ever lost */
addEventListener('beforeunload', flushEditor);
})();
</script>
