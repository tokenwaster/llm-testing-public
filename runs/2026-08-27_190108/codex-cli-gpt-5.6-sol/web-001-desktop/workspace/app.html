<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Desktop</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Ubuntu, "Segoe UI", system-ui, sans-serif;
    --orange: #e95420;
    --panel: #211d20;
    --window: #2d292c;
    --window-light: #3a3539;
    --text: #f5f3f4;
    --muted: #bdb6ba;
    --border: #50494e;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  button, textarea { font: inherit; }

  button { color: inherit; }

  #desktop {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-width: 380px;
    min-height: 300px;
    overflow: hidden;
    color: var(--text);
    background:
      radial-gradient(circle at 82% 25%, rgba(232, 80, 37, .55), transparent 27%),
      radial-gradient(circle at 20% 90%, rgba(105, 36, 92, .8), transparent 35%),
      linear-gradient(135deg, #291330 0%, #4b183a 42%, #8d2c32 76%, #d94c27 100%);
  }

  #desktop::before {
    content: "";
    position: absolute;
    inset: 34px 0 0;
    opacity: .22;
    pointer-events: none;
    background:
      linear-gradient(125deg, transparent 45%, rgba(255,255,255,.16) 45.2%, transparent 45.5%),
      linear-gradient(35deg, transparent 68%, rgba(255,255,255,.1) 68.2%, transparent 68.5%);
  }

  .top-panel {
    position: absolute;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 13px;
    background: rgba(24, 20, 23, .94);
    box-shadow: 0 1px 5px rgba(0,0,0,.5);
    font-size: 13px;
  }

  .activities {
    font-weight: 650;
    letter-spacing: .1px;
  }

  #clock {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 600;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .network {
    width: 15px;
    height: 11px;
    border: solid #eee;
    border-width: 2px 2px 0 0;
    transform: rotate(-45deg);
    border-radius: 0 7px 0 0;
  }

  .power {
    width: 14px;
    height: 14px;
    border: 2px solid #eee;
    border-radius: 50%;
    position: relative;
  }

  .power::before {
    content: "";
    position: absolute;
    top: -4px;
    left: 4px;
    width: 2px;
    height: 7px;
    background: #eee;
    box-shadow: 0 0 0 2px #211d20;
  }

  #taskbar {
    position: absolute;
    z-index: 900;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 9px 7px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    background: rgba(25, 20, 25, .72);
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
  }

  .launcher {
    position: relative;
    width: 49px;
    height: 49px;
    border: 0;
    border-radius: 11px;
    cursor: pointer;
    background: transparent;
    transition: background .15s, transform .15s;
  }

  .launcher:hover {
    background: rgba(255,255,255,.14);
    transform: scale(1.05);
  }

  .launcher:active { transform: scale(.97); }

  .launcher::after {
    position: absolute;
    left: 62px;
    top: 14px;
    padding: 5px 8px;
    border-radius: 5px;
    color: white;
    background: #171417;
    box-shadow: 0 3px 10px rgba(0,0,0,.4);
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }

  .launcher:hover::after { opacity: 1; }
  #open-files::after { content: "Files"; }
  #open-notepad::after { content: "Notepad"; }

  .folder-icon {
    position: absolute;
    left: 8px;
    top: 13px;
    width: 34px;
    height: 27px;
    border-radius: 4px;
    background: linear-gradient(#f5b84f 0 25%, #d99019 25%);
    box-shadow: inset 0 1px rgba(255,255,255,.35), 0 2px 5px rgba(0,0,0,.3);
  }

  .folder-icon::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 2px;
    width: 15px;
    height: 7px;
    border-radius: 3px 3px 0 0;
    background: #f5b84f;
  }

  .note-icon {
    position: absolute;
    inset: 7px 10px;
    border-radius: 4px;
    background: linear-gradient(90deg, #dedede 0 15%, #fff 15%);
    box-shadow: 0 2px 5px rgba(0,0,0,.35);
  }

  .note-icon::after {
    content: "";
    position: absolute;
    left: 9px;
    right: 4px;
    top: 8px;
    height: 2px;
    background: #7d6b78;
    box-shadow: 0 6px #7d6b78, 0 12px #7d6b78, 0 18px #7d6b78;
  }

  .window {
    position: absolute;
    z-index: 10;
    display: flex;
    flex-direction: column;
    width: min(700px, calc(100vw - 105px));
    height: min(500px, calc(100vh - 75px));
    min-width: 360px;
    min-height: 240px;
    overflow: hidden;
    border: 1px solid #60585e;
    border-radius: 11px;
    background: var(--window);
    box-shadow: 0 18px 55px rgba(0,0,0,.52);
    resize: both;
  }

  #files-window {
    left: max(80px, calc(50% - 350px));
    top: max(52px, calc(50% - 250px));
  }

  #notepad-window {
    left: max(95px, calc(50% - 315px));
    top: max(60px, calc(50% - 220px));
    width: min(630px, calc(100vw - 115px));
    height: min(440px, calc(100vh - 90px));
    display: none;
  }

  .titlebar {
    flex: 0 0 39px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    background: linear-gradient(#3d383c, #332e32);
    border-bottom: 1px solid #1d1a1c;
    cursor: move;
    user-select: none;
  }

  .window-title {
    font-size: 13px;
    font-weight: 650;
  }

  .win-close {
    position: absolute;
    right: 10px;
    width: 23px;
    height: 23px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: #eee;
    background: #514a4f;
    cursor: pointer;
    font-size: 17px;
    line-height: 21px;
  }

  .win-close:hover { background: #d94736; }

  .files-toolbar {
    flex: 0 0 45px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 10px;
    background: #353034;
    border-bottom: 1px solid #1f1c1e;
  }

  #files-up {
    width: 31px;
    height: 31px;
    border: 1px solid #5b5459;
    border-radius: 6px;
    background: #454045;
    cursor: pointer;
    font-size: 20px;
    line-height: 25px;
  }

  #files-up:hover:not(:disabled) { background: #554e53; }
  #files-up:disabled { opacity: .35; cursor: default; }

  #files-path {
    flex: 1;
    height: 31px;
    display: flex;
    align-items: center;
    padding: 0 11px;
    border: 1px solid #555055;
    border-radius: 6px;
    color: #f3f1f2;
    background: #262225;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 13px;
  }

  .files-layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .sidebar {
    flex: 0 0 150px;
    padding: 10px 7px;
    border-right: 1px solid #1e1b1d;
    background: #292528;
  }

  .place {
    padding: 8px 11px;
    margin-bottom: 2px;
    border-radius: 5px;
    color: #ddd8db;
    cursor: pointer;
    font-size: 13px;
  }

  .place:hover { background: #3d383c; }
  .place.active { background: rgba(233,84,32,.27); color: white; }

  #files-list {
    flex: 1;
    min-width: 0;
    overflow: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    align-content: start;
    gap: 8px;
    padding: 15px;
    background: #302c2f;
  }

  .fs-item {
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    padding: 8px 5px;
    border: 1px solid transparent;
    border-radius: 7px;
    cursor: default;
    text-align: center;
    font-size: 12px;
    overflow-wrap: anywhere;
    user-select: none;
  }

  .fs-item:hover {
    border-color: #5e575c;
    background: rgba(255,255,255,.06);
  }

  .fs-item.selected {
    border-color: #e16a40;
    background: rgba(233,84,32,.22);
  }

  .fs-item::before {
    content: "";
    display: block;
    width: 42px;
    height: 34px;
    border-radius: 5px;
    background: linear-gradient(#f7bf57 0 24%, #d88e16 24%);
    box-shadow: inset 0 1px rgba(255,255,255,.3), 0 2px 4px rgba(0,0,0,.3);
  }

  .fs-item.folder::after {
    content: "";
    position: absolute;
  }

  .fs-item.file::before {
    width: 31px;
    height: 38px;
    border-radius: 3px;
    background:
      linear-gradient(135deg, transparent 0 9px, #ddd 9px) top right / 11px 11px no-repeat,
      linear-gradient(#f8f8f8, #d7d7d7);
    box-shadow: 0 2px 4px rgba(0,0,0,.35);
  }

  .fs-item.file {
    color: #e0dcde;
  }

  .notepad-tools {
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    padding: 4px 8px;
    border-bottom: 1px solid #1e1b1d;
    background: #302b2f;
  }

  #new-tab {
    height: 28px;
    padding: 0 13px;
    border: 1px solid #5b5459;
    border-radius: 5px;
    background: #464046;
    cursor: pointer;
  }

  #new-tab:hover { background: #575057; }

  #tabs {
    flex: 0 0 38px;
    display: flex;
    gap: 2px;
    min-width: 0;
    padding: 5px 7px 0;
    overflow-x: auto;
    overflow-y: hidden;
    background: #282427;
  }

  .tab {
    flex: 0 0 auto;
    min-width: 110px;
    max-width: 180px;
    height: 33px;
    padding: 8px 14px;
    overflow: hidden;
    border-radius: 6px 6px 0 0;
    color: #c9c3c7;
    background: #373237;
    cursor: pointer;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: none;
    font-size: 12px;
  }

  .tab:hover { background: #454045; }

  .tab.active {
    color: white;
    background: #3e393d;
    box-shadow: inset 0 2px var(--orange);
  }

  #editor {
    flex: 1;
    width: 100%;
    min-height: 0;
    padding: 18px 20px;
    resize: none;
    outline: none;
    border: 0;
    color: #eee;
    caret-color: #ff8a5e;
    background: #3e393d;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 14px;
    line-height: 1.55;
    tab-size: 4;
  }

  #editor::selection { background: rgba(233,84,32,.55); }

  @media (max-width: 540px) {
    #taskbar {
      top: auto;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: row;
    }

    .launcher:hover::after { display: none; }

    .window, #notepad-window {
      left: 10px;
      top: 45px;
      width: calc(100vw - 20px);
      height: calc(100vh - 120px);
    }

    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="desktop">
  <header class="top-panel">
    <div class="activities">Activities</div>
    <div id="clock"></div>
    <div class="status" aria-label="System status">
      <span class="network" aria-hidden="true"></span>
      <span>▮▮</span>
      <span class="power" aria-hidden="true"></span>
    </div>
  </header>

  <nav id="taskbar" aria-label="Applications">
    <button id="open-files" class="launcher" aria-label="Open Files">
      <span class="folder-icon" aria-hidden="true"></span>
    </button>
    <button id="open-notepad" class="launcher" aria-label="Open Notepad">
      <span class="note-icon" aria-hidden="true"></span>
    </button>
  </nav>

  <section id="files-window" class="window" aria-label="Files window">
    <div class="titlebar">
      <span class="window-title">Files</span>
      <button class="win-close" aria-label="Close Files">×</button>
    </div>
    <div class="files-toolbar">
      <button id="files-up" title="Parent folder" aria-label="Parent folder">↑</button>
      <div id="files-path">/</div>
    </div>
    <div class="files-layout">
      <aside class="sidebar">
        <div class="place active" data-path="/">⌂ &nbsp;Computer</div>
        <div class="place" data-path="/home/user">⌂ &nbsp;Home</div>
        <div class="place" data-path="/home/user/Documents">▤ &nbsp;Documents</div>
        <div class="place" data-path="/home/user/Downloads">↓ &nbsp;Downloads</div>
        <div class="place" data-path="/home/user/Pictures">▧ &nbsp;Pictures</div>
      </aside>
      <main id="files-list" aria-label="Folder contents"></main>
    </div>
  </section>

  <section id="notepad-window" class="window" aria-label="Notepad window">
    <div class="titlebar">
      <span class="window-title">Notepad</span>
      <button class="win-close" aria-label="Close Notepad">×</button>
    </div>
    <div class="notepad-tools">
      <button id="new-tab">＋ New Tab</button>
    </div>
    <div id="tabs" role="tablist"></div>
    <textarea id="editor" spellcheck="true" aria-label="Text editor"></textarea>
  </section>
</div>

<script>
(() => {
  "use strict";

  const fileSystem = {
    "/": [
      ["bin", "folder"], ["etc", "folder"], ["home", "folder"],
      ["usr", "folder"], ["var", "folder"], ["opt", "folder"],
      ["tmp", "folder"], ["README", "file"]
    ],
    "/bin": [
      ["bash", "file"], ["cat", "file"], ["cp", "file"],
      ["ls", "file"], ["mkdir", "file"]
    ],
    "/etc": [
      ["apt", "folder"], ["network", "folder"], ["hosts", "file"],
      ["hostname", "file"], ["os-release", "file"]
    ],
    "/home": [["user", "folder"]],
    "/home/user": [
      ["Documents", "folder"], ["Downloads", "folder"],
      ["Pictures", "folder"], ["Music", "folder"],
      ["Videos", "folder"], ["notes.txt", "file"]
    ],
    "/home/user/Documents": [
      ["Projects", "folder"], ["Ideas.txt", "file"],
      ["Resume.pdf", "file"], ["todo.md", "file"]
    ],
    "/home/user/Documents/Projects": [
      ["desktop-app", "folder"], ["README.md", "file"]
    ],
    "/home/user/Documents/Projects/desktop-app": [
      ["app.html", "file"], ["LICENSE", "file"]
    ],
    "/home/user/Downloads": [
      ["archive.tar.gz", "file"], ["wallpaper.png", "file"]
    ],
    "/home/user/Pictures": [
      ["Wallpapers", "folder"], ["holiday.jpg", "file"],
      ["portrait.png", "file"]
    ],
    "/home/user/Pictures/Wallpapers": [
      ["ubuntu-purple.jpg", "file"], ["mountains.jpg", "file"]
    ],
    "/home/user/Music": [["Playlist.m3u", "file"]],
    "/home/user/Videos": [["welcome.mp4", "file"]],
    "/usr": [
      ["bin", "folder"], ["lib", "folder"], ["local", "folder"],
      ["share", "folder"]
    ],
    "/var": [
      ["cache", "folder"], ["lib", "folder"], ["log", "folder"],
      ["tmp", "folder"]
    ],
    "/opt": [],
    "/tmp": []
  };

  let currentPath = "/";
  let topZ = 20;
  const filesList = document.getElementById("files-list");
  const filesPath = document.getElementById("files-path");
  const upButton = document.getElementById("files-up");

  function joinPath(base, name) {
    return base === "/" ? "/" + name : base + "/" + name;
  }

  function navigate(path) {
    if (!Object.prototype.hasOwnProperty.call(fileSystem, path)) return;
    currentPath = path;
    filesPath.textContent = path;
    upButton.disabled = path === "/";
    filesList.replaceChildren();

    for (const [name, type] of fileSystem[path]) {
      const item = document.createElement("div");
      item.className = "fs-item " + type;
      item.textContent = name;
      item.dataset.name = name;
      item.dataset.type = type;
      item.title = type === "folder" ? "Double-click to open " + name : name;

      item.addEventListener("click", () => {
        filesList.querySelectorAll(".fs-item").forEach(el => el.classList.remove("selected"));
        item.classList.add("selected");
      });

      if (type === "folder") {
        item.addEventListener("dblclick", () => navigate(joinPath(currentPath, name)));
      }

      filesList.appendChild(item);
    }

    document.querySelectorAll(".place").forEach(place => {
      place.classList.toggle("active", place.dataset.path === path);
    });
  }

  upButton.addEventListener("click", () => {
    if (currentPath === "/") return;
    const parts = currentPath.split("/").filter(Boolean);
    parts.pop();
    navigate(parts.length ? "/" + parts.join("/") : "/");
  });

  document.querySelectorAll(".place").forEach(place => {
    place.addEventListener("click", () => navigate(place.dataset.path));
  });

  const storageKey = "ubuntu-desktop-notepad-tabs-v1";
  const activeStorageKey = "ubuntu-desktop-notepad-active-v1";
  const tabsElement = document.getElementById("tabs");
  const editor = document.getElementById("editor");
  let tabs = [];
  let activeId = null;
  let nextTabNumber = 1;

  function loadTabs() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved) && saved.length) {
        tabs = saved
          .filter(tab => tab && typeof tab.id === "string")
          .map(tab => ({
            id: tab.id,
            title: typeof tab.title === "string" ? tab.title : "Untitled",
            content: typeof tab.content === "string" ? tab.content : ""
          }));
      }
    } catch (_) {
      tabs = [];
    }

    if (!tabs.length) {
      tabs = [{ id: "tab-1", title: "Untitled 1", content: "" }];
    }

    nextTabNumber = tabs.reduce((maximum, tab) => {
      const match = tab.id.match(/^tab-(\d+)$/);
      return Math.max(maximum, match ? Number(match[1]) + 1 : 1);
    }, 1);

    const savedActive = localStorage.getItem(activeStorageKey);
    activeId = tabs.some(tab => tab.id === savedActive) ? savedActive : tabs[0].id;
    persistTabs();
  }

  function persistTabs() {
    localStorage.setItem(storageKey, JSON.stringify(tabs));
    localStorage.setItem(activeStorageKey, activeId);
  }

  function activeTab() {
    return tabs.find(tab => tab.id === activeId);
  }

  function renderTabs() {
    tabsElement.replaceChildren();

    tabs.forEach(tabData => {
      const tab = document.createElement("div");
      tab.className = "tab" + (tabData.id === activeId ? " active" : "");
      tab.textContent = tabData.title;
      tab.dataset.id = tabData.id;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-selected", String(tabData.id === activeId));
      tab.addEventListener("click", () => switchTab(tabData.id));
      tabsElement.appendChild(tab);
    });

    const selected = activeTab();
    editor.value = selected ? selected.content : "";
  }

  function switchTab(id) {
    if (!tabs.some(tab => tab.id === id)) return;
    activeId = id;
    persistTabs();
    renderTabs();
    editor.focus();
  }

  function createTab() {
    const number = nextTabNumber++;
    const tab = {
      id: "tab-" + number,
      title: "Untitled " + number,
      content: ""
    };
    tabs.push(tab);
    activeId = tab.id;
    persistTabs();
    renderTabs();
    editor.focus();
    tabsElement.scrollLeft = tabsElement.scrollWidth;
  }

  document.getElementById("new-tab").addEventListener("click", createTab);

  editor.addEventListener("input", () => {
    const selected = activeTab();
    if (!selected) return;
    selected.content = editor.value;
    persistTabs();
  });

  function showWindow(windowElement) {
    windowElement.style.display = "flex";
    windowElement.style.zIndex = String(++topZ);
  }

  document.getElementById("open-files").addEventListener("click", () => {
    showWindow(document.getElementById("files-window"));
  });

  document.getElementById("open-notepad").addEventListener("click", () => {
    showWindow(document.getElementById("notepad-window"));
    editor.focus();
  });

  document.querySelectorAll(".win-close").forEach(button => {
    button.addEventListener("click", event => {
      event.stopPropagation();
      button.closest(".window").style.display = "none";
    });
  });

  document.querySelectorAll(".window").forEach(windowElement => {
    windowElement.addEventListener("mousedown", () => {
      windowElement.style.zIndex = String(++topZ);
    });

    const titlebar = windowElement.querySelector(".titlebar");
    let drag = null;

    titlebar.addEventListener("mousedown", event => {
      if (event.target.closest(".win-close")) return;
      const rect = windowElement.getBoundingClientRect();
      drag = {
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top
      };
      windowElement.style.zIndex = String(++topZ);
      event.preventDefault();
    });

    document.addEventListener("mousemove", event => {
      if (!drag) return;
      const maxLeft = Math.max(0, window.innerWidth - 120);
      const maxTop = Math.max(34, window.innerHeight - 70);
      const left = Math.min(maxLeft, Math.max(0, event.clientX - drag.offsetX));
      const top = Math.min(maxTop, Math.max(34, event.clientY - drag.offsetY));
      windowElement.style.left = left + "px";
      windowElement.style.top = top + "px";
    });

    document.addEventListener("mouseup", () => {
      drag = null;
    });
  });

  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) +
      "  " +
      now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  navigate("/");
  loadTabs();
  renderTabs();
  updateClock();
  setInterval(updateClock, 1000);
})();
</script>
</body>
</html>
