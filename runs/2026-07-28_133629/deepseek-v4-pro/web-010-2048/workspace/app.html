<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --board-bg: #16213e;
            --cell-empty: #252547;
            --cell-2: #eee4da;
            --cell-4: #ede0c8;
            --cell-8: #f2b179;
            --cell-16: #f59563;
            --cell-32: #f67c5f;
            --cell-64: #f65e3b;
            --cell-128: #edcf72;
            --cell-256: #edcc61;
            --cell-512: #edc850;
            --cell-1024: #edc53f;
            --cell-2048: #edc22e;
            --cell-4096: #5e4caf;
            --cell-8192: #3c3a8f;
            --cell-super: #1c1a5e;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
            --text-super: #f9f6f2;
            --radius: 8px;
            --cell-radius: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #edc22e;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(237, 194, 46, 0.4);
        }

        .score-wrapper {
            background: #16213e;
            border-radius: var(--radius);
            padding: 12px 22px;
            min-width: 100px;
        }

        .score-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8899bb;
            margin-bottom: 2px;
        }

        #score {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f9f6f2;
        }

        #reset {
            background: #edc22e;
            color: #1a1a2e;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(237, 194, 46, 0.3);
        }

        #reset:hover {
            background: #f0d04a;
            box-shadow: 0 6px 22px rgba(237, 194, 46, 0.5);
            transform: translateY(-1px);
        }

        #reset:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(237, 194, 46, 0.4);
        }

        .board-wrapper {
            display: inline-block;
            background: #16213e;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 380px;
            height: 380px;
        }

        .cell {
            background: #252547;
            border-radius: var(--cell-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            transition: all 0.12s ease;
            position: relative;
            min-width: 0;
            min-height: 0;
            aspect-ratio: 1;
        }

        .cell[data-value="0"] {
            background: #1e1e3a;
            color: transparent;
        }
        .cell[data-value="2"] {
            background: #eee4da;
            color: #776e65;
        }
        .cell[data-value="4"] {
            background: #ede0c8;
            color: #776e65;
        }
        .cell[data-value="8"] {
            background: #f2b179;
            color: #f9f6f2;
        }
        .cell[data-value="16"] {
            background: #f59563;
            color: #f9f6f2;
        }
        .cell[data-value="32"] {
            background: #f67c5f;
            color: #f9f6f2;
        }
        .cell[data-value="64"] {
            background: #f65e3b;
            color: #f9f6f2;
        }
        .cell[data-value="128"] {
            background: #edcf72;
            color: #f9f6f2;
            font-size: 1.7rem;
        }
        .cell[data-value="256"] {
            background: #edcc61;
            color: #f9f6f2;
            font-size: 1.7rem;
        }
        .cell[data-value="512"] {
            background: #edc850;
            color: #f9f6f2;
            font-size: 1.7rem;
        }
        .cell[data-value="1024"] {
            background: #edc53f;
            color: #f9f6f2;
            font-size: 1.4rem;
        }
        .cell[data-value="2048"] {
            background: #edc22e;
            color: #f9f6f2;
            font-size: 1.4rem;
            box-shadow: 0 0 18px rgba(237, 194, 46, 0.6);
        }
        .cell[data-value="4096"] {
            background: #5e4caf;
            color: #f9f6f2;
            font-size: 1.3rem;
            box-shadow: 0 0 18px rgba(94, 76, 175, 0.6);
        }
        .cell[data-value="8192"] {
            background: #3c3a8f;
            color: #f9f6f2;
            font-size: 1.3rem;
            box-shadow: 0 0 20px rgba(60, 58, 143, 0.6);
        }
        .cell[data-value="16384"],
        .cell[data-value="32768"],
        .cell[data-value="65536"] {
            background: #1c1a5e;
            color: #f9f6f2;
            font-size: 1.1rem;
            box-shadow: 0 0 22px rgba(28, 26, 94, 0.7);
        }

        .cell.pop {
            animation: pop 0.15s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0.7);
            }
            60% {
                transform: scale(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        .game-over-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        .game-over-overlay.visible {
            display: flex;
        }

        .game-over-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: #edc22e;
            text-shadow: 0 0 30px rgba(237, 194, 46, 0.8);
        }

        @media (max-width: 440px) {
            #board {
                width: 90vw;
                height: 90vw;
                gap: 6px;
            }
            .cell {
                font-size: 1.4rem;
                border-radius: 4px;
            }
            .cell[data-value="128"],
            .cell[data-value="256"],
            .cell[data-value="512"] {
                font-size: 1.2rem;
            }
            .cell[data-value="1024"],
            .cell[data-value="2048"] {
                font-size: 1rem;
            }
            .cell[data-value="4096"],
            .cell[data-value="8192"] {
                font-size: 0.9rem;
            }
            .title {
                font-size: 2rem;
            }
            .header {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">2048</div>
            <div class="score-wrapper">
                <div class="score-label">Score</div>
                <div id="score">0</div>
            </div>
            <button id="reset">New Game</button>
        </div>
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
    </div>
    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-text">Game Over</div>
        <button id="resetOverlay" style="background:#edc22e;color:#1a1a2e;border:none;padding:12px 26px;font-size:1rem;font-weight:700;border-radius:30px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;">Try Again</button>
    </div>

    <script>
        (function() {
            // ──────────────────── Internal State ────────────────────
            const SIZE = 4;
            let board = createEmptyBoard();
            let currentScore = 0;
            let gameOverFlag = false;

            function createEmptyBoard() {
                const b = [];
                for (let r = 0; r < SIZE; r++) {
                    b[r] = [0, 0, 0, 0];
                }
                return b;
            }

            function deepCopyBoard(b) {
                return b.map(row => [...row]);
            }

            // ──────────────────── DOM Elements ────────────────────
            const boardEl = document.getElementById('board');
            const scoreEl = document.getElementById('score');
            const resetBtn = document.getElementById('reset');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const resetOverlayBtn = document.getElementById('resetOverlay');

            // Create 16 cell elements
            const cellElements = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.setAttribute('data-row', r);
                    cell.setAttribute('data-col', c);
                    cell.setAttribute('data-value', '0');
                    cell.textContent = '';
                    boardEl.appendChild(cell);
                    cellElements.push(cell);
                }
            }

            // ──────────────────── Rendering ────────────────────
            function render(animateNewCells = false) {
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        const idx = r * SIZE + c;
                        const cell = cellElements[idx];
                        const val = board[r][c];
                        const oldVal = parseInt(cell.getAttribute('data-value'), 10);
                        cell.setAttribute('data-value', val);
                        cell.textContent = val === 0 ? '' : val;
                        if (animateNewCells && val !== 0 && oldVal !== val && oldVal === 0) {
                            cell.classList.remove('pop');
                            void cell.offsetWidth;
                            cell.classList.add('pop');
                        } else if (!animateNewCells) {
                            cell.classList.remove('pop');
                        }
                    }
                }
                scoreEl.textContent = currentScore;
            }

            // ──────────────────── Merge Logic ────────────────────
            function slideRowLeft(row) {
                const nonZero = row.filter(v => v !== 0);
                const result = [];
                const mergedFlags = [];
                let scoreGain = 0;

                for (let i = 0; i < nonZero.length; i++) {
                    const val = nonZero[i];
                    const lastIdx = result.length - 1;
                    if (result.length > 0 && result[lastIdx] === val && !mergedFlags[lastIdx]) {
                        result[lastIdx] = val * 2;
                        mergedFlags[lastIdx] = true;
                        scoreGain += val * 2;
                    } else {
                        result.push(val);
                        mergedFlags.push(false);
                    }
                }

                while (result.length < SIZE) {
                    result.push(0);
                }
                return { row: result, scoreGain };
            }

            function transformForDirection(b, direction) {
                const copy = deepCopyBoard(b);
                if (direction === 'left') {
                    return copy;
                }
                if (direction === 'right') {
                    return copy.map(row => [...row].reverse());
                }
                if (direction === 'up') {
                    const transposed = [];
                    for (let c = 0; c < SIZE; c++) {
                        transposed[c] = [];
                        for (let r = 0; r < SIZE; r++) {
                            transposed[c][r] = copy[r][c];
                        }
                    }
                    return transposed;
                }
                if (direction === 'down') {
                    const transposed = [];
                    for (let c = 0; c < SIZE; c++) {
                        transposed[c] = [];
                        for (let r = SIZE - 1; r >= 0; r--) {
                            transposed[c][SIZE - 1 - r] = copy[r][c];
                        }
                    }
                    return transposed;
                }
                return copy;
            }

            function untransformResult(transformed, originalBoard, direction) {
                if (direction === 'left') {
                    return transformed;
                }
                if (direction === 'right') {
                    return transformed.map(row => [...row].reverse());
                }
                if (direction === 'up') {
                    const result = createEmptyBoard();
                    for (let c = 0; c < SIZE; c++) {
                        for (let r = 0; r < SIZE; r++) {
                            result[r][c] = transformed[c][r];
                        }
                    }
                    return result;
                }
                if (direction === 'down') {
                    const result = createEmptyBoard();
                    for (let c = 0; c < SIZE; c++) {
                        for (let r = 0; r < SIZE; r++) {
                            result[SIZE - 1 - r][c] = transformed[c][r];
                        }
                    }
                    return result;
                }
                return deepCopyBoard(originalBoard);
            }

            function boardsEqual(a, b) {
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (a[r][c] !== b[r][c]) return false;
                    }
                }
                return true;
            }

            // ──────────────────── Spawn ────────────────────
            function getEmptyCells(b) {
                const empties = [];
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (b[r][c] === 0) empties.push({ r, c });
                    }
                }
                return empties;
            }

            function spawnTile(b) {
                const empties = getEmptyCells(b);
                if (empties.length === 0) return false;
                const { r, c } = empties[Math.floor(Math.random() * empties.length)];
                b[r][c] = Math.random() < 0.9 ? 2 : 4;
                return true;
            }

            // ──────────────────── Move ────────────────────
            function move(direction) {
                if (gameOverFlag) return false;
                const transformed = transformForDirection(board, direction);
                let totalScoreGain = 0;
                const newTransformed = [];
                for (let i = 0; i < SIZE; i++) {
                    const { row, scoreGain } = slideRowLeft(transformed[i]);
                    newTransformed.push(row);
                    totalScoreGain += scoreGain;
                }
                const newBoard = untransformResult(newTransformed, board, direction);

                if (boardsEqual(board, newBoard)) {
                    return false;
                }

                board = newBoard;
                currentScore += totalScoreGain;
                spawnTile(board);
                render(true);
                checkGameOver();
                return true;
            }

            function checkGameOver() {
                const empties = getEmptyCells(board);
                if (empties.length > 0) {
                    gameOverFlag = false;
                    gameOverOverlay.classList.remove('visible');
                    return;
                }
                // Check if any adjacent tiles can merge
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        const val = board[r][c];
                        if (c + 1 < SIZE && board[r][c + 1] === val) {
                            gameOverFlag = false;
                            gameOverOverlay.classList.remove('visible');
                            return;
                        }
                        if (r + 1 < SIZE && board[r + 1][c] === val) {
                            gameOverFlag = false;
                            gameOverOverlay.classList.remove('visible');
                            return;
                        }
                    }
                }
                gameOverFlag = true;
                gameOverOverlay.classList.add('visible');
            }

            // ──────────────────── Reset ────────────────────
            function reset() {
                board = createEmptyBoard();
                currentScore = 0;
                gameOverFlag = false;
                gameOverOverlay.classList.remove('visible');
                // Spawn exactly 2 tiles
                spawnTile(board);
                spawnTile(board);
                render(false);
            }

            // ──────────────────── setBoard ────────────────────
            function setBoard(arr) {
                if (!Array.isArray(arr) || arr.length !== SIZE) return;
                for (let r = 0; r < SIZE; r++) {
                    if (!Array.isArray(arr[r]) || arr[r].length !== SIZE) return;
                    for (let c = 0; c < SIZE; c++) {
                        const val = arr[r][c];
                        if (typeof val !== 'number' || !Number.isFinite(val) || val < 0) return;
                        board[r][c] = Math.floor(val);
                    }
                }
                gameOverFlag = false;
                gameOverOverlay.classList.remove('visible');
                render(false);
            }

            // ──────────────────── API ────────────────────
            window.game = {
                size: SIZE,
                reset: function() {
                    reset();
                },
                move: function(direction) {
                    const validDirections = ['left', 'right', 'up', 'down'];
                    if (!validDirections.includes(direction)) return false;
                    return move(direction);
                },
                board: function() {
                    return deepCopyBoard(board);
                },
                setBoard: function(arr) {
                    setBoard(arr);
                },
                score: function() {
                    return currentScore;
                }
            };

            // ──────────────────── Event Listeners ────────────────────
            document.addEventListener('keydown', function(e) {
                const keyMap = {
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'ArrowUp': 'up',
                    'ArrowDown': 'down'
                };
                const direction = keyMap[e.key];
                if (direction) {
                    e.preventDefault();
                    if (!gameOverFlag) {
                        move(direction);
                    }
                }
            });

            resetBtn.addEventListener('click', function() {
                reset();
            });

            resetOverlayBtn.addEventListener('click', function() {
                reset();
            });

            // ──────────────────── Initialize ────────────────────
            reset();
            render(false);
        })();
    </script>
</body>
</html>
