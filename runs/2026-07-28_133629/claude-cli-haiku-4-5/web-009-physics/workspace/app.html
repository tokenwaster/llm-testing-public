<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Physics Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        #sim {
            display: block;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 400px;
            height: 400px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #drop {
            background: #4CAF50;
            color: white;
        }
        
        #drop:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        
        #drop:active {
            transform: translateY(0);
        }
        
        #play {
            background: #2196F3;
            color: white;
        }
        
        #play:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
        
        #play:active {
            transform: translateY(0);
        }
        
        #clear {
            background: #f44336;
            color: white;
        }
        
        #clear:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }
        
        #clear:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="sim" width="400" height="400"></canvas>
        <div class="controls">
            <button id="drop">Drop Ball</button>
            <button id="play">Play</button>
            <button id="clear">Clear</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        const dropBtn = document.getElementById('drop');
        const playBtn = document.getElementById('play');
        const clearBtn = document.getElementById('clear');

        const GRAVITY = 0.5;
        const RESTITUTION = 0.85;
        const DEFAULT_RADIUS = 8;

        let balls = [];
        let isAnimating = false;
        let animationFrameId = null;

        const w = canvas.width;
        const h = canvas.height;

        window.sim = {
            w,
            h,
            balls: () => balls.map(b => ({ ...b })),
            addBall: (x, y, vx = 0, vy = 0, r = DEFAULT_RADIUS) => {
                balls.push({
                    x: Math.max(r, Math.min(x, w - r)),
                    y: Math.max(r, Math.min(y, h - r)),
                    vx,
                    vy,
                    r
                });
                draw();
            },
            clear: () => {
                balls = [];
                draw();
            },
            step: (dt = 1) => {
                balls.forEach(ball => {
                    ball.vy += GRAVITY * dt;
                });

                balls.forEach(ball => {
                    ball.x += ball.vx;
                    ball.y += ball.vy;

                    if (ball.x - ball.r < 0) {
                        ball.x = ball.r;
                        ball.vx = -ball.vx * RESTITUTION;
                    }
                    if (ball.x + ball.r > w) {
                        ball.x = w - ball.r;
                        ball.vx = -ball.vx * RESTITUTION;
                    }

                    if (ball.y - ball.r < 0) {
                        ball.y = ball.r;
                        ball.vy = -ball.vy * RESTITUTION;
                    }
                    if (ball.y + ball.r > h) {
                        ball.y = h - ball.r;
                        ball.vy = -ball.vy * RESTITUTION;
                    }
                });

                draw();
            }
        };

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            balls.forEach(ball => {
                ctx.fillStyle = '#FF6B6B';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#FFB3B3';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(ball.x - ball.r / 3, ball.y - ball.r / 3, ball.r / 4, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function animate() {
            if (isAnimating) {
                window.sim.step(1);
                animationFrameId = requestAnimationFrame(animate);
            }
        }

        dropBtn.addEventListener('click', () => {
            window.sim.addBall(
                Math.random() * (w - 40) + 20,
                Math.random() * (h / 3) + 20,
                (Math.random() - 0.5) * 4,
                Math.random() * 2
            );
        });

        playBtn.addEventListener('click', () => {
            isAnimating = !isAnimating;
            playBtn.textContent = isAnimating ? 'Pause' : 'Play';
            if (isAnimating) {
                animate();
            } else if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });

        clearBtn.addEventListener('click', () => {
            window.sim.clear();
            isAnimating = false;
            playBtn.textContent = 'Play';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            window.sim.addBall(x, y);
        });

        draw();
    </script>
</body>
</html>
