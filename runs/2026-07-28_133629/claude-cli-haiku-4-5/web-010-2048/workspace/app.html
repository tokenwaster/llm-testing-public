<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #f0f0f0;
        }

        #score {
            font-size: 24px;
            margin-bottom: 20px;
            color: #f0f0f0;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            width: 320px;
            height: 320px;
        }

        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            border-radius: 3px;
            background-color: #3a3a3a;
            color: #f0f0f0;
        }

        .tile[data-value="0"] {
            background-color: #2a2a2a;
            color: transparent;
        }

        .tile[data-value="2"],
        .tile[data-value="4"] {
            background-color: #3a3a3a;
        }

        .tile[data-value="8"],
        .tile[data-value="16"] {
            background-color: #5a5a5a;
        }

        .tile[data-value="32"],
        .tile[data-value="64"] {
            background-color: #7a7a7a;
        }

        .tile[data-value="128"],
        .tile[data-value="256"],
        .tile[data-value="512"] {
            background-color: #9a9a9a;
            color: #000;
        }

        .tile[data-value="1024"],
        .tile[data-value="2048"] {
            background-color: #bbbbbb;
            color: #000;
            font-size: 32px;
        }

        #reset {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4a4a4a;
            color: #f0f0f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #reset:hover {
            background-color: #5a5a5a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div id="score">Score: 0</div>
        <div id="board"></div>
        <button id="reset">New Game</button>
    </div>

    <script>
        const GRID_SIZE = 4;
        let board = [];
        let score = 0;

        function initGame() {
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            spawnTile();
            spawnTile();
            render();
        }

        function spawnTile() {
            const emptyCells = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push([i, j]);
                    }
                }
            }
            if (emptyCells.length > 0) {
                const [i, j] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[i][j] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.value = board[i][j];
                    if (board[i][j] !== 0) {
                        tile.textContent = board[i][j];
                    }
                    boardEl.appendChild(tile);
                }
            }
            document.getElementById('score').textContent = 'Score: ' + score;
        }

        function boardsEqual(a, b) {
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if (a[i][j] !== b[i][j]) return false;
                }
            }
            return true;
        }

        function slideRow(row) {
            const newRow = row.filter(val => val !== 0);
            while (newRow.length < GRID_SIZE) {
                newRow.push(0);
            }
            return newRow;
        }

        function mergeRow(row) {
            const merged = row.map(val => val);
            for (let i = 0; i < merged.length - 1; i++) {
                if (merged[i] !== 0 && merged[i] === merged[i + 1]) {
                    merged[i] *= 2;
                    score += merged[i];
                    merged[i + 1] = 0;
                }
            }
            return merged;
        }

        function moveLeft() {
            for (let i = 0; i < GRID_SIZE; i++) {
                let row = board[i].slice();
                row = slideRow(row);
                row = mergeRow(row);
                row = slideRow(row);
                board[i] = row;
            }
        }

        function moveRight() {
            for (let i = 0; i < GRID_SIZE; i++) {
                let row = board[i].slice().reverse();
                row = slideRow(row);
                row = mergeRow(row);
                row = slideRow(row);
                board[i] = row.reverse();
            }
        }

        function moveUp() {
            for (let j = 0; j < GRID_SIZE; j++) {
                let col = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    col.push(board[i][j]);
                }
                col = slideRow(col);
                col = mergeRow(col);
                col = slideRow(col);
                for (let i = 0; i < GRID_SIZE; i++) {
                    board[i][j] = col[i];
                }
            }
        }

        function moveDown() {
            for (let j = 0; j < GRID_SIZE; j++) {
                let col = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    col.push(board[i][j]);
                }
                col = col.reverse();
                col = slideRow(col);
                col = mergeRow(col);
                col = slideRow(col);
                col = col.reverse();
                for (let i = 0; i < GRID_SIZE; i++) {
                    board[i][j] = col[i];
                }
            }
        }

        function move(direction) {
            const oldBoard = board.map(row => [...row]);

            if (direction === 'left') {
                moveLeft();
            } else if (direction === 'right') {
                moveRight();
            } else if (direction === 'up') {
                moveUp();
            } else if (direction === 'down') {
                moveDown();
            }

            const changed = !boardsEqual(oldBoard, board);
            if (changed) {
                spawnTile();
            }
            render();
            return changed;
        }

        document.getElementById('reset').addEventListener('click', () => {
            initGame();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                move('left');
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                move('right');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                move('up');
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                move('down');
            }
        });

        window.game = {
            size: GRID_SIZE,
            reset: () => initGame(),
            move: (direction) => move(direction),
            board: () => board.map(row => [...row]),
            setBoard: (arr) => {
                board = arr.map(row => [...row]);
                render();
            },
            score: () => score,
        };

        initGame();
    </script>
</body>
</html>
