<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball Playground</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --text: #c9d1d9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 0;
    color: var(--text);
  }
  #sim {
    width: 480px;
    height: 480px;
    max-width: 90vw;
    background: radial-gradient(circle at 50% 30%, #1b2230, #0d1117 70%);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    cursor: crosshair;
    display: block;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.05s;
  }
  button:hover {
    background: #21262d;
    border-color: var(--accent);
  }
  button:active { transform: translateY(1px); }
  .hint {
    font-size: 12px;
    color: #6e7681;
  }
</style>
</head>
<body>
  <h1>Bouncing Ball Playground</h1>
  <canvas id="sim" width="480" height="480"></canvas>
  <div class="controls">
    <button id="drop">Drop ball</button>
    <button id="play">Pause</button>
    <button id="clear">Clear</button>
  </div>
  <div class="hint">Click the canvas to add a ball.</div>

<script>
(function () {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const GRAVITY = 0.4;       // downward acceleration per step
  const RESTITUTION = 0.8;   // energy retained on bounce
  const FRICTION = 0.999;    // slight air drag
  const DEFAULT_R = 14;

  let balls = [];
  let running = true;

  const COLORS = ['#58a6ff', '#f778ba', '#3fb950', '#d29922', '#a371f7', '#ff7b72', '#39c5cf'];

  function makeBall(x, y, vx, vy, r) {
    r = (typeof r === 'number' && r > 0) ? r : DEFAULT_R;
    // keep spawn point inside the canvas
    x = Math.min(W - r, Math.max(r, x));
    y = Math.min(H - r, Math.max(r, y));
    return {
      x: x, y: y,
      vx: vx || 0, vy: vy || 0,
      r: r,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    };
  }

  function stepBall(b, dt) {
    // gravity
    b.vy += GRAVITY * dt;

    // integrate
    b.vx *= FRICTION;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // left / right walls
    if (b.x - b.r < 0) {
      b.x = b.r;
      b.vx = -b.vx * RESTITUTION;
    } else if (b.x + b.r > W) {
      b.x = W - b.r;
      b.vx = -b.vx * RESTITUTION;
    }

    // ceiling / floor
    if (b.y - b.r < 0) {
      b.y = b.r;
      b.vy = -b.vy * RESTITUTION;
    } else if (b.y + b.r > H) {
      b.y = H - b.r;
      b.vy = -b.vy * RESTITUTION;
    }
  }

  function step(dt) {
    if (typeof dt !== 'number' || !isFinite(dt) || dt <= 0) dt = 1;
    for (let i = 0; i < balls.length; i++) {
      stepBall(balls[i], dt);
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
      // highlight
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
    }
  }

  function loop() {
    if (running) step(1);
    requestAnimationFrame(loop);
  }

  // ---- Programmatic API ----
  window.sim = {
    w: W,
    h: H,
    balls: function () {
      return balls.map(function (b) {
        return { x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r };
      });
    },
    addBall: function (x, y, vx, vy, r) {
      const b = makeBall(x, y, vx, vy, r);
      balls.push(b);
      draw();
      return b;
    },
    clear: function () {
      balls = [];
      draw();
    },
    step: step
  };

  // ---- UI ----
  document.getElementById('drop').addEventListener('click', function () {
    const x = DEFAULT_R + Math.random() * (W - 2 * DEFAULT_R);
    window.sim.addBall(x, DEFAULT_R + 4, (Math.random() - 0.5) * 6, 0);
  });

  const playBtn = document.getElementById('play');
  playBtn.addEventListener('click', function () {
    running = !running;
    playBtn.textContent = running ? 'Pause' : 'Play';
  });

  document.getElementById('clear').addEventListener('click', function () {
    window.sim.clear();
  });

  canvas.addEventListener('click', function (e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (W / rect.width);
    const y = (e.clientY - rect.top) * (H / rect.height);
    window.sim.addBall(x, y, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
  });

  // seed a ball so the canvas isn't empty
  window.sim.addBall(W / 2, H / 3, 3, 0);

  loop();
})();
</script>
</body>
</html>
