<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu-ish Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Ubuntu", "Segoe UI", system-ui, sans-serif;
    color: #f4f1ee;
    user-select: none;
  }

  /* ---------- Desktop ---------- */
  #desktop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1200px 700px at 75% 15%, #5b2a4a 0%, rgba(91,42,74,0) 60%),
      radial-gradient(1000px 800px at 15% 85%, #7a3b1e 0%, rgba(122,59,30,0) 55%),
      linear-gradient(135deg, #2c001e 0%, #3a0f2a 45%, #401a10 100%);
    overflow: hidden;
  }

  /* Subtle desktop icons area */
  #desktop-icons {
    position: absolute;
    top: 20px; left: 20px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .desk-icon {
    width: 74px; text-align: center; cursor: default; opacity: .9;
  }
  .desk-icon .glyph {
    width: 52px; height: 52px; margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; border-radius: 12px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
  }
  .desk-icon .lbl { font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  /* ---------- Top bar ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 28px;
    background: rgba(20, 8, 16, .85);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 13px; z-index: 5000;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #topbar .activities { font-weight: 600; opacity: .9; }
  #topbar .clock { opacity: .85; }

  /* ---------- Taskbar / dock ---------- */
  #taskbar {
    position: absolute; top: 44px; left: 10px;
    width: 60px;
    background: rgba(20, 8, 16, .78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 10px 6px; z-index: 4000;
    display: flex; flex-direction: column; gap: 12px;
  }
  .launcher {
    width: 48px; height: 48px; border: none; cursor: pointer;
    border-radius: 12px; font-size: 24px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #ff7043, #e64a19);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    transition: transform .08s ease, filter .12s ease;
    position: relative;
  }
  .launcher:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .launcher:active { transform: translateY(0) scale(.96); }
  #open-notepad { background: linear-gradient(160deg, #5c6bc0, #3949ab); }
  .launcher.running::after {
    content: ""; position: absolute; left: -4px; top: 50%;
    transform: translateY(-50%);
    width: 4px; height: 20px; border-radius: 2px; background: #ff7043;
  }
  #open-notepad.running::after { background: #7986cb; }

  /* ---------- Windows ---------- */
  .window {
    position: absolute;
    min-width: 360px; min-height: 240px;
    background: #2b2226;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
  }
  .window.show { display: flex; }

  .titlebar {
    height: 38px; flex: 0 0 38px;
    background: linear-gradient(180deg, #3a2f34, #2f2529);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; cursor: grab;
    border-bottom: 1px solid rgba(0,0,0,.35);
  }
  .titlebar.dragging { cursor: grabbing; }
  .titlebar .title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .win-btns { display: flex; gap: 8px; }
  .win-btn {
    width: 15px; height: 15px; border-radius: 50%; border: none; cursor: pointer;
    padding: 0;
  }
  .win-min { background: #f5c542; }
  .win-close { background: #ff5f57; }
  .win-btn:hover { filter: brightness(1.15); }

  .win-body { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---------- Files app ---------- */
  #files-window { width: 640px; height: 440px; top: 90px; left: 140px; }
  .files-sidebar {
    width: 150px; flex: 0 0 150px; background: #241c20;
    border-right: 1px solid rgba(255,255,255,.06);
    padding: 10px 8px; font-size: 13px; overflow: auto;
  }
  .files-sidebar .sb-title { opacity: .55; font-size: 11px; text-transform: uppercase; margin: 4px 6px 6px; letter-spacing: .5px; }
  .sb-link {
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .sb-link:hover { background: rgba(255,255,255,.07); }
  .files-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .files-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.06);
    background: #2b2226;
  }
  .tool-btn {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10);
    color: #f4f1ee; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  .tool-btn:hover { background: rgba(255,255,255,.15); }
  .tool-btn:disabled { opacity: .4; cursor: default; }
  #files-path {
    flex: 1 1 auto; font-family: "Ubuntu Mono", monospace; font-size: 13px;
    background: #1d1619; border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px; padding: 6px 10px; overflow: auto; white-space: nowrap;
  }
  .files-list {
    flex: 1 1 auto; overflow: auto; padding: 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px; align-content: start;
  }
  .fs-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; border-radius: 8px; cursor: default; text-align: center;
    border: 1px solid transparent;
  }
  .fs-item:hover { background: rgba(255,255,255,.06); }
  .fs-item.selected { background: rgba(255,112,67,.22); border-color: rgba(255,112,67,.5); }
  .fs-item .ic { font-size: 30px; line-height: 1; }
  .fs-item .nm { font-size: 12px; word-break: break-word; max-width: 88px; }
  .files-status {
    flex: 0 0 24px; font-size: 12px; opacity: .6; padding: 3px 12px;
    border-top: 1px solid rgba(255,255,255,.06);
  }

  /* ---------- Notepad app ---------- */
  #notepad-window { width: 560px; height: 420px; top: 130px; left: 340px; }
  .notepad-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #tabs {
    display: flex; align-items: stretch; gap: 4px; padding: 6px 6px 0;
    background: #241c20; overflow-x: auto; min-height: 40px;
  }
  .tab {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; border-radius: 8px 8px 0 0; cursor: pointer;
    background: rgba(255,255,255,.05); font-size: 13px; white-space: nowrap;
    max-width: 180px; border: 1px solid transparent; border-bottom: none;
  }
  .tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
  .tab.active { background: #2b2226; border-color: rgba(255,255,255,.10); }
  .tab .tab-close {
    border: none; background: transparent; color: #ccc; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px; border-radius: 4px;
  }
  .tab .tab-close:hover { background: rgba(255,255,255,.15); color: #fff; }
  #new-tab {
    flex: 0 0 auto; width: 30px; border: none; cursor: pointer;
    background: rgba(255,255,255,.07); color: #fff; font-size: 18px;
    border-radius: 8px 8px 0 0; align-self: stretch;
  }
  #new-tab:hover { background: rgba(255,255,255,.15); }
  #editor {
    flex: 1 1 auto; resize: none; border: none; outline: none;
    background: #221a1e; color: #f4f1ee; padding: 14px;
    font-family: "Ubuntu Mono", ui-monospace, monospace; font-size: 14px;
    line-height: 1.5; min-height: 0;
  }
  .notepad-status {
    flex: 0 0 24px; font-size: 12px; opacity: .6; padding: 3px 12px;
    border-top: 1px solid rgba(255,255,255,.06);
  }
</style>
</head>
<body>
<div id="desktop">

  <div id="topbar">
    <span class="activities">Activities</span>
    <span class="clock" id="clock">—</span>
  </div>

  <div id="desktop-icons">
    <div class="desk-icon" data-app="files">
      <div class="glyph">📁</div><div class="lbl">Files</div>
    </div>
    <div class="desk-icon" data-app="notepad">
      <div class="glyph">📝</div><div class="lbl">Notepad</div>
    </div>
  </div>

  <!-- Dock / taskbar -->
  <div id="taskbar">
    <button id="open-files" class="launcher" title="Files">📁</button>
    <button id="open-notepad" class="launcher" title="Notepad">📝</button>
  </div>

  <!-- Files window -->
  <div id="files-window" class="window">
    <div class="titlebar">
      <span class="title">📁 Files</span>
      <div class="win-btns">
        <button class="win-btn win-min" title="Minimize"></button>
        <button class="win-btn win-close" title="Close"></button>
      </div>
    </div>
    <div class="win-body">
      <div class="files-sidebar">
        <div class="sb-title">Places</div>
        <div class="sb-link" data-go="/">🏠 Root</div>
        <div class="sb-link" data-go="/home/user">👤 Home</div>
        <div class="sb-link" data-go="/home/user/Documents">📄 Documents</div>
        <div class="sb-link" data-go="/home/user/Downloads">⬇️ Downloads</div>
        <div class="sb-link" data-go="/home/user/Pictures">🖼️ Pictures</div>
      </div>
      <div class="files-main">
        <div class="files-toolbar">
          <button id="files-up" class="tool-btn" title="Up">⬆ Up</button>
          <div id="files-path">/</div>
        </div>
        <div class="files-list" id="files-list"></div>
        <div class="files-status" id="files-status"></div>
      </div>
    </div>
  </div>

  <!-- Notepad window -->
  <div id="notepad-window" class="window">
    <div class="titlebar">
      <span class="title">📝 Notepad</span>
      <div class="win-btns">
        <button class="win-btn win-min" title="Minimize"></button>
        <button class="win-btn win-close" title="Close"></button>
      </div>
    </div>
    <div class="win-body">
      <div class="notepad-main">
        <div id="tabs">
          <button id="new-tab" title="New tab">+</button>
        </div>
        <textarea id="editor" placeholder="Start typing…" spellcheck="false"></textarea>
        <div class="notepad-status" id="notepad-status"></div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Fake filesystem (static data)
     ============================================================ */
  // Each node: { name, type: 'dir'|'file', children? }
  const FS = {
    name: "/", type: "dir", children: [
      { name: "bin", type: "dir", children: [
        { name: "bash", type: "file" }, { name: "ls", type: "file" },
        { name: "cat", type: "file" }, { name: "grep", type: "file" },
      ]},
      { name: "etc", type: "dir", children: [
        { name: "hostname", type: "file" }, { name: "passwd", type: "file" },
        { name: "fstab", type: "file" },
        { name: "network", type: "dir", children: [
          { name: "interfaces", type: "file" },
        ]},
      ]},
      { name: "home", type: "dir", children: [
        { name: "user", type: "dir", children: [
          { name: "Documents", type: "dir", children: [
            { name: "resume.pdf", type: "file" },
            { name: "notes.txt", type: "file" },
            { name: "Projects", type: "dir", children: [
              { name: "brassworks", type: "dir", children: [
                { name: "README.md", type: "file" },
              ]},
            ]},
          ]},
          { name: "Downloads", type: "dir", children: [
            { name: "ubuntu-24.04.iso", type: "file" },
            { name: "photo.jpg", type: "file" },
          ]},
          { name: "Pictures", type: "dir", children: [
            { name: "wallpaper.png", type: "file" },
            { name: "screenshot.png", type: "file" },
          ]},
          { name: ".bashrc", type: "file" },
          { name: "todo.txt", type: "file" },
        ]},
      ]},
      { name: "usr", type: "dir", children: [
        { name: "bin", type: "dir", children: [
          { name: "python3", type: "file" }, { name: "node", type: "file" },
        ]},
        { name: "lib", type: "dir", children: [] },
        { name: "share", type: "dir", children: [
          { name: "applications", type: "dir", children: [] },
        ]},
      ]},
      { name: "var", type: "dir", children: [
        { name: "log", type: "dir", children: [
          { name: "syslog", type: "file" }, { name: "auth.log", type: "file" },
        ]},
        { name: "tmp", type: "dir", children: [] },
        { name: "www", type: "dir", children: [
          { name: "index.html", type: "file" },
        ]},
      ]},
    ]
  };

  // Resolve an absolute path string to a node (or null).
  function resolvePath(path) {
    if (path === "/" || path === "") return FS;
    const parts = path.split("/").filter(Boolean);
    let node = FS;
    for (const part of parts) {
      if (node.type !== "dir" || !node.children) return null;
      const next = node.children.find(c => c.name === part);
      if (!next) return null;
      node = next;
    }
    return node;
  }

  function joinPath(path, name) {
    return path === "/" ? "/" + name : path + "/" + name;
  }
  function parentPath(path) {
    if (path === "/" ) return "/";
    const parts = path.split("/").filter(Boolean);
    parts.pop();
    return "/" + parts.join("/");
  }

  const iconFor = (node) => {
    if (node.type === "dir") return "📁";
    const n = node.name.toLowerCase();
    if (n.endsWith(".png") || n.endsWith(".jpg") || n.endsWith(".jpeg") || n.endsWith(".gif")) return "🖼️";
    if (n.endsWith(".pdf")) return "📕";
    if (n.endsWith(".txt") || n.endsWith(".md")) return "📄";
    if (n.endsWith(".iso")) return "💿";
    if (n.endsWith(".log")) return "🧾";
    if (n.startsWith(".")) return "⚙️";
    return "📄";
  };

  /* ============================================================
     Window management (open / close / focus / drag)
     ============================================================ */
  let zTop = 100;
  function focusWindow(win) { win.style.zIndex = String(++zTop); }

  function openWindow(win, launcher) {
    win.classList.add("show");
    focusWindow(win);
    if (launcher) launcher.classList.add("running");
  }
  function closeWindow(win, launcher) {
    win.classList.remove("show");
    if (launcher) launcher.classList.remove("running");
  }

  function makeDraggable(win) {
    const bar = win.querySelector(".titlebar");
    let dragging = false, offX = 0, offY = 0;
    bar.addEventListener("mousedown", (e) => {
      if (e.target.closest(".win-btn")) return;
      dragging = true;
      bar.classList.add("dragging");
      const rect = win.getBoundingClientRect();
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      focusWindow(win);
      e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      let x = e.clientX - offX;
      let y = e.clientY - offY;
      // keep within viewport-ish bounds
      x = Math.max(-win.offsetWidth + 80, Math.min(x, window.innerWidth - 80));
      y = Math.max(28, Math.min(y, window.innerHeight - 40));
      win.style.left = x + "px";
      win.style.top = y + "px";
    });
    document.addEventListener("mouseup", () => {
      dragging = false; bar.classList.remove("dragging");
    });
    win.addEventListener("mousedown", () => focusWindow(win));
  }

  const filesWindow = document.getElementById("files-window");
  const notepadWindow = document.getElementById("notepad-window");
  const openFilesBtn = document.getElementById("open-files");
  const openNotepadBtn = document.getElementById("open-notepad");

  makeDraggable(filesWindow);
  makeDraggable(notepadWindow);

  openFilesBtn.addEventListener("click", () => openWindow(filesWindow, openFilesBtn));
  openNotepadBtn.addEventListener("click", () => openWindow(notepadWindow, openNotepadBtn));

  // Desktop icons also launch
  document.querySelectorAll(".desk-icon").forEach(ic => {
    ic.addEventListener("dblclick", () => {
      if (ic.dataset.app === "files") openWindow(filesWindow, openFilesBtn);
      else openWindow(notepadWindow, openNotepadBtn);
    });
  });

  // Close buttons
  filesWindow.querySelector(".win-close").addEventListener("click",
    () => closeWindow(filesWindow, openFilesBtn));
  notepadWindow.querySelector(".win-close").addEventListener("click",
    () => closeWindow(notepadWindow, openNotepadBtn));
  // Minimize == just hide (keeps state)
  filesWindow.querySelector(".win-min").addEventListener("click",
    () => closeWindow(filesWindow, openFilesBtn));
  notepadWindow.querySelector(".win-min").addEventListener("click",
    () => closeWindow(notepadWindow, openNotepadBtn));

  /* ============================================================
     Files app logic
     ============================================================ */
  const filesPathEl = document.getElementById("files-path");
  const filesListEl = document.getElementById("files-list");
  const filesUpBtn = document.getElementById("files-up");
  const filesStatusEl = document.getElementById("files-status");
  let currentPath = "/";

  function renderFiles(path) {
    const node = resolvePath(path);
    if (!node || node.type !== "dir") return;
    currentPath = path;
    filesPathEl.textContent = path;
    filesUpBtn.disabled = (path === "/");

    filesListEl.innerHTML = "";
    const children = (node.children || []).slice().sort((a, b) => {
      if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
      return a.name.localeCompare(b.name);
    });

    for (const child of children) {
      const item = document.createElement("div");
      item.className = "fs-item";
      item.dataset.type = child.type;
      item.dataset.name = child.name;

      const ic = document.createElement("div");
      ic.className = "ic";
      ic.textContent = iconFor(child);

      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = child.name;

      item.appendChild(ic);
      item.appendChild(nm);

      item.addEventListener("click", () => {
        filesListEl.querySelectorAll(".fs-item.selected")
          .forEach(el => el.classList.remove("selected"));
        item.classList.add("selected");
      });
      item.addEventListener("dblclick", () => {
        if (child.type === "dir") {
          renderFiles(joinPath(path, child.name));
        } else {
          filesStatusEl.textContent = 'Cannot open "' + child.name + '" — no application associated.';
        }
      });

      filesListEl.appendChild(item);
    }

    const dirs = children.filter(c => c.type === "dir").length;
    const files = children.filter(c => c.type === "file").length;
    filesStatusEl.textContent = dirs + " folder" + (dirs === 1 ? "" : "s") +
      ", " + files + " file" + (files === 1 ? "" : "s");
  }

  filesUpBtn.addEventListener("click", () => {
    if (currentPath !== "/") renderFiles(parentPath(currentPath));
  });

  document.querySelectorAll(".sb-link").forEach(link => {
    link.addEventListener("click", () => {
      const dest = link.dataset.go;
      if (resolvePath(dest)) renderFiles(dest);
    });
  });

  renderFiles("/");

  /* ============================================================
     Notepad app logic (persistent, tabbed)
     ============================================================ */
  const STORAGE_KEY = "ubuntu_notepad_state_v1";
  const tabsEl = document.getElementById("tabs");
  const newTabBtn = document.getElementById("new-tab");
  const editorEl = document.getElementById("editor");
  const notepadStatusEl = document.getElementById("notepad-status");

  let state = { tabs: [], activeId: null, seq: 1 };

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.tabs)) state = parsed;
      }
    } catch (e) { /* corrupt storage — fall through to defaults */ }

    if (!state.tabs || state.tabs.length === 0) {
      state = { tabs: [], activeId: null, seq: 1 };
      createTab("Welcome",
        "Welcome to Notepad!\n\nYour tabs and text are saved automatically to " +
        "localStorage, so they'll still be here after you close this window or " +
        "reload the page.\n\nClick + to add a tab.");
    }
    if (!state.tabs.some(t => t.id === state.activeId)) {
      state.activeId = state.tabs[0].id;
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage full/unavailable — ignore */ }
  }

  function createTab(name, content) {
    const id = "t" + (state.seq++);
    const tab = { id: id, name: name || ("Untitled " + (state.tabs.length + 1)), content: content || "" };
    state.tabs.push(tab);
    state.activeId = id;
    saveState();
    return tab;
  }

  function activeTab() {
    return state.tabs.find(t => t.id === state.activeId) || null;
  }

  function renderTabs() {
    // remove existing tab elements (keep the + button)
    tabsEl.querySelectorAll(".tab").forEach(el => el.remove());

    state.tabs.forEach(tab => {
      const el = document.createElement("div");
      el.className = "tab" + (tab.id === state.activeId ? " active" : "");
      el.dataset.id = tab.id;

      const nameEl = document.createElement("span");
      nameEl.className = "tab-name";
      nameEl.textContent = tab.name;

      const closeBtn = document.createElement("button");
      closeBtn.className = "tab-close";
      closeBtn.textContent = "×";
      closeBtn.title = "Close tab";
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeTab(tab.id);
      });

      el.appendChild(nameEl);
      el.appendChild(closeBtn);
      el.addEventListener("click", () => setActive(tab.id));

      tabsEl.insertBefore(el, newTabBtn);
    });
  }

  function renderEditor() {
    const tab = activeTab();
    if (tab) {
      editorEl.disabled = false;
      editorEl.value = tab.content;
      notepadStatusEl.textContent = tab.content.length + " chars · " +
        (tab.content ? tab.content.split(/\n/).length : 0) + " lines";
    } else {
      editorEl.value = "";
      editorEl.disabled = true;
      notepadStatusEl.textContent = "No tabs open";
    }
  }

  function renderNotepad() { renderTabs(); renderEditor(); }

  function setActive(id) {
    state.activeId = id;
    saveState();
    renderNotepad();
  }

  function closeTab(id) {
    const idx = state.tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    state.tabs.splice(idx, 1);
    if (state.activeId === id) {
      const fallback = state.tabs[idx] || state.tabs[idx - 1] || state.tabs[0];
      state.activeId = fallback ? fallback.id : null;
    }
    if (state.tabs.length === 0) {
      createTab("Untitled 1", "");
    }
    saveState();
    renderNotepad();
  }

  newTabBtn.addEventListener("click", () => {
    createTab("Untitled " + (state.tabs.length + 1), "");
    renderNotepad();
    editorEl.focus();
  });

  editorEl.addEventListener("input", () => {
    const tab = activeTab();
    if (!tab) return;
    tab.content = editorEl.value;
    // Derive a friendly tab name from the first non-empty line for untitled tabs.
    if (/^Untitled /.test(tab.name)) {
      const firstLine = editorEl.value.split(/\n/)[0].trim();
      if (firstLine) tab.name = firstLine.slice(0, 20);
    }
    notepadStatusEl.textContent = editorEl.value.length + " chars · " +
      (editorEl.value ? editorEl.value.split(/\n/).length : 0) + " lines";
    renderTabsNameOnly();
    saveState();
  });

  // Lightweight tab-name refresh without rebuilding the whole strip on each keystroke.
  function renderTabsNameOnly() {
    tabsEl.querySelectorAll(".tab").forEach(el => {
      const tab = state.tabs.find(t => t.id === el.dataset.id);
      if (tab) {
        const nameEl = el.querySelector(".tab-name");
        if (nameEl && nameEl.textContent !== tab.name) nameEl.textContent = tab.name;
      }
    });
  }

  loadState();
  renderNotepad();

  // Sync across other tabs/windows of the same page.
  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY) { loadState(); renderNotepad(); }
  });

  /* ============================================================
     Clock
     ============================================================ */
  const clockEl = document.getElementById("clock");
  function tickClock() {
    const d = new Date();
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const mm = String(d.getMinutes()).padStart(2, "0");
    let h = d.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    clockEl.textContent = days[d.getDay()] + "  " + h + ":" + mm + " " + ap;
  }
  tickClock();
  setInterval(tickClock, 15000);
})();
</script>
</body>
</html>
