<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --accent: #58a6ff;
    --bar: #388bfd;
    --bar-active: #f778ba;
    --bar-sorted: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 20px 24px 12px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) {
    background: #21262d;
    border-color: var(--accent);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #sort {
    border-color: var(--accent);
    color: var(--accent);
  }
  main {
    flex: 1;
    padding: 16px 24px 28px;
    display: flex;
  }
  #bars {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-height: 300px;
  }
  .bar {
    flex: 1;
    background: var(--bar);
    border-radius: 2px 2px 0 0;
    min-width: 2px;
    transition: height 0.06s linear;
  }
  .bar.active { background: var(--bar-active); }
  .bar.sorted { background: var(--bar-sorted); }
</style>
</head>
<body>
<header>
  <h1>Sorting Algorithm Visualizer</h1>
  <div class="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>
</header>
<main>
  <div id="bars"></div>
</main>

<script>
(function () {
  "use strict";

  const N = 40;
  const MAX_VAL = 100;
  const barsEl = document.getElementById("bars");

  let array = [];
  let initial = [];

  // Insertion-sort state, driven one step at a time.
  let i = 1;
  let j = 0;
  let key = 0;
  let phase = "start"; // "start" | "compare" | "done"

  function randomArray() {
    const a = [];
    for (let k = 0; k < N; k++) {
      a.push(1 + Math.floor(Math.random() * MAX_VAL));
    }
    return a;
  }

  function resetSortState() {
    i = 1;
    j = 0;
    key = 0;
    phase = array.length <= 1 ? "done" : "start";
  }

  function render(activeIdx) {
    barsEl.innerHTML = "";
    const max = Math.max(1, ...array);
    const done = phase === "done";
    for (let k = 0; k < array.length; k++) {
      const bar = document.createElement("div");
      bar.className = "bar";
      if (done) bar.classList.add("sorted");
      else if (k === activeIdx) bar.classList.add("active");
      bar.style.height = (array[k] / max * 100) + "%";
      barsEl.appendChild(bar);
    }
  }

  function isSorted() {
    for (let k = 1; k < array.length; k++) {
      if (array[k - 1] > array[k]) return false;
    }
    return true;
  }

  // Perform exactly one step of insertion sort.
  // Returns true when the array is fully sorted.
  function sortStep() {
    if (phase === "done") return true;

    if (phase === "start") {
      if (i >= array.length) {
        phase = "done";
        return true;
      }
      key = array[i];
      j = i - 1;
      phase = "compare";
      return false;
    }

    // phase === "compare": one comparison / shift per call.
    if (j >= 0 && array[j] > key) {
      array[j + 1] = array[j];
      j--;
    } else {
      array[j + 1] = key;
      i++;
      phase = "start";
      if (i >= array.length) {
        phase = "done";
        return true;
      }
    }
    return false;
  }

  function setArray(a) {
    array = a.slice();
    initial = a.slice();
    resetSortState();
    render();
  }

  // --- UI controls ---

  let animating = false;
  const sortBtn = document.getElementById("sort");
  const shuffleBtn = document.getElementById("shuffle");
  const resetBtn = document.getElementById("reset");

  function setControls(disabled) {
    shuffleBtn.disabled = disabled;
    resetBtn.disabled = disabled;
    sortBtn.disabled = disabled;
  }

  function animate() {
    if (animating) return;
    animating = true;
    setControls(true);
    function tick() {
      const done = sortStep();
      render(phase === "compare" ? j + 1 : -1);
      if (done) {
        animating = false;
        setControls(false);
        render();
        return;
      }
      setTimeout(tick, 20);
    }
    tick();
  }

  sortBtn.addEventListener("click", animate);

  shuffleBtn.addEventListener("click", function () {
    if (animating) return;
    setArray(randomArray());
  });

  resetBtn.addEventListener("click", function () {
    if (animating) return;
    array = initial.slice();
    resetSortState();
    render();
  });

  // --- Programmatic API for grading ---
  window.viz = {
    array: function () { return array.slice(); },
    setArray: function (a) { setArray(a); },
    sortStep: function () { return sortStep(); },
    sorted: function () { return isSorted(); }
  };

  // Initial state
  setArray(randomArray());
})();
</script>
</body>
</html>
