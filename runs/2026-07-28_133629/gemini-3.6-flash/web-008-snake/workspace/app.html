<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .score-board {
      font-size: 1.25rem;
      font-weight: 600;
      background: #0f172a;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-label {
      color: #94a3b8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #score {
      color: #facc15;
      font-weight: 700;
    }

    canvas#snake {
      width: 400px;
      height: 400px;
      background-color: #020617;
      border-radius: 8px;
      border: 2px solid #334155;
      display: block;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.6);
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #start {
      background-color: #10b981;
    }
    #start:hover {
      background-color: #059669;
    }

    #pause {
      background-color: #f59e0b;
    }
    #pause:hover {
      background-color: #d97706;
    }

    #reset {
      background-color: #ef4444;
    }
    #reset:hover {
      background-color: #dc2626;
    }

    button:active {
      transform: translateY(1px);
    }

    .instructions {
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <h1>Snake</h1>
      <div class="score-board">
        <span class="score-label">Score</span>
        <span id="score">0</span>
      </div>
    </div>

    <canvas id="snake" width="400" height="400"></canvas>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <div class="instructions">
      Use Arrow Keys to Steer
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('snake');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');

      const GRID_SIZE = 20;
      const BOARD_W = 20;
      const BOARD_H = 20;

      let snakeBody = [];
      let foodPos = [0, 0];
      let dir = 'right';
      let nextDir = 'right';
      let isAlive = true;
      let currentScore = 0;
      let timer = null;

      const DIRS = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      const OPPOSITES = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      function updateScoreDisplay() {
        scoreEl.textContent = currentScore;
      }

      function spawnFood() {
        const emptyCells = [];
        for (let x = 0; x < BOARD_W; x++) {
          for (let y = 0; y < BOARD_H; y++) {
            if (!snakeBody.some(s => s[0] === x && s[1] === y)) {
              emptyCells.push([x, y]);
            }
          }
        }
        if (emptyCells.length > 0) {
          const randomIndex = Math.floor(Math.random() * emptyCells.length);
          foodPos = emptyCells[randomIndex];
        }
      }

      function draw() {
        const cellW = canvas.width / BOARD_W;
        const cellH = canvas.height / BOARD_H;

        // Clear canvas
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw grid background lines
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        for (let i = 0; i <= BOARD_W; i++) {
          ctx.beginPath();
          ctx.moveTo(i * cellW, 0);
          ctx.lineTo(i * cellW, canvas.height);
          ctx.stroke();
        }
        for (let j = 0; j <= BOARD_H; j++) {
          ctx.beginPath();
          ctx.moveTo(0, j * cellH);
          ctx.lineTo(canvas.width, j * cellH);
          ctx.stroke();
        }

        // Draw Food
        const fx = foodPos[0] * cellW + cellW / 2;
        const fy = foodPos[1] * cellH + cellH / 2;
        const radius = cellW / 2 - 2;

        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(fx, fy, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(fx - radius / 3, fy - radius / 3, radius / 3, 0, Math.PI * 2);
        ctx.fill();

        // Draw Snake
        snakeBody.forEach((seg, index) => {
          const sx = seg[0] * cellW;
          const sy = seg[1] * cellH;
          const padding = 1;

          if (index === 0) {
            // Head
            ctx.fillStyle = isAlive ? '#34d399' : '#f87171';
            ctx.beginPath();
            ctx.roundRect(sx + padding, sy + padding, cellW - padding * 2, cellH - padding * 2, 6);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#020617';
            const eyeSize = 2;
            let e1x = sx + cellW / 2, e1y = sy + cellH / 2;
            let e2x = sx + cellW / 2, e2y = sy + cellH / 2;

            if (dir === 'right') {
              e1x = sx + cellW * 0.75; e1y = sy + cellH * 0.3;
              e2x = sx + cellW * 0.75; e2y = sy + cellH * 0.7;
            } else if (dir === 'left') {
              e1x = sx + cellW * 0.25; e1y = sy + cellH * 0.3;
              e2x = sx + cellW * 0.25; e2y = sy + cellH * 0.7;
            } else if (dir === 'up') {
              e1x = sx + cellW * 0.3; e1y = sy + cellH * 0.25;
              e2x = sx + cellW * 0.7; e2y = sy + cellH * 0.25;
            } else if (dir === 'down') {
              e1x = sx + cellW * 0.3; e1y = sy + cellH * 0.75;
              e2x = sx + cellW * 0.7; e2y = sy + cellH * 0.75;
            }

            ctx.beginPath();
            ctx.arc(e1x, e1y, eyeSize, 0, Math.PI * 2);
            ctx.arc(e2x, e2y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Body
            ctx.fillStyle = isAlive ? '#10b981' : '#ef4444';
            ctx.beginPath();
            ctx.roundRect(sx + padding, sy + padding, cellW - padding * 2, cellH - padding * 2, 4);
            ctx.fill();
          }
        });

        // Game over overlay
        if (!isAlive) {
          ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);

          ctx.fillStyle = '#94a3b8';
          ctx.font = '14px sans-serif';
          ctx.fillText('Press Reset to play again', canvas.width / 2, canvas.height / 2 + 20);
        }
      }

      function resetGame() {
        snakeBody = [
          [5, 10],
          [4, 10],
          [3, 10]
        ];
        dir = 'right';
        nextDir = 'right';
        isAlive = true;
        currentScore = 0;
        updateScoreDisplay();
        spawnFood();
        draw();
      }

      function tickGame() {
        if (!isAlive) return;

        dir = nextDir;
        const d = DIRS[dir];
        const head = snakeBody[0];
        const newHead = [head[0] + d[0], head[1] + d[1]];

        // Check wall collision
        if (newHead[0] < 0 || newHead[0] >= BOARD_W || newHead[1] < 0 || newHead[1] >= BOARD_H) {
          isAlive = false;
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
          draw();
          return;
        }

        const willEat = (newHead[0] === foodPos[0] && newHead[1] === foodPos[1]);

        // Check body collision
        const segmentsToCheck = willEat ? snakeBody : snakeBody.slice(0, snakeBody.length - 1);
        if (segmentsToCheck.some(seg => seg[0] === newHead[0] && seg[1] === newHead[1])) {
          isAlive = false;
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
          draw();
          return;
        }

        // Move head
        snakeBody.unshift(newHead);

        if (willEat) {
          currentScore += 1;
          updateScoreDisplay();
          spawnFood();
        } else {
          snakeBody.pop();
        }

        draw();
      }

      function setDirection(newD) {
        if (OPPOSITES[newD] && newD !== OPPOSITES[dir]) {
          nextDir = newD;
        }
      }

      function startAuto() {
        if (timer) return;
        if (!isAlive) {
          resetGame();
        }
        timer = setInterval(() => {
          tickGame();
        }, 130);
      }

      function pauseAuto() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      // Define public API required for grading
      window.game = {
        w: BOARD_W,
        h: BOARD_H,
        reset: function() {
          resetGame();
        },
        tick: function() {
          tickGame();
        },
        setDir: function(d) {
          setDirection(d);
        },
        setFood: function(x, y) {
          foodPos = [x, y];
          draw();
        },
        snake: function() {
          return snakeBody.map(pt => [pt[0], pt[1]]);
        },
        food: function() {
          return [foodPos[0], foodPos[1]];
        },
        alive: function() {
          return isAlive;
        },
        score: function() {
          return currentScore;
        }
      };

      // Event Listeners
      document.getElementById('start').addEventListener('click', startAuto);
      document.getElementById('pause').addEventListener('click', pauseAuto);
      document.getElementById('reset').addEventListener('click', () => {
        pauseAuto();
        resetGame();
      });

      window.addEventListener('keydown', (e) => {
        const keyMap = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right',
          KeyW: 'up',
          KeyS: 'down',
          KeyA: 'left',
          KeyD: 'right'
        };

        const targetDir = keyMap[e.code] || keyMap[e.key];
        if (targetDir) {
          if (e.key.startsWith('Arrow')) {
            e.preventDefault();
          }
          setDirection(targetDir);
        }
      });

      // Initial setup
      resetGame();
    })();
  </script>
</body>
</html>
