<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falling Sand Sandbox</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --panel-bg: #1a1d28;
      --panel-border: #2a2e3d;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      
      --sand-color: #f59e0b;
      --water-color: #3b82f6;
      --wall-color: #64748b;
      --acid-color: #10b981;
      --eraser-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 100%;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f8fafc;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .canvas-container {
      position: relative;
      background: #000;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--panel-border);
    }

    #sand {
      display: block;
      width: 500px;
      height: 500px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      border-radius: 4px;
      background-color: #121318;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      background: var(--panel-bg);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      max-width: 520px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #262a38;
      color: var(--text-color);
      border: 1px solid transparent;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }

    .btn:hover {
      background: #32374a;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    #mat-sand .dot { background-color: var(--sand-color); }
    #mat-water .dot { background-color: var(--water-color); }
    #mat-wall .dot { background-color: var(--wall-color); }
    #mat-acid .dot { background-color: var(--acid-color); }
    #mat-empty .dot { background-color: var(--eraser-color); }

    #mat-sand.active { background-color: rgba(245, 158, 11, 0.2); border-color: var(--sand-color); color: #fbbf24; }
    #mat-water.active { background-color: rgba(59, 130, 246, 0.2); border-color: var(--water-color); color: #60a5fa; }
    #mat-wall.active { background-color: rgba(100, 116, 139, 0.2); border-color: var(--wall-color); color: #94a3b8; }
    #mat-acid.active { background-color: rgba(16, 185, 129, 0.2); border-color: var(--acid-color); color: #34d399; }
    #mat-empty.active { background-color: rgba(239, 68, 68, 0.2); border-color: var(--eraser-color); color: #f87171; }

    .divider {
      width: 1px;
      background-color: var(--panel-border);
      margin: 0 4px;
    }

    #clear {
      background-color: #3f1d24;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    #clear:hover {
      background-color: #50222c;
      border-color: #991b1b;
    }

    .controls-secondary {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .size-picker {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .size-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: #262a38;
      border: 1px solid transparent;
      color: var(--text-color);
      cursor: pointer;
      font-size: 0.75rem;
    }

    .size-btn.active {
      background: var(--primary);
      color: white;
    }

    .btn-action {
      background: #262a38;
      border: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sand Box</h1>
      <div class="subtitle">Cellular Automata Simulator</div>
    </header>

    <div class="canvas-container">
      <canvas id="sand" width="100" height="100"></canvas>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button id="mat-sand" class="btn active"><span class="dot"></span>Sand</button>
        <button id="mat-water" class="btn"><span class="dot"></span>Water</button>
        <button id="mat-wall" class="btn"><span class="dot"></span>Wall</button>
        <button id="mat-acid" class="btn"><span class="dot"></span>Acid</button>
        <button id="mat-empty" class="btn"><span class="dot"></span>Eraser</button>
      </div>

      <div class="divider"></div>

      <div class="btn-group">
        <button id="clear" class="btn">Clear</button>
      </div>
    </div>

    <div class="controls-secondary">
      <button id="btn-pause" class="btn btn-action" style="padding: 4px 10px; font-size: 0.75rem;">Pause</button>
      <div class="size-picker">
        <span>Brush:</span>
        <button class="size-btn" data-size="1">S</button>
        <button class="size-btn active" data-size="2">M</button>
        <button class="size-btn" data-size="4">L</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const W = 100;
      const H = 100;

      const EMPTY = 0;
      const SAND = 1;
      const WATER = 2;
      const WALL = 3;
      const ACID = 4;

      const MAT_NAMES = ['empty', 'sand', 'water', 'wall', 'acid'];
      const MAT_IDS = {
        'empty': EMPTY,
        'sand': SAND,
        'water': WATER,
        'wall': WALL,
        'acid': ACID
      };

      const grid = new Uint8Array(W * H);
      const lastUpdated = new Int32Array(W * H);
      const noise = new Uint8Array(W * H);
      
      for (let i = 0; i < W * H; i++) {
        noise[i] = Math.floor(Math.random() * 20);
      }

      let stepCounter = 1;
      let isPaused = false;
      let brushRadius = 2;
      let currentMaterial = 'sand';

      const canvas = document.getElementById('sand');
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(W, H);

      // Liquid Displacement Logic to prevent anti-gravity transport
      function displaceLiquid(sandX, sandY, liquidIdx, liquidMat) {
        const liquidY = sandY + 1;
        const offsetsX = Math.random() < 0.5 ? [1, -1, 2, -2, 3, -3, 4, -4] : [-1, 1, -2, 2, -3, 3, -4, 4];
        const offsetsY = [0, -1, 1, -2];

        for (let dy of offsetsY) {
          const ey = liquidY + dy;
          if (ey < 0 || ey >= H) continue;
          for (let dx of offsetsX) {
            const ex = sandX + dx;
            if (ex >= 0 && ex < W) {
              const eIdx = ey * W + ex;
              if (grid[eIdx] === EMPTY) {
                grid[eIdx] = liquidMat;
                lastUpdated[eIdx] = stepCounter;

                grid[liquidIdx] = SAND;
                lastUpdated[liquidIdx] = stepCounter;

                grid[sandY * W + sandX] = EMPTY;
                return true;
              }
            }
          }
        }

        const hasSandAbove = (sandY > 0 && grid[(sandY - 1) * W + sandX] === SAND);
        if (!hasSandAbove) {
          grid[liquidIdx] = SAND;
          lastUpdated[liquidIdx] = stepCounter;

          grid[sandY * W + sandX] = liquidMat;
          lastUpdated[sandY * W + sandX] = stepCounter;
          return true;
        }

        return false;
      }

      function displaceLiquidDiag(sandX, sandY, diagX, diagY, diagIdx, liquidMat) {
        const offsetsX = Math.random() < 0.5 ? [1, -1, 2, -2, 3, -3] : [-1, 1, -2, 2, -3, 3];
        const offsetsY = [0, -1, 1];

        for (let dy of offsetsY) {
          const ey = diagY + dy;
          if (ey < 0 || ey >= H) continue;
          for (let dx of offsetsX) {
            const ex = diagX + dx;
            if (ex >= 0 && ex < W) {
              const eIdx = ey * W + ex;
              if (grid[eIdx] === EMPTY) {
                grid[eIdx] = liquidMat;
                lastUpdated[eIdx] = stepCounter;

                grid[diagIdx] = SAND;
                lastUpdated[diagIdx] = stepCounter;

                grid[sandY * W + sandX] = EMPTY;
                return true;
              }
            }
          }
        }

        const hasSandAbove = (sandY > 0 && grid[(sandY - 1) * W + sandX] === SAND);
        if (!hasSandAbove) {
          grid[diagIdx] = SAND;
          lastUpdated[diagIdx] = stepCounter;

          grid[sandY * W + sandX] = liquidMat;
          lastUpdated[sandY * W + sandX] = stepCounter;
          return true;
        }

        return false;
      }

      function updateSand(x, y, idx) {
        const belowY = y + 1;
        if (belowY >= H) return;

        const belowIdx = belowY * W + x;
        const matBelow = grid[belowIdx];

        if (matBelow === EMPTY) {
          grid[belowIdx] = SAND;
          grid[idx] = EMPTY;
          lastUpdated[belowIdx] = stepCounter;
          return;
        }

        if (matBelow === WATER || matBelow === ACID) {
          if (displaceLiquid(x, y, belowIdx, matBelow)) {
            return;
          }
        }

        const dir = Math.random() < 0.5 ? 1 : -1;
        const dirs = [dir, -dir];

        for (let d of dirs) {
          const nx = x + d;
          if (nx >= 0 && nx < W) {
            const diagIdx = belowY * W + nx;
            const diagMat = grid[diagIdx];
            if (diagMat === EMPTY) {
              grid[diagIdx] = SAND;
              grid[idx] = EMPTY;
              lastUpdated[diagIdx] = stepCounter;
              return;
            } else if (diagMat === WATER || diagMat === ACID) {
              if (displaceLiquidDiag(x, y, nx, belowY, diagIdx, diagMat)) {
                return;
              }
            }
          }
        }
      }

      function updateWater(x, y, idx) {
        const belowY = y + 1;

        if (belowY < H) {
          const belowIdx = belowY * W + x;
          if (grid[belowIdx] === EMPTY) {
            grid[belowIdx] = WATER;
            grid[idx] = EMPTY;
            lastUpdated[belowIdx] = stepCounter;
            return;
          }
        }

        if (belowY < H) {
          const dir = Math.random() < 0.5 ? 1 : -1;
          const dirs = [dir, -dir];
          for (let d of dirs) {
            const nx = x + d;
            if (nx >= 0 && nx < W) {
              const diagIdx = belowY * W + nx;
              if (grid[diagIdx] === EMPTY) {
                grid[diagIdx] = WATER;
                grid[idx] = EMPTY;
                lastUpdated[diagIdx] = stepCounter;
                return;
              }
            }
          }
        }

        const dir = Math.random() < 0.5 ? 1 : -1;
        const dirs = [dir, -dir];
        for (let d of dirs) {
          const nx = x + d;
          if (nx >= 0 && nx < W) {
            const sideIdx = y * W + nx;
            if (grid[sideIdx] === EMPTY) {
              grid[sideIdx] = WATER;
              grid[idx] = EMPTY;
              lastUpdated[sideIdx] = stepCounter;
              return;
            }
          }
        }
      }

      function updateAcid(x, y, idx) {
        const neighbors = [
          { x: x, y: y + 1 },
          { x: x - 1, y: y },
          { x: x + 1, y: y },
          { x: x, y: y - 1 }
        ];

        for (let i = neighbors.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = neighbors[i];
          neighbors[i] = neighbors[j];
          neighbors[j] = temp;
        }

        for (let n of neighbors) {
          if (n.x >= 0 && n.x < W && n.y >= 0 && n.y < H) {
            const nIdx = n.y * W + n.x;
            const nMat = grid[nIdx];
            if (nMat === SAND || nMat === WALL) {
              grid[nIdx] = EMPTY;
              grid[idx] = EMPTY;
              lastUpdated[nIdx] = stepCounter;
              return;
            }
          }
        }

        const belowY = y + 1;

        if (belowY < H) {
          const belowIdx = belowY * W + x;
          if (grid[belowIdx] === EMPTY) {
            grid[belowIdx] = ACID;
            grid[idx] = EMPTY;
            lastUpdated[belowIdx] = stepCounter;
            return;
          }
        }

        if (belowY < H) {
          const dir = Math.random() < 0.5 ? 1 : -1;
          const dirs = [dir, -dir];
          for (let d of dirs) {
            const nx = x + d;
            if (nx >= 0 && nx < W) {
              const diagIdx = belowY * W + nx;
              if (grid[diagIdx] === EMPTY) {
                grid[diagIdx] = ACID;
                grid[idx] = EMPTY;
                lastUpdated[diagIdx] = stepCounter;
                return;
              }
            }
          }
        }

        const dir = Math.random() < 0.5 ? 1 : -1;
        const dirs = [dir, -dir];
        for (let d of dirs) {
          const nx = x + d;
          if (nx >= 0 && nx < W) {
            const sideIdx = y * W + nx;
            if (grid[sideIdx] === EMPTY) {
              grid[sideIdx] = ACID;
              grid[idx] = EMPTY;
              lastUpdated[sideIdx] = stepCounter;
              return;
            }
          }
        }
      }

      function step() {
        stepCounter++;

        for (let y = H - 1; y >= 0; y--) {
          const xLeftToRight = Math.random() < 0.5;
          const startX = xLeftToRight ? 0 : W - 1;
          const endX = xLeftToRight ? W : -1;
          const stepX = xLeftToRight ? 1 : -1;

          for (let x = startX; x !== endX; x += stepX) {
            const idx = y * W + x;
            if (lastUpdated[idx] === stepCounter) continue;

            const mat = grid[idx];
            if (mat === EMPTY || mat === WALL) continue;

            if (mat === SAND) {
              updateSand(x, y, idx);
            } else if (mat === WATER) {
              updateWater(x, y, idx);
            } else if (mat === ACID) {
              updateAcid(x, y, idx);
            }
          }
        }
      }

      function render() {
        const data = imgData.data;
        let ptr = 0;

        for (let i = 0; i < W * H; i++) {
          const mat = grid[i];
          const n = noise[i];

          if (mat === EMPTY) {
            data[ptr] = 18;
            data[ptr + 1] = 19;
            data[ptr + 2] = 24;
            data[ptr + 3] = 255;
          } else if (mat === SAND) {
            data[ptr] = 230 + (n >> 2);
            data[ptr + 1] = 175 + n;
            data[ptr + 2] = 30 + (n >> 1);
            data[ptr + 3] = 255;
          } else if (mat === WATER) {
            data[ptr] = 40 + (n >> 1);
            data[ptr + 1] = 130 + n;
            data[ptr + 2] = 235;
            data[ptr + 3] = 230;
          } else if (mat === WALL) {
            data[ptr] = 110 + n;
            data[ptr + 1] = 120 + n;
            data[ptr + 2] = 130 + n;
            data[ptr + 3] = 255;
          } else if (mat === ACID) {
            data[ptr] = 30 + (n >> 1);
            data[ptr + 1] = 235 + (n >> 1);
            data[ptr + 2] = 80 + n;
            data[ptr + 3] = 255;
          }
          ptr += 4;
        }

        ctx.putImageData(imgData, 0, 0);
      }

      // API Contract Implementation
      window.sim = {
        w: W,
        h: H,
        tick(n) {
          const steps = (typeof n === 'number' && n > 0) ? Math.floor(n) : 1;
          for (let i = 0; i < steps; i++) {
            step();
          }
          render();
        },
        get(x, y) {
          if (x < 0 || x >= W || y < 0 || y >= H) return "wall";
          return MAT_NAMES[grid[y * W + x]] || "empty";
        },
        set(x, y, material) {
          if (x < 0 || x >= W || y < 0 || y >= H) return;
          const id = MAT_IDS[material];
          if (id !== undefined) {
            grid[y * W + x] = id;
            render();
          }
        },
        clear() {
          grid.fill(EMPTY);
          render();
        }
      };

      // Interactive Painting
      let isPainting = false;
      let lastX = null;
      let lastY = null;

      function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.floor(((clientX - rect.left) / rect.width) * W);
        const y = Math.floor(((clientY - rect.top) / rect.height) * H);
        return { x: Math.max(0, Math.min(W - 1, x)), y: Math.max(0, Math.min(H - 1, y)) };
      }

      function paintAt(cx, cy) {
        const r = brushRadius;
        const matId = MAT_IDS[currentMaterial];
        for (let dy = -r + 1; dy < r; dy++) {
          for (let dx = -r + 1; dx < r; dx++) {
            if (dx * dx + dy * dy < r * r) {
              const px = cx + dx;
              const py = cy + dy;
              if (px >= 0 && px < W && py >= 0 && py < H) {
                grid[py * W + px] = matId;
              }
            }
          }
        }
      }

      function strokeLine(x0, y0, x1, y1) {
        const dx = Math.abs(x1 - x0);
        const dy = Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1;
        const sy = y0 < y1 ? 1 : -1;
        let err = dx - dy;

        let currX = x0;
        let currY = y0;

        while (true) {
          paintAt(currX, currY);
          if (currX === x1 && currY === y1) break;
          const e2 = 2 * err;
          if (e2 > -dy) {
            err -= dy;
            currX += sx;
          }
          if (e2 < dx) {
            err += dx;
            currY += sy;
          }
        }
      }

      function handleStart(e) {
        isPainting = true;
        const { x, y } = getCoords(e);
        lastX = x;
        lastY = y;
        paintAt(x, y);
        render();
      }

      function handleMove(e) {
        if (!isPainting) return;
        const { x, y } = getCoords(e);
        if (lastX !== null && lastY !== null) {
          strokeLine(lastX, lastY, x, y);
        } else {
          paintAt(x, y);
        }
        lastX = x;
        lastY = y;
        render();
      }

      function handleEnd() {
        isPainting = false;
        lastX = null;
        lastY = null;
      }

      canvas.addEventListener('mousedown', handleStart);
      canvas.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);

      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
      window.addEventListener('touchend', handleEnd);

      // UI Control Handlers
      const matButtons = [
        { id: 'mat-sand', mat: 'sand' },
        { id: 'mat-water', mat: 'water' },
        { id: 'mat-wall', mat: 'wall' },
        { id: 'mat-acid', mat: 'acid' },
        { id: 'mat-empty', mat: 'empty' }
      ];

      matButtons.forEach(({ id, mat }) => {
        const btn = document.getElementById(id);
        btn.addEventListener('click', () => {
          currentMaterial = mat;
          matButtons.forEach(b => document.getElementById(b.id).classList.remove('active'));
          btn.classList.add('active');
        });
      });

      document.getElementById('clear').addEventListener('click', () => {
        window.sim.clear();
      });

      const pauseBtn = document.getElementById('btn-pause');
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? 'Play' : 'Pause';
        pauseBtn.style.borderColor = isPaused ? '#10b981' : 'var(--panel-border)';
      });

      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          brushRadius = parseInt(btn.getAttribute('data-size'), 10);
        });
      });

      // Initial Scene Setup
      function setupInitialScene() {
        // Build a fun little container/funnel
        for (let x = 30; x <= 70; x++) {
          grid[75 * W + x] = WALL;
        }
        for (let y = 50; y <= 75; y++) {
          grid[y * W + 30] = WALL;
          grid[y * W + 70] = WALL;
        }
      }

      setupInitialScene();

      // Main Loop
      function animLoop() {
        if (!isPaused) {
          step();
          render();
        }
        requestAnimationFrame(animLoop);
      }

      render();
      requestAnimationFrame(animLoop);
    })();
  </script>
</body>
</html>
