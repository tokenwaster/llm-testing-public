<!DOCTYPE html>
<html>
<head>
    <title>2048</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
        
        .game-container {
            text-align: center;
        }
        
        #score {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 5px;
            background-color: #3b3b3b;
            padding: 20px;
            border-radius: 10px;
        }
        
        .tile {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
        }
        
        #reset {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #56b367;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #reset:hover {
            background-color: #69c47a;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="score">Score: 0</div>
        <div id="board"></div>
        <button id="reset">Reset Game</button>
    </div>

    <script>
        const game = {
            size: 4,
            _boardState: [],
            _score: 0,
            
            init() {
                this._boardState = Array(this.size).fill(0).map(() => Array(this.size).fill(0));
                this._score = 0;
                this._spawnTile();
                this._spawnTile();
            },
            
            reset() {
                this.init();
                this._updateScoreDisplay();
                this.renderBoard();
            },
            
            board() {
                return this._boardState.map(row => [...row]);
            },
            
            setBoard(arr) {
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        this._boardState[i][j] = arr[i][j];
                    }
                }
                this.renderBoard();
            },
            
            score() {
                return this._score;
            },
            
            _spawnTile() {
                const emptyCells = [];
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this._boardState[i][j] === 0) {
                            emptyCells.push({ row: i, col: j });
                        }
                    }
                }
                
                if (emptyCells.length > 0) {
                    const idx = Math.floor(Math.random() * emptyCells.length);
                    const cell = emptyCells[idx];
                    this._boardState[cell.row][cell.col] = Math.random() < 0.9 ? 2 : 4;
                }
            },
            
            move(direction) {
                const originalBoard = this.board();
                let moved = false;
                
                switch (direction) {
                    case 'left':
                        moved = this._moveLeft();
                        break;
                    case 'right':
                        moved = this._moveRight();
                        break;
                    case 'up':
                        moved = this._moveUp();
                        break;
                    case 'down':
                        moved = this._moveDown();
                        break;
                }
                
                if (moved) {
                    this._spawnTile();
                    this._updateScoreDisplay();
                }
                
                return moved;
            },
            
            _moveLeft() {
                let moved = false;
                
                for (let row = 0; row < this.size; row++) {
                    const filtered = [];
                    for (let col = 0; col < this.size; col++) {
                        if (this._boardState[row][col] !== 0) {
                            filtered.push(this._boardState[row][col]);
                        }
                    }
                    
                    const merged = [];
                    let i = 0;
                    while (i < filtered.length) {
                        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
                            merged.push(filtered[i] * 2);
                            this._score += filtered[i] * 2;
                            i += 2;
                        } else {
                            merged.push(filtered[i]);
                            i++;
                        }
                    }
                    
                    const newRow = new Array(this.size).fill(0);
                    for (let j = 0; j < merged.length && j < this.size; j++) {
                        newRow[j] = merged[j];
                    }
                    
                    if (!this._arraysEqual(this._boardState[row], newRow)) {
                        moved = true;
                    }
                    
                    this._boardState[row] = newRow;
                }
                
                return moved;
            },
            
            _moveRight() {
                for (let row = 0; row < this.size; row++) {
                    this._boardState[row].reverse();
                }
                
                const moved = this._moveLeft();
                
                for (let row = 0; row < this.size; row++) {
                    this._boardState[row].reverse();
                }
                
                return moved;
            },
            
            _moveUp() {
                let moved = false;
                
                for (let col = 0; col < this.size; col++) {
                    const filtered = [];
                    for (let row = 0; row < this.size; row++) {
                        if (this._boardState[row][col] !== 0) {
                            filtered.push(this._boardState[row][col]);
                        }
                    }
                    
                    const merged = [];
                    let i = 0;
                    while (i < filtered.length) {
                        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
                            merged.push(filtered[i] * 2);
                            this._score += filtered[i] * 2;
                            i += 2;
                        } else {
                            merged.push(filtered[i]);
                            i++;
                        }
                    }
                    
                    let changed = false;
                    for (let row = 0; row < this.size; row++) {
                        const newValue = row < merged.length ? merged[row] : 0;
                        if (this._boardState[row][col] !== newValue) {
                            changed = true;
                        }
                        this._boardState[row][col] = newValue;
                    }
                    
                    if (changed) {
                        moved = true;
                    }
                }
                
                return moved;
            },
            
            _moveDown() {
                for (let col = 0; col < this.size; col++) {
                    const column = [];
                    for (let row = 0; row < this.size; row++) {
                        column.push(this._boardState[row][col]);
                    }
                    column.reverse();
                    
                    const filtered = [];
                    for (const val of column) {
                        if (val !== 0) {
                            filtered.push(val);
                        }
                    }
                    
                    const merged = [];
                    let i = 0;
                    while (i < filtered.length) {
                        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
                            merged.push(filtered[i] * 2);
                            this._score += filtered[i] * 2;
                            i += 2;
                        } else {
                            merged.push(filtered[i]);
                            i++;
                        }
                    }
                    
                    let changed = false;
                    for (let row = 0; row < this.size; row++) {
                        const reversedRow = this.size - 1 - row;
                        const newValue = reversedRow < merged.length ? merged[reversedRow] : 0;
                        if (this._boardState[row][col] !== newValue) {
                            changed = true;
                        }
                        this._boardState[row][col] = newValue;
                    }
                    
                    return changed;
                }
                
                return false;
            },
            
            renderBoard() {
                const boardElement = document.getElementById('board');
                boardElement.innerHTML = '';
                
                for (let row = 0; row < this.size; row++) {
                    for (let col = 0; col < this.size; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'tile';
                        const value = this._boardState[row][col];
                        
                        if (value === 0) {
                            cell.style.backgroundColor = '#3b3b3b';
                            cell.textContent = '';
                        } else {
                            cell.style.backgroundColor = this.getTileColor(value);
                            cell.textContent = value;
                            cell.style.color = value <= 4 ? '#769e8f' : 'white';
                        }
                        
                        boardElement.appendChild(cell);
                    }
                }
            },
            
            getTileColor(value) {
                const colors = {
                    2: '#eee4de',
                    4: '#ede0c8',
                    8: '#f9b07b',
                    16: '#f59563',
                    32: '#f27b60',
                    64: '#ea5a34',
                    128: '#fee74c',
                    256: '#ffeb3b',
                    512: '#ffca3a',
                    1024: '#f9d71e',
                    2048: '#fff1bb'
                };
                return colors[value] || '#cccccc';
            },
            
            _updateScoreDisplay() {
                document.getElementById('score').textContent = 'Score: ' + this._score;
            },
            
            _arraysEqual(a, b) {
                if (a.length !== b.length) return false;
                for (let i = 0; i < a.length; i++) {
                    if (a[i] !== b[i]) return false;
                }
                return true;
            }
        };
        
        window.game = game;
        
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    game.move('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    game.move('right');
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    game.move('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    game.move('down');
                    break;
            }
        });
        
        document.getElementById('reset').addEventListener('click', function() {
            game.reset();
        });
        
        window.onload = function() {
            game.reset();
        };
    </script>
</body>
</html>
