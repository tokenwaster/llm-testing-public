<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Spreadsheet</title>
<style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #spreadsheet {
        display: grid;
        grid-template-columns: repeat(10, 60px) repeat(10, 80px);
        grid-auto-rows: 30px;
        border-collapse: collapse;
    }
    .header-cell { font-weight: bold; background-color: #eee; display: flex; align-items: center; justify-content: center; }
    input[type="text"] { width: 100%; height: 100%; padding: 2px; border: none; text-align: right; box-sizing: border-box; font-size: 14px; }
    .row-label { display: flex; align-items: center; justify-content: center; background-color: #eee; font-weight: bold; }
    #exportBtn, #csv { margin-top: 10px; }
</style>
</head>
<body>
<div id="spreadsheet"></div>
<button id="exportBtn">Export CSV</button><br>
<textarea id="csv" rows="10" cols="50"></textarea>

<script>
const gridSize = 10;
let dependentsMap = {};

function createGrid() {
    const sheet = document.getElementById('spreadsheet');
    
    // Column headers row (A-J)
    for (let col = 0; col < gridSize; col++) {
        const header = document.createElement('div');
        header.className = 'header-cell';
        header.textContent = String.fromCharCode(65 + col);
        sheet.appendChild(header);
    }

    // Data rows with row labels and cells
    for (let row = 1; row <= gridSize; row++) {
        // Row label column
        const rowLabel = document.createElement('div');
        rowLabel.className = 'row-label';
        rowLabel.textContent = String(row);
        sheet.appendChild(rowLabel);

        for (let col = 0; col < gridSize; col++) {
            const cellId = `${String.fromCharCode(65 + col)}${row}`;
            const input = document.createElement('input');
            input.type = 'text';
            input.id = `cell-${cellId}`;
            
            // Initialize dependents for new cells
            if (!dependentsMap[cellId]) dependentsMap[cellId] = [];

            input.addEventListener('blur', () => handleCellChange(input));
            input.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') handleCellChange(input);
            });
            
            sheet.appendChild(input);
        }
    }
}

// Helper functions for formula evaluation
function parseTokens(expr) {
    const tokens = [];
    let currentToken = '';
    let isNumber = false;
    let isCellRef = false;
    
    for (let i = 0; i < expr.length; i++) {
        const c = expr[i];
        
        if (/[A-J]/.test(c)) isCellRef = true;
        else isCellRef = false;
        
        if (/[0-9.]/.test(c) || (isNumber && /[eE+-/*()]/.test(c))) {
            currentToken += c;
            isNumber = true;
        } else {
            if (currentToken.length > 0) tokens.push(currentToken);
            
            if (/[A-J][1-9]/.test(c)) { // Cell ref starting like A, then digit(s)
                let j = i+1;
                while(j < expr.length && /[1-90]/.test(expr[j])) j++;
                currentToken = expr.substring(i, j);
                tokens.push(currentToken);
                i = j - 1;
            } else {
                const opMatch = c.match(/[+\-*/()]/);
                if (opMatch) tokens.push(c);
            }
            
            currentToken = '';
        }
    }
    
    if (currentToken.length > 0) tokens.push(currentToken);
    return tokens;
}

function evaluateExpression(expr, visited = new Set()) {
    if (!expr.startsWith('=')) return expr || '';

    const cellId = getCellIdFromContext(); // Not possible here → need a different approach for recursion tracking. 
    
    let modifiedExpr = expr.slice(1); // Remove '='

    // Tokenize expression and replace references with computed values
    const tokens = parseTokens(modifiedExpr);
    let newTokens = [];
    
    for (let token of tokens) {
        if (/[A-J][0-9]+/.test(token)) { // Cell reference
            const refValue = evaluateCell(token, visited);
            if (refValue.startsWith('#')) return refValue;
            if (isNaN(parseFloat(refValue))) {
                newTokens.push('NaN'); // Force error
            } else {
                newTokens.push(parseFloat(refValue));
            }
        } else {
            newTokens.push(token);
        }
    }

    modifiedExpr = newTokens.join(' ');
    
    try {
        const result = eval(modifiedExpr.replace(/ /g, '')); // Evaluate transformed expression
        if (isNaN(result)) return '#ERR';
        else return String(Math.round(result * 100)/100); // Rounded to two decimals
    } catch(e) {
        return '#ERR';
    } finally {
        visited.delete(cellId); // This won't work since we need to track via the call stack → revisiting this approach might be wrong. Need a better cycle tracking method with global set during evaluation chain.
    }
}

function evaluateCell(cellId, visiting) {
    if (visiting.has(cellId)) return '#CYCLE'; // Detected cycle in current evaluation path
    
    let visited = new Set(visiting);
    visited.add(cellId);

    const rawVal = document.getElementById(`cell-${cellId}`).value;
    
    if (!rawVal.startsWith('=')) { 
        return rawVal || ''; // For display, it's the string itself. In formulas treated as empty (0)? Or per problem description:
        // Non-formula cell displays its plain text. Formulas can use the value of this cell → treat as numeric if possible else error.
    }

    let expr = rawVal.slice(1);
    
    const tokens = parseTokens(expr);
    let newExpr = '';

    for (let token of tokens) {
        if (/[A-J][0-9]+/.test(token)) { // Cell reference
            const refCellId = token;
            const val = evaluateCell(refCellId, visited);
            if (val.startsWith('#')) return val; // Propagate error/cycle

            if (isNaN(parseFloat(val))) { 
                // If referenced cell's value is non-numeric string → formula invalid.
                return '#ERR'; 
            }
            newExpr += parseFloat(val) + ' ';
        } else {
            newExpr += token;
        }
    }

    try {
        const result = eval(newExpr.replace(/ /g, ''));
        if (isNaN(result)) return '#ERR'; // e.g., division by zero → NaN
        return String(Math.round(result * 100) / 100);
    } catch(e) {
        console.error('eval error:', newExpr);
        return '#ERR';
    } finally {
        visited.delete(cellId);  // Remove from visiting set after processing
    }
}

    updateDependencies(cellId, inputEl.value);

    // Trigger evaluation and update UI

}

function getComputedValue(cellId) {
    const rawVal = document.getElementById(`cell-${cellId}`).value;
    
    if (rawVal.startsWith('=')) return evaluateCell(cellId, new Set());
    else return rawVal || '0'; // Empty cell is 0 in formulas → but here treated as empty string? Not sure. Need to handle properly.
}

// Export CSV functionality
document.getElementById('exportBtn').addEventListener('click', () => {
    const csvContent = [];
    
    for (let row = 1; row <= gridSize; row++) {
        let rowStr = '';
        for (let col = 0; col < gridSize; col++) {
            const cellId = `${String.fromCharCode(65 + col)}${row}`;
            const val = getComputedValue(cellId); // Needs to return computed value, not raw input's display?
            
            rowStr += (val === '#ERR' || val === '#CYCLE') ? val : parseFloat(val) || '';
            if (col < gridSize - 1) rowStr += ',';
        }
        csvContent.push(rowStr);
    }

    document.getElementById('csv').value = csvContent.join('\n');
});

// Scripting API implementation
window.sheet = {
    set: function(cellId, value) {
        const input = document.getElementById(`cell-${cellId}`);
        if (input) input.value = value;
    },
    
    get: function(cellId) {
        const computedVal = getComputedValue(cellId);
        return computedVal.toString();
    },

    raw: function(cellId) {
        return document.getElementById(`cell-${cellId}`).value || '';
    }
};

// Initial setup
createGrid();
updateDependentsMap(); // Incomplete but required for correct behavior
</script>
