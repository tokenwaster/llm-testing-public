<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Ball Physics Playground</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #eee;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
#sim {
  background: #16213e;
  border: 2px solid #0f3460;
  cursor: crosshair;
  margin-bottom: 15px;
}
button {
  background: #0f3460;
  color: #fff;
  border: 2px solid #e94560;
  padding: 10px 20px;
  margin: 0 5px;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
button:hover { background: #e94560; }
button:active { transform: scale(0.95); }
</style>
</head>
<body>
<canvas id="sim" width="500" height="500"></canvas>
<div>
  <button id="drop">Drop</button>
  <button id="play">Play</button>
  <button id="clear">Clear</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  
  let balls = [];
  let animationId = null;
  let running = false;
  
  // Physics constants
  const GRAVITY = 0.5;
  const RESTITUTION = 0.8;
  const FRICTION = 0.99;
  
  // Get canvas dimensions
  function getCanvasSize() {
    const rect = canvas.getBoundingClientRect();
    return { w: rect.width, h: rect.height };
  }
  
  // Add a ball with optional parameters
  function addBall(x, y, vx = 0, vy = 0, r = 20) {
    balls.push({ x, y, vx, vy, r });
  }
  
  // Get all balls (for API)
  function getBalls() {
    return balls.map(b => ({ ...b }));
  }
  
  // Clear all balls
  function clear() {
    balls = [];
  }
  
  // Step the simulation
  function step(dt = 1) {
    const { w, h } = getCanvasSize();
    
    for (let ball of balls) {
      // Apply gravity
      ball.vy += GRAVITY * dt;
      
      // Update position
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      
      // Bounce off left wall
      if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.vx = -ball.vx * RESTITUTION;
        ball.vx *= FRICTION;
      }
      
      // Bounce off right wall
      if (ball.x + ball.r > w) {
        ball.x = w - ball.r;
        ball.vx = -ball.vx * RESTITUTION;
        ball.vx *= FRICTION;
      }
      
      // Bounce off top wall
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy * RESTITUTION;
        ball.vy *= FRICTION;
      }
      
      // Bounce off bottom wall
      if (ball.y + ball.r > h) {
        ball.y = h - ball.r;
        ball.vy = -ball.vy * RESTITUTION;
        ball.vy *= FRICTION;
      }
    }
    
    draw();
  }
  
  // Draw everything
  function draw() {
    const { w, h } = getCanvasSize();
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let ball of balls) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#e94560';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  
  // Animation loop
  function animate() {
    step(1);
    animationId = requestAnimationFrame(animate);
  }
  
  // Start/pause simulation
  function togglePlay() {
    running = !running;
    if (running) {
      play.textContent = 'Pause';
      animate();
    } else {
      play.textContent = 'Play';
      if (animationId) {
        cancelAnimationFrame(animationId);
      }
    }
  }
  
  // Handle canvas click to add ball
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    addBall(x, y);
    if (!running) draw();
  });
  
  // Button event listeners
  document.getElementById('drop').addEventListener('click', () => {
    const { w, h } = getCanvasSize();
    addBall(w / 2, 50);
    if (!running) draw();
  });
  
  document.getElementById('play').addEventListener('click', togglePlay);
  
  document.getElementById('clear').addEventListener('click', () => {
    clear();
    running = false;
    play.textContent = 'Play';
    if (animationId) {
      cancelAnimationFrame(animationId);
    }
    draw();
  });
  
  // Initial draw
  draw();
  
  // Expose API on window.sim
  const size = getCanvasSize();
  window.sim = {
    w: size.w,
    h: size.h,
    balls: () => getBalls(),
    addBall: (x, y, vx = 0, vy = 0, r) => addBall(x, y, vx, vy, r || 20),
    clear: () => { clear(); draw(); },
    step: (dt = 1) => step(dt)
  };
  
})();
</script>
</body>
</html>
