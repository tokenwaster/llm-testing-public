<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kanban Board</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .col-header {
            background-color: #4a6fa5;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            position: relative;
            min-width: 200px;
        }
        
        .count {
            display: inline-block;
            margin-left: 10px;
        }
        
        #new-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #new-input:focus {
            border-color: #4a6fa5;
        }
        
        .add-card-btn {
            background-color: #4a6fa5;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .add-card-btn:hover {
            background-color: #3a5bd8;
            transform: translateY(-1px);
        }
        
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }
        
        .card-header {
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .card-content {
            padding-left: 30px;
        }
        
        .card-title {
            display: block;
            margin-bottom: 5px;
        }
        
        .delete-btn {
            color: #ff4d4d;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        
        .card-delete:hover {
            background-color: rgba(255, 77, 87, 0.1);
            color: #ff4d4d;
        }
        
        /* Column styling */
        #col-todo {
            grid-column: 1 / -1;
        }
        
        #col-doing {
            grid-column: 2 / -1;
        }
        
        #col-done {
            grid-column: 3 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Column 1: Todo -->
        <div id="board">  
            <div class="col-header">To Do</div>
            <div class="count" id="todo-count">0</div>
            <input type="text" id="new-input-todo" placeholder="Type a task...">
            <button class="add-card-btn" onclick="createNewCardInTodo()">#add-card</button>
        </div>
        
        <!-- Column 2: Doing -->
        <div id="board">
            <div class="col-header">Doing</div>
            <div class="count" id="doing-count">0</div>
            <input type="text" id="new-input-doing">
            <button class="add-card-btn" onclick="createNewCardInDone()">#add-card</button>
        </div>
        
        <!-- Column 3: Done -->
        <div id="board">
            <div class="col-header">Done</div>
            <div class="count" id="done-count">0</div>
            <input type="text" id="new-input-done">
            <button class="add-card-btn" onclick="createNewCardInDone()">#add-card</button>
        </div>
    </div>
    
    <!-- Cards -->
    <script>
        // Track board state in localStorage
        let boardState = {};
        
        function loadBoardState() {
            const storedState = localStorage.getItem('kanban-board-state');
            if (storedState) {
                boardState = JSON.parse(storedState);
            }
            
            // Initialize empty board
            window.board = [];
            updateBoard();
        }
        
        function saveBoardState() {
            const savedState = JSON.stringify(boardState);
            localStorage.setItem('kanban-board-state', savedState);
        }
        
        function initBoard() {
            loadBoardState();
            
            // Create initial cards
            createTodoCard();
            createDoingCard();
            createDoneCard();
        }
        
        // Create a new card for "To Do" (created in #col-todo column)
        function createTodoCard() {
            const countEl = document.getElementById('todo-count');
            let textInput = document.getElementById('new-input-todo');
            const cardTitle = 'Task';
            
            // Add card to board state
            boardState.cards.push({
                id: `card-new-${Date.now()}`,
                title: cardTitle,
                content: "",
                column: "#col-todo",
                cellContent: ""
            });
            
            // Update count for #col-todo (it's the first column)
            updateBoardCount('#todo', 1);
        }
        
        function createDoingCard() {
            const countEl = document.getElementById('doing-count');
            let textInput = document.getElementById('new-input-doing');
            const cardTitle = 'Task';
            
            boardState.cards.push({
                id: `card-new-${Date.now()}`,
                title: cardTitle,
                content: "",
                column: "#col-doing",
                cellContent: ""
            });
            
            updateBoardCount('#doing', 1);
        }
        
        function createDoneCard() {
            const countEl = document.getElementById('done-count');
            let textInput = document.getElementById('new-input-done');
            const cardTitle = 'Task';
            
            boardState.cards.push({
                id: `card-new-${Date.now()}`,
                title: cardTitle,
                content: "",
                column: "#col-done",
                cellContent: ""
            });
            
            updateBoardCount('#done', 1);
        }
        
        // Create a new card for "Doing" (created in #col-doing column)
        function createDoneCard() {
            const countEl = document.getElementById('doing-count');
            let textInput = document.getElementById('new-input-doing');
            const cardTitle = 'Task';
            
            boardState.cards.push({
                id: `card-new-${Date.now()}`,
                title: cardTitle,
                content: "",
                column: "#col-done",
                cellContent: ""
            });
            
            updateBoardCount('#doing', 1);
        }
        
        // Create a new task in #col-doing (created on button click)
        function createNewCardInTodo() {
            const countEl = document.getElementById('todo-count');
            let textInput = document.getElementById('new-input-todo');
            
            if (textInput.value.trim()) {
                createTaskForColumn('#todo', textInput.value);
            }
        }
        
        // Create a task in #col-doing (created on button click)
        function createNewCardInDone() {
            const countEl = document.getElementById('doing-count');
            let textInput = document.getElementById('new-input-doing');
            
            if (textInput.value.trim()) {
                createTaskForColumn('#doing', textInput.value);
            }
        }
        
        // Create a task in #col-done (created on button click)
        function createNewCardInDone() {
            const countEl = document.getElementById('done-count');
            let textInput = document.getElementById('new-input-done');
            
            if (textInput.value.trim()) {
                createTaskForColumn('#done', textInput.value);
            }
        }
        
        // Create a task for a specific column
        function createTaskForColumn(columnId, title) {
            const countEl = document.getElementById(`${columnId}-count`);
            
            let inputElement = document.getElementById(`new-input-${columnId}`);
            
            if (title.trim()) {
                inputElement.value = title;
                boardState.cards.push({
                    id: `task-${Date.now()}`,
                    title: title,
                    content: "",
                    column: columnId,
                    cellContent: ""
                });
                
                updateBoardCount(`${columnId}`, 1);
            } else {
                // Clear the input if empty
                inputElement.value = "";
            }
        }
        
        // Update the count display for a specific column
        function updateBoardCount(columnId, count) {
            const col = document.getElementById(`${columnId}-count`);
            col.textContent = `${count}`;
            
            // Update card state in boardState array
            const cardsInBoard = boardState.cards.filter(card => card.column === columnId);
            for (const card of cardsInBoard) {
                // If the card is already there, update content (for example)
                if (card.cellContent && card.cellContent !== "" || card.remaining) {
                    card.content = "";
                }
                // Otherwise, set content to empty
                if (!card.remaining) {
                    card.content = "";
                }
            }
        }
        
        function createTaskForColumn(columnId, title) {
            const countEl = document.getElementById(`${columnId}-count`);
            
            let inputElement = document.getElementById(`new-input-${columnId}`);
            
            if (title.trim()) {
                inputElement.value = title;
                boardState.cards.push({
                    id: `task-${Date.now()}`,
                    title: title,
                    content: "",
                    column: columnId,
                    cellContent: ""
                });
                
                updateBoardCount(`${columnId}`, 1);
            } else {
                // Clear the input if empty
                inputElement.value = "";
            }
        }
        
        // Drag and drop implementation for moving cards between columns
        function dragEnd(e) {
            const draggedItem = e.target;
            
            // Remove the card from its current column
            removeFromColumn(draggedItem, boardState.cards);
            
            // Move to new column
            moveToColumn(draggedItem, boardState.board);
        }
        
        function dragStart(e) {
            const draggedItem = e.target;
            
            if (draggedItem.classList.contains('card')) {
                // Add event listener for the card's content area for drop handling?
                // Since we are using HTML5 drag and drop, we need to attach more complex logic.
            }
        }
        
        // Remove a card from its current column
        function removeFromColumn(cardId, boardState) {
            const index = boardState.cards.findIndex(item => item.id === cardId);
            if (index !== -1) {
                boardState.cards.splice(index, 1);
                
                // Update counts for the column that lost a card
                updateBoardCount(`${boardState.board[0].id}-count`, boardState.cards.length - 1);
            }
        }
        
        function moveToColumn(cardId, newColumn) {
            const index = boardState.cards.findIndex(item => item.id === cardId);
            if (index !== -1 && boardState.board[index] === newColumn) {
                // Move the card to new column
                boardState.cards.splice(index, 0, {
                    id: `card-${Date.now()}`,
                    title: "Task",
                    content: "",
                    column: newColumn,
                    cellContent: ""
                });
                
                updateBoardCount(newColumn, index + 1);
            }
        }
        
        // Update board state when a card is added
        function addToBoardState(cardId) {
            const cards = boardState.cards;
            
            if (!cards.includes(cardId)) {
                cards.push({
                    id: cardId,
                    title: "Task",
                    content: "",
                    column: `board-${new Date().getHours()}` // Unique timestamp
                });
                
                // Update counts for all columns (since each card is in a new column)
                updateBoardCount(`todo`, 1);
                updateBoardCount(`doing`, 1);
                updateBoardCount(`done`, 1);
            }
        }
        
        function removeFromState(state, cardId) {
            const cards = state.cards;
            
            for (const card of cards) {
                if (card.id === cardId) {
                    // Remove from board
                    state.board = state.board.filter(cb => cb.id !== cardId);
                    
                    // Update counts for columns that still have this card
                    const columnIds = ['todo', 'doing', 'done'];
                    let countToUpdate = 0;
                    for (let colId of columnIds) {
                        if (!state.board.hasOwnProperty(colId)) continue;
                        
                        const cardsInColumn = state.board[colId].cards.filter(c => c.id === cardId);
                        // Update remaining count
                        cardsInColumn.forEach((card, index) => {
                            if (index < cardsInColumn.length) {
                                // Remaining count for this column is total minus current cards in board? 
                                // Actually we are removing one card from a column when it's moved.
                                // We'll update the count based on how many cards are there in each column.
                
                                let remaining = state.board[colId].cards.length;
                                
                                // If the card was in this column, now it will be removed or moved?
                                if (index === cardsInColumn.length - 1) {
                                    // Remove from board and count accordingly
                                    // We'll update counts for columns by removing one card from each column that lost it? 
                                    // This is complex. Instead, we remove the card from board and adjust the count display.
                                    
                                    remaining--;
                                }
                            }
                        });
                        
                        // Actually simpler: when a card is removed from state, we don't update counts because
                        // the count updates by default in localStorage? But we have to be consistent.
                    }
                }
            }
        }
        
        // Update board display with current state
        function updateBoardDisplay() {
            const todoCards = boardState.board[0].cards.filter(c => c.column === '#col-todo');
            const doingCards = boardState.board[1].cards.filter(c => c.column === '#col-doing');
            const doneCards = boardState.board[2].cards.filter(c => c.column === '#col-done');
            
            // Clear all count displays
            document.querySelectorAll('.count').forEach(el => el.textContent = "0");
            
            if (todoCards.length > 0) {
                const todoCountEl = document.getElementById('todo-count');
                todoCountEl.textContent = `${todoCards.length} task(s)`;
            }
            
            if (doingCards.length > 0) {
                const doingCountEl = document.getElementById('doing-count');
                doingCountEl.textContent = `${doingCards.length} task(s)`;
            }
            
            if (doneCards.length > 0) {
                const doneCountEl = document.getElementById('done-count');
                doneCountEl.textContent = `${doneCards.length} task(s)`;
            }
        }
        
        // Event listeners for drag and drop
        // We need to attach events to all cards, including those created via buttons.
        let draggedItem = null;
        const columns = ['#todo', '#doing', '#done'];
        
        function onColumnDragStart(e) {
            // Attach event listener to the column element itself? 
            // Actually, we want to handle drag and drop on the cards (not just columns).
            // We'll attach more events.
            
            const draggedCard = e.target;
            if (draggedCard.classList.contains('card')) {
                // For now, we'll not implement full drag-and-drop in this simplified version
                // because it's complex. Instead, we will handle movement by removing and adding to boardState.
                
                // Remove card from its current state
                removeFromState(boardState, draggedCard.id);
            }
        }
        
        function onColumnDragEnd(e) {
            const draggedItem = e.target;
            
            // For simplicity in this example, we will move the card to a different column 
            // by removing it and adding to boardState with new column id.
            
            // Remove from current column
            removeFromColumn(draggedItem.id, boardState);
            
            // Add to new column (e.g., if moved to #col-doing)
            const newColumnId = columns[boardState.board.length];
            addToBoardState(newCardId: `card-new-${Date.now()}`);
        }
        
        // Initialize
        initBoard();
        
        // Load board state on page load
        document.addEventListener('DOMContentLoaded', function() {
            window.loadBoardState();
            updateBoardDisplay();
        });
    </script>
</body>
</html>
