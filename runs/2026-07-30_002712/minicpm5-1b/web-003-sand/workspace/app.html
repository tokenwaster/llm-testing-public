<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falling-Sand Cellular-Automata Sandbox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin: 20px;
        }

        #sandboard {
            display: inline-block;
            width: 800px;
            height: 800px;
            background-color: #000;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .material {
            display: inline-block;
            padding: 5px 12px;
            background-color: white;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mat-sand { background-color: #ff6b6b; color: #fff; }
        .mat-water { background-color: #00c6ff; color: #f0f0f0; }
        .mat-wall { background-color: #8a2be2; color: #000; }
        .mat-acid { background-color: #e74c3c; color: #fff; }
        .mat-empty { background-color: #bdc3c7; color: #333; }

        #mat-sand {
            background-color: #ff6b6b;
            border-radius: 5px;
        }
        
        #mat-water {
            background-color: #00c6ff;
            border-radius: 5px;
        }
        
        #mat-wall {
            background-color: #8a2be2;
            border-radius: 5px;
        }
        
        #mat-acid {
            background-color: #e74c3c;
            border-radius: 5px;
        }
        
        #mat-empty {
            background-color: #bdc3c7;
            border-radius: 5px;
        }

        #clear {
            margin-top: 20px;
            padding: 10px 15px;
            font-size: 14px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .active {
            background-color: #ffe6e6;
            box-shadow: 0 3px 10px rgba(255, 107, 107, 0.5);
        }
        
        button, input {
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div id="sandboard"></div>
<button class="clear" onclick="window.sim.clear()">Clear</button>
<select id="material-selector">
    <option value="#mat-empty">Empty</option>
    <option value="#mat-sand" selected>Sand</option>
    <option value="#mat-water" title="Water">Water</option>
    <option value="#mat-wall">Wall</option>
    <option value="#mat-acid">Acid</option>
</select>

<script>
// API Window
window.sim = {
    w: 800,   // grid width in cells (numbers)
    h: 800,   // grid height in cells (numbers)
    tick(n): {       // deterministic advance time n steps SYNCHRONOUSLY
        var count = 0;
        for(var i=0; i<n; i++) {
            count++;
            // Simulation logic here...
        }
        return count * 10000000; // arbitrary large number for demonstration
    },
    get(x, y): {   // returns material from current state (the sandboard canvas)
        var content = document.getElementById("sandboard");
        var cells = content.querySelectorAll(".mat-*");
        
        // Find material at position (x,y) using CSS and JS mapping
        for(var i=0; i<cells.length; i++) {
            if(cells[i].getAttribute("style") === "background-color:" + 
                getCSSColor() || getStyle(x, y)) {
                return cells[i].className;
            }
        }
        // Default: empty (no material)
        return "empty";
    },
    set(x, y, material): {  // place one cell at (x,y) with given material
        var content = document.getElementById("sandboard");
        
        // Remove previous element
        if(content.querySelectorAll(".mat-*").length > 0) {
            content.removeChild(document.getElementById("#mat-empty"));
        }
        
        // Create new element
        var newContent = document.createElement("div");
        newContent.className = "mat-" + material.toLowerCase();
        
        // Add material to background
        if(material !== "empty") {
            var bgColor = getCSSColor();
            newContent.style.backgroundColor = bgColor;
        }
        
        // Center content and set position relative to canvas (since canvas is 800px wide)
        var offsetX = x % w - w/2; // adjust for canvas width
        var offsetY = y * 2;          // simulate height based on canvas aspect ratio? Not ideal but works

        // Place element at calculated position and expand if needed?
        newContent.style.left = `calc(100% + ${offsetX}px)`;
        newContent.style.top = `${y*2}px`;
        
        // Ensure width matches grid cell size (approx 800 pixels)
        if(w % 80 === 0 && x * 100/40 !== w) {
            newContent.width = Math.max(160, Math.min(400, x * 100 / 40));
        }

        content.appendChild(newContent);
    },
    clear(): void { window.sim.clear(); }
};

// Material color mapping function (deterministic CSS values)
function getCSSColor() {
    // Sand: #FF6B6B
    // Water: #00C6FF
    // Acid: #E74C3C
    // Wall: #8A2BE2
    // Empty: #BDC3C7
    return "#FF6B6B"; // fallback, actual colors may vary based on CSS variable system
}

// JavaScript to populate the sandboard with materials in a grid pattern
function fillSandboard() {
    var content = document.getElementById("sandboard");
    
    // Create 6400 cells (80x80) for simulation purposes
    var cellCount = Math.ceil(window.sim.h / 10); // approximate 64 cells per row
    var totalCells = cellCount * cellCount;
    
    // Calculate x and y positions based on width w=800, height h=800
    // We'll draw in a grid of approximately 80 rows (1000 cells) for demonstration
    for(var row=0; row<1000; row++) { // approximate
        var x = 10 * row + 5;
        if(x < w && y < h) {
            var cells = content.querySelectorAll(".mat-*");
            
            // Clear previous material in this cell
            while(cells.length > 0) {
                var current = cells[0];
                if(current.className === "mat-" + material.toLowerCase()) {
                    current.classList.remove("mat-" + material.toLowerCase());
                    break;
                }
                
                // Randomly select a material for the new one (or skip if already selected)
                var randomMaterialIndex = Math.floor(Math.random() * 4);
                if(randomMaterialIndex > 0) {
                    cells[0].className = "mat-" + material.toLowerCase();
                    cells[0].style.backgroundColor = getCSSColor();
                    break;
                }
            }
            
            // Add new element at position
            var offsetX = x % w - w/2; // adjust for canvas width
            var contentHeight = y * 20; // simulate height based on canvas

            var newContent = document.createElement("div");
            newContent.className = "mat-" + material.toLowerCase();
            
            if(material !== "empty") {
                var bgColor = getCSSColor();
                newContent.style.backgroundColor = bgColor;
            }

            // Center content and set position relative to canvas (since canvas is 800px wide)
            // We'll calculate left/right margin based on width of newContent
            if(w % 80 === 0 && x * 100/40 !== w) {
                var width = Math.max(160, Math.min(400, x * 100 / 40));
                if(newContent.style.width > width) {
                    newContent.style.width = width;
                    // Adjust position to fit within canvas
                    newContent.left = `calc(100% + ${offsetX}px)`;
                } else {
                    newContent.style.width = "0";
                    newContent.left = offsetX;
                    newContent.top = y * 20;
                }
            } else {
                newContent.style.left = offsetX;
                newContent.top = y * 20;
            }

            // Add padding and margin for visual spacing
            newContent.style.paddingLeft="5px";
            newContent.style.paddingTop="10px";

            content.appendChild(newContent);
        }
    }
}

// Initial fill of sandboard (for demonstration)
setTimeout(fillSandboard, 1000);
</script>
</body>
</html>
