<!DOCTYPE html>
<html lang="en">
<head>

        const game = {

                this.score = 0;

                for (let row = 0; row < game.size; row++) {
                    for (let col = 0; col < game.size; col++) {
                        game.board[row][col] = 0;
                    }
                }
                // Place one tile at top-left
                game.board[0][0] = 1;

                            break;

                }
                game.board = newBoard;
            },
            score() {
                // In a 4x4 board, tiles are only at the edges
                let score = 0;
                
                // Count non-zero values on the border for scoring calculation
                const borderValues = [];
                for (let row = 0; row < game.size; row++) {
                    if (row === 0 || row === game.size-1) { // top and bottom rows
                        for (let col = 0; col < game.size; col++) {
                            if (game.board[row][col] > 0) {
                                borderValues.push(game.board[row][col]);
                            }
                        }
                    } else if (row === 1 || row === game.size-2) { // left and right columns
                        for (let col = 0; col < game.size; col++) {
                            if (game.board[row][col] > 0) {
                                borderValues.push(game.board[row][col]);
                            }
                        }
                    }
                }
                
                // For this simplified game, score is based on border values
                return borderValues.reduce((sum, val) => sum + val, 0);
            }
        };
