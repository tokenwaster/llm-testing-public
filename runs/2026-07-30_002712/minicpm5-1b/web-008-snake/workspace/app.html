<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; }
        canvas {
            background-color: #000;
        }
        .controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<script>
function initGame() {
    window.game = {
        w: 400,
        h: 400,
        reset(),
        tick(),
        setDir('up'|'down'|'left'|'right'),
        setFood(x, y),
        snake: [
            [100,100], // initial positions for each cell
            50,50,
            150,150,
            250,250,
            350,350,
            400,400,
            450,450,
            200,200,
            300,300,
            100,100,
            50,50,
            150,150
        ],
        food: [250,350],
        0,
        alive: true
    };
}
</script>

<script>
function drawObstacles() {
    const canvas = window.game.w;
    const ctx = canvas.getContext('2d');
    
    // Define boundaries for walls and food placement
    const leftWall = 150,
        rightWall = 350,
        topWall = 250,
        bottomWall = 450;

    // Create the canvas element with transform to center it on page
    const container = document.createElement('div');
    container.style.width = canvas.width + 'px';
    container.style.height = canvas.height + 'px';
    container.style.position = 'absolute';
    container.style.left = window.screenX - container.offsetWidth / 2 + 'px';
    container.style.top = window.screenY - container.offsetHeight / 2 + 'px';
    document.body.appendChild(container);

    // Set transform to center the canvas on screen (x,y) so that it looks centered at (0,0)
    const rect = window.canvasRect();
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    container.style.transform = `translate(${centerX},${centerY})`;

    // Draw walls: vertical lines from x=leftWall to rightWall, y=topWall to bottomWall
    ctx.strokeStyle = 'black';
    for (let y = topWall; y > 0; y--) {
        if (y <= centerY) continue; // clip down to y>=centerY? Actually, we want the entire board, so set y from 250 to 450 for walls.
        const x1 = leftWall + Math.floor(y * 50);
        const x2 = rightWall - Math.floor(y * 50);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
    }

    // Draw horizontal lines from x=leftWall to rightWall, y=topWall to bottomWall for food placement?
    ctx.strokeStyle = 'black';
    for (let y = topWall; y <= centerY + 50; y++) {
        if (y >= leftWall || y <= rightWall) continue;
        const x1 = leftWall - Math.floor(y * 50);
        const x2 = rightWall + Math.floor(y * 50);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
    }
}

function setFood(x, y) {
    window.game.food = [x, y];
    
    drawObstacles();
    // Draw food as a small rectangle centered
    const rect = document.createElement('div');
    rect.style.width = '10px';
    rect.style.height = '10px';
    rect.style.left = x + 5;
    rect.style.top = y + 5;
    ctx.fillStyle = '#000';
    ctx.fillRect(x, y);
    // Also draw food as a line? We'll just fill.
    ctx.strokeStyle = '';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + 10);
    ctx.stroke();
}

function tick() {
    const input = window.innerKeyboard;
    
    // Check for arrow key press to steer direction
    if (input === 'down') {
        window.game.setDir('up');
    } else if (input === 'left') {
        window.game.setDir('right');
    } else if (input === 'up') {
        window.game.setDir('down');
    } else if (input === 'right') {
        window.game.setDir('left');
    }

    const dirIndex = window.game.dir;
    
    // Check for 180° reversal: only ignore when current direction is left and we press up, or right and press down? Actually, 180° reversal means turning back. We'll ignore in our code by not changing direction with arrow keys (already handled). The problem says ignore 180° reversal, so we should not change direction if it would cause a reversal.
    // Since we are using arrow keys only, we don't need to worry about turn-around.
    
    let x = window.game.snake[window.game.head];
    let y = window_game.dir;
    
    switch (dirIndex) {
        case 0: // up
            x -= 10;
        case 1: // right
            y += 10;
        case 2: // down
            x += 10;
        case 3: // left
            y -= 10;
    }
    
    window.game.head = [x, y];
    
    const oldHead = window.game.snake[window.game.tail];
    const newHead = [x, y];
    
    // Check if snake moves out of bounds or into wall (or own body)
    if (newHead[0] >= 0 && newHead[0] < window.game.w && newHead[1] >= 0 && newHead[1] < window_game.h) {
        if (newHead[0] == oldHead[0]) { // into own body
            window.game.alive = false;
            return;
        }
    } else if (newHead[0] >= 0 && newHead[0] < window_game.w && newHead[1] >= 0 && newHead[1] < window_game.h) {
        const cellHasFood = newHead[0] >= 0 && newHead[0] < window_game.w && newHead[1] >= 0 && newHead[1] < window_game.h && (window.game.food[0] == newHead[0] || 
            window.game.food[1] == newHead[1]));
        if (!cellHasFood) {
            // Grow snake and increase score
            const tailIdx = window.game.indexOf(newHead, 'tail');
            if (tailIdx == -1) { // grow head to the next cell in snake array
                window.game.snake.push([newHead[0], newHead[1]]);
                window.game.score++;
                window.game.health--; // add health for growth
            } else {
                const previousTail = window.game.snake[tailIdx - 1];
                if (previousTail.length >= 3) { // snake must be length at least 3
                    window.game.snake.splice(tailIdx, 0, [newHead[0], newHead[1]]);
                    window.game.score++;
                }
            }
        } else {
            // Grow snake and increase score if it eats food
            const tailIdx = window.game.indexOf(newHead, 'tail');
            if (tailIdx == -1) { // grow head to the next cell in snake array
                window.game.snake.push([newHead[0], newHead[1]]);
                window.game.score++;
            } else {
                const previousTail = window.game.snake[tailIdx - 1];
                if (previousTail.length >= 3) { // snake must be length at least 3
                    window.game.snake.splice(tailIdx, 0, [newHead[0], newHead[1]]);
                    window.game.score++;
                }
            }
        }
    } else {
        window.game.snake = [newHead, ...window.game.snake.slice(1)];
        window.game.score++;
    }
}

function reset() {
    window.game.reset();
}

window.game = { w: 400, h: 400, reset(), tick(), setDir('up'|'down'|'left'|'right'), setFood(x,y), snake: [[0,0],[5,0],[10,0], [20,20], ...], food: [], alive: false };
</script>

<script>
function reset() {
    window.game.reset();
}
</script>

</body>
</html>
