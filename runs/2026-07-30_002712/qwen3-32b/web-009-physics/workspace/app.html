<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bouncing Ball Physics</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }
        #controls {
            margin-bottom: 10px;
        }
        canvas {
            border: 1px solid #555;
            background-color: #222;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="drop">Drop</button>
        <button id="play">Play</button>
        <button id="clear">Clear</button>
    </div>
    <canvas id="sim" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');

        let balls = [];
        const gravity = 1.5;
        const restitution = 0.8;

        let animationId = null;
        let lastTime = 0;
        let isRunning = false;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const b of balls) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fillStyle = '#0f0';
                ctx.fill();
            }
        }

        function animate(currentTime) {
            if (!isRunning) return;
            const dt = (currentTime - lastTime) / 1000; // seconds
            window.sim.step(dt);
            lastTime = currentTime;
            animationId = requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            window.sim.addBall(x, y);
        });

        document.getElementById('drop').addEventListener('click', () => {
            window.sim.addBall(canvas.width / 2, 50, 0, 0, 20);
        });

        document.getElementById('clear').addEventListener('click', () => {
            window.sim.clear();
        });

        document.getElementById('play').addEventListener('click', () => {
            if (isRunning) {
                cancelAnimationFrame(animationId);
                isRunning = false;
                document.getElementById('play').textContent = 'Play';
            } else {
                lastTime = performance.now();
                animate(lastTime);
                isRunning = true;
                document.getElementById('play').textContent = 'Pause';
            }
        });

        window.sim = {
            w: canvas.width,
            h: canvas.height,
            balls() {
                return balls.map(b => ({ ...b }));
            },
            addBall(x, y, vx=0, vy=0, r=20) {
                const radius = r || 20;
                balls.push({ x, y, vx, vy, r: radius });
            },
            clear() {
                balls = [];
            },
            step(dt) {
                for (let b of balls) {
                    // Apply gravity
                    b.vy += gravity * dt;

                    // Update position and handle collisions with walls
                    // X-axis
                    b.x += b.vx * dt;
                    if (b.x - b.r < 0) {
                        b.x = b.r;
                        b.vx *= -restitution;
                    } else if (b.x + b.r > this.w) {
                        b.x = this.w - b.r;
                        b.vx *= -restitution;
                    }

                    // Y-axis
                    b.y += b.vy * dt;
                    if (b.y - b.r < 0) {
                        b.y = b.r;
                        b.vy *= -restitution;
                    } else if (b.y + b.r > this.h) {
                        b.y = this.h - b.r;
                        b.vy *= -restitution;
                    }
                }

                draw();
            },
        };
    </script>
</body>
</html>
