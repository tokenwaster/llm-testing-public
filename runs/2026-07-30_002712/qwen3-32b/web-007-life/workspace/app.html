<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Conway's Game of Life</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #container {
      text-align: center;
    }
    canvas {
      image-rendering: pixelated;
      background-color: #111;
      display: block;
      margin-bottom: 20px;
    }
    #controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      background: #333;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="life" width="400" height="400"></canvas>
    <div id="controls">
      <button id="step">Step</button>
      <button id="play">Play</button>
      <button id="random">Random</button>
      <button id="clear">Clear</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');
    const w = 50;
    const h = 50;
    const cellSize = canvas.width / w;

    let grid = Array.from({ length: w }, () => Array(h).fill(0));
    let running = false;
    let intervalId;

    function drawGrid() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          if (grid[x][y] === 1) {
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    function countNeighbors(x, y) {
      let count = 0;
      for (let dx of [-1, 0, 1]) {
        for (let dy of [-1, 0, 1]) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            count += grid[nx][ny];
          }
        }
      }
      return count;
    }

    function computeNextGrid() {
      let next = Array.from({ length: w }, () => Array(h).fill(0));
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          const alive = grid[x][y];
          const neighbors = countNeighbors(x, y);
          if (alive) {
            next[x][y] = (neighbors === 2 || neighbors === 3 ? 1 : 0);
          } else {
            next[x][y] = (neighbors === 3 ? 1 : 0);
          }
        }
      }
      return next;
    }

    window.life = {
      w,
      h,
      get(x, y) {
        if (x >= 0 && x < w && y >= 0 && y < h) return grid[x][y];
        return 0;
      },
      set(x, y, v) {
        if (x >= 0 && x < w && y >= 0 && y < h) {
          grid[x][y] = v ? 1 : 0;
          drawGrid();
        }
      },
      step() {
        const next = computeNextGrid();
        grid = next;
        drawGrid();
      },
      clear() {
        for (let x = 0; x < w; x++) {
          for (let y = 0; y < h; y++) {
            grid[x][y] = 0;
          }
        }
        drawGrid();
      }
    };

    canvas.addEventListener('mousedown', startToggle);
    canvas.addEventListener('mouseup', stopToggle);
    canvas.addEventListener('mouseout', stopToggle);
    canvas.addEventListener('mousemove', handleDrag);

    let dragging = false;

    function startToggle(e) {
      dragging = true;
      toggleCell(e);
    }

    function stopToggle() {
      dragging = false;
    }

    function toggleCell(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / cellSize);
      const y = Math.floor((e.clientY - rect.top) / cellSize);
      if (x >= 0 && x < w && y >= 0 && y < h) {
        window.life.set(x, y, 1 - grid[x][y]);
      }
    }

    function handleDrag(e) {
      if (dragging) toggleCell(e);
    }

    document.getElementById('step').addEventListener('click', () => window.life.step());
    const playBtn = document.getElementById('play');
    playBtn.addEventListener('click', () => {
      running = !running;
      playBtn.textContent = running ? 'Pause' : 'Play';
      if (running) {
        intervalId = setInterval(() => window.life.step(), 150);
      } else {
        clearInterval(intervalId);
      }
    });
    document.getElementById('random').addEventListener('click', () => {
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          grid[x][y] = Math.random() < 0.2 ? 1 : 0;
        }
      }
      drawGrid();
    });
    document.getElementById('clear').addEventListener('click', () => window.life.clear());

    drawGrid();
  </script>
</body>
</html>
