<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #12121c;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    gap: 20px;
  }
  h1 { margin: 0; font-size: 44px; letter-spacing: 3px; font-weight: 800; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 360px;
    margin-bottom: 4px;
  }
  #score {
    background: #2a2a3e;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 700;
    min-width: 96px;
    text-align: center;
  }
  #reset {
    background: #f65e3b;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #reset:hover { background: #ff6f4c; }
  #reset:active { transform: translateY(1px); }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 12px;
    padding: 12px;
    background: #1b1b2b;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #26263a;
    border-radius: 6px;
    font-size: 30px;
    font-weight: 700;
    color: #f9f6f2;
    user-select: none;
  }
  .cell.filled { background: #eee4da; color: #776e65; }
  .cell[data-value="2"]   { background:#eee4da; color:#776e65; }
  .cell[data-value="4"]   { background:#ede0c8; color:#776e65; }
  .cell[data-value="8"]   { background:#f2b179; color:#f9f6f2; }
  .cell[data-value="16"]  { background:#f59563; color:#f9f6f2; }
  .cell[data-value="32"]  { background:#f67c5f; color:#f9f6f2; }
  .cell[data-value="64"]  { background:#f65e3b; color:#f9f6f2; }
  .cell[data-value="128"] { background:#edcf72; color:#f9f6f2; font-size:28px; }
  .cell[data-value="256"] { background:#edcc61; color:#f9f6f2; font-size:28px; }
  .cell[data-value="512"] { background:#edc850; color:#f9f6f2; font-size:28px; }
  .cell[data-value="1024"]{ background:#edc53f; color:#f9f6f2; font-size:24px; }
  .cell[data-value="2048"]{ background:#edc22e; color:#f9f6f2; font-size:24px; }
  .cell[data-value^="3"]  { background:#3c3a32; color:#f9f6f2; font-size:22px; }
  .hint { font-size: 13px; color: #8a8aa0; margin-top: 4px; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="topbar">
    <div id="score">0</div>
    <button id="reset">New Game</button>
  </div>
  <div id="board"></div>
  <div class="hint">Use the arrow keys to play.</div>

<script>
(function () {
  "use strict";

  var SIZE = 4;
  var board = [];
  var currentScore = 0;

  var COLORS = {
    2: "#eee4da", 4: "#ede0c8", 8: "#f2b179", 16: "#f59563",
    32: "#f67c5f", 64: "#f65e3b", 128: "#edcf72", 256: "#edcc61",
    512: "#edc850", 1024: "#edc53f", 2048: "#edc22e"
  };

  // Slide a single line toward index 0, merging equal adjacent tiles once.
  // Returns { result, gained }.
  function slideLine(line) {
    var nonZero = [];
    for (var i = 0; i < line.length; i++) {
      if (line[i] !== 0) nonZero.push(line[i]);
    }
    var result = [];
    var gained = 0;
    var j = 0;
    while (j < nonZero.length) {
      if (j + 1 < nonZero.length && nonZero[j] === nonZero[j + 1]) {
        var merged = nonZero[j] * 2;
        result.push(merged);
        gained += merged;
        j += 2;
      } else {
        result.push(nonZero[j]);
        j += 1;
      }
    }
    while (result.length < line.length) result.push(0);
    return { result: result, gained: gained };
  }

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < SIZE; r++) {
      b.push(new Array(SIZE).fill(0));
    }
    return b;
  }

  function spawnTile() {
    var empties = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return;
    var pick = empties[Math.floor(Math.random() * empties.length)];
    board[pick[0]][pick[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    var scoreEl = document.getElementById("score");
    if (scoreEl) scoreEl.textContent = String(currentScore);

    var boardEl = document.getElementById("board");
    if (!boardEl) return;
    boardEl.innerHTML = "";
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var val = board[r][c];
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = String(r);
        cell.dataset.c = String(c);
        if (val !== 0) {
          cell.classList.add("filled");
          cell.dataset.value = String(val);
          cell.textContent = String(val);
          var color = COLORS[val];
          if (!color) {
            // Fallback for very large values.
            color = "#3c3a32";
          }
          cell.style.backgroundColor = color;
        }
        boardEl.appendChild(cell);
      }
    }
  }

  function reset() {
    board = emptyBoard();
    currentScore = 0;
    spawnTile();
    spawnTile();
    render();
  }

  function move(dir) {
    if (dir !== "left" && dir !== "right" && dir !== "up" && dir !== "down") {
      return false;
    }

    var moved = false;
    var scoreGained = 0;

    if (dir === "left" || dir === "right") {
      for (var r = 0; r < SIZE; r++) {
        var line = board[r].slice();
        if (dir === "right") line.reverse();
        var res = slideLine(line);
        if (dir === "right") res.result.reverse();
        for (var c = 0; c < SIZE; c++) {
          if (board[r][c] !== res.result[c]) moved = true;
          board[r][c] = res.result[c];
        }
        scoreGained += res.gained;
      }
    } else { // up or down
      for (var cc = 0; cc < SIZE; cc++) {
        var col = [];
        for (var rr = 0; rr < SIZE; rr++) col.push(board[rr][cc]);
        if (dir === "down") col.reverse();
        var res2 = slideLine(col);
        if (dir === "down") res2.result.reverse();
        for (var rr2 = 0; rr2 < SIZE; rr2++) {
          if (board[rr2][cc] !== res2.result[rr2]) moved = true;
          board[rr2][cc] = res2.result[rr2];
        }
        scoreGained += res2.gained;
      }
    }

    currentScore += scoreGained;

    if (moved) {
      spawnTile();
      render();
    }

    return moved;
  }

  function board() {
    return board.map(function (row) { return row.slice(); });
  }

  function setBoard(arr) {
    if (!Array.isArray(arr)) return;
    board = arr.map(function (row) { return row.slice(); });
    render();
  }

  function score() {
    return currentScore;
  }

  var game = {
    size: SIZE,
    reset: reset,
    move: move,
    board: board,
    setBoard: setBoard,
    score: score
  };

  window.game = game;

  // Keyboard controls.
  var KEY_MAP = {
    "ArrowLeft": "left",
    "ArrowRight": "right",
    "ArrowUp": "up",
    "ArrowDown": "down",
    "a": "left", "A": "left",
    "d": "right", "D": "right",
    "w": "up", "W": "up",
    "s": "down", "S": "down"
  };

  window.addEventListener("keydown", function (e) {
    var dir = KEY_MAP[e.key];
    if (dir) {
      e.preventDefault();
      game.move(dir);
    }
  });

  document.getElementById("reset").addEventListener("click", function () {
    game.reset();
  });

  // Start the first game.
  reset();
})();
</script>
</body>
</html>
