<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouncing Ball Playground</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #controls {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
  }
  button {
    padding: 8px 18px;
    background: #2a2a3a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  button:hover { background: #3a3a4a; }
  #sim {
    display: block;
    background: #1a1a2e;
    border: 2px solid #333;
    border-radius: 8px;
    cursor: pointer;
    width: 600px;
    height: 600px;
  }
</style>
</head>
<body>
<div id="controls">
  <button id="drop">Drop</button>
  <button id="play">Play</button>
  <button id="clear">Clear</button>
</div>
<canvas id="sim" width="600" height="600"></canvas>
<script>
(function() {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const gravity = 0.5;
  const restitution = 0.8;
  let balls = [];
  let animating = false;
  let rafId = null;

  function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    for (const b of balls) {
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.restore();
      // highlight
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fill();
    }
  }

  function addBall(x, y, vx = 0, vy = 0, r = 10) {
    const hue = Math.random() * 360;
    balls.push({ x, y, vx, vy, r, color: `hsl(${hue},80%,60%)` });
  }

  function clearBalls() {
    balls.length = 0;
  }

  function step(dt = 1) {
    for (const b of balls) {
      b.vy += gravity * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.x - b.r < 0) {
        b.x = b.r;
        if (b.vx < 0) b.vx = -b.vx * restitution;
      }
      if (b.x + b.r > W) {
        b.x = W - b.r;
        if (b.vx > 0) b.vx = -b.vx * restitution;
      }
      if (b.y - b.r < 0) {
        b.y = b.r;
        if (b.vy < 0) b.vy = -b.vy * restitution;
      }
      if (b.y + b.r > H) {
        b.y = H - b.r;
        if (b.vy > 0) b.vy = -b.vy * restitution;
      }
    }
    draw();
  }

  function loop() {
    if (!animating) return;
    step(1);
    rafId = requestAnimationFrame(loop);
  }

  // Expose API
  window.sim = {
    get w() { return W; },
    get h() { return H; },
    balls() {
      return balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r }));
    },
    addBall,
    clear: clearBalls,
    step,
  };

  // Button handlers
  document.getElementById('drop').addEventListener('click', () => {
    addBall(W / 2, 20, 0, 0, 12);
    if (!animating) draw();
  });

  document.getElementById('play').addEventListener('click', () => {
    animating = !animating;
    document.getElementById('play').textContent = animating ? 'Pause' : 'Play';
    if (animating) loop();
  });

  document.getElementById('clear').addEventListener('click', () => {
    clearBalls();
    draw();
  });

  // Canvas click adds a ball
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    addBall(x, y, (Math.random() - 0.5) * 4, 0, 10 + Math.random() * 8);
    if (!animating) draw();
  });

  // Initial draw
  draw();
})();
</script>
</body>
</html>
