<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #121212;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
  }
  h1 {
    margin: 0 0 1rem 0;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .score-container {
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 12px;
    background: #1e1e1e;
    padding: 12px;
    border-radius: 8px;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    border-radius: 6px;
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
    user-select: none;
  }
  button#reset {
    margin-top: 1.5rem;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    background: #3a3a3a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button#reset:hover {
    background: #4a4a4a;
  }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="score-container">Score: <span id="score">0</span></div>
  <div id="board"></div>
  <button id="reset">New Game</button>

<script>
(function() {
  const size = 4;
  let grid = [];
  let score = 0;
  let cellEls = [];

  function createEmptyGrid() {
    const g = [];
    for (let r = 0; r < size; r++) {
      g.push(new Array(size).fill(0));
    }
    return g;
  }

  function buildBoardDOM() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    cellEls = [];
    for (let r = 0; r < size; r++) {
      const rowEls = [];
      for (let c = 0; c < size; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardEl.appendChild(cell);
        rowEls.push(cell);
      }
      cellEls.push(rowEls);
    }
  }

  function render() {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const val = grid[r][c];
        const cell = cellEls[r][c];
        cell.textContent = val === 0 ? '' : val;
        let bg = '#2a2a2a';
        let fg = '#ffffff';
        if (val !== 0) {
          const map = {
            2: '#3a4a3a', 4: '#455a45', 8: '#506050', 16: '#5b705b',
            32: '#668066', 64: '#718f71', 128: '#d9c27e', 256: '#e0cc8a',
            512: '#e8d696', 1024: '#f0e0a2', 2048: '#f8e8b0'
          };
          bg = map[val] || '#f8e8b0';
          fg = val <= 64 ? '#ffffff' : '#000000';
        }
        cell.style.background = bg;
        cell.style.color = fg;
      }
    }
    const scoreEl = document.getElementById('score');
    if (scoreEl) scoreEl.textContent = score;
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (grid[r][c] === 0) empties.push([r, c]);
      }
    }
    if (empties.length === 0) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function collapseLine(line) {
    const result = [];
    let scoreGained = 0;
    let i = 0;
    while (i < line.length) {
      if (i < line.length - 1 && line[i] === line[i + 1]) {
        const merged = line[i] * 2;
        result.push(merged);
        scoreGained += merged;
        i += 2;
      } else {
        result.push(line[i]);
        i += 1;
      }
    }
    return { result, scoreGained };
  }

  function doMove(dir) {
    if (dir !== 'left' && dir !== 'right' && dir !== 'up' && dir !== 'down') return false;
    const newGrid = createEmptyGrid();
    let scoreGained = 0;

    if (dir === 'left' || dir === 'right') {
      for (let r = 0; r < size; r++) {
        let line = grid[r].slice();
        if (dir === 'right') line.reverse();
        line = line.filter(v => v !== 0);
        const { result, scoreGained: sg } = collapseLine(line);
        scoreGained += sg;
        while (result.length < size) result.push(0);
        if (dir === 'right') result.reverse();
        newGrid[r] = result;
      }
    } else {
      for (let c = 0; c < size; c++) {
        let line = [];
        for (let r = 0; r < size; r++) line.push(grid[r][c]);
        if (dir === 'down') line.reverse();
        line = line.filter(v => v !== 0);
        const { result, scoreGained: sg } = collapseLine(line);
        scoreGained += sg;
        while (result.length < size) result.push(0);
        if (dir === 'down') result.reverse();
        for (let r = 0; r < size; r++) newGrid[r][c] = result[r];
      }
    }

    let moved = false;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (grid[r][c] !== newGrid[r][c]) {
          moved = true;
          break;
        }
      }
      if (moved) break;
    }

    if (moved) {
      grid = newGrid;
      score += scoreGained;
      addRandomTile();
      render();
      return true;
    }
    return false;
  }

  function resetGame() {
    grid = createEmptyGrid();
    score = 0;
    let added = 0;
    while (added < 2) {
      const r = Math.floor(Math.random() * size);
      const c = Math.floor(Math.random() * size);
      if (grid[r][c] === 0) {
        grid[r][c] = 2;
        added++;
      }
    }
    render();
  }

  window.game = {
    size: 4,
    reset: resetGame,
    move: function(dir) { return doMove(dir); },
    board: function() { return grid.map(row => row.slice()); },
    setBoard: function(arr) {
      grid = arr.map(row => row.slice());
      render();
    },
    score: function() { return score; }
  };

  buildBoardDOM();
  resetGame();

  document.getElementById('reset').addEventListener('click', resetGame);
  window.addEventListener('keydown', function(e) {
    let dir = null;
    if (e.key === 'ArrowLeft') dir = 'left';
    else if (e.key === 'ArrowRight') dir = 'right';
    else if (e.key === 'ArrowUp') dir = 'up';
    else if (e.key === 'ArrowDown') dir = 'down';
    if (dir) {
      e.preventDefault();
      doMove(dir);
    }
  });
})();
</script>
</body>
</html>
