<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball Playground</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0d0d12;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  #sim {
    background: #16161d;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    cursor: crosshair;
    touch-action: none;
    width: 500px;
    height: 500px;
  }
  .controls {
    display: flex;
    gap: 12px;
  }
  button {
    background: #23232e;
    color: #fff;
    border: 1px solid #3a3a48;
    padding: 10px 20px;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover {
    background: #32323f;
  }
  button:active {
    transform: translateY(1px);
  }
  .hint {
    font-size: 13px;
    color: #777;
    margin: 0;
  }
</style>
</head>
<body>
  <canvas id="sim" width="500" height="500"></canvas>
  <div class="controls">
    <button id="drop">Drop Ball</button>
    <button id="play">Pause</button>
    <button id="clear">Clear</button>
  </div>
  <p class="hint">Click the canvas to add a ball.</p>

  <script>
    (function() {
      const canvas = document.getElementById('sim');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const GRAVITY = 0.3;
      const REST = 0.85;

      let ballsList = [];
      let playing = true;
      let animationId = null;

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const b of ballsList) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
        }
      }

      function step(dt = 1) {
        for (const b of ballsList) {
          b.vy += GRAVITY * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          if (b.x - b.r < 0) {
            b.x = b.r;
            b.vx = Math.abs(b.vx) * REST;
          } else if (b.x + b.r > w) {
            b.x = w - b.r;
            b.vx = -Math.abs(b.vx) * REST;
          }

          if (b.y - b.r < 0) {
            b.y = b.r;
            b.vy = Math.abs(b.vy) * REST;
          } else if (b.y + b.r > h) {
            b.y = h - b.r;
            b.vy = -Math.abs(b.vy) * REST;
          }
        }
        draw();
      }

      window.sim = {
        w: w,
        h: h,
        balls: function() {
          return ballsList.map(b => ({
            x: b.x,
            y: b.y,
            vx: b.vx,
            vy: b.vy,
            r: b.r
          }));
        },
        addBall: function(x, y, vx = 0, vy = 0, r) {
          const radius = (typeof r === 'number') ? r : (12 + Math.random() * 8);
          ballsList.push({
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            r: radius,
            color: `hsl(${Math.floor(Math.random() * 360)}, 85%, 65%)`
          });
          draw();
        },
        clear: function() {
          ballsList = [];
          draw();
        },
        step: step
      };

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        window.sim.addBall(x, y, 0, 0);
      });

      const playBtn = document.getElementById('play');
      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? 'Pause' : 'Play';
        if (playing) {
          loop();
        } else if (animationId) {
          cancelAnimationFrame(animationId);
        }
      });

      document.getElementById('drop').addEventListener('click', () => {
        const x = 20 + Math.random() * (w - 40);
        window.sim.addBall(x, 30, 0, 0);
      });

      document.getElementById('clear').addEventListener('click', () => {
        window.sim.clear();
      });

      function loop() {
        if (!playing) return;
        step(1);
        animationId = requestAnimationFrame(loop);
      }

      loop();
    })();
  </script>
</body>
</html>
