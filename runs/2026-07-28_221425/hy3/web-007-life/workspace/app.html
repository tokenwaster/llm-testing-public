<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  body {
    background: #121212;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  h1 {
    margin: 0 0 16px 0;
    color: #0f0;
    text-shadow: 0 0 10px rgba(0,255,0,0.5);
    font-weight: 800;
    letter-spacing: 2px;
  }
  canvas {
    background: #1e1e1e;
    border: 2px solid #333;
    border-radius: 6px;
    cursor: crosshair;
    box-shadow: 0 0 20px rgba(0,255,128,0.15);
    margin-bottom: 20px;
    touch-action: none;
    user-select: none;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #2a2a2a;
    color: #0f0;
    border: 2px solid #0f0;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s ease-in-out;
  }
  button:hover {
    background: #0f0;
    color: #121212;
    box-shadow: 0 0 12px rgba(0,255,0,0.6);
  }
  button:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>
  <h1>Game of Life</h1>
  <canvas id="life"></canvas>
  <div class="controls">
    <button id="step">Step</button>
    <button id="play">Play</button>
    <button id="random">Random</button>
    <button id="clear">Clear</button>
  </div>
  <script>
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');
    
    const cssSize = 400;
    const w = 50;
    const h = 50;
    const cellSize = cssSize / w;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cssSize * dpr;
    canvas.height = cssSize * dpr;
    canvas.style.width = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    ctx.scale(dpr, dpr);
    
    let grid = new Uint8Array(w * h);
    let isMouseDown = false;
    let paintValue = 1;
    let lastX = -1;
    let lastY = -1;
    
    function draw() {
      ctx.fillStyle = '#1e1e1e';
      ctx.fillRect(0, 0, cssSize, cssSize);
      ctx.fillStyle = '#0f0';
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (grid[y * w + x]) {
            ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
          }
        }
      }
    }
    
    function stepGen() {
      const next = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let neighbors = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              const nx = x + dx;
              const ny = y + dy;
              if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                neighbors += grid[ny * w + nx];
              }
            }
          }
          const idx = y * w + x;
          if (grid[idx]) {
            next[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
          } else {
            next[idx] = (neighbors === 3) ? 1 : 0;
          }
        }
      }
      grid = next;
      draw();
    }
    
    function clearGrid() {
      grid.fill(0);
      draw();
    }
    
    window.life = {
      w,
      h,
      get(x, y) {
        if (x < 0 || x >= w || y < 0 || y >= h) return 0;
        return grid[y * w + x];
      },
      set(x, y, v) {
        if (x < 0 || x >= w || y < 0 || y >= h) return;
        grid[y * w + x] = v ? 1 : 0;
        draw();
      },
      step() {
        stepGen();
      },
      clear() {
        clearGrid();
      }
    };
    
    document.getElementById('step').addEventListener('click', () => {
      stepGen();
    });
    
    const playBtn = document.getElementById('play');
    let playInterval = null;
    playBtn.addEventListener('click', () => {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        playBtn.textContent = 'Play';
      } else {
        playInterval = setInterval(stepGen, 100);
        playBtn.textContent = 'Pause';
      }
    });
    
    document.getElementById('random').addEventListener('click', () => {
      for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.random() < 0.2 ? 1 : 0;
      }
      draw();
    });
    
    document.getElementById('clear').addEventListener('click', () => {
      clearGrid();
    });
    
    function getCell(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((clientX - rect.left) / rect.width) * w);
      const y = Math.floor(((clientY - rect.top) / rect.height) * h);
      return {x, y};
    }
    
    canvas.addEventListener('mousedown', e => {
      isMouseDown = true;
      const {x, y} = getCell(e.clientX, e.clientY);
      if (x >= 0 && x < w && y >= 0 && y < h) {
        paintValue = grid[y * w + x] ? 0 : 1;
        window.life.set(x, y, paintValue);
        lastX = x; lastY = y;
      }
    });
    canvas.addEventListener('mousemove', e => {
      if (!isMouseDown) return;
      const {x, y} = getCell(e.clientX, e.clientY);
      if (x >= 0 && x < w && y >= 0 && y < h) {
        if (x !== lastX || y !== lastY) {
          window.life.set(x, y, paintValue);
          lastX = x; lastY = y;
        }
      }
    });
    window.addEventListener('mouseup', () => {
      isMouseDown = false;
      lastX = -1; lastY = -1;
    });
    
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      isMouseDown = true;
      const {x, y} = getCell(e.touches[0].clientX, e.touches[0].clientY);
      if (x >= 0 && x < w && y >= 0 && y < h) {
        paintValue = grid[y * w + x] ? 0 : 1;
        window.life.set(x, y, paintValue);
        lastX = x; lastY = y;
      }
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isMouseDown) return;
      const {x, y} = getCell(e.touches[0].clientX, e.touches[0].clientY);
      if (x >= 0 && x < w && y >= 0 && y < h) {
        if (x !== lastX || y !== lastY) {
          window.life.set(x, y, paintValue);
          lastX = x; lastY = y;
        }
      }
    }, {passive: false});
    window.addEventListener('touchend', () => {
      isMouseDown = false;
      lastX = -1; lastY = -1;
    });
    
    draw();
  </script>
</body>
</html>
