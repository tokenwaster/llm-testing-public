<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Sand Sandbox</title>
<style>
  body {
    margin: 0;
    background: #121212;
    color: #e0e0e0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #ccc;
  }
  #sand {
    width: 500px;
    height: 500px;
    background: #0a0a0a;
    border: 1px solid #333;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
  }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 520px;
  }
  button {
    background: #1e1e1e;
    color: #eee;
    border: 1px solid #444;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #2a2a2a; }
  button.material.active {
    background: #3a3a3a;
    border-color: #999;
    box-shadow: 0 0 0 2px #666 inset;
  }
  #clear {
    background: #4a1e1e;
    border-color: #733;
  }
  #clear:hover { background: #5a2a2a; }
</style>
</head>
<body>
  <div class="app">
    <h1>Falling Sand Sandbox</h1>
    <canvas id="sand"></canvas>
    <div class="controls">
      <button id="mat-sand" class="material active">Sand</button>
      <button id="mat-water" class="material">Water</button>
      <button id="mat-wall" class="material">Wall</button>
      <button id="mat-acid" class="material">Acid</button>
      <button id="mat-empty" class="material">Eraser</button>
      <button id="clear">Clear</button>
    </div>
  </div>

<script>
(function () {
  const w = 100, h = 100;
  const EMPTY = 0, SAND = 1, WATER = 2, WALL = 3, ACID = 4;
  const grid = new Uint8Array(w * h);
  const updated = new Uint8Array(w * h);

  const matMap = { empty: EMPTY, sand: SAND, water: WATER, wall: WALL, acid: ACID };
  const matNames = ['empty', 'sand', 'water', 'wall', 'acid'];

  function step() {
    updated.fill(0);
    for (let y = h - 1; y >= 0; y--) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (updated[i]) continue;
        const m = grid[i];
        if (m === EMPTY || m === WALL) continue;

        if (m === SAND) {
          if (y < h - 1) {
            const below = i + w;
            const b = grid[below];
            if (b === EMPTY) {
              grid[below] = SAND; grid[i] = EMPTY; updated[below] = 1; continue;
            } else if ((b === WATER || b === ACID) && !updated[below]) {
              grid[below] = SAND; grid[i] = b; updated[below] = 1; updated[i] = 1; continue;
            } else {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let moved = false;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= w) continue;
                const diag = below + dx;
                const d = grid[diag];
                if (d === EMPTY) {
                  grid[diag] = SAND; grid[i] = EMPTY; updated[diag] = 1; moved = true; break;
                } else if ((d === WATER || d === ACID) && !updated[diag]) {
                  grid[diag] = SAND; grid[i] = d; updated[diag] = 1; updated[i] = 1; moved = true; break;
                }
              }
              if (moved) continue;
            }
          }
        } else if (m === WATER || m === ACID) {
          if (m === ACID) {
            const targets = [];
            if (y < h - 1) {
              const d = grid[i + w];
              if (d === SAND || d === WALL) targets.push(i + w);
            }
            if (x > 0) {
              const l = grid[i - 1];
              if (l === SAND || l === WALL) targets.push(i - 1);
            }
            if (x < w - 1) {
              const r = grid[i + 1];
              if (r === SAND || r === WALL) targets.push(i + 1);
            }
            for (const t of targets) grid[t] = EMPTY;
          }

          if (y < h - 1) {
            const below = i + w;
            if (grid[below] === EMPTY) {
              grid[below] = m; grid[i] = EMPTY; updated[below] = 1; continue;
            } else {
              const dir = Math.random() < 0.5 ? -1 : 1;
              let moved = false;
              for (const dx of [dir, -dir]) {
                const nx = x + dx;
                if (nx < 0 || nx >= w) continue;
                const diag = below + dx;
                if (grid[diag] === EMPTY) {
                  grid[diag] = m; grid[i] = EMPTY; updated[diag] = 1; moved = true; break;
                }
              }
              if (moved) continue;
            }
          }

          const dir = Math.random() < 0.5 ? -1 : 1;
          for (const dx of [dir, -dir]) {
            const nx = x + dx;
            if (nx < 0 || nx >= w) continue;
            const side = i + dx;
            if (grid[side] === EMPTY) {
              grid[side] = m; grid[i] = EMPTY; updated[side] = 1; break;
            }
          }
        }
      }
    }
  }

  const canvas = document.getElementById('sand');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const colors = [
    [18, 18, 18],
    [222, 185, 100],
    [64, 132, 223],
    [130, 130, 130],
    [120, 230, 90],
  ];

  function render() {
    const data = img.data;
    for (let i = 0; i < grid.length; i++) {
      const c = colors[grid[i]];
      const o = i * 4;
      data[o] = c[0];
      data[o + 1] = c[1];
      data[o + 2] = c[2];
      data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  let currentMat = 'sand';
  let painting = false;
  let lastX = null, lastY = null;
  const brushRadius = 2;

  function paintAt(cx, cy) {
    for (let dy = -brushRadius; dy <= brushRadius; dy++) {
      for (let dx = -brushRadius; dx <= brushRadius; dx++) {
        if (dx * dx + dy * dy <= brushRadius * brushRadius) {
          sim.set(cx + dx, cy + dy, currentMat);
        }
      }
    }
  }

  function getCell(e) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / rect.width * w);
    const y = Math.floor((e.clientY - rect.top) / rect.height * h);
    return { x, y };
  }

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    painting = true;
    const { x, y } = getCell(e);
    lastX = x; lastY = y;
    paintAt(x, y);
    render();
  });
  canvas.addEventListener('mousemove', e => {
    if (!painting) return;
    const { x, y } = getCell(e);
    const dist = Math.max(Math.abs(x - lastX), Math.abs(y - lastY));
    if (dist === 0) {
      paintAt(x, y);
    } else {
      for (let i = 0; i <= dist; i++) {
        const ix = Math.round(lastX + (x - lastX) * i / dist);
        const iy = Math.round(lastY + (y - lastY) * i / dist);
        paintAt(ix, iy);
      }
    }
    lastX = x; lastY = y;
    render();
  });
  window.addEventListener('mouseup', () => { painting = false; lastX = lastY = null; });

  const matButtons = {
    '#mat-sand': 'sand',
    '#mat-water': 'water',
    '#mat-wall': 'wall',
    '#mat-acid': 'acid',
    '#mat-empty': 'empty',
  };
  Object.entries(matButtons).forEach(([id, mat]) => {
    const btn = document.querySelector(id);
    btn.addEventListener('click', () => {
      currentMat = mat;
      document.querySelectorAll('button.material').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.getElementById('clear').addEventListener('click', () => {
    sim.clear();
    render();
  });

  window.sim = {
    w,
    h,
    tick(n) {
      n = n || 0;
      if (n < 0) n = 0;
      for (let k = 0; k < n; k++) step();
      render();
    },
    get(x, y) {
      if (x < 0 || x >= w || y < 0 || y >= h) return 'empty';
      return matNames[grid[y * w + x]];
    },
    set(x, y, material) {
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      const code = matMap[material];
      if (code === undefined) return;
      grid[y * w + x] = code;
    },
    clear() {
      grid.fill(0);
    }
  };

  function frame() {
    step();
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
