<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Visualizer</title>
<style>
  * { box-sizing: border-box; }
  body {
      background: #121212;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
  }
  h1 {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 10px;
  }
  #bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      height: 60vh;
      width: 90%;
      max-width: 800px;
      margin-bottom: 20px;
      border-bottom: 2px solid #333;
  }
  .bar {
      background: #4fc3f7;
      flex: 1;
      transition: height 0.05s linear, background-color 0.05s linear;
  }
  .bar.active {
      background: #ff5252;
  }
  .controls {
      display: flex;
      gap: 10px;
  }
  button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      transition: background 0.2s;
  }
  button:hover {
      background: #555;
  }
</style>
</head>
<body>
  <h1>Sorting Visualizer</h1>
  <div id="bars"></div>
  <div class="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>
  <script>
  (function() {
      const barsContainer = document.getElementById('bars');
      let arr = [];
      let maxVal = 1;
      let barEls = [];
      let sortState = { i: 0, j: 0, swapped: false, done: true };
      let sortToken = 0;
      let baseArr = [];

      function computeMax() {
          maxVal = 1;
          for (let k = 0; k < arr.length; k++) {
              if (arr[k] > maxVal) maxVal = arr[k];
          }
      }

      function resetSortState() {
          sortState = {
              i: 0,
              j: 0,
              swapped: false,
              done: arr.length <= 1
          };
      }

      function render() {
          while (barEls.length < arr.length) {
              let bar = document.createElement('div');
              bar.className = 'bar';
              barsContainer.appendChild(bar);
              barEls.push(bar);
          }
          while (barEls.length > arr.length) {
              let bar = barEls.pop();
              barsContainer.removeChild(bar);
          }
          for (let k = 0; k < arr.length; k++) {
              barEls[k].style.height = (arr[k] / maxVal * 100) + '%';
              barEls[k].classList.remove('active');
          }
      }

      function sorted() {
          for (let k = 0; k < arr.length - 1; k++) {
              if (arr[k] > arr[k + 1]) return false;
          }
          return true;
      }

      function sortStep() {
          if (sortState.done) return true;
          if (arr.length <= 1) { sortState.done = true; return true; }

          let j = sortState.j;

          if (arr[j] > arr[j + 1]) {
              let tmp = arr[j];
              arr[j] = arr[j + 1];
              arr[j + 1] = tmp;
              sortState.swapped = true;
          }

          render();
          if (barEls[j]) barEls[j].classList.add('active');
          if (barEls[j + 1]) barEls[j + 1].classList.add('active');

          sortState.j++;
          if (sortState.j >= arr.length - sortState.i - 1) {
              if (!sortState.swapped) {
                  sortState.done = true;
                  render();
                  return true;
              }
              sortState.i++;
              sortState.j = 0;
              sortState.swapped = false;
              if (sortState.i >= arr.length - 1) {
                  sortState.done = true;
                  render();
                  return true;
              }
          }
          return false;
      }

      function setArray(a) {
          arr = a.slice();
          baseArr = arr.slice();
          computeMax();
          resetSortState();
          render();
      }

      window.viz = {
          array: function() { return arr.slice(); },
          setArray: function(a) { setArray(a); },
          sortStep: function() { return sortStep(); },
          sorted: function() { return sorted(); }
      };

      function makeRandomArray(n) {
          let a = [];
          for (let i = 0; i < n; i++) {
              a.push(Math.floor(Math.random() * 95) + 5);
          }
          return a;
      }

      document.getElementById('sort').addEventListener('click', async () => {
          let myToken = ++sortToken;
          while (myToken === sortToken) {
              let done = window.viz.sortStep();
              if (done) break;
              await new Promise(r => setTimeout(r, 20));
          }
      });

      document.getElementById('shuffle').addEventListener('click', () => {
          sortToken++;
          setArray(makeRandomArray(30));
      });

      document.getElementById('reset').addEventListener('click', () => {
          sortToken++;
          setArray(baseArr.slice());
      });

      // Initialize
      setArray(makeRandomArray(30));
  })();
  </script>
</body>
</html>
