<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falling Sand Sandbox</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --panel-color: #1a1a24;
      --border-color: #2a2a35;
      --text-color: #f1f1f3;
      --text-muted: #8e8e9f;
      
      --sand-color: #ffd166;
      --water-color: #06d6a0;
      --wall-color: #8d99ae;
      --acid-color: #ef476f;
      --empty-color: #4a4e69;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 10px;
    }

    .container {
      background-color: var(--panel-color);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
      color: var(--text-color);
    }

    .canvas-container {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border-color);
      background-color: #121215;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    #sand {
      display: block;
      width: 500px;
      height: 500px;
      max-width: 90vw;
      max-height: 90vw;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .material-selectors {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background-color: #242430;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background-color: #2d2d3d;
      border-color: #44445c;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Active Material Styles */
    #mat-sand .indicator { background-color: var(--sand-color); }
    #mat-water .indicator { background-color: var(--water-color); }
    #mat-wall .indicator { background-color: var(--wall-color); }
    #mat-acid .indicator { background-color: var(--acid-color); }
    #mat-empty .indicator { background-color: var(--empty-color); }

    .btn.active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    #mat-sand.active { border-color: var(--sand-color); box-shadow: 0 0 8px rgba(255, 209, 102, 0.3); }
    #mat-water.active { border-color: var(--water-color); box-shadow: 0 0 8px rgba(6, 214, 160, 0.3); }
    #mat-wall.active { border-color: var(--wall-color); box-shadow: 0 0 8px rgba(141, 153, 174, 0.3); }
    #mat-acid.active { border-color: var(--acid-color); box-shadow: 0 0 8px rgba(239, 71, 111, 0.3); }
    #mat-empty.active { border-color: var(--empty-color); box-shadow: 0 0 8px rgba(74, 78, 105, 0.3); }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #15151f;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .slider-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .slider-group input[type="range"] {
      cursor: pointer;
      width: 100px;
      accent-color: #3f51b5;
    }

    #clear {
      background-color: #2d1a24;
      border-color: #5c2c3a;
    }

    #clear:hover {
      background-color: #3d202e;
      border-color: #7a3549;
    }

    .btn-secondary {
      background-color: #1e1e2d;
      border-color: var(--border-color);
    }
    
    .btn-secondary:hover {
      background-color: #28283d;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FALLING SAND CA SANDBOX</h1>

    <div class="canvas-container">
      <canvas id="sand" width="120" height="120"></canvas>
    </div>

    <div class="controls-wrapper">
      <div class="material-selectors">
        <button class="btn active" id="mat-sand">
          <span class="indicator"></span> Sand
        </button>
        <button class="btn" id="mat-water">
          <span class="indicator"></span> Water
        </button>
        <button class="btn" id="mat-wall">
          <span class="indicator"></span> Wall
        </button>
        <button class="btn" id="mat-acid">
          <span class="indicator"></span> Acid
        </button>
        <button class="btn" id="mat-empty">
          <span class="indicator"></span> Eraser
        </button>
      </div>

      <div class="action-row">
        <div class="slider-group">
          <label for="brush-size">Brush</label>
          <input type="range" id="brush-size" min="1" max="8" value="3">
          <span id="brush-val" style="font-size: 0.85rem; min-width: 12px;">3</span>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" id="btn-pause">Pause</button>
          <button class="btn" id="clear">Clear All</button>
        </div>
      </div>
    </div>

    <div class="status-text">
      Drag mouse/touch to paint. Sand sinks in liquids. Acid eats sand & walls.
    </div>
  </div>

  <script>
    // --- Grid Setup ---
    const w = 120;
    const h = 120;
    const grid = new Uint8Array(w * h);
    const updated = new Uint8Array(w * h);

    const matIds = {
      empty: 0,
      sand: 1,
      water: 2,
      wall: 3,
      acid: 4
    };

    const matNames = ["empty", "sand", "water", "wall", "acid"];

    // Canvas references
    const canvas = document.getElementById('sand');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(w, h);
    const data = imgData.data;

    let currentMaterial = 1; // Default to Sand
    let isPainting = false;
    let brushSize = 3;
    let isPaused = false;

    // --- Core API implementation ---
    window.sim = {
      w: w,
      h: h,
      tick: function(n) {
        for (let i = 0; i < n; i++) {
          doTick();
        }
        render();
      },
      get: function(x, y) {
        if (x < 0 || x >= w || y < 0 || y >= h) return "empty";
        return matNames[grid[y * w + x]];
      },
      set: function(x, y, material) {
        if (x < 0 || x >= w || y < 0 || y >= h) return;
        const id = matIds[material];
        if (id !== undefined) {
          grid[y * w + x] = id;
        }
      },
      clear: function() {
        grid.fill(0);
        render();
      }
    };

    // --- Simulation Physics Loop ---
    function doTick() {
      updated.fill(0);

      // Process from bottom to top
      for (let y = h - 1; y >= 0; y--) {
        // Randomize horizontal sweep direction to prevent horizontal movement bias
        const leftToRight = Math.random() < 0.5;
        for (let xOffset = 0; xOffset < w; xOffset++) {
          const x = leftToRight ? xOffset : (w - 1 - xOffset);
          const idx = y * w + x;
          const t = grid[idx];

          if (t === 0 || t === 3) continue; // Empty or Wall doesn't move
          if (updated[idx]) continue; // Already updated in this frame

          if (t === 1) { // Sand
            processSand(x, y, idx);
          } else if (t === 2) { // Water
            processWater(x, y, idx);
          } else if (t === 4) { // Acid
            processAcid(x, y, idx);
          }
        }
      }
    }

    // --- Sand Physics ---
    function processSand(x, y, idx) {
      if (y + 1 >= h) return; // Reached bottom boundary

      const belowIdx = (y + 1) * w + x;
      const belowT = grid[belowIdx];

      if (belowT === 0) { // Empty below
        grid[belowIdx] = 1;
        grid[idx] = 0;
        updated[belowIdx] = 1;
      } else if (belowT === 2 || belowT === 4) { // Sinks in Water or Acid
        displaceLiquid(x, y, idx, belowIdx, belowT);
      } else { // Blocked below: Try diagonals
        const dir = Math.random() < 0.5 ? 1 : -1;
        if (!trySandMove(x, y, idx, dir)) {
          trySandMove(x, y, idx, -dir);
        }
      }
    }

    function trySandMove(x, y, idx, dir) {
      const nx = x + dir;
      const ny = y + 1;
      if (nx < 0 || nx >= w || ny >= h) return false;

      const targetIdx = ny * w + nx;
      const targetT = grid[targetIdx];

      if (targetT === 0) {
        grid[targetIdx] = 1;
        grid[idx] = 0;
        updated[targetIdx] = 1;
        return true;
      } else if (targetT === 2 || targetT === 4) {
        return displaceLiquid(x, y, idx, targetIdx, targetT);
      }
      return false;
    }

    // Physical Sanity check: Displace liquid to nearby air/space instead of raw teleport
    function displaceLiquid(x, y, idx, targetIdx, liquidType) {
      // Find empty space to displace liquid. Look around nearby areas
      const candidates = [
        {cx: x - 1, cy: y},
        {cx: x + 1, cy: y},
        {cx: x - 1, cy: y - 1},
        {cx: x + 1, cy: y - 1},
        {cx: x - 1, cy: y + 1},
        {cx: x + 1, cy: y + 1}
      ];

      // Shuffle candidates to keep displacement organic
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = candidates[i];
        candidates[i] = candidates[j];
        candidates[j] = temp;
      }

      for (const cand of candidates) {
        if (cand.cx >= 0 && cand.cx < w && cand.cy >= 0 && cand.cy < h) {
          const candIdx = cand.cy * w + cand.cx;
          if (grid[candIdx] === 0) {
            grid[candIdx] = liquidType;
            grid[targetIdx] = 1; // Sand takes target space
            grid[idx] = 0;
            updated[candIdx] = 1;
            updated[targetIdx] = 1;
            updated[idx] = 1;
            return true;
          }
        }
      }

      // If fully trapped, perform a local swap (standard fallback)
      grid[targetIdx] = 1;
      grid[idx] = liquidType;
      updated[targetIdx] = 1;
      updated[idx] = 1;
      return true;
    }

    // --- Water Physics ---
    function processWater(x, y, idx) {
      // Fall down
      if (y + 1 < h) {
        const belowIdx = (y + 1) * w + x;
        if (grid[belowIdx] === 0) {
          grid[belowIdx] = 2;
          grid[idx] = 0;
          updated[belowIdx] = 1;
          return;
        }
      }

      // Try diagonal fall
      const dir = Math.random() < 0.5 ? 1 : -1;
      if (tryWaterMoveDiag(x, y, idx, dir)) return;
      if (tryWaterMoveDiag(x, y, idx, -dir)) return;

      // Spreads horizontally
      if (tryWaterMoveSide(x, y, idx, dir)) return;
      if (tryWaterMoveSide(x, y, idx, -dir)) return;
    }

    function tryWaterMoveDiag(x, y, idx, dir) {
      const nx = x + dir;
      const ny = y + 1;
      if (nx < 0 || nx >= w || ny >= h) return false;
      const targetIdx = ny * w + nx;
      if (grid[targetIdx] === 0) {
        grid[targetIdx] = 2;
        grid[idx] = 0;
        updated[targetIdx] = 1;
        return true;
      }
      return false;
    }

    function tryWaterMoveSide(x, y, idx, dir) {
      const nx = x + dir;
      if (nx < 0 || nx >= w) return false;
      const targetIdx = y * w + nx;
      if (grid[targetIdx] === 0) {
        grid[targetIdx] = 2;
        grid[idx] = 0;
        updated[targetIdx] = 1;
        return true;
      }
      return false;
    }

    // --- Acid Physics ---
    function processAcid(x, y, idx) {
      // Acid first attempts to dissolve sand or wall below/beside
      if (tryAcidDissolve(x, y, idx)) return;

      // If not dissolving, moves exactly like water
      if (y + 1 < h) {
        const belowIdx = (y + 1) * w + x;
        if (grid[belowIdx] === 0) {
          grid[belowIdx] = 4;
          grid[idx] = 0;
          updated[belowIdx] = 1;
          return;
        }
      }

      const dir = Math.random() < 0.5 ? 1 : -1;
      if (tryAcidMoveDiag(x, y, idx, dir)) return;
      if (tryAcidMoveDiag(x, y, idx, -dir)) return;

      if (tryAcidMoveSide(x, y, idx, dir)) return;
      if (tryAcidMoveSide(x, y, idx, -dir)) return;
    }

    function tryAcidDissolve(x, y, idx) {
      const neighbors = [
        {nx: x, ny: y + 1}, // Below
        {nx: x - 1, ny: y}, // Left
        {nx: x + 1, ny: y}  // Right
      ];

      // Randomize check order for realistic acid dispersion
      for (let i = neighbors.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = neighbors[i];
        neighbors[i] = neighbors[j];
        neighbors[j] = temp;
      }

      for (const n of neighbors) {
        if (n.nx >= 0 && n.nx < w && n.ny >= 0 && n.ny < h) {
          const targetIdx = n.ny * w + n.nx;
          const targetT = grid[targetIdx];
          if (targetT === 1 || targetT === 3) { // Dissolves Sand or Wall
            grid[targetIdx] = 0; // Dissolved target
            grid[idx] = 0;       // Dissolved self (acid)
            // No need to set update flag as they both become empty
            return true;
          }
        }
      }
      return false;
    }

    function tryAcidMoveDiag(x, y, idx, dir) {
      const nx = x + dir;
      const ny = y + 1;
      if (nx < 0 || nx >= w || ny >= h) return false;
      const targetIdx = ny * w + nx;
      if (grid[targetIdx] === 0) {
        grid[targetIdx] = 4;
        grid[idx] = 0;
        updated[targetIdx] = 1;
        return true;
      }
      return false;
    }

    function tryAcidMoveSide(x, y, idx, dir) {
      const nx = x + dir;
      if (nx < 0 || nx >= w) return false;
      const targetIdx = y * w + nx;
      if (grid[targetIdx] === 0) {
        grid[targetIdx] = 4;
        grid[idx] = 0;
        updated[targetIdx] = 1;
        return true;
      }
      return false;
    }

    // --- Rendering Logic ---
    function render() {
      let pixelIdx = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const t = grid[y * w + x];
          let r = 18, g = 18, b = 21; // Empty dark background

          if (t === 1) { // Sand
            const rand = (x * 17 + y * 37) % 5;
            r = 250 + rand * 1;
            g = 200 + rand * 3;
            b = 100 + rand * 2;
          } else if (t === 2) { // Water
            const rand = (x * 13 + y * 29) % 5;
            r = 10 + rand * 2;
            g = 130 + rand * 4;
            b = 210 + rand * 5;
          } else if (t === 3) { // Wall
            const rand = (x * 71 + y * 97) % 8;
            const val = 120 + rand * 4;
            r = val; g = val; b = val + 10;
          } else if (t === 4) { // Acid
            const rand = (x * 23 + y * 53) % 6;
            r = 239 + rand * 2;
            g = 71 + rand * 4;
            b = 111 + rand * 2;
          }

          data[pixelIdx] = r;
          data[pixelIdx + 1] = g;
          data[pixelIdx + 2] = b;
          data[pixelIdx + 3] = 255;
          pixelIdx += 4;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // --- Brush Painting Event Handlers ---
    function handlePaint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = w / rect.width;
      const scaleY = h / rect.height;
      const gridX = Math.floor((clientX - rect.left) * scaleX);
      const gridY = Math.floor((clientY - rect.top) * scaleY);

      for (let dy = -brushSize; dy <= brushSize; dy++) {
        for (let dx = -brushSize; dx <= brushSize; dx++) {
          if (dx * dx + dy * dy <= brushSize * brushSize) {
            const px = gridX + dx;
            const py = gridY + dy;
            if (px >= 0 && px < w && py >= 0 && py < h) {
              const currentT = grid[py * w + px];
              // Eraser (empty) and Wall override everything. Others do not paint over Walls.
              if (currentMaterial === 0 || currentMaterial === 3) {
                grid[py * w + px] = currentMaterial;
              } else {
                if (currentT !== 3) {
                  grid[py * w + px] = currentMaterial;
                }
              }
            }
          }
        }
      }
      render();
    }

    // Mouse events
    canvas.addEventListener('mousedown', (e) => {
      isPainting = true;
      handlePaint(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (isPainting) {
        handlePaint(e.clientX, e.clientY);
      }
    });

    window.addEventListener('mouseup', () => {
      isPainting = false;
    });

    // Touch events for mobile compatibility
    canvas.addEventListener('touchstart', (e) => {
      isPainting = true;
      if (e.touches[0]) {
        handlePaint(e.touches[0].clientX, e.touches[0].clientY);
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (isPainting && e.touches[0]) {
        handlePaint(e.touches[0].clientX, e.touches[0].clientY);
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      isPainting = false;
    });

    // --- Control Selectors UI ---
    const matButtons = {
      sand: document.getElementById('mat-sand'),
      water: document.getElementById('mat-water'),
      wall: document.getElementById('mat-wall'),
      acid: document.getElementById('mat-acid'),
      empty: document.getElementById('mat-empty')
    };

    function setActiveBtn(activeKey) {
      Object.keys(matButtons).forEach(key => {
        if (key === activeKey) {
          matButtons[key].classList.add('active');
        } else {
          matButtons[key].classList.remove('active');
        }
      });
    }

    matButtons.sand.addEventListener('click', () => { currentMaterial = 1; setActiveBtn('sand'); });
    matButtons.water.addEventListener('click', () => { currentMaterial = 2; setActiveBtn('water'); });
    matButtons.wall.addEventListener('click', () => { currentMaterial = 3; setActiveBtn('wall'); });
    matButtons.acid.addEventListener('click', () => { currentMaterial = 4; setActiveBtn('acid'); });
    matButtons.empty.addEventListener('click', () => { currentMaterial = 0; setActiveBtn('empty'); });

    document.getElementById('clear').addEventListener('click', () => {
      window.sim.clear();
    });

    // Brush slider
    const brushSlider = document.getElementById('brush-size');
    const brushValSpan = document.getElementById('brush-val');
    brushSlider.addEventListener('input', (e) => {
      brushSize = parseInt(e.target.value);
      brushValSpan.innerText = brushSize;
    });

    // Pause button
    const btnPause = document.getElementById('btn-pause');
    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPause.innerText = isPaused ? "Resume" : "Pause";
      btnPause.style.borderColor = isPaused ? "var(--sand-color)" : "var(--border-color)";
    });

    // --- Main Game Loop ---
    function loop() {
      if (!isPaused) {
        doTick();
        render();
      }
      requestAnimationFrame(loop);
    }

    // Initialize with a simple platform at the bottom
    for (let x = 20; x < w - 20; x++) {
      grid[(h - 20) * w + x] = 3; // wall
    }

    // Start simulation
    loop();
  </script>
</body>
</html>
