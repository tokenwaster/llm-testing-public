<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <style>
    /* Dark Theme & Cyber Grid UI */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Container holding the app */
    .container {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4), 0 0 40px rgba(16, 185, 129, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 100%;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.05em;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* Stats Dashboard */
    .stats-panel {
      display: flex;
      gap: 24px;
      background-color: #1f2937;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid #374151;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-label {
      color: #9ca3af;
    }

    .stat-val {
      color: #10b981;
      font-family: monospace;
      font-size: 1rem;
    }

    /* Canvas styling */
    #life {
      display: block;
      background: #0d1117;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.05);
      border: 2px solid #374151;
      cursor: crosshair;
      touch-action: none; /* Prevent scrolling when dragging on mobile */
      width: 500px;
      height: 500px;
    }

    /* Control Panel */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    button {
      background-color: #374151;
      color: #f3f4f6;
      border: none;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      border-bottom: 3px solid #1f2937;
    }

    button:hover {
      background-color: #4b5563;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      border-bottom-width: 1px;
    }

    /* Main playful action states */
    #play {
      background-color: #059669;
      border-color: #047857;
    }
    #play:hover {
      background-color: #10b981;
    }
    #play.playing {
      background-color: #ef4444;
      border-color: #b91c1c;
    }
    #play.playing:hover {
      background-color: #f87171;
    }

    #clear {
      background-color: #4b5563;
      border-color: #374151;
    }
    #clear:hover {
      background-color: #6b7280;
    }

    /* Presets selection bar */
    .presets-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #1f2937;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #374151;
    }

    .presets-label {
      font-size: 0.8rem;
      color: #9ca3af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preset-pill {
      background: none;
      border: 1px solid #4b5563;
      color: #9ca3af;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-pill:hover {
      color: #f3f4f6;
      background-color: #374151;
      border-color: #10b981;
    }

    /* Playful Slider */
    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 300px;
      margin-top: 5px;
    }

    .slider-group label {
      font-size: 0.8rem;
      color: #9ca3af;
      font-weight: 600;
      min-width: 50px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #374151;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    @media (max-width: 540px) {
      #life {
        width: 320px;
        height: 320px;
      }
      .container {
        padding: 16px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Game of Life</h1>
      <p class="subtitle">Drag to draw / Standard Conway B3/S23 rules</p>
    </header>

    <div class="stats-panel">
      <div class="stat-item">
        <span class="stat-label">Generation:</span>
        <span id="gen-count" class="stat-val">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Alive:</span>
        <span id="alive-count" class="stat-val">0</span>
      </div>
    </div>

    <!-- The Grid Canvas -->
    <canvas id="life" width="500" height="500"></canvas>

    <!-- Controls -->
    <div class="controls">
      <button id="play">Play</button>
      <button id="step">Step</button>
      <button id="random">Random</button>
      <button id="clear">Clear</button>
    </div>

    <!-- Presets -->
    <div class="presets-container">
      <span class="presets-label">Presets:</span>
      <button class="preset-pill" onclick="loadPreset('glider')">Glider</button>
      <button class="preset-pill" onclick="loadPreset('pulsar')">Pulsar</button>
      <button class="preset-pill" onclick="loadPreset('pentadecathlon')">Blinker</button>
    </div>

    <!-- Speed Slider -->
    <div class="slider-group">
      <label for="speed">Interval</label>
      <input type="range" id="speed" min="50" max="600" value="120" step="10">
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('life');
      const ctx = canvas.getContext('2d');
      
      const playBtn = document.getElementById('play');
      const stepBtn = document.getElementById('step');
      const randomBtn = document.getElementById('random');
      const clearBtn = document.getElementById('clear');
      const speedSlider = document.getElementById('speed');

      // Grid dimensions (must be >= 40 each)
      const w = 50;
      const h = 50;

      // Primary internal grid representation (1D array of 0s and 1s)
      let grid = new Uint8Array(w * h);
      let generation = 0;
      
      // Simulation state
      let isPlaying = false;
      let lastTickTime = 0;

      // Draw helper: Rounded Rectangle
      function drawRoundRect(context, x, y, width, height, radius) {
        if (width < 2 * radius) radius = width / 2;
        if (height < 2 * radius) radius = height / 2;
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + width, y, x + width, y + height, radius);
        context.arcTo(x + width, y + height, x, y + height, radius);
        context.arcTo(x, y + height, x, y, radius);
        context.arcTo(x, y, x + width, y, radius);
        context.closePath();
        context.fill();
      }

      // Redraw the entire grid on the canvas
      function draw() {
        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cellW = canvas.width / w;
        const cellH = canvas.height / h;
        let aliveCount = 0;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const isAlive = grid[y * w + x];
            if (isAlive) {
              aliveCount++;
              // Emerald Neon Alive Cells
              ctx.fillStyle = '#10b981';
              drawRoundRect(ctx, x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2, 2.5);
            } else {
              // Deep Slate Recessed Dead Cells
              ctx.fillStyle = '#1f2937';
              drawRoundRect(ctx, x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2, 1.5);
            }
          }
        }

        // Update counts in DOM
        document.getElementById('gen-count').textContent = generation;
        document.getElementById('alive-count').textContent = aliveCount;
      }

      // Graded Contract API Definition
      window.life = {
        w: w,
        h: h,

        get: function (x, y) {
          if (x < 0 || x >= w || y < 0 || y >= h) return 0;
          return grid[y * w + x] ? 1 : 0;
        },

        set: function (x, y, v) {
          if (x >= 0 && x < w && y >= 0 && y < h) {
            grid[y * w + x] = v ? 1 : 0;
            draw();
          }
        },

        step: function () {
          const next = new Uint8Array(w * h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              let neighbors = 0;
              // Sum 8 neighbors with strict boundary conditions (edges are dead/0)
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx === 0 && dy === 0) continue;
                  const nx = x + dx;
                  const ny = y + dy;
                  if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    neighbors += grid[ny * w + nx];
                  }
                }
              }

              const idx = y * w + x;
              const current = grid[idx];
              // Apply B3/S23 rules simultaneously
              if (current === 1) {
                next[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
              } else {
                next[idx] = (neighbors === 3) ? 1 : 0;
              }
            }
          }
          grid = next;
          generation++;
          draw();
        },

        clear: function () {
          grid.fill(0);
          generation = 0;
          draw();
        }
      };

      // Play/Pause Auto-Run Loop
      function animationLoop(timestamp) {
        if (!isPlaying) return;
        const speed = parseInt(speedSlider.value);
        if (timestamp - lastTickTime >= speed) {
          window.life.step();
          lastTickTime = timestamp;
        }
        requestAnimationFrame(animationLoop);
      }

      // UI Actions
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playBtn.textContent = 'Pause';
          playBtn.classList.add('playing');
          lastTickTime = performance.now();
          requestAnimationFrame(animationLoop);
        } else {
          playBtn.textContent = 'Play';
          playBtn.classList.remove('playing');
        }
      });

      stepBtn.addEventListener('click', () => {
        // Pause if auto-running, then advance exactly one step
        if (isPlaying) {
          playBtn.click();
        }
        window.life.step();
      });

      randomBtn.addEventListener('click', () => {
        for (let i = 0; i < grid.length; i++) {
          grid[i] = Math.random() < 0.3 ? 1 : 0;
        }
        generation = 0;
        draw();
      });

      clearBtn.addEventListener('click', () => {
        if (isPlaying) {
          playBtn.click();
        }
        window.life.clear();
      });

      // Interactive Drawing & Drag Painting
      let isDrawing = false;
      let paintMode = 1; // 1 to seed alive, 0 to erase dead
      let lastX = -1;
      let lastY = -1;

      function getCellFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = Math.floor((clientX - rect.left) * scaleX / (canvas.width / w));
        const y = Math.floor((clientY - rect.top) * scaleY / (canvas.height / h));
        return { x, y };
      }

      function handleStart(e) {
        e.preventDefault();
        const { x, y } = getCellFromEvent(e);
        if (x >= 0 && x < w && y >= 0 && y < h) {
          isDrawing = true;
          paintMode = window.life.get(x, y) === 1 ? 0 : 1;
          window.life.set(x, y, paintMode);
          lastX = x;
          lastY = y;
        }
      }

      function handleMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCellFromEvent(e);
        if (x >= 0 && x < w && y >= 0 && y < h) {
          if (x !== lastX || y !== lastY) {
            window.life.set(x, y, paintMode);
            lastX = x;
            lastY = y;
          }
        }
      }

      function handleEnd() {
        isDrawing = false;
        lastX = -1;
        lastY = -1;
      }

      canvas.addEventListener('mousedown', handleStart);
      canvas.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);

      canvas.addEventListener('touchstart', handleStart, { passive: false });
      canvas.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleEnd);

      // Predefined Playful Presets loader
      window.loadPreset = function (type) {
        if (isPlaying) {
          playBtn.click();
        }
        window.life.clear();
        const cx = Math.floor(w / 2);
        const cy = Math.floor(h / 2);

        if (type === 'glider') {
          window.life.set(cx, cy - 1, 1);
          window.life.set(cx + 1, cy, 1);
          window.life.set(cx - 1, cy + 1, 1);
          window.life.set(cx, cy + 1, 1);
          window.life.set(cx + 1, cy + 1, 1);
        } else if (type === 'pulsar') {
          const pulsarCoords = [
            [-2, -1], [-3, -1], [-4, -1], [-6, -2], [-6, -3], [-6, -4], [-1, -2], [-1, -3], [-1, -4], [-2, -6], [-3, -6], [-4, -6],
            [2, -1], [3, -1], [4, -1], [6, -2], [6, -3], [6, -4], [1, -2], [1, -3], [1, -4], [2, -6], [3, -6], [4, -6],
            [-2, 1], [-3, 1], [-4, 1], [-6, 2], [-6, 3], [-6, 4], [-1, 2], [-1, 3], [-1, 4], [-2, 6], [-3, 6], [-4, 6],
            [2, 1], [3, 1], [4, 1], [6, 2], [6, 3], [6, 4], [1, 2], [1, 3], [1, 4], [2, 6], [3, 6], [4, 6]
          ];
          pulsarCoords.forEach(([ox, oy]) => window.life.set(cx + ox, cy + oy, 1));
        } else if (type === 'pentadecathlon') {
          window.life.set(cx - 1, cy, 1);
          window.life.set(cx, cy, 1);
          window.life.set(cx + 1, cy, 1);
        }
      };

      // Initial state: Preload a classic glider and render
      loadPreset('glider');

    })();
  </script>
</body>
</html>
