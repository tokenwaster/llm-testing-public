<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithm Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      color: #e94560;
      font-size: 1.5rem;
    }

    #controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: #0f3460;
    }

    #sort {
      background: #0f3460;
    }

    #sort:hover {
      background: #1a4a7a;
    }

    #bars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      height: 400px;
      width: 90%;
      max-width: 900px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 4px;
      padding: 10px;
    }

    .bar {
      background: #e94560;
      flex: 1;
      min-width: 4px;
      border-radius: 2px 2px 0 0;
      transition: height 0.1s ease, background-color 0.1s ease;
    }
  </style>
</head>
<body>
  <h1>Sorting Algorithm Visualizer</h1>
  <div id="controls">
    <button id="sort">Sort</button>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>
  <div id="bars"></div>

  <script>
    let arr = [];
    let sortState = { i: 0, j: 0, done: true, swapped: false };
    let animationInterval = null;

    function init() {
      arr = [5, 3, 8, 1, 9, 2, 7, 4, 6];
      sortState = { i: 0, j: 0, done: true, swapped: false };
      drawBars();
    }

    function drawBars() {
      const container = document.getElementById('bars');
      container.innerHTML = '';
      const maxVal = Math.max(...arr, 1);

      arr.forEach(value => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = `${(value / maxVal) * 100}%`;
        container.appendChild(bar);
      });
    }

    window.viz = {
      array() {
        return [...arr];
      },

      setArray(a) {
        arr = [...a];
        sortState = { i: 0, j: 0, done: arr.length <= 1, swapped: false };
        drawBars();
      },

      sortStep() {
        if (sortState.done) return true;

        const n = arr.length;
        if (n <= 1) {
          sortState.done = true;
          return true;
        }

        if (arr[sortState.j] > arr[sortState.j + 1]) {
          [arr[sortState.j], arr[sortState.j + 1]] = [arr[sortState.j + 1], arr[sortState.j]];
          sortState.swapped = true;
          drawBars();
        }

        sortState.j++;

        if (sortState.j >= n - 1 - sortState.i) {
          if (!sortState.swapped) {
            sortState.done = true;
            return true;
          }
          sortState.swapped = false;
          sortState.i++;
          sortState.j = 0;

          if (sortState.i >= n - 1) {
            sortState.done = true;
            return true;
          }
        }

        return false;
      },

      sorted() {
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] > arr[i + 1]) return false;
        }
        return true;
      }
    };

    document.getElementById('sort').addEventListener('click', () => {
      if (animationInterval) clearInterval(animationInterval);
      animationInterval = setInterval(() => {
        if (window.viz.sortStep()) {
          clearInterval(animationInterval);
          animationInterval = null;
        }
      }, 50);
    });

    document.getElementById('shuffle').addEventListener('click', () => {
      if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
      }
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      sortState = { i: 0, j: 0, done: false, swapped: false };
      drawBars();
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
      }
      init();
    });

    init();
  </script>
</body>
</html>
