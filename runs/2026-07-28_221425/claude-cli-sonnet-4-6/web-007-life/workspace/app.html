<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conway's Game of Life</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    padding: 20px;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 4px;
    color: #39ff14;
    text-shadow: 0 0 10px #39ff1488;
  }
  #life {
    border: 2px solid #333;
    cursor: crosshair;
    display: block;
    box-shadow: 0 0 30px #39ff1422;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #1a1a1a;
    color: #39ff14;
    border: 1px solid #39ff14;
    padding: 10px 22px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  button:hover {
    background: #39ff14;
    color: #0d0d0d;
    box-shadow: 0 0 12px #39ff1488;
  }
  button.active {
    background: #39ff14;
    color: #0d0d0d;
    box-shadow: 0 0 16px #39ff14aa;
  }
  #gen {
    color: #666;
    font-size: 0.8rem;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<h1>GAME OF LIFE</h1>
<canvas id="life"></canvas>
<div class="controls">
  <button id="step">STEP</button>
  <button id="play">PLAY</button>
  <button id="random">RANDOM</button>
  <button id="clear">CLEAR</button>
</div>
<div id="gen">GEN: 0</div>

<script>
(function() {
  const W = 60, H = 60;
  const CELL = 10;
  const canvas = document.getElementById('life');
  canvas.width = W * CELL;
  canvas.height = H * CELL;
  const ctx = canvas.getContext('2d');

  let grid = new Uint8Array(W * H);
  let generation = 0;
  let running = false;
  let rafId = null;
  let lastTime = 0;
  const FPS = 12;
  const INTERVAL = 1000 / FPS;

  function idx(x, y) { return y * W + x; }

  function get(x, y) {
    if (x < 0 || x >= W || y < 0 || y >= H) return 0;
    return grid[idx(x, y)];
  }

  function set(x, y, v) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    grid[idx(x, y)] = v ? 1 : 0;
    draw();
  }

  function countNeighbours(x, y) {
    return get(x-1,y-1) + get(x,y-1) + get(x+1,y-1)
         + get(x-1,y)               + get(x+1,y)
         + get(x-1,y+1) + get(x,y+1) + get(x+1,y+1);
  }

  function step() {
    const next = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const alive = grid[idx(x, y)];
        const n = countNeighbours(x, y);
        if (alive) {
          next[idx(x, y)] = (n === 2 || n === 3) ? 1 : 0;
        } else {
          next[idx(x, y)] = (n === 3) ? 1 : 0;
        }
      }
    }
    grid = next;
    generation++;
    document.getElementById('gen').textContent = 'GEN: ' + generation;
    draw();
  }

  function clear() {
    grid = new Uint8Array(W * H);
    generation = 0;
    document.getElementById('gen').textContent = 'GEN: 0';
    draw();
  }

  function random() {
    for (let i = 0; i < grid.length; i++) {
      grid[i] = Math.random() < 0.3 ? 1 : 0;
    }
    generation = 0;
    document.getElementById('gen').textContent = 'GEN: 0';
    draw();
  }

  const ALIVE_COLOR = '#39ff14';
  const DEAD_COLOR = '#111111';
  const GRID_COLOR = '#1a1a1a';

  function draw() {
    ctx.fillStyle = DEAD_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = ALIVE_COLOR;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (grid[idx(x, y)]) {
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 1, CELL - 1);
        }
      }
    }

    ctx.strokeStyle = GRID_COLOR;
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= W; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, H * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(W * CELL, y * CELL);
      ctx.stroke();
    }
  }

  function loop(ts) {
    if (!running) return;
    if (ts - lastTime >= INTERVAL) {
      lastTime = ts;
      step();
    }
    rafId = requestAnimationFrame(loop);
  }

  function togglePlay() {
    running = !running;
    const btn = document.getElementById('play');
    if (running) {
      btn.textContent = 'PAUSE';
      btn.classList.add('active');
      lastTime = 0;
      rafId = requestAnimationFrame(loop);
    } else {
      btn.textContent = 'PLAY';
      btn.classList.remove('active');
      if (rafId) cancelAnimationFrame(rafId);
    }
  }

  document.getElementById('step').addEventListener('click', () => step());
  document.getElementById('play').addEventListener('click', () => togglePlay());
  document.getElementById('random').addEventListener('click', () => random());
  document.getElementById('clear').addEventListener('click', () => clear());

  let painting = false;
  let paintValue = 1;

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = Math.floor(((e.clientX - rect.left) * scaleX) / CELL);
    const cy = Math.floor(((e.clientY - rect.top) * scaleY) / CELL);
    return { cx, cy };
  }

  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    painting = true;
    const { cx, cy } = cellFromEvent(e);
    paintValue = get(cx, cy) ? 0 : 1;
    set(cx, cy, paintValue);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!painting) return;
    e.preventDefault();
    const { cx, cy } = cellFromEvent(e);
    set(cx, cy, paintValue);
  });

  window.addEventListener('mouseup', () => { painting = false; });

  window.life = {
    w: W,
    h: H,
    get: get,
    set: set,
    step: step,
    clear: clear
  };

  random();
})();
</script>
</body>
</html>
