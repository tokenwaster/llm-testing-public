<button id="export">Export CSV</button>
<textarea id="csv" rows="10" cols="80"></textarea>

<script>
window.sheet = {
  set: function(cellId, formula) {
    const cell = document.getElementById(cellId);
    if (formula && formula.startsWith("=")) {
      cell.value = formula;
    } else {
      cell.value = cell.value;
    }
  },
  get: function(cellId) {
    const cell = document.getElementById(cellId);
    return cell.value;
  },
  raw: function(cellId) {
    return document.getElementById(cellId).textContent;
  }
};

document.getElementById("export").addEventListener("click", () => {
  const csvData = [];
  for (let i = 1; i <= 10; i++) {
    let row = "";
    for (let j = 1; j <= 10; j++) {
      row += window.sheet.get(cellIdFromColumnsAndRows(j,i)) + ",";
    }
    csvData.push(row.slice(0,-1));
  }

  const textarea = document.getElementById("csv");
  textarea.value = csvData.join("\n");
});


function cellIdFromColumnsAndRows(column, row) {
  return "cell-" + column + row;
}
</script>
