<!DOCTYPE html>
<html>
<head>
<title>Snake Game</title>
<style>
body {
  background-color: #1e1e1e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

#snake-game {
  display: flex;
  gap: 20px;
}

.button {
  background-color: #333;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  color: white;
  border-radius: 5px;
}

#snake {
  width: 400px;
  height: 400px;
  position: relative;
}

.cell {
  width: 20px;
  height: 20px;
  border: 1px solid #555;
}

#score {
  font-size: 24px;
  color: white;
  margin-left: 20px;
}
</style>
</head>
<body>

<div id="snake-game">
    <canvas id="snake" width="400" height="400"></canvas>
    <div>
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
    </div>
    <div id="score">Score: 0</div>
</div>

<script>
const w = 15;
const h = 15;
let snake = [[7, 7], [6, 7], [5, 7]];
let food = [13, 7];
let score = 0;
let direction = 'right';
let gameInterval;

function draw() {
    const canvas = document.getElementById('snake');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < snake.length; i++) {
        const x = snake[i][0];
        const y = snake[i][1];
        ctx.fillStyle = 'green';
        ctx.fillRect(x * 20, y * 20, 20, 20);
    }

    ctx.fillStyle = 'red';
    ctx.fillRect(food[0] * 20, food[1] * 20, 20, 20);

    const scoreText = `Score: ${score}`;
    ctx.font = "16px Arial";
    ctx.fillStyle = "white";
    ctx.fillText(scoreText, 10, 20);
}

function update() {
    const headX = snake[0][0];
    const headY = snake[0][1];

    let newHead = [];
    if (direction === 'up') {
        newHead = [headX, headY - 1];
    } else if (direction === 'down') {
        newHead = [headX, headY + 1];
    } else if (direction === 'left') {
        newHead = [headX - 1, headY];
    } else {
        newHead = [headX + 1, headY];
    }

    if (newHead[0] < 0 || newHead[0] >= w || newHead[1] < 0 || newHead[1] >= h) {
        return false; // Collision with wall
    }

    for (let i = 0; i < snake.length; i++) {
        if (snake[i][0] === newHead[0] && snake[i][1] === newHead[1]) {
            return false; // Collision with self
        }
    }

    snake.unshift(newHead);

    if (newHead[0] === food[0] && newHead[1] === food[1]) {
        score += 10;
        food = [Math.floor(Math.random() * w), Math.floor(Math.random() * h)];
    } else {
        snake.pop();
    }

    return true;
}

function gameLoop() {
    if (!update()) {
        clearInterval(gameInterval);
        return;
    }

    draw();
    requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
    let newDirection;
    switch (e.key) {
        case 'ArrowUp':
            newDirection = 'up';
            break;
        case 'ArrowDown':
            newDirection = 'down';
            break;
        case 'ArrowLeft':
            newDirection = 'left';
            break;
        case 'ArrowRight':
            newDirection = 'right';
            break;
    }

    if (newDirection !== direction) {
        direction = newDirection;
    }
});

document.getElementById('start').addEventListener('click', () => {
    gameInterval = setInterval(gameLoop, 100);
});

window.reset = function() {
    snake = [[7, 7], [6, 7], [5, 7]];
    food = [13, 7];
    score = 0;
    direction = 'right';
    gameInterval = setInterval(gameLoop, 100);
};

window.setDir = function(newDir) {
    direction = newDir;
};

window.setFood = function(x, y) {
    food = [x, y];
};

window.snake = function() {
    return snake;
};

window.food = function() {
    return food;
};

window.alive = function() {
    return true; 
};

window.score = function() {
    return score;
};
</script>

</body>
</html>
