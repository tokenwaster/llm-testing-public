<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2048 - Dark Theme</title>
<style>
    :root {
        --bg-color: #1e1e1e;
        --board-bg: #bbadaa;
        --cell-bg: #cdc1b4;
        --tile-dark-2: #3c3a39;
        --text-light: #f8f7fa;
    }

    body { 
        background-color: var(--bg-color); 
        color: white; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
        font-family: 'Arial', sans-serif;
    }

    .container { 
        text-align: center; 
        width: 450px; 
        padding: 20px; 
        background-color: #3c3a39; 
        border-radius: 8px; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Score Display */
    #score { font-size: 2rem; margin-bottom: 15px; color: white; text-align: left; display: block;}

    /* Board Grid */
    #board { 
        width: 400px; height: 400px; background-color: var(--board-bg); border-radius: 8px; padding: 10px; margin-bottom: 20px; position: relative; box-sizing: content-box; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; 
    }
    
    .cell { background-color: var(--cell-bg); border-radius: 6px; box-shadow: inset 0 -3px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 30px; position: relative;}

    /* Tiles */
    .tile { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; box-shadow: inset 0 -3px rgba(0,0,0,0.2); transition: transform 0.1s ease-in-out;}
    
    /* Colors for Tiles (Dark Theme) */
    .tile[data-val="2"] { background-color: #5c5957; color: var(--text-light); }
    .tile[data-val="4"] { background-color: #6e6b68; color: var(--text-light); font-size: 30px;}
    
    /* Reset Button */
    button#reset { padding: 12px 24px; background-color: #edc22e; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; font-size: 1rem; }
    button#reset:hover { opacity: 0.9; }

</style>
</head>
