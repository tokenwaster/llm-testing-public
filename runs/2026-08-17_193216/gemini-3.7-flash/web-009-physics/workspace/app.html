<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball Physics Playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .playground {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #151821;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background: #202634;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: #2b3345;
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    button:active {
      transform: translateY(1px);
    }
    button#play {
      background: #1b4b40;
      border-color: #228b6d;
      color: #4ade80;
    }
    button#play:hover {
      background: #226052;
    }
    button#play.paused {
      background: #4a2d1d;
      border-color: #b45309;
      color: #fbbf24;
    }
    #sim {
      display: block;
      width: 600px;
      height: 500px;
      background: #0d0f14;
      border-radius: 10px;
      cursor: crosshair;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .hint {
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="playground">
    <div class="header">
      <h1>Physics Playground</h1>
      <div class="controls">
        <button id="drop">Drop Ball</button>
        <button id="play">Pause</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <canvas id="sim" width="600" height="500"></canvas>
    <div class="hint">Click anywhere on the canvas to spawn a ball</div>
  </div>

  <script>
    const canvas = document.getElementById('sim');
    const ctx = canvas.getContext('2d');
    const dropBtn = document.getElementById('drop');
    const playBtn = document.getElementById('play');
    const clearBtn = document.getElementById('clear');

    const W = 600;
    const H = 500;
    canvas.width = W;
    canvas.height = H;

    const GRAVITY = 0.35;
    const RESTITUTION = 0.82;
    const DEFAULT_RADIUS = 16;

    let balls = [];
    let isRunning = true;
    let animId = null;

    const COLORS = [
      '#38bdf8', '#818cf8', '#c084fc', '#f472b6',
      '#4ade80', '#fbbf24', '#fb7185', '#2dd4bf'
    ];

    function getRandomColor() {
      return COLORS[Math.floor(Math.random() * COLORS.length)];
    }

    function addBall(x = W / 2, y = 40, vx = 0, vy = 0, r = DEFAULT_RADIUS) {
      const radius = r !== undefined ? Number(r) : DEFAULT_RADIUS;
      let posX = Number(x !== undefined ? x : W / 2);
      let posY = Number(y !== undefined ? y : 40);

      // Clamp initial placement inside bounds
      posX = Math.max(radius, Math.min(W - radius, posX));
      posY = Math.max(radius, Math.min(H - radius, posY));

      const ball = {
        x: posX,
        y: posY,
        vx: Number(vx || 0),
        vy: Number(vy || 0),
        r: radius,
        color: getRandomColor()
      };
      balls.push(ball);
      draw();
      return ball;
    }

    function clear() {
      balls = [];
      draw();
    }

    function step(dt = 1) {
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];

        // Apply gravity
        b.vy += GRAVITY * dt;

        // Advance position
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // Left / Right Wall Collision
        if (b.x - b.r < 0) {
          b.x = b.r;
          b.vx = -b.vx * RESTITUTION;
        } else if (b.x + b.r > W) {
          b.x = W - b.r;
          b.vx = -b.vx * RESTITUTION;
        }

        // Top / Floor Collision
        if (b.y - b.r < 0) {
          b.y = b.r;
          b.vy = -b.vy * RESTITUTION;
        } else if (b.y + b.r > H) {
          b.y = H - b.r;
          b.vy = -b.vy * RESTITUTION;
        }
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Subtle background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const stepSize = 40;
      for (let x = 0; x <= W; x += stepSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y <= H; y += stepSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Draw each ball
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];

        // Soft outer glow
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();

        // Subtle highlight
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fill();

        // Border outline
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    function loop() {
      if (isRunning) {
        step(1);
      }
      animId = requestAnimationFrame(loop);
    }

    // Canvas click spawning
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const vx = (Math.random() - 0.5) * 8;
      const vy = (Math.random() - 0.5) * 6;
      addBall(x, y, vx, vy);
    });

    // Control buttons
    dropBtn.addEventListener('click', () => {
      const x = 50 + Math.random() * (W - 100);
      const vx = (Math.random() - 0.5) * 6;
      addBall(x, 30, vx, 0);
    });

    playBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      if (isRunning) {
        playBtn.textContent = 'Pause';
        playBtn.classList.remove('paused');
      } else {
        playBtn.textContent = 'Play';
        playBtn.classList.add('paused');
      }
    });

    clearBtn.addEventListener('click', () => {
      clear();
    });

    // Programmatic grading API
    window.sim = {
      w: W,
      h: H,
      balls: () => balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r })),
      addBall: (x, y, vx = 0, vy = 0, r = DEFAULT_RADIUS) => addBall(x, y, vx, vy, r),
      clear: () => clear(),
      step: (dt = 1) => step(dt)
    };

    // Initial balls
    addBall(200, 100, 3, 0);
    addBall(400, 150, -3, 0);

    // Start loop
    animId = requestAnimationFrame(loop);
  </script>
</body>
</html>
