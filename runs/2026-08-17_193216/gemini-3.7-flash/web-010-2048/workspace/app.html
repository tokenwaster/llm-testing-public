<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121213;
      color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 360px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-container {
      background: #27272a;
      padding: 6px 14px;
      border-radius: 6px;
      text-align: center;
      min-width: 80px;
    }

    .score-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #a1a1aa;
    }

    #score {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }

    #reset {
      background: #3f3f46;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #reset:hover {
      background: #52525b;
    }

    #board {
      width: 360px;
      height: 360px;
      background: #18181b;
      border: 2px solid #27272a;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
    }

    .cell {
      background: #27272a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #f4f4f5;
    }

    .tile-2    { background: #3f3f46; color: #f4f4f5; }
    .tile-4    { background: #52525b; color: #f4f4f5; }
    .tile-8    { background: #b45309; color: #ffffff; }
    .tile-16   { background: #c2410c; color: #ffffff; }
    .tile-32   { background: #b91c1c; color: #ffffff; }
    .tile-64   { background: #be123c; color: #ffffff; }
    .tile-128  { background: #ca8a04; color: #ffffff; font-size: 24px; }
    .tile-256  { background: #eab308; color: #18181b; font-size: 24px; }
    .tile-512  { background: #84cc16; color: #18181b; font-size: 24px; }
    .tile-1024 { background: #06b6d4; color: #18181b; font-size: 20px; }
    .tile-2048 { background: #8b5cf6; color: #ffffff; font-size: 20px; }
    .tile-super{ background: #ec4899; color: #ffffff; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="header-right">
        <div class="score-container">
          <div class="score-label">Score</div>
          <div id="score">0</div>
        </div>
        <button id="reset">New Game</button>
      </div>
    </header>
    <div id="board"></div>
  </div>

  <script>
    (function () {
      const SIZE = 4;
      let grid = [];
      let currentScore = 0;

      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const resetBtn = document.getElementById('reset');

      function initGrid() {
        grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      }

      function spawnTile() {
        const emptyCells = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) {
              emptyCells.push({ r, c });
            }
          }
        }
        if (emptyCells.length === 0) return false;
        const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        return true;
      }

      function render() {
        scoreEl.textContent = currentScore;
        boardEl.innerHTML = '';
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const val = grid[r][c];
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (val > 0) {
              cell.textContent = val;
              if (val <= 2048) {
                cell.classList.add('tile-' + val);
              } else {
                cell.classList.add('tile-super');
              }
            }
            boardEl.appendChild(cell);
          }
        }
      }

      function slideRow(row) {
        const filtered = row.filter(val => val !== 0);
        const result = [];
        let scoreGain = 0;
        let i = 0;
        while (i < filtered.length) {
          if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
            const mergedVal = filtered[i] * 2;
            result.push(mergedVal);
            scoreGain += mergedVal;
            i += 2;
          } else {
            result.push(filtered[i]);
            i++;
          }
        }
        while (result.length < SIZE) {
          result.push(0);
        }
        return { row: result, scoreGain };
      }

      function move(dir) {
        let changed = false;
        let totalGain = 0;
        const nextGrid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));

        if (dir === 'left') {
          for (let r = 0; r < SIZE; r++) {
            const { row, scoreGain } = slideRow(grid[r]);
            nextGrid[r] = row;
            totalGain += scoreGain;
          }
        } else if (dir === 'right') {
          for (let r = 0; r < SIZE; r++) {
            const reversed = [...grid[r]].reverse();
            const { row, scoreGain } = slideRow(reversed);
            nextGrid[r] = row.reverse();
            totalGain += scoreGain;
          }
        } else if (dir === 'up') {
          for (let c = 0; c < SIZE; c++) {
            const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
            const { row, scoreGain } = slideRow(col);
            for (let r = 0; r < SIZE; r++) {
              nextGrid[r][c] = row[r];
            }
            totalGain += scoreGain;
          }
        } else if (dir === 'down') {
          for (let c = 0; c < SIZE; c++) {
            const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
            const { row, scoreGain } = slideRow(col);
            for (let r = 0; r < SIZE; r++) {
              nextGrid[SIZE - 1 - r][c] = row[r];
            }
            totalGain += scoreGain;
          }
        } else {
          return false;
        }

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] !== nextGrid[r][c]) {
              changed = true;
              break;
            }
          }
          if (changed) break;
        }

        if (changed) {
          grid = nextGrid;
          currentScore += totalGain;
          spawnTile();
          render();
        }

        return changed;
      }

      function reset() {
        initGrid();
        currentScore = 0;
        spawnTile();
        spawnTile();
        render();
      }

      function setBoard(arr) {
        grid = arr.map(row => [...row]);
        render();
      }

      function board() {
        return grid.map(row => [...row]);
      }

      function score() {
        return currentScore;
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
          e.preventDefault();
          if (e.key === 'ArrowLeft') move('left');
          else if (e.key === 'ArrowRight') move('right');
          else if (e.key === 'ArrowUp') move('up');
          else if (e.key === 'ArrowDown') move('down');
        }
      });

      resetBtn.addEventListener('click', reset);

      window.game = {
        size: SIZE,
        reset,
        move,
        board,
        setBoard,
        score
      };

      reset();
    })();
  </script>
</body>
</html>
