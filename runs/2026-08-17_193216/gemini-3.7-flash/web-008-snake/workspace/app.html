<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 1px;
    }
    .score-container {
      font-size: 18px;
      font-weight: 600;
      background: #21262d;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    .score-container span {
      color: #7ee787;
    }
    #snake {
      width: 400px;
      height: 400px;
      background: #090d13;
      border: 2px solid #30363d;
      border-radius: 8px;
      display: block;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      width: 100%;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #c9d1d9;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }
    button:active {
      background-color: #282e33;
      transform: translateY(1px);
    }
    #start {
      background-color: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }
    #start:hover {
      background-color: #2ea043;
    }
    #pause {
      background-color: #9e6a03;
      border-color: #bb8009;
      color: #ffffff;
    }
    #pause:hover {
      background-color: #bb8009;
    }
    #reset {
      background-color: #da3633;
      border-color: #f85149;
      color: #ffffff;
    }
    #reset:hover {
      background-color: #f85149;
    }
    .instructions {
      margin-top: 14px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <h1>SNAKE</h1>
      <div class="score-container">Score: <span id="score">0</span></div>
    </div>

    <canvas id="snake" width="400" height="400"></canvas>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <div class="instructions">
      Use Arrow Keys or WASD to control the snake
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('snake');
      const ctx = canvas.getContext('2d');
      const scoreElement = document.getElementById('score');
      const startBtn = document.getElementById('start');
      const pauseBtn = document.getElementById('pause');
      const resetBtn = document.getElementById('reset');

      const W = 20;
      const H = 20;
      const CELL_SIZE = canvas.width / W;

      let snakeBody = [];
      let foodPos = [0, 0];
      let currentDir = 'right';
      let nextDir = 'right';
      let isAlive = true;
      let currentScore = 0;
      let intervalId = null;

      const opposites = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      const dirOffsets = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      function spawnRandomFood() {
        const freeCells = [];
        const occupied = new Set(snakeBody.map(p => `${p[0]},${p[1]}`));
        for (let x = 0; x < W; x++) {
          for (let y = 0; y < H; y++) {
            if (!occupied.has(`${x},${y}`)) {
              freeCells.push([x, y]);
            }
          }
        }
        if (freeCells.length > 0) {
          const idx = Math.floor(Math.random() * freeCells.length);
          foodPos = freeCells[idx];
        }
      }

      function draw() {
        // Background
        ctx.fillStyle = '#090d13';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid lines (subtle)
        ctx.strokeStyle = '#121820';
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += CELL_SIZE) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += CELL_SIZE) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        // Draw food
        if (foodPos) {
          const fx = foodPos[0] * CELL_SIZE;
          const fy = foodPos[1] * CELL_SIZE;
          const radius = CELL_SIZE / 2 - 2;

          ctx.save();
          ctx.fillStyle = '#f85149';
          ctx.shadowColor = '#f85149';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(fx + CELL_SIZE / 2, fy + CELL_SIZE / 2, radius, 0, Math.PI * 2);
          ctx.fill();

          // Highlight
          ctx.fillStyle = '#ff7b72';
          ctx.beginPath();
          ctx.arc(fx + CELL_SIZE / 2 - 2, fy + CELL_SIZE / 2 - 2, radius * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Draw snake
        for (let i = 0; i < snakeBody.length; i++) {
          const seg = snakeBody[i];
          const sx = seg[0] * CELL_SIZE;
          const sy = seg[1] * CELL_SIZE;

          ctx.save();
          if (i === 0) {
            // Head
            ctx.fillStyle = isAlive ? '#58a6ff' : '#8b949e';
            ctx.shadowColor = isAlive ? '#58a6ff' : 'transparent';
            ctx.shadowBlur = isAlive ? 6 : 0;
            ctx.beginPath();
            ctx.roundRect(sx + 1, sy + 1, CELL_SIZE - 2, CELL_SIZE - 2, 5);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#ffffff';
            const offset = dirOffsets[currentDir];
            let eye1, eye2;
            if (offset[0] === 1) { // right
              eye1 = [sx + CELL_SIZE - 5, sy + 4];
              eye2 = [sx + CELL_SIZE - 5, sy + CELL_SIZE - 6];
            } else if (offset[0] === -1) { // left
              eye1 = [sx + 3, sy + 4];
              eye2 = [sx + 3, sy + CELL_SIZE - 6];
            } else if (offset[1] === 1) { // down
              eye1 = [sx + 4, sy + CELL_SIZE - 5];
              eye2 = [sx + CELL_SIZE - 6, sy + CELL_SIZE - 5];
            } else { // up
              eye1 = [sx + 4, sy + 3];
              eye2 = [sx + CELL_SIZE - 6, sy + 3];
            }
            ctx.beginPath();
            ctx.arc(eye1[0], eye1[1], 1.5, 0, Math.PI * 2);
            ctx.arc(eye2[0], eye2[1], 1.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Body
            const ratio = i / snakeBody.length;
            ctx.fillStyle = isAlive
              ? `rgb(${Math.round(46 + ratio * 20)}, ${Math.round(160 - ratio * 40)}, ${Math.round(67 - ratio * 20)})`
              : '#484f58';
            ctx.beginPath();
            ctx.roundRect(sx + 1.5, sy + 1.5, CELL_SIZE - 3, CELL_SIZE - 3, 3);
            ctx.fill();
          }
          ctx.restore();
        }

        // Game Over overlay
        if (!isAlive) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f85149';
          ctx.font = 'bold 26px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
        }

        scoreElement.textContent = currentScore;
      }

      function resetGame() {
        isAlive = true;
        currentScore = 0;
        currentDir = 'right';
        nextDir = 'right';
        snakeBody = [
          [5, 10],
          [4, 10],
          [3, 10]
        ];
        foodPos = [14, 10];
        draw();
      }

      function tick() {
        if (!isAlive) return;

        currentDir = nextDir;
        const offset = dirOffsets[currentDir];
        const head = snakeBody[0];
        const nextHead = [head[0] + offset[0], head[1] + offset[1]];

        // Wall collision
        if (nextHead[0] < 0 || nextHead[0] >= W || nextHead[1] < 0 || nextHead[1] >= H) {
          isAlive = false;
          draw();
          return;
        }

        const isEating = (nextHead[0] === foodPos[0] && nextHead[1] === foodPos[1]);

        // Self collision check
        // If not eating, tail will move out of the way; if eating, tail stays.
        const bodyToCheck = isEating ? snakeBody : snakeBody.slice(0, -1);
        const selfHit = bodyToCheck.some(seg => seg[0] === nextHead[0] && seg[1] === nextHead[1]);

        if (selfHit) {
          isAlive = false;
          draw();
          return;
        }

        // Move snake
        snakeBody.unshift(nextHead);
        if (isEating) {
          currentScore += 1;
          spawnRandomFood();
        } else {
          snakeBody.pop();
        }

        draw();
      }

      function setDir(dir) {
        if (!opposites[dir]) return;
        // Ignore 180-degree reversals
        if (opposites[dir] === currentDir) return;
        nextDir = dir;
      }

      function setFood(x, y) {
        foodPos = [x, y];
        draw();
      }

      function startLoop() {
        if (intervalId) return;
        intervalId = setInterval(() => {
          if (isAlive) {
            tick();
          } else {
            clearInterval(intervalId);
            intervalId = null;
          }
        }, 120);
      }

      function pauseLoop() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      // Event Listeners
      startBtn.addEventListener('click', () => {
        if (!isAlive) {
          resetGame();
        }
        startLoop();
      });

      pauseBtn.addEventListener('click', () => {
        pauseLoop();
      });

      resetBtn.addEventListener('click', () => {
        pauseLoop();
        resetGame();
      });

      window.addEventListener('keydown', (e) => {
        switch (e.key) {
          case 'ArrowUp':
          case 'w':
          case 'W':
            setDir('up');
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 's':
          case 'S':
            setDir('down');
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'a':
          case 'A':
            setDir('left');
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'd':
          case 'D':
            setDir('right');
            e.preventDefault();
            break;
        }
      });

      // Programmatic API
      window.game = {
        w: W,
        h: H,
        reset: resetGame,
        tick: tick,
        setDir: setDir,
        setFood: setFood,
        snake: function () {
          return snakeBody.map(p => [p[0], p[1]]);
        },
        food: function () {
          return [foodPos[0], foodPos[1]];
        },
        alive: function () {
          return isAlive;
        },
        score: function () {
          return currentScore;
        }
      };

      // Initial setup
      resetGame();
    })();
  </script>
</body>
</html>
