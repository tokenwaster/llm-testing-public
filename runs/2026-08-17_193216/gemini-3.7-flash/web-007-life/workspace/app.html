<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #111827;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-size: 0.85rem;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
    }

    .stat-badge {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #334155;
    }

    .stat-badge span {
      color: #38bdf8;
      font-weight: 600;
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      background-color: #030712;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      cursor: crosshair;
    }

    #life {
      display: block;
      width: 500px;
      height: 500px;
      min-width: 400px;
      min-height: 400px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    button {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #play {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }
    #play:hover {
      background: #1d4ed8;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.6);
    }
    #play.running {
      background: #dc2626;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.4);
    }
    #play.running:hover {
      background: #b91c1c;
      box-shadow: 0 0 16px rgba(220, 38, 38, 0.6);
    }

    #step {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    #step:hover {
      background: #334155;
      color: #ffffff;
    }

    #random {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
    }
    #random:hover {
      background: #334155;
      color: #ffffff;
    }

    #clear {
      background: #1e293b;
      color: #f87171;
      border: 1px solid #334155;
    }
    #clear:hover {
      background: #450a0a;
      border-color: #7f1d1d;
    }

    button:active {
      transform: scale(0.96);
    }

    .instructions {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Conway's Game of Life</h1>
      <div class="stats">
        <div class="stat-badge">Gen: <span id="gen-count">0</span></div>
        <div class="stat-badge">Alive: <span id="alive-count">0</span></div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="life" width="500" height="500"></canvas>
    </div>

    <div class="controls">
      <button id="play">▶ Play</button>
      <button id="step">⏭ Step</button>
      <button id="random">🎲 Random</button>
      <button id="clear">✕ Clear</button>
    </div>

    <div class="instructions">Click and drag on the grid to paint or erase cells.</div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('life');
      const ctx = canvas.getContext('2d');
      const playBtn = document.getElementById('play');
      const stepBtn = document.getElementById('step');
      const randomBtn = document.getElementById('random');
      const clearBtn = document.getElementById('clear');
      const genCountEl = document.getElementById('gen-count');
      const aliveCountEl = document.getElementById('alive-count');

      const W = 50;
      const H = 50;
      let grid = new Uint8Array(W * H);
      let generation = 0;
      let timer = null;
      const speed = 100; // ms per tick

      function draw() {
        const cw = canvas.width / W;
        const ch = canvas.height / H;

        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid lines
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= W; x++) {
          ctx.moveTo(x * cw, 0);
          ctx.lineTo(x * cw, canvas.height);
        }
        for (let y = 0; y <= H; y++) {
          ctx.moveTo(0, y * ch);
          ctx.lineTo(canvas.width, y * ch);
        }
        ctx.stroke();

        // Draw live cells
        let aliveCount = 0;
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 4;

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (grid[y * W + x]) {
              aliveCount++;
              ctx.fillRect(x * cw + 1, y * ch + 1, cw - 2, ch - 2);
            }
          }
        }
        ctx.shadowBlur = 0;

        genCountEl.textContent = generation;
        aliveCountEl.textContent = aliveCount;
      }

      function step() {
        const next = new Uint8Array(W * H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            let neighbors = 0;

            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                  if (grid[ny * W + nx]) {
                    neighbors++;
                  }
                }
              }
            }

            const idx = y * W + x;
            const isAlive = grid[idx] === 1;

            if (isAlive) {
              if (neighbors === 2 || neighbors === 3) {
                next[idx] = 1;
              }
            } else {
              if (neighbors === 3) {
                next[idx] = 1;
              }
            }
          }
        }
        grid = next;
        generation++;
        draw();
      }

      function clear() {
        grid.fill(0);
        generation = 0;
        draw();
      }

      function randomize() {
        for (let i = 0; i < grid.length; i++) {
          grid[i] = Math.random() < 0.22 ? 1 : 0;
        }
        generation = 0;
        draw();
      }

      function togglePlay() {
        if (timer) {
          clearInterval(timer);
          timer = null;
          playBtn.textContent = '▶ Play';
          playBtn.classList.remove('running');
        } else {
          timer = setInterval(step, speed);
          playBtn.textContent = '⏸ Pause';
          playBtn.classList.add('running');
        }
      }

      // Interaction
      let isDrawing = false;
      let drawMode = 1;

      function getCellFromEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = Math.floor(((clientX - rect.left) * scaleX) / (canvas.width / W));
        const y = Math.floor(((clientY - rect.top) * scaleY) / (canvas.height / H));
        return { x, y };
      }

      function handleStart(e) {
        e.preventDefault();
        isDrawing = true;
        const { x, y } = getCellFromEvent(e);
        if (x >= 0 && x < W && y >= 0 && y < H) {
          drawMode = grid[y * W + x] ? 0 : 1;
          grid[y * W + x] = drawMode;
          draw();
        }
      }

      function handleMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCellFromEvent(e);
        if (x >= 0 && x < W && y >= 0 && y < H) {
          if (grid[y * W + x] !== drawMode) {
            grid[y * W + x] = drawMode;
            draw();
          }
        }
      }

      function handleEnd() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', handleStart);
      window.addEventListener('mousemove', handleMove);
      window.addEventListener('mouseup', handleEnd);

      canvas.addEventListener('touchstart', handleStart, { passive: false });
      window.addEventListener('touchmove', handleMove, { passive: false });
      window.addEventListener('touchend', handleEnd);

      playBtn.addEventListener('click', togglePlay);
      stepBtn.addEventListener('click', () => {
        if (timer) togglePlay();
        step();
      });
      randomBtn.addEventListener('click', randomize);
      clearBtn.addEventListener('click', () => {
        if (timer) togglePlay();
        clear();
      });

      // Public API on window.life
      window.life = {
        w: W,
        h: H,
        get: function (x, y) {
          if (x < 0 || x >= W || y < 0 || y >= H) return 0;
          return grid[y * W + x] ? 1 : 0;
        },
        set: function (x, y, v) {
          if (x < 0 || x >= W || y < 0 || y >= H) return;
          grid[y * W + x] = v ? 1 : 0;
          draw();
        },
        step: function () {
          step();
        },
        clear: function () {
          clear();
        }
      };

      // Initial state: a fun starting pattern (Gosper Glider Gun or Gliders)
      // Let's add a few classic gliders & pulsar
      const gliders = [
        [1, 0], [2, 1], [0, 2], [1, 2], [2, 2],
        [10, 5], [11, 6], [9, 7], [10, 7], [11, 7],
        [25, 20], [26, 21], [24, 22], [25, 22], [26, 22]
      ];
      gliders.forEach(([gx, gy]) => {
        if (gx < W && gy < H) grid[gy * W + gx] = 1;
      });

      draw();
    })();
  </script>
</body>
</html>
