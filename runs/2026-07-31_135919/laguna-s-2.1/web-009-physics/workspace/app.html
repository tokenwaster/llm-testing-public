<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball Physics Playground</title>
<style>
  :root {
    --bg: #0f0f17;
    --panel: #1a1a2e;
    --btn-bg: #16213e;
    --btn-hover: #233;
    --btn-text: #e0e0e8;
    --accent: #00e5ff;
    --ball-outline: rgba(0,0,0,0);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--btn-text);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    text-align: center;
  }
  #sim {
    width: 500px;
    height: 500px;
    background: #14142a;
    border: 2px solid var(--accent);
    border-radius: 8px;
    cursor: crosshair;
    box-shadow: 0 0 20px rgba(0,229,255,0.15);
  }
  #controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover {
    background: var(--btn-hover);
    box-shadow: 0 0 8px rgba(0,229,255,0.3);
  }
  button:active {
    transform: scale(0.97);
  }
  h1 {
    color: var(--accent);
    font-size: 1.2em;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Bouncing Ball Playground</h1>
  <canvas id="sim" width="500" height="500"></canvas>
  <div id="controls">
    <button id="drop">Drop Ball</button>
    <button id="play">Play</button>
    <button id="clear">Clear</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;

  const GRAVITY = 0.35;
  const RESTITUTION = 0.82;
  const FRICTION = 0.995;

  let balls = [];
  let playing = false;
  let animationId = null;

  function randomR() {
    return Math.max(8, Math.floor(Math.random() * 22));
  }

  function randomColor() {
    const h = Math.floor(Math.random() * 360);
    return `hsl(${h}, 75%, 55%)`;
  }

  function randV() {
    return (Math.random() - 0.5) * 6;
  }

  function addBall(x, y, vx = 0, vy = 0, r = randomR()) {
    // Clamp inside the canvas so it doesn't start out of bounds
    r = Math.max(3, r);
    x = Math.max(r, Math.min(width - r, x));
    y = Math.max(r, Math.min(height - r, y));
    balls.push({ x, y, vx, vy, r, color: randomColor() });
  }

  function step(dt = 1) {
    // Advance physics for each ball
    for (const b of balls) {
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      b.vy += GRAVITY * dt;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Bounce off walls
      if (b.x - b.r < 0) {
        b.x = b.r;
        b.vx = -b.vx * RESTITUTION;
      } else if (b.x + b.r > width) {
        b.x = width - b.r;
        b.vx = -b.vx * RESTITUTION;
      }

      // Bounce off floor / ceiling
      if (b.y - b.r < 0) {
        b.y = b.r;
        b.vy = -b.vy * RESTITUTION;
      } else if (b.y + b.r > height) {
        b.y = height - b.r;
        b.vy = -b.vy * RESTITUTION;
      }
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Grid-ish background dots for reference
    ctx.fillStyle = '#1e1e30';
    for (let i = 0; i <= width; i += 40) {
      for (let j = 0; j <= height; j += 40) {
        ctx.beginPath();
        ctx.arc(i, j, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw balls
    for (const b of balls) {
      const gradient = ctx.createRadialGradient(
        b.x - b.r / 3, b.y - b.r / 3, 0.2,
        b.x, b.y, b.r
      );
      gradient.addColorStop(0, b.color);
      gradient.addColorStop(1, '#000');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function clear() {
    balls = [];
    draw();
  }

  // Animation loop
  function animate() {
    step();
    animationId = requestAnimationFrame(animate);
  }

  // Button handlers
  document.getElementById('drop').addEventListener('click', () => {
    addBall(width / 2, 20, randV(), 0);
  });

  document.getElementById('play').addEventListener('click', () => {
    playing = !playing;
    const btn = document.getElementById('play');
    btn.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      animate();
    } else {
      cancelAnimationFrame(animationId);
    }
  });

  document.getElementById('clear').addEventListener('click', () => clear());

  // Click to add ball on canvas
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    addBall(x, y, randV(), randV() * 2);
  });

  // Initial draw
  draw();

  // Programmatic API on window
  window.sim = {
    w: width,
    h: height,
    addBall,
    clear,
    step,
    balls: () => balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r }))
  };
})();
</script>
</body>
</html>
