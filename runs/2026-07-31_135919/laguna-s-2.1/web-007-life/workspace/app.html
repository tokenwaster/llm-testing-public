<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conway's Game of Life</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #58a6ff;
      text-shadow: 0 0 8px rgba(88,166,255,0.5);
    }
    .subtitle {
      font-size: 0.85rem;
      margin-bottom: 20px;
      color: #8b949e;
    }
    #life {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 6px;
      cursor: crosshair;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls button,
    .controls input[type="range"] {
      background: #21262d;
      color: #f0f6fc;
      border: 1px solid #30363d;
      padding: 8px 16px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }
    .controls button:hover {
      background: #30363d;
      box-shadow: 0 0 8px rgba(88,166,255,0.4);
    }
    .controls button:active {
      transform: scale(0.97);
    }
    .controls button#play.running {
      background: #238636;
      border-color: #2ea043;
    }
    .controls button#play.running:hover {
      background: #2ea043;
    }
    .controls label {
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls input[type="range"] {
      width: 120px;
      accent-color: #58a6ff;
    }
    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #8b949e;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>Conway's Game of Life</h1>
  <p class="subtitle">B3/S23 &middot; Click/Drag to toggle cells</p>
  <canvas id="life" width="500" height="500"></canvas>
  <div class="controls">
    <button id="step">Step</button>
    <button id="play">Play</button>
    <button id="random">Random</button>
    <button id="clear">Clear</button>
    <label>Speed: <input id="speed" type="range" min="1" max="20" value="10"></label>
  </div>
  <div class="status" id="status">Ready — 60×60 grid</div>

  <script>
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');
    const cellSize = 8;
    const cols = Math.floor(canvas.width / cellSize);
    const rows = Math.floor(canvas.height / cellSize);
    const grid = Array(rows).fill(null).map(() => Array(cols).fill(0));

    const stepBtn = document.getElementById('step');
    const playBtn = document.getElementById('play');
    const randomBtn = document.getElementById('random');
    const clearBtn = document.getElementById('clear');
    const speedSlider = document.getElementById('speed');
    const statusEl = document.getElementById('status');

    let isPlaying = false;
    let intervalId = null;
    let lastDrawn = null;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (grid[y][x] === 1) {
            ctx.fillStyle = '#58a6ff';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            ctx.strokeStyle = '#1f6feb';
            ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    function countNeighbors(x, y) {
      let count = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx;
          const ny = y + dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            count += grid[ny][nx];
          }
        }
      }
      return count;
    }

    function step() {
      const next = Array(rows).fill(null).map(() => Array(cols).fill(0));
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const neighbors = countNeighbors(x, y);
          const alive = grid[y][x];
          if (!alive && neighbors === 3) {
            next[y][x] = 1;
          } else if (alive && (neighbors === 2 || neighbors === 3)) {
            next[y][x] = 1;
          } else {
            next[y][x] = 0;
          }
        }
      }
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          grid[y][x] = next[y][x];
        }
      }
      draw();
      lastDrawn = Date.now();
    }

    function clear() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          grid[y][x] = 0;
        }
      }
      draw();
    }

    function randomize() {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          grid[y][x] = Math.random() > 0.7 ? 1 : 0;
        }
      }
      draw();
    }

    function toggleCell(x, y) {
      if (x >= 0 && x < cols && y >= 0 && y < rows) {
        grid[y][x] = 1 - grid[y][x];
        draw();
      }
    }

    let isMouseDown = false;

    canvas.addEventListener('mousedown', e => {
      isMouseDown = true;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / cellSize);
      const y = Math.floor((e.clientY - rect.top) / cellSize);
      toggleCell(x, y);
    });

    canvas.addEventListener('mousemove', e => {
      if (!isMouseDown) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / cellSize);
      const y = Math.floor((e.clientY - rect.top) / cellSize);
      toggleCell(x, y);
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    stepBtn.addEventListener('click', step);

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? 'Stop' : 'Play';
      playBtn.id = 'play';
      if (isPlaying) {
        playBtn.classList.add('running');
      } else {
        playBtn.classList.remove('running');
      }
      if (isPlaying) {
        const speed = parseInt(speedSlider.value);
        intervalId = setInterval(step, 1000 / (speed * 2));
      } else {
        clearInterval(intervalId);
        intervalId = null;
      }
    });

    randomBtn.addEventListener('click', randomize);
    clearBtn.addEventListener('click', clear);

    speedSlider.addEventListener('input', () => {
      if (isPlaying) {
        clearInterval(intervalId);
        const speed = parseInt(speedSlider.value);
        intervalId = setInterval(step, 1000 / (speed * 2));
      }
    });

    canvas.addEventListener('mouseleave', () => { isMouseDown = false; });

    draw();

    window.life = {
      w: cols,
      h: rows,
      get(x, y) {
        if (x < 0 || x >= cols || y < 0 || y >= rows) return 0;
        return grid[y][x];
      },
      set(x, y, v) {
        if (x < 0 || x >= cols || y < 0 || y >= rows) return;
        grid[y][x] = v ? 1 : 0;
      },
      step() {
        step();
      },
      clear() {
        clear();
      }
    };
  </script>
</body>
</html>
