<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball Physics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 20px;
    }

    canvas {
      width: 600px;
      height: 600px;
      background: #0a0a0a;
      border: 2px solid #333;
      cursor: crosshair;
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    button:hover {
      background: #444;
    }

    button:active {
      background: #222;
    }
  </style>
</head>
<body>
  <canvas id="sim" width="600" height="600"></canvas>
  <div class="controls">
    <button id="drop">Drop Ball</button>
    <button id="play">Play</button>
    <button id="clear">Clear</button>
  </div>

  <script>
    const canvas = document.getElementById('sim');
    const ctx = canvas.getContext('2d');
    
    const GRAVITY = 0.3;
    const RESTITUTION = 0.85;
    const DEFAULT_RADIUS = 8;

    let balls = [];
    let isPlaying = false;

    window.sim = {
      w: canvas.width,
      h: canvas.height,
      
      balls() {
        return balls.map(b => ({
          x: b.x,
          y: b.y,
          vx: b.vx,
          vy: b.vy,
          r: b.r
        }));
      },
      
      addBall(x, y, vx = 0, vy = 0, r = DEFAULT_RADIUS) {
        balls.push({
          x,
          y,
          vx,
          vy,
          r
        });
        draw();
      },
      
      clear() {
        balls = [];
        draw();
      },
      
      step(dt = 1) {
        balls.forEach(b => {
          b.vy += GRAVITY * dt;
        });

        balls.forEach(b => {
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        });

        balls.forEach(b => {
          if (b.y + b.r > canvas.height) {
            b.y = canvas.height - b.r;
            b.vy *= -RESTITUTION;
          }
          if (b.y - b.r < 0) {
            b.y = b.r;
            b.vy *= -RESTITUTION;
          }
          if (b.x + b.r > canvas.width) {
            b.x = canvas.width - b.r;
            b.vx *= -RESTITUTION;
          }
          if (b.x - b.r < 0) {
            b.x = b.r;
            b.vx *= -RESTITUTION;
          }
        });

        draw();
      }
    };

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#4a9eff';
      balls.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function animate() {
      if (isPlaying) {
        window.sim.step();
      }
      requestAnimationFrame(animate);
    }

    document.getElementById('drop').addEventListener('click', () => {
      window.sim.addBall(canvas.width / 2, canvas.height / 4);
    });

    document.getElementById('play').addEventListener('click', (e) => {
      isPlaying = !isPlaying;
      e.target.textContent = isPlaying ? 'Pause' : 'Play';
    });

    document.getElementById('clear').addEventListener('click', () => {
      window.sim.clear();
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      window.sim.addBall(x, y);
    });

    animate();
    draw();
  </script>
</body>
</html>
