<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 48px;
        }

        .info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .score-box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 5px;
            min-width: 100px;
        }

        .score-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        #reset {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #reset:hover {
            background-color: #45a049;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            width: 320px;
            height: 320px;
        }

        .tile {
            background-color: #3a3a3a;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            color: #ffffff;
            min-height: 70px;
        }

        .tile[data-value="0"] {
            background-color: #3a3a3a;
            color: #3a3a3a;
        }

        .tile[data-value="2"] {
            background-color: #4a4a4a;
            color: #ffffff;
        }

        .tile[data-value="4"] {
            background-color: #5a5a5a;
            color: #ffffff;
        }

        .tile[data-value="8"] {
            background-color: #ff9800;
            color: #ffffff;
        }

        .tile[data-value="16"] {
            background-color: #ff7043;
            color: #ffffff;
        }

        .tile[data-value="32"] {
            background-color: #ff5722;
            color: #ffffff;
        }

        .tile[data-value="64"] {
            background-color: #ff3d00;
            color: #ffffff;
        }

        .tile[data-value="128"] {
            background-color: #fbc02d;
            color: #000000;
            font-size: 30px;
        }

        .tile[data-value="256"] {
            background-color: #fbc02d;
            color: #000000;
            font-size: 30px;
        }

        .tile[data-value="512"] {
            background-color: #fbc02d;
            color: #000000;
            font-size: 30px;
        }

        .tile[data-value="1024"] {
            background-color: #f57f17;
            color: #ffffff;
            font-size: 25px;
        }

        .tile[data-value="2048"] {
            background-color: #f57f17;
            color: #ffffff;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="info">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div id="score">0</div>
            </div>
            <button id="reset">New Game</button>
        </div>
        <div id="board"></div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.size = 4;
                this.gridArray = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                this.currentScore = 0;
                this.boardElement = document.getElementById('board');
                this.scoreElement = document.getElementById('score');
                
                this.reset();
                this.attachEventListeners();
            }

            reset() {
                this.gridArray = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                this.currentScore = 0;
                this.addNewTile();
                this.addNewTile();
                this.render();
            }

            addNewTile() {
                const emptyCells = [];
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.gridArray[i][j] === 0) {
                            emptyCells.push([i, j]);
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    const [row, col] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.gridArray[row][col] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            move(direction) {
                const before = this.gridArray.map(row => [...row]);
                
                if (direction === 'left') {
                    this.moveLeft();
                } else if (direction === 'right') {
                    this.moveRight();
                } else if (direction === 'up') {
                    this.moveUp();
                } else if (direction === 'down') {
                    this.moveDown();
                }

                const changed = !this.arraysEqual(before, this.gridArray);

                if (changed) {
                    this.addNewTile();
                    this.render();
                }

                return changed;
            }

            moveLeft() {
                for (let i = 0; i < this.size; i++) {
                    this.slideAndMerge(this.gridArray[i]);
                }
            }

            moveRight() {
                for (let i = 0; i < this.size; i++) {
                    this.gridArray[i].reverse();
                    this.slideAndMerge(this.gridArray[i]);
                    this.gridArray[i].reverse();
                }
            }

            moveUp() {
                const transposed = this.transpose(this.gridArray);
                for (let i = 0; i < this.size; i++) {
                    this.slideAndMerge(transposed[i]);
                }
                this.gridArray = this.transpose(transposed);
            }

            moveDown() {
                const transposed = this.transpose(this.gridArray);
                for (let i = 0; i < this.size; i++) {
                    transposed[i].reverse();
                    this.slideAndMerge(transposed[i]);
                    transposed[i].reverse();
                }
                this.gridArray = this.transpose(transposed);
            }

            slideAndMerge(row) {
                const nonZero = row.filter(val => val !== 0);
                const result = [];
                let i = 0;

                while (i < nonZero.length) {
                    if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
                        const merged = nonZero[i] * 2;
                        result.push(merged);
                        this.currentScore += merged;
                        i += 2;
                    } else {
                        result.push(nonZero[i]);
                        i += 1;
                    }
                }

                while (result.length < this.size) {
                    result.push(0);
                }

                for (let i = 0; i < this.size; i++) {
                    row[i] = result[i];
                }
            }

            transpose(grid) {
                const transposed = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        transposed[j][i] = grid[i][j];
                    }
                }
                return transposed;
            }

            arraysEqual(arr1, arr2) {
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (arr1[i][j] !== arr2[i][j]) {
                            return false;
                        }
                    }
                }
                return true;
            }

            render() {
                this.boardElement.innerHTML = '';
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        const value = this.gridArray[i][j];
                        tile.setAttribute('data-value', value);
                        tile.textContent = value === 0 ? '' : value;
                        this.boardElement.appendChild(tile);
                    }
                }
                this.scoreElement.textContent = this.currentScore;
            }

            attachEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.move('left');
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.move('right');
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.move('up');
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.move('down');
                    }
                });

                document.getElementById('reset').addEventListener('click', () => {
                    this.reset();
                });
            }

            board() {
                return this.gridArray.map(row => [...row]);
            }

            setBoard(arr) {
                this.gridArray = arr.map(row => [...row]);
                this.render();
            }

            score() {
                return this.currentScore;
            }
        }

        const game = new Game2048();

        window.game = {
            size: game.size,
            reset: () => game.reset(),
            move: (direction) => game.move(direction),
            board: () => game.board(),
            setBoard: (arr) => game.setBoard(arr),
            score: () => game.score()
        };
    </script>
</body>
</html>
