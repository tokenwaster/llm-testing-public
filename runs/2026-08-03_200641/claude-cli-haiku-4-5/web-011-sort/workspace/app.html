<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        #bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #0d0d0d;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(180deg, #4a9eff, #0066cc);
            border-radius: 4px 4px 0 0;
            transition: height 0.05s ease, background 0.05s ease;
            box-shadow: 0 2px 8px rgba(74, 158, 255, 0.3);
            min-width: 2px;
        }

        .bar.sorted {
            background: linear-gradient(180deg, #4caf50, #2e7d32);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        .bar.comparing {
            background: linear-gradient(180deg, #ff6b6b, #cc0000);
            box-shadow: 0 2px 12px rgba(255, 107, 107, 0.6);
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 11px 22px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #sort {
            background-color: #4a9eff;
            color: white;
        }

        #sort:hover {
            background-color: #0066cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 158, 255, 0.4);
        }

        #shuffle {
            background-color: #ff9800;
            color: white;
        }

        #shuffle:hover {
            background-color: #f57c00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
        }

        #reset {
            background-color: #666;
            color: white;
        }

        #reset:hover {
            background-color: #555;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 100, 100, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>Sorting Visualizer</h1>
    <div id="bars"></div>
    <div class="controls">
        <button id="sort">Sort</button>
        <button id="shuffle">Shuffle</button>
        <button id="reset">Reset</button>
    </div>

    <script>
        class SortingViz {
            constructor() {
                this.data = [];
                this.pass = 0;
                this.i = 0;
                this.comparing = [-1, -1];
                this.sortComplete = false;
                this.init();
                this.setupUI();
            }

            init() {
                this.data = Array.from({ length: 50 }, (_, idx) => idx + 1);
                this.shuffle();
                this.pass = 0;
                this.i = 0;
                this.comparing = [-1, -1];
                this.sortComplete = false;
                this.render();
            }

            shuffle() {
                for (let i = this.data.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.data[i], this.data[j]] = [this.data[j], this.data[i]];
                }
            }

            setupUI() {
                document.getElementById('sort').addEventListener('click', () => this.animateSort());
                document.getElementById('shuffle').addEventListener('click', () => {
                    this.shuffle();
                    this.pass = 0;
                    this.i = 0;
                    this.comparing = [-1, -1];
                    this.sortComplete = false;
                    this.render();
                });
                document.getElementById('reset').addEventListener('click', () => this.init());
            }

            render() {
                const container = document.getElementById('bars');
                const max = Math.max(...this.data);
                const maxHeight = 350;

                container.innerHTML = '';

                this.data.forEach((val, idx) => {
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.style.height = (val / max) * maxHeight + 'px';

                    if (idx >= this.data.length - this.pass) {
                        bar.classList.add('sorted');
                    }

                    if (this.comparing.includes(idx)) {
                        bar.classList.add('comparing');
                    }

                    container.appendChild(bar);
                });
            }

            isSortedCheck() {
                for (let k = 0; k < this.data.length - 1; k++) {
                    if (this.data[k] > this.data[k + 1]) {
                        return false;
                    }
                }
                return true;
            }

            sortStep() {
                if (this.sortComplete) {
                    return true;
                }

                if (this.isSortedCheck()) {
                    this.sortComplete = true;
                    this.comparing = [-1, -1];
                    this.render();
                    return true;
                }

                const n = this.data.length;
                const end = n - this.pass;

                if (this.i < end - 1) {
                    this.comparing = [this.i, this.i + 1];

                    if (this.data[this.i] > this.data[this.i + 1]) {
                        [this.data[this.i], this.data[this.i + 1]] = 
                        [this.data[this.i + 1], this.data[this.i]];
                    }

                    this.i++;
                } else {
                    this.pass++;
                    this.i = 0;
                    this.comparing = [-1, -1];
                }

                this.render();
                return false;
            }

            animateSort() {
                const step = () => {
                    const done = this.sortStep();
                    if (!done) {
                        requestAnimationFrame(step);
                    }
                };
                step();
            }
        }

        const visualizer = new SortingViz();

        window.viz = {
            array: () => visualizer.data.slice(),
            setArray: (a) => {
                visualizer.data = [...a];
                visualizer.pass = 0;
                visualizer.i = 0;
                visualizer.comparing = [-1, -1];
                visualizer.sortComplete = false;
                visualizer.render();
            },
            sortStep: () => visualizer.sortStep(),
            sorted: () => visualizer.isSortedCheck()
        };
    </script>
</body>
</html>
