<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        #snake {
            display: block;
            background-color: #0a0a0a;
            border: 2px solid #666;
            margin: 0 auto 20px;
            width: 400px;
            height: 400px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            background-color: #444;
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Snake</h1>
        <canvas id="snake" width="400" height="400"></canvas>
        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
        <div class="score-display">Score: <span id="score">0</span></div>
    </div>

    <script>
        const GRID_WIDTH = 20;
        const GRID_HEIGHT = 20;
        const CELL_SIZE = 20;

        const canvas = document.getElementById('snake');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start');
        const pauseBtn = document.getElementById('pause');
        const resetBtn = document.getElementById('reset');
        const scoreDisplay = document.getElementById('score');

        let gameState = {
            snake: [],
            food: null,
            direction: 'right',
            nextDirection: 'right',
            score: 0,
            alive: true,
            gameRunning: false
        };

        let gameLoop = null;

        function reset() {
            gameState.snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            gameState.direction = 'right';
            gameState.nextDirection = 'right';
            gameState.score = 0;
            gameState.alive = true;
            gameState.gameRunning = false;
            
            spawnFood();
            draw();
            scoreDisplay.textContent = '0';
        }

        function spawnFood() {
            let foodX, foodY, valid;
            do {
                valid = true;
                foodX = Math.floor(Math.random() * GRID_WIDTH);
                foodY = Math.floor(Math.random() * GRID_HEIGHT);
                
                for (let segment of gameState.snake) {
                    if (segment.x === foodX && segment.y === foodY) {
                        valid = false;
                        break;
                    }
                }
            } while (!valid);

            gameState.food = { x: foodX, y: foodY };
        }

        function setFood(x, y) {
            gameState.food = { x, y };
            draw();
        }

        function tick() {
            if (!gameState.alive || !gameState.gameRunning) return;

            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };

            if (gameState.nextDirection !== opposites[gameState.direction]) {
                gameState.direction = gameState.nextDirection;
            }

            const head = gameState.snake[0];
            let newX = head.x;
            let newY = head.y;

            switch (gameState.direction) {
                case 'up':
                    newY--;
                    break;
                case 'down':
                    newY++;
                    break;
                case 'left':
                    newX--;
                    break;
                case 'right':
                    newX++;
                    break;
            }

            if (newX < 0 || newX >= GRID_WIDTH || newY < 0 || newY >= GRID_HEIGHT) {
                gameState.alive = false;
                gameState.gameRunning = false;
                clearInterval(gameLoop);
                draw();
                return;
            }

            for (let segment of gameState.snake) {
                if (segment.x === newX && segment.y === newY) {
                    gameState.alive = false;
                    gameState.gameRunning = false;
                    clearInterval(gameLoop);
                    draw();
                    return;
                }
            }

            gameState.snake.unshift({ x: newX, y: newY });

            if (gameState.food && gameState.food.x === newX && gameState.food.y === newY) {
                gameState.score++;
                scoreDisplay.textContent = gameState.score;
                spawnFood();
            } else {
                gameState.snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_WIDTH; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= GRID_HEIGHT; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            if (gameState.food) {
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(
                    gameState.food.x * CELL_SIZE + 2,
                    gameState.food.y * CELL_SIZE + 2,
                    CELL_SIZE - 4,
                    CELL_SIZE - 4
                );
            }

            for (let i = 0; i < gameState.snake.length; i++) {
                const segment = gameState.snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#4ecdc4';
                } else {
                    ctx.fillStyle = '#45b7aa';
                }
                ctx.fillRect(
                    segment.x * CELL_SIZE + 2,
                    segment.y * CELL_SIZE + 2,
                    CELL_SIZE - 4,
                    CELL_SIZE - 4
                );
            }

            if (!gameState.alive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            }
        }

        function setDir(direction) {
            if (['up', 'down', 'left', 'right'].includes(direction)) {
                gameState.nextDirection = direction;
            }
        }

        function snake() {
            return gameState.snake.map(s => [s.x, s.y]);
        }

        function food() {
            return gameState.food ? [gameState.food.x, gameState.food.y] : null;
        }

        function alive() {
            return gameState.alive;
        }

        function score() {
            return gameState.score;
        }

        startBtn.addEventListener('click', () => {
            if (!gameState.gameRunning && gameState.alive) {
                gameState.gameRunning = true;
                startBtn.textContent = 'Resume';
                gameLoop = setInterval(tick, 100);
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (gameState.gameRunning) {
                gameState.gameRunning = false;
                startBtn.textContent = 'Resume';
                clearInterval(gameLoop);
            }
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(gameLoop);
            reset();
            startBtn.textContent = 'Start';
        });

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    setDir('up');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    setDir('down');
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    setDir('left');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    setDir('right');
                    break;
            }
        });

        window.game = {
            w: GRID_WIDTH,
            h: GRID_HEIGHT,
            reset,
            tick,
            setDir,
            setFood,
            snake,
            food,
            alive,
            score
        };

        reset();
    </script>
</body>
</html>
