<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubuntu Desktop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    overflow: hidden;
    font-family: 'Segoe UI', Ubuntu, sans-serif;
    background-color: #2d2d2d;
}

/* ---- Desktop Wallpaper Area ---- */
#desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #533483 100%);
    overflow: hidden;
    user-select: none;
}

/* Subtle grid wallpaper effect */
#desktop::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

/* ---- Taskbar ---- */
#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: rgba(30, 30, 50, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    align-items: center;
    padding: 0 8px;
    z-index: 1000;
    border-top: 1px solid rgba(255,255,255,0.08);
}

#taskbar .brand {
    color: #e0e0e0;
    font-size: 13px;
    margin-right: 16px;
    padding-left: 4px;
    cursor: pointer;
}
#taskbar .brand:hover { text-decoration: underline; }

.launcher-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 56px;
    height: 40px;
    margin-right: 4px;
    background: rgba(255,255,255,0.07);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    color: #e0e0e0;
    font-size: 13px;
    transition: background 0.15s, border-color 0.15s;
}
.launcher-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.18);
}

/* ---- Window ---- */
.window {
    position: absolute;
    display: none;
    flex-direction: column;
    background: #2b2b2e;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
    overflow: hidden;
    min-width: 380px;
    min-height: 260px;
    animation: winOpen 0.2s ease-out;
}

@keyframes winOpen {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

.window.open { display: flex; }

/* Title bar */
.win-header {
    height: 42px;
    background: #363639;
    display: flex;
    align-items: center;
    padding: 0 12px;
    cursor: default;
    -webkit-app-region: drag;
}

.win-header .win-title {
    color: #e0e0e0;
    font-size: 13px;
    flex: 1;
    margin-left: 8px;
}

.win-close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: #999;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
}
.win-close:hover { background: #c0392b; color: white; }

/* Window body */
.win-body {
    flex: 1;
    overflow: auto;
    position: relative;
}

/* ---- Files App Styles ---- */
#files-app .win-header .win-title::before { content: 'Files'; }
#files-app .win-body { padding: 8px; }

#files-path {
    font-size: 13px;
    color: #90a4ae;
    margin-bottom: 6px;
    padding-left: 4px;
}

.files-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.fs-item {
    display: block;
    padding: 8px 10px;
    color: #e0e0e0;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
}
.fs-item:hover { background: rgba(255,255,255,0.08); color: #fff; }

/* ---- Notepad App Styles ---- */
#notepad-app .win-header .win-title::before { content: 'Text Editor'; }

#tabs {
    display: flex;
    background: #363639;
    padding: 4px 8px;
    gap: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: transparent;
    border: none;
    color: #90a4ae;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    white-space: nowrap;
    transition: all 0.15s;
}
.tab:hover { background: rgba(255,255,255,0.08); color: #e0e0e0; }
.tab.active { background: #2b2b2e; color: #fff; border-bottom: 2px solid #3daee9; }

#new-tab {
    padding: 6px 14px;
    background: transparent;
    border: none;
    color: #90a4ae;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s;
}
#new-tab:hover { background: rgba(255,255,255,0.08); color: #e0e0e0; }

#editor-container { flex: 1; display: flex; flex-direction: column; }

.editor-wrapper {
    flex: 1;
    padding: 6px;
}

#editor {
    width: 100%;
    height: 100%;
    background: #2b2b2e;
    color: #dcdcdc;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.5;
}

#tabs-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: #363639;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
#tabs-bar .win-title { margin-left: 0; }

/* ---- Filesystem Data ---- */
const FILESYSTEM = {
    '/': [
        'bin', 'etc', 'home', 'usr', 'var'
    ],
    '/bin': ['bash', 'ls', 'cat'],
    '/etc': ['passwd', 'hosts', 'resolv.conf'],
    '/home': ['user'],
    '/home/user': [
        'Documents', 'Downloads', 'Pictures', 'Desktop', '.bashrc'
    ],
    '/home/user/Documents': ['notes.txt', 'readme.md'],
    '/home/user/Downloads': ['install.sh', 'setup.py'],
    '/home/user/Pictures': ['vacation.jpg', 'profile.png'],
    '/home/user/Desktop': ['launcher.desktop'],
    '/usr': ['bin', 'lib', 'share'],
    '/usr/bin': ['python3', 'node', 'git', 'docker'],
    '/usr/lib': ['libc.so.6', 'libstdc++.so.6'],
    '/usr/share': ['man', 'doc'],
    '/var': ['log', 'cache', 'tmp'],
    '/var/log': ['syslog', 'auth.log'],
    '/var/cache': ['apt', 'dpkg'],
};

function getEntries(path) {
    const parts = path.split('/').filter(Boolean);
    let current = FILESYSTEM;
    for (const part of parts) {
        if (!current[part]) return [];
        current = current[part];
    }
    return Array.isArray(current) ? current : [];
}

function getEntryType(path, name) {
    const full = path + '/' + name;
    return FILESYSTEM[full] !== undefined ? 'folder' : 'file';
}

/* ---- Utility: Window positioning ---- */
let winIdCounter = 0;
const openWindows = {}; // id -> element

function placeWindow(winEl) {
    const w = winEl.offsetWidth || 380;
    const h = winEl.offsetHeight || 260;
    let x = 100 + (winIdCounter * 40);
    let y = 60 + (winIdCounter * 35);
    // keep in viewport
    if (x + w > window.innerWidth) x = Math.max(0, window.innerWidth - w - 20);
    if (y + h > window.innerHeight) y = Math.max(0, window.innerHeight - h - 20);
    winEl.style.left = x + 'px';
    winEl.style.top = y + 'px';
}

function openWindow(winId) {
    const el = document.getElementById(winId);
    if (!el) return;
    el.classList.add('open');
    placeWindow(el);
}

/* ---- Files App Logic ---- */
const filesPathEl = document.getElementById('files-path');
const filesListEl = document.getElementById('files-list');
let currentPath = '/';

function renderFiles() {
    const entries = getEntries(currentPath);
    filesListEl.innerHTML = '';
    for (const name of entries) {
        const type = getEntryType(currentPath, name);
        const item = document.createElement('div');
        item.className = 'fs-item';
        if (type === 'folder') {
            item.textContent = name + '/';
        } else {
            item.textContent = name;
        }
        item.addEventListener('dblclick', () => {
            if (type === 'folder') navigateTo(currentPath + '/' + name);
        });
        filesListEl.appendChild(item);
    }
}

function navigateTo(path) {
    currentPath = path.endsWith('/') ? path : path + '/';
    filesPathEl.textContent = currentPath;
    renderFiles();
}

document.getElementById('files-up').addEventListener('click', () => {
    if (currentPath === '/') return;
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    navigateTo(parts.length ? '/' + parts.join('/') : '/');
});

/* ---- Notepad App Logic ---- */
function loadTabsFromStorage() {
    try {
        const raw = localStorage.getItem('notepad-tabs');
        if (!raw) return [];
        return JSON.parse(raw);
    } catch { return []; }
}

function saveTabsToStorage(tabs) {
    try {
        localStorage.setItem('notepad-tabs', JSON.stringify(tabs));
    } catch {}
}

let tabCount = 0;
const tabsEl = document.getElementById('tabs');
const editorEl = document.getElementById('editor');

function createTab() {
    tabCount++;
    const id = 'tab-' + tabCount;
    const content = '';
    const label = 'New Tab';

    // persist
    addTabToStorage(label, content, id);

    const tabEl = document.createElement('div');
    tabEl.className = 'tab active';
    tabEl.dataset.id = id;
    tabEl.textContent = label;
    tabEl.addEventListener('click', () => switchTab(id));

    tabsEl.appendChild(tabEl);
    editorEl.value = content;
}

function addTabToStorage(label, content, id) {
    const existing = loadTabsFromStorage();
    existing.push({ id, label, content });
    saveTabsToStorage(existing);
}

function switchTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const tab = document.querySelector(`.tab[data-id="${id}"]`);
    if (tab) tab.classList.add('active');
    editorEl.value = getTabContent(id);
}

function setActiveEditor() {
    const active = tabsEl.querySelector('.tab.active');
    if (!active) return;
    const id = active.dataset.id;
    editorEl.value = getTabContent(id);
}

function getTabContent(id) {
    const existing = loadTabsFromStorage();
    return existing.find(t => t.id === id)?.content || '';
}

document.getElementById('new-tab').addEventListener('click', createTab);

/* ---- Dragging windows ---- */
let dragState = null; // { winEl, startX, startY, initX, initY }

function onHeaderMouseDown(e) {
    const header = e.currentTarget.closest('.win-header');
    if (!header) return;
    const winEl = header.parentElement;
    const rect = winEl.getBoundingClientRect();
    dragState = {
        winEl,
        startX: e.clientX - rect.left,
        startY: e.clientY - rect.top,
        initX: rect.left,
        initY: rect.top
    };
}

document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    const winEl = dragState.winEl;
    let x = dragState.initX + e.clientX - dragState.startX;
    let y = dragState.initY + e.clientY - dragState.startY;
    // bounds
    x = Math.max(0, Math.min(x, window.innerWidth - (winEl.offsetWidth || 380)));
    y = Math.max(0, Math.min(y, window.innerHeight - (winEl.offsetHeight || 260)));
    winEl.style.left = x + 'px';
    winEl.style.top = y + 'px';
});

document.addEventListener('mouseup', () => { dragState = null; });


/* ---- Init: Restore tabs if notepad was open, then show files by default ---- */
(function init() {
    // Check if notepad has persisted tabs (e.g. from previous session)
    const savedTabs = loadTabsFromStorage();

    // Build the notepad window with its initial UI
    buildNotepadWindow(savedTabs);

    // Default: open files app on first visit
    setTimeout(() => {
        if (!document.getElementById('files-window').classList.contains('open') && !savedTabs.length) {
            openWindow('files-window');
        } else if (savedTabs.length) {
            openWindow('notepad-window');
        }
    }, 100);

})();

function buildNotepadWindow(savedTabs) {
    // Ensure #notepad-window exists in DOM
    let winEl = document.getElementById('notepad-window');
    if (!winEl) {
        winEl = document.createElement('div');
        winEl.id = 'notepad-window';
        winEl.className = 'window';
        winEl.innerHTML = `
            <div class="win-header">
                <span class="win-title"></span>
                <button class="win-close" onclick="closeWindow('notepad-window')">&times;</button>
            </div>
            <div id="tabs-bar">
                <div id="tabs"></div>
                <button id="new-tab">+ New Tab</button>
            </div>
            <div id="editor-container">
                <div class="editor-wrapper">
                    <textarea id="editor" placeholder="Type here..." spellcheck="false"></textarea>
                </div>
            </div>`;
        document.getElementById('desktop').appendChild(winEl);

        // Wire up events
        winEl.querySelector('.win-close').addEventListener('click', () => closeWindow('notepad-window'));
        editorEl = winEl.querySelector('#editor');
    } else {
        editorEl = winEl.querySelector('#editor');
    }

    // Restore tabs from storage — ensure at least one active tab exists
    if (savedTabs.length > 0) {
        for (const st of savedTabs) {
            const id = 'tab-' + (st.id.split('-').pop() || tabCount);
            createTab();
        }
        // Make sure first tab is active
        const first = tabsEl.querySelector('.tab');
        if (first) first.classList.add('active');
        editorEl.value = getTabContent(first.dataset.id);
    } else {
        createTab();
    }

    openWindow('notepad-window');
}

function closeWindow(winId) {
    const el = document.getElementById(winId);
    if (el) {
        el.classList.remove('open');
        setTimeout(() => {
            if (!document.getElementById(winId).classList.contains('open')) {
                el.style.display = 'none';
                // Remove from DOM after fade-out
                setTimeout(() => {
                    document.getElementById(winId)?.remove();
                }, 300);
            }
        }, 250);
    }
}

// Expose globally for inline onclick handlers
window.closeWindow = closeWindow;
window.openWindow = openWindow;
</style>
</head>
<body>

<div id="desktop">

  <!-- Files window -->
  <div id="files-window" class="window">
    <div class="win-header" onmousedown="onHeaderMouseDown(event)">
      <span class="win-title"></span>
      <button class="win-close" onclick="closeWindow('files-window')">&times;</button>
    </div>
    <div class="win-body">
      <div id="files-path" style="color:#90a4ae;font-size:13px;padding-left:8px;margin-bottom:6px;">/</div>
      <div id="files-list" class="files-list"></div>
    </div>
  </div>

  <!-- Notepad window -->
  <div id="notepad-window" style="display:none;" class="window">
    <div class="win-header" onmousedown="onHeaderMouseDown(event)">
      <span class="win-title"></span>
      <button class="win-close" onclick="closeWindow('notepad-window')">&times;</button>
    </div>
    <div id="tabs-bar">
      <div id="tabs"></div>
      <button id="new-tab">+ New Tab</button>
    </div>
    <div id="editor-container">
      <div class="editor-wrapper">
        <textarea id="editor" placeholder="Type here..." spellcheck="false"></textarea>
      </div>
    </div>
  </div>

</div>

<!-- Taskbar -->
<div id="taskbar">
  <span class="brand" style="cursor:pointer;">Ubuntu</span>
  <button id="open-files" class="launcher-btn" onclick="openWindow('files-window')">
    📁 Files
  </button>
  <button id="open-notepad" class="launcher-btn" onclick="openWindow('notepad-window')">
    ✏️ Notepad
  </button>
</div>

<script>
/* ---- Filesystem Navigation (Files app) ---- */
const FILESYSTEM = {
    '/': ['bin', 'etc', 'home', 'usr', 'var'],
    '/bin': ['bash', 'ls', 'cat'],
    '/etc': ['passwd', 'hosts', 'resolv.conf'],
    '/home': ['user'],
    '/home/user': ['Documents', 'Downloads', 'Pictures', 'Desktop', '.bashrc'],
    '/home/user/Documents': ['notes.txt', 'readme.md'],
    '/home/user/Downloads': ['install.sh', 'setup.py'],
    '/home/user/Pictures': ['vacation.jpg', 'profile.png'],
    '/home/user/Desktop': ['launcher.desktop'],
    '/usr': ['bin', 'lib', 'share'],
    '/usr/bin': ['python3', 'node', 'git', 'docker'],
    '/usr/lib': ['libc.so.6', 'libstdc++.so.6'],
    '/usr/share': ['man', 'doc'],
    '/var': ['log', 'cache', 'tmp'],
    '/var/log': ['syslog', 'auth.log'],
    '/var/cache': ['apt', 'dpkg'],
};

function getEntries(path) {
    const parts = path.split('/').filter(Boolean);
    let current = FILESYSTEM;
    for (const p of parts) {
        if (!current[p]) return [];
        current = current[p];
    }
    return Array.isArray(current) ? current : [];
}

function getEntryType(path, name) {
    const full = path + '/' + name;
    return FILESYSTEM[full] !== undefined ? 'folder' : 'file';
}

const filesPathEl = document.getElementById('files-path');
const filesListEl = document.getElementById('files-list');
let currentPath = '/';

function renderFiles() {
    const entries = getEntries(currentPath);
    filesListEl.innerHTML = '';
    for (const name of entries) {
        const type = getEntryType(currentPath, name);
        const item = document.createElement('div');
        item.className = 'fs-item';
        item.textContent = type === 'folder' ? (name + '/') : name;
        item.addEventListener('dblclick', () => {
            if (type === 'folder') navigateTo(currentPath + '/' + name);
        });
        filesListEl.appendChild(item);
    }
}

function navigateTo(path) {
    currentPath = path.endsWith('/') ? path : path + '/';
    filesPathEl.textContent = currentPath;
    renderFiles();
}

document.getElementById('files-up').addEventListener('click', () => {
    if (currentPath === '/') return;
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    navigateTo(parts.length ? '/' + parts.join('/') : '/');
});


/* ---- Notepad Tab Management with localStorage persistence ---- */

function loadTabsFromStorage() {
    try {
        const raw = localStorage.getItem('notepad-tabs');
        if (!raw) return [];
        return JSON.parse(raw);
    } catch (e) { return []; }
}

function saveTabsToStorage(tabs) {
    try {
        localStorage.setItem('notepad-tabs', JSON.stringify(tabs));
    } catch (e) {}
}

let tabCount = 0;
const tabsEl = document.getElementById('tabs');
const editorEl = document.getElementById('editor');

function createTab() {
    tabCount++;
    const id = 'tab-' + tabCount;
    const label = 'New Tab';
    addTabToStorage(label, '', id);

    const tabEl = document.createElement('div');
    tabEl.className = 'tab active';
    tabEl.dataset.id = id;
    tabEl.textContent = label;
    tabEl.addEventListener('click', () => switchTab(id));
    tabsEl.appendChild(tabEl);
}

function addTabToStorage(label, content, id) {
    const existing = loadTabsFromStorage();
    existing.push({ id, label, content });
    saveTabsToStorage(existing);
}

function switchTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const tab = document.querySelector(`.tab[data-id="${id}"]`);
    if (tab) tab.classList.add('active');
    editorEl.value = getTabContent(id);
}

function getTabContent(id) {
    const existing = loadTabsFromStorage();
    return existing.find(t => t.id === id)?.content || '';
}

document.getElementById('new-tab').addEventListener('click', createTab);


/* ---- Window helpers (drag + open/close) ---- */
let dragState = null;

function onHeaderMouseDown(e) {
    const header = e.currentTarget.closest('.win-header');
    if (!header) return;
    const winEl = header.parentElement;
    const rect = winEl.getBoundingClientRect();
    dragState = {
        winEl,
        startX: e.clientX - rect.left,
        startY: e.clientY - rect.top,
        initX: rect.left,
        initY: rect.top
    };
}

document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    const winEl = dragState.winEl;
    let x = dragState.initX + e.clientX - dragState.startX;
    let y = dragState.initY + e.clientY - dragState.startY;
    x = Math.max(0, Math.min(x, window.innerWidth - (winEl.offsetWidth || 380)));
    y = Math.max(0, Math.min(y, window.innerHeight - (winEl.offsetHeight || 260)));
    winEl.style.left = x + 'px';
    winEl.style.top = y + 'px';
});

document.addEventListener('mouseup', () => { dragState = null; });


/* ---- Open / Close windows ---- */
function openWindow(winId) {
    const el = document.getElementById(winId);
    if (!el || !el.classList.contains('window')) return;
    el.style.display = '';
    // Force reflow then add class to trigger animation
    void el.offsetWidth;
    el.classList.add('open');
}

function closeWindow(winId) {
    const el = document.getElementById(winId);
    if (!el) return;
    el.classList.remove('open');
    setTimeout(() => {
        if (!document.getElementById(winId).classList.contains('open')) {
            el.style.display = 'none';
            setTimeout(() => {
                document.getElementById(winId)?.remove();
            }, 250);
        }
    }, 250);
}

window.openWindow = openWindow;


/* ---- Init ---- */
(function init() {
    // Rebuild notepad window with restored tabs if any exist (persistence across reloads)
    const savedTabs = loadTabsFromStorage();
    let winEl = document.getElementById('notepad-window');
    if (!winEl || !document.getElementById('tabs')) {
        winEl = document.createElement('div');
        winEl.id = 'notepad-window';
        winEl.className = 'window';
        winEl.innerHTML = `
            <div class="win-header" onmousedown="onHeaderMouseDown(event)">
                <span class="win-title"></span>
                <button class="win-close" onclick="closeWindow('notepad-window')">&times;</button>
            </div>
            <div id="tabs-bar">
                <div id="tabs"></div>
                <button id="new-tab">+ New Tab</button>
            </div>
            <div id="editor-container">
                <div class="editor-wrapper"><textarea id="editor" placeholder="Type here..." spellcheck="false"></textarea></div>
            </div>`;
        document.getElementById('desktop').appendChild(winEl);

        const editor = winEl.querySelector('#editor');
        if (savedTabs.length > 0) {
            for (const st of savedTabs) createTab();
            const first = tabsEl.querySelector('.tab');
            if (first) { first.classList.add('active'); editor.value = getTabContent(first.dataset.id); }
        } else {
            createTab();
        }
    }

    // Default open files on first visit; or notepad if it had saved state
    setTimeout(() => {
        const hasSavedState = loadTabsFromStorage().length > 0;
        const filesOpen = document.getElementById('files-window').classList.contains('open');
        if (!filesOpen && !hasSavedState) {
            openWindow('files-window');
        } else if (hasSavedState && !document.getElementById('notepad-window').classList.contains('open')) {
            openWindow('notepad-window');
        }
    }, 150);

})();
</script>

</body>
