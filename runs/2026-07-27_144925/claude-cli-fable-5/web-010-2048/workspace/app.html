<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1e222b;
    --cell: #2a2f3a;
    --text: #e8e9ec;
    --muted: #9aa1ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    user-select: none;
  }
  h1 { margin: 0 0 12px; font-size: 2rem; letter-spacing: 2px; }
  .top {
    width: 380px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .scorebox {
    background: var(--panel);
    padding: 8px 18px;
    border-radius: 8px;
    text-align: center;
  }
  .scorebox .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  #score { font-size: 1.4rem; font-weight: 700; }
  #reset {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #reset:hover { background: #2f6fd8; }
  #board {
    width: 380px;
    height: 380px;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cell);
    border-radius: 8px;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
    transition: background 0.1s;
  }
  .tile.v2    { background: #3a4150; }
  .tile.v4    { background: #46506333; background: #465063; }
  .tile.v8    { background: #b57a3c; }
  .tile.v16   { background: #c9682f; }
  .tile.v32   { background: #d65a3a; }
  .tile.v64   { background: #e04b2b; }
  .tile.v128  { background: #c9a227; }
  .tile.v256  { background: #d4a917; }
  .tile.v512  { background: #dfb000; }
  .tile.v1024 { background: #8b5cf6; font-size: 1.4rem; }
  .tile.v2048 { background: #10b981; font-size: 1.4rem; }
  .tile.big   { font-size: 1.2rem; }
  .hint { margin-top: 12px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="top">
  <div class="scorebox">
    <div class="label">Score</div>
    <div id="score">0</div>
  </div>
  <button id="reset">New Game</button>
</div>
<div id="board"></div>
<div class="hint">Use the arrow keys to move tiles.</div>

<script>
(function () {
  const SIZE = 4;
  let grid = [];
  let score = 0;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) cells.push([r, c]);
    return cells;
  }

  function spawnTile() {
    const cells = emptyCells();
    if (!cells.length) return;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  // Slide and merge one row toward the left; each tile merges at most once.
  function slideRow(row) {
    const tiles = row.filter(v => v !== 0);
    const out = [];
    let gained = 0;
    for (let i = 0; i < tiles.length; i++) {
      if (i + 1 < tiles.length && tiles[i] === tiles[i + 1]) {
        out.push(tiles[i] * 2);
        gained += tiles[i] * 2;
        i++;
      } else {
        out.push(tiles[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained };
  }

  function getLine(dir, i) {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left')  line.push(grid[i][j]);
      if (dir === 'right') line.push(grid[i][SIZE - 1 - j]);
      if (dir === 'up')    line.push(grid[j][i]);
      if (dir === 'down')  line.push(grid[SIZE - 1 - j][i]);
    }
    return line;
  }

  function setLine(dir, i, line) {
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left')  grid[i][j] = line[j];
      if (dir === 'right') grid[i][SIZE - 1 - j] = line[j];
      if (dir === 'up')    grid[j][i] = line[j];
      if (dir === 'down')  grid[SIZE - 1 - j][i] = line[j];
    }
  }

  function move(dir) {
    if (!['left', 'right', 'up', 'down'].includes(dir)) return false;
    let moved = false;
    let gainedTotal = 0;
    for (let i = 0; i < SIZE; i++) {
      const line = getLine(dir, i);
      const { row, gained } = slideRow(line);
      if (row.some((v, j) => v !== line[j])) moved = true;
      gainedTotal += gained;
      setLine(dir, i, row);
    }
    if (moved) {
      score += gainedTotal;
      spawnTile();
      render();
    }
    return moved;
  }

  function reset() {
    grid = emptyGrid();
    score = 0;
    spawnTile();
    spawnTile();
    render();
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'tile' + (v ? ' v' + v : '') + (v > 2048 ? ' big' : '');
        cell.textContent = v ? String(v) : '';
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = String(score);
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left',
      ArrowRight: 'right',
      ArrowUp: 'up',
      ArrowDown: 'down',
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  document.getElementById('reset').addEventListener('click', reset);

  window.game = {
    size: SIZE,
    reset,
    move,
    board() {
      return grid.map(row => row.slice());
    },
    setBoard(arr) {
      grid = arr.map(row => row.map(Number));
      render();
    },
    score() {
      return score;
    },
  };

  reset();
})();
</script>
</body>
</html>
