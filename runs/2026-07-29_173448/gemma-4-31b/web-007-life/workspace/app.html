<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: #4caf50;
        }

        #life {
            background-color: #000;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            image-rendering: pixelated;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #4caf50;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background-color: #4caf50;
            color: #1a1a1a;
        }

        button#play.active {
            background-color: #f44336;
            border-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Game of Life</h1>
    <canvas id="life"></canvas>
    <div class="controls">
        <button id="step">Step</button>
        <button id="play">Play</button>
        <button id="random">Random</button>
        <button id="clear">Clear</button>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('life');
        const ctx = canvas.getContext('2d');
        const btnStep = document.getElementById('step');
        const btnPlay = document.getElementById('play');
        const btnRandom = document.getElementById('random');
        const btnClear = document.getElementById('clear');

        // Grid dimensions (>= 40)
        const w = 60;
        const h = 60;
        const cellSize = 8; // 60 * 8 = 480px (meets >= 400 requirement)

        canvas.width = w * cellSize;
        canvas.height = h * cellSize;

        // State: using a typed array for efficiency
        let grid = new Uint8Array(w * h);
        let isPlaying = false;
        let playInterval = null;

        /**
         * API Implementation
         */
        window.life = {
            w,
            h,
            get: function(x, y) {
                if (x < 0 || x >= w || y < 0 || y >= h) return 0;
                return grid[y * w + x];
            },
            set: function(x, y, v) {
                if (x >= 0 && x < w && y >= 0 && y < h) {
                    grid[y * w + x] = v ? 1 : 0;
                }
            },
            step: function() {
                const nextGrid = new Uint8Array(w * h);

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        let neighbors = 0;
                        // Check 8 surrounding cells
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                neighbors += window.life.get(x + dx, y + dy);
                            }
                        }

                        const current = window.life.get(x, y);
                        // B3/S23 Rules
                        if (current === 0 && neighbors === 3) {
                            nextGrid[y * w + x] = 1;
                        } else if (current === 1 && (neighbors === 2 || neighbors === 3)) {
                            nextGrid[y * w + x] = 1;
                        } else {
                            nextGrid[y * w + x] = 0;
                        }
                    }
                }
                grid = nextGrid;
                draw();
            },
            clear: function() {
                grid.fill(0);
                draw();
            }
        };

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4caf50';
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (window.life.get(x, y)) {
                        ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                    }
                }
            }
        }

        // User Interaction: Painting
        let isDrawing = false;
        let drawMode = null; // 1 for alive, 0 for dead

        function handleInput(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            if (x >= 0 && x < w && y >= 0 && y < h) {
                window.life.set(x, y, drawMode);
                draw();
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            drawMode = window.life.get(x, y) ? 0 : 1; // Toggle based on first click
            handleInput(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) handleInput(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        // Control Logic
        btnStep.onclick = () => window.life.step();
        
        btnClear.onclick = () => {
            window.life.clear();
            if (isPlaying) togglePlay();
        };

        btnRandom.onclick = () => {
            for (let i = 0; i < w * h; i++) {
                grid[i] = Math.random() > 0.8 ? 1 : 0;
            }
            draw();
        };

        function togglePlay() {
            isPlaying = !isPlaying;
            btnPlay.classList.toggle('active', isPlaying);
            btnPlay.innerText = isPlaying ? 'Pause' : 'Play';
            if (isPlaying) {
                playInterval = setInterval(() => window.life.step(), 100);
            } else {
                clearInterval(playInterval);
            }
        }

        btnPlay.onclick = togglePlay;

        // Initial Draw
        draw();
    })();
</script>
</body>
</html>
