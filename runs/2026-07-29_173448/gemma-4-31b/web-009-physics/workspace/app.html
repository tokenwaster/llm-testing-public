<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Playground</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            background-color: #555;
        }

        #sim {
            background-color: #000;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="drop">Drop Ball</button>
        <button id="play">Play/Pause</button>
        <button id="clear">Clear All</button>
    </div>
    <canvas id="sim" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        const btnDrop = document.getElementById('drop');
        const btnPlay = document.getElementById('play');
        const btnClear = document.getElementById('clear');

        const GRAVITY = 0.25;
        const RESTITUTION = 0.8; // Energy kept after bounce
        const DEFAULT_RADIUS = 10;

        let balls = [];
        let isPlaying = true;

        // API Implementation
        window.sim = {
            w: canvas.width,
            h: canvas.height,
            
            balls() {
                return balls;
            },

            addBall(x, y, vx = 0, vy = 0, r) {
                const radius = (r !== undefined) ? r : DEFAULT_RADIUS;
                balls.push({ x, y, vx, vy, r: radius });
                draw(); // Redraw immediately when added
            },

            clear() {
                balls = [];
                draw();
            },

            step(dt = 1) {
                // Update Physics
                for (let i = 0; i < balls.length; i++) {
                    const b = balls[i];

                    // Gravity acceleration
                    b.vy += GRAVITY * dt;

                    // Position update
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;

                    // Boundary Collision: Floor
                    if (b.y + b.r > window.sim.h) {
                        b.y = window.sim.h - b.r;
                        b.vy *= -RESTITUTION;
                    } else if (b.y - b.r < 0) { // Ceiling
                        b.y = b.r;
                        b.vy *= -RESTITUTION;
                    }

                    // Boundary Collision: Right Wall
                    if (b.x + b.r > window.sim.w) {
                        b.x = window.sim.w - b.r;
                        b.vx *= -RESTITUTION;
                    } else if (b.x - b.r < 0) { // Left Wall
                        b.x = b.r;
                        b.vx *= -RESTITUTION;
                    }
                }
                draw();
            }
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4af';
            
            for (const b of balls) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }
        }

        // Game Loop
        function loop() {
            if (isPlaying) {
                window.sim.step();
            }
            requestAnimationFrame(loop);
        }

        // Event Handlers
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            // Add random horizontal velocity for fun on click
            window.sim.addBall(x, y, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
        });

        btnDrop.addEventListener('click', () => {
            // Drop from top center with a slight random spread
            const x = (canvas.width / 2) + (Math.random() * 40 - 20);
            window.sim.addBall(x, 50, 0, 0);
        });

        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
        });

        btnClear.addEventListener('click', () => {
            window.sim.clear();
        });

        // Initial start
        loop();
    </script>
</body>
</html>
