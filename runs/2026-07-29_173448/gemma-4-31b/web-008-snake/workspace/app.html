<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        #score {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #4caf50;
        }
        canvas {
            background-color: #1e1e1e;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #444;
        }
        button:active {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="score">Score: 0</div>
        <canvas id="snake" width="400" height="400"></canvas>
        <div class="controls">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('snake');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            
            // Configuration
            const w = 20; // Grid width
            const h = 20; // Grid height
            const cellSize = canvas.width / w;

            // State
            let snakeBody = [];
            let foodPos = [0, 0];
            let currentDir = 'right';
            let nextDir = 'right';
            let scoreVal = 0;
            let isAlive = false;
            let gameTimer = null;

            function getRandomFoodPos() {
                let x, y;
                do {
                    x = Math.floor(Math.random() * w);
                    y = Math.floor(Math.random() * h);
                } while (snakeBody.some(seg => seg[0] === x && seg[1] === y));
                return [x, y];
            }

            function draw() {
                // Background
                ctx.fillStyle = '#1e1e1e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Food
                ctx.fillStyle = '#ff5252';
                ctx.fillRect(foodPos[0] * cellSize + 1, foodPos[1] * cellSize + 1, cellSize - 2, cellSize - 2);

                // Snake
                ctx.fillStyle = '#4caf50';
                snakeBody.forEach((seg, index) => {
                    // Head is a slightly different color
                    if (index === 0) ctx.fillStyle = '#81c784';
                    else ctx.fillStyle = '#4caf50';
                    ctx.fillRect(seg[0] * cellSize + 1, seg[1] * cellSize + 1, cellSize - 2, cellSize - 2);
                });

                scoreEl.innerText = `Score: ${scoreVal}`;
            }

            function reset() {
                scoreVal = 0;
                isAlive = true;
                currentDir = 'right';
                nextDir = 'right';
                // Start length >= 3
                snakeBody = [
                    [10, 10],
                    [9, 10],
                    [8, 10]
                ];
                foodPos = getRandomFoodPos();
                draw();
            }

            function tick() {
                if (!isAlive) return;

                currentDir = nextDir;
                const head = [...snakeBody[0]];

                if (currentDir === 'up') head[1]--;
                else if (currentDir === 'down') head[1]++;
                else if (currentDir === 'left') head[0]--;
                else if (currentDir === 'right') head[0]++;

                // Wall collision
                if (head[0] < 0 || head[0] >= w || head[1] < 0 || head[1] >= h) {
                    isAlive = false;
                    draw();
                    return;
                }

                // Self collision
                if (snakeBody.some(seg => seg[0] === head[0] && seg[1] === head[1])) {
                    isAlive = false;
                    draw();
                    return;
                }

                snakeBody.unshift(head);

                // Eating food
                if (head[0] === foodPos[0] && head[1] === foodPos[1]) {
                    scoreVal++;
                    foodPos = getRandomFoodPos();
                } else {
                    snakeBody.pop();
                }

                draw();
            }

            function setDir(dir) {
                const opposites = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                if (dir !== opposites[currentDir]) {
                    nextDir = dir;
                }
            }

            function setFood(x, y) {
                foodPos = [x, y];
                draw();
            }

            // Programmatic API
            window.game = {
                w: w,
                h: h,
                reset: reset,
                tick: tick,
                setDir: setDir,
                setFood: setFood,
                snake: () => snakeBody,
                food: () => foodPos,
                alive: () => isAlive,
                score: () => scoreVal
            };

            // UI Event Listeners
            document.getElementById('start').addEventListener('click', () => {
                if (gameTimer) return;
                if (!isAlive) reset();
                gameTimer = setInterval(tick, 150);
            });

            document.getElementById('pause').addEventListener('click', () => {
                clearInterval(gameTimer);
                gameTimer = null;
            });

            document.getElementById('reset').addEventListener('click', () => {
                clearInterval(gameTimer);
                gameTimer = null;
                reset();
            });

            window.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp':    setDir('up'); break;
                    case 'ArrowDown':  setDir('down'); break;
                    case 'ArrowLeft':  setDir('left'); break;
                    case 'ArrowRight': setDir('right'); break;
                }
            });

            // Init
            reset();

        })();
    </script>
</body>
</html>
