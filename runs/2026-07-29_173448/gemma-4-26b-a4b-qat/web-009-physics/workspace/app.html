<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Physics Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #eee;
            font-family: sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            background-color: #1e1e1e;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #444;
        }

        button:active {
            background-color: #555;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="sim" width="600" height="600"></canvas>
    <div class="controls">
        <button id="drop">Drop</button>
        <button id="play">Play</button>
        <button id="clear">Clear</button>
    </div>
</div>

<script>
    /**
     * Physics Playground Logic
     */
    (function() {
        const canvas = document.getElementById('sim');
        const ctx = canvas.getContext('2d');
        const dropBtn = document.getElementById('drop');
        const playBtn = document.getElementById('play');
        const clearBtn = document.getElementById('clear');

        const gravity = 0.25;
        const restitution = 0.8; // Energy loss on bounce
        let isPlaying = true;
        let balls = [];

        class Ball {
            constructor(x, y, vx, vy, r) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.r = r;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }

            update(dt, w, h) {
                // Apply gravity
                this.vy += gravity * dt;
                
                // Apply velocity
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Collision detection: Floor/Ceiling
                if (this.y - this.r < 0) {
                    this.y = this.r;
                    this.vy = -this.vy * restitution;
                } else if (this.y + this.r > h) {
                    this.y = h - this.r;
                    this.vy = -this.vy * restitution;
                }

                // Collision detection: Walls
                if (this.x - this.r < 0) {
                    this.x = this.r;
                    this.vx = -this.vx * restitution;
                } else if (this.x + this.r > w) {
                    this.x = w - this.r;
                    this.vx = -this.vx * restitution;
                }
            }
        }

        function render() {
            if (isPlaying) {
                sim.step(1);
            }
            requestAnimationFrame(render);
        }

        // The Programmatic API
        window.sim = {
            get w() { return canvas.width; },
            get h() { return canvas.height; },
            balls: () => [...balls],
            addBall: (x, y, vx = 0, vy = 0, r) => {
                const radius = r || 15;
                balls.push(new Ball(x, y, vx, vy, radius));
                draw();
            },
            clear: () => {
                balls = [];
                draw();
            },
            step: (dt = 1) => {
                for (let ball of balls) {
                    ball.update(dt, canvas.width, canvas.height);
                }
                draw();
            }
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let ball of balls) {
                ball.draw(ctx);
            }
        }

        // Event Listeners
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            window.sim.addBall(x, y, Math.random() * 10 - 5, Math.random() * 10 - 5);
        });

        dropBtn.addEventListener('click', () => {
            window.sim.addBall(canvas.width / 2, 50, 0, 2);
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? "Pause" : "Play";
        });

        clearBtn.addEventListener('click', () => {
            window.sim.clear();
        });

        // Initial render loop
        requestAnimationFrame(render);

    })();
</script>

</body>
</html>
