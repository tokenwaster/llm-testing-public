<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        body {
            background-color: #121212;
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            background-color: #333;
            transition: all 0.2s ease;
            user-select: none;
        }
        button:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #step { background-color: #2c5e8a; }
        #play { background-color: #2e7d32; }
        #random { background-color: #7b1fa2; }
        #clear { background-color: #c62828; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div id="container">
    <canvas id="life"></canvas>
    <div class="controls">
        <button id="step">Step</button>
        <button id="play">Play</button>
        <button id="random">Random</button>
        <button id="clear">Clear</button>
    </div>
</div>

<script>
(function() {
    const w = 60;
    const h = 60;
    const cellSize = 10;
    const canvas = document.getElementById('life');
    const ctx = canvas.getContext('2d');

    canvas.width = w * cellSize;
    canvas.height = h * cellSize;

    let currentGrid = new Uint8Array(w * h);
    let nextGrid = new Uint8Array(w * h);
    let isRunning = false;
    let playInterval = null;
    let isMouseDown = false;
    let drawMode = 1;

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const idx = y * w + x;
                if (currentGrid[idx] === 1) {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                } else {
                    ctx.fillStyle = '#262626';
                    ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                }
            }
        }
    }

    function step() {
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let neighbors = 0;
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                            neighbors += currentGrid[ny * w + nx];
                        }
                    }
                }
                const idx = y * w + x;
                const alive = currentGrid[idx] === 1;
                if (alive) {
                    nextGrid[idx] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                } else {
                    nextGrid[idx] = (neighbors === 3) ? 1 : 0;
                }
            }
        }
        // Swap grids
        let temp = currentGrid;
        currentGrid = nextGrid;
        nextGrid = temp;
        render();
    }

    // API Implementation
    window.life = {
        w,
        h,
        get(x, y) {
            if (x < 0 || x >= w || y < 0 || y >= h) return 0;
            return currentGrid[y * w + x];
        },
        set(x, y, v) {
            if (x >= 0 && x < w && y >= 0 && y < h) {
                currentGrid[y * w + x] = v ? 1 : 0;
                render();
            }
        },
        step() {
            step();
        },
        clear() {
            currentGrid.fill(0);
            render();
        }
    };

    // Controls
    document.getElementById('step').addEventListener('click', () => {
        window.life.step();
    });

    document.getElementById('play').addEventListener('click', () => {
        if (isRunning) {
            clearInterval(playInterval);
            playInterval = null;
            isRunning = false;
            document.getElementById('play').textContent = 'Play';
        } else {
            isRunning = true;
            playInterval = setInterval(window.life.step, 100);
            document.getElementById('play').textContent = 'Pause';
        }
    });

    document.getElementById('random').addEventListener('click', () => {
        for (let i = 0; i < w * h; i++) {
            currentGrid[i] = Math.random() > 0.85 ? 1 : 0;
        }
        render();
    });

    document.getElementById('clear').addEventListener('click', () => {
        window.life.clear();
    });

    // Interaction
    function getMouseCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = Math.floor(((e.clientX - rect.left) * scaleX) / cellSize);
        const y = Math.floor(((e.clientY - rect.top) * scaleY) / cellSize);
        return { x, y };
    }

    canvas.addEventListener('mousedown', (e) => {
        const { x, y } = getMouseCoords(e);
        if (x >= 0 && x < w && y >= 0 && y < h) {
            isMouseDown = true;
            drawMode = window.life.get(x, y) === 1 ? 0 : 1;
            window.life.set(x, y, drawMode);
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const { x, y } = getMouseCoords(e);
        if (x >= 0 && x < w && y >= 0 && y < h) {
            if (window.life.get(x, y) !== drawMode) {
                window.life.set(x, y, drawMode);
            }
        }
    });

    window.addEventListener('mouseup', () => {
        isMouseDown = false;
    });

    // Initial render
    render();

})();
</script>
</body>
</html>
