<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d12;
      color: #eef6f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 25%, #18252b 0, #0c1217 38%, #070a0e 100%);
    }

    main {
      width: min(92vw, 560px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 7vw, 3.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 38px;
      margin-bottom: 10px;
      padding: 0 4px;
      font-weight: 700;
    }

    #score {
      font-size: 1.25rem;
      color: #8df5b2;
    }

    #message {
      color: #aebcc4;
    }

    #snake {
      display: block;
      width: min(92vw, 480px);
      height: min(92vw, 480px);
      min-width: 400px;
      min-height: 400px;
      max-width: 100%;
      max-height: none;
      margin: 0 auto;
      border: 2px solid #33474f;
      border-radius: 12px;
      background: #0c1418;
      box-shadow: 0 18px 55px #000a, inset 0 0 30px #0005;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-width: 92px;
      padding: 11px 17px;
      border: 1px solid #3b555d;
      border-radius: 9px;
      color: #edf8f2;
      background: #17252b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 100ms ease, background 100ms ease, border-color 100ms ease;
    }

    button:hover {
      background: #21353c;
      border-color: #68a487;
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    button:focus-visible {
      outline: 3px solid #69e99a;
      outline-offset: 2px;
    }

    #start {
      background: #17643a;
      border-color: #42b873;
    }

    .hint {
      margin: 13px 0 0;
      color: #809098;
      font-size: 0.9rem;
    }

    @media (max-width: 450px) {
      body {
        padding: 12px;
      }

      #snake {
        min-width: 0;
        width: 92vw;
        height: 92vw;
      }

      button {
        min-width: 0;
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Snake</h1>

    <div class="status">
      <div id="score">Score: 0</div>
      <div id="message">Ready</div>
    </div>

    <canvas id="snake" width="480" height="480" aria-label="Snake game board"></canvas>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <p class="hint">Use the arrow keys to steer</p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("snake");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const messageEl = document.getElementById("message");

      const W = 20;
      const H = 20;
      const CELL = canvas.width / W;
      const TICK_MS = 115;

      const vectors = {
        up: [0, -1],
        down: [0, 1],
        left: [-1, 0],
        right: [1, 0]
      };

      const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
      };

      let body;
      let foodPos;
      let direction;
      let queuedDirection;
      let isAlive;
      let points;
      let timer = null;
      let statusText = "Ready";

      function sameCell(a, b) {
        return a[0] === b[0] && a[1] === b[1];
      }

      function randomFood() {
        const free = [];

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (!body.some(segment => segment[0] === x && segment[1] === y)) {
              free.push([x, y]);
            }
          }
        }

        foodPos = free.length
          ? free[Math.floor(Math.random() * free.length)]
          : [-1, -1];
      }

      function stopTimer() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function updateStatus() {
        scoreEl.textContent = `Score: ${points}`;
        messageEl.textContent = statusText;
      }

      function roundedCell(x, y, inset, radius) {
        const px = x * CELL + inset;
        const py = y * CELL + inset;
        const size = CELL - inset * 2;
        ctx.beginPath();
        ctx.roundRect(px, py, size, size, radius);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#0b1317";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(120, 170, 170, 0.07)";
        ctx.lineWidth = 1;
        for (let i = 1; i < W; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL + 0.5, 0);
          ctx.lineTo(i * CELL + 0.5, canvas.height);
          ctx.stroke();
        }
        for (let i = 1; i < H; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * CELL + 0.5);
          ctx.lineTo(canvas.width, i * CELL + 0.5);
          ctx.stroke();
        }

        if (foodPos && foodPos[0] >= 0 && foodPos[1] >= 0) {
          const cx = (foodPos[0] + 0.5) * CELL;
          const cy = (foodPos[1] + 0.5) * CELL;

          ctx.shadowColor = "#ff536d";
          ctx.shadowBlur = 14;
          ctx.fillStyle = "#ff536d";
          ctx.beginPath();
          ctx.arc(cx, cy, CELL * 0.31, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = "#ff9baa";
          ctx.beginPath();
          ctx.arc(cx - CELL * 0.1, cy - CELL * 0.11, CELL * 0.07, 0, Math.PI * 2);
          ctx.fill();
        }

        body.forEach((segment, index) => {
          ctx.shadowColor = index === 0 ? "#6effa3" : "transparent";
          ctx.shadowBlur = index === 0 ? 10 : 0;
          ctx.fillStyle = index === 0 ? "#6effa3" : "#35bd70";
          roundedCell(segment[0], segment[1], 2, 6);
          ctx.fill();
        });
        ctx.shadowBlur = 0;

        if (body.length) {
          const head = body[0];
          const [dx, dy] = vectors[direction];
          const perpendicular = [-dy, dx];

          for (const side of [-1, 1]) {
            const ex = (head[0] + 0.5) * CELL
              + dx * CELL * 0.18
              + perpendicular[0] * side * CELL * 0.18;
            const ey = (head[1] + 0.5) * CELL
              + dy * CELL * 0.18
              + perpendicular[1] * side * CELL * 0.18;

            ctx.fillStyle = "#07100b";
            ctx.beginPath();
            ctx.arc(ex, ey, CELL * 0.055, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (!isAlive) {
          ctx.fillStyle = "rgba(3, 7, 9, 0.58)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "700 34px system-ui, sans-serif";
          ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
        }

        updateStatus();
      }

      function reset() {
        stopTimer();
        const cx = Math.floor(W / 2);
        const cy = Math.floor(H / 2);

        body = [
          [cx, cy],
          [cx - 1, cy],
          [cx - 2, cy]
        ];
        direction = "right";
        queuedDirection = "right";
        isAlive = true;
        points = 0;
        statusText = "Ready";
        randomFood();
        draw();
      }

      function tick() {
        if (!isAlive) return;

        direction = queuedDirection;
        const [dx, dy] = vectors[direction];
        const head = body[0];
        const newHead = [head[0] + dx, head[1] + dy];

        const hitWall =
          newHead[0] < 0 ||
          newHead[0] >= W ||
          newHead[1] < 0 ||
          newHead[1] >= H;

        const eating = sameCell(newHead, foodPos);
        const collisionBody = eating ? body : body.slice(0, -1);
        const hitSelf = collisionBody.some(segment => sameCell(segment, newHead));

        if (hitWall || hitSelf) {
          isAlive = false;
          statusText = "Game over";
          stopTimer();
          draw();
          return;
        }

        body.unshift(newHead);

        if (eating) {
          points++;
          randomFood();
        } else {
          body.pop();
        }

        statusText = timer === null ? "Paused" : "Playing";
        draw();
      }

      function setDir(next) {
        if (!Object.prototype.hasOwnProperty.call(vectors, next)) return;
        if (next === opposite[direction]) return;
        queuedDirection = next;
      }

      function setFood(x, y) {
        foodPos = [Number(x), Number(y)];
        draw();
      }

      function start() {
        if (!isAlive || timer !== null) return;
        statusText = "Playing";
        timer = setInterval(tick, TICK_MS);
        draw();
      }

      function pause() {
        if (timer === null) return;
        stopTimer();
        statusText = isAlive ? "Paused" : "Game over";
        draw();
      }

      document.getElementById("start").addEventListener("click", start);
      document.getElementById("pause").addEventListener("click", pause);
      document.getElementById("reset").addEventListener("click", reset);

      window.addEventListener("keydown", event => {
        const keyToDirection = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right"
        };

        const next = keyToDirection[event.key];
        if (next) {
          event.preventDefault();
          setDir(next);
        }
      });

      window.game = {
        w: W,
        h: H,
        reset,
        tick,
        setDir,
        setFood,
        snake: () => body.map(segment => [...segment]),
        food: () => [...foodPos],
        alive: () => isAlive,
        score: () => points
      };

      reset();
    })();
  </script>
</body>
</html>
