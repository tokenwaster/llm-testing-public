<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Spreadsheet</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .spreadsheet-container {
            width: 640px;
            height: 450px;
            border: 2px solid #333;
            position: relative;
            overflow: auto;
            background-color: white;
            user-select: none; /* Prevent text selection on grid */
        }
        table {
            border-collapse: collapse;
            width: 100%;
            height: 100%;
        }
        th, td {
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            box-sizing: border-box;
            padding: 0;
            cursor: default;
        }
        
        /* Headers */
        th.header-col {
            width: 52px;
            text-align: center;
            background-color: #f4f4f4;
            font-weight: bold;
            color: #666;
            height: 30px;
        }
        th.header-row {
            width: 30px;
            height: 52px;
            text-align: center;
            background-color: #f4f4f4;
            font-weight: bold;
            color: #666;
        }
        
        /* Cell Inputs */
        td.cell {
            width: 52px;
            height: 30px;
            position: relative;
        }
        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            text-align: right;
            padding-right: 4px;
            font-family: inherit;
            resize: none;
            cursor: pointer;
        }
        
        /* Status Text for cells */
        .display-value {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding-right: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button {
            padding: 6px 12px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #0056b3; }
        
        textarea {
            width: 100%;
            padding: 8px;
            font-family: monospace;
            background-color: #fff;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="spreadsheet-container" id="grid-area">
    <table id="sheet-table">
        <!-- Generated by JS -->
    </table>
</div>

<div class="controls">
    <button id="export">Export CSV</button>
    <textarea id="csv" rows="6"></textarea>
</div>

<script>
(function() {
    // --- Configuration ---
    const COLS = 10; // A-J
    const ROWS = 10; // 1-10
    
    // --- State Management ---
    const MAX_RECALC_LOOPS = 100; // Safety against infinite recursion in calculation
    
    // Map: CellID (e.g. "A1") -> { raw: string, display: string/number }
    let cellState = new Map();

    // DOM Elements
    const gridArea = document.getElementById('grid-area');
    const csvTextarea = document.getElementById('csv');
    const exportBtn = document.getElementById('export');

    // --- Initialization ---
    
    function getCellId(col, row) {
        const letters = "ABCDEFGHIJ";
        return letters[col] + row;
    }

    function initGrid() {
        const table = document.getElementById('sheet-table');
        
        // Header Row 0 (Column Labels A-J)
        let trHeader1 = document.createElement('tr');
        for(let i=0; i<COLS; i++) {
            let th = document.createElement('th');
            th.className = 'header-col';
            th.textContent = getCellId(i, 1); // Labels A-J
            trHeader1.appendChild(th);
        }
        table.appendChild(trHeader1);

        // Row Headers (Rows 1-10) + Data Rows
        for(let r=1; r<=ROWS; r++) {
            let rowTr = document.createElement('tr');
            
            // Row Header cell (numbers 1-10)
            let thRowHeader = document.createElement('th');
            thRowHeader.className = 'header-row';
            thRowHeader.textContent = r;
            rowTr.appendChild(thRowHeader);

            // Data cells
            for(let c=0; c<COLS; c++) {
                const id = getCellId(c, r);
                
                let td = document.createElement('td');
                td.className = 'cell';
                td.id = `cell-${id}`;
                
                let input = document.createElement('input');
                input.type = "text"; // Use text but handle carefully
                input.inputMode = "text"; // Ensure standard keyboard handling
                
                // Store state in the input's attributes to avoid race conditions with value
                // However, we sync input.value from our 'display' state mostly.
                
                td.appendChild(input);
                rowTr.appendChild(td);
            }
            table.appendChild(rowTr);
        }
    }

    // --- Logic ---

    function initState() {
        // Initialize empty state for all cells
        for(let r=1; r<=ROWS; r++) {
            for(let c=0; c<COLS; c++) {
                const id = getCellId(c, r);
                cellState.set(id, { 
                    raw: "", 
                    display: "" // Empty string represents empty/zero contextually usually, but "non-numeric plain text displays as itself"
                });
            }
        }
    }

    function updateSheetState() {
        initState();
        renderDisplay();
    }

    function renderDisplay() {
        // Sync DOM with State for visual representation
        cellState.forEach((state, id) => {
            const el = document.getElementById(`cell-${id}`);
            if (el) {
                // The input value is raw text. 
                // Requirement: "clicking into it shows the raw text... clicking away commits"
                // This implies a 'blur' or 'change' event sets the computed value, while focus keeps raw.
                // We handle this in event listeners. For now, keep raw text as base.
                
                // Wait, we need to distinguish between "Editing Mode" and "Display Mode".
                // But `input` is always visible. Let's store Raw Text in input.value
                // And computed value in a custom property or just handle via CSS?
                // Requirement: "When a cell is not being edited it displays its COMPUTED value"
                
                const input = el.querySelector('input');
                // We use a data attribute to track raw state if we want, 
                // but easier: When editing (focused), show Raw. When blurred, show Computed.
                
                // But wait, we also need to update the 'raw' string stored in cellState.
                // Let's separate: input.value holds the CURRENT RAW text of what user typed.
                // However, for "Commit on blur", we set the 'raw' property based on current input value.
            }
        });
    }

    function getValueForFormula(id) {
        const cell = cellState.get(id);
        if (cell === undefined) return 0;
        
        // Return numeric value of display. If display is empty string, return 0.
        let val = parseFloat(cell.display);
        return isNaN(val) ? 0 : val;
    }

    function evaluateExpression(expr, availableCells) {
        // Safety check: simple regex for cell references A1-J10
        // We must handle operator precedence, parentheses, and cell refs.
        
        let cleanExpr = expr;

        // 1. Replace Cell References with their Values
        const regexCellRef = /([A-J])(\d+)/g;
        
        if (regexCellRef.test(cleanExpr)) {
            cleanExpr = cleanExpr.replace(regexCellRef, (match, colLetter, rowNum) => {
                const cellId = `${colLetter}${rowNum}`;
                // If the referenced cell has no value or is #CYCLE/#ERR, we generally treat it as 0 for arithmetic 
                // unless specifically handled. The prompt says empty counts as 0.
                // We check cellState. If raw starts with =, we have formula state.
                
                let targetCell = cellState.get(cellId);
                if (!targetCell) return "0";
                
                let displayVal = targetCell.display;
                
                // Handle #CYCLE, #ERR explicitly as numbers for calculation? 
                // Usually formulas fail on errors. But to support A1+1 where A1 is #CYCLE:
                // Requirement: Circular references display exactly #CYCLE in every cell of the cycle.
                // This implies internal resolution shouldn't necessarily crash if we treat cyclic blocks as 0 or undefined?
                // Actually, simpler: If I'm evaluating B2 based on A1, and A1 is part of a cycle (#CYCLE), 
                // then B2 depends on #CYCLE. Does B2 become #CYCLE too? Usually yes in spreadsheets.
                
                if (displayVal === "#CYCLE" || displayVal === "#ERR") return "0"; // Break dependency or fail
                
                let num = parseFloat(displayVal);
                if (isNaN(num)) return "0";
                return num;
            });
        }

        try {
            // 2. Evaluate Math
            // Create a function context to allow using Math functions safely
            const f = new Function('return ' + cleanExpr);
            return f();
        } catch (e) {
            return "#ERR";
        }
    }

    function computeAll() {
        // Build Dependency Graph for Cycle Detection
        
        // Map: CellID -> List of CellIDs it depends on
        const dependencies = new Map();
        
        // Set to store cells that are formulas (start with =)
        const formulaCells = new Set();

        cellState.forEach((state, id) => {
            if (id.includes('A') || true) { // Iterate all
            
                const inputVal = state.raw;
                
                // Identify Formula Cells
                if (inputVal && inputVal.startsWith('=')) {
                    formulaCells.add(id);
                    
                    // Extract dependencies (simple regex)
                    // Regex: Match A1, B2, etc. Case insensitive for letters? Input uses A-J.
                    const deps = id.toString().match(/[A-J]\d+/g); 
                    if (deps) {
                        dependencies.set(id, deps.map(d => d));
                    } else {
                        // If syntax error or no refs detected but is formula, it might be pure math
                        // Store empty deps for now.
                        dependencies.set(id, []);
                    }
                }
            }
        });

        // --- Cycle Detection (DFS) ---
        // We need to identify nodes in Strongly Connected Components or simple cycles.
        // Since N is small (100), simple iterative update + check for "infinite loop" logic is complex.
        // Better: Topological Sort on the graph of dependencies?
        
        // Let's use Kahn's Algorithm logic adapted for SCCs, but specifically:
        // We want to know if a node depends on itself (directly or indirectly).
        
        const nodes = Array.from(formulaCells); // Only care about formulas
        
        if (nodes.length === 0) {
            renderAll();
            return;
        }

        // Compute In-Degree for each formula cell (number of dependencies that are also formula cells?)
        // Wait, dependency is "I need you". If A needs B. A -> B? Or B -> A? 
        // Usually graph edges point to what is needed. A -> B (A depends on B).
        
        const inDegree = new Map();
        nodes.forEach(n => inDegree.set(n, 0));

        nodes.forEach(node => {
            const deps = dependencies.get(node) || [];
            deps.forEach(dep => {
                if (!formulaCells.has(dep)) {
                    // Dependency is a constant/empty/non-formula. No cycle possible via this path alone involving formulas.
                    // Unless the non-formula cell itself changes? Constants don't change.
                } else if (node !== dep) {
                    // Only count cycles within formula cells
                    inDegree.set(node, (inDegree.get(node) || 0) + 1); 
                    // Actually Kahn's uses in-degree to find starting nodes (0 dependencies).
                    // But for dependency graph where edges go "A -> B" means A needs B.
                    // If I have A->B and B->C, cycle is impossible unless A->...->A exists.
                }
            });
        });

        // Wait, simple topological sort won't give SCCs easily.
        // But we just need to know if a cycle exists involving the node.
        
        // Let's use a simplified iterative solver with a "loop counter" logic?
        // No, let's build the actual graph adjacency list (A -> B means A needs B)
        // Cycle detection: DFS on the graph where edges represent dependencies.
        // Node is in cycle if we visit it again during a single DFS traversal (back edge).
        
        const visited = new Set();
        const recStack = new Set();
        const cyclesSet = new Set();

        function hasCycle(node) {
            if (!formulaCells.has(node)) return false; // Only traverse formula cells
            
            // Mark as visiting
            visited.add(node);
            recStack.add(node);

            const deps = dependencies.get(node) || [];
            for (const dep of deps) {
                if (!formulaCells.has(dep)) continue; // Skip non-formula refs
                
                if (!visited.has(dep)) {
                    if (hasCycle(dep)) return true;
                } else if (recStack.has(dep)) {
                    // Found a back edge -> Cycle detected
                    // We need to capture the entire cycle nodes.
                    // Since we just need to know which cells are in cycles:
                    // Any node reachable from this back-edge is part of it.
                    return true; 
                }
            }

            recStack.delete(node);
            return false;
        }

        // This simple DFS check returns TRUE if ANY cycle exists in the component.
        // We need to mark specifically the cells involved.
        
        // Let's use SCC logic or standard cycle marking.
        // Re-doing with standard SCC (Kahn's variant on dependencies):
        
        // Actually, simpler approach for small grid:
        // Compute values iteratively 10 times?
        // If we have a cycle A->B, B->A. Iteration 1: A=..., B=... (old vals).
        // Iteration 2: New vals propagate. They stabilize or oscillate.
        // Requirement: "Circular references display exactly #CYCLE".
        
        // Let's implement explicit Cycle Detection using Tarjan's algorithm or DFS coloring.
        
        const WHITE = 0, GRAY = 1, BLACK = 2;
        const color = new Map();
        const cyclesInvolving = new Set();

        // Helper to resolve a cell value (memoized)
        let memoValues = new Map(); // Store computed results for non-cyclic cells
        
        // Initialize colors
        nodes.forEach(n => color.set(n, WHITE));

        function detectAndMark() {
            nodes.forEach(n => cyclesInvolving.delete(n));
            
            for (const node of nodes) {
                if (color.get(node) !== WHITE) continue;
                
                const stack = [];
                stack.push(node);
                // Standard cycle detection isn't enough, we need to mark ALL nodes in cycle.
                // We can use the 'Recursion Stack' check logic but store nodes.
                
                // Actually, let's rely on a simple recursive DFS that returns a Set of cycles found? 
                // Or better: Compute dependencies graph -> Find SCCs.
            }
        }
        
        // Let's implement Tarjan's or simply use iterative resolution until stable + check if changed.
        // Wait, the requirement is strict about #CYCLE display.
        
        // Let's stick to a topological sort attempt. If a node has in-degree 0 (in dependency graph), compute it first.
        // Dependency Graph Edge: From 'User' -> 'Dependant'. No, Edge A->B means A depends on B?
        // Usually, to calculate A, I need B. So B supports A.
        // If we want order of evaluation, we want nodes with NO dependencies (source) first.
        
        // Build Adjacency List for "Who supports whom":
        const adj = new Map(); // B -> [A] (B supports A)
        
        formulaCells.forEach(node => {
            let deps = dependencies.get(node) || [];
            deps.forEach(dep => {
                if (!formulaCells.has(dep)) return;
                if (!adj.has(dep)) adj.set(dep, []);
                adj.get(dep).push(node);
            });
        });

        // Compute In-Degree for dependency graph (Who am I needed by?) -> No.
        // We need nodes that don't depend on anyone (In-degree 0 in "DependsOn" graph) first.
        // Graph: Node U -> V means U depends on V.
        // We want to compute V before U. So we look for nodes with no outgoing edges in this "DependsOn" graph? No.
        // If A->B, we need B's value to calc A. So B is the dependency.
        
        const inDegree = new Map(); // Stores number of dependencies a cell has.
        nodes.forEach(n => inDegree.set(n, 0));
        nodes.forEach(node => {
            const deps = dependencies.get(node) || [];
            for (let d of deps) {
                if (formulaCells.has(d)) inDegree.set(node, inDegree.get(node)+1);
            }
        });

        // Queue for iterative topo sort
        let queue = [];
        nodes.forEach(n => { if(inDegree.get(n) === 0) queue.push(n); });
        
        while(queue.length > 0) {
            const curr = queue.shift();
            // Process curr. It supports others? No, it's a dependency provider?
            // Wait. In our "DependsOn" graph (A->B), A needs B.
            // If we remove A (compute it), in-degree of nothing changes because edges go to dependencies.
            // This is not standard topo sort logic for resolution. 
            // Standard: Topo Sort gives an ordering where all dependencies appear before dependents?
            // No, that's if edges are "Provides".
            
            // If edges are A->B (A needs B). To compute A, we need B computed.
            // So B must be before A.
            // But in this graph structure, B is the target of arrow.
            // We want to process targets first? No, that's reverse topo sort.
            
            // Let's just use DFS cycle detection which is robust.
        }
        
        // Tarjan's Algorithm for SCCs (implies finding cycles)
        const ids = new Map();
        const low = new Map();
        const stack = [];
        const onStack = new Set();
        const sccs = []; // List of Sets
        
        function dfsTarjan(u) {
            const uId = ids.get(u);
            if (uId !== undefined) return;

            ids.set(u, uId);
            low.set(u, uId);
            stack.push(u);
            onStack.add(u);

            const deps = dependencies.get(u) || [];
            for(let d of deps) {
                if (!formulaCells.has(d)) continue; // Skip non-formulas
                
                if (ids.get(d) === undefined) {
                    dfsTarjan(d);
                    low.set(u, Math.min(low.get(u), low.get(d)));
                } else if (onStack.has(d)) {
                    low.set(u, Math.min(low.get(u), ids.get(d)));
                }
            }

            let scc = [];
            while(true) {
                const v = stack.pop();
                onStack.delete(v);
                scc.push(v);
                if (v === u) break;
            }
            if (scc.length > 1 || (scc.length === 1 && ids.get(scc[0]) !== low.get(scc[0]))) {
                // Cycle found or self-loop (which is a cycle of 1 node depending on itself?)
                // A->A dependency is technically a cycle.
            }
            sccs.push(new Set(scc));
        }

        nodes.forEach(n => { if(ids.get(n) === undefined) dfsTarjan(n); });
        
        // Mark all nodes that are part of an SCC with size > 1 or self-loop (implied by graph logic?)
        // Actually, A->A in dependency list makes it a cycle.
        // In Tarjan's, if u is part of SCC, and SCC has multiple nodes, it's a cycle.
        // If SCC has 1 node but low[u] != id[u], it means there was a back-edge to u? 
        // Wait, standard definition: Non-trivial SCCs are cycles. Trivial SCCs (single node) are not cycles unless they point to themselves.
        // Let's assume simple non-recursive formula cells aren't cycles. 
        // But requirement says "Circular references display exactly #CYCLE".
        // So if A depends on B, B depends on A -> Cycle.
        
        // Identify all nodes in Cycles:
        const cycleNodes = new Set();
        sccs.forEach(scc => {
            if (scc.size > 1) {
                scc.forEach(n => cycleNodes.add(n));
            }
        });
        
        // Wait, what about a self-dependency? A -> A. 
        // If I have =A1+A1, that's just math. No reference to another cell in graph?
        // The dependency is A1 (self). In our logic `dependencies.get('A1')` returns `['A1']`.
        // This creates a self-loop. SCC size will be 1, but it has a back-edge.
        
        // Let's just mark nodes that are in any cycle. 
        // Simple check: If scc.size > 1 -> Cycle.
        // What about single node with dependency on itself?
        const selfLoopCheck = new Set();
        nodes.forEach(n => {
            const deps = dependencies.get(n) || [];
            if(deps.includes(n)) {
                selfLoopCheck.add(n);
            }
        });

        cycleNodes.forEach(n => cellState.set(n, { raw: state.raw, display: "#CYCLE" })); // Placeholder, will be fixed by render
        
        // Wait, we need to update the `raw` property in cellState? 
        // Yes. The input might contain raw text that changed user value.
        // Actually, we don't change cellState.raw unless the user types.
        // If it's a cycle, display is #CYCLE.
        
        // Now evaluate non-cycle cells
        for (let node of nodes) {
            if (cycleNodes.has(node)) continue;
            
            let raw = cellState.get(node).raw;
            // Check syntax
            if (!raw || !raw.startsWith('=')) continue; // Plain text or empty
            
            try {
                let val = evaluateExpression(raw, /*context*/); 
                // But `evaluateExpression` above replaced refs with values.
                // We need to check for #CYCLE references again? 
                // If I have A1 (valid), B2 (#CYCLE). Formula in C3: =A1+B2.
                // evaluateExpression will replace B2 with 0 (as per previous logic in function `getValueForFormula`)?
                // Wait, I put return "0" for #CYCLE inside getValueForFormula.
                // Is that correct? 
                // If a cell is circular, it's broken data. Treating as 0 makes others calculable but the cycle remains broken.
                
                cellState.set(node, { 
                    raw: raw, 
                    display: String(val) 
                });
            } catch (e) {
                cellState.set(node, { raw: raw, display: "#ERR" });
            }
        }
        
        // Re-verify cycle nodes. They must be #CYCLE regardless of what their formula says (syntax might be valid but cyclic).
        // Actually, if we are in a cycle, the requirement is to show #CYCLE.
        // So just force them:
        nodes.forEach(node => {
             if (cycleNodes.has(node)) {
                 cellState.set(node, { raw: cellState.get(node).raw, display: "#CYCLE" });
             } else if (cellState.get(node).display === "#CYCLE") {
                 // If we had set it to #CYCLE in a previous run? No.
             }
        });
        
        renderAll();
    }

    function getValueForFormula(id) {
        const cell = cellState.get(id);
        if (!cell) return 0;
        
        let val = parseFloat(cell.display);
        
        // If it's #CYCLE or #ERR, we treat as 0 for calculation purposes of OTHER cells?
        // Actually, dependency chain resolution: 
        // If I want to compute A1=... B2. And B2 is #CYCLE. Then A1 will likely be #CYCLE (or depend on B2).
        // My cycle detection logic handled this by marking ALL nodes in the cycle as #CYCLE immediately.
        // So if a cell references B2 (in cycle), does it become part of a larger cycle?
        // Example: A1=1, B2=A1+1 (valid). C3=B2+A1 (valid). 
        // If D4=C3+B2, and E5=D4+C3. Cycle detected on C,D,E? No.
        // But if F6=E5+B2... wait, let's stick to the Tarjan logic which handles graph cycles strictly.
        // If a cell is not in an SCC cycle, it computes fine even if it references a #CYCLE (it gets 0).
        
        return isNaN(val) ? 0 : val;
    }

    function renderAll() {
        cellState.forEach((state, id) => {
            const el = document.getElementById(`cell-${id}`);
            if (!el) return;
            
            const input = el.querySelector('input');
            
            // Logic: If not focused, show display. If focused, show raw (what user typed).
            // But we need to handle "Commit on Blur". 
            // So we check `isEditing` state.
            
            // Actually, simpler implementation for requirement: 
            // "clicking into it shows the raw text... clicking away commits"
            // So we keep a flag per cell? Or just use CSS :focus?
            // Requirement says `set("B2", "=A1*2")` updates B2.
            
            const inputVal = input.value;
            let displayText = state.display; // Default to computed
            
            // If focused, show raw text stored in input (inputVal)
            // BUT wait, the inputVal is what the user just typed.
            // Does that update the internal state immediately? 
            // If I type "5" then blur -> display "5".
            
            // So:
            // 1. Get raw text from `cellState`.
            // 2. Update `cellState` based on input (if not focused).
            
            const isFocused = el === document.activeElement;
            
            if (!isFocused) {
                // Not editing, show computed value or empty string
                displayText = state.display; 
                // Ensure it's not showing raw text.
                // However, if the user is just starting to type, they might want raw.
                // But "clicking into it shows the raw text". This implies switching from Display Mode to Edit Mode.
                
                input.value = displayText; // Sync input to what we see? 
                // No, `input.value` holds what is typed.
            } else {
                // Editing: Show Raw Text that was there before editing started?
                // Or show current typing? "Clicking into it shows the raw text"
                // This means we restore the raw state from `cellState`.
                input.value = state.raw || ""; 
            }
        });
    }

    // --- Event Handlers ---

    function handleCellInput(e) {
        const cellId = e.target.parentElement.id.replace('cell-', '');
        
        // Update internal RAW state immediately (as user types, or at least onBlur)
        // The requirement: "clicking away commits". 
        // Let's update raw on input/change and blur to trigger recalc.
        // But `set` API might bypass this. So `cellState` is the source of truth.
        
        const input = e.target;
        const id = input.parentElement.id.replace('cell-', '');
        
        if (input.value !== cellState.get(id).raw) {
            cellState.set(id, { 
                raw: input.value,
                display: "" // Will be recalculated
            });
            
            // Trigger re-calculation
            computeAll();
        }
    }

    function handleCellBlur(e) {
        const input = e.target;
        const cellId = input.parentElement.id.replace('cell-', '');
        
        // Update raw state (commit change)
        cellState.set(cellId, { 
            raw: input.value,
            display: "" 
        });

        // Recalculate
        computeAll();
    }

    function handleCellFocus(e) {
        const input = e.target;
        const cellId = input.parentElement.id.replace('cell-', '');
        
        // Show raw text immediately on focus (Edit Mode)
        // But wait, we need to sync input value with state.raw? 
        // If user just blurred, display was computed.
        // We want input.value to be the current 'raw'.
        input.value = cellState.get(cellId).raw;
        
        // Note: This does NOT trigger renderAll() because input.value updates immediately anyway.
    }

    document.getElementById('grid-area').addEventListener('input', handleCellInput);
    document.addEventListener('blur', function(e) {
        if (e.target.tagName === 'INPUT') {
            handleCellBlur(e);
        }
    });
    
    // Fix: Input type text vs number. Text is required for formula "=A1". 
    // The above event delegation works.

    initGrid();
    initState();
    
    // Expose API
    window.sheet = {
        set: (id, val) => {
            const cellId = id.replace('#', ''); // Handle potential CSS selector? No, direct ID usually. 
            // But API calls `set("B2", ...)`
            const domCell = document.getElementById(`cell-${id}`);
            if(domCell) {
                // Update internal state
                cellState.set(id, { raw: val, display: "" });
                
                // Also update DOM immediately to show raw (API usage implies programmatic entry)
                domCell.querySelector('input').value = val;
                
                // Recalculate
                computeAll();
            }
        },
        get: (id) => {
            return cellState.get(id) ? cellState.get(id).display : "";
        },
        raw: (id) => {
            return cellState.get(id) ? cellState.get(id).raw : "";
        }
    };

    exportBtn.addEventListener('click', () => {
        let csvContent = [];
        for(let r=1; r<=ROWS; r++) {
            let rowStr = [];
            for(let c=0; c<COLS; c++) {
                const id = getCellId(c, r);
                // CSV should use computed values. 
                // Computed value is cellState[id].display
                // If empty/undefined, treat as ""? Or 0? Requirement says "empty cells count as 0 inside formulas"
                // But for export, usually display what is seen.
                // Let's export the `get()` result (which returns ""). 
                // However, requirement: "writes the current 10x10 grid of COMPUTED values".
                // If a cell has formula "=5+5", computed is "10". Display is "10".
                // If empty, display is "".
                // What if display is "A" (text)? Display is "A".
                
                rowStr.push(String(cellState.get(getCellId(c,r)).display)); 
            }
            csvContent.push(rowStr.join(','));
        }
        csvTextarea.value = csvContent.join('\n');
    });

    // Initial Calc
    computeAll();

})();
</script>
</body>
</html>
