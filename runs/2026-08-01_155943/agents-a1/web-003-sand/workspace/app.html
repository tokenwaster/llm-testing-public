<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falling Sand Sandbox</title>
    <style>
        body { background: #202025; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        h2 { text-align: center; font-weight: 300; color: #eee; letter-spacing: 1px; margin-bottom: 1rem; }

        .controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 20px; background: #353b49; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-wrap: wrap;}
        
        button { padding: 10px 16px; font-size: 14px; cursor: pointer; background: #353b49; color: white; border: none; border-radius: 4px; transition: all 0.2s; box-shadow: inset 0 -2px rgba(255,255,255,0.1); text-transform: uppercase; font-weight: bold; }
        button:hover { background: #3e4659; transform: translateY(-1px); }
        
        /* Material buttons style */
        .mat-btn.active { box-shadow: inset 0 -2px rgba(255,255,255,0.1), 0 0 0 2px white; border-color: transparent !important; font-weight: bold; background: #4b567a; }
        .mat-btn { margin-right: 2px; margin-bottom: 2px; min-width: 80px;}

        button#clear { margin-left: 10px; padding-top: 10px !important; padding-bottom: 10px !important;}
        
        canvas { display: block; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border-radius: 4px; cursor: crosshair; image-rendering: pixelated; background-color: #1a1c20; }
    </style>
</head>
<body>

<h2>Falling Sand Sandbox</h2>

<div class="controls">
    <button id="mat-sand" class="mat-btn active" data-mat="sand">Sand</button>
    <button id="mat-water" class="mat-btn" data-mat="water">Water</button>
    <button id="mat-wall" class="mat-btn" data-mat="wall">Wall</button>
    <button id="mat-acid" class="mat-btn" data-mat="acid">Acid</button>
    <button id="mat-empty" class="mat-btn" data-mat="empty">Eraser</button>
    <button id="clear" style="margin-left: 10px;">Clear All</button>
</div>

<div id="game-container"></div>

<script>
(function() {
    // CONFIGURATION
    const WIDTH = 80;   // Internal grid width (cells) - minimum requirement met via scale factor.
    const HEIGHT = 80;  // Height in cells (>=400px CSS -> Scale=5).
    const SCALE = 5;

    // DOM Elements
    const canvasContainer = document.getElementById('game-container');
    
    // Canvas Setup: width/height set to match internal grid * scale. 
    // At 80x80 and scale 5, the CSS size is exactly 400px x 400px (matches requirement).
    const canvas = document.createElement('canvas');
    canvas.width = WIDTH * SCALE;
    canvas.height = HEIGHT * SCALE;
    canvas.style.width = (WIDTH * SCALE) + 'px'; // Force display size to be exactly the scaled pixel dimensions for simplicity.
    canvas.style.height = (HEIGHT * SCALE) + 'px';

    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Grid Data: Uint8Array for performance
    let grid = new Uint8Array(WIDTH * HEIGHT).fill(0);
    
    // Index helper
    const idx = (x, y) => x + y * WIDTH;

    // Map string material names to internal codes and colors
    const MATS = { "sand": 1, "water": 2, "wall": 3, "acid": 4 };
    const COLORS = { 
        0: '#202530',   // Empty (Background) - dark theme match
        1: '#DFA15E',   // Sand - warm brownish yellow
        2: '#4B9CD3',   // Water - blueish cyan
        3: '#6C7A85',   // Wall - grey-blue
        4: '#00FF4A'    // Acid - bright green (laser-like)
    };

    function getMatId(name) { return MATS[name] || 0; }

    // API methods exposed on window.sim
    window.sim = {
        w: WIDTH,
        h: HEIGHT,
        
        tick(n) {
            for (let i=0; i<n; i++) {
                simulateStep();
            }
        },
        
        get(x, y) {
            if (!grid[idx(x,y)]) return "empty";
            const v = grid[idx(x,y)];
            // Reverse mapping of internal ID to string name
            for(let k in MATS) if(MATS[k] === v) return k;
            return "wall"; // Fallback shouldn't happen
        },

        set(x, y, matStr) {
            const id = getMatId(matStr);
            grid[idx(x,y)] = id;
        },

        clear() {
            for (let i=0; i<grid.length; i++) grid[i] = 0;
        }
    };

    // Simulation Logic: Single Buffer, Bottom-Up Iteration
    function simulateStep() {
        // Iterate rows from bottom up (excluding the very last row which is solid/boundary)
        for (let y = HEIGHT - 2; y >= 0; y--) {
            // Process columns. Order of x iteration doesn't strictly matter for Bottom-Up correctness but 
            // we can iterate in any order, e.g., Left to Right or Randomized. We use simple L->R loop.
            for (let x = 1; x < WIDTH - 1; x++) { // Skip edges? No, process all cells except bottom row boundaries if needed. Actually processing cols 0..WIDTH-1 is fine but need bounds checks. I'll do full range with boundary logic inside cell check or skip edges entirely as they are solid? "side edges act as solid boundaries" -> meaning particles cannot leave grid at sides. We should process edge cells too (e.g., sand falling to bottom row).
                // Let's iterate all columns for simplicity, but ensure neighbor checks respect bounds 0..WIDTH-1.
            }
        }
    }

    function simulateStep() {
        // Iterate rows from BOTTOM UP: y = h-2 down to 0 (so we can check below at y+1)
        for (let y = HEIGHT - 2; y >= 0; y--) {
            for (let x = WIDTH / 2 | 0; ...) 
                // To avoid bias, maybe iterate columns in varying order? Not necessary. Just use random or standard loop. 
                // However, I'll do a simple left-to-right scan but skipping the edges (x=0 and x=W-1) might be safer since they are boundaries.
            }
        }
    }

    function simulateStep() {
        // Iterate rows from bottom up: starting at second to last row down to top row 0.
        for (let y = HEIGHT - 2; y >= 0; y--) {
            // For each cell in this row, we process movement if it's a movable particle.
            for (let x = 1; x < WIDTH - 1; x++) { 
                let mat = grid[idx(x,y)];

                if (mat === 3) continue; // Wall never moves
                
                // Helper to check neighbor state safely within bounds?
                const getBelowX = () => y + 1;
                
                // If below is out of bounds -> treat as blocked. 
                let hasSpaceDown = false;
                if (y + 1 < HEIGHT) {
                    let belowMat = grid[idx(x, y+1)];
                    if (belowMat === 0 || belowMat === 2 || belowMat === 4) hasSpaceDown = true; // Empty or liquid/acid can be traversed/swapped? 
                        // For Sand: falls into empty OR swaps with water/acid. So condition is not just empty, but moving/falling logic differs for sand vs water.
                }

                switch (mat) {
                    case 1: // SAND
                        let belowIsWaterOrAcid = false;
                        if (y + 1 < HEIGHT) {
                            let bm = grid[idx(x,y+1)];
                            if (bm === 2 || bm === 4) belowIsWaterOrAcid = true;
                            else if (bm === 0) hasSpaceDown = true; // Empty space
                        }

                        if ((y + 1 < HEIGHT && grid[idx(x, y+1)] === 0)) {
                            // Move down to empty
                            let belowIdx = idx(x,y+1);
                            grid[belowIdx] = 1;
                            grid[idx(x,y)] = 0;
                        } else if (belowIsWaterOrAcid) {
                            // Swap with water/acid: sand sinks, liquid rises.
                            // Since we process bottom-up, the cell below has already been processed for movement this tick? 
                            // Actually no, because row y+1 is done before row y starts in loop order (y decreasing). So its state reflects result of previous moves or initial static if blocked.
                            let targetIdx = idx(x,y+1);
                            grid[targetIdx] = 1;
                            grid[idx(x,y)] = grid[targetIdx]; // Put water/acid where sand was? No, we need to know which liquid it was originally, but in this frame the new state is what matters. Wait:
                            // If below cell contained Water (ID=2) at START of tick. Then `grid[targetIdx]` currently holds 2 (unless changed by its own move logic). 
                            // We want Sand to end up there, and Water/Acid to end up here.
                            let liquidType = grid[idx(x,y+1)];
                            if (liquidType === 0) { hasSpaceDown=true; } // Fallback? No.

                            // Actually simpler: Swap contents. But careful with re-ordering writes in single buffer.
                            grid[targetIdx] = 1;
                            grid[idx(x,y)] = liquidType; 
                        } else {
                            // Blocked below (wall, or sand stack). Try sliding diagonally down-left/down-right.
                            let canMoveL = false, canMoveR = false;
                            if (y+1 < HEIGHT && x-1 >= 0) {
                                let bmL = grid[idx(x-1,y+1)];
                                // Allow moving into empty or liquid? "slides diagonally down-left/down-right" implies finding a spot. Usually slides to empty cell below diagonal, not over another particle unless it's same type stacking allowed. Sand usually falls through water but doesn't slide *onto* sand? It rests on top of stack?
                                // Prompt: "If blocked below, it slides diagonally down-left/down-right (randomize the direction checked first). Otherwise it rests."
                                // Usually means moves to empty cell in that diagonal spot. Let's assume same as Sand falling into Empty OR swapping with Water/Acid at diagonal position.
                                if (bmL === 0 || bmL === 2 || bmL === 4) canMoveL = true;
                            }
                            if (y+1 < HEIGHT && x+1 < WIDTH) {
                                let bmR = grid[idx(x+1,y+1)];
                                if (bmR === 0 || bmR === 2 || bmR === 4) canMoveR = true;
                            }

                            // Randomize direction: flip coin.
                            let dir = Math.random() < 0.5 ? 'L' : 'R';
                            if (dir === 'L') {
                                if (canMoveL) {
                                    let targetIdx = idx(x-1,y+1);
                                    grid[targetIdx] = 1;
                                    grid[idx(x,y)] = 0; // Sand moves to diagonal, vacating current.
                                    return; // Exit case after movement? No continue loop for next cell. Wait: If we moved sand here, should this cell (x,y) be considered empty or blocked further down the row? Since we are iterating single buffer bottom-up and processing each cell once per tick, moving a particle from x to x-1 in diagonal means that target (x-1,y+1) is below left. The loop will eventually visit column x-1 of the SAME row y later? No, because we iterate rows bottom-up. Within this row `y`, if order is L->R or R->L...
                                    // If I set grid[idx(x,y)] = 0 (empty), then when subsequent iterations process neighbors to left/right in same row, they see empty space below them at y+1? No, that's diagonal neighbor. The sand moved down-left so it is now at x-1 on lower row y+1. Since we already processed rows > y, this new sand won't be moved again in this tick (Good). But what about the cell `(x,y)` becoming empty? It was just vacated by us; no issue.
                                    // Note: If I iterate L->R and move from x to x-1, that is moving LEFT into a column we might have ALREADY visited in this row loop! That would cause issues because that neighbor's cell `(x-1,y)` or its diagonal check logic was already run? 
                                    // Actually if we moved sand diagonally DOWN-LEFT (to x-1 on y+1), the target is below. The source is at `y`. If order L->R, when processing `x`, column `x-1` in same row has been visited earlier! But that's fine because moving to a lower cell `(x-1,y+1)` doesn't affect state of `(x-1,y)`.
                                    // Wait: Does it? The logic for sand at `(x,y)` looks below-left. If I swap or move into diagonal, the destination is in row `y+1` (already processed). So that's fine.
                                } else if (canMoveR) {
                                    let targetIdx = idx(x+1,y+1);
                                    grid[targetIdx] = 1;
                                    grid[idx(x,y)] = 0;
                                } else { // Blocked both sides -> rests, do nothing.
                                    // If blocked below AND no diagonal empty spot, it stays here. (No movement).
                                }
                            }
                        }

                    case 2: // WATER
                        let canFallWater = false;
                        if (y + 1 < HEIGHT && grid[idx(x,y+1)] === 0) {
                            canFallWater = true;
                        } else if (y + 1 < HEIGHT && (grid[idx(x,y+1)] === 2 || grid[idx(x,y+1)] === 4)) {
                             // Water sinks through water/acid? Usually liquids don't stack like sand. I'll treat them as blocked for falling but maybe they merge? No, distinct particles usually block each other unless different densities or empty space created by swap? 
                             // Prompt says "Water falls straight down one cell per step into `empty`". So only if below is EMPTY does it fall.
                        }

                        if (canFallWater) {
                            let targetIdx = idx(x,y+1);
                            grid[targetIdx] = 2;
                            grid[idx(x,y)] = 0;
                        } else {
                            // Cannot fall: spread horizontally into empty cells (randomize direction).
                            let canSpreadL = false, canSpreadR = false;
                            if (x - 1 >= 0 && y + 1 < HEIGHT) { 
                                // Check same row neighbors? Yes "spreads horizontally". Usually water spreads at the same level.
                                // Does it spread to x-1 on SAME row `y` or below? Prompt says "when it can't fall it spreads horizontally into empty cells". This implies lateral flow along the surface/same plane. So check `(x,y)` neighbors in current row.
                            }
                            
                            if (x - 1 >= 0 && grid[idx(x-1, y)] === 0) canSpreadL = true;
                            if (x + 1 < WIDTH && grid[idx(x+1, y)] === 0) canSpreadR = true;

                            let dir = Math.random() < 0.5 ? 'L' : 'R';
                            if (dir === 'L') {
                                if (canSpreadL) {
                                    let targetIdx = idx(x-1,y);
                                    grid[targetIdx] = 2;
                                    grid[idx(x,y)] = 0; // Move left. Note: This moves into a cell that was visited earlier in L->R iteration? If current row processing is continuing... 
                                        // If we use L->R, then x-1 has been processed for this tick already (because index smaller). So the new water at `x-1` will NOT be moved again this frame. Good.
                                } else if (canSpreadR) {
                                    let targetIdx = idx(x+1,y);
                                    grid[targetIdx] = 2;
                                    grid[idx(x,y)] = 0;
                                }
                            }
                        }

                    case 4: // ACID
                        // Acid moves like water, but also dissolves sand/wall neighbors.
                        let canFallAcid = false;
                        if (y + 1 < HEIGHT && grid[idx(x,y+1)] === 0) {
                            canFallAcid = true;
                        }

                        if (canFallAcid) {
                            let targetIdx = idx(x,y+1);
                            // Check for reaction before moving? Or just move and then maybe react later. 
                            grid[targetIdx] = 4;
                            grid[idx(x,y)] = 0;
                        } else {
                            // Spread horizontally like water (if blocked below) AND dissolve neighbors.
                            let canSpreadL = false, canSpreadR = false;
                            if (x - 1 >= 0 && grid[idx(x-1, y)] === 0) canSpreadL = true;
                            if (x + 1 < WIDTH && grid[idx(x+1, y)] === 0) canSpreadR = true;

                            // Reaction Logic: Acid dissolves sand or wall cells it touches below or beside.
                            // "below" -> `(y+1)` neighbor? Or current row neighbors? Prompt says "touches below or beside". 
                            // Below means `grid[idx(x,y+1)]` (in case acid stays put). Beside means side neighbors.
                            
                            let dissolved = false;

                            if (!dissolved) {
                                // Check sides in same row: x-1, x+1 for Sand/Wall
                                if (x - 1 >= 0 && grid[idx(x-1,y)] === 3 || grid[idx(x-1,y)] === 1) {
                                    // Dissolve neighbor sand/wall. Prompt says both may disappear or just target. I choose: acid stays, wall disappears -> "walls must erode". Wait prompt allows choice. To ensure erosion and avoid infinite loops of solid blocks staying while acids burn out, let's dissolve the adjacent block into empty (and maybe consume this acid? Let's keep it simple: Acid moves if blocked; also eats neighbors). 
                                    // I'll make neighbor become Empty immediately regardless of movement outcome.
                                    grid[idx(x-1,y)] = 0;
                                }
                            }
                            if (!dissolved) {
                                if (x + 1 < WIDTH && grid[idx(x+1,y)] === 3 || grid[idx(x+1,y)] === 1) {
                                    grid[idx(x+1,y)] = 0;
                                }
                            }
                             // Check below neighbor `(y+1)` for dissolution? Acid may be sitting on a block. If `grid[y+1][x]` is Sand/Wall -> dissolve it? 
                             if (!dissolved && y + 1 < HEIGHT) {
                                 let bm = grid[idx(x,y+1)];
                                 if (bm === 3 || bm === 1) {
                                     // Acid sits on top of Wall/Sand, dissolves it. But acid stays above? Or falls through? 
                                     // Usually acid eats what is below or beside. Let's dissolve the block below too.
                                     grid[idx(x,y+1)] = 0;
                                 }
                             }

                            if (canSpreadL || canSpreadR) {
                                let dir = Math.random() < 0.5 ? 'L' : 'R';
                                // Note: The spreading logic might be blocked now because we just dissolved a neighbor, but that cell is likely still occupied by the acid's new state? No, if acid moves into empty spot `x-1`, it sets there to Acid and clears current. That works fine.
                                if (dir === 'L' && canSpreadL) {
                                    let targetIdx = idx(x-1,y);
                                    grid[targetIdx] = 4;
                                    grid[idx(x,y)] = 0;
                                } else if (canSpreadR) {
                                    let targetIdx = idx(x+1,y);
                                    grid[targetIdx] = 4;
                                    grid[idx(x,y)] = 0;
                                }
                            }
                        }

                    default: // Empty or Wall -> do nothing
                }
            }
        }
    }

    // Render Loop (requestAnimationFrame)
    function render() {
        ctx.fillStyle = COLORS[0];
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y=0; y<HEIGHT; y++) {
            for (let x=0; x<WIDTH; x++) {
                const m = grid[idx(x,y)];
                if (m !== 0) {
                    ctx.fillStyle = COLORS[m] || '#fff'; // Fallback white
                    ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
                }
            }
        }

        requestAnimationFrame(render);
    }

    render();

    // INPUT HANDLING: Mouse painting on canvas
    let isMouseDown = false;
    let currentMat = 'sand'; // default from UI button

    function paint(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / SCALE);
        const y = Math.floor((e.clientY - rect.top) / SCALE);
        
        if (x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT) {
            window.sim.set(x, y, currentMat);
        }
    }

    canvas.addEventListener('mousedown', () => isMouseDown = true; paint(event));
    canvas.addEventListener('mouseup', () => isMouseDown = false);
    canvas.addEventListener('mousemove', (e) => { if(isMouseDown) paint(e); });

    // UI: Material Buttons Selection
    const matBtns = document.querySelectorAll('.mat-btn');
    
    function updateActiveButton(matStr, btnElement) {
        for(let b of matBtns) b.classList.remove('active');
        if(btnElement) btnElement.classList.add('active');
    }

    // Set initial active button to sand.
    const initBtn = document.querySelector('#mat-sand');
    
    matBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            currentMat = btn.getAttribute('data-mat');
            updateActiveButton(currentMat, btn);
        });
    });

    // Clear button logic
    const clearBtn = document.getElementById('clear');
    clearBtn.addEventListener('click', () => window.sim.clear());

})();
</script>
</body>
</html>
