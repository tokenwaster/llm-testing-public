<!DOCTYPE html>
<html>
<head>
  <title>2048</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #eee;
      font-family: monospace;
      text-align: center;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 5px;
      margin: 20px auto;
      width: 320px;
      border: 2px solid #666;
    }

    .tile {
      background-color: #444;
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3em;
      color: #fff;
      border: 1px solid #555;
    }

    #score {
      font-size: 2em;
      margin-bottom: 20px;
    }

    #reset {
      background-color: #333;
      color: #eee;
      border: none;
      padding: 10px 20px;
      font-size: 1.2em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #reset:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div id="score">Score: 0</div>
  <table id="board"></table>
  <button id="reset">New Game</button>

  <script>
    const size = 4;
    let board = Array(size).fill(null).map(() => Array(size).fill(0));
    let score = 0;
    let newTileCount = 2;


    function initBoard() {
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          if (Math.random() < 0.9) {
            board[i][j] = 2;
          } else {
            board[i][j] = 0;
          }
        }
      }

      spawnNewTile();
    }


    function spawnNewTile() {
      let emptyCells = [];
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          if (board[i][j] === 0) {
            emptyCells.push([i, j]);
          }
        }
      }

      if (emptyCells.length > 0) {
        const randomIndex = Math.floor(Math.random() * emptyCells.length);
        const [row, col] = emptyCells[randomIndex];
        board[row][col] = newTileCount % 2 === 0 ? 2 : 4;
        newTileCount++;
      }
    }

    function move(direction) {
      let moved = false;
      const originalBoard = board.map(row => [...row]); // Deep copy

      switch (direction) {
        case 'left':
          for (let i = 0; i < size; i++) {
            let currentColumn = [];
            for (let j = 0; j < size; j++) {
              if (board[i][j] !== 0) {
                currentColumn.push(board[i][j]);
              }
            }

            currentColumn.sort((a, b) => a - b);
            let mergedColumn = [];
            for (let j = 0; j < size; j++) {
              if (j > 0 && currentColumn[j] === currentColumn[j - 1]) {
                mergedColumn.push(currentColumn[j] * 2);
                score += currentColumn[j];
                currentColumn.splice(j, 1);
                moved = true;
              } else {
                mergedColumn.push(currentColumn[j]);
              }
            }

            board[i] = mergedColumn;
          }
          break;
        case 'right':
          for (let i = 0; i < size; i++) {
            let currentColumn = [];
            for (let j = size - 1; j >= 0; j--) {
              if (board[i][j] !== 0) {
                currentColumn.push(board[i][j]);
              }
            }

            currentColumn.reverse();
            currentColumn.sort((a, b) => a - b);

            let mergedColumn = [];
            for (let j = size - 1; j >= 0; j--) {
                if (j < size - 1 && currentColumn[j] === currentColumn[j + 1]) {
                    mergedColumn.push(currentColumn[j] * 2);
                    score += currentColumn[j];
                    currentColumn.splice(j, 1);
                    moved = true;
                } else {
                    mergedColumn.push(currentColumn[j]);
                }
            }

            board[i] = mergedColumn.reverse();
          }
          break;
        case 'up':
          for (let j = 0; j < size; j++) {
            let currentRow = [];
            for (let i = 0; i < size; i++) {
              if (board[i][j] !== 0) {
                currentRow.push(board[i][j]);
              }
            }

            currentRow.sort((a, b) => a - b);
            let mergedRow = [];
            for (let i = 0; i < size; i++) {
              if (i > 0 && currentRow[i] === currentRow[i - 1]) {
                mergedRow.push(currentRow[i] * 2);
                score += currentRow[i];
                currentRow.splice(i, 1);
                moved = true;
              } else {
                mergedRow.push(currentRow[i]);
              }
            }

            for (let i = 0; i < size; i++) {
              board[i][j] = mergedRow[i];
            }
          }
          break;
        case 'down':
          for (let j = 0; j < size; j++) {
            let currentRow = [];
            for (let i = size - 1; i >= 0; i--) {
              if (board[i][j] !== 0) {
                currentRow.push(board[i][j]);
              }
            }

            currentRow.reverse();
            currentRow.sort((a, b) => a - b);

            let mergedRow = [];
            for (let i = size - 1; i >= 0; i--) {
                if (i < size - 1 && currentRow[i] === currentRow[i + 1]) {
                    mergedRow.push(currentRow[i] * 2);
                    score += currentRow[i];
                    currentRow.splice(i, 1);
                    moved = true;
                } else {
                    mergedRow.push(currentRow[i]);
                }
            }

            for (let i = size - 1; i >= 0; i--) {
              board[i][j] = mergedRow[i];
            }
          }
          break;
      }


      if (moved) {
        spawnNewTile();
      }
       return moved;
    }

    function boardToString() {
      let str = '';
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          str += board[i][j] === 0 ? '' : board[i][j];
        }
      }
      return str;
    }


    function render() {
      const table = document.getElementById('board');
      table.innerHTML = '';

      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size; j++) {
          const tile = document.createElement('div');
          tile.classList.add('tile');
          tile.textContent = board[i][j] === 0 ? '' : board[i][j];
          tile.style.backgroundColor = (board[i][j] === 0) ? '#777' : (board[i][j] % 2 === 0 ? '#ddd' : '#333');

          table.appendChild(tile);
        }
      }
    }


    function resetGame() {
      board = Array(size).fill(null).map(() => Array(size).fill(0));
      score = 0;
      initBoard();
      render();
    }

    window.game = {
      size: size,
      reset: resetGame,
      move: move,
      board: () => board,
      setBoard: (arr) => {
        board = arr;
        render();
      },
      score: () => score,
    };

    initBoard();
    render();

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        game.move('left');
        render();
      } else if (event.key === 'ArrowRight') {
        game.move('right');
        render();
      } else if (event.key === 'ArrowUp') {
        game.move('up');
        render();
      } else if (event.key === 'ArrowDown') {
        game.move('down');
        render();
      }
    });
  </script>
</body>
</html>
