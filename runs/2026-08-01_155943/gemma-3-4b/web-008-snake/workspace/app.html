<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        #snake-game {
            width: 400px;
            height: 400px;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cell {
            width: 15px;
            height: 15px;
            background-color: #333;
            border: 1px solid #555;
            box-sizing: border-box;
        }

        #score {
            color: #fff;
            font-size: 20px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <div id="snake-game"></div>
    <div id="score">Score: 0</div>
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>

    <script>
        const w = 10;
        const h = 10;
        let snake = [[3, 5], [4, 5], [5, 5]];
        let food = [7, 7];
        let score = 0;
        let direction = 'right';
        let gameInterval;

        const snakeGameContainer = document.getElementById('snake-game');
        const scoreElement = document.getElementById('score');
        const startButton = document.getElementById('start');
        const pauseButton = document.getElementById('pause');
        const resetButton = document.getElementById('reset');

        function createCell(x, y) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.style.left = (x * 15) + 'px';
            cell.style.top = (y * 15) + 'px';
            snakeGameContainer.appendChild(cell);
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                const [x, y] = snake[i];
                createCell(x, y);
            }
        }

        function drawFood() {
            const [x, y] = food;
            createCell(x, y);
        }


        function updateScore() {
            score += 1;
            scoreElement.textContent = `Score: ${score}`;
        }

        function checkCollision() {
            if (snake.some(([x, y]) => x < 0 || x >= w || y < 0 || y >= h)) {
                return true;
            }
            if (snake.some((cell) => {
                const [x, y] = cell;
                return snake.findIndex(c => c === cell) !== -1 && x === food[0] && y === food[1];
            })) {
                return true;
            }
            return false;
        }

        function moveSnake() {
            const [headX, headY] = snake[0];
            let newHead = [];

            switch (direction) {
                case 'up':
                    newHead = [headX - 1, headY];
                    break;
                case 'down':
                    newHead = [headX + 1, headY];
                    break;
                case 'left':
                    newHead = [headX, headY - 1];
                    break;
                case 'right':
                    newHead = [headX, headY + 1];
                    break;
            }

            if (checkCollision()) {
                clearInterval(gameInterval);
                return;
            }

            snake.unshift(newHead);

            if (newHead[0] === food[0] && newHead[1] === food[1]) {
                updateScore();
                food = [Math.floor(Math.random() * w), Math.floor(Math.random() * h)];
            } else {
                snake.pop();
            }

            drawSnake();
            drawFood();
        }


        window.game = {
            w,
            h,
            reset: function () {
                score = 0;
                snake = [[3, 5], [4, 5], [5, 5]];
                food = [7, 7];
                direction = 'right';
                clearInterval(gameInterval);

                snakeGameContainer.innerHTML = '';
                drawSnake();
                drawFood();
            },
            tick: function () {
                moveSnake();
            },
            setDir: function (dir) {
                if (dir !== direction) {
                    direction = dir;
                }
            },
            setFood: function (x, y) {
                food = [x, y];
                drawFood();
            },
            snake: function () {
                return snake;
            },
            food: function () {
                return food;
            },
            alive: function() {
               return !checkCollision();
            },
            score: function() {
                return score;
            }

        };


        startButton.addEventListener('click', () => {
            gameInterval = setInterval(window.game.tick, 100);
        });

        pauseButton.addEventListener('click', () => {
            clearInterval(gameInterval);
        });

        resetButton.addEventListener('click', () => {
            window.game.reset();
        });


        //Initial draw
        drawSnake();
        drawFood();
    </script>
</body>
</html>
