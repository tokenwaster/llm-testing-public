<!DOCTYPE html>
<html>
<head>
<title>WastedToken Mint</title>
<style>
body { margin: 0; overflow: hidden; }
#coin-hero { width: 100vw; height: 100vh; background-color: #222; cursor: pointer;}
.edition { display: inline-block; width: calc(25% - 20px); margin: 10px; }
.buy { padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer;}
</style>
</head>
<body>

<canvas id="coin-hero"></canvas>

<script>
window.demo = {
  canvas: document.getElementById("coin-hero"),
  setTime: function(t) {
    let angle = t * 2 * Math.PI;
    const coinRadius = 50;
    const coinColor = '#ddd';
    const highlightColor = '#ccc';

    // Coin Shading (Simple, but functional)
    const ctx = this.canvas.getContext("2d");
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.save();
    ctx.translate(this.canvas.width / 2, this.canvas.height / 2);
    ctx.rotate(angle);

    // Front Face (WastedToken Mint Emblem) - Simplified for demonstration
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(0, 0, coinRadius, 0, Math.PI * 2);
    ctx.fill();


    // Back Face (Token Count)
    ctx.rotate(Math.PI);
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(0, 0, coinRadius, 0, Math.PI * 2);
    ctx.fill();

    // Reeded Edge - Simple ridge effect
     ctx.fillStyle = '#888';
     ctx.beginPath();
     ctx.moveTo(-coinRadius, 0);
     ctx.lineTo(coinRadius, 0);
     ctx.stroke();



    // Metallic Highlight (Specular Reflection)
    ctx.fillStyle = highlightColor;
    ctx.beginPath();
    ctx.arc(0, 0, coinRadius * 0.8, angle, angle + Math.PI/6); // Adjusted for smoother rotation
    ctx.fill();


    ctx.restore();
  },
  pause: function() {
    this.canvas.style.cursor = 'default';
    document.getElementById("coin-hero").removeEventListener('click', null, true)
  }
};

let animationId;

function startAnimation() {
  animationId = requestAnimationFrame(function() {
    demo.setTime(0);
    startAnimation();
  });
}

demo.canvas.addEventListener('click', function() {
   demo.pause();
});


startAnimation();


</script>

<div class="edition" data-edition="bronze" data-state="available">
  <canvas class="edition-canvas"></canvas>
  <button class="buy">Add to cart</button>
</div>
<div class="edition" data-edition="silver" data-state="available">
  <canvas class="edition-canvas"></canvas>
  <button class="buy">Add to cart</button>
</div>
<div class="edition" data-edition="gold" data-state="sold-out">
  <canvas class="edition-canvas"></canvas>
  <button class="buy">SOLD OUT</button>
</div>
<div class="edition" data-edition="black" data-state="coming-soon">
  <canvas class="edition-canvas"></canvas>
  <button class="buy">Minting Autumn</button>
</div>

</body>
</html>
