<!DOCTYPE html>
<html>
<head>
  <title>Falling Sand Simulation</title>
  <style>
    body {
      background-color: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    #container {
      position: relative;
    }

    canvas {
      border: 1px solid #555;
      background-color: #282828;
      display: block;
      margin: 0 auto;
    }

    button {
      background-color: #3e3e3e;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #444;
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="sand"></canvas>
    <div id="controls">
      <button id="mat-sand">Sand</button>
      <button id="mat-water">Water</button>
      <button id="mat-wall">Wall</button>
      <button id="mat-acid">Acid</button>
      <button id="mat-empty">Empty (Eraser)</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('sand');
    const ctx = canvas.getContext('2d');
    const w = 80;
    const h = 60;
    let grid = [];
    let mouseX = 0;
    let mouseY = 0;

    function init() {
      grid = Array(h).fill(null).map(() => Array(w).fill('empty'));
      canvas.width = w * 20;
      canvas.height = h * 20;

      document.addEventListener('mousemove', (e) => {
        mouseX = Math.round((e.clientX - canvas.offsetLeft) / 20);
        mouseY = Math.round((e.clientY - canvas.offsetTop) / 20);
      });

      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // Left mouse button
          const mat = document.getElementById('mat-sand').textContent;
          grid[mouseY][mouseX] = mat;
        }
      });

      document.addEventListener('mouseup', () => {
        // Clear on mouseup if no longer dragging
        if (mouseX === 0 && mouseY === 0) {
          clear();
        }
      });


      animate();
    }

    function clear() {
      grid = Array(h).fill(null).map(() => Array(w).fill('empty'));
      draw();
    }

    function get(x, y) {
      if (y < 0 || y >= h || x < 0 || x >= w) return 'wall'; // Boundary check
      return grid[y][x];
    }

    function set(x, y, material) {
      grid[y][x] = material;
      draw();
    }


    function tick(n) {
      for (let y = h - 1; y >= 0; y--) { // Process bottom-up
        for (let x = 0; x < w; x++) {
          const currentMaterial = grid[y][x];

          if (currentMaterial === 'sand') {
            // Try to move down
            if (y + 1 < h && get(x, y + 1) === 'empty') {
              set(x, y + 1, 'sand');
              set(x, y, 'empty');
            } else {
                // Try to slide diagonally down-left
                if (x - 1 >= 0 && get(x - 1, y + 1) === 'empty') {
                    set(x - 1, y + 1, 'sand');
                    set(x, y, 'empty');
                } else if (x + 1 < w && get(x + 1, y + 1) === 'empty'){
                     set(x+1,y+1,'sand')
                     set(x,y,'empty');

                }
            }
          } else if (currentMaterial === 'water') {
            // Spread horizontally
            const directions = ['right', 'left'];
            directions.sort(() => Math.random() - 0.5); // Randomize direction

            for (const dir of directions) {
              let nextX = x;
              if (dir === 'right') {
                nextX++;
              } else {
                nextX--;
              }

              if (nextX >= 0 && nextX < w && get(nextX, y) === 'empty') {
                set(nextX, y, 'water');
                set(x, y, 'empty');
                break; // Only spread in one direction per step
              }
            }
          } else if (currentMaterial === 'acid') {
            // Dissolve sand or walls
            const directions = ['down', 'right'];
            directions.sort(() => Math.random() - 0.5);

            for (const dir of directions) {
              let nextX = x;
              let nextY = y;

              if (dir === 'down') {
                nextY++;
              } else {
                nextX++;
              }

              if (nextY < h && get(x, nextY) !== 'wall' && get(x, nextY) !== 'empty') { //Check not wall and not empty for acid dissolve
                  const targetMaterial = get(x, nextY);
                  set(x, nextY, 'empty');

                  if (targetMaterial === 'sand' || targetMaterial === 'wall') {
                    set(x, nextY, 'empty'); // Dissolve sand or wall.  Could be other materials too
                  }

              }
            }
          }
        }
      }
    }


    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const material = get(x, y);
          const colorMap = {
            'empty': '#f0f0f0',
            'sand': '#8b4513',
            'water': '#4682b4',
            'wall': '#a9a9a9',
            'acid': '#ff69b4'
          };

          ctx.fillStyle = colorMap[material];
          ctx.fillRect(x * 20, y * 20, 20, 20);
        }
      }
    }


    function animate() {
      tick(1); // Advance by one step
      requestAnimationFrame(animate);
    }

    init();
  </script>
</body>
</html>
