<script>
(() => {
 const version=__VERSION__,asof=__ASOF__,field=document.getElementById('result-citation'),status=document.getElementById('citation-status');
 function text(){const a=document.getElementById('selA'),b=document.getElementById('selB');const pair=a&&b?` ${a.value} versus ${b.value}.`:'';const commit=document.querySelector('meta[name="evidence-commit"]');return `Token Waster. ${document.title}.${pair} Suite ${version}; data as of ${asof}.${commit?' Evidence snapshot '+commit.content+'.':''} ${location.href}`;}
 function update(){field.value=text();}update();document.addEventListener('change',update);window.addEventListener('popstate',update);
 document.getElementById('copy-citation').onclick=async()=>{update();try{await navigator.clipboard.writeText(field.value);status.textContent='Citation copied.';}catch{field.focus();field.select();status.textContent='Select and copy the citation above.';}};
 document.getElementById('save-card').onclick=()=>{
   const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=630;const ctx=canvas.getContext('2d');
   ctx.fillStyle='#0b0e12';ctx.fillRect(0,0,1200,630);ctx.fillStyle='#4c8dff';ctx.fillRect(0,0,1200,8);ctx.font='bold 28px sans-serif';ctx.fillText('Token Waster',64,70);
   ctx.fillStyle='#f2f0e8';ctx.font='bold 48px sans-serif';
   const a=document.getElementById('selA'),b=document.getElementById('selB');const title=a&&b?a.selectedOptions[0].text+' vs '+b.selectedOptions[0].text:document.title.replace(/ · Token Waster$/, '');
   let line='',y=155;for(const word of title.split(/\s+/)){if(ctx.measureText(line+word).width>1040){ctx.fillText(line,64,y);y+=58;line='';}line+=word+' ';}ctx.fillText(line,64,y);
   ctx.font='26px sans-serif';ctx.fillStyle='#cbd0d7';const verdict=document.getElementById('cmp-verdict');let summary=verdict?verdict.textContent:'Measured results with the evidence attached.';line='';y=Math.max(y+75,340);
   for(const word of summary.split(/\s+/)){if(ctx.measureText(line+word).width>1040){if(y>490)break;ctx.fillText(line,64,y);y+=35;line='';}line+=word+' ';}if(y<=490)ctx.fillText(line,64,y);
   ctx.font='24px sans-serif';ctx.fillText(`Suite ${version} · data as of ${asof}`,64,555);ctx.fillStyle='#4c8dff';ctx.fillText('tokenwaster.ai',64,595);
   canvas.toBlob(blob=>{if(!blob){status.textContent='Image unavailable. The citation can still be copied.';return;}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='token-waster-result.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='Share image downloaded. Include the citation link with it.';});
 };
})();
</script>
