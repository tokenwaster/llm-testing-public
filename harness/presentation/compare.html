<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · LLM Testing</title><style>{{ css }}</style></head><body>
<div class="topbar">{{ brand }}<div class="ttl"><h1>Head to head</h1></div>
<div class="nav">{{ nav }}</div></div>
<div class="pagebar"><div class="sub">two models, every task, side by side · {{ dataset_label or "live dataset" }}</div></div>

<div class="cmp-pick">
  <span class="cmp-lead"></span>
  <select id="selA" class="cmp-sel" aria-label="Model A"></select>
  <button id="swap" class="cmp-swap" title="swap sides">&#8646;</button>
  <select id="selB" class="cmp-sel" aria-label="Model B"></select>
</div>

<div id="cmp-verdict" class="cmp-verdict"></div>
<p id="scope-note"></p>
<p id="pair-uncertainty" class="pair-note" aria-live="polite"></p>
<div class="seg cmp-filter" id="cmp-filter">
  <button type="button" data-view="all" class="on">All tasks</button>
  <button type="button" data-view="disagree">Disagreements</button>
  <button type="button" data-view="frontier">Frontier</button>
  <button type="button" data-view="hard">Hard</button>
  <button type="button" data-view="fail">Failures</button>
  <button type="button" id="copycmp">Copy comparison link</button>
  <button type="button" id="compare-csv">Download visible CSV</button>
  <button type="button" id="compare-json">Download visible JSON</button>
</div>
<p id="compare-status" role="status"></p>
<div id="cmp-head" class="cmp-head"></div>
<h2>Per-task <span class="small muted" style="text-transform:none;letter-spacing:0;font-weight:400">· swatch ink ramps with the score · Δ colors the winner · grouped by category</span></h2>
<div id="cmp-grid"></div>
<div class="foot" style="margin-top:14px">{{ cost_note|safe }}</div>

<script>{{ shared_js }}</script><script>const D = {{ data_json|safe }};</script>
<script>
const $ = s => document.querySelector(s);
const scope=new URLSearchParams(location.search).get('scope');
const profiles={coding:['coding-python','agentic'],documents:['long-context','extraction','hallucination'],apps:['one-shot-apps']};
if(profiles[scope]){
  D.cats=D.cats.filter(c=>profiles[scope].includes(c.key));const tids=D.cats.flatMap(c=>c.tids);const measured={};
  for(const [m,entry] of Object.entries(D.evidence.models)){
    const cells=tids.map(t=>entry.cells[t]);if(!cells.length||cells.some(c=>!c||c.score===null))continue;
    const avg=cells.reduce((sum,c)=>sum+c.score,0)/cells.length;
    const cost=entry.kind==='api'&&cells.every(c=>c.cost!==null)?cells.reduce((sum,c)=>sum+c.cost,0):null;
    const wall=cells.every(c=>c.wall!==null)?cells.reduce((sum,c)=>sum+c.wall,0):null;
    measured[m]={slug:entry.slug,where:entry.kind,score:avg,ci:null,pass:cells.filter(c=>c.score>=0.8).length,graded:cells.length,costVal:cost,costStr:cost===null?'—':'$'+cost.toFixed(4),tps:null,wall,timeStr:wall===null?'—':(wall/1000).toFixed(1)+'s',ft:null,t:Object.fromEntries(tids.map(t=>[t,entry.cells[t].score]))};
  }
  D.data=measured;D.names=Object.keys(measured).sort();D.models=[...D.names].sort((a,b)=>measured[b].score-measured[a].score||a.localeCompare(b));
  $('#scope-note').textContent=`Comparing ${tids.length} tasks for ${scope==='coding'?'writing and fixing code':scope==='documents'?'understanding documents':'building interactive apps'}. Each model covers this complete subset; these are not whole-suite rankings.`;
}
function q(v){
  return (0.10 + 0.90*Math.max(0,Math.min(1,v))).toFixed(3);
}
function sc(v){
  if (v === null || v === undefined)
    return {cls:'muted', txt:'\u2014', sw:'<span class="hsw pend"></span>'};
  const st = v >= 0.8 ? 'good' : (v >= 0.4 ? 'warn' : 'crit');
  return {cls:st, txt:v.toFixed(3),
          sw:'<span class="hsw" style="--a:'+q(v)+'"></span>'};
}
function num(x){ return (x === null || x === undefined) ? null : x; }
function fmtPct(v){ return v === null ? '\u2014' : Math.round(v*100)+'%'; }
let view = 'all';

const METRICS = [
  ['Raw score', 'score', true, m => m.score===null?'\u2014':m.score.toFixed(3)+(m.ci!==null?' \u00b1'+m.ci.toFixed(3).replace(/^0/,''):'')],
  ['Tasks \u2265 0.80', 'passrate', true, m => m.graded?((m.pass/m.graded))?(m.pass+'/'+m.graded):'\u2014':'\u2014'],
  ['Cost across selected tasks', 'cost', false, m => m.costStr],
  ['Gen tok/s', 'tps', true, m => m.tps===null?'\u2014':m.tps.toFixed(1)],
  ['Total time', 'wall', false, m => m.timeStr],
  ['First-try clean', 'ft', true, m => fmtPct(m.ft)],
];
function metricVal(m, key){
  if (key==='passrate') return m.graded ? m.pass/m.graded : null;
  if (key==='cost') return num(m.costVal);
  if (key==='wall') return num(m.wall);
  if (key==='tps') return num(m.tps);
  if (key==='ft') return num(m.ft);
  return num(m.score);
}
function renderHead(a, b){
  const A = D.data[a], B = D.data[b];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let h = '<div class="cmp-row cmp-hrow">'
        + '<span class="cmp-k"></span>'
        + '<span class="cmp-hc"><a href="models/'+A.slug+'.html">'+esc(D.evidence.models[a].name)+'</a>'
        + '<div class="small muted">'+(A.rank?'#'+A.rank+' · ':'Selected work · ')+A.where+'</div></span>'
        + '<span class="cmp-dc"></span>'
        + '<span class="cmp-hc"><a href="models/'+B.slug+'.html">'+esc(D.evidence.models[b].name)+'</a>'
        + '<div class="small muted">'+(B.rank?'#'+B.rank+' · ':'Selected work · ')+B.where+'</div></span></div>';
  for (const [label, key, hi, fmt] of METRICS){
    const va = metricVal(A, key), vb = metricVal(B, key);
    let wa='', wb='', delta='';
    if (va!==null && vb!==null && va!==vb){
      const aWins = hi ? va>vb : va<vb;
      wa = aWins ? 'win' : ''; wb = aWins ? '' : 'win';
    }
    if (va!==null && vb!==null){
      const d = va - vb;
      if (Math.abs(d) > 1e-9){
        const sign = d>0?'+':'';
        let dv = (key==='cost') ? sign+d.toFixed(4)
               : (key==='wall') ? '' : sign+(Math.abs(d)<1?d.toFixed(3):d.toFixed(1));
        delta = dv;
      }
    }
    h += '<div class="cmp-row">'
       + '<span class="cmp-k">'+label+'</span>'
       + '<span class="cmp-v '+wa+'">'+fmt(A)+'</span>'
       + '<span class="cmp-dc">'+(delta?'<span class="cmp-td">'+delta+'</span>':'')+'</span>'
       + '<span class="cmp-v '+wb+'">'+fmt(B)+'</span></div>';
  }
  $('#cmp-head').innerHTML = h;
}
function verdict(a,b){
  const A=D.data[a],B=D.data[b],parts=[];
  if(A.score!==null&&B.score!==null){const d=A.score-B.score;
    parts.push(Math.abs(d)<0.001?'The displayed means are equal to three decimals':
      D.evidence.models[d>0?a:b].name+' leads the measured mean by '+Math.abs(d).toFixed(3));}
  if(A.tps!==null&&B.tps!==null&&A.tps!==B.tps){const fast=A.tps>B.tps?a:b;
    parts.push(D.evidence.models[fast].name+' generates '+Math.abs(A.tps-B.tps).toFixed(1)+' tok/s faster');}
  if(A.wall!==null&&B.wall!==null&&A.wall!==B.wall){const quick=A.wall<B.wall?a:b;
    const diff=Math.abs(A.wall-B.wall),duration=diff<60000?(diff/1000).toFixed(1)+' seconds':(diff/60000).toFixed(1)+' minutes';
    parts.push(D.evidence.models[quick].name+' finishes '+duration+' sooner across this task set');}
  parts.push(D.evidence.models[a].name+' reaches 0.80 on '+A.pass+'/'+A.graded+' tasks; '+D.evidence.models[b].name+' on '+B.pass+'/'+B.graded);
  $('#cmp-verdict').textContent=parts.join('. ')+'.';
}
function includeTask(tid,va,vb){
  if(view==='disagree') return va!==null&&vb!==null&&Math.abs(va-vb)>0.001;
  if(view==='frontier'||view==='hard') return D.tiers[tid]===view;
  if(view==='fail') return (va!==null&&va<0.8)||(vb!==null&&vb<0.8);
  return true;
}
function renderGrid(a, b){
  const A = D.data[a], B = D.data[b];
  let h = '';
  for (const cat of D.cats){
    let rows='';
    for (const tid of cat.tids){
      const va = A.t[tid] ?? null, vb = B.t[tid] ?? null;
      if(!includeTask(tid,va,vb)) continue;
      const A1 = sc(va), B1 = sc(vb);
      let d = '';
      if (va!==null && vb!==null && Math.abs(va-vb) > 1e-9){
        const diff = va - vb;
        d = '<span class="cmp-td '+(diff>0?'ga':'gb')+'">'
          + (diff>0?'\u25c0 ':'') + (diff>0?'+':'') + diff.toFixed(3)
          + (diff<0?' \u25b6':'') + '</span>';
      } else if (va!==null && vb!==null){ d = '<span class="cmp-td tie">=</span>'; }
      rows += '<div class="cmp-row">'
         + '<a class="cmp-t" href="tasks/'+tid+'.html">'+tid+'</a>'
         + '<span class="scv '+A1.cls+' ra">'+A1.txt+A1.sw+'</span>'
         + '<span class="cmp-dc">'+d+'</span>'
         + '<span class="scv '+B1.cls+'">'+B1.sw+'<b>'+B1.txt+'</b></span>'
         + '</div>';
    }
    if(rows) h += '<div class="cmp-cat"><div class="cmp-cath">'+cat.key+'</div>'+rows+'</div>';
  }
  $('#cmp-grid').innerHTML = h || '<p class="muted">No tasks match this view.</p>';
}
function render(){
  const a = $('#selA').value, b = $('#selB').value;
  if(!a||!b){$('#cmp-verdict').textContent='No fully measured models are available in this dataset.';return;}
  verdict(a,b); renderHead(a, b); renderGrid(a, b);
  const tids=D.cats.flatMap(c=>c.tids).filter(t=>includeTask(t,D.data[a].t[t]??null,D.data[b].t[t]??null));
  $('#pair-uncertainty').textContent=a===b?'Choose two different models to compare uncertainty.':Experience.paired(D.evidence.models[a],D.evidence.models[b],tids);
  const u = new URL(location); u.searchParams.set('a',a); u.searchParams.set('b',b);
  u.searchParams.set('view',view);
  history.replaceState(null,'',u);
}
(function init(){
  for(const id of ['selA','selB'])for(const m of D.names){const option=document.createElement('option');option.value=m;option.textContent=D.evidence.models[m].name;document.getElementById(id).append(option);}
  const p = new URLSearchParams(location.search);
  const defaultA=document.querySelector('meta[name="comparison-a"]')?.content,defaultB=document.querySelector('meta[name="comparison-b"]')?.content;
  $('#selA').value = p.get('a') && D.data[p.get('a')] ? p.get('a') : defaultA||D.models[0];
  $('#selB').value = p.get('b') && D.data[p.get('b')] ? p.get('b')
                   : (defaultB||D.models[1] || D.models[0]);
  $('#selA').onchange = render; $('#selB').onchange = render;
  view = ['all','disagree','frontier','hard','fail'].includes(p.get('view')) ? p.get('view') : 'all';
  document.querySelectorAll('#cmp-filter [data-view]').forEach(b=>{
    b.classList.toggle('on',b.dataset.view===view);
    b.onclick=()=>{view=b.dataset.view;
      document.querySelectorAll('#cmp-filter [data-view]').forEach(x=>x.classList.toggle('on',x===b)); render();};
  });
  $('#copycmp').onclick=()=>{const url=new URL(location);if(defaultA&&($('#selA').value!==defaultA||$('#selB').value!==defaultB))url.pathname=url.pathname.replace(/compare--[^/]+\.html$/,'compare.html');Experience.copy(url.href,$('#compare-status'));};
  function selected(){const a=$('#selA').value,b=$('#selB').value;if(!a||!b)return {tasks:[]};return {version:D.evidence.version,asof:D.evidence.asof,a,b,view,tasks:D.cats.flatMap(c=>c.tids).filter(t=>includeTask(t,D.data[a].t[t]??null,D.data[b].t[t]??null)).map(t=>({task:t,a:D.evidence.models[a].cells[t]||null,b:D.evidence.models[b].cells[t]||null}))};}
  $('#compare-json').onclick=()=>Experience.download('comparison.json',JSON.stringify(selected(),null,2),'application/json');
  $('#compare-csv').onclick=()=>{const s=selected();Experience.download('comparison.csv',Experience.csv([['version','model_a','model_b','task','score_a','score_b','runs_a','runs_b','receipt_a','receipt_b'],...s.tasks.map(t=>[s.version,s.a,s.b,t.task,t.a?.score,t.b?.score,t.a?.n,t.b?.n,t.a?.receipt,t.b?.receipt])]),'text/csv;charset=utf-8');};
  $('#swap').onclick = () => { const t=$('#selA').value;
    $('#selA').value=$('#selB').value; $('#selB').value=t; render(); };
  render();
})();
</script>
</body></html>
